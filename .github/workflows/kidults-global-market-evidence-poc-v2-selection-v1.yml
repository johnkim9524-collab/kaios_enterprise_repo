name: KIDULTS Global Market Evidence PoC v2 Selection v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/global-market-evidence-poc-v2-selection-contract-v1.json'
      - 'scripts/kidults/poc/build-poc-v2-challenger-demand-v1.mjs'
      - 'scripts/kidults/poc/validate-poc-v2-challenger-demand-v1.mjs'
      - '.github/workflows/kidults-global-market-evidence-poc-v2-selection-v1.yml'
permissions:
  contents: read
jobs:
  compile-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile canonical Scope v1.2 working set
        run: node scripts/kidults/scope/compile-scope-evolution-watches-v1.2.mjs coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json coordination/kidults/scope-data/scope-poc-anchor-selection-v1.json coordination/kidults/scope-data/scope-evolution-watches-v1.2.json tmp/scope-v1.2
      - name: Compile 160 challenger stress slots
        run: node scripts/kidults/poc/build-poc-v2-challenger-demand-v1.mjs tmp/scope-v1.2/collection-scope-data-requirement-matrix-v1.2.json tmp/poc-v2-challenger-demand-v1.json
      - name: Validate challenger demand
        run: node scripts/kidults/poc/validate-poc-v2-challenger-demand-v1.mjs tmp/poc-v2-challenger-demand-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-poc-v2-320-selection-demand-v1
          path: tmp/poc-v2-challenger-demand-v1.json
