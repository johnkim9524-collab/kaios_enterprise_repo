# Branch-only recovery; never merge this workflow override into main.
# #2576 remains unchanged. GitHub's Environment, not a comment, gates the writer.
name: KIDULTS GitHub Protected Recovery 2576
run-name: 'KIDULTS Owner Pinned Bootstrap PR #2576 @ 286d5bbd86f4b8a515f92a134417841be5bdcebd'
on:
  workflow_dispatch:
    inputs:
      expected_launcher_sha:
        description: Exact reviewed recovery workflow commit; not the PR head
        required: true
        type: string
permissions: {}
concurrency:
  group: github-protected-recovery-2576-286d5bbd86f4
  cancel-in-progress: false
jobs:
  read-only-verification:
    name: Read-only verification for PR 2576
    if: >-
      github.repository == 'johnkim9524-collab/kaios_enterprise_repo' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/bootstrap/preflight-2576-286d5bbd86f4' &&
      github.actor == github.repository_owner && github.run_attempt == 1 &&
      github.sha == inputs.expected_launcher_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      preflight_artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Checkout exact recovery workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: launcher
          persist-credentials: false
      - name: Checkout approved PR only as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 286d5bbd86f4b8a515f92a134417841be5bdcebd
          path: source
          persist-credentials: false
      - name: Checkout protected-base validation libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f816cd23948f4a95ad91614a5dd56c5eeb40580b
          path: trusted
          persist-credentials: false
      - name: Set up existing pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false
      - name: Test only the new GitHub Environment boundary
        working-directory: launcher
        run: node --test --test-name-pattern="GitHub protected" scripts/kidults/kpmo/owner-pinned-bootstrap-2576.test.mjs
      - name: Read existing CI and exact source evidence without any write authority
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
          BOOTSTRAP_OUTPUT: ${{ github.workspace }}/out/bootstrap2576
          EXPECTED_LAUNCHER_SHA: ${{ inputs.expected_launcher_sha }}
        run: node ../launcher/scripts/kidults/kpmo/owner-pinned-preflight-bootstrap-2576.mjs preflight
      - name: Preserve same-run read-only preflight evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: github-protected-preflight-2576-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/bootstrap2576/preflight.json
          if-no-files-found: error
          retention-days: 90
      - name: Explain the native approval boundary
        run: |
          printf '%s\n' '## PR #2576: native Owner approval required' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Read-only verification is complete. The next job cannot start until GitHub records Owner approval for KIDULTS-OWNER-RECOVERY-2576. This is a repository recovery, not a production deployment.' >> "$GITHUB_STEP_SUMMARY"

  github-approved-recovery:
    name: GitHub Owner approval and bounded recovery for PR 2576
    needs: read-only-verification
    if: >-
      needs.read-only-verification.result == 'success' &&
      github.repository == 'johnkim9524-collab/kaios_enterprise_repo' &&
      github.ref == 'refs/heads/bootstrap/preflight-2576-286d5bbd86f4' &&
      github.actor == github.repository_owner && github.run_attempt == 1 &&
      github.sha == inputs.expected_launcher_sha
    environment:
      name: KIDULTS-OWNER-RECOVERY-2576
      url: https://github.com/johnkim9524-collab/kaios_enterprise_repo/pull/2576
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout exact approved recovery workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: launcher
          persist-credentials: false
      - name: Checkout fixed target as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 286d5bbd86f4b8a515f92a134417841be5bdcebd
          path: source
          persist-credentials: false
      - name: Checkout protected-base validators only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f816cd23948f4a95ad91614a5dd56c5eeb40580b
          path: trusted
          persist-credentials: false
      - name: Set up existing pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false
      - name: Consume immutable artifact from the read-only job of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.read-only-verification.outputs.preflight_artifact_id }}
          merge-multiple: true
          path: out/bootstrap2576
      - name: Revalidate native GitHub approval before any target status write
        id: recovery
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
          BOOTSTRAP_OUTPUT: ${{ github.workspace }}/out/bootstrap2576
          EXPECTED_LAUNCHER_SHA: ${{ inputs.expected_launcher_sha }}
          PREFLIGHT_ARTIFACT_ID: ${{ needs.read-only-verification.outputs.preflight_artifact_id }}
        run: node ../launcher/scripts/kidults/kpmo/owner-pinned-preflight-bootstrap-2576.mjs authorize
      - name: Revoke only this unconsumed window when cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='out/bootstrap2576/authorize.json';
          if (!fs.existsSync(file)) process.exit(0);
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          const head='286d5bbd86f4b8a515f92a134417841be5bdcebd';
          const root='https://api.github.com/repos/johnkim9524-collab/kaios_enterprise_repo';
          const target=`https://github.com/johnkim9524-collab/kaios_enterprise_repo/actions/runs/${process.env.GITHUB_RUN_ID}`;
          if (r.state!=='NATIVE_OWNER_APPROVED_WINDOW_OPEN' || r.source_sha!==head || r.native_run_id!==Number(process.env.GITHUB_RUN_ID) || r.native_environment_review?.state!=='approved') process.exit(0);
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          const pr=await fetch(root+'/pulls/2576',{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
          if (!pr.ok) throw new Error('CANCELLATION_PR_READ_FAILED');
          const value=await pr.json(); if (value.merged===true || value.head?.sha!==head) process.exit(0);
          const status=await fetch(root+`/commits/${head}/status`,{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
          if (!status.ok) throw new Error('CANCELLATION_STATUS_READ_FAILED');
          const current=(await status.json()).statuses.find(x=>x.context==='KIDULTS Governed Landing Authorization V1');
          if (current?.target_url!==target || current.state!=='success') process.exit(0);
          const revoked=await fetch(root+`/statuses/${head}`,{method:'POST',headers,redirect:'error',signal:AbortSignal.timeout(15000),body:JSON.stringify({state:'pending',context:'KIDULTS Governed Landing Authorization V1',description:'GitHub-approved recovery cancelled before merge',target_url:target})});
          if (!revoked.ok) throw new Error('CANCELLATION_REVOCATION_FAILED');
          console.log('UNCONSUMED_CURRENT_WINDOW_REVOKED');
          NODE
      - name: Preserve native approval and bounded recovery outcome
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: github-protected-recovery-2576-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/bootstrap2576
          if-no-files-found: error
          retention-days: 90
