name: KIDULTS Mission Control Validate

on:
  pull_request:
    paths:
      - 'coordination/kidults/registry/milestone/**'
      - 'coordination/kidults/registry/mission/**'
      - 'coordination/kidults/registry/work-queue/**'
      - 'coordination/kidults/registry/blocker/**'
      - 'coordination/kidults/registry/digital-twin/**'
      - 'coordination/kidults/registry/projection/**'
      - 'coordination/kidults/registry/catalog.json'
      - 'scripts/kidults/projection/build-agci-os-projection.mjs'
      - 'scripts/kidults/mission-control/**'
      - '.github/workflows/kidults-mission-control-validate.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/registry/milestone/**'
      - 'coordination/kidults/registry/mission/**'
      - 'coordination/kidults/registry/work-queue/**'
      - 'coordination/kidults/registry/blocker/**'
      - 'coordination/kidults/registry/digital-twin/**'
      - 'coordination/kidults/registry/projection/**'
      - 'coordination/kidults/registry/catalog.json'
      - 'scripts/kidults/projection/build-agci-os-projection.mjs'
      - 'scripts/kidults/mission-control/**'
      - '.github/workflows/kidults-mission-control-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'

      - name: Validate operational registry
        run: node scripts/kidults/registry/validate-operational-registry.mjs

      - name: Build current-state projection
        run: node scripts/kidults/mission-control/build-current-state.mjs

      - name: Validate mission control and digital twin
        run: node scripts/kidults/mission-control/validate-mission-control.mjs
