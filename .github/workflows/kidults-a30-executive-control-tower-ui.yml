name: Kidults A30 Executive Control Tower UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/kidults-autonomous-intelligence/src/control-tower-ui/**'
      - 'services/kidults-autonomous-intelligence/src/worker.ts'
      - 'services/kidults-autonomous-intelligence/scripts/a30-executive-control-tower-ui.mjs'
      - 'services/kidults-autonomous-intelligence/package.json'
      - '.github/workflows/kidults-a30-executive-control-tower-ui.yml'

concurrency:
  group: kidults-a30-executive-control-tower-ui
  cancel-in-progress: false

jobs:
  a30-executive-control-tower-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm install

      - name: Verify A30 package scripts exist
        working-directory: services/kidults-autonomous-intelligence
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            const required = ['a30:ui', 'a30:certify', 'a30:finalize'];
            const missing = required.filter(s => !pkg.scripts[s]);
            if (missing.length) { console.error('MISSING SCRIPTS:', missing.join(', ')); process.exit(1); }
            console.log('A30 scripts present:', required.join(', '));
          "

      - name: Typecheck
        working-directory: services/kidults-autonomous-intelligence
        run: npm run typecheck

      - name: Run A30 UI certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a30:ui

      - name: Run A30 certify
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a30:certify

      - name: List package scripts
        working-directory: services/kidults-autonomous-intelligence
        run: npm run

      - name: Upload A30 certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: a30-control-tower-ui-evidence
          path: services/kidults-autonomous-intelligence/reports/control-tower-ui/
          retention-days: 30
          if-no-files-found: error
