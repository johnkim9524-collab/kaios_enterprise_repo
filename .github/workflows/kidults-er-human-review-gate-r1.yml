name: KIDULTS ER Human Review Gate R1

on:
  pull_request:
    paths:
      - 'coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json'
      - 'coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json'
      - 'coordination/kidults/entity-resolution/human-review-gate-operational-contract-r1.json'
      - 'scripts/kidults/entity-resolution/er-human-review-gate-r1-lib.mjs'
      - 'scripts/kidults/entity-resolution/generate-er-human-review-preflight-r1.mjs'
      - 'scripts/kidults/entity-resolution/validate-er-human-review-gate-r1.mjs'
      - 'scripts/kidults/entity-resolution/verify-er-holdout-commitment-r1.mjs'
      - 'tests/kidults/entity-resolution/er-human-review-gate-r1.test.mjs'
      - '.github/workflows/kidults-er-human-review-gate-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Reconfirm #610 allocation boundary
        run: node scripts/kidults/entity-resolution/validate-empirical-validation-sampling-plan-r1.mjs
      - name: Reconfirm #612 independent-review boundary
        run: node scripts/kidults/entity-resolution/validate-independent-label-review-packet-contract-r1.mjs
      - name: Test deterministic packets, holdout commitment and human completion gate
        run: node --test tests/kidults/entity-resolution/er-human-review-gate-r1.test.mjs
