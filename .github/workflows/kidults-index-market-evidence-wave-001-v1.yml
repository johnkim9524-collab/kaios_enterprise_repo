name: KIDULTS Index Market Evidence Wave 001 v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/index/market-evidence-provider-rights-matrix-v1.json'
      - 'coordination/kidults/index/index-market-observation-contract-v1.json'
      - 'coordination/kidults/index/provider-authorization-action-queue-v1.json'
      - 'scripts/kidults/index/validate-market-evidence-wave-001-v1.mjs'
      - '.github/workflows/kidults-index-market-evidence-wave-001-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-market-evidence-wave:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validate rights matrix, market contract and external authorization queue
        run: node scripts/kidults/index/validate-market-evidence-wave-001-v1.mjs
