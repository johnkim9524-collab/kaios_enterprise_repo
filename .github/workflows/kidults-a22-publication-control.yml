name: kidults-a22-publication-control
on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-a22-publication-control.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run a22:certify
      - name: Upload A22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-a22-publication-control-evidence
          path: services/kidults-autonomous-intelligence/reports/publication-control/*.json
          if-no-files-found: error
