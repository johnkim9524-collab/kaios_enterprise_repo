name: kidults-a22-publication-control
on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-a22-publication-control.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install
      - run: npm run a22:certify
      - name: Upload A22 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-a22-publication-control-evidence
          path: services/kidults-autonomous-intelligence/reports/publication-control/*.json
          if-no-files-found: error
