name: KIDULTS Cloudflare Credential Identity Preflight V1

# v1 dispatch slot was used by run 33478469222. No event may start this historical lane.
on: []

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-credential-identity-preflight-v1-consumed
  cancel-in-progress: false

jobs:
  verify-credential-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create preauthorization-failure tombstone
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-credential-identity-preflight-v1-consumed"
          RECEIPT="$ROOT/receipt.json"
          mkdir -p "$ROOT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              id:"kidults-cloudflare-credential-identity-preflight-v1-consumed-tombstone-v1",
              approval_id:"CF-CREDENTIAL-IDENTITY-PREFLIGHT-20260901-01",
              state:"DISPATCH_SLOT_USED_PREAUTHORIZATION_SERIALIZATION_FAIL",
              root_cause:"APPROVAL_BODY_JQ_RAW_OUTPUT_ADDS_SECOND_TERMINAL_LF",
              historical_run_id:33478469222,
              historical_job_id:99762628587,
              historical_source_sha:"4946a888f07d82d273fcc2b27c3408ad51181541",
              historical_terminal_artifact_id:9789017392,
              historical_terminal_artifact_digest:"sha256:98a76cea4abbaead3b2e3a6b2f85b8808b2438a7f945765dd5ffcbbb5d25567b",
              repository:$repository,
              source_ref:$source_ref,
              source_sha:$source_sha,
              tombstone_run_id:$run_id,
              tombstone_run_attempt:$run_attempt,
              workflow_dispatch_slot_used:true,
              authorization_consumed:false,
              operational_reuse_allowed:false,
              executable_authority:false,
              environment_bound:false,
              secret_references_present:false,
              provider_process_invoked:false,
              external_read_request_count:0,
              worker_mutation_count:0,
              pages_mutation_count:0,
              route_mutation_count:0,
              domain_mutation_count:0,
              secret_values_logged:false,
              secret_values_persisted:false,
              raw_provider_responses_uploaded:false,
              replay_authorized:false,
              rerun_authorized:false,
              second_dispatch_authorized:false,
              promotable:false,
              empirical_provider_success:false,
              public:"HOLD",
              production:"HOLD",
              g5:"HOLD"
            }' > "$RECEIPT"
          jq -e '
            .workflow_dispatch_slot_used==true
            and .authorization_consumed==false
            and .operational_reuse_allowed==false
            and .executable_authority==false
            and .external_read_request_count==0
            and .replay_authorized==false' "$RECEIPT" >/dev/null

      - name: Upload historical-lane tombstone
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-cloudflare-credential-identity-preflight-v1-consumed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-cloudflare-credential-identity-preflight-v1-consumed/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce no replay
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'PREFLIGHT_V1_DISPATCH_SLOT_USED_ZERO_EXECUTABLE_AUTHORITY_NO_REPLAY'
          exit 78
