name: KIDULTS Cloudflare Credential Identity Preflight V1

# The sole v1 dispatch was terminally fail-closed before authorization
# consumption or any Cloudflare request. The impossible branch filter prevents
# GitHub from creating a failure run on protected-main pushes; the false guard
# is defense in depth if that branch name is ever created.
on:
  push:
    branches:
      - '__exhausted-cloudflare-credential-v1-never-execute__'

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-credential-identity-preflight-v1-consumed
  cancel-in-progress: false

jobs:
  verify-credential-identity:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create preauthorization-failure tombstone
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-credential-identity-preflight-v1-tombstone"
          RECEIPT="$ROOT/receipt.json"
          mkdir -p "$ROOT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              id:"kidults-cloudflare-credential-identity-preflight-v1-tombstone",
              version:"1.0.0",
              approval_id:"CF-CREDENTIAL-IDENTITY-PREFLIGHT-20260901-01",
              state:"PREAUTHORIZATION_FAILED_NOT_CONSUMED_V1_LANE_EXHAUSTED",
              repository:$repository,
              source_ref:$source_ref,
              source_sha:$source_sha,
              tombstone_run_id:$run_id,
              tombstone_run_attempt:$run_attempt,
              historical_workflow_run_id:33478469222,
              historical_job_id:99762628587,
              historical_source_sha:"4946a888f07d82d273fcc2b27c3408ad51181541",
              historical_failure_code:"APPROVAL_BODY_JQ_RAW_OUTPUT_ADDS_SECOND_TERMINAL_LF",
              historical_authorization_consumed:false,
              historical_external_read_request_count:0,
              historical_secret_probe_step:"SKIPPED",
              historical_cloudflare_request_count:0,
              historical_worker_pages_route_domain_mutation_count:0,
              historical_artifact_id:9789017392,
              historical_artifact_digest:"sha256:98a76cea4abbaead3b2e3a6b2f85b8808b2438a7f945765dd5ffcbbb5d25567b",
              executable_authority:false,
              environment_bound:false,
              credential_resolution_authorized:false,
              provider_read_authorized:false,
              approval_reusable:false,
              rerun_authorized:false,
              replay_authorized:false,
              second_dispatch_authorized:false,
              replacement_rule:"NEW_VERSIONED_WORKFLOW_AND_NEW_EXPLICIT_PROGRAM_OWNER_APPROVAL",
              worker_mutation_count:0,
              pages_mutation_count:0,
              route_mutation_count:0,
              domain_mutation_count:0,
              public:"HOLD",
              production:"HOLD",
              g5:"HOLD"
            }' > "$RECEIPT"
          jq -e '
            .executable_authority==false
            and .credential_resolution_authorized==false
            and .provider_read_authorized==false
            and .approval_reusable==false
            and .rerun_authorized==false
            and .replay_authorized==false
            and .second_dispatch_authorized==false' \
            "$RECEIPT" >/dev/null

      - name: Upload preauthorization-failure tombstone
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-cloudflare-credential-identity-preflight-v1-tombstone-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-cloudflare-credential-identity-preflight-v1-tombstone/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce no replay
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'PREAUTHORIZATION_FAILED_V1_LANE_EXHAUSTED_ZERO_EXECUTABLE_AUTHORITY'
          exit 78
