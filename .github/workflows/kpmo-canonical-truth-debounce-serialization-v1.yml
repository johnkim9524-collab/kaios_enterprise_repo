name: KPMO Canonical Truth Debounce Serialization V1
on:
  pull_request:
    paths:
      - '.github/workflows/kpmo-live-canonical-issue-truth-v1.yml'
      - '.github/workflows/kidults-platform-continuous-assurance-v1.yml'
      - 'scripts/kidults/kpmo/validate-canonical-truth-debounce-serialization-v1.mjs'
      - '.github/workflows/kpmo-canonical-truth-debounce-serialization-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-live-canonical-issue-truth-v1.yml'
      - '.github/workflows/kidults-platform-continuous-assurance-v1.yml'
      - 'scripts/kidults/kpmo/validate-canonical-truth-debounce-serialization-v1.mjs'
      - '.github/workflows/kpmo-canonical-truth-debounce-serialization-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: node scripts/kidults/kpmo/validate-canonical-truth-debounce-serialization-v1.mjs
