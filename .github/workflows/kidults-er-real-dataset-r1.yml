name: KIDULTS ER Real Dataset R1

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs'
      - '.github/workflows/kidults-er-real-dataset-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-real-world-increment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble real-world rights-backed ER increment
        run: node scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs /tmp/er-real-world-increment-r1.json
      - name: Verify truth boundary and evidence coverage
        run: |
          node - <<'NODE'
          const x=require('/tmp/er-real-world-increment-r1.json');
          if (x.synthetic !== false) process.exit(1);
          if (x.dataset_class !== 'REAL_WORLD_LABELED_INCREMENT') process.exit(1);
          if (x.case_count < 2) process.exit(1);
          if (x.coverage.provenance_coverage !== 1 || x.coverage.rights_coverage !== 1) process.exit(1);
          if (x.promotion.eligible !== false) process.exit(1);
          console.log('Real-world ER dataset increment PASS; full #479 promotion correctly blocked.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-er-real-world-increment-r1
          path: /tmp/er-real-world-increment-r1.json
          if-no-files-found: error
          retention-days: 30
