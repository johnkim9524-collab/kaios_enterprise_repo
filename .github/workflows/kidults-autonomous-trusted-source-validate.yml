name: KIDULTS Autonomous Trusted Source Validate

on:
  push:
    branches:
      - "feat/kidults-phase2-content-data-provider-foundation"
    paths:
      - "coordination/kidults/registry/trusted-source/**"
      - "coordination/kidults/registry/catalog.json"
      - "coordination/kidults/methodology/**"
      - "coordination/kidults/golden-dataset/**"
      - "coordination/kidults/autonomous/source-discovery/**"
      - "coordination/kidults/schemas/trusted-source-vertical-set.schema.json"
      - "scripts/kidults/autonomous/validate-trusted-source-foundation.mjs"
      - ".github/workflows/kidults-autonomous-trusted-source-validate.yml"
  pull_request:
    paths:
      - "coordination/kidults/registry/trusted-source/**"
      - "coordination/kidults/registry/catalog.json"
      - "coordination/kidults/methodology/**"
      - "coordination/kidults/golden-dataset/**"
      - "coordination/kidults/autonomous/source-discovery/**"
      - "coordination/kidults/schemas/trusted-source-vertical-set.schema.json"
      - "scripts/kidults/autonomous/validate-trusted-source-foundation.mjs"
      - ".github/workflows/kidults-autonomous-trusted-source-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check scripts/kidults/autonomous/validate-trusted-source-foundation.mjs

      - name: Validate Trusted Source Foundation
        run: |
          node scripts/kidults/autonomous/validate-trusted-source-foundation.mjs
          node scripts/kidults/registry/validate-operational-registry.mjs
