name: KIDULTS DigitalOcean STAGING Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    environment: kidults-do-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Verify exact STAGING Droplet identity read-only
        env:
          DIGITALOCEAN_READ_TOKEN: ${{ secrets.DIGITALOCEAN_READ_TOKEN }}
          DIGITALOCEAN_STAGING_DROPLET_ID: ${{ vars.DIGITALOCEAN_STAGING_DROPLET_ID }}
          KIDULTS_STAGING_PUBLIC_IP: ${{ vars.KIDULTS_STAGING_PUBLIC_IP }}
          KIDULTS_STAGING_PRIVATE_IP: ${{ vars.KIDULTS_STAGING_PRIVATE_IP }}
          KIDULTS_STAGING_AUDIT_OUTPUT: artifacts/digitalocean-staging-readonly-audit
        run: python scripts/operations/digitalocean_staging_readonly_audit.py
      - name: Assert no mutation or Production touch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/digitalocean-staging-readonly-audit/digitalocean-staging-readonly-audit.json').read_text())
          assert report['result'] == 'PASS'
          assert report['mode'] == 'READ_ONLY'
          assert report['mutation_performed'] is False
          assert report['bootstrap_performed'] is False
          assert report['production_resource_touched'] is False
          assert report['production'] == 'HOLD'
          print('DIGITALOCEAN_STAGING_READ_ONLY_BINDING_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kidults-digitalocean-staging-readonly-audit
          path: artifacts/digitalocean-staging-readonly-audit
          retention-days: 30
