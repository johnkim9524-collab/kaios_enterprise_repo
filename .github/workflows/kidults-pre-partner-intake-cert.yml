name: KIDULTS Pre-Partner Intake Certification

on:
  pull_request:
    paths:
      - 'coordination/kidults/audit/**'
      - 'coordination/kidults/projection-dry-run/**'
      - 'scripts/kidults/audit/certify-pre-partner-intake-gate-v1.mjs'
      - 'scripts/kidults/audit/validate-unified-audit-control-plane-v1.mjs'
      - 'scripts/kidults/audit/validate-pre-partner-adversarial-fixtures-v1.mjs'
      - 'scripts/kidults/projection/validate-projection-dry-run-v1.mjs'
      - '.github/workflows/kidults-pre-partner-intake-cert.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/audit/**'
      - 'coordination/kidults/projection-dry-run/**'
      - 'scripts/kidults/audit/certify-pre-partner-intake-gate-v1.mjs'
      - 'scripts/kidults/audit/validate-unified-audit-control-plane-v1.mjs'
      - 'scripts/kidults/audit/validate-pre-partner-adversarial-fixtures-v1.mjs'
      - 'scripts/kidults/projection/validate-projection-dry-run-v1.mjs'
      - '.github/workflows/kidults-pre-partner-intake-cert.yml'

permissions:
  contents: read

jobs:
  certify:
    name: Pre-Partner Intake Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Certify all 12 internal pre-intake control families
        run: node scripts/kidults/audit/certify-pre-partner-intake-gate-v1.mjs
