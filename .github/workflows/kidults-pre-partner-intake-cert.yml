name: KIDULTS Pre-Partner Intake Certification

on:
  pull_request:
    paths:
      - 'coordination/kidults/audit/**'
      - 'coordination/kidults/projection-dry-run/**'
      - 'scripts/kidults/audit/certify-pre-partner-intake-gate-v1.mjs'
      - 'scripts/kidults/audit/validate-unified-audit-control-plane-v1.mjs'
      - 'scripts/kidults/audit/validate-pre-partner-adversarial-fixtures-v1.mjs'
      - 'scripts/kidults/kpmo/validate-pre-partner-intake-workflow-provenance-v1.mjs'
      - 'scripts/kidults/projection/validate-projection-dry-run-v1.mjs'
      - '.github/workflows/kidults-pre-partner-intake-cert.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/audit/**'
      - 'coordination/kidults/projection-dry-run/**'
      - 'scripts/kidults/audit/certify-pre-partner-intake-gate-v1.mjs'
      - 'scripts/kidults/audit/validate-unified-audit-control-plane-v1.mjs'
      - 'scripts/kidults/audit/validate-pre-partner-adversarial-fixtures-v1.mjs'
      - 'scripts/kidults/kpmo/validate-pre-partner-intake-workflow-provenance-v1.mjs'
      - 'scripts/kidults/projection/validate-projection-dry-run-v1.mjs'
      - '.github/workflows/kidults-pre-partner-intake-cert.yml'

permissions:
  contents: read

jobs:
  certify:
    name: Pre-Partner Intake Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate certification workflow provenance
        run: node scripts/kidults/kpmo/validate-pre-partner-intake-workflow-provenance-v1.mjs
      - name: Certify all 12 internal pre-intake control families
        run: node scripts/kidults/audit/certify-pre-partner-intake-gate-v1.mjs
