name: KIDULTS Private Market Evidence Reacquisition Preflight R1
on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/private-market-evidence-reacquisition-preflight-r1.json'
      - 'scripts/kidults/source-intelligence/validate-private-market-evidence-reacquisition-preflight-r1.mjs'
      - '.github/workflows/kidults-private-market-evidence-reacquisition-preflight-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-structure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate fail-closed private reacquisition control shape
        run: node scripts/kidults/source-intelligence/validate-private-market-evidence-reacquisition-preflight-r1.mjs
