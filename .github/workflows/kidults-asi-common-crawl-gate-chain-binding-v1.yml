name: KIDULTS ASI Common Crawl Gate Chain Binding v1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['KIDULTS ASI Global Any-Site Discovery v2']
    branches: [main]
    types: [completed]
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/merge-asi-common-crawl-into-any-site-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-any-site-gate-binding-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-gate1-safe-candidate-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-gate1-safe-candidate-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-gate2-independent-reverification-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-gate2-independent-reverification-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-gate3-admission-runtime-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-gate3-admission-runtime-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-gate-chain-provenance-v1.mjs'
      - 'scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs'
      - 'tests/kidults/source-intelligence/asi-exact-generation-orchestration-v1.test.mjs'
      - 'tests/kidults/source-intelligence/asi-common-crawl-seed-frontier-rebase-v1.test.mjs'
      - '.github/workflows/kidults-asi-common-crawl-gate-chain-binding-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  common-crawl-gate-chain-binding:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source, provenance guard and syntax
        env:
          EXPECTED_EXECUTION_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_EXECUTION_SHA"
          node --check scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs
          node --check scripts/kidults/source-intelligence/merge-asi-common-crawl-into-any-site-discovery-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-any-site-gate-binding-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-gate-chain-provenance-v1.mjs
          node --check scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs --self-test
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-gate-chain-provenance-v1.mjs
          node --test tests/kidults/source-intelligence/asi-exact-generation-orchestration-v1.test.mjs
          node --test tests/kidults/source-intelligence/asi-common-crawl-seed-frontier-rebase-v1.test.mjs
      - name: Validate PR fixture orchestration without provider requests
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_GENERATION_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs \
            --mode pr-fixture \
            --receipt /tmp/asi-common-crawl-gate-chain-orchestration-v1.json \
            --consumer-id common-crawl-gate-chain-binding \
            --workflow-path .github/workflows/kidults-asi-global-open-market-discovery-v1.yml \
            --workflow-name 'KIDULTS ASI Global Any-Site Discovery v2' \
            --artifact-name kidults-asi-global-any-site-discovery-v2 \
            --branch "$EXPECTED_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-generation-sha "$EXPECTED_GENERATION_SHA" \
            --trigger-expected false \
            --fixture tests/kidults/source-intelligence/asi-common-crawl-seed-frontier-rebase-v1.test.mjs
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/asi-common-crawl-gate-chain-orchestration-v1.json"));if(r.state!=="VERIFIED_PASS_LOCAL_FIXTURE"||r.external_provider_requests!==0||r.writes!==0)throw new Error("PR_FIXTURE_RECEIPT_INVALID")'
      - name: Restore exact-generation Global Any-Site discovery evidence
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: main
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_GENERATION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TRIGGER_EXPECTED: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name || '' }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
            test -n "$UPSTREAM_RUN_ID"
            MAIN_SHA="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
            test "$MAIN_SHA" = "$EXPECTED_SHA"
          fi
          mkdir -p discovery-out /tmp/any-site-input
          node scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs \
            --mode live \
            --receipt /tmp/asi-common-crawl-gate-chain-orchestration-v1.json \
            --consumer-id common-crawl-gate-chain-binding \
            --workflow-path .github/workflows/kidults-asi-global-open-market-discovery-v1.yml \
            --workflow-name 'KIDULTS ASI Global Any-Site Discovery v2' \
            --artifact-name kidults-asi-global-any-site-discovery-v2 \
            --branch "$TARGET_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-generation-sha "$EXPECTED_GENERATION_SHA" \
            --expected-run-id "$UPSTREAM_RUN_ID" \
            --trigger-expected "$TRIGGER_EXPECTED" \
            --max-attempts 24 \
            --poll-milliseconds 10000
          RUN_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/asi-common-crawl-gate-chain-orchestration-v1.json")).selected_run_id')
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            test "$RUN_ID" = "$UPSTREAM_RUN_ID"
          fi
          ART_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/asi-common-crawl-gate-chain-orchestration-v1.json")).selected_artifact_id')
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" \
            > /tmp/any-site-input.zip
          unzip -q -o /tmp/any-site-input.zip -d /tmp/any-site-input
          mapfile -t FILES < <(find /tmp/any-site-input -type f -name global-low-risk-discovery.json -print)
          test "${#FILES[@]}" -eq 1
          cp "${FILES[0]}" discovery-out/global-low-risk-discovery.json
          node scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs discovery-out/global-low-risk-discovery.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/asi-common-crawl-gate-chain-orchestration-v1.json"));fs.writeFileSync("/tmp/any-site-provenance.json",JSON.stringify({producer_workflow:r.producer_workflow_path,producer_run_id:r.selected_run_id,producer_head_sha:r.expected_producer_sha,artifact_id:r.selected_artifact_id,artifact_digest:r.selected_artifact_digest,exact_generation:true},null,2)+"\n")'
          echo "global_discovery_run_id=$RUN_ID artifact_id=$ART_ID branch=$TARGET_BRANCH expected_sha=$EXPECTED_SHA exact_generation=true"
      - name: Expand bounded hosts through Common Crawl public index
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-common-crawl-host-expansion-v1.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs /tmp/asi-common-crawl-host-expansion-v1.json
      - name: Merge expansion into canonical Gate1 input
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/merge-asi-common-crawl-into-any-site-discovery-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-common-crawl-host-expansion-v1.json discovery-out/global-low-risk-discovery-common-crawl-v1.json
          node scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs discovery-out/global-low-risk-discovery-common-crawl-v1.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-any-site-gate-binding-v1.mjs discovery-out/global-low-risk-discovery-common-crawl-v1.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery-common-crawl-v1.json'));
          if(!(x.common_crawl_observed_candidate_count>0))throw new Error('NO_EMPIRICAL_COMMON_CRAWL_CANDIDATE');
          console.log(JSON.stringify({status:'PASS',index_id:x.common_crawl_index_id,observed:x.common_crawl_observed_candidate_count,new_candidates:x.common_crawl_new_candidate_count,merged:x.candidate_count,production:x.production}));
          NODE
      - name: Reject merged rights self-promotion mutation
        if: github.event_name != 'pull_request'
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery-common-crawl-v1.json'));const c=x.candidates.find(y=>y.discovery_provider==='COMMON_CRAWL_URL_INDEX_HOST_EXPANSION'||y.discovery_providers?.includes('COMMON_CRAWL_URL_INDEX_HOST_EXPANSION'));if(!c)process.exit(2);c.rights_state='ALLOW';fs.writeFileSync('/tmp/bad-common-crawl-rights.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-common-crawl-any-site-gate-binding-v1.mjs /tmp/bad-common-crawl-rights.json; then exit 1; fi
      - name: Reject merged host escape mutation
        if: github.event_name != 'pull_request'
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery-common-crawl-v1.json'));const c=x.candidates.find(y=>y.discovery_provider==='COMMON_CRAWL_URL_INDEX_HOST_EXPANSION');if(!c)process.exit(2);c.endpoint_url='https://example.org/escape';fs.writeFileSync('/tmp/bad-common-crawl-host.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-common-crawl-any-site-gate-binding-v1.mjs /tmp/bad-common-crawl-host.json; then exit 1; fi
      - name: Gate1 classify merged Any-Site ingress
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/build-asi-gate1-safe-candidate-pool-v1.mjs discovery-out/global-low-risk-discovery-common-crawl-v1.json /tmp/asi-gate1-safe-candidate-pool-v1.json
          node scripts/kidults/source-intelligence/validate-asi-gate1-safe-candidate-pool-v1.mjs /tmp/asi-gate1-safe-candidate-pool-v1.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/asi-gate1-safe-candidate-pool-v1.json'));
          const all=[...(x.safe_candidate_pool||[]),...(x.review_required_queue||[]),...(x.hard_block_queue||[])];
          const cc=all.filter(c=>c.discovery_provider==='COMMON_CRAWL_URL_INDEX_HOST_EXPANSION'||c.discovery_providers?.includes('COMMON_CRAWL_URL_INDEX_HOST_EXPANSION'));
          if(!cc.length)throw new Error('COMMON_CRAWL_NOT_BOUND_TO_GATE1');
          if(cc.some(c=>c.gate_1_state==='PASS'))throw new Error('COMMON_CRAWL_AUTO_SAFE_WITHOUT_RIGHTS');
          if(cc.some(c=>c.rights_state!=='UNASSESSED'||c.admission_state!=='NOT_ADMITTED'||c.acquisition_authorized!==false))throw new Error('COMMON_CRAWL_GATE1_PROMOTION');
          console.log(JSON.stringify({status:'PASS',common_crawl_gate1_candidates:cc.length,common_crawl_auto_safe:0,gate1_safe:x.safe_candidate_count,gate1_review:x.review_required_count,production:x.production}));
          NODE
      - name: Gate2 independently reverify Safe Candidate Pool
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/build-asi-gate2-independent-reverification-v1.mjs /tmp/asi-gate1-safe-candidate-pool-v1.json /tmp/asi-gate2-independent-reverification-v1.json
          node scripts/kidults/source-intelligence/validate-asi-gate2-independent-reverification-v1.mjs /tmp/asi-gate2-independent-reverification-v1.json
      - name: Gate3 admit metadata-only eligible subset
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/build-asi-gate3-admission-runtime-v1.mjs /tmp/asi-gate2-independent-reverification-v1.json /tmp/asi-gate3-admission-runtime-v1.json
          node scripts/kidults/source-intelligence/validate-asi-gate3-admission-runtime-v1.mjs /tmp/asi-gate3-admission-runtime-v1.json
      - name: Accumulate merged candidates without rights promotion
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs discovery-out/global-low-risk-discovery-common-crawl-v1.json /tmp/nonexistent-previous-pool.json /tmp/asi-proactive-source-pool-common-crawl-v1.json
          node scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs /tmp/asi-proactive-source-pool-common-crawl-v1.json
      - name: Emit governed binding receipt
        if: github.event_name != 'pull_request'
        run: |
          node - <<'NODE' >/tmp/asi-common-crawl-gate-chain-binding-receipt-v1.json
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery-common-crawl-v1.json'));const g1=JSON.parse(fs.readFileSync('/tmp/asi-gate1-safe-candidate-pool-v1.json'));const g2=JSON.parse(fs.readFileSync('/tmp/asi-gate2-independent-reverification-v1.json'));const g3=JSON.parse(fs.readFileSync('/tmp/asi-gate3-admission-runtime-v1.json'));const p=JSON.parse(fs.readFileSync('/tmp/asi-proactive-source-pool-common-crawl-v1.json'));const provenance=JSON.parse(fs.readFileSync('/tmp/any-site-provenance.json'));
          process.stdout.write(JSON.stringify({id:'kidults-asi-common-crawl-gate-chain-binding-receipt-v1',status:'SHADOW_COMMON_CRAWL_ANY_SITE_GATE_CHAIN_BOUND',upstream_global_discovery:provenance,common_crawl_index_id:d.common_crawl_index_id,common_crawl_seed_hosts:d.common_crawl_seed_host_count,common_crawl_observed_candidates:d.common_crawl_observed_candidate_count,common_crawl_new_candidates:d.common_crawl_new_candidate_count,merged_discovery_candidates:d.candidate_count,gate1_safe:g1.safe_candidate_count,gate1_review:g1.review_required_count,gate2_verified:g2.verified_for_gate3_count,gate3_metadata_admitted:g3.admitted_count,rolling_candidate_pool:p.candidate_count,content_acquisition_authorized:false,collection_right_created:false,public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/asi-common-crawl-gate-chain-binding-receipt-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: kidults-asi-common-crawl-gate-chain-binding-v1
          path: |
            /tmp/asi-common-crawl-host-expansion-v1.json
            discovery-out/global-low-risk-discovery-common-crawl-v1.json
            /tmp/asi-gate1-safe-candidate-pool-v1.json
            /tmp/asi-gate2-independent-reverification-v1.json
            /tmp/asi-gate3-admission-runtime-v1.json
            /tmp/asi-proactive-source-pool-common-crawl-v1.json
            /tmp/any-site-provenance.json
            /tmp/asi-common-crawl-gate-chain-binding-receipt-v1.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload bounded PR orchestration receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-common-crawl-gate-chain-pr-orchestration-v1
          path: /tmp/asi-common-crawl-gate-chain-orchestration-v1.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload bounded live orchestration receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-common-crawl-gate-chain-live-orchestration-v1
          path: /tmp/asi-common-crawl-gate-chain-orchestration-v1.json
          retention-days: 30
          if-no-files-found: error
