name: KIDULTS Portal Release-001 QA
on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/public/portal-r001/**'
      - 'apps/kidults-enterprise-staging/server.mjs'
      - '.github/workflows/kidults-portal-r001-release-qa.yml'
  workflow_dispatch:

jobs:
  portal-r001-browser-qa:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install browser QA
        run: |
          mkdir -p /tmp/kidults-r001-qa && cd /tmp/kidults-r001-qa
          npm init -y >/dev/null
          npm install --silent playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Start staging portal
        run: |
          mkdir -p /tmp/kidults-conversion-data
          printf 'portal-r001-qa-ci-nonproduction-secret' > /tmp/kidults-conversion-secret
          KAIOS_ENVIRONMENT=staging KAIOS_PRODUCTION_PROMOTION_AUTHORIZED=false \
          KIDULTS_CONVERSION_DATA_DIR=/tmp/kidults-conversion-data \
          KIDULTS_CONVERSION_HASH_SECRET_FILE=/tmp/kidults-conversion-secret \
          HOST=127.0.0.1 PORT=4173 node apps/kidults-enterprise-staging/server.mjs >/tmp/kidults-r001-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/kidults-r001-server.log && exit 1
      - name: Run final-platform matrix
        run: |
          cat > /tmp/kidults-r001-qa/run.mjs <<'NODE'
          import {chromium} from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs/promises';
          const base='http://127.0.0.1:4173/portal-r001/';
          const routes=['index.html','markets.html','vertical.html','objects.html','object.html','kidult-100.html','research.html','workspace.html','governance.html'];
          const widths=[320,375,390,430,768,1440];
          const states=['NO_PROJECTION','WAITING','STALE','INVALID','RIGHTS_BLOCKED','NOT_AVAILABLE'];
          const fixture=JSON.parse(await fs.readFile(process.env.GITHUB_WORKSPACE+'/apps/kidults-enterprise-staging/public/portal-r001/data/projection-control-fixture.json','utf8'));
          const failures=[],results=[],shotDir='/tmp/kidults-r001-qa/screenshots';
          await fs.mkdir(shotDir,{recursive:true});
          const blocked=state=>{const d=structuredClone(fixture);d.fixture_type='NON_PROMOTABLE_CONTROL';d.projection={...d.projection,state,projection_id:null,assessment_id:null,replay_id:null,exact_pair_digest:null,correlation_id:null,as_of:state==='STALE'?'2026-08-01T00:00:00Z':null,rights_state:state==='RIGHTS_BLOCKED'?'BLOCKED':'WAITING',freshness:state==='STALE'?'STALE':'NOT_AVAILABLE'};return d};
          const live=()=>{const d=structuredClone(fixture),pair='sha256:'+'a'.repeat(64),correlation='sha256:'+'c'.repeat(64),asOf=new Date(Date.now()-60000).toISOString();delete d.fixture_type;d.projection={state:'LIVE_APPROVED',projection_id:'qa-projection-001',assessment_id:'qa-assessment-001',replay_id:'qa-replay-001',exact_pair_digest:pair,correlation_id:correlation,production:false,public:false,promotable:true,synthetic:false,assessment_recommendation:'PUBLISHABLE_INTERNAL',overall_rankability:true,as_of:asOf,rights_state:'APPROVED',freshness:'CURRENT'};d.audit={projection_id:'qa-projection-001',assessment_id:'qa-assessment-001',replay_id:'qa-replay-001',exact_pair_digest:pair,correlation_id:correlation,rebuild_state:'PASS',replay_state:'PASS',rollback_state:'READY',reason_category:'QA_LIVE_APPROVED'};d.signals=[{signal_id:'scale',label:'Market Scale',value:'QA VALUE',state:'LIVE_APPROVED',as_of:asOf,confidence:'HIGH',evidence_refs:['e1']},{signal_id:'liquidity',label:'Liquidity',value:'QA VERIFIED',state:'LIVE_APPROVED',as_of:asOf,confidence:'HIGH',evidence_refs:['e2']}];d.kidult_100={state:'LIVE_APPROVED',index_value:1000,change:null,as_of:asOf,constituents:['qa-object-001'],methodology_version:'qa-method-v1'};d.research_archive={state:'LIVE_APPROVED',items:[{research_id:'r1',title:'QA Projection Research',snapshot_id:'s1',published_at:asOf,projection_id:'qa-projection-001'}]};d.evidence_methodology={coverage:'COMPLETE',independence:'VERIFIED',freshness:'CURRENT',rights:'APPROVED',methodology_version:'qa-method-v1',lineage_version:'qa-lineage-v1'};d.objects=[{object_id:'qa-object-001',title:'QA Reference Object',maker:'QA Maker',model:'QA Model',year:'1960',aliases:['QA Alias'],market_observations:['QA observation'],comparables:['QA comparable'],evidence_refs:['e1'],confidence:'HIGH',evidence_coverage:'COMPLETE',source_owner_independence:'VERIFIED',rights_state:'APPROVED',limitations:['QA only']}];return d};
          const browser=await chromium.launch({headless:true});
          const matrix=[];
          for(const state of states){for(const width of widths)matrix.push(['index.html',state,width]);for(const route of routes.slice(1))for(const width of [390,1440])matrix.push([route,state,width])}
          for(const [route,state,width] of matrix){
            const context=await browser.newContext({viewport:{width,height:width<500?900:1000},reducedMotion:'reduce'});
            await context.route('**/projection-control-fixture.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(blocked(state))}));
            const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))errors.push(m.text())});
            const response=await page.goto(base+route,{waitUntil:'networkidle'});
            if(!response?.ok())failures.push(`${route}:w${width}:${state}:HTTP_${response?.status()}`);
            const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21aa','wcag22aa']).analyze(),serious=axe.violations.filter(v=>['serious','critical'].includes(v.impact));
            const obs=await page.evaluate(()=>({state:document.documentElement.dataset.state,lang:document.documentElement.lang,main:document.querySelectorAll('main,[role="main"]').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,overflowing:[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.right>document.documentElement.clientWidth+2||r.left<-2}).slice(0,8).map(el=>`${el.tagName.toLowerCase()}.${el.className||''}`),fixture:document.querySelector('.control-bar')?.dataset.fixture,unlabeled:[...document.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!(el.textContent||'').trim()&&!el.getAttribute('aria-label')&&!el.getAttribute('title')&&!el.getAttribute('alt')&&!(el.id&&document.querySelector(`label[for="${CSS.escape(el.id)}"]`))).length,falseLive:(document.body.innerText||'').includes('GOVERNED VIEW READY')}));
            if(obs.state!==state||!obs.lang||!obs.main||obs.unlabeled||obs.fixture!=='NON_PROMOTABLE'||obs.falseLive)failures.push(`${route}:w${width}:${state}:SEMANTICS_${JSON.stringify(obs)}`);
            if(width<=430&&obs.overflow)failures.push(`${route}:w${width}:${state}:OVERFLOW_${obs.overflowing.join('|')}`);
            if(serious.length)failures.push(`${route}:w${width}:${state}:AXE_${serious.flatMap(v=>v.nodes.map(n=>`${v.id}:${n.target.join(' ')}`)).join('|')}`);if(errors.length)failures.push(`${route}:w${width}:${state}:RUNTIME_${errors.join('|')}`);
            if(route==='index.html'){const h=await page.locator('.hero-image').evaluate(img=>({ok:img.complete,w:img.naturalWidth,h:img.naturalHeight}));if(!h.ok||h.w<1800||h.h<800)failures.push(`HERO:w${width}:${JSON.stringify(h)}`)}
            if(route==='workspace.html'){const locked=await page.locator('.workspace-grid article').evaluateAll(n=>n.length===4&&n.every(x=>x.getAttribute('aria-disabled')==='true'));if(!locked)failures.push(`WORKSPACE:w${width}:${state}:UNLOCKED`)}
            if(width<=900){if(!await page.locator('.nav-toggle').isVisible())failures.push(`${route}:w${width}:NAV_HIDDEN`);else{await page.locator('.nav-toggle').click();if(!await page.locator('#primary-nav').isVisible())failures.push(`${route}:w${width}:NAV_CLOSED`);await page.keyboard.press('Escape')}}
            if(state==='NO_PROJECTION'&&(width===390||width===1440))await page.screenshot({path:`${shotDir}/${route.replace('.html','')}-w${width}.png`,fullPage:true});
            results.push({route,state,width,obs});await context.close();
          }
          for(const width of [390,1440]){
            const context=await browser.newContext({viewport:{width,height:width===390?900:1000}});await context.route('**/projection-control-fixture.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(live())}));
            for(const route of routes){const page=await context.newPage();await page.goto(base+route+(route==='object.html'?'?id=qa-object-001':''),{waitUntil:'networkidle'});const o=await page.evaluate(()=>({state:document.documentElement.dataset.state,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,projection:[...document.querySelectorAll('[data-projection-state]')].map(n=>n.textContent.trim()),object:document.querySelector('[data-object-title]')?.textContent.trim(),workspace:[...document.querySelectorAll('.workspace-grid article')].map(n=>n.getAttribute('aria-disabled')),k100:document.querySelector('[data-k100-state]')?.dataset.contentState,audit:document.querySelector('[data-audit-projection]')?.textContent.trim()}));if(o.state!=='LIVE_APPROVED'||o.projection.some(x=>x!=='LIVE_APPROVED')||(width<=430&&o.overflow))failures.push(`LIVE:${route}:w${width}:${JSON.stringify(o)}`);if(route==='object.html'&&o.object!=='QA Reference Object')failures.push(`LIVE:OBJECT:w${width}`);if(route==='workspace.html'&&(o.workspace.length!==4||o.workspace.some(x=>x!=='false')))failures.push(`LIVE:WORKSPACE:w${width}`);if(route==='kidult-100.html'&&o.k100!=='LIVE_APPROVED')failures.push(`LIVE:K100:w${width}`);if(route==='governance.html'&&o.audit!=='qa-projection-001')failures.push(`LIVE:AUDIT:w${width}`);results.push({route,state:'LIVE_APPROVED',width,obs:o});await page.close()}await context.close();
          }
          for(const [name,mutate] of [['MISSING_ID',d=>d.projection.projection_id=null],['MISSING_PAIR',d=>d.projection.exact_pair_digest=null],['PUBLIC',d=>d.projection.public=true],['PRODUCTION',d=>d.projection.production=true],['RIGHTS',d=>d.projection.rights_state='WAITING'],['STALE',d=>d.projection.freshness='STALE'],['NON_RANKABLE',d=>d.projection.overall_rankability=false],['AUDIT_MISMATCH',d=>d.audit.projection_id='wrong'],['SYNTHETIC',d=>d.projection.synthetic=true],['CONTROL',d=>d.fixture_type='NON_PROMOTABLE_CONTROL']]){const envelope=live();mutate(envelope);const context=await browser.newContext({viewport:{width:390,height:900}});await context.route('**/projection-control-fixture.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(envelope)}));const page=await context.newPage();await page.goto(base+'workspace.html',{waitUntil:'networkidle'});const o=await page.evaluate(()=>({state:document.documentElement.dataset.state,locked:[...document.querySelectorAll('.workspace-grid article')].every(n=>n.getAttribute('aria-disabled')==='true')}));if(o.state==='LIVE_APPROVED'||!o.locked)failures.push(`ADVERSARIAL:${name}:${JSON.stringify(o)}`);results.push({name,obs:o});await context.close()}
          await browser.close();
          const report={id:'kidults-portal-r001-final-platform-qa-v1',result:failures.length?'FAIL':'PASS',routes,widths,blocked_states:states,cases:results.length,failures,truth_boundary:{fixture:'NON_PROMOTABLE',production:'HOLD',public_intelligence:'HOLD',g5:'EXPLICIT_APPROVAL_REQUIRED'}};await fs.writeFile('/tmp/kidults-portal-r001-release-qa-v1.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(failures.length)process.exit(1);
          NODE
          cd /tmp/kidults-r001-qa && node run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kidults-portal-r001-release-qa-v1
          path: |
            /tmp/kidults-portal-r001-release-qa-v1.json
            /tmp/kidults-r001-server.log
            /tmp/kidults-r001-qa/screenshots
          retention-days: 30
