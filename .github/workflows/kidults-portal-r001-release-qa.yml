name: KIDULTS Portal Release-001 QA
on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/public/portal-r001/**'
      - 'apps/kidults-enterprise-staging/server.mjs'
      - '.github/workflows/kidults-portal-r001-release-qa.yml'
      - 'tooling/kidults-portal-r001-browser-qa/package.json'
      - 'tooling/kidults-portal-r001-browser-qa/package-lock.json'
      - 'scripts/kidults/kpmo/validate-portal-r001-browser-qa-supply-chain-v1.mjs'
      - 'scripts/kidults/kpmo/build-portal-r001-browser-qa-toolchain-receipt-v1.mjs'
      - 'scripts/kidults/portal/proof-product-test-fixtures-v1.mjs'
  workflow_dispatch:

jobs:
  portal-r001-browser-qa:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate browser QA workflow provenance
        run: node scripts/kidults/kpmo/validate-portal-r001-browser-qa-supply-chain-v1.mjs
      - name: Install isolated browser QA dependencies
        run: |
          mkdir -p /tmp/kidults-r001-qa
          cp tooling/kidults-portal-r001-browser-qa/package.json /tmp/kidults-r001-qa/package.json
          cp tooling/kidults-portal-r001-browser-qa/package-lock.json /tmp/kidults-r001-qa/package-lock.json
          npm ci --prefix /tmp/kidults-r001-qa --ignore-scripts --no-audit --no-fund
          node /tmp/kidults-r001-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Start staging portal
        shell: bash
        run: |
          mkdir -p /tmp/kidults-conversion-data
          printf 'portal-r001-qa-ci-nonproduction-secret' > /tmp/kidults-conversion-secret
          printf 'portal-r001-projection-capability-ci-secret-at-least-32-bytes' > /tmp/kidults-projection-secret
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {approvedProjectionFixture} from './scripts/kidults/portal/proof-product-test-fixtures-v1.mjs';
          const p=approvedProjectionFixture(), now=new Date();
          p.generated_at=new Date(now-120000).toISOString();p.updated_at=new Date(now-60000).toISOString();
          p.freshness.observed_at=new Date(now-120000).toISOString();p.freshness.valid_until=new Date(now.getTime()+3600000).toISOString();
          fs.writeFileSync('/tmp/kidults-approved-projection.json',JSON.stringify(p));
          NODE
          KAIOS_ENVIRONMENT=staging \
          KAIOS_PRODUCTION_PROMOTION_AUTHORIZED=false \
          KIDULTS_PUBLIC_DIR="$GITHUB_WORKSPACE/apps/kidults-enterprise-staging/public" \
          KIDULTS_CONVERSION_DATA_DIR=/tmp/kidults-conversion-data \
          KIDULTS_CONVERSION_HASH_SECRET_FILE=/tmp/kidults-conversion-secret \
          HOST=127.0.0.1 PORT=4173 \
          node apps/kidults-enterprise-staging/server.mjs >/tmp/kidults-r001-server.log 2>&1 &
          echo $! >/tmp/kidults-r001-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/health >/dev/null || { cat /tmp/kidults-r001-server.log; exit 1; }
          KAIOS_ENVIRONMENT=staging \
          KAIOS_PRODUCTION_PROMOTION_AUTHORIZED=false \
          KIDULTS_PUBLIC_DIR="$GITHUB_WORKSPACE/apps/kidults-enterprise-staging/public" \
          KIDULTS_CONVERSION_DATA_DIR=/tmp/kidults-conversion-data \
          KIDULTS_CONVERSION_HASH_SECRET_FILE=/tmp/kidults-conversion-secret \
          KIDULTS_APPROVED_PROJECTION_FILE=/tmp/kidults-approved-projection.json \
          KIDULTS_PROJECTION_CAPABILITY_SECRET_FILE=/tmp/kidults-projection-secret \
          HOST=127.0.0.1 PORT=4174 \
          node apps/kidults-enterprise-staging/server.mjs >/tmp/kidults-r001-positive-server.log 2>&1 &
          echo $! >/tmp/kidults-r001-positive-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4174/health >/dev/null || { cat /tmp/kidults-r001-positive-server.log; exit 1; }
      - name: Run Release-001 responsive accessibility resilience matrix
        shell: bash
        run: |
          cat > /tmp/kidults-r001-qa/run.mjs <<'NODE'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs/promises';

          const baseUrl='http://127.0.0.1:4173';
          const routes=['/portal-r001/index.html','/portal-r001/object.html'];
          const viewports=[320,375,390,430,768,1440].map(width=>({name:`w${width}`,width,height:width<500?900:1000}));
          const fixture=JSON.parse(await fs.readFile(process.env.GITHUB_WORKSPACE+'/apps/kidults-enterprise-staging/public/portal-r001/data/projection-control-fixture.json','utf8'));
          const {approvedProjectionFixture,stateOnlyProjectionFixture}=await import(process.env.GITHUB_WORKSPACE+'/scripts/kidults/portal/proof-product-test-fixtures-v1.mjs');
          const closedStates=['AWAITING_APPROVED_PROJECTION','ASSESSMENT_PENDING','RIGHTS_BLOCKED','STALE','SUPERSEDED','REVOKED'];
          const forgedControlFlags={fixture_type:'NON_PROMOTABLE_CONTROL',release:{state:'HOLD'},projection:{state:'NO_PROJECTION',synthetic:true,promotable:false,production:false,public:false}};
          const controlNearMisses=[
            ['CONTROL_FIXTURE_TYPE_DRIFT',data=>{data.fixture_type='PROMOTABLE'}],
            ['CONTROL_RELEASE_DRIFT',data=>{data.release.state='RELEASED'}],
            ['CONTROL_STATE_DRIFT',data=>{data.projection.state='WAITING'}],
            ['CONTROL_SYNTHETIC_DRIFT',data=>{data.projection.synthetic=false}],
            ['CONTROL_PROMOTABLE_DRIFT',data=>{data.projection.promotable=true}],
            ['CONTROL_PRODUCTION_DRIFT',data=>{data.projection.production=true}],
            ['CONTROL_PUBLIC_DRIFT',data=>{data.projection.public=true}]
          ];
          const stateCases=[
            {name:'CONTROL_NO_PROJECTION',expected:'NO_PROJECTION',fixtureTag:'NON_PROMOTABLE',input:()=>structuredClone(fixture)},
            ...closedStates.map(state=>({name:state,expected:'NO_PROJECTION',fixtureTag:null,input:()=>stateOnlyProjectionFixture(state)})),
            {name:'UNKNOWN_DISCRIMINATOR',expected:'INVALID',fixtureTag:null,input:()=>({record_type:'unknown',schema_version:'1.0.0',...structuredClone(forgedControlFlags)})},
            {name:'TYPO_CONTROL_DISCRIMINATOR',expected:'INVALID',fixtureTag:null,input:()=>({record_type:'kidults_non_promotable_control_projection_v2',schema_version:'1.0.0',...structuredClone(forgedControlFlags)})},
            {name:'CONTROL_SCHEMA_VERSION_DRIFT',expected:'INVALID',fixtureTag:null,input:()=>({record_type:'kidults_non_promotable_control_projection',schema_version:'2.0.0',...structuredClone(forgedControlFlags)})},
            ...controlNearMisses.map(([name,mutate])=>({name,expected:'INVALID',fixtureTag:null,input:()=>{const data=structuredClone(fixture);mutate(data);return data}}))
          ];
          const failures=[];
          const results=[];
          const adversarialCaseNames=[];
          const screenshotDir='/tmp/kidults-r001-qa/screenshots';
          await fs.mkdir(screenshotDir,{recursive:true});

          const browser=await chromium.launch({headless:true});
          for(const vp of viewports){
            for(const stateCase of stateCases){
              const caseName=stateCase.name;
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'});
              await context.route('**/api/v1/projection',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(stateCase.input())}));
              for(const route of routes){
                const page=await context.newPage();
                const runtimeErrors=[];
                page.on('pageerror',error=>runtimeErrors.push(`PAGEERROR_${error.message}`));
                page.on('console',message=>{if(message.type()==='error'&&!/favicon/i.test(message.text()))runtimeErrors.push(`CONSOLE_${message.text()}`)});
                const response=await page.goto(baseUrl+route,{waitUntil:'domcontentloaded'});
                if(!response?.ok()){
                  failures.push(`${route}:${vp.name}:${caseName}:HTTP_${response?.status()}`);
                  await page.close();
                  continue;
                }
                await page.waitForTimeout(50);
                const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']).analyze();
                const serious=axe.violations.filter(v=>['serious','critical'].includes(v.impact));
                const axeDetails=serious.flatMap(violation=>violation.nodes.map(node=>({id:violation.id,target:node.target,html:node.html})));
                if(serious.length) failures.push(`${route}:${vp.name}:${caseName}:AXE_${JSON.stringify(axeDetails)}`);
                const obs=await page.evaluate(()=>{
                  const html=document.documentElement;
                  const workspace=[...document.querySelectorAll('.workspace-grid article')];
                  const hero=document.querySelector('.hero-image');
                  const signIn=document.querySelector('.sign-in');
                  const visible=element=>Boolean(element&&getComputedStyle(element).display!=='none'&&getComputedStyle(element).visibility!=='hidden'&&element.getBoundingClientRect().width>0&&element.getBoundingClientRect().height>0);
                  return {
                    state:html.dataset.state||null,
                    lang:html.getAttribute('lang'),
                    mainCount:document.querySelectorAll('main,[role="main"]').length,
                    horizontalOverflow:html.scrollWidth>html.clientWidth+2,
                    workspaceCount:workspace.length,
                    workspaceAllBlocked:workspace.length===4&&workspace.every(x=>x.getAttribute('aria-disabled')==='true'),
                    signInEnabled:Boolean(signIn)&&signIn.getAttribute('aria-disabled')!=='true'&&!signIn.hasAttribute('disabled'),
                    hasLiveApprovedText:(document.body.innerText||'').includes('GOVERNED VIEW READY'),
                    fixtureTag:document.querySelector('.status-strip')?.getAttribute('data-fixture')||null,
                    verticalCount:document.querySelectorAll('[data-vertical-grid] .vertical-tile').length,
                    heroDecoded:Boolean(hero?.complete&&hero.naturalWidth>=1800&&hero.naturalHeight>=800),
                    heroDimensions:hero?`${hero.naturalWidth}x${hero.naturalHeight}`:null,
                    rightsVisible:visible(document.querySelector('[data-rights]')),
                    releaseVisible:visible(document.querySelector('[data-release-state]')),
                    navToggleVisible:visible(document.querySelector('.nav-toggle')),
                    unlabeledControls:[...document.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>{
                      const text=(el.textContent||'').trim();
                      const aria=el.getAttribute('aria-label')||el.getAttribute('aria-labelledby');
                      const title=el.getAttribute('title');
                      const alt=el.getAttribute('alt');
                      const label=el.id&&document.querySelector(`label[for="${CSS.escape(el.id)}"]`);
                      return !text&&!aria&&!title&&!alt&&!label;
                    }).length
                  };
                });
                if(obs.state!==stateCase.expected) failures.push(`${route}:${vp.name}:${caseName}:STATE_${obs.state}_EXPECTED_${stateCase.expected}`);
                if(!obs.lang) failures.push(`${route}:${vp.name}:${caseName}:HTML_LANG_MISSING`);
                if(obs.mainCount<1) failures.push(`${route}:${vp.name}:${caseName}:MAIN_LANDMARK_MISSING`);
                if(vp.width<=430&&obs.horizontalOverflow) failures.push(`${route}:${vp.name}:${caseName}:HORIZONTAL_OVERFLOW`);
                if(obs.unlabeledControls>0) failures.push(`${route}:${vp.name}:${caseName}:UNLABELED_CONTROLS_${obs.unlabeledControls}`);
                if(runtimeErrors.length) failures.push(`${route}:${vp.name}:${caseName}:RUNTIME_${runtimeErrors.join('|')}`);
                if(!obs.heroDecoded) failures.push(`${route}:${vp.name}:${caseName}:HERO_NOT_DECODED_${obs.heroDimensions}`);
                if(!obs.rightsVisible||!obs.releaseVisible) failures.push(`${route}:${vp.name}:${caseName}:CRITICAL_STATUS_HIDDEN`);
                if(vp.width<=900&&!obs.navToggleVisible) failures.push(`${route}:${vp.name}:${caseName}:MOBILE_NAV_TOGGLE_HIDDEN`);
                if(route.endsWith('index.html')){
                  if(!obs.workspaceAllBlocked) failures.push(`${route}:${vp.name}:${caseName}:WORKSPACE_UNLOCKED`);
                  if(!obs.signInEnabled) failures.push(`${route}:${vp.name}:${caseName}:SIGN_IN_PROJECTION_GATED`);
                  if(obs.hasLiveApprovedText) failures.push(`${route}:${vp.name}:${caseName}:FALSE_LIVE_RANKING`);
                  if(obs.fixtureTag!==stateCase.fixtureTag) failures.push(`${route}:${vp.name}:${caseName}:FIXTURE_TAG_${obs.fixtureTag}_EXPECTED_${stateCase.fixtureTag}`);
                  if(obs.verticalCount!==8) failures.push(`${route}:${vp.name}:${caseName}:STRUCTURAL_VERTICALS_${obs.verticalCount}`);
                }
                if(vp.width<=900){
                  await page.locator('.nav-toggle').click();
                  const menuOpen=await page.locator('#primary-nav').isVisible();
                  if(!menuOpen) failures.push(`${route}:${vp.name}:${caseName}:MOBILE_NAV_DID_NOT_OPEN`);
                  await page.keyboard.press('Escape');
                }
                const focusables=await page.locator('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])').count();
                let keyboardFocus=true;
                if(focusables>0){
                  await page.keyboard.press('Tab');
                  keyboardFocus=await page.evaluate(()=>document.activeElement&&document.activeElement!==document.body);
                  if(!keyboardFocus) failures.push(`${route}:${vp.name}:${caseName}:KEYBOARD_FOCUS_NOT_OBSERVED`);
                }
                if(route.endsWith('index.html')&&caseName==='CONTROL_NO_PROJECTION'&&(vp.width===390||vp.width===1440)){
                  await page.evaluate(()=>document.activeElement instanceof HTMLElement&&document.activeElement.blur());
                  await page.screenshot({path:`${screenshotDir}/portal-r001-${vp.name}.png`,fullPage:true});
                }
                results.push({route,viewport:vp.name,state_case:caseName,expected:stateCase.expected,seriousCritical:serious.length,axeDetails,obs,focusables,keyboardFocus});
                await page.close();
              }
              await context.close();
            }
          }

          // Positive path: a canonical approved Projection is rendered only through
          // the signed, non-public server capability on the isolated positive server.
          {
            const approved=approvedProjectionFixture();
            for(const width of [390,1440]){
              const context=await browser.newContext({viewport:{width,height:width===390?900:1000},reducedMotion:'reduce'});
              await context.addInitScript(()=>{
                globalThis.__kidultsVitals={lcp:0,cls:0,inp:0};
                new PerformanceObserver(list=>{for(const e of list.getEntries())globalThis.__kidultsVitals.lcp=Math.max(globalThis.__kidultsVitals.lcp,e.startTime)}).observe({type:'largest-contentful-paint',buffered:true});
                new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)globalThis.__kidultsVitals.cls+=e.value}).observe({type:'layout-shift',buffered:true});
                try{new PerformanceObserver(list=>{for(const e of list.getEntries())globalThis.__kidultsVitals.inp=Math.max(globalThis.__kidultsVitals.inp,e.duration)}).observe({type:'event',buffered:true,durationThreshold:16})}catch{}
              });
              const page=await context.newPage();
              const runtimeErrors=[];
              page.on('pageerror',error=>runtimeErrors.push(`PAGEERROR_${error.message}`));
              page.on('console',message=>{if(message.type()==='error'&&!/favicon/i.test(message.text()))runtimeErrors.push(`CONSOLE_${message.text()}`)});
              await page.goto('http://127.0.0.1:4174/portal-r001/index.html',{waitUntil:'domcontentloaded'});
              await page.keyboard.press('Tab');
              await page.waitForTimeout(100);
              await page.waitForFunction(()=>globalThis.__kidultsVitals?.lcp>0,{timeout:2000}).catch(()=>{});
              const obs=await page.evaluate(()=>({
                state:document.documentElement.dataset.state,
                objectTitle:document.querySelector('[data-object-title]')?.textContent,
                objectCount:document.querySelector('[data-object-count]')?.textContent,
                workspaceBlocked:document.querySelectorAll('.workspace-grid article').length===4&&[...document.querySelectorAll('.workspace-grid article')].every(node=>node.getAttribute('aria-disabled')==='true'),
                kidultReady:document.querySelector('[data-k100-state]')?.dataset.contentState==='LIVE_APPROVED',
                researchText:document.querySelector('[data-research-record]')?.textContent||'',
                evidenceText:document.querySelector('[data-evidence-grid]')?.textContent||'',
                auditText:document.querySelector('[data-audit-safe]')?.textContent||'',
                auditSeal:document.querySelector('[data-audit-seal]')?.textContent,
                indexSeriesLabel:document.querySelector('.index-line')?.getAttribute('aria-label'),
                signInEnabled:Boolean(document.querySelector('.sign-in'))&&document.querySelector('.sign-in').getAttribute('aria-disabled')!=='true',
                horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                bodyText:document.body.innerText||'',
                vitals:globalThis.__kidultsVitals
              }));
              if(obs.state!=='LIVE_APPROVED')failures.push(`APPROVED_POSITIVE:w${width}:STATE_${obs.state}`);
              if(obs.objectTitle!=='No governed object'||obs.objectCount!=='WAITING')failures.push(`APPROVED_QUARANTINE:w${width}:OBJECT_VALUE_EXPOSED`);
              if(obs.workspaceBlocked||obs.auditSeal!=='TRACE BOUND')failures.push(`APPROVED_POSITIVE:w${width}:CAPABILITY_NOT_UNLOCKED`);
              if(obs.indexSeriesLabel!=='Index display withheld until governed Projection')failures.push(`APPROVED_QUARANTINE:w${width}:INDEX_SERIES_EXPOSED`);
              if(!/fixture-(?:what_changed|liquidity|market_scale)/.test(obs.bodyText))failures.push(`APPROVED_POSITIVE:w${width}:SIGNED_VALUE_MISSING`);
              if(!obs.signInEnabled)failures.push(`APPROVED_QUARANTINE:w${width}:SIGN_IN_PROJECTION_GATED`);
              if(runtimeErrors.length)failures.push(`APPROVED_QUARANTINE:w${width}:RUNTIME_${runtimeErrors.join('|')}`);
              if(width<=430&&obs.horizontalOverflow)failures.push(`APPROVED_QUARANTINE:w${width}:HORIZONTAL_OVERFLOW`);
              if(!obs.vitals?.lcp)failures.push(`APPROVED_POSITIVE:w${width}:LCP_MEASUREMENT_ABSENT`);
              else if(obs.vitals.lcp>2500)failures.push(`APPROVED_POSITIVE:w${width}:LCP_${obs.vitals.lcp}`);
              if(obs.vitals?.cls>0.1)failures.push(`APPROVED_POSITIVE:w${width}:CLS_${obs.vitals?.cls}`);
              const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']).analyze();
              const serious=axe.violations.filter(v=>['serious','critical'].includes(v.impact));
              const axeDetails=serious.flatMap(violation=>violation.nodes.map(node=>({id:violation.id,target:node.target,html:node.html})));
              if(serious.length)failures.push(`APPROVED_QUARANTINE:w${width}:AXE_${JSON.stringify(axeDetails)}`);
              results.push({route:'/portal-r001/index.html',viewport:`w${width}`,state:'APPROVED_PUBLIC_SIGNED_POSITIVE',seriousCritical:serious.length,axeDetails,obs});
              await context.close();
            }
          }

          // Canonical approved mutations must remain quarantined before any browser capability unlocks.
          {
            const validApproved=approvedProjectionFixture();
            const adversarial=[
              {name:'MISSING_PROJECTION_ID',mutate:data=>{data.projection_id=''}},
              {name:'ASSESSMENT_REBOUND',mutate:data=>{data.rankability.assessment_id='fixture-assessment-other'}},
              {name:'RIGHTS_SUMMARY_CONTRADICTION',mutate:data=>{data.rights.state='BLOCKED'}},
              {name:'PUBLIC_RIGHT_BLOCKED',mutate:data=>{data.rights.public_display='BLOCKED';data.rights.state='PARTIAL'}},
              {name:'INVALID_FRESHNESS_DATE',mutate:data=>{data.freshness.observed_at='2026-02-30T10:00:00Z'}},
              {name:'INVALID_SCOPE_DATE',mutate:data=>{data.scope.period.start='2026-04-31T00:00:00Z'}},
              {name:'INVALID_AUDIT_DATE',mutate:data=>{data.audit.events=[{event_id:'qa-event',event_type:'QA',occurred_at:'2026-08-01T24:00:00Z'}]}},
              {name:'EMPTY_PRODUCT_PAYLOAD',mutate:data=>{data.payload={}}},
              {name:'MALFORMED_ACTION',mutate:data=>{data.actions=[{}]}},
              {name:'EXTRA_ROOT_PROPERTY',mutate:data=>{data.unexpected='forbidden'}},
              {name:'UNKNOWN_PROJECTION_STATE',mutate:data=>{data.projection_state='UNKNOWN_FUTURE_STATE'}},
              {name:'RECORD_TYPE_TYPO',mutate:data=>{data.record_type='kidults_proof_product_projection_v2'}},
              {name:'CONTRACT_VERSION_DRIFT',mutate:data=>{data.contract_version='2.0.0'}},
              {name:'CALLER_FIXTURE_AUTHORITY',mutate:data=>{data.validationMode='FIXTURE_VALIDATION_ONLY';data.releaseAuthority='TEST_ONLY'}}
            ];
            adversarialCaseNames.push(...adversarial.map(test=>test.name));
            for(const test of adversarial){
              const envelope=structuredClone(validApproved);
              test.mutate(envelope);
              const context=await browser.newContext({viewport:{width:390,height:900},reducedMotion:'reduce'});
              await context.route('**/api/v1/projection',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(envelope)}));
              const page=await context.newPage();
              await page.goto(baseUrl+'/portal-r001/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(50);
              const obs=await page.evaluate(()=>({
                state:document.documentElement.dataset.state,
                workspaceBlocked:document.querySelectorAll('.workspace-grid article').length===4&&[...document.querySelectorAll('.workspace-grid article')].every(node=>node.getAttribute('aria-disabled')==='true'),
                kidultReady:document.querySelector('[data-k100-state]')?.dataset.contentState==='LIVE_APPROVED',
                evidenceValues:[...document.querySelectorAll('[data-evidence-grid] b')].map(node=>(node.textContent||'').trim()),
                bodyText:document.body.innerText||''
              }));
              if(obs.state!=='INVALID'||!obs.workspaceBlocked||obs.kidultReady||obs.evidenceValues.includes('COMPLETE')||obs.evidenceValues.includes('VERIFIED')||/fixture-(?:what_changed|liquidity|market_scale)/.test(obs.bodyText))failures.push(`ADVERSARIAL:${test.name}:FALSE_LIVE_${JSON.stringify(obs)}`);
              results.push({route:'/portal-r001/index.html',viewport:'w390',state:`ADVERSARIAL_${test.name}`,expected:'INVALID',obs});
              await context.close();
            }
          }

          // Resilience: fixture fetch fails. Portal may render INVALID or remain fail-closed, but must never silently become LIVE_APPROVED.
          {
            const context=await browser.newContext({viewport:{width:390,height:900},reducedMotion:'reduce'});
            await context.route('**/portal-r001/data/projection-control-fixture.json',route=>route.abort('failed'));
            const page=await context.newPage();
            await page.goto(baseUrl+'/portal-r001/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(100);
            const state=await page.evaluate(()=>document.documentElement.dataset.state||null);
            const body=await page.locator('body').innerText();
            if(state==='LIVE_APPROVED'||body.includes('Governed ranking available.')) failures.push('fixture-fetch-failure:SILENT_LIVE_FALLBACK');
            await context.setOffline(true);
            try{await page.reload({waitUntil:'domcontentloaded',timeout:5000});}catch{}
            const offlineState=await page.evaluate(()=>document.documentElement.dataset.state||null).catch(()=>null);
            if(offlineState==='LIVE_APPROVED') failures.push('offline-reload:SILENT_LIVE_FALLBACK');
            results.push({route:'/portal-r001/index.html',viewport:'w390',state:'FETCH_FAILURE_OFFLINE',observedState:offlineState||state});
            await context.close();
