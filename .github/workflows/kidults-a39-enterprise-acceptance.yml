name: Kidults A39 Enterprise Autonomous Operations Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/kidults-autonomous-intelligence/scripts/a39-enterprise-acceptance.mjs'
      - 'services/kidults-autonomous-intelligence/fixtures/a39/**'
      - 'services/kidults-autonomous-intelligence/package.json'
      - 'docs/kidults/A39_ENTERPRISE_AUTONOMOUS_OPERATIONS_ACCEPTANCE.md'
      - '.github/workflows/kidults-a39-enterprise-acceptance.yml'
      - 'services/kidults-autonomous-intelligence/reports/**'

concurrency:
  group: kidults-a39-enterprise-acceptance
  cancel-in-progress: false

jobs:
  a39-enterprise-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'

      - name: Install dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify A39 package scripts exist
        working-directory: services/kidults-autonomous-intelligence
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf-8'));
            const required = ['a39:gate', 'a39:certify', 'a39:finalize'];
            const missing = required.filter((name) => !pkg.scripts[name]);
            if (missing.length) { console.error('MISSING SCRIPTS:', missing.join(', ')); process.exit(1); }
            console.log('A39 scripts present:', required.join(', '));
          "

      - name: Typecheck
        working-directory: services/kidults-autonomous-intelligence
        run: npm run typecheck

      - name: Refresh complete A15-A38 simulation evidence chain
        working-directory: services/kidults-autonomous-intelligence
        env:
          A39_MODE: SIMULATION
        run: |
          set -euo pipefail
          npm run a15:policy
          npm run a16:execution
          npm run a17:bounded-live
          npm run a18:smoke
          npm run a19:gap
          npm run a20:gate
          npm run a21:pipeline
          npm run a22:publication-control
          npm run a23:gate
          npm run a24:gate
          npm run a25:runtime
          npm run a26:recovery
          npm run a27:governance
          npm run a28:control-tower
          npm run a29:orchestrate
          npm run a30:ui
          npm run a31:gateway
          npm run a32:reality
          npm run a33:gate
          npm run a34:gate
          npm run a35:gate
          npm run a36:gate
          npm run a37:gate
          npm run a38:gate

      - name: Run A39 gate
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a39:gate
        env:
          A39_MODE: SIMULATION

      - name: Run A39 certify
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a39:certify
        env:
          A39_MODE: SIMULATION

      - name: Upload A39 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a39-enterprise-acceptance-evidence
          path: services/kidults-autonomous-intelligence/reports/enterprise-acceptance/
          retention-days: 90
          if-no-files-found: error
