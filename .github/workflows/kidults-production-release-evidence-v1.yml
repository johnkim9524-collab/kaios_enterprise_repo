name: KIDULTS Production Release Evidence V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-production-release-evidence-v1
  cancel-in-progress: false

jobs:
  produce:
    name: Produce exact-main sealed Production evidence
    environment: kidults-production-evidence
    runs-on: [self-hosted, linux, x64, kidults-production-evidence]
    timeout-minutes: 30
    env:
      KIDULTS_CANONICAL_REPOSITORY: johnkim9524-collab/kaios_enterprise_repo
      KIDULTS_EVIDENCE_INTAKE: /var/lib/kaios/kidults-production-release/evidence-intake
      KIDULTS_ARCHIVE_ROOT: /mnt/ih_prod_01/backups/production-certification

    steps:
      - name: Verify exact protected-main dispatch before checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$KIDULTS_CANONICAL_REPOSITORY"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          LIVE_MAIN_SHA="$(
            curl --disable --fail-with-body --silent --show-error \
              --proto '=https' --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -I -c 'import json,re,sys; s=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(s) if re.fullmatch(r"[0-9a-f]{40}",s) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Seal exact evidence without Production mutation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/libexec/kidults-production-evidence-root-helper
          python3 -I - "$RUNNER_TEMP/kidults-production-release-evidence" "$GITHUB_SHA" <<'PY'
          import hashlib, json, os, re, shutil, stat, sys
          from pathlib import Path
          output, source_sha = map(Path, sys.argv[1:])
          archive = output / "kidults-production-evidence.tar.gz"
          manifest_path = output / "kidults-production-evidence.tar.gz.manifest.json"
          if sorted(path.name for path in output.iterdir()) != sorted([archive.name, manifest_path.name]):
              raise SystemExit("SEALED_EXPORT_EXACT_PAIR_REQUIRED")
          for path in (archive, manifest_path):
              metadata = path.stat(follow_symlinks=False)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or metadata.st_uid != os.geteuid() or metadata.st_gid != os.getegid():
                  raise SystemExit("SEALED_EXPORT_IDENTITY")
              if stat.S_IMODE(metadata.st_mode) != 0o600:
                  raise SystemExit("SEALED_EXPORT_MODE")
          digest = "sha256:" + hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("archive_sha256") != digest or manifest.get("source_sha") != str(source_sha):
              raise SystemExit("SEALED_EXPORT_BINDING")
          PY
          git diff HEAD --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload exact-SHA sealed evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-production-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/kidults-production-release-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: Preserve HOLD boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Evidence artifact produced; Production/Public/G5 remain HOLD pending separate exact artifact certification, protected executor consumption, and explicit release.'
