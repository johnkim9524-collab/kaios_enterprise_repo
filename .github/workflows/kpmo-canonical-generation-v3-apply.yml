name: KPMO Canonical Generation V3 Apply

on:
  workflow_dispatch:
    inputs:
      authorization_id:
        description: 'Exact Owner authorization ID bound to current protected main'
        required: true
        type: string
      target_main_sha:
        description: 'Exact protected main SHA authorized for this one-shot apply'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: kpmo-canonical-generation-v3-apply-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply-append-only-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact main checkout and bounded inputs
        env:
          TARGET_MAIN_SHA: ${{ inputs.target_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'johnkim9524-collab'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$TARGET_MAIN_SHA"
          [[ "$TARGET_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Revalidate Canonical V3 fail-closed contract
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/canonical-generation-v3.mjs --self-test
          node scripts/kidults/kpmo/run-canonical-generation-v3-apply-v1.mjs --self-test
      - name: Apply authorized append-only 25-member generation plus aggregate commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_MAIN_SHA: ${{ inputs.target_main_sha }}
          CANONICAL_GENERATION_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          CANONICAL_GENERATION_EXPLICIT_WRITE_AUTHORITY: AUTHORIZED
          CANONICAL_GENERATION_RECEIPT_PATH: ${{ runner.temp }}/canonical-generation-v3-receipt.json
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/run-canonical-generation-v3-apply-v1.mjs
      - name: Validate terminal receipt
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/canonical-generation-v3-receipt.json"
          node - "$RUNNER_TEMP/canonical-generation-v3-receipt.json" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2];
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!['VERIFIED_PASS','VERIFIED_FAIL'].includes(x.state)) throw new Error('CANONICAL_V3_RECEIPT_STATE_INVALID');
          if(x.promotion_eligible!==false||x.production!=='HOLD'||x.public!=='HOLD'||x.g5!=='HOLD') throw new Error('CANONICAL_V3_RECEIPT_BOUNDARY_INVALID');
          if(x.state==='VERIFIED_PASS' && !['COMMITTED','IDEMPOTENT_EXISTING_GENERATION','COMMITTED_EVENTUAL_READBACK_RECOVERED'].includes(x.mode)) throw new Error('CANONICAL_V3_PASS_MODE_INVALID');
          if(x.mode==='COMMITTED_EVENTUAL_READBACK_RECOVERED' && (x.writes!==26||x.recovered_same_generation!==true||x.recovered_from_failure_class!=='POST_WRITE_READBACK_INVALID')) throw new Error('CANONICAL_V3_RECOVERY_RECEIPT_INVALID');
          console.log(JSON.stringify({state:x.state,mode:x.mode,writes:x.writes,generation_id:x.generation_id||null,aggregate_comment_id:x.aggregate_comment_id||null}));
          NODE
      - name: Upload exact-run Canonical V3 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpmo-canonical-generation-v3-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-generation-v3-receipt.json
          if-no-files-found: error
          retention-days: 90
