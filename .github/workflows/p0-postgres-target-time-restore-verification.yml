name: P0 PostgreSQL Target-Time Restore Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-postgres-target-time-restore-verification
  cancel-in-progress: false

jobs:
  verify-target-time-restore:
    if: github.ref == 'refs/heads/main' && vars.KIDULTS_POSTGRES_PITR_RESTORE_VERIFICATION_AUTHORIZED == 'true'
    environment: kidults-do-staging-ssh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOST: ${{ vars.KIDULTS_STAGING_PUBLIC_IP }}
      EXPECTED_FINGERPRINT: ${{ vars.KIDULTS_STAGING_HOST_FINGERPRINT }}
    steps:
      - name: Verify explicit STAGING activation authorization before secret resolution
        shell: bash
        env:
          ACTIVATION_AUTHORIZED: ${{ vars.KIDULTS_POSTGRES_PITR_RESTORE_VERIFICATION_AUTHORIZED }}
        run: |
          set -euo pipefail
          test "$ACTIVATION_AUTHORIZED" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Checkout exact live main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove exact checkout and staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$HOST"
          test -n "$EXPECTED_FINGERPRINT"
          test "$HOST" = '165.232.175.45'

      - name: Pin and verify ED25519 host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh"
          timeout 10 ssh-keyscan -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" | awk '{print $2}')"
          test "$observed" = "$EXPECTED_FINGERPRINT"

      - name: Materialize dedicated staging key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.KIDULTS_STAGING_SSH_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY_B64"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ssh/id_ed25519"
          tr -d '\r' < "$RUNNER_TEMP/ssh/id_ed25519" > "$RUNNER_TEMP/ssh/id_ed25519.normalized"
          mv "$RUNNER_TEMP/ssh/id_ed25519.normalized" "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/id_ed25519" >/dev/null
          unset SSH_PRIVATE_KEY_B64

      - name: Verify exact non-root staging identity
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          test "$("${SSH[@]}" kidults-staging@"$HOST" 'whoami')" = 'kidults-staging'
          test "$("${SSH[@]}" kidults-staging@"$HOST" 'hostname')" = 'ih-staging-01'

      - name: Collect and bind remote readiness proof tuple
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-pitr-restore
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'cat ~/kidults-runtime/audit/postgres-persistence-pitr-readiness.json' > artifacts/p0-pitr-restore/postgres-persistence-pitr-readiness.json
          python3 - <<'PY' > "$RUNNER_TEMP/pitr-proof.env"
          import json, shlex
          r=json.load(open('artifacts/p0-pitr-restore/postgres-persistence-pitr-readiness.json', encoding='utf-8'))
          assert r['status']=='PASS'
          assert r['environment']=='STAGING'
          assert r['production_touch'] is False
          assert r['pitr_capability']=='TARGET_TIME_RESTORE_FIXTURE_READY'
          for key in ('pitr_before_marker','pitr_after_marker','pitr_target_time'):
              value=r.get(key)
              assert isinstance(value,str) and value
          print('KAIOS_PITR_BEFORE_MARKER='+shlex.quote(r['pitr_before_marker']))
          print('KAIOS_PITR_AFTER_MARKER='+shlex.quote(r['pitr_after_marker']))
          print('KAIOS_PITR_TARGET_TIME='+shlex.quote(r['pitr_target_time']))
          PY

      - name: Stage verifier and restore DSN without exposing DSN in arguments
        env:
          RESTORE_DSN: ${{ secrets.KIDULTS_STAGING_POSTGRES_PITR_RESTORE_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RESTORE_DSN"
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'umask 077; mkdir -p ~/kidults-runtime/bin ~/kidults-runtime/data ~/kidults-runtime/audit; cat > ~/kidults-runtime/bin/verify-postgres-target-time-restore.sh' < scripts/staging/verify-postgres-target-time-restore.sh
          "${SSH[@]}" kidults-staging@"$HOST" 'chmod 700 ~/kidults-runtime/bin/verify-postgres-target-time-restore.sh'
          printf '%s' "$RESTORE_DSN" | "${SSH[@]}" kidults-staging@"$HOST" 'umask 077; cat > ~/kidults-runtime/data/postgres-pitr-restore.dsn; chmod 600 ~/kidults-runtime/data/postgres-pitr-restore.dsn'
          unset RESTORE_DSN

      - name: Verify actual target-time restore
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pitr-proof.env"
          export KAIOS_PITR_BEFORE_MARKER KAIOS_PITR_AFTER_MARKER KAIOS_PITR_TARGET_TIME
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          cleanup() {
            "${SSH[@]}" kidults-staging@"$HOST" 'rm -f ~/kidults-runtime/data/postgres-pitr-restore.dsn' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "${SSH[@]}" kidults-staging@"$HOST" "
            set -euo pipefail
            export KAIOS_ENVIRONMENT=staging
            export KAIOS_PRODUCTION_PROMOTION_AUTHORIZED=false
            export KAIOS_PITR_BEFORE_MARKER=$(printf %q "$KAIOS_PITR_BEFORE_MARKER")
            export KAIOS_PITR_AFTER_MARKER=$(printf %q "$KAIOS_PITR_AFTER_MARKER")
            export KAIOS_PITR_TARGET_TIME=$(printf %q "$KAIOS_PITR_TARGET_TIME")
            KAIOS_POSTGRES_PITR_RESTORE_DSN=\"\$(cat ~/kidults-runtime/data/postgres-pitr-restore.dsn)\"
            export KAIOS_POSTGRES_PITR_RESTORE_DSN
            ~/kidults-runtime/bin/verify-postgres-target-time-restore.sh | tee ~/kidults-runtime/audit/postgres-target-time-restore.json
          "

      - name: Collect and assert non-secret PITR receipt
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'cat ~/kidults-runtime/audit/postgres-target-time-restore.json' > artifacts/p0-pitr-restore/postgres-target-time-restore.json
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/p0-pitr-restore/postgres-target-time-restore.json'))
          assert r['status']=='PASS'
          assert r['environment']=='STAGING'
          assert r['production_touch'] is False
          assert r['pitr']=='TARGET_TIME_RESTORE_VERIFIED'
          assert r['pre_target_marker_count']==1
          assert r['post_target_marker_count']==0
          assert int(r['force_rls_tables']) >= 4
          print('POSTGRES_TARGET_TIME_RESTORE_VERIFIED')
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12.14'
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Re-evaluate Candidate Evidence Track B and Projection chain
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kidults/integration/validate-live-assessment-audit-hardening-v1.py
          python scripts/kidults/integration/evaluate-exact-pair-arrival-v1.py artifacts/p0-pitr-restore/empirical-chain-state.json
          python scripts/kidults/integration/build-live-chain-audit-v1.py artifacts/p0-pitr-restore/empirical-chain-state.json artifacts/p0-pitr-restore/empirical-audit-chain.json
          python3 - <<'PY'
          import json
          p=json.load(open('artifacts/p0-pitr-restore/empirical-chain-state.json'))
          a=json.load(open('artifacts/p0-pitr-restore/empirical-audit-chain.json'))
          assert p['result']=='PASS'
          assert p['production']=='HOLD'
          assert p['public_intelligence']=='HOLD'
          assert a['production']=='HOLD'
          assert a['public_intelligence']=='HOLD'
          print('POST_PITR_EMPIRICAL_CHAIN_STATE='+p['state'])
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: p0-postgres-target-time-restore-${{ github.sha }}
          path: artifacts/p0-pitr-restore
          if-no-files-found: error
          retention-days: 30
