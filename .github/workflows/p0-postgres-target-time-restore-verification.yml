name: P0 PostgreSQL Target-Time Restore Evidence Gate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Historical source fixture run ID for audit context only; not authorization or proof
        required: true
        type: string
      restore_operation_reference:
        description: Operator-supplied restore reference for audit context only; not authorization or proof
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p0-postgres-target-time-restore-containment
  cancel-in-progress: false

jobs:
  fail-closed-target-time-containment:
    name: PostgreSQL target-time restore replay containment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source, request shape and containment contract
        id: verify
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESTORE_OPERATION_REFERENCE: ${{ inputs.restore_operation_reference }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RESTORE_OPERATION_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{7,255}$ ]]
          node tests/kidults/kpmo/p0-postgres-standing-auth-containment-v1.test.mjs

      - name: Emit non-secret fail-closed target-time containment receipt
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESTORE_OPERATION_REFERENCE: ${{ inputs.restore_operation_reference }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-postgres-target-time-restore
          python3 - <<'PY' > artifacts/p0-postgres-target-time-restore/activation-containment.json
          import json, os, re
          verified = os.environ.get("VERIFY_OUTCOME") == "success"
          raw_source_run = os.environ.get("SOURCE_RUN_ID", "")
          source_run_id = int(raw_source_run) if re.fullmatch(r"[1-9][0-9]*", raw_source_run) else None
          print(json.dumps({
              "receipt_id": "kidults-p0-postgres-target-time-restore-containment-v1",
              "version": "1.0.0",
              "state": "BLOCKED_ONE_SHOT_AUTHORIZATION_REQUIRED" if verified else "VERIFIED_FAIL_CONTAINMENT_CONTRACT",
              "issues": [1481, 1482],
              "containment_contract_verified": verified,
              "verification_outcome": os.environ.get("VERIFY_OUTCOME", "unknown"),
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "requested_source_run_id": source_run_id,
              "restore_operation_reference": os.environ.get("RESTORE_OPERATION_REFERENCE"),
              "request_metadata_is_authorization": False,
              "request_metadata_is_restore_proof": False,
              "standing_boolean_consulted_by_executable_job": False,
              "standing_boolean_authority_accepted": False,
              "credentialed_job_condition": "false",
              "provider_environment_entered": False,
              "provider_secrets_resolved": False,
              "ssh_executed": False,
              "database_contacted": False,
              "remote_mutation_performed": False,
              "restore_probe_executed": False,
              "restore_performed": False,
              "target_time_restore_verified": False,
              "target_time_restore_receipt": None,
              "pitr_proven": False,
              "required_next_control": "INDEPENDENT_RUN_BOUND_SINGLE_USE_AUTHORIZATION_CONSUMED_BEFORE_ENVIRONMENT_OR_SECRET_RESOLUTION",
              "required_external_state": "KIDULTS_REMOTE_POSTGRES_AUTO_ACTIVATION_AUTHORIZED=false",
              "production": "HOLD",
              "public": "HOLD",
              "g5": "HOLD"
          }, indent=2))
          PY
          test -s artifacts/p0-postgres-target-time-restore/activation-containment.json
          python3 -m json.tool artifacts/p0-postgres-target-time-restore/activation-containment.json >/dev/null
          cat artifacts/p0-postgres-target-time-restore/activation-containment.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: p0-postgres-target-time-restore-containment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p0-postgres-target-time-restore/activation-containment.json
          if-no-files-found: error
          retention-days: 30

  verify-target-time-restore:
    # Permanent fail-closed containment for #1481. Request metadata and the
    # legacy standing boolean cannot authorize Environment or secret resolution.
    # This registered job remains unreachable until a fresh independent one-shot
    # authority is atomically consumed before this job can start.
    if: ${{ false }}
    environment: kidults-do-staging-ssh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify explicit STAGING activation authorization before secret resolution
        shell: bash
        env:
          ACTIVATION_AUTHORIZED: ${{ vars.KIDULTS_REMOTE_POSTGRES_AUTO_ACTIVATION_AUTHORIZED }}
        run: |
          set -euo pipefail
          test "$ACTIVATION_AUTHORIZED" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Materialize dedicated STAGING key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.KIDULTS_STAGING_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SSH_PRIVATE_KEY_B64"
          unset SSH_PRIVATE_KEY_B64
          echo "Credentialed PostgreSQL restore lane is fail-closed under #1481."
          exit 78

      - name: Execute target-time restore verification through pinned SSH tunnel
        shell: bash
        env:
          PITR_RESTORE_DSN: ${{ secrets.KIDULTS_STAGING_POSTGRES_PITR_RESTORE_DSN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PITR_RESTORE_DSN"
          unset PITR_RESTORE_DSN
          echo "No SSH, tunnel, database contact, restore probe or PITR claim is permitted."
          exit 78
