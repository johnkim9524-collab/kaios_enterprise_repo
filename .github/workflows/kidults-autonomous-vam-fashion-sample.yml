name: KIDULTS Autonomous V&A Fashion Sample

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-autonomous-vam-fashion-sample-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Syntax check
        run: |
          node --check scripts/kidults/autonomous/collect-vam-fashion-sample.mjs
          node --check scripts/kidults/autonomous/validate-vam-fashion-sample.mjs

      - name: Collect bounded V&A summary metadata sample
        run: |
          node scripts/kidults/autonomous/collect-vam-fashion-sample.mjs \
            --output artifacts/autonomous-source-samples/vam-fashion-collections-r1 \
            --query dress \
            --limit 12 \
            --minimum-records 8

      - name: Validate evidence, rights and safety gates
        run: |
          node scripts/kidults/autonomous/validate-vam-fashion-sample.mjs \
            artifacts/autonomous-source-samples/vam-fashion-collections-r1

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-vam-fashion-bounded-sample
          path: artifacts/autonomous-source-samples/vam-fashion-collections-r1
          if-no-files-found: error
          retention-days: 30
