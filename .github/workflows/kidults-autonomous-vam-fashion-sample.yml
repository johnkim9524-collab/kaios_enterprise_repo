name: KIDULTS Autonomous V&A Fashion Sample

on:
  push:
    branches:
      - main
    paths:
      - "coordination/kidults/autonomous/source-discovery/contracts/vam-fashion-collections-r1.json"
      - "coordination/kidults/registry/trusted-source/records/trusted-source-fashion-accessories-r1.json"
      - "scripts/kidults/autonomous/collect-vam-fashion-sample.mjs"
      - "scripts/kidults/autonomous/validate-vam-fashion-sample.mjs"
      - ".github/workflows/kidults-autonomous-vam-fashion-sample.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-vam-public-source-read-hold
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify exact current main before public-source read
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Syntax check
        run: |
          node --check scripts/kidults/autonomous/collect-vam-fashion-sample.mjs
          node --check scripts/kidults/autonomous/validate-vam-fashion-sample.mjs

      - name: Record V&A external-verifier hard HOLD
        run: |
          node scripts/kidults/autonomous/collect-vam-fashion-sample.mjs \
            --output artifacts/autonomous-source-samples/vam-fashion-collections-r1 \
            --query dress \
            --limit 12 \
            --minimum-records 8

      - name: Validate evidence, rights and safety gates
        if: always()
        run: |
          node scripts/kidults/autonomous/validate-vam-fashion-sample.mjs \
            artifacts/autonomous-source-samples/vam-fashion-collections-r1

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-vam-fashion-bounded-sample
          path: artifacts/autonomous-source-samples/vam-fashion-collections-r1
          if-no-files-found: error
          retention-days: 28
