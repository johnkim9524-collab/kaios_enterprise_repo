name: Kidults A29 Executive Decision Orchestration

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/kidults-autonomous-intelligence/src/executive-orchestration/**'
      - 'services/kidults-autonomous-intelligence/scripts/a29-executive-decision-orchestration.mjs'
      - 'contracts/a29-executive-decision-orchestration-policy.json'

concurrency:
  group: kidults-a29-executive-decision-orchestration
  cancel-in-progress: false

jobs:
  a29-executive-decision-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm install

      - name: Verify A29 package scripts exist
        working-directory: services/kidults-autonomous-intelligence
        run: |
          echo "Verifying required A29 package scripts..."
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            const required = ['a29:orchestrate', 'a29:certify', 'a29:finalize'];
            const missing = required.filter(s => !pkg.scripts[s]);
            if (missing.length > 0) {
              console.error('MISSING SCRIPTS:', missing.join(', '));
              process.exit(1);
            }
            console.log('All required A29 scripts present:', required.join(', '));
          "

      - name: Typecheck
        working-directory: services/kidults-autonomous-intelligence
        run: npm run typecheck

      - name: Run A29 orchestration
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a29:orchestrate

      - name: Run A29 certify
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a29:certify

      - name: Verify a29:finalize script is defined
        working-directory: services/kidults-autonomous-intelligence
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            if (!pkg.scripts['a29:finalize']) { console.error('a29:finalize missing'); process.exit(1); }
            console.log('a29:finalize defined:', pkg.scripts['a29:finalize']);
          "

      - name: Upload A29 evidence
        uses: actions/upload-artifact@v6
        with:
          name: a29-executive-decision-evidence
          path: services/kidults-autonomous-intelligence/reports/executive-decisions/
          retention-days: 30
          if-no-files-found: error
