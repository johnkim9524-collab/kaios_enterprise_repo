name: KIDULTS E2E BMW R90S Fail-Closed Vertical Slice v1

on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/asi-v2-1-official-preflight-observation-v1.json'
      - 'scripts/kidults/e2e/build-bmw-r90s-failclosed-vertical-slice-v1.mjs'
      - 'scripts/kidults/e2e/validate-bmw-r90s-failclosed-vertical-slice-v1.mjs'
      - '.github/workflows/kidults-e2e-bmw-r90s-failclosed-slice-v1.yml'
  workflow_dispatch:

jobs:
  bmw-r90s-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node scripts/kidults/e2e/build-bmw-r90s-failclosed-vertical-slice-v1.mjs out
      - run: node scripts/kidults/e2e/validate-bmw-r90s-failclosed-vertical-slice-v1.mjs out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-e2e-bmw-r90s-failclosed-slice-v1
          path: out
