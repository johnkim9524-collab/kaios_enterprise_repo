name: KPMO P2 Same-Generation Patcher v1

on:
  push:
    branches:
      - fix/p0-p2-same-generation-lineage-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Apply exact fail-closed P2 lineage patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/kidults-asi-owned-source-intelligence-graph-v2.yml')
          s=p.read_text()
          old='''concurrency:\n  group: kidults-asi-owned-source-intelligence-graph-v2-${''' + '''{ github.ref }}\n  cancel-in-progress: true'''
          new='''concurrency:\n  # Distinct upstream completions must never cancel each other before exact-generation validation.\n  group: kidults-asi-owned-source-intelligence-graph-v2-${''' + '''{ github.event_name }}-${''' + '''{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.run_id }}\n  cancel-in-progress: true'''
          if s.count(old)!=1: raise SystemExit('concurrency precondition mismatch')
          s=s.replace(old,new)

          old='''          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then\n            [[ "$P1_EVENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]\n            [[ "$P1_EVENT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]\n            P1_RUN_ID="$P1_EVENT_RUN_ID"\n            P1_SOURCE_SHA="$P1_EVENT_SOURCE_SHA"\n            P1_EXPECTED_BRANCH="$P1_EVENT_SOURCE_BRANCH"\n            test "$P1_EXPECTED_BRANCH" = "main"\n          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then'''
          new='''          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then\n            [[ "$P1_EVENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]\n            [[ "$P1_EVENT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]\n            test "$P1_EVENT_SOURCE_BRANCH" = "main"\n            P1_SOURCE_SHA="$CURRENT_SHA"\n            P1_EXPECTED_BRANCH="main"\n            if [[ "$P1_EVENT_SOURCE_SHA" == "$CURRENT_SHA" ]]; then\n              P1_RUN_ID="$P1_EVENT_RUN_ID"\n            else\n              for i in $(seq 1 60); do\n                gh api -H 'Accept: application/vnd.github+json' \\\n                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-p1-source-preflight-v1.yml/runs?branch=main&status=success&per_page=100" \\\n                  > /tmp/p1-runs.json\n                P1_RUN_ID="$(jq -r --arg sha "$P1_SOURCE_SHA" '[.workflow_runs[] | select(.head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success")] | if length>=1 then .[0].id else empty end' /tmp/p1-runs.json)"\n                if [[ "$P1_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then break; fi\n                sleep 10\n              done\n            fi\n          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then'''
          if s.count(old)!=1: raise SystemExit('workflow_run precondition mismatch')
          s=s.replace(old,new)

          old='''              gh api -H 'Accept: application/vnd.github+json' \\\n                "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-p1-source-preflight-v1.yml/runs?branch=main&status=success&per_page=20" \\\n                > /tmp/p1-runs.json\n              P1_RUN_ID="$(jq -r --arg sha "$CURRENT_SHA" '[.workflow_runs[] | select(.head_branch=="main" and .status=="completed" and .conclusion=="success" and (.head_sha==$sha or (.head_sha | type=="string")))] | .[0].id // empty' /tmp/p1-runs.json)"\n              P1_SOURCE_SHA="$(jq -r --argjson run "${P1_RUN_ID:-0}" '.workflow_runs[] | select(.id==$run) | .head_sha' /tmp/p1-runs.json)"\n              if [[ "$P1_RUN_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$P1_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then\n                if [[ "$P1_SOURCE_SHA" == "$CURRENT_SHA" ]] || git merge-base --is-ancestor "$P1_SOURCE_SHA" "$CURRENT_SHA"; then\n                  break\n                fi\n              fi'''
          new='''              P1_SOURCE_SHA="$CURRENT_SHA"\n              gh api -H 'Accept: application/vnd.github+json' \\\n                "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-p1-source-preflight-v1.yml/runs?branch=main&status=success&per_page=100" \\\n                > /tmp/p1-runs.json\n              P1_RUN_ID="$(jq -r --arg sha "$P1_SOURCE_SHA" '[.workflow_runs[] | select(.head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success")] | if length>=1 then .[0].id else empty end' /tmp/p1-runs.json)"\n              if [[ "$P1_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then\n                break\n              fi'''
          if s.count(old)!=1: raise SystemExit('main lookup precondition mismatch')
          s=s.replace(old,new)

          old='''          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then\n            test "$P1_EXPECTED_BRANCH" = "main"\n            git merge-base --is-ancestor "$P1_SOURCE_SHA" "$CURRENT_SHA"\n          fi'''
          new='''          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then\n            test "$P1_EXPECTED_BRANCH" = "main"\n            test "$P1_SOURCE_SHA" = "$CURRENT_SHA"\n          fi'''
          if s.count(old)!=1: raise SystemExit('ancestor invariant precondition mismatch')
          s=s.replace(old,new)

          marker="      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-upstream-binding-v2.mjs'"
          add=marker+"\n      - 'scripts/kidults/redteam/validate-p2-same-generation-lineage-v1.mjs'"
          if s.count(marker)!=1: raise SystemExit('PR path precondition mismatch')
          s=s.replace(marker,add)

          marker='''          node scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs'''
          add=marker+'''\n          node scripts/kidults/redteam/validate-p2-same-generation-lineage-v1.mjs'''
          if s.count(marker)!=1: raise SystemExit('validator invocation precondition mismatch')
          s=s.replace(marker,add)
          p.write_text(s)
          PY
          node scripts/kidults/redteam/validate-p2-same-generation-lineage-v1.mjs
          node scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs
          rm -- .github/workflows/kpmo-p2-same-generation-patcher-v1.yml
          git diff --check
          git status --short
          git config user.name 'KPMO Autonomous Remediation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/kidults-asi-owned-source-intelligence-graph-v2.yml scripts/kidults/redteam/validate-p2-same-generation-lineage-v1.mjs .github/workflows/kpmo-p2-same-generation-patcher-v1.yml
          git commit -m 'fix(asi): require exact P1 generation for P2 lineage'
          git push origin HEAD:fix/p0-p2-same-generation-lineage-v1