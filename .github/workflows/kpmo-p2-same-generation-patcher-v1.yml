name: KPMO P2 Same-Generation Patcher v1

on:
  push:
    branches:
      - fix/p0-p2-same-generation-lineage-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Apply deterministic patch and regression proof
        run: |
          set -euo pipefail
          python scripts/kidults/redteam/apply-p2-same-generation-lineage-v1.py
          node scripts/kidults/redteam/validate-p2-same-generation-lineage-v1.mjs
          node scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs
          rm -- .github/workflows/kpmo-p2-same-generation-patcher-v1.yml
          rm -- scripts/kidults/redteam/apply-p2-same-generation-lineage-v1.py
          rm -f -- tmp/kpmo-p2-patcher-trigger.txt
          git diff --check
          git config user.name 'KPMO Autonomous Remediation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(asi): require exact P1 generation for P2 lineage'
          git push origin HEAD:fix/p0-p2-same-generation-lineage-v1