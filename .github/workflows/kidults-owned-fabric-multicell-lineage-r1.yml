name: KIDULTS Owned Fabric Multi-Cell Lineage R1

on:
  pull_request:
    paths:
      - 'scripts/kidults/architecture/build-owned-fabric-multicell-lineage-r1.mjs'
      - 'scripts/kidults/architecture/validate-owned-fabric-multicell-lineage-r1.mjs'
      - 'coordination/kidults/source-intelligence/rights-admitted-pilot-source-pool-r1.json'
      - 'coordination/kidults/source-intelligence/rights-admitted-transaction-source-pool-r1.json'
      - 'coordination/kidults/source-intelligence/source-redundancy-status-r1.json'
      - 'artifacts/agci-os/asi-shadow-operating-evidence-v1.json'
      - '.github/workflows/kidults-owned-fabric-multicell-lineage-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Build partial empirical multi-cell lineage
        run: node scripts/kidults/architecture/build-owned-fabric-multicell-lineage-r1.mjs /tmp/kidults-owned-fabric-multicell-lineage-r1.json
      - name: Validate fail-closed lineage truth
        run: node scripts/kidults/architecture/validate-owned-fabric-multicell-lineage-r1.mjs /tmp/kidults-owned-fabric-multicell-lineage-r1.json
