name: KIDULTS AI Agent Bootstrap Remediation Enforcement V1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-ai-agent-bootstrap-remediation-v1-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate-bootstrap-remediation:
    name: Validate AI Fix-First Bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify mandatory GitHub-source agent bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/governance/bootstrap-ai-agent-from-github-v1.mjs
          node --check scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs
          node --check scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
          export KIDULTS_BOOTSTRAP_NONCE="$(openssl rand -base64 48 | tr -d '\n')"
          TASK_ID="fix-first-${GITHUB_RUN_ID}"
          SESSION_ID="fix-first-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}"
          BOOTSTRAP_RESULT="$(node scripts/governance/bootstrap-ai-agent-from-github-v1.mjs \
            --require-clean \
            --agent-id KPMO_FIX_FIRST_CI \
            --agent-class CODING_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA")"
          RECEIPT_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.receipt_path)' "$BOOTSTRAP_RESULT")"
          VERIFY_RESULT="$(node scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs \
            --receipt "$RECEIPT_PATH" \
            --agent-id KPMO_FIX_FIRST_CI \
            --agent-class CODING_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --consume \
            )"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.state!=="BOOTSTRAP_VERIFIED"||x.consumed!==true||x.task_dispatch_allowed_for_bound_task_session!==true||x.working_sha!==process.env.EXPECTED_SHA) throw new Error("BOOTSTRAP_VERIFICATION_RESULT_INVALID")' "$VERIFY_RESULT"
          printf '%s\n' "$VERIFY_RESULT"
          node scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Enforce mandatory fix-first bootstrap and negative mutations
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/governance/validate-ai-agent-bootstrap-remediation-v1.mjs
          node scripts/governance/validate-ai-agent-bootstrap-remediation-v1.mjs
      - name: Enforce tamper-evident bootstrap trust root and platform principles
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/governance/validate-ai-agent-bootstrap-protection-v1.mjs
          node scripts/governance/validate-ai-agent-bootstrap-protection-v1.mjs
