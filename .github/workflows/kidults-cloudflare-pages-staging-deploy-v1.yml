name: KIDULTS Cloudflare Pages Governed STAGING Deploy v1

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Requested exact protected-main SHA; execution disabled pending #1576
        required: true
        type: string
      external_authorization_issue:
        description: Reserved external authorization issue number; not executable until #1576 closes
        required: true
        type: string
      reason:
        description: Auditable deployment request reason; this input is not authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-pages-governed-staging-deploy-v1
  cancel-in-progress: false

jobs:
  validate:
    # Request-only metadata cannot authorize a provider deployment. Keep this
    # workflow fail-closed until an independently issued, source-bound and
    # atomically consumed authorization receipt exists under #1576.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject repository-self-authorized STAGING request
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          EXTERNAL_AUTHORIZATION_ISSUE: ${{ inputs.external_authorization_issue }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          echo "Cloudflare governed STAGING deployment is fail-closed under issue #1576."
          echo "Workflow inputs, actor identity, commit messages and repository files are not authorization."
          exit 78

  deploy:
    # Defense in depth: this credentialed job is permanently unreachable while
    # #1576 is open. The existing registered job/step/secret shape is retained
    # temporarily so secret-lane inventory cannot drift silently.
    if: ${{ false }}
    needs: validate
    environment: kidults-cloudflare-staging-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Execute governed Cloudflare STAGING deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          EXTERNAL_AUTHORIZATION_ISSUE: ${{ inputs.external_authorization_issue }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare governed STAGING deployment remains fail-closed under issue #1576."
          echo "No provider call or deployment is permitted."
          exit 78
