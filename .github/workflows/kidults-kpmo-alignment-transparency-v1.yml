name: KIDULTS KPMO Alignment Transparency v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/governance/kpmo-alignment-transparency-gate-v1.json'
      - 'coordination/kidults/governance/kpmo-cross-track-alignment-status-v1.json'
      - 'coordination/kidults/architecture/platform-market-funnel-alignment-v1.json'
      - 'scripts/kidults/architecture/validate-platform-market-funnel-alignment-v1.mjs'
      - 'scripts/kidults/governance/validate-kpmo-alignment-transparency-v1.mjs'
      - '.github/workflows/kidults-kpmo-alignment-transparency-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-alignment-transparency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Validate 100 percent alignment and transparency-by-design
        run: |
          node scripts/kidults/architecture/validate-platform-market-funnel-alignment-v1.mjs
          node scripts/kidults/governance/validate-kpmo-alignment-transparency-v1.mjs
