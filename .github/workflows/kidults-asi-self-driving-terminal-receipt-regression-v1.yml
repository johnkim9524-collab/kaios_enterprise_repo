name: KIDULTS ASI Self-Driving Terminal Receipt Regression v1

on:
  pull_request:
    paths:
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
      - '.github/workflows/kidults-asi-self-driving-terminal-receipt-regression-v1.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
      - '.github/workflows/kidults-asi-self-driving-terminal-receipt-regression-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-receipt-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate terminal receipt fail-closed contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml';
          const source = fs.readFileSync(path, 'utf8');
          const terminalMarker = '      - name: TERMINAL — preserve authoritative Self-Driving result';
          const uploadMarker = '      - name: Upload authoritative Self-Driving terminal receipt';
          // Build GitHub-expression literals at runtime so the regression workflow's
          // own expression engine cannot pre-expand the strings being asserted.
          const jobStatusBinding = 'JOB_STATUS: $' + '{{ job.status }}';
          const sourceShaBinding = 'SOURCE_SHA: $' + '{{ github.event.pull_request.head.sha || github.sha }}';
          const fallbackShaBinding = 'SOURCE_SHA: $' + '{{ github.sha }}';

          function validate(text) {
            const terminalStart = text.indexOf(terminalMarker);
            const uploadStart = text.indexOf(uploadMarker);
            if (terminalStart < 0 || uploadStart < 0 || uploadStart <= terminalStart) {
              throw new Error('terminal/upload marker missing or ordered incorrectly');
            }
            const terminal = text.slice(terminalStart, uploadStart);
            const upload = text.slice(uploadStart);
            const terminalMust = [
              'if: always()',
              jobStatusBinding,
              sourceShaBinding,
              'executed_sha: $executed_sha',
              'execution_ref: $execution_ref',
              'asi-self-driving-terminal-receipt-v1.json',
              '"VERIFIED_FAIL"',
              '"SELF_DRIVING_JOB_NON_SUCCESS"',
              '"RED"',
              'promotion_eligible: false',
              'content_acquisition_authorized: false',
              'candidate_evidence_status: "NONE"',
              'track_b_status: "NOT_STARTED"',
              'projection_status: "NONE"',
              'provider_activation: "NOT_AUTHORIZED"',
              'public_state: "HOLD"',
              'production_state: "HOLD"',
              'g5_state: "HOLD"'
            ];
            for (const invariant of terminalMust) {
              if (!terminal.includes(invariant)) {
                throw new Error(`missing terminal invariant: ${invariant}`);
              }
            }
            const uploadMust = [
              'if: always()',
              'name: asi-self-driving-terminal-receipt-v1',
              'path: asi-self-driving-terminal-receipt-v1.json',
              'if-no-files-found: error'
            ];
            for (const invariant of uploadMust) {
              if (!upload.includes(invariant)) {
                throw new Error(`missing upload invariant: ${invariant}`);
              }
            }
          }

          validate(source);

          const mutations = [
            text => text.replace('if: always()', 'if: success()'),
            text => text.replace('"VERIFIED_FAIL"', '"VERIFIED_PASS"'),
            text => text.replace('"SELF_DRIVING_JOB_NON_SUCCESS"', '""'),
            text => text.replace('promotion_eligible: false', 'promotion_eligible: true'),
            text => text.replace(sourceShaBinding, fallbackShaBinding),
            text => {
              const uploadStart = text.indexOf(uploadMarker);
              return text.slice(0, uploadStart) + text.slice(uploadStart).replace('if: always()', 'if: success()');
            }
          ];

          mutations.forEach((mutate, index) => {
            const mutated = mutate(source);
            let rejected = false;
            try {
              validate(mutated);
            } catch {
              rejected = true;
            }
            if (!rejected) {
              throw new Error(`mutation canary ${index} escaped`);
            }
          });

          console.log(JSON.stringify({
            terminal_receipt_contract: 'VERIFIED_PASS',
            mutation_canaries: mutations.length
          }));
          NODE
