name: KIDULTS ASI Self-Driving Terminal Receipt Regression v1

on:
  pull_request:
    paths:
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
      - '.github/workflows/kidults-asi-self-driving-terminal-receipt-regression-v1.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
      - '.github/workflows/kidults-asi-self-driving-terminal-receipt-regression-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-receipt-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate terminal receipt fail-closed contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml';
          const source = fs.readFileSync(path, 'utf8');
          const terminalMarker = '      - name: TERMINAL — preserve authoritative Self-Driving result';
          const uploadMarker = '      - name: Upload authoritative Self-Driving terminal receipt';
          // Assemble expression literals at runtime so this guard's own Actions
          // expression engine cannot pre-expand the target strings being asserted.
          const jobStatusBinding = 'JOB_STATUS: $' + '{{ job.status }}';
          const sourceShaBinding = 'SOURCE_SHA: $' + '{{ github.event.pull_request.head.sha || github.sha }}';
          const fallbackShaBinding = 'SOURCE_SHA: $' + '{{ github.sha }}';

          function sections(text) {
            const terminalStart = text.indexOf(terminalMarker);
            const uploadStart = text.indexOf(uploadMarker);
            if (terminalStart < 0 || uploadStart < 0 || uploadStart <= terminalStart) {
              throw new Error('terminal/upload marker missing or ordered incorrectly');
            }
            return {
              terminalStart,
              uploadStart,
              terminal: text.slice(terminalStart, uploadStart),
              upload: text.slice(uploadStart)
            };
          }

          function validate(text) {
            const {terminal, upload} = sections(text);
            const terminalMust = [
              'if: always()',
              jobStatusBinding,
              sourceShaBinding,
              '--arg executed_sha "$GITHUB_SHA"',
              '--arg execution_ref "$GITHUB_REF"',
              "--arg id 'kidults-asi-self-driving-terminal-v1'",
              '"VERIFIED_FAIL"',
              '"SELF_DRIVING_JOB_NON_SUCCESS"',
              'promotion_eligible: false',
              'content_acquisition_authorized: false',
              'evidence_admission: "NONE"',
              'track_b_complete: false',
              'projection_ready: false',
              'public_release: "HOLD"',
              'production: "HOLD"',
              'g5: "HOLD"',
              '/tmp/asi-self-driving-terminal-receipt-v1.json'
            ];
            for (const invariant of terminalMust) {
              if (!terminal.includes(invariant)) {
                throw new Error(`missing terminal invariant: ${invariant}`);
              }
            }
            const uploadMust = [
              'if: always()',
              'name: asi-self-driving-terminal-receipt-v1',
              'path: /tmp/asi-self-driving-terminal-receipt-v1.json',
              'if-no-files-found: error'
            ];
            for (const invariant of uploadMust) {
              if (!upload.includes(invariant)) {
                throw new Error(`missing upload invariant: ${invariant}`);
              }
            }
          }

          function replaceTerminal(text, from, to) {
            const {terminalStart, uploadStart, terminal} = sections(text);
            if (!terminal.includes(from)) throw new Error(`terminal mutation source absent: ${from}`);
            return text.slice(0, terminalStart) + terminal.replace(from, to) + text.slice(uploadStart);
          }

          function replaceUpload(text, from, to) {
            const {uploadStart, upload} = sections(text);
            if (!upload.includes(from)) throw new Error(`upload mutation source absent: ${from}`);
            return text.slice(0, uploadStart) + upload.replace(from, to);
          }

          validate(source);

          const mutations = [
            text => replaceTerminal(text, 'if: always()', 'if: success()'),
            text => replaceTerminal(text, '"VERIFIED_FAIL"', '"VERIFIED_PASS"'),
            text => replaceTerminal(text, '"SELF_DRIVING_JOB_NON_SUCCESS"', '""'),
            text => replaceTerminal(text, 'promotion_eligible: false', 'promotion_eligible: true'),
            text => replaceTerminal(text, sourceShaBinding, fallbackShaBinding),
            text => replaceTerminal(text, 'evidence_admission: "NONE"', 'evidence_admission: "ADMITTED"'),
            text => replaceUpload(text, 'if: always()', 'if: success()')
          ];

          mutations.forEach((mutate, index) => {
            const mutated = mutate(source);
            let rejected = false;
            try {
              validate(mutated);
            } catch {
              rejected = true;
            }
            if (!rejected) {
              throw new Error(`mutation canary ${index} escaped`);
            }
          });

          console.log(JSON.stringify({
            terminal_receipt_contract: 'VERIFIED_PASS',
            mutation_canaries: mutations.length
          }));
          NODE
