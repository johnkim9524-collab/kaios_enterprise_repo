name: KIDULTS Cloudflare Workers Shadow Deploy v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-workers-shadow-deploy-v2-consumed
  cancel-in-progress: false

jobs:
  deploy-shadow-v2:
    # Permanent non-executing tombstone.
    #
    # Approval CF-WORKERS-SHADOW-20260901-02 was consumed by the unique first
    # dispatch in run 33417453349. Wrangler 4.127.1 was invoked once and aborted
    # during local assets.directory validation before a workers.dev URL or
    # read-back existed. No replay or rerun is authorized.
    if: ${{ false }}
    environment: kidults-cloudflare-staging-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Checkout exact execution SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify consumed v2 approval tombstone
        shell: bash
        run: |
          set -euo pipefail
          AUTH='coordination/kidults/governance/cloudflare-workers-shadow-v2-authorization-20260901-v1.json'
          TERMINAL='coordination/kidults/governance/receipts/CF-WORKERS-SHADOW-20260901-02-terminal.json'
          jq -e '
            .id=="CF-WORKERS-SHADOW-20260901-02"
            and .status=="CONSUMED_FAIL_CLOSED_LOCAL_CONFIG_VALIDATION_NO_REMOTE_MUTATION_EVIDENCED"
            and .consumption_result.workflow_run_id==33417453349
            and .consumption_result.run_attempt==1
            and .consumption_result.provider_process_invoked==true
            and .consumption_result.provider_deployment_attempt_count==1
            and .consumption_result.wrangler_exit_code==1
            and .replay=="FORBIDDEN_AFTER_FIRST_V2_WORKFLOW_DISPATCH_REGARDLESS_OF_TERMINAL_STATE"' \
            "$AUTH" >/dev/null
          jq -e '
            .state=="CONSUMED_FAIL_CLOSED_LOCAL_CONFIG_VALIDATION_NO_REMOTE_MUTATION_EVIDENCED"
            and .workflow_run_id==33417453349
            and .job_id==99571430841
            and .provider_process_invoked==true
            and .provider_deployment_attempt_count==1
            and .workers_dev_url==null
            and .readback_executed==false
            and .replay_authorized==false' \
            "$TERMINAL" >/dev/null
          echo 'CONSUMED_V2_TOMBSTONE_NO_REPLAY'

      - name: Deploy one non-production Workers shadow v2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo 'CONSUMED_V2_TOMBSTONE_NO_PROVIDER_MUTATION'
          exit 78
