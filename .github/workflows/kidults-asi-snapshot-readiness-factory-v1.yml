name: KIDULTS ASI Snapshot Readiness Factory v1

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v1.mjs'
      - 'docs/kidults/asi/asi-snapshot-readiness-factory-v1.md'
      - '.github/workflows/kidults-asi-snapshot-readiness-factory-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v1.mjs'
      - 'docs/kidults/asi/asi-snapshot-readiness-factory-v1.md'
      - '.github/workflows/kidults-asi-snapshot-readiness-factory-v1.yml'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Owned Source Intelligence Graph v1'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-snapshot-readiness-factory-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess-snapshot-readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact source and syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v1.json','utf8'))"
      - name: Validate registered P3 assets and automatic continuation
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v1.mjs \
            | tee /tmp/kidults-asi-snapshot-readiness-factory-registry-validation-v1.json
      - name: Restore latest main P0, P1 and P2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0-expanded /tmp/p1-expanded /tmp/p2-expanded /tmp/p0 /tmp/p1 /tmp/p2
          P0_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="kidults-asi-mission-consumption-wave-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty')
          P1_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="kidults-asi-candidate-preflight-wave-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty')
          P2_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="kidults-asi-owned-source-intelligence-graph-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty')
          test -n "$P0_ID"
          test -n "$P1_ID"
          test -n "$P2_ID"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0_ID}/zip" > /tmp/p0.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P1_ID}/zip" > /tmp/p1.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P2_ID}/zip" > /tmp/p2.zip
          unzip -q -o /tmp/p0.zip -d /tmp/p0-expanded
          unzip -q -o /tmp/p1.zip -d /tmp/p1-expanded
          unzip -q -o /tmp/p2.zip -d /tmp/p2-expanded
          for NAME in mission-consumption-ledger-v1.json mission-lane-coverage-v1.json; do
            FILE=$(find /tmp/p0-expanded -type f -name "$NAME" -print -quit)
            test -n "$FILE"
            cp "$FILE" "/tmp/p0/$NAME"
          done
          for NAME in candidate-preflight-assignment-v1.json candidate-admission-readiness-v1.json; do
            FILE=$(find /tmp/p1-expanded -type f -name "$NAME" -print -quit)
            test -n "$FILE"
            cp "$FILE" "/tmp/p1/$NAME"
          done
          for NAME in owned-source-intelligence-graph-v1.json owned-source-intelligence-lineage-v1.json owned-source-intelligence-quality-v1.json owned-source-intelligence-value-receipt-v1.json; do
            FILE=$(find /tmp/p2-expanded -type f -name "$NAME" -print -quit)
            test -n "$FILE"
            cp "$FILE" "/tmp/p2/$NAME"
          done
          echo "p0_artifact_id=$P0_ID"
          echo "p1_artifact_id=$P1_ID"
          echo "p2_artifact_id=$P2_ID"
      - name: Build snapshot readiness factory twice
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v1.mjs \
            /tmp/p2/owned-source-intelligence-graph-v1.json \
            /tmp/p2/owned-source-intelligence-lineage-v1.json \
            /tmp/p2/owned-source-intelligence-quality-v1.json \
            /tmp/p2/owned-source-intelligence-value-receipt-v1.json \
            /tmp/p1/candidate-preflight-assignment-v1.json \
            /tmp/p1/candidate-admission-readiness-v1.json \
            /tmp/p0/mission-consumption-ledger-v1.json \
            /tmp/p0/mission-lane-coverage-v1.json \
            coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v1.json \
            /tmp/kidults-asi-snapshot-readiness-factory-run-1 \
            | tee /tmp/kidults-asi-snapshot-readiness-factory-live-summary-v1.json
          TZ=Pacific/Honolulu LANG=C LC_ALL=C node scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v1.mjs \
            /tmp/p2/owned-source-intelligence-graph-v1.json \
            /tmp/p2/owned-source-intelligence-lineage-v1.json \
            /tmp/p2/owned-source-intelligence-quality-v1.json \
            /tmp/p2/owned-source-intelligence-value-receipt-v1.json \
            /tmp/p1/candidate-preflight-assignment-v1.json \
            /tmp/p1/candidate-admission-readiness-v1.json \
            /tmp/p0/mission-consumption-ledger-v1.json \
            /tmp/p0/mission-lane-coverage-v1.json \
            coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v1.json \
            /tmp/kidults-asi-snapshot-readiness-factory-run-2
          diff -qr /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/kidults-asi-snapshot-readiness-factory-run-2
      - name: Validate P3 snapshot readiness and file absence
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs \
            /tmp/kidults-asi-snapshot-readiness-factory-run-1 \
            /tmp/p2/owned-source-intelligence-graph-v1.json \
            /tmp/p2/owned-source-intelligence-lineage-v1.json \
            /tmp/p2/owned-source-intelligence-quality-v1.json \
            /tmp/p2/owned-source-intelligence-value-receipt-v1.json \
            /tmp/p1/candidate-preflight-assignment-v1.json \
            /tmp/p1/candidate-admission-readiness-v1.json \
            /tmp/p0/mission-consumption-ledger-v1.json \
            /tmp/p0/mission-lane-coverage-v1.json \
            coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v1.json \
            | tee /tmp/kidults-asi-snapshot-readiness-factory-validation-v1.json
      - name: Reject false snapshot-candidate file mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-false-snapshot
          printf '%s\n' '{"id":"fabricated"}' > /tmp/bad-false-snapshot/snapshot-candidate.json
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs /tmp/bad-false-snapshot /tmp/p2/owned-source-intelligence-graph-v1.json /tmp/p2/owned-source-intelligence-lineage-v1.json /tmp/p2/owned-source-intelligence-quality-v1.json /tmp/p2/owned-source-intelligence-value-receipt-v1.json /tmp/p1/candidate-preflight-assignment-v1.json /tmp/p1/candidate-admission-readiness-v1.json /tmp/p0/mission-consumption-ledger-v1.json /tmp/p0/mission-lane-coverage-v1.json; then
            echo 'Validator accepted false snapshot-candidate.json' >&2
            exit 1
          fi
      - name: Reject false evidence admission mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-false-admission
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-false-admission/snapshot-readiness-ledger-v1.json';const x=JSON.parse(fs.readFileSync(p));x.counts.admitted_evidence=1;x.snapshot_creation_gate_pass=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs /tmp/bad-false-admission /tmp/p2/owned-source-intelligence-graph-v1.json /tmp/p2/owned-source-intelligence-lineage-v1.json /tmp/p2/owned-source-intelligence-quality-v1.json /tmp/p2/owned-source-intelligence-value-receipt-v1.json /tmp/p1/candidate-preflight-assignment-v1.json /tmp/p1/candidate-admission-readiness-v1.json /tmp/p0/mission-consumption-ledger-v1.json /tmp/p0/mission-lane-coverage-v1.json; then
            echo 'Validator accepted false evidence admission' >&2
            exit 1
          fi
      - name: Reject Track B assessment-start mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-track-b-start
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-track-b-start/track-b-handoff-readiness-v1.json';const x=JSON.parse(fs.readFileSync(p));x.state='READY_FOR_INDEPENDENT_ASSESSMENT';x.independent_assessment_started=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs /tmp/bad-track-b-start /tmp/p2/owned-source-intelligence-graph-v1.json /tmp/p2/owned-source-intelligence-lineage-v1.json /tmp/p2/owned-source-intelligence-quality-v1.json /tmp/p2/owned-source-intelligence-value-receipt-v1.json /tmp/p1/candidate-preflight-assignment-v1.json /tmp/p1/candidate-admission-readiness-v1.json /tmp/p0/mission-consumption-ledger-v1.json /tmp/p0/mission-lane-coverage-v1.json; then
            echo 'Validator accepted Track B assessment start without input pair' >&2
            exit 1
          fi
      - name: Reject missing blocker mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-missing-blocker
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-missing-blocker/immutable-blocker-package-v1.json';const x=JSON.parse(fs.readFileSync(p));x.blockers=x.blockers.filter(v=>v.blocker_class!=='EVIDENCE_ADMISSION_ZERO');x.blocker_count=x.blockers.length;x.p0_blocker_count=x.blockers.filter(v=>v.severity==='P0').length;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs /tmp/bad-missing-blocker /tmp/p2/owned-source-intelligence-graph-v1.json /tmp/p2/owned-source-intelligence-lineage-v1.json /tmp/p2/owned-source-intelligence-quality-v1.json /tmp/p2/owned-source-intelligence-value-receipt-v1.json /tmp/p1/candidate-preflight-assignment-v1.json /tmp/p1/candidate-admission-readiness-v1.json /tmp/p0/mission-consumption-ledger-v1.json /tmp/p0/mission-lane-coverage-v1.json; then
            echo 'Validator accepted missing critical blocker' >&2
            exit 1
          fi
      - name: Reject blocker-package-as-evidence-package mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-blocker-evidence
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-blocker-evidence/immutable-blocker-package-v1.json';const x=JSON.parse(fs.readFileSync(p));x.package_is_evidence_package=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs /tmp/bad-blocker-evidence /tmp/p2/owned-source-intelligence-graph-v1.json /tmp/p2/owned-source-intelligence-lineage-v1.json /tmp/p2/owned-source-intelligence-quality-v1.json /tmp/p2/owned-source-intelligence-value-receipt-v1.json /tmp/p1/candidate-preflight-assignment-v1.json /tmp/p1/candidate-admission-readiness-v1.json /tmp/p0/mission-consumption-ledger-v1.json /tmp/p0/mission-lane-coverage-v1.json; then
            echo 'Validator accepted blocker package as Evidence Package' >&2
            exit 1
          fi
      - name: Reject manual-only P3 activation mutation
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v1.json /tmp/snapshot-factory-registry.json
          node - <<'NODE'
          const fs=require('fs');const p='coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v1.json';const x=JSON.parse(fs.readFileSync(p));x.automatic_activation.main_push=false;x.automatic_activation.upstream_workflow=null;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v1.mjs; then
            echo 'Validator accepted manual-only P3 activation' >&2
            exit 1
          fi
          mv /tmp/snapshot-factory-registry.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v1.json
      - name: Revalidate pristine P3 factory and registry
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v1.mjs \
            > /tmp/kidults-asi-snapshot-readiness-factory-registry-final-validation-v1.json
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v1.mjs \
            /tmp/kidults-asi-snapshot-readiness-factory-run-1 \
            /tmp/p2/owned-source-intelligence-graph-v1.json \
            /tmp/p2/owned-source-intelligence-lineage-v1.json \
            /tmp/p2/owned-source-intelligence-quality-v1.json \
            /tmp/p2/owned-source-intelligence-value-receipt-v1.json \
            /tmp/p1/candidate-preflight-assignment-v1.json \
            /tmp/p1/candidate-admission-readiness-v1.json \
            /tmp/p0/mission-consumption-ledger-v1.json \
            /tmp/p0/mission-lane-coverage-v1.json \
            coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v1.json \
            > /tmp/kidults-asi-snapshot-readiness-factory-final-validation-v1.json
      - name: Emit KPMO P3 readiness receipt
        run: |
          node - <<'NODE' >/tmp/kidults-asi-snapshot-readiness-factory-receipt-v1.json
          const fs=require('fs');const crypto=require('crypto');const p='/tmp/kidults-asi-snapshot-readiness-factory-run-1/snapshot-readiness-manifest-v1.json';const m=JSON.parse(fs.readFileSync(p));const digest='sha256:'+crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');process.stdout.write(JSON.stringify({id:'kidults-asi-snapshot-readiness-factory-receipt-v1',state:'VERIFIED_PASS',source_sha:process.env.GITHUB_SHA,trigger_event:process.env.GITHUB_EVENT_NAME,manifest_digest:digest,results:m.results,autonomous_effect:m.autonomous_effect,global_effect:m.global_effect,irreplaceable_value_effect:m.irreplaceable_value_effect,transparency_effect:m.transparency_effect,snapshot_candidate_generated:false,evidence_package_generated:false,track_b_assessment_started:false,evidence_admitted:0,market_events_created:0,public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/kidults-asi-snapshot-readiness-factory-receipt-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-snapshot-readiness-factory-v1
          path: |
            /tmp/p0
            /tmp/p1
            /tmp/p2
            /tmp/kidults-asi-snapshot-readiness-factory-run-1
            /tmp/kidults-asi-snapshot-readiness-factory-live-summary-v1.json
            /tmp/kidults-asi-snapshot-readiness-factory-registry-validation-v1.json
            /tmp/kidults-asi-snapshot-readiness-factory-registry-final-validation-v1.json
            /tmp/kidults-asi-snapshot-readiness-factory-validation-v1.json
            /tmp/kidults-asi-snapshot-readiness-factory-final-validation-v1.json
            /tmp/kidults-asi-snapshot-readiness-factory-receipt-v1.json
          retention-days: 90
          if-no-files-found: error
