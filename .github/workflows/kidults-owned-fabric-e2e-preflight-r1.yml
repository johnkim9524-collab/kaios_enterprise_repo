name: KIDULTS Owned Fabric E2E Preflight R1
on:
  pull_request:
    paths:
      - 'scripts/kidults/architecture/build-owned-fabric-e2e-preflight-r1.mjs'
      - 'coordination/kidults/**'
      - '.github/workflows/kidults-owned-fabric-e2e-preflight-r1.yml'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build exact current E2E state
        run: node scripts/kidults/architecture/build-owned-fabric-e2e-preflight-r1.mjs /tmp/kidults-owned-fabric-e2e-preflight-r1.json
      - name: Verify fail-closed blocker isolation
        run: |
          node - <<'NODE'
          const x=require('/tmp/kidults-owned-fabric-e2e-preflight-r1.json');
          if(x.production!=='HOLD'||x.e2e_empirical_pass!==false||x.architecture_redesign_required!==false||x.provider_global_truth!==false) process.exit(1);
          if(x.stages.market_event_graph!=='BLOCKED_NO_STRICT_CURRENT_SOLD_SOURCE'||x.stages.immutable_candidate!=='BLOCKED_NOT_CREATED') process.exit(1);
          console.log('Owned-fabric E2E preflight truth boundary PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-owned-fabric-e2e-preflight-r1
          path: /tmp/kidults-owned-fabric-e2e-preflight-r1.json
          retention-days: 30
