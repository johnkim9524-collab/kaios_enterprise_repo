name: KIDULTS ASI Real Source Processor Bridge R1

on:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/build-real-source-processor-bridge-r1.mjs'
      - 'scripts/kidults/source-intelligence/run-met-real-source-admission-r1.mjs'
      - 'scripts/kidults/source-intelligence/run-getty-historical-sale-r1.mjs'
      - '.github/workflows/kidults-asi-real-source-processor-bridge-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  bridge-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
      - name: Retrieve live rights-admitted identity/context source
        run: node scripts/kidults/source-intelligence/run-met-real-source-admission-r1.mjs /tmp/met-real-source-admission-r1.json
      - name: Retrieve live rights-admitted historical transaction source
        run: node scripts/kidults/source-intelligence/run-getty-historical-sale-r1.mjs /tmp/getty-historical-sale-r1.json
      - name: Build deterministic real-source processor bridge
        run: node scripts/kidults/source-intelligence/build-real-source-processor-bridge-r1.mjs /tmp/met-real-source-admission-r1.json /tmp/getty-historical-sale-r1.json /tmp/asi-real-source-processor-bridge-r1.json
      - name: Re-run existing Queue/D1 processor mesh controls
        working-directory: services/kidults-autonomous-intelligence
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run asi:processor:test
          npm run asi:processor:e2e
      - name: Assert bridge truth boundary
        run: |
          node -e "const x=require('/tmp/asi-real-source-processor-bridge-r1.json'); if(x.deterministic_replay.state!=='PASS'||x.market_event_admission_report.state!=='PASS_HISTORICAL_ONLY'||x.candidate_handoff_preflight.ready!==false||x.processor_run_manifest.processor_mesh_execution!=='NOT_RUN_BY_THIS_BRIDGE'||x.production_mutation!==false) process.exit(1); console.log('Bridge preflight PASS; empirical real-source Queue/D1 injection remains explicitly open.')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-asi-real-source-processor-bridge-r1
          path: |
            /tmp/met-real-source-admission-r1.json
            /tmp/getty-historical-sale-r1.json
            /tmp/asi-real-source-processor-bridge-r1.json
          if-no-files-found: error
          retention-days: 30
