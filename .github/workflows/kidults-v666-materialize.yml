name: KIDULTS V666 Materialize Experience Closure

on:
  push:
    branches: [fix/kidults-v666-experience-closure]
    paths:
      - '.github/workflows/kidults-v666-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V666 branch
        uses: actions/checkout@v4
        with:
          ref: fix/kidults-v666-experience-closure
          fetch-depth: 0

      - name: Apply V666 portal contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path.cwd()
          portal = root / 'apps/kidults-enterprise-staging/public/portal'

          def replace(path, old, new, expected=1):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          index = portal / 'index.html'
          replace(index, 'data-portal-hotfix="v664"', 'data-portal-hotfix="v666"')
          replace(index, '<meta name="kidults-hotfix-version" content="664">', '<meta name="kidults-hotfix-version" content="666">')
          replace(
              index,
              '  <link id="kidults-v664-visible-footer-style" rel="stylesheet" href="components/v664-visible-hero-footer.css?v=664">\n',
              '  <link id="kidults-v664-visible-footer-style" rel="stylesheet" href="components/v664-visible-hero-footer.css?v=664">\n'
              '  <link id="kidults-v666-experience-closure-style" rel="stylesheet" href="components/v666-experience-closure.css?v=666">\n'
          )
          replace(index, '<script type="module" src="portal.js?v=662-visual95-final"></script>', '<script type="module" src="portal.js?v=666"></script>')
          replace(index, 'data-hero-asset="racing-roadster-v662"', 'data-hero-asset="racing-roadster-v666"')
          replace(index, 'data-hero-revision="v664-visible-footer"', 'data-hero-revision="v666-experience-closure"')
          replace(
              index,
              'src="assets/hero/racing-roadster-v662.webp?v=662-visual95-final" alt="KIDULTS original deep green racing roadster in a warm limestone studio"',
              'src="assets/hero/racing-roadster-v666.svg?v=666" alt="KIDULTS original deep green racing roadster on one neutral warm limestone surface"'
          )

          portal_js = portal / 'portal.js'
          replace(portal_js, 'mobile-hero-visibility.js?v=662-visual95-final', 'mobile-hero-visibility.js?v=666')
          replace(portal_js, 'editorial-assets.js?v=662-visual95-final', 'editorial-assets.js?v=666')
          replace(portal_js, 'homepage-structure.js?v=662-visual95-final', 'homepage-structure.js?v=666')
          replace(portal_js, 'renderers.js?v=662', 'renderers.js?v=666')
          replace(
              portal_js,
              'function determineDataState(data) {',
              '''const EXPERIENCE_STYLE_ID = "kidults-v666-experience-closure-style";

          function ensureExperienceClosureStylesheet() {
            const href = "components/v666-experience-closure.css?v=666";
            let link = document.getElementById(EXPERIENCE_STYLE_ID);
            if (!link) {
              link = document.createElement("link");
              link.id = EXPERIENCE_STYLE_ID;
              link.rel = "stylesheet";
            }
            link.href = href;
            document.head.append(link);
            return link;
          }

          function determineDataState(data) {'''
          )
          replace(
              portal_js,
              '''  document.documentElement.dataset.release = "v502";
            document.documentElement.dataset.experience = "living-intelligence-v6";
            document.documentElement.dataset.homepageStructure = "v662";''',
              '''  document.documentElement.dataset.release = "v502";
            document.documentElement.dataset.experience = "living-intelligence-v6";
            document.documentElement.dataset.homepageStructure = "v662";
            document.documentElement.dataset.portalHotfix = "v666";
            document.documentElement.dataset.experienceClosure = "v666";
            ensureExperienceClosureStylesheet();'''
          )
          replace(
              portal_js,
              '''    startMobileReconstruction();
              startMobileHeroVisibility({ manifest: data.manifest });
              startHomepageStructure();''',
              '''    startMobileReconstruction();
              startMobileHeroVisibility({ manifest: data.manifest });
              startHomepageStructure();
              ensureExperienceClosureStylesheet();
              requestAnimationFrame(ensureExperienceClosureStylesheet);'''
          )
          replace(
              portal_js,
              '      assetBindingHotfix: window.KIDULTS_ASSET_BINDING_HOTFIX?.version ?? "NOT AVAILABLE"',
              '      assetBindingHotfix: window.KIDULTS_ASSET_BINDING_HOTFIX?.version ?? "NOT AVAILABLE",\n      experienceClosure: "v666"'
          )

          editorial = portal / 'components/editorial-assets.js'
          replace(editorial, 'const VERSION = "4.1.0";', 'const VERSION = "4.2.0";')
          replace(editorial, 'const ROADSTER_KEY = "racing-roadster-v662";', 'const ROADSTER_KEY = "racing-roadster-v666";')
          replace(editorial, 'const ROADSTER_SOURCE = `assets/hero/racing-roadster-v662.webp?v=${ASSET_QUERY}`;', 'const ROADSTER_SOURCE = "assets/hero/racing-roadster-v666.svg?v=666";')
          replace(editorial, 'const VISUAL_SYSTEM = "single-studio-v662-visual95";', 'const VISUAL_SYSTEM = "single-studio-v662-visual95";\nconst HERO_VISUAL_SYSTEM = "single-surface-v666";')
          replace(editorial, 'function prepareImage(image, source, alt) {', 'function prepareImage(image, source, alt, visualSystem = VISUAL_SYSTEM) {')
          replace(editorial, '  image.dataset.visualSystem = VISUAL_SYSTEM;', '  image.dataset.visualSystem = visualSystem;')
          replace(
              editorial,
              '''    "KIDULTS original deep green racing roadster in a neutral warm limestone editorial studio"
            );''',
              '''    "KIDULTS original deep green racing roadster on one neutral warm limestone surface",
              HERO_VISUAL_SYSTEM
            );
            card.dataset.visualSystem = HERO_VISUAL_SYSTEM;
            card.dataset.heroRevision = "v666-experience-closure";'''
          )
          replace(
              editorial,
              '''    visualSystem: VISUAL_SYSTEM,
              rebind: apply''',
              '''    visualSystem: VISUAL_SYSTEM,
              heroVisualSystem: HERO_VISUAL_SYSTEM,
              rebind: apply'''
          )

          mobile = portal / 'components/mobile-hero-visibility.js'
          replace(mobile, 'const VERSION = "2.1.0";', 'const VERSION = "2.2.0";')
          replace(mobile, 'const ASSET_VERSION = "662";', 'const ASSET_VERSION = "666";')
          replace(mobile, 'const CACHE_REVISION = "visual95";', 'const CACHE_REVISION = "experience-closure";')
          replace(mobile, 'const FINAL_TUNE_REVISION = "final";', 'const FINAL_TUNE_REVISION = "single-surface";')
          replace(mobile, 'const HERO_KEY = "racing-roadster-v662";', 'const HERO_KEY = "racing-roadster-v666";')
          replace(mobile, 'const RETRY_ASSET = null;', 'const RETRY_ASSET = "assets/hero/racing-roadster-v662.webp";')
          replace(mobile, 'fill="#f1ebe2"', 'fill="#f4f2ee"')

          manifest_path = portal / 'data/v502-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['hero']['asset'] = 'assets/hero/racing-roadster-v666.svg'
          manifest['hero']['alt'] = 'KIDULTS original deep green racing roadster on one neutral warm limestone surface'
          manifest['build_at'] = '2026-08-15T19:30:00+09:00'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          homepage = portal / 'components/homepage-structure.js'
          replace(homepage, 'const VERSION = "2.0.0";', 'const VERSION = "2.1.0";')
          replace(
              homepage,
              'Ask Registry-grounded questions, compare objects and categories, or review structured decision support in a dedicated environment.',
              'A shared intelligence playground for collectors and institutions—explore signals, compare objects and turn governed evidence into action.'
          )

          workflow = root / '.github/workflows/kidults-v666-materialize.yml'
          workflow.unlink()
          PY

      - name: Verify V666 source markers
        run: |
          set -euo pipefail
          portal='apps/kidults-enterprise-staging/public/portal'
          grep -q 'data-portal-hotfix="v666"' "$portal/index.html"
          grep -q 'v666-experience-closure.css?v=666' "$portal/index.html"
          grep -q 'racing-roadster-v666.svg?v=666' "$portal/index.html"
          grep -q 'single-surface-v666' "$portal/components/editorial-assets.js"
          grep -q 'collectors and institutions' "$portal/components/homepage-structure.js"
          test -f "$portal/assets/hero/racing-roadster-v666.svg"

      - name: Commit V666 materialization
        run: |
          set -euo pipefail
          git config user.name 'KIDULTS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(kidults): materialize V666 experience closure'
          git push origin HEAD:fix/kidults-v666-experience-closure
