name: KIDULTS Global Data Acquisition Master Matrix v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/global-data-acquisition-master-matrix-v1.json'
      - 'coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-global-regional-market-balance-policy-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'scripts/kidults/source-intelligence/build-global-data-acquisition-master-matrix-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-global-data-acquisition-master-matrix-v1.mjs'
      - '.github/workflows/kidults-global-data-acquisition-master-matrix-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-master-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build deterministic acquisition matrix
        run: node scripts/kidults/source-intelligence/build-global-data-acquisition-master-matrix-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json
      - name: Validate structural counts and fail-closed truth
        run: node scripts/kidults/source-intelligence/validate-global-data-acquisition-master-matrix-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json
      - name: Enforce axis separation and no operational promotion
        run: |
          node - <<'NODE'
          const x=require('/tmp/global-data-acquisition-master-matrix-v1.json');
          const rows=x.evidence_bindings;
          if(new Set(rows.map(r=>r.category_scope)).size!==32) throw new Error('CATEGORY_AXIS');
          if(new Set(rows.map(r=>r.macroregion_id)).size!==8) throw new Error('REGION_AXIS');
          if(new Set(rows.map(r=>r.sourcing_channel)).size!==7) throw new Error('CHANNEL_AXIS');
          if(new Set(rows.map(r=>r.evidence_class)).size!==8) throw new Error('EVIDENCE_AXIS');
          if(rows.some(r=>r.rights_state==='ALLOW'||r.admission_state==='ADMITTED'||r.evidence_state==='VERIFIED_BOUNDED')) throw new Error('STRUCTURE_OVERCLAIM');
          if(rows.some(r=>r.analytical_weight!==null||r.raw_record_count_weight!==0)) throw new Error('WEIGHT_OVERCLAIM');
          if(x.production!=='HOLD'||x.public_release!=='HOLD') throw new Error('RELEASE');
          console.log(JSON.stringify({status:'PASS',base_execution_cells:x.structural_counts.base_execution_cells,evidence_binding_rows:x.structural_counts.evidence_binding_rows,operational_promotion:false,production:'HOLD'}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-global-data-acquisition-master-matrix-v1
          path: /tmp/global-data-acquisition-master-matrix-v1.json
          if-no-files-found: error
          retention-days: 14
