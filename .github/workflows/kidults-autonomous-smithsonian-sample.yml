name: KIDULTS Autonomous Smithsonian Open Access Sample

on:
  push:
    branches:
      - "feat/kidults-phase2-content-data-provider-foundation"
    paths:
      - "coordination/kidults/autonomous/source-discovery/contracts/smithsonian-open-access-r1.json"
      - "scripts/kidults/autonomous/collect-smithsonian-open-access-sample.mjs"
      - "scripts/kidults/autonomous/validate-smithsonian-open-access-sample.mjs"
      - ".github/workflows/kidults-autonomous-smithsonian-sample.yml"
  schedule:
    - cron: "10 23 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-autonomous-smithsonian-sample
  cancel-in-progress: true

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    environment: kidults-smithsonian-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Syntax check
        run: |
          node --check scripts/kidults/autonomous/collect-smithsonian-open-access-sample.mjs
          node --check scripts/kidults/autonomous/validate-smithsonian-open-access-sample.mjs

      - name: Collect bounded live metadata sample
        env:
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
        run: |
          node scripts/kidults/autonomous/collect-smithsonian-open-access-sample.mjs \
            --output artifacts/autonomous-source-samples/smithsonian-open-access-r1 \
            --query design \
            --rows 50 \
            --limit 12 \
            --minimum-records 8

      - name: Validate evidence and safety gates
        run: |
          node scripts/kidults/autonomous/validate-smithsonian-open-access-sample.mjs \
            artifacts/autonomous-source-samples/smithsonian-open-access-r1

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-smithsonian-open-access-bounded-sample
          path: artifacts/autonomous-source-samples/smithsonian-open-access-r1
          if-no-files-found: error
          retention-days: 30
