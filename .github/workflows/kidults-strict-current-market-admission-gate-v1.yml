name: KIDULTS Strict Current Market Admission Gate v1

on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/strict-current-market-admission-gate-v1.json'
      - 'coordination/kidults/source-intelligence/collectaio-shadow-sold-admission-r1.json'
      - 'scripts/kidults/source-intelligence/validate-strict-current-market-admission-gate-v1.mjs'
      - '.github/workflows/kidults-strict-current-market-admission-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate strict current market fail-closed boundary
        run: node scripts/kidults/source-intelligence/validate-strict-current-market-admission-gate-v1.mjs
