name: KIDULTS Runtime Final Closure R7
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/kidults-runtime-final-closure-r7.yml']
concurrency:
  group: kidults-staging-runtime-mutation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  runtime-final-r7:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_STAGING_REBIND_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
      CLOUDFLARE_STAGING_QUEUE_TEST_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_QUEUE_TEST_TOKEN }}
      STAGING_WORKER: kidults-autonomous-intelligence-staging
      STAGING_D1: kidults-intelligence-db-staging
      STAGING_D1_ID: 9bc6a406-6fca-4959-be7f-dd7f715b092c
      PRODUCTION_D1: kidults-intelligence-db
      PRODUCTION_D1_ID: d6d65f81-f91d-428b-bf43-8a025aaa47bd
      CANONICAL_ROLLBACK_VERSION: d870f7e4-0919-47f7-becc-13524c393f27
      TARGET_QUEUE: kidults-asi-shadow-discovery-wikidata
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: GATE — bounded credentials and isolated STAGING
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          for V in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_READ_TOKEN CLOUDFLARE_STAGING_REBIND_TOKEN CLOUDFLARE_STAGING_QUEUE_TEST_TOKEN; do test -n "${!V:-}"; done
          echo "::add-mask::$CLOUDFLARE_READ_TOKEN"
          echo "::add-mask::$CLOUDFLARE_STAGING_REBIND_TOKEN"
          echo "::add-mask::$CLOUDFLARE_STAGING_QUEUE_TEST_TOKEN"
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const d=x.d1_databases.find(v=>v.binding==='DB');
          if(x.vars?.KIDULTS_ENV!=='staging'||x.vars?.ASI_MESH_MODE!=='SHADOW'||x.vars?.ASI_PUBLICATION_ENABLED!=='false') throw new Error('STAGING_BOUNDARY');
          if(!d||d.database_id!==process.env.PRODUCTION_D1_ID) throw new Error('CANONICAL_CONFIG_DRIFT');
          if((x.queues?.producers||[]).length!==26||(x.queues?.consumers||[]).length!==26) throw new Error('QUEUE_CONFIG_COUNT');
          d.database_name=process.env.STAGING_D1; d.database_id=process.env.STAGING_D1_ID; x.name=process.env.STAGING_WORKER; x.workers_dev=false; delete x.routes; delete x.route; delete x.triggers;
          x.vars={...(x.vars||{}),KIDULTS_ENV:'staging',ASI_MESH_MODE:'SHADOW',ASI_PUBLICATION_ENABLED:'false'};
          fs.writeFileSync('wrangler.runtime-r7.generated.json',JSON.stringify(x,null,2));
          NODE
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_READ_TOKEN" npx wrangler d1 info "$STAGING_D1" --json > /tmp/staging-info.json
          grep -Fq "$STAGING_D1_ID" /tmp/staging-info.json
          if grep -Fq "$PRODUCTION_D1_ID" /tmp/staging-info.json; then exit 10; fi
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_STAGING_REBIND_TOKEN" npx wrangler versions view "$CANONICAL_ROLLBACK_VERSION" --name "$STAGING_WORKER" --json > /tmp/canonical-before.json
          grep -Fq "$STAGING_D1_ID" /tmp/canonical-before.json || grep -Fq "$STAGING_D1" /tmp/canonical-before.json

      - name: BUILD — idempotency and throughput harness
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run typecheck
          python - <<'PY'
          from pathlib import Path
          p=Path('src/worker.ts'); s=p.read_text()
          old="""  async queue(batch: MessageBatch<AsiQueueTask>, env: Env): Promise<void> {\n    await consumeAsiBatch(batch,env);\n  },"""
          new="""  async queue(batch: MessageBatch<AsiQueueTask>, env: Env): Promise<void> {\n    const controls=batch.messages.filter((message)=>{ const body=message.body as unknown as {control?:string;events?:unknown[]}; return body?.control==='KPMO_RUNTIME_FINAL_R7'&&Array.isArray(body.events)&&body.events.length===5; });\n    if(controls.length){\n      if(controls.length!==1) throw new Error('KPMO_RUNTIME_R7_CONTROL_NOT_UNIQUE');\n      for(const message of batch.messages){ const body=message.body as unknown as {control?:string;events?:unknown[]}; if(body?.control==='KPMO_RUNTIME_FINAL_R7'&&Array.isArray(body.events)&&body.events.length===5){ await enqueueAsiEvent(env,body.events[0]); await enqueueAsiEvent(env,body.events[0]); for(const event of body.events.slice(1)) await enqueueAsiEvent(env,event); message.ack(); } else { message.retry({delaySeconds:15}); } }\n      return;\n    }\n    await consumeAsiBatch(batch,env);\n  },"""
          if old not in s: raise SystemExit('QUEUE_HANDLER_PATCH_TARGET_NOT_FOUND')
          p.write_text(s.replace(old,new))
          PY
          npm run typecheck
          npx wrangler deploy --config wrangler.runtime-r7.generated.json --dry-run --outdir /tmp/runtime-r7-dry-run

      - name: DEPLOY — temporary no-route harness
        working-directory: services/kidults-autonomous-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: /tmp/runtime-r7-upload.ndjson
        run: |
          set -euo pipefail
          rm -f /tmp/runtime-r7-upload.ndjson
          START=$(date +%s%3N)
          npx wrangler versions upload --config wrangler.runtime-r7.generated.json --tag kpmo-runtime-final-r7 --message 'Temporary STAGING runtime closure R7; no route; no cron; Production HOLD'
          node - <<'NODE' > /tmp/harness.env
          const fs=require('fs'); const rows=fs.readFileSync('/tmp/runtime-r7-upload.ndjson','utf8').trim().split(/\n+/).filter(Boolean).map(JSON.parse); const x=[...rows].reverse().find(r=>r.type==='version-upload'&&r.version_id); if(!x) throw new Error('NO_HARNESS_VERSION'); console.log(`HARNESS_VERSION_ID=${x.version_id}`);
          NODE
          source /tmp/harness.env
          npx wrangler versions view "$HARNESS_VERSION_ID" --name "$STAGING_WORKER" --json > /tmp/harness-view.json
          grep -Fq "$STAGING_D1_ID" /tmp/harness-view.json || grep -Fq "$STAGING_D1" /tmp/harness-view.json
          if grep -Fq "$PRODUCTION_D1_ID" /tmp/harness-view.json; then exit 11; fi
          npx wrangler versions deploy "$HARNESS_VERSION_ID@100%" --name "$STAGING_WORKER" --message 'KPMO runtime final closure R7' -y
          END=$(date +%s%3N); printf 'DEPLOY_MS=%s\n' "$((END-START))" > /tmp/r7-metrics.env

      - name: SEED — five unique events with one canonical duplicate replay
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/r7.env
          const crypto=require('crypto'),fs=require('fs');
          const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
          const sha=v=>'sha256:'+crypto.createHash('sha256').update(typeof v==='string'?v:JSON.stringify(canonical(v))).digest('hex');
          const run=crypto.randomBytes(8).toString('hex'), now=new Date().toISOString(), events=[];
          for(let i=0;i<5;i++){const host=`kpmo-r7-${run}-${i}.example.com`,source=`source_kpmo_r7_${run}_${i}`,eventId=`evt_kpmo_r7_${run}_${i}`,corr=`corr_kpmo_r7_${run}_${i}`; const payload={source_id:source,discovery_seed:{source_id:source,seed_ref:'KPMO_SYNTHETIC_RESERVED_EXAMPLE_SUBDOMAIN',canonical_host:host,discovery_rights_state:'ALLOW'},test_control:{synthetic:true,market_claim:false,provider_payload:false,production:false}}; events.push({event_id:eventId,event_type:'SOURCE_DISCOVERY_REQUESTED',event_version:'1.0.0',occurred_at:now,observed_at:now,producer_engine:'KPMO_RUNTIME_FINAL_R7',producer_version:'1.0.0',correlation_id:corr,causation_id:null,idempotency_key:`idem_${eventId}`,partition:{channel:'WIKIDATA_OFFICIAL_WEBSITE_GRAPH',region:'NORTH_AMERICA',language:'en',scope_id:'vinyl_recorded_music',source_role:'REFERENCE_ONLY',canonical_host_hash:sha(host)},input_snapshot_ref:'kpmo-runtime-r7-synthetic',payload_hash:sha(payload),rights_state:'ALLOW',freshness_state:'CURRENT',assertion_purpose:'BOUNDED_SHADOW_ACQUISITION',decision:'PASS',reason_codes:['KPMO_RUNTIME_FINAL_R7_SYNTHETIC'],trace_refs:['KPMO_RUNTIME_FINAL_R7'],payload});}
          fs.writeFileSync('/tmp/r7-seed.json',JSON.stringify({body:{control:'KPMO_RUNTIME_FINAL_R7',events}})); fs.writeFileSync('/tmp/r7-ids.json',JSON.stringify(events.map(e=>({event_id:e.event_id,source_id:e.payload.source_id,host:e.payload.discovery_seed.canonical_host})))); console.log(`RUN_ID=${run}`); console.log(`EVENT_IDS=${events.map(e=>e.event_id).join(',')}`);
          NODE
          source /tmp/r7.env
          IDS=$(node -e "const a=require('/tmp/r7-ids.json');process.stdout.write(a.map(x=>\"'\"+x.event_id+\"'\").join(','))")
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_READ_TOKEN" npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT COUNT(*) AS existing FROM asi_event_log WHERE event_id IN ($IDS)" --json > /tmp/pre.json
          node -e "const x=require('/tmp/pre.json');if(Number(x?.[0]?.results?.[0]?.existing||0)!==0)process.exit(3)"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_STAGING_QUEUE_TEST_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" > /tmp/queues.json
          QUEUE_ID=$(Q="$TARGET_QUEUE" node -e "const x=require('/tmp/queues.json');const q=(x.result||[]).find(v=>(v.queue_name||v.name)===process.env.Q);if(!q)process.exit(2);process.stdout.write(q.queue_id||q.id)")
          START=$(date +%s%3N)
          curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_STAGING_QUEUE_TEST_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/messages" --data-binary @/tmp/r7-seed.json > /tmp/push.json
          END=$(date +%s%3N); grep -Fq '"success":true' /tmp/push.json; printf 'QUEUE_PUSH_MS=%s\n' "$((END-START))" >> /tmp/r7-metrics.env; printf 'BATCH_START_MS=%s\n' "$START" >> /tmp/r7-metrics.env

      - name: VERIFY — idempotency and five-event throughput
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          source /tmp/r7.env
          IDS=$(node -e "const a=require('/tmp/r7-ids.json');process.stdout.write(a.map(x=>\"'\"+x.event_id+\"'\").join(','))")
          PASS=0
          for i in $(seq 1 50); do
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_READ_TOKEN" npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT (SELECT COUNT(*) FROM asi_event_log WHERE event_id IN ($IDS)) AS events,(SELECT COUNT(*) FROM asi_outbox WHERE event_id IN ($IDS)) AS outboxes,(SELECT COUNT(DISTINCT event_id) FROM asi_processed_messages WHERE event_id IN ($IDS) AND status='SUCCEEDED') AS succeeded" --json > /tmp/state.json
            if node -e "const r=require('/tmp/state.json')?.[0]?.results?.[0]||{};process.exit(Number(r.events)===5&&Number(r.outboxes)===5&&Number(r.succeeded)===5?0:1)"; then PASS=1; break; fi
            sleep 3
          done
          test "$PASS" = 1
          FIRST=$(node -e "process.stdout.write(require('/tmp/r7-ids.json')[0].event_id)")
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_READ_TOKEN" npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT (SELECT COUNT(*) FROM asi_event_log WHERE event_id='$FIRST') AS event_rows,(SELECT COUNT(*) FROM asi_outbox WHERE event_id='$FIRST') AS outbox_rows,(SELECT COUNT(*) FROM asi_processed_messages WHERE event_id='$FIRST' AND status='SUCCEEDED') AS success_rows" --json > /tmp/idem.json
          node - <<'NODE'
          const r=require('/tmp/idem.json')?.[0]?.results?.[0]||{}; if(Number(r.event_rows)!==1||Number(r.outbox_rows)!==1||Number(r.success_rows)!==1) throw new Error(`IDEMPOTENCY_FAIL:${JSON.stringify(r)}`);
          NODE
          END=$(date +%s%3N); START=$(grep '^BATCH_START_MS=' /tmp/r7-metrics.env|cut -d= -f2); ELAPSED=$((END-START)); printf 'BATCH_VISIBLE_MS=%s\n' "$ELAPSED" >> /tmp/r7-metrics.env
          node -e "const fs=require('fs');const ms=Number(process.argv[1]);fs.writeFileSync('/tmp/throughput.json',JSON.stringify({events:5,elapsed_ms:ms,events_per_second:5/(ms/1000)},null,2))" "$ELAPSED"

      - name: BACKUP/RESTORE — logical STAGING snapshot into offline clone
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          source /tmp/r7.env
          START=$(date +%s%3N)
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_READ_TOKEN" npx wrangler d1 export "$STAGING_D1" --remote --output /tmp/staging-r7-backup.sql
          BEND=$(date +%s%3N); test -s /tmp/staging-r7-backup.sql; printf 'BACKUP_EXPORT_MS=%s\n' "$((BEND-START))" >> /tmp/r7-metrics.env
          RSTART=$(date +%s%3N)
          python - <<'PY'
          import sqlite3, pathlib
          sql=pathlib.Path('/tmp/staging-r7-backup.sql').read_text()
          db=sqlite3.connect('/tmp/staging-r7-restore.sqlite')
          db.executescript(sql); db.commit(); db.close()
          PY
          REND=$(date +%s%3N); printf 'RESTORE_MS=%s\n' "$((REND-RSTART))" >> /tmp/r7-metrics.env
          python - <<'PY'
          import sqlite3,json
          ids=[x['event_id'] for x in json.load(open('/tmp/r7-ids.json'))]
          db=sqlite3.connect('/tmp/staging-r7-restore.sqlite'); q=','.join('?'*len(ids));
          events=db.execute(f'SELECT COUNT(*) FROM asi_event_log WHERE event_id IN ({q})',ids).fetchone()[0]
          outboxes=db.execute(f'SELECT COUNT(*) FROM asi_outbox WHERE event_id IN ({q})',ids).fetchone()[0]
          succeeded=db.execute(f"SELECT COUNT(DISTINCT event_id) FROM asi_processed_messages WHERE event_id IN ({q}) AND status='SUCCEEDED'",ids).fetchone()[0]
          tables=db.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('asi_event_log','asi_outbox','asi_processed_messages','asi_dead_letters','asi_terminal_dlq_receipts')").fetchone()[0]
          db.close(); result={'restore_target':'EPHEMERAL_OFFLINE_SQLITE_CLONE','required_tables':tables,'control_events':events,'control_outboxes':outboxes,'control_succeeded':succeeded,'control_record_loss':5-events}; print(json.dumps(result)); json.dump(result,open('/tmp/restore.json','w'),indent=2)
          if tables!=5 or events!=5 or outboxes!=5 or succeeded!=5: raise SystemExit('RESTORE_VALIDATION_FAILED')
          PY
          sha256sum /tmp/staging-r7-backup.sql | awk '{print $1}' > /tmp/backup.sha256

      - name: VERIFY — Production remains read-only
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_READ_TOKEN" npx wrangler d1 execute "$PRODUCTION_D1" --remote --command "SELECT 1 AS production_read_probe" --json > /tmp/prod.json
          node - <<'NODE'
          const x=require('/tmp/prod.json');if(!x.every(v=>v.success===true)||x.some(v=>Number(v.meta?.rows_written||0)!==0||Number(v.meta?.changes||0)!==0)) throw new Error('PRODUCTION_MUTATION');
          NODE

      - name: ROLLBACK — restore canonical STAGING version
        if: always()
        working-directory: services/kidults-autonomous-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/harness.env ]; then exit 0; fi
          source /tmp/harness.env
          npx wrangler deployments list --name "$STAGING_WORKER" --json > /tmp/deployment-final.json
          MODE=$(H="$HARNESS_VERSION_ID" C="$CANONICAL_ROLLBACK_VERSION" node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/deployment-final.json','utf8'));const a=Array.isArray(x)?x:(x.result||x.deployments||[]);const d=[...a].sort((p,q)=>Date.parse(q.created_on||0)-Date.parse(p.created_on||0))[0];const s=JSON.stringify(d||{});process.stdout.write(s.includes(process.env.H)?'OWNED':s.includes(process.env.C)?'CANONICAL':'FOREIGN');
          NODE
          )
          if [ "$MODE" = FOREIGN ]; then echo 'Refusing foreign overwrite'; exit 20; fi
          if [ "$MODE" = OWNED ]; then START=$(date +%s%3N); npx wrangler versions deploy "$CANONICAL_ROLLBACK_VERSION@100%" --name "$STAGING_WORKER" --message 'KPMO R7 rollback' -y; END=$(date +%s%3N); printf 'ROLLBACK_MS=%s\n' "$((END-START))" >> /tmp/r7-metrics.env; fi
          npx wrangler deployments list --name "$STAGING_WORKER" --json > /tmp/restored-deployment.json
          V="$CANONICAL_ROLLBACK_VERSION" node -e "const x=require('/tmp/restored-deployment.json');const a=Array.isArray(x)?x:(x.result||x.deployments||[]);const d=[...a].sort((p,q)=>Date.parse(q.created_on||0)-Date.parse(p.created_on||0))[0];if(!JSON.stringify(d||{}).includes(process.env.V))process.exit(2)"

      - name: RECEIPT — recovery audit closure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7-safe; touch /tmp/r7-metrics.env
          node - <<'NODE'
          const fs=require('fs');const metrics={};for(const l of fs.readFileSync('/tmp/r7-metrics.env','utf8').split(/\n/)){const i=l.indexOf('=');if(i>0)metrics[l.slice(0,i)]=Number(l.slice(i+1))}
          const throughput=fs.existsSync('/tmp/throughput.json')?require('/tmp/throughput.json'):null;const restore=fs.existsSync('/tmp/restore.json')?require('/tmp/restore.json'):null;
          const receipt={state:throughput&&restore&&restore.control_record_loss===0?'RUNTIME_R7_CLOSURE_PASS':'RUNTIME_R7_INCOMPLETE',idempotency:'EXACT_ONE_EVENT_OUTBOX_SUCCESS_FOR_DUPLICATE_ENQUEUE',throughput,backup_restore:restore,backup_sha256:fs.existsSync('/tmp/backup.sha256')?'sha256:'+fs.readFileSync('/tmp/backup.sha256','utf8').trim():null,metrics_ms:metrics,recovery_audit:true,production_mutation:false,production:'HOLD'};
          fs.writeFileSync('/tmp/r7-safe/receipt.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify(receipt,null,2));if(receipt.state!=='RUNTIME_R7_CLOSURE_PASS')process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kidults-runtime-final-closure-r7
          path: /tmp/r7-safe/receipt.json
          if-no-files-found: error
          retention-days: 30
