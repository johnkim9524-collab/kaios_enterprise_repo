name: KIDULTS Recovery Role Partition V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/recovery-role-partition-v1.json'
      - 'scripts/kidults/kpmo/validate-recovery-role-partition-v1.mjs'
      - '.github/workflows/kidults-recovery-role-partition-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/kpmo/recovery-role-partition-v1.json'
      - 'scripts/kidults/kpmo/validate-recovery-role-partition-v1.mjs'
      - '.github/workflows/kidults-recovery-role-partition-v1.yml'

permissions:
  contents: read

jobs:
  independent-role-boundary-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize fail-closed role-boundary receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/recovery-role-partition-receipt.json" <<EOF
          {
            "receipt_id": "KIDULTS_RECOVERY_ROLE_PARTITION_WORKFLOW_RECEIPT_V1",
            "state": "VERIFIED_FAIL",
            "failure_class": "VALIDATION_NOT_COMPLETED",
            "repository": "$GITHUB_REPOSITORY",
            "workflow_run_id": $GITHUB_RUN_ID,
            "workflow_run_attempt": $GITHUB_RUN_ATTEMPT,
            "head_sha": "$EXPECTED_SHA",
            "provider_call_authority": "NONE",
            "credential_authority": "NONE",
            "production": "HOLD",
            "public": "HOLD",
            "g5": "HOLD"
          }
          EOF

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Verify exact source and independently validate role partition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/kpmo/validate-recovery-role-partition-v1.mjs
          node scripts/kidults/kpmo/validate-recovery-role-partition-v1.mjs --self-test
          node scripts/kidults/kpmo/validate-recovery-role-partition-v1.mjs > "$RUNNER_TEMP/recovery-role-partition-validation.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const validation = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/recovery-role-partition-validation.json`, 'utf8'));
          if (validation.state !== 'VERIFIED_PASS') throw new Error('ROLE_PARTITION_VALIDATION_NOT_PASS');
          const receipt = {
            receipt_id: 'KIDULTS_RECOVERY_ROLE_PARTITION_WORKFLOW_RECEIPT_V1',
            state: 'VERIFIED_PASS',
            repository: process.env.GITHUB_REPOSITORY,
            workflow_run_id: Number(process.env.GITHUB_RUN_ID),
            workflow_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            head_sha: process.env.EXPECTED_SHA,
            validation,
            primary_lanes_separated: true,
            red_team_independent: true,
            provider_call_authority: 'NONE',
            credential_authority: 'NONE',
            empirical_admission_authority: 'NONE',
            production: 'HOLD',
            public: 'HOLD',
            g5: 'HOLD'
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/recovery-role-partition-receipt.json`, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload terminal role-boundary receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-recovery-role-partition-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recovery-role-partition-receipt.json
            ${{ runner.temp }}/recovery-role-partition-validation.json
          if-no-files-found: error
          retention-days: 30
