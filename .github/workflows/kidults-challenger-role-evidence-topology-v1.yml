name: KIDULTS Challenger Role Evidence Topology v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/challenger-role-evidence-contract-v1.json'
      - 'scripts/kidults/poc/validate-challenger-role-evidence-contract-v1.mjs'
      - '.github/workflows/kidults-challenger-role-evidence-topology-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/kidults/poc/validate-challenger-role-evidence-contract-v1.mjs
