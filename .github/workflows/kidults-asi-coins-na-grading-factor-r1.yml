name: KIDULTS ASI Coins NA Grading Infrastructure R1
on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/coins-na-authentication-grading-infrastructure-r1.json'
      - 'scripts/kidults/source-intelligence/probe-coins-na-authentication-grading-infrastructure-r1.mjs'
      - '.github/workflows/kidults-asi-coins-na-grading-factor-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enforce-rights-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Emit fail-closed factor state without network probing
        run: node scripts/kidults/source-intelligence/probe-coins-na-authentication-grading-infrastructure-r1.mjs /tmp/coins-na-authentication-grading-infrastructure-r1.json
      - name: Enforce rights quarantine and no-overclaim boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/coins-na-authentication-grading-infrastructure-r1.json','utf8'));const a=x.factor_assertion;
          if(x.status!=='NOT_VERIFIED_RIGHTS_HOLD') throw new Error('FACTOR_MUST_REMAIN_RIGHTS_HOLD');
          if(x.network_probe_performed!==false) throw new Error('NETWORK_PROBE_FORBIDDEN');
          if(a.factor_id!=='AUTHENTICATION_GRADING_INFRASTRUCTURE'||a.category_scope!=='coins_and_numismatics'||a.macroregion_id!=='NORTH_AMERICA') throw new Error('FACTOR_CELL');
          if(a.value_or_unknown!=='UNKNOWN'||a.confidence!=='NOT_VERIFIED'||a.freshness_state!=='NOT_VERIFIED_RIGHTS_HOLD') throw new Error('FACTOR_PROMOTED_WITHOUT_RIGHTS');
          if(a.rights_state!=='HOLD_SECOND_SOURCE_RIGHTS_NOT_CLEARED') throw new Error('RIGHTS_HOLD_MISSING');
          if(x.independent_source_owner_count!==0||x.source_observations.length!==0) throw new Error('EMPIRICAL_OBSERVATION_MUST_NOT_BE_ADMITTED');
          for(const k of ['authentication_grading_infrastructure_claim','market_scale_claim','market_maturity_claim','transaction_activity_claim','price_claim','liquidity_claim','demand_claim','sales_claim','market_share_claim','global_weight_claim']) if(x[k]!==false) throw new Error(`OVERCLAIM:${k}`);
          if(x.public_release!=='HOLD'||x.production!=='HOLD') throw new Error('RELEASE_BOUNDARY');
          console.log(JSON.stringify({status:'PASS_FAIL_CLOSED',factor_id:a.factor_id,rights_state:a.rights_state,network_probe_performed:false,verified_market_factor:false,production:'HOLD'}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-asi-coins-na-grading-factor-rights-hold-r1
          path: /tmp/coins-na-authentication-grading-infrastructure-r1.json
          if-no-files-found: error
          retention-days: 14
