name: KIDULTS ASI Coins NA Grading Infrastructure R1
on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/coins-na-authentication-grading-infrastructure-r1.json'
      - 'scripts/kidults/source-intelligence/probe-coins-na-authentication-grading-infrastructure-r1.mjs'
      - '.github/workflows/kidults-asi-coins-na-grading-factor-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-factor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Probe two independent official grading infrastructures
        run: node scripts/kidults/source-intelligence/probe-coins-na-authentication-grading-infrastructure-r1.mjs /tmp/coins-na-authentication-grading-infrastructure-r1.json
      - name: Enforce factor registry and no-overclaim boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/coins-na-authentication-grading-infrastructure-r1.json','utf8'));const a=x.factor_assertion;
          if(x.status!=='VERIFIED_BOUNDED_STRUCTURAL_FACTOR'||x.independent_source_owner_count<2) throw new Error('INDEPENDENT_AUTHORITY_FACTOR_NOT_VERIFIED');
          if(a.factor_id!=='AUTHENTICATION_GRADING_INFRASTRUCTURE'||a.category_scope!=='coins_and_numismatics'||a.macroregion_id!=='NORTH_AMERICA') throw new Error('FACTOR_CELL');
          for(const k of ['factor_id','category_scope','macroregion_id','value_or_unknown','observed_at','source_observation_ids','evidence_refs','rights_state','provenance_refs','methodology_version','confidence','freshness_state']) if(a[k]===undefined||a[k]===null) throw new Error(`REQUIRED_FACTOR_FIELD:${k}`);
          if(a.confidence!=='MEDIUM'||a.freshness_state!=='CURRENT_OBSERVED'||a.rights_state!=='ALLOW_PUBLIC_READ_INTERNAL_DERIVATION_ONLY') throw new Error('FACTOR_CLASSIFICATION');
          if(a.value_or_unknown?.state!=='OBSERVED_MULTI_AUTHORITY_INFRASTRUCTURE'||a.value_or_unknown?.independent_source_owner_count<2) throw new Error('FACTOR_VALUE');
          if(new Set(x.source_observations.filter(o=>o.observation_pass).map(o=>o.source_owner_id)).size<2) throw new Error('OWNER_CONCENTRATION');
          for(const k of ['market_scale_claim','market_maturity_claim','transaction_activity_claim','price_claim','liquidity_claim','demand_claim','sales_claim','market_share_claim','global_weight_claim']) if(x[k]!==false) throw new Error(`OVERCLAIM:${k}`);
          if(x.public_release!=='HOLD'||x.production!=='HOLD') throw new Error('RELEASE_BOUNDARY');
          const raw=JSON.stringify(x);if(/<html|<!doctype|<body|<script/i.test(raw))throw new Error('RAW_HTML_LEAK');
          console.log(JSON.stringify({status:'PASS',factor_id:a.factor_id,cell:`${a.category_scope}×${a.macroregion_id}`,independent_source_owner_count:x.independent_source_owner_count,confidence:a.confidence,market_scale_claim:false,production:'HOLD'}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-asi-coins-na-grading-factor-r1
          path: /tmp/coins-na-authentication-grading-infrastructure-r1.json
          if-no-files-found: error
          retention-days: 14
