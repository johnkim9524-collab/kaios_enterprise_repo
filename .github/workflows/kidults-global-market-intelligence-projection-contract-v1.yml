name: KIDULTS Global Market Intelligence Projection Contract V1
on:
  pull_request:
    paths:
      - 'coordination/kidults/products/global-market-intelligence-projection-contract-v1.json'
      - 'scripts/kidults/products/validate-global-market-intelligence-projection-contract-v1.mjs'
      - '.github/workflows/kidults-global-market-intelligence-projection-contract-v1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node scripts/kidults/products/validate-global-market-intelligence-projection-contract-v1.mjs
