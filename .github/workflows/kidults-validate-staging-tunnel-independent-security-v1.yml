name: KIDULTS STAGING Tunnel Independent Security V1

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    paths:
      - scripts/staging/run-postgres-verifier-through-ssh-tunnel.sh
      - tests/kidults/kpmo/test_postgres_pitr_contract.py
  push:
    branches: [main]
    paths:
      - .github/workflows/kidults-validate-staging-tunnel-independent-security-v1.yml
      - scripts/kidults/kpmo/verify-staging-tunnel-independent-v1.py
  workflow_dispatch:

permissions: {}

jobs:
  independently-verify-without-landing:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout protected main verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false

      - name: Resolve exact open PR binding without a write token
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '2331' }}
        run: |
          set -euo pipefail
          test "$(git -C policy rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PR_NUMBER" = 2331
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr-binding.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg base "$GITHUB_SHA" \
            '.state=="open" and .head.repo.full_name==$repo and .base.ref=="main" and .base.sha==$base and .number==2331' \
            /tmp/pr-binding.json >/dev/null
          echo "head_sha=$(jq -r '.head.sha' /tmp/pr-binding.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.binding.outputs.head_sha }}
          path: candidate
          persist-credentials: false

      - name: Recheck head and independently exercise negative cases
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.binding.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/2331" \
            | jq -e --arg head "$HEAD_SHA" --arg base "$GITHUB_SHA" \
              '.state=="open" and .head.sha==$head and .base.sha==$base' >/dev/null
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 policy/scripts/kidults/kpmo/verify-staging-tunnel-independent-v1.py candidate
