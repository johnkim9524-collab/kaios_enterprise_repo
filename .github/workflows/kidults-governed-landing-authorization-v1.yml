name: KIDULTS Governed Landing Authorization V1
# COMPATIBILITY_STATUS_ONLY: autonomous agent quorum is the normal authority;
# legacy owner authorization remains available only for recovery.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  id-token: write
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: kidults-governed-landing-authorization-v1-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  governed-landing-authorization:
    name: Evaluate governed landing readiness
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enforce active approval-generation equality before readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/kidults/kpmo/validate-approval-generation-equality-live-pr-v1.mjs

      - name: Enforce exact-head solo-owner authorization and ruleset monotonicity
        id: evaluate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo = process.env.GH_REPOSITORY;
          const prNumber = process.env.PR_NUMBER;
          const token = process.env.GH_TOKEN;
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kidults-governed-landing-authorization-v1'
          };
          const fail = message => { console.error(`FAIL governed landing authorization: ${message}`); process.exit(1); };
          const api = async path => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {headers, redirect:'error'});
            if (!response.ok) fail(`${response.status} ${path}`);
            return response.json();
          };
          const pages = async (path, maxPages=5) => {
            const out=[];
            for(let page=1;page<=maxPages;page++){
              const sep=path.includes('?')?'&':'?';
              const values=await api(`${path}${sep}per_page=100&page=${page}`);
              if(!Array.isArray(values)) fail(`non-array pagination response ${path}`);
              out.push(...values);
              if(values.length<100) return out;
            }
            fail(`pagination bound exceeded ${path}`);
          };

          const repository = await api('');
          const pr = await api(`/pulls/${prNumber}`);
          if (pr.base?.ref !== 'main') fail('base branch is not main');
          if (!/^[0-9a-f]{40}$/.test(pr.head?.sha || '')) fail('exact PR head SHA unavailable');
          if (pr.state !== 'open' || pr.merged === true) fail('pull request is closed, merged, or NO-MERGE');
          const labels = new Set((pr.labels || []).map(label => String(label.name || '').toLowerCase()));
          if (['no-merge','do-not-merge','merge-hold'].some(label => labels.has(label))) fail('NO-MERGE label is active');
          if (/\[(?:NO-MERGE|DO-NOT-MERGE)\]/i.test(pr.title || '')) fail('NO-MERGE title marker is active');

          const files = await pages(`/pulls/${prNumber}/files`);
          if (!files.length) {
            const commitCount = Number(pr.commits || 0);
            const changedFileCount = Number(pr.changed_files || 0);
            if (commitCount !== 0 || changedFileCount !== 0) fail(`changed-file API empty but PR metadata is nonzero: commits=${commitCount} changed_files=${changedFileCount}`);
            console.log(JSON.stringify({
              id:'kidults-governed-landing-authorization-receipt-v1',
              state:'ZERO_DIFF_NO_GOVERNED_CHANGE_PASS',
              pull_request:Number(prNumber),
              exact_head_sha:pr.head.sha,
              commits:commitCount,
              changed_files:changedFileCount,
              promotion_eligible:false,
              public_release:'HOLD',production:'HOLD',g5:'HOLD'
            },null,2));
            process.exit(0);
          }
          const prefixes = [
            '.github/',
            'services/kidults-control-plane/',
            'services/kidults-autonomous-intelligence/',
            'scripts/kidults/kpmo/',
            'scripts/kidults/redteam/',
            'scripts/kidults/portal/runtime/',
            'coordination/kidults/kpmo/',
            'coordination/kidults/audit/',
            'coordination/kidults/security/',
            'coordination/kidults/provider/',
            'coordination/kidults/runtime/',
            'infra/'
          ];
          const exact = new Set(['wrangler.toml','wrangler.json','wrangler.jsonc']);
          const governedFiles = files.map(x=>x.filename).filter(name=>exact.has(name)||prefixes.some(prefix=>name.startsWith(prefix)));

          const rulesets = await api('/rulesets');
          const solo = rulesets.find(x=>x.name==='KAIOS Solo Owner Preflight' && x.enforcement==='active');
          const protect = rulesets.find(x=>x.name==='Protect main' && x.enforcement==='active');
          if(!solo || !protect) fail('required active rulesets missing');
          const soloDetail = await api(`/rulesets/${solo.id}`);
          const protectDetail = await api(`/rulesets/${protect.id}`);
          if((soloDetail.bypass_actors||[]).length!==0 || (protectDetail.bypass_actors||[]).length!==0) fail('ruleset bypass actor detected');
          const statusRule=(soloDetail.rules||[]).find(x=>x.type==='required_status_checks');
          if(!statusRule?.parameters?.strict_required_status_checks_policy) fail('strict required status policy disabled');
          const existingRequired=new Set((statusRule.parameters.required_status_checks||[]).map(x=>x.context));
          for(const required of ['KAIOS Solo Owner Preflight','Validate KAIOS Foundation','Validate Production Container']) if(!existingRequired.has(required)) fail(`existing required status missing: ${required}`);
          const protectPr=(protectDetail.rules||[]).find(x=>x.type==='pull_request');
          if((protectPr?.parameters?.required_approving_review_count||0)!==0) fail('Protect main approval count drifted from approved solo-owner zero');
          if(!protectPr?.parameters?.dismiss_stale_reviews_on_push) fail('Protect main stale-review dismissal disabled');
          if(protectPr?.parameters?.require_last_push_approval) fail('Protect main last-push approval must remain disabled in solo-owner mode');
          if(!protectPr?.parameters?.required_review_thread_resolution) fail('Protect main review-thread resolution disabled');
          if(!protectPr?.parameters?.require_extra_approval_for_unattributed_changes) fail('Protect main unattributed-change approval disabled');

          const timeline = await pages(`/issues/${prNumber}/timeline`);
          const readinessEvents = timeline.filter(x=>x.event==='ready_for_review'||x.event==='convert_to_draft');
          const lastReadiness = readinessEvents.at(-1) || null;
          const readinessReceipt = lastReadiness ? {
            event:lastReadiness.event,
            actor:lastReadiness.actor?.login||null,
            at:lastReadiness.created_at||null
          } : {
            event:'created_ready_or_never_drafted',
            actor:pr.user?.login||null,
            at:pr.created_at||null
          };

          if (governedFiles.length) {
            if (pr.draft) {
              console.log(JSON.stringify({
                id:'kidults-governed-landing-authorization-receipt-v1',
                state:'DRAFT_DEVELOPMENT_VALIDATED_NON_PROMOTABLE',
                pull_request:Number(prNumber),
                exact_head_sha:pr.head.sha,
                governed_files:governedFiles,
                readiness:readinessReceipt,
                landing_authorization_created:false,
                promotion_eligible:false,
                public_release:'HOLD',production:'HOLD',g5:'HOLD'
              },null,2));
              process.exit(0);
            }
            if(lastReadiness?.event==='convert_to_draft') fail('latest readiness event is convert_to_draft');

            if(pr.user?.login!==repository.owner?.login) fail('governed PR author is not repository Program Owner');
            if(pr.head?.repo?.full_name!==repo) fail('governed PR head must remain in the canonical repository');
            // Ready is lifecycle state only. It may be emitted by the autonomous
            // finalizer and never grants landing authority by itself.

            const reviews = await pages(`/pulls/${prNumber}/reviews`);
            const latest = new Map();
            for(const review of reviews){
              const login=review.user?.login;
              if(!login || review.user?.type!=='User') continue;
              if(review.commit_id!==pr.head.sha) continue;
              const prior=latest.get(login);
              const stamp=Date.parse(review.submitted_at||0);
              const priorStamp=prior?Date.parse(prior.submitted_at||0):-1;
              if(!prior || stamp>=priorStamp) latest.set(login,review);
            }
            const eligibleAssociation = new Set(['OWNER','MEMBER','COLLABORATOR']);
            const eligible = [...latest.values()].filter(r=>eligibleAssociation.has(r.author_association));
            const blockers = eligible.filter(r=>r.state==='CHANGES_REQUESTED');
            if(blockers.length) fail(`exact-head changes requested by ${blockers.map(r=>r.user.login).join(',')}`);
            const optionalApprovals = eligible.filter(r=>r.user.login!==pr.user.login && r.state==='APPROVED');

            const receipt = {
              id:'kidults-governed-landing-authorization-receipt-v1',
              state:'LIFECYCLE_READY_SOLO_OWNER_SCOPE_VERIFIED',
              repository:repo,
              pull_request:Number(prNumber),
              author:pr.user.login,
              program_owner:repository.owner.login,
              governance_mode:'SOLO_OWNER_GOVERNED',
              decision_id:'JOHN-SOLO-OWNER-APPROVAL-0-2026-08-27',
              exact_head_sha:pr.head.sha,
              governed_files:governedFiles,
              readiness:readinessReceipt,
              ready_state_is_lifecycle_only:true,
              landing_authorization_created:false,
              required_approval_count:0,
              optional_external_approvals:optionalApprovals.map(r=>({reviewer:r.user.login,association:r.author_association,submitted_at:r.submitted_at,commit_id:r.commit_id})),
              self_review_is_not_independent_review:true,
              stale_review_excluded:true,
              ruleset_bypass_actor_count:0,
              public_release:'HOLD',
              production:'HOLD',
              g5:'HOLD'
            };
            console.log(JSON.stringify(receipt,null,2));
            process.exit(0);
          }

          console.log(JSON.stringify({
            id:'kidults-governed-landing-authorization-receipt-v1',
            state:'NOT_GOVERNED_PATH_PASS',
            pull_request:Number(prNumber),
            exact_head_sha:pr.head.sha,
            readiness:readinessReceipt,
            ruleset_bypass_actor_count:0,
            public_release:'HOLD',production:'HOLD',g5:'HOLD'
          },null,2));
          NODE

      - name: Mint exact draft-ready GitHub App token through the repository broker
        id: mint_draft_ready_token
        if: always() && github.event.pull_request.draft == true && steps.evaluate.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_EVENT_BROKER_ROLE_ARN }}
          BROKER_FUNCTION: ${{ vars.KIDULTS_AUTONOMOUS_EVENT_TOKEN_BROKER_FUNCTION }}
          EXPECTED_APP_ID: ${{ vars.KIDULTS_GITHUB_APP_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.KIDULTS_GITHUB_INSTALLATION_ID }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          trap 'unset CREDS OIDC_JSON OIDC_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION' EXIT
          test -n "$AWS_ROLE_ARN"
          test -n "$BROKER_FUNCTION"
          test -n "$EXPECTED_APP_ID"
          test -n "$EXPECTED_INSTALLATION_ID"
          OIDC_JSON=$(curl --fail --silent --show-error -H "Authorization: ******" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(jq -r '.value' <<<"$OIDC_JSON")
          echo "::add-mask::$OIDC_TOKEN"
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "kidults-governed-ready-${GITHUB_RUN_ID}" --web-identity-token "$OIDC_TOKEN" --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$CREDS"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          export AWS_REGION=ap-northeast-2
          unset CREDS OIDC_JSON OIDC_TOKEN
          response_path="$RUNNER_TEMP/kidults-governed-draft-ready-token.json"
          payload=$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repository_id "$GITHUB_REPOSITORY_ID" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg authorization_generation "governed-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PR_NUMBER}" \
            '{action:"MINT_INSTALLATION_TOKEN",permission_profile:"DRAFT_READY_TRANSITION",repository:$repository,repository_id:$repository_id,pull_request:$pull_request,base_sha:$base_sha,head_sha:$head_sha,authorization_generation:$authorization_generation,allow_draft_recovery:true}')
          aws lambda invoke --function-name "$BROKER_FUNCTION" --cli-binary-format raw-in-base64-out --payload "$payload" "$response_path" >/dev/null
          chmod 600 "$response_path"
          token=$(jq -er '.token' "$response_path")
          echo "::add-mask::$token"
          echo "response_path=$response_path" >> "$GITHUB_OUTPUT"

      - name: Publish fail-closed exact-head readiness status after final live re-read
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_APP_ID: ${{ vars.KIDULTS_GITHUB_APP_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.KIDULTS_GITHUB_INSTALLATION_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
          AUTHORIZATION_OUTCOME: ${{ steps.evaluate.outcome }}
          DRAFT_READY_TOKEN_STEP_OUTCOME: ${{ steps.mint_draft_ready_token.outcome }}
          DRAFT_READY_TOKEN_RESPONSE_PATH: ${{ steps.mint_draft_ready_token.outputs.response_path }}
          READINESS_RECEIPT_PATH: ${{ runner.temp }}/kidults-governed-landing-readiness/receipt.json
          PRODUCTION_STATE: ${{ vars.KIDULTS_PRODUCTION_STATE || 'HOLD' }}
          PUBLIC_STATE: ${{ vars.KIDULTS_PUBLIC_STATE || 'HOLD' }}
          G5_STATE: ${{ vars.KIDULTS_G5_STATE || 'HOLD' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {GateFailure,assertStableFinalReread,assertTerminalNonAuthorizingPullRequest,assertDraftReadyTransitionCandidate,validateDraftReadyBrokerResponse,assertDraftReadyPostMutation} from './scripts/kidults/kpmo/lib/governed-landing-native-gates-v1.mjs';
          const token=process.env.GH_TOKEN,repo=process.env.GH_REPOSITORY,number=process.env.PR_NUMBER,head=process.env.EXPECTED_HEAD_SHA,base=process.env.EXPECTED_BASE_SHA;
          const receiptPath=process.env.READINESS_RECEIPT_PATH;fs.mkdirSync(new URL('.',`file://${receiptPath}`).pathname,{recursive:true});
          const writeReceipt=value=>fs.writeFileSync(receiptPath,JSON.stringify(value,null,2)+'\n');
          const policy=JSON.parse(fs.readFileSync('coordination/kidults/kpmo/governed-landing-authorization-policy-v1.json','utf8'));
          const headers={Authorization:`******'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'kidults-governed-landing-readiness-v1'};
          const api=async(path,options={})=>{const r=await fetch(`https://api.github.com/repos/${repo}${path}`,{...options,headers:{...headers,...(options.headers||{})},redirect:'error'});if(!r.ok)throw new Error(`GITHUB_API_${r.status}:${path}`);return r.json();};
          const headersForToken=bearer=>({Authorization:`******'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'kidults-governed-landing-readiness-v1'});
          const apiWithToken=async(bearer,path,options={})=>{const r=await fetch(`https://api.github.com/repos/${repo}${path}`,{...options,headers:{...headersForToken(bearer),...(options.headers||{})},redirect:'error'});if(!r.ok)throw new GateFailure(`GITHUB_API_${r.status}`,path);return r.json();};
          const graphqlWithToken=async(bearer,query,variables)=>{const r=await fetch('https://api.github.com/graphql',{method:'POST',headers:{...headersForToken(bearer),'Content-Type':'application/json'},body:JSON.stringify({query,variables}),redirect:'error'});if(!r.ok)throw new GateFailure(`GITHUB_GRAPHQL_${r.status}`);const body=await r.json();if(body.errors?.length)throw new GateFailure(`GITHUB_GRAPHQL_ERROR:${body.errors[0].type||'UNKNOWN'}`);return body.data;};
          const scopePolicy=JSON.parse(fs.readFileSync('coordination/kidults/kpmo/scope-aware-required-status-policy-v1.json','utf8'));
          const status=async(state,description,context=policy.required_status_context)=>api(`/statuses/${head}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state,context,description})});
          const holdStates=[process.env.PRODUCTION_STATE,process.env.PUBLIC_STATE,process.env.G5_STATE];
          const assertHoldBoundary=()=>{if(holdStates.some(value=>value!=='HOLD'))throw new GateFailure('DRAFT_READY_HOLD_BOUNDARY_WEAKENED');};
          const loadDraftReadyToken=()=>{
            if(process.env.DRAFT_READY_TOKEN_STEP_OUTCOME!=='success')throw new GateFailure('DRAFT_READY_TOKEN_UNAVAILABLE');
            const responsePath=process.env.DRAFT_READY_TOKEN_RESPONSE_PATH;
            if(!responsePath||!fs.existsSync(responsePath))throw new GateFailure('DRAFT_READY_TOKEN_UNAVAILABLE');
            let response;
            try{response=JSON.parse(fs.readFileSync(responsePath,'utf8'));}catch{throw new GateFailure('DRAFT_READY_TOKEN_UNAVAILABLE');}
            return validateDraftReadyBrokerResponse(response,{repository:repo,repositoryId:process.env.EXPECTED_REPOSITORY_ID,appId:process.env.EXPECTED_APP_ID,installationId:process.env.EXPECTED_INSTALLATION_ID,githubToken:token}).token;
          };
          let failure=null;
          try {
            const final=await api(`/pulls/${number}`);
            if(final.state==='closed'){
              const terminal=assertTerminalNonAuthorizingPullRequest(final,{repository:repo,expectedHeadSha:head});
              const receipt={id:'kidults-governed-landing-readiness-receipt-v1',version:'1.0.0',state:terminal.merged===true?'MERGED_POST_LANDING_VERIFICATION_REQUIRED':'CLOSED_TERMINAL_NON_AUTHORIZING',repository:repo,workflow_run_id:Number(process.env.GITHUB_RUN_ID),workflow_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),pull_request:Number(number),exact_head_sha:head,merge_commit_sha:terminal.merge_commit_sha,evaluated_at:new Date().toISOString(),final_live_reread:true,ready_state_grants_authorization:false,landing_authorization_created:false,atomic_landing_required:false,post_landing_verification_required:terminal.merged===true,promotion_eligible:false,production:'HOLD',public_release:'HOLD',g5:'HOLD'};writeReceipt(receipt);console.log(JSON.stringify(receipt,null,2));
              process.exit(0);
            }
            if(final.draft===true){
              const before=assertDraftReadyTransitionCandidate(final,{repository:repo,expectedPullRequestNumber:number,expectedHeadSha:head,expectedBaseSha:base,expectedTriggerDraft:process.env.TRIGGER_PULL_REQUEST_DRAFT==='true'});
              if(process.env.AUTHORIZATION_OUTCOME!=='success')throw new GateFailure('DRAFT_DEVELOPMENT_EVALUATION_FAILED');
              assertHoldBoundary();
              await status('pending','Draft is non-promotable; automated Ready transition pending');
              await status('success','Draft development controls verified; landing remains blocked',scopePolicy.draft_development_status_context);
              const appToken=loadDraftReadyToken();
              try{
                await graphqlWithToken(appToken,'mutation($pullRequestId:ID!){markPullRequestReadyForReview(input:{pullRequestId:$pullRequestId}){pullRequest{id number isDraft state headRefOid baseRefOid}}}',{pullRequestId:before.node_id});
              }catch(error){
                if(error instanceof GateFailure&&String(error.code).includes('FORBIDDEN'))throw new GateFailure('DRAFT_READY_MUTATION_FORBIDDEN');
                throw error;
              }
              const ready=await apiWithToken(appToken,`/pulls/${number}`);
              assertDraftReadyPostMutation(before,ready,{repository:repo,expectedHeadSha:head,expectedBaseSha:base});
              assertHoldBoundary();
              await status('pending','Ready lifecycle automated; operation-specific landing authority required');
              const receipt={id:'kidults-governed-landing-readiness-receipt-v1',version:'1.0.0',state:'LIFECYCLE_READY_AUTOMATED',repository:repo,workflow_run_id:Number(process.env.GITHUB_RUN_ID),workflow_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),pull_request:Number(number),exact_head_sha:head,evaluated_at:new Date().toISOString(),ready_state_is_lifecycle_only:true,ready_state_grants_authorization:false,landing_authorization_created:false,atomic_landing_required:false,promotion_eligible:false,final_live_reread:true,production:'HOLD',public_release:'HOLD',g5:'HOLD'};writeReceipt(receipt);console.log(JSON.stringify(receipt,null,2));
              process.exit(0);
            }
            assertStableFinalReread(final,final,{repository:repo,expectedHeadSha:head,noMergePolicy:policy.no_merge_policy});
            if(process.env.AUTHORIZATION_OUTCOME!=='success')throw new GateFailure('GOVERNED_AUTHORIZATION_EVALUATION_FAILED');
            await status('pending','Ready lifecycle verified; operation-specific landing authority required');
            const receipt={id:'kidults-governed-landing-readiness-receipt-v1',version:'1.0.0',state:'READY_PENDING_ATOMIC_LANDING',repository:repo,workflow_run_id:Number(process.env.GITHUB_RUN_ID),workflow_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),pull_request:Number(number),exact_head_sha:head,evaluated_at:new Date().toISOString(),final_live_reread:true,ordinary_readiness_published_success:false,atomic_landing_required:true,production:'HOLD',public_release:'HOLD',g5:'HOLD'};writeReceipt(receipt);console.log(JSON.stringify(receipt,null,2));
          } catch(error) {
            failure=error;
            writeReceipt({id:'kidults-governed-landing-readiness-receipt-v1',version:'1.0.0',state:'VERIFIED_FAIL',failure_code:String(error.code||error.message||'GOVERNED_READINESS_FAILED'),repository:repo,workflow_run_id:Number(process.env.GITHUB_RUN_ID),workflow_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),pull_request:Number(number),exact_head_sha:head,evaluated_at:new Date().toISOString(),atomic_landing_required:false,production:'HOLD',public_release:'HOLD',g5:'HOLD'});
            try{await status('failure',String(error.code||error.message||'governed landing blocked').slice(0,140));}catch{}
          }
          if(failure)throw failure;
          NODE

      - name: Upload exact-head readiness receipt for autonomous atomic landing
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kidults-governed-landing-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-governed-landing-readiness/receipt.json
          if-no-files-found: error
          retention-days: 30
