name: KIDULTS Governed Landing Authorization V1

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: kidults-governed-landing-authorization-v1-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  governed-landing-authorization:
    name: KIDULTS Governed Landing Authorization V1
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce exact-head independent authorization and ruleset monotonicity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo = process.env.GH_REPOSITORY;
          const prNumber = process.env.PR_NUMBER;
          const token = process.env.GH_TOKEN;
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kidults-governed-landing-authorization-v1'
          };
          const fail = message => { console.error(`FAIL governed landing authorization: ${message}`); process.exit(1); };
          const api = async path => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {headers, redirect:'error'});
            if (!response.ok) fail(`${response.status} ${path}`);
            return response.json();
          };
          const pages = async (path, maxPages=5) => {
            const out=[];
            for(let page=1;page<=maxPages;page++){
              const sep=path.includes('?')?'&':'?';
              const values=await api(`${path}${sep}per_page=100&page=${page}`);
              if(!Array.isArray(values)) fail(`non-array pagination response ${path}`);
              out.push(...values);
              if(values.length<100) return out;
            }
            fail(`pagination bound exceeded ${path}`);
          };

          const pr = await api(`/pulls/${prNumber}`);
          if (pr.base?.ref !== 'main') fail('base branch is not main');
          if (!/^[0-9a-f]{40}$/.test(pr.head?.sha || '')) fail('exact PR head SHA unavailable');

          const files = await pages(`/pulls/${prNumber}/files`);
          if (!files.length) fail('changed-file set is empty or unavailable');
          const prefixes = [
            '.github/',
            'scripts/kidults/kpmo/',
            'scripts/kidults/redteam/',
            'scripts/kidults/portal/runtime/',
            'coordination/kidults/kpmo/',
            'coordination/kidults/audit/',
            'coordination/kidults/security/',
            'coordination/kidults/providers/',
            'infra/'
          ];
          const exact = new Set(['wrangler.toml','wrangler.json','wrangler.jsonc']);
          const governedFiles = files.map(x=>x.filename).filter(name=>exact.has(name)||prefixes.some(prefix=>name.startsWith(prefix)));

          const rulesets = await api('/rulesets');
          const solo = rulesets.find(x=>x.name==='KAIOS Solo Owner Preflight' && x.enforcement==='active');
          const protect = rulesets.find(x=>x.name==='Protect main' && x.enforcement==='active');
          if(!solo || !protect) fail('required active rulesets missing');
          const soloDetail = await api(`/rulesets/${solo.id}`);
          const protectDetail = await api(`/rulesets/${protect.id}`);
          if((soloDetail.bypass_actors||[]).length!==0 || (protectDetail.bypass_actors||[]).length!==0) fail('ruleset bypass actor detected');
          const statusRule=(soloDetail.rules||[]).find(x=>x.type==='required_status_checks');
          if(!statusRule?.parameters?.strict_required_status_checks_policy) fail('strict required status policy disabled');
          const existingRequired=new Set((statusRule.parameters.required_status_checks||[]).map(x=>x.context));
          for(const required of ['KAIOS Solo Owner Preflight','Validate KAIOS Foundation','Validate Production Container']) if(!existingRequired.has(required)) fail(`existing required status missing: ${required}`);
          const protectPr=(protectDetail.rules||[]).find(x=>x.type==='pull_request');
          if(!protectPr?.parameters?.dismiss_stale_reviews_on_push) fail('Protect main stale-review dismissal disabled');

          const timeline = await pages(`/issues/${prNumber}/timeline`);
          const readinessEvents = timeline.filter(x=>x.event==='ready_for_review'||x.event==='convert_to_draft');
          const lastReadiness = readinessEvents.at(-1) || null;
          const readinessReceipt = lastReadiness ? {
            event:lastReadiness.event,
            actor:lastReadiness.actor?.login||null,
            at:lastReadiness.created_at||null
          } : {
            event:'created_ready_or_never_drafted',
            actor:pr.user?.login||null,
            at:pr.created_at||null
          };

          if (governedFiles.length) {
            if (pr.draft) fail('governed PR is Draft');
            if(lastReadiness?.event==='convert_to_draft') fail('latest readiness event is convert_to_draft');

            const reviews = await pages(`/pulls/${prNumber}/reviews`);
            const latest = new Map();
            for(const review of reviews){
              const login=review.user?.login;
              if(!login || review.user?.type!=='User') continue;
              if(review.commit_id!==pr.head.sha) continue;
              const prior=latest.get(login);
              const stamp=Date.parse(review.submitted_at||0);
              const priorStamp=prior?Date.parse(prior.submitted_at||0):-1;
              if(!prior || stamp>=priorStamp) latest.set(login,review);
            }
            const eligibleAssociation = new Set(['OWNER','MEMBER','COLLABORATOR']);
            const eligible = [...latest.values()].filter(r=>r.user.login!==pr.user.login && eligibleAssociation.has(r.author_association));
            const blockers = eligible.filter(r=>r.state==='CHANGES_REQUESTED');
            if(blockers.length) fail(`exact-head changes requested by ${blockers.map(r=>r.user.login).join(',')}`);
            const approvals = eligible.filter(r=>r.state==='APPROVED' && /Governance-Reason:\s*\S/i.test(r.body||''));
            if(approvals.length<1) fail('missing exact-head eligible non-author APPROVED review with Governance-Reason');

            const receipt = {
              id:'kidults-governed-landing-authorization-receipt-v1',
              state:'AUTHORIZED_EXACT_HEAD',
              repository:repo,
              pull_request:Number(prNumber),
              author:pr.user.login,
              exact_head_sha:pr.head.sha,
              governed_files:governedFiles,
              readiness:readinessReceipt,
              approvals:approvals.map(r=>({reviewer:r.user.login,association:r.author_association,submitted_at:r.submitted_at,commit_id:r.commit_id,reason:(r.body||'').match(/Governance-Reason:\s*(.+)/i)?.[1]?.trim()||null})),
              self_review_excluded:true,
              stale_approval_excluded:true,
              ruleset_bypass_actor_count:0,
              public_release:'HOLD',
              production:'HOLD',
              g5:'HOLD'
            };
            console.log(JSON.stringify(receipt,null,2));
            process.exit(0);
          }

          console.log(JSON.stringify({
            id:'kidults-governed-landing-authorization-receipt-v1',
            state:'NOT_GOVERNED_PATH_PASS',
            pull_request:Number(prNumber),
            exact_head_sha:pr.head.sha,
            readiness:readinessReceipt,
            ruleset_bypass_actor_count:0,
            public_release:'HOLD',production:'HOLD',g5:'HOLD'
          },null,2));
          NODE
