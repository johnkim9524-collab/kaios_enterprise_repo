name: KIDULTS PostgreSQL System Ledger and D1 Writer Boundary v1

on:
  pull_request_target:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/kidults-postgres-d1-boundary-v1.yml"
      - "services/kidults-control-plane/**"
      - "services/kidults-autonomous-intelligence/src/**"
      - "services/kidults-autonomous-intelligence/package.json"
      - "services/kidults-autonomous-intelligence/wrangler.jsonc"
      - "coordination/kidults/redteam/d1-legacy-resource-policy-v1.json"
      - "coordination/kidults/kpmo/governed-landing-authorization-policy-v1.json"
      - "scripts/kidults/kpmo/validate-governed-landing-coverage-v1.mjs"
      - "scripts/kidults/kpmo/validate-workflow-repository-mutation-boundary-v1.mjs"
      - "scripts/kidults/kpmo/validate-trusted-governed-control-freeze-v1.mjs"
      - "coordination/kidults/kpmo/trusted-governed-control-freeze-v1.json"
      - "tests/kidults/kpmo/trusted-governed-control-freeze-v1.test.mjs"
      - "coordination/kidults/kpmo/scope-aware-required-status-policy-v1.json"
      - "scripts/kidults/kpmo/run-atomic-governed-landing-v1.mjs"
      - "scripts/kidults/kpmo/run-scope-aware-authoritative-status-v1.mjs"
      - "scripts/kidults/kpmo/lib/governed-landing-native-gates-v1.mjs"
      - "tests/kidults/kpmo/governed-landing-native-gates-v1.test.mjs"
      - ".github/workflows/kidults-atomic-governed-landing-v1.yml"
      - ".github/workflows/kidults-scope-aware-authoritative-status-v1.yml"
      - ".github/workflows/kidults-governed-landing-authorization-v1.yml"
      - ".github/workflows/solo-owner-preflight.yml"
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kidults-postgres-d1-boundary-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-d1-boundary:
    name: KIDULTS Governed Landing Control Validation V1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted-control
      - name: Checkout exact untrusted PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: candidate
      - name: Verify exact candidate SHA
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git -C trusted-control rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"
          if git -C candidate ls-files -s | awk '$1 == "120000" || $1 == "160000" { found=1 } END { exit !found }'; then
            echo 'Symlink or submodule entries are forbidden in governed candidate validation.' >&2
            exit 1
          fi
      - name: Run only trusted-base repository governance validators against candidate
        working-directory: candidate
        run: |
          node ../trusted-control/scripts/kidults/kpmo/validate-trusted-governed-control-freeze-v1.mjs \
            --trusted-root ../trusted-control \
            --candidate-root .
          node ../trusted-control/scripts/kidults/kpmo/validate-governed-landing-coverage-v1.mjs
          node ../trusted-control/scripts/kidults/kpmo/validate-workflow-repository-mutation-boundary-v1.mjs
