name: KIDULTS Privacy Retention Empirical R1
on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/server.mjs'
      - 'apps/kidults-enterprise-staging/operations.mjs'
      - 'coordination/kidults/governance/privacy-*.json'
      - 'coordination/kidults/source-intelligence/rights-admitted-*-source-pool-r1.json'
      - 'scripts/kidults/governance/enforce-staging-audit-retention-v1.mjs'
      - 'scripts/kidults/governance/validate-record-privacy-gate-v1.mjs'
      - '.github/workflows/kidults-privacy-retention-empirical-r1.yml'
  workflow_dispatch:

jobs:
  privacy-retention:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate classification completeness
        run: |
          node - <<'NODE'
          const c=require('./coordination/kidults/governance/privacy-retention-minimization-contract-v1.json');
          const m=require('./coordination/kidults/governance/privacy-data-classification-manifest-v1.json');
          if(c.production!=='HOLD'||m.production!=='HOLD') process.exit(1);
          const required=c.required_classification;
          for(const d of m.datasets){for(const k of required){if(d[k]===undefined||d[k]===null||d[k]==='') throw new Error(`${d.dataset_id}:MISSING_${k}`)}}
          const conversion=m.datasets.find(d=>d.dataset_id==='staging-conversion-submissions');
          if(conversion.personal_data_state!=='YES'||conversion.retention_period!=='365_DAYS'||conversion.public_projection!==false) process.exit(1);
          const audit=m.datasets.find(d=>d.dataset_id==='staging-conversion-audit');
          if(audit.retention_period!=='90_DAYS_PREPRODUCTION_OPERATIONAL_AUDIT'||audit.public_projection!==false) process.exit(1);
          const getty=m.datasets.find(d=>d.dataset_id==='getty-historical-provenance');
          if(!String(getty.personal_data_state).includes('REQUIRED')||!String(getty.public_projection).startsWith('NO_')) process.exit(1);
          if(!getty.record_level_classification_gate) process.exit(1);
          console.log('Privacy classification completeness PASS');
          NODE
      - name: Empirically prove staging conversion retention
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { enforceRetention } from './apps/kidults-enterprise-staging/operations.mjs';
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'kidults-retention-'));
          fs.chmodSync(dir,0o700);
          const p=path.join(dir,'conversion-submissions.jsonl');
          const records=[
            {id:'old',email:'old@example.invalid',created_at:'2025-08-18T00:00:00.000Z'},
            {id:'edge-in',email:'edge@example.invalid',created_at:'2025-08-20T00:00:00.000Z'},
            {id:'new',email:'new@example.invalid',created_at:'2026-08-19T00:00:00.000Z'}
          ];
          fs.writeFileSync(p,records.map(x=>JSON.stringify(x)).join('\n')+'\n',{mode:0o600});
          const result=enforceRetention({dataDir:dir,now:new Date('2026-08-19T12:00:00.000Z'),retentionDays:365});
          const left=fs.readFileSync(p,'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          if(result.removed!==1||result.retained!==2||result.retention_days!==365) process.exit(1);
          if(left.some(x=>x.id==='old')||!left.some(x=>x.id==='new')) process.exit(1);
          const fileMode=fs.statSync(p).mode & 0o777;
          const dirMode=fs.statSync(dir).mode & 0o777;
          if(fileMode!==0o600||dirMode!==0o700) throw new Error(`MODE_INVALID:${fileMode.toString(8)}:${dirMode.toString(8)}`);
          console.log('Staging conversion retention PASS');
          NODE
      - name: Empirically prove staging operational audit retention
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { enforceStagingAuditRetention } from './scripts/kidults/governance/enforce-staging-audit-retention-v1.mjs';
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'kidults-audit-retention-'));
          fs.chmodSync(dir,0o700);
          const p=path.join(dir,'conversion-audit.jsonl');
          const records=[
            {event:'old',occurred_at:'2026-04-01T00:00:00.000Z'},
            {event:'edge',occurred_at:'2026-05-23T00:00:00.000Z'},
            {event:'new',occurred_at:'2026-08-20T00:00:00.000Z'}
          ];
          fs.writeFileSync(p,records.map(x=>JSON.stringify(x)).join('\n')+'\n',{mode:0o600});
          const result=enforceStagingAuditRetention({path:p,now:new Date('2026-08-21T00:00:00.000Z'),retentionDays:90});
          if(result.removed!==1||result.retained!==2||result.retention_days!==90||result.production_authorized!==false) process.exit(1);
          if((fs.statSync(p).mode & 0o777)!==0o600) process.exit(1);
          const malformed=path.join(dir,'malformed.jsonl');
          fs.writeFileSync(malformed,'{"event":"bad","occurred_at":"not-a-date"}\n',{mode:0o600});
          const before=fs.readFileSync(malformed,'utf8');
          let failed=false; try{enforceStagingAuditRetention({path:malformed,now:new Date('2026-08-21T00:00:00.000Z')})}catch{failed=true}
          if(!failed||fs.readFileSync(malformed,'utf8')!==before) process.exit(1);
          console.log('Staging audit retention PASS');
          NODE
      - name: Validate source privacy boundaries and record projection gate
        run: |
          node --input-type=module - <<'NODE'
          import { createRequire } from 'node:module';
          import { validateRecordPrivacyDecision } from './scripts/kidults/governance/validate-record-privacy-gate-v1.mjs';
          const require=createRequire(import.meta.url);
          const identity=require('./coordination/kidults/source-intelligence/rights-admitted-pilot-source-pool-r1.json');
          const historical=require('./coordination/kidults/source-intelligence/rights-admitted-transaction-source-pool-r1.json');
          if(!identity.sources.some(s=>s.pii==='NOT_EXPECTED_FOR_OBJECT_METADATA')) process.exit(1);
          if(!identity.sources.some(s=>s.pii==='FIELD_LEVEL_REVIEW_IF_PRESENT')) process.exit(1);
          if(historical.pool_readiness?.current_market_event_ready!==false) process.exit(1);
          let unknownHeld=false;
          try{validateRecordPrivacyDecision({record_id:'unknown',classification_state:'UNKNOWN',personal_fields:[],approved_public_fields:[],public_projection:false,review_ref:'review-unknown'})}catch{unknownHeld=true}
          if(!unknownHeld) process.exit(1);
          const bounded=validateRecordPrivacyDecision({record_id:'safe',classification_state:'APPROVED_NONPERSONAL_FIELDSET',personal_fields:[],approved_public_fields:['object_title'],public_projection:true,review_ref:'review-safe-001'});
          if(bounded.disposition!=='PROJECTION_ELIGIBLE_BOUNDED_FIELDS') process.exit(1);
          console.log('Source privacy fail-closed boundary PASS');
          NODE
      - name: Emit privacy evidence
        run: |
          cat > /tmp/kidults-privacy-retention-result.json <<'JSON'
          {
            "id":"kidults-privacy-retention-empirical-r1",
            "production":"HOLD",
            "staging_conversion_retention":"PASS_365_DAYS",
            "staging_audit_retention":"PASS_90_DAYS_PREPRODUCTION_POLICY_DETERMINISTIC_FAIL_CLOSED",
            "least_privilege_file_mode":"PASS_0600_PARENT_0700",
            "record_level_projection_gate":"PASS_DETERMINISTIC_FAIL_CLOSED_CONTROL",
            "real_source_record_classification":"DEPENDENCY_BOUND_TO_ACTUAL_ADMITTED_DATA",
            "source_specific_rights":"PENDING_EXTERNAL",
            "pass":true,
            "truth_boundary":"Internal staging retention and record-level projection controls are evidenced. This does not classify unseen source records, grant source rights, establish jurisdiction-wide legal compliance, or authorize Production/public release."
          }
          JSON
      - uses: actions/upload-artifact@v6
        with:
          name: kidults-privacy-retention-empirical-r1
          path: /tmp/kidults-privacy-retention-result.json
          retention-days: 30
