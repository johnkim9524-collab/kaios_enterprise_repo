name: KPMO Temporary Apply Trusted-Ref Count Migration

on:
  push:
    branches:
      - kpmo/cloudflare-staging-governance-v1
    paths:
      - .github/workflows/kpmo-temp-apply-trusted-ref-count-migration.yml

permissions:
  contents: write

concurrency:
  group: kpmo-temp-apply-trusted-ref-count-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Apply deterministic registry-count and generated-source corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "kpmo/cloudflare-staging-governance-v1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str, count: int = 1) -> str:
              observed = text.count(old)
              if observed != count:
                  raise SystemExit(f'{label}: expected {count} occurrence(s), observed {observed}')
              return text.replace(old, new)

          cloudflare_test_path = Path('tests/kidults/kpmo/cloudflare-pages-staging-governance-v1.test.mjs')
          text = cloudflare_test_path.read_text()
          text = replace_exact(text, 'const fakeCurl = `#!/usr/bin/env node', 'const fakeCurl = String.raw`#!/usr/bin/env node', 'CLOUDFLARE_STRING_RAW')
          cloudflare_test_path.write_text(text)

          contract_path = Path('coordination/kidults/kpmo/github-trusted-ref-environment-readback-contract-v1.json')
          contract = json.loads(contract_path.read_text())
          contract['scope']['privileged_manual_lane_count_is_dynamic_from_registry'] = True
          contract['scope']['legacy_manual_lane_alias_is_registry_lane_count'] = True
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')

          validator_path = Path('scripts/kidults/kpmo/validate-github-trusted-ref-environment-readback-v1.mjs')
          text = validator_path.read_text()
          anchor = "const UPLOAD_ARTIFACT_SHA = 'ea165f8d65b6e75b540449e92b4886f43607fa02';\n"
          helper = anchor + "\nfunction expectedRegisteredLaneCountFromRegistry(root = process.cwd()) {\n  const registry = JSON.parse(fs.readFileSync(path.join(root, REGISTRY_PATH), 'utf8'));\n  if (!Number.isInteger(registry?.registered_count) || registry.registered_count < 1) {\n    throw new Error('REGISTERED_SECRET_BEARING_LANE_COUNT_INVALID');\n  }\n  return registry.registered_count;\n}\n"
          text = replace_exact(text, anchor, helper, 'VALIDATOR_DYNAMIC_COUNT_HELPER')
          text = replace_exact(
              text,
              "export function validateReceipt(receipt, { requireExternalProof = false } = {}) {",
              "export function validateReceipt(receipt, { requireExternalProof = false, expectedRegisteredLaneCount = expectedRegisteredLaneCountFromRegistry() } = {}) {",
              'VALIDATOR_RECEIPT_SIGNATURE'
          )
          text = replace_exact(text, "require(receipt?.registered_secret_bearing_lanes === 17, 'registered_secret_lane_count');", "require(receipt?.registered_secret_bearing_lanes === expectedRegisteredLaneCount, 'registered_secret_lane_count');", 'VALIDATOR_RECEIPT_COUNT')
          text = replace_exact(text, "require(receipt?.registered_privileged_manual_lanes === 17, 'registered_lane_count_legacy_alias');", "require(receipt?.registered_privileged_manual_lanes === expectedRegisteredLaneCount, 'registered_lane_count_legacy_alias');", 'VALIDATOR_RECEIPT_ALIAS_COUNT')
          text = replace_exact(
              text,
              "  assert(contract.version === '1.4.0', 'CONTRACT_VERSION');",
              "  assert(contract.version === '1.4.0', 'CONTRACT_VERSION');\n  assert(contract.scope.secret_bearing_lane_count_is_dynamic_from_registry === true, 'DYNAMIC_SECRET_BEARING_LANE_COUNT');\n  assert(contract.scope.privileged_manual_lane_count_is_dynamic_from_registry === true, 'DYNAMIC_LEGACY_MANUAL_LANE_ALIAS');\n  assert(contract.scope.legacy_manual_lane_alias_is_registry_lane_count === true, 'LEGACY_ALIAS_REGISTRY_SEMANTICS');",
              'VALIDATOR_CONTRACT_DYNAMIC_ASSERTIONS'
          )
          text = replace_exact(
              text,
              "  assert(inventory.registered_lane_count === registry.registered_count && registry.registered_count === 17, 'REGISTRY_LANE_PARTITION');\n  assert(inventory.secret_bearing_job_count === 17, 'SECRET_BEARING_JOB_PARTITION');",
              "  assert(registry.registered_count === registry.registered_workflows.length, 'REGISTRY_REGISTERED_COUNT');\n  assert(registry.required_environment_bindings.length === registry.registered_count, 'REGISTRY_BINDING_COUNT');\n  assert(inventory.registered_lane_count === registry.registered_count, 'REGISTRY_LANE_PARTITION');\n  assert(inventory.secret_bearing_job_count === registry.required_environment_bindings.length, 'SECRET_BEARING_JOB_PARTITION');",
              'VALIDATOR_DYNAMIC_PARTITION'
          )
          text = replace_exact(text, "testSource.includes('all 17 secret-bearing jobs reject unreadable, stale, and non-main live-main guards')", "testSource.includes('all registered secret-bearing jobs reject unreadable, stale, and non-main live-main guards')", 'VALIDATOR_TEST_MARKER_LIVE_MAIN')
          text = replace_exact(text, "testSource.includes('all 17 secret-bearing jobs reject secret scope and guard order mutations')", "testSource.includes('all registered secret-bearing jobs reject secret scope and guard order mutations')", 'VALIDATOR_TEST_MARKER_SCOPE')
          text = replace_exact(
              text,
              "  assert(docs.includes('17/17 guards') && docs.includes('zero workflow-scope bindings') && docs.includes('zero job-scope bindings'), 'DOC_PRIVILEGED_EXECUTION_COUNTS');",
              "  assert(docs.includes('guard and step-scope counts are derived from the registry') && docs.includes('zero workflow-scope bindings') && docs.includes('zero job-scope bindings'), 'DOC_PRIVILEGED_EXECUTION_COUNTS');",
              'VALIDATOR_DOC_COUNT_MARKER'
          )
          validator_path.write_text(text)

          test_path = Path('tests/kidults/kpmo/github-trusted-ref-environment-readback-v1.test.mjs')
          text = test_path.read_text()
          text = replace_exact(text, "const mainSha = 'a'.repeat(40);", "const mainSha = 'a'.repeat(40);\nconst expectedRegisteredLaneCount = registry.registered_count;", 'TEST_DYNAMIC_COUNT_CONSTANT')
          text = replace_exact(text, "test('current exact registry binds all 17 secret-bearing lanes but external policy remains fail closed', () => {", "test('current exact registry binds every registered secret-bearing lane but external policy remains fail closed', () => {", 'TEST_REGISTRY_TITLE')
          text = replace_exact(text, '  assert.equal(currentInventory.registered_lane_count, 17);', '  assert.equal(currentInventory.registered_lane_count, expectedRegisteredLaneCount);', 'TEST_REGISTERED_COUNT')
          text = replace_exact(text, '  assert.equal(currentInventory.secret_bearing_job_count, 17);', '  assert.equal(currentInventory.secret_bearing_job_count, registry.required_environment_bindings.length);', 'TEST_SECRET_JOB_COUNT')
          insertion_anchor = "  assert.equal(current.empirical_evidence_promoted, false);\n});\n\ntest('synthetic exact-main environment and secret-name metadata is a test-only positive control', () => {"
          insertion = "  assert.equal(current.empirical_evidence_promoted, false);\n});\n\ntest('registered lane counts are derived from registry rather than a frozen legacy cardinality', () => {\n  assert.equal(contract.scope.secret_bearing_lane_count_is_dynamic_from_registry, true);\n  assert.equal(contract.scope.privileged_manual_lane_count_is_dynamic_from_registry, true);\n  assert.equal(contract.scope.legacy_manual_lane_alias_is_registry_lane_count, true);\n  const positive = receipt();\n  assert.equal(positive.registered_secret_bearing_lanes, expectedRegisteredLaneCount);\n  assert.equal(positive.registered_privileged_manual_lanes, expectedRegisteredLaneCount);\n  const staleLegacyCount = structuredClone(positive);\n  staleLegacyCount.registered_secret_bearing_lanes = 17;\n  staleLegacyCount.registered_privileged_manual_lanes = 17;\n  assert.ok(validateReceipt(staleLegacyCount).includes('registered_secret_lane_count'));\n  assert.ok(validateReceipt(staleLegacyCount).includes('registered_lane_count_legacy_alias'));\n});\n\ntest('synthetic exact-main environment and secret-name metadata is a test-only positive control', () => {"
          text = replace_exact(text, insertion_anchor, insertion, 'TEST_DYNAMIC_COUNT_CASE')
          text = replace_exact(text, "test('all 17 secret-bearing jobs reject unreadable, stale, and non-main live-main guards', () => {", "test('all registered secret-bearing jobs reject unreadable, stale, and non-main live-main guards', () => {", 'TEST_LIVE_MAIN_TITLE')
          text = replace_exact(text, "test('all 17 secret-bearing jobs reject secret scope and guard order mutations', () => {", "test('all registered secret-bearing jobs reject secret scope and guard order mutations', () => {", 'TEST_SCOPE_TITLE')
          test_path.write_text(text)

          docs_path = Path('docs/kidults/security/github-trusted-ref-environment-readback-v1.md')
          text = docs_path.read_text()
          text = replace_exact(
              text,
              'The repository-side implementation now statically binds all 17 registered secret-bearing jobs, independent of trigger class, to eight named GitHub Environments and gives every such job an exact-`main` guard. The registry binds every workflow/job identity to its required Environment and to a digest of its required secret-name set. The machine validator rejects a missing, renamed, dynamic, duplicate, or extra binding; a changed secret-name digest; or a removed exact-`main` guard. These local bindings do not prove that the eight Environments exist, have exact-`main` deployment policies, disable administrator bypass, or contain Environment-only secrets on live GitHub.',
              'The repository-side implementation now statically binds every registered secret-bearing job, independent of trigger class, to its registry-named GitHub Environment and gives every such job an exact-`main` guard. At this revision the registry contains 20 jobs across nine named Environments. The registry binds every workflow/job identity to its required Environment and to a digest of its required secret-name set. The machine validator derives cardinality from the registry and rejects a missing, renamed, dynamic, duplicate, or extra binding; a changed secret-name digest; or a removed exact-`main` guard. These local bindings do not prove that the nine Environments exist, have exact-`main` deployment policies, disable administrator bypass, or contain Environment-only secrets on live GitHub.',
              'DOC_IMPLEMENTED_CONTROL_COUNT'
          )
          text = replace_exact(text, 'All 17 registered secret-bearing jobs implement the same inline, secret-free preflight before any provider credential is resolved.', 'All registered secret-bearing jobs implement the same inline, secret-free preflight before any provider credential is resolved. At this revision that set contains 20 jobs.', 'DOC_LIVE_MAIN_COUNT')
          text = replace_exact(text, 'the repository validator proves 17/17 guards, 17/17 step-scoped bindings, zero workflow-scope bindings, zero job-scope bindings,', 'the repository validator proves that guard and step-scope counts are derived from the registry, with 20/20 guards and 20/20 step-scoped bindings at this revision, zero workflow-scope bindings, zero job-scope bindings,', 'DOC_GUARD_COUNTS')
          text = replace_exact(text, 'Land the 17 repository-side Environment bindings, live-main guards, and step-only secret-lifetime controls on protected `main`, then verify that live GitHub executes that exact source.', 'Land the registry-derived repository-side Environment bindings, live-main guards, and step-only secret-lifetime controls on protected `main`, then verify that live GitHub executes that exact source.', 'DOC_REMAINING_BLOCKER_COUNT')
          text = replace_exact(text, 'If the eight Environments or their secret scopes are later configured through a separately approved external change,', 'If the nine Environments or their secret scopes are later configured through a separately approved external change,', 'DOC_ROLLBACK_ENV_COUNT')
          docs_path.write_text(text)
          PY

          rm -f \
            .github/workflows/kpmo-temp-export-trusted-ref-sources.yml \
            .github/workflows/kpmo-temp-apply-trusted-ref-count-migration.yml

      - name: Validate corrected contracts before commit
        run: |
          set -euo pipefail
          node --check scripts/kidults/kpmo/validate-github-trusted-ref-environment-readback-v1.mjs
          node --check tests/kidults/kpmo/github-trusted-ref-environment-readback-v1.test.mjs
          node --check tests/kidults/kpmo/cloudflare-pages-staging-governance-v1.test.mjs
          node scripts/kidults/kpmo/validate-github-trusted-ref-environment-readback-v1.mjs
          node --test tests/kidults/kpmo/github-trusted-ref-environment-readback-v1.test.mjs
          node scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs
          node tests/kidults/kpmo/cloudflare-pages-staging-governance-v1.test.mjs
          node scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs --enforce-registry

      - name: Commit exact corrected branch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'johnkim9524-collab'
          git config user.email 'john.kim9524@gmail.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m '[CF-Pages-Skip] fix(governance): derive privileged lane counts from registry'
          git push origin "HEAD:$GITHUB_REF_NAME"
