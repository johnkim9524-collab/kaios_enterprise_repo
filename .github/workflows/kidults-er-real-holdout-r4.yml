name: KIDULTS ER Real Holdout R4

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs'
      - 'scripts/kidults/entity-resolution/freeze-er-blind-holdout-v1.mjs'
      - 'scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs'
      - '.github/workflows/kidults-er-real-holdout-r4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-real-r3-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build real aggregate R1-R3
        run: |
          node scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs /tmp/er-r1.json
          node scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs /tmp/er-r1.json /tmp/er-r2.json
          node scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs /tmp/er-r2.json /tmp/er-r3.json
      - name: Run canonical benchmark
        run: node scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs /tmp/er-r3.json /tmp/er-r3-results.json
      - name: Freeze exact real blind holdout
        run: node scripts/kidults/entity-resolution/freeze-er-blind-holdout-v1.mjs /tmp/er-r3.json /tmp/er-r3-holdout-freeze.json
      - name: Verify empirical freeze and fail-closed promotion
        run: |
          node - <<'NODE'
          const r=require('/tmp/er-r3-results.json');
          const f=require('/tmp/er-r3-holdout-freeze.json');
          if(r.accuracy!==1||r.critical_false_auto_merge!==0) process.exit(1);
          if(f.empirical_freeze!==true||f.holdout_count<1) process.exit(1);
          if(!String(f.dataset_hash).startsWith('sha256:')||!String(f.holdout_case_set_hash).startsWith('sha256:')) process.exit(1);
          if(!f.mutation_policy.includes('NEVER_OVERWRITE')) process.exit(1);
          if(r.promotion_gate.promotion_eligible_before_track_b!==false) process.exit(1);
          console.log('Real R3 blind holdout frozen immutably; #479 promotion remains correctly blocked.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-er-real-holdout-r4
          path: |
            /tmp/er-r3.json
            /tmp/er-r3-results.json
            /tmp/er-r3-holdout-freeze.json
          if-no-files-found: error
          retention-days: 30
