name: KIDULTS Portal V502 Validate

on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/**'
      - 'apps/kidults-enterprise-staging/public/data/portal-k100.json'
      - 'coordination/kidults/registry/track/**'
      - 'coordination/kidults/registry/blocker/**'
      - 'coordination/kidults/registry/mission/**'
      - 'coordination/kidults/registry/work-queue/**'
      - 'coordination/kidults/registry/digital-twin/**'
      - 'scripts/kidults/portal/**'
      - '.github/workflows/kidults-portal-v502-validate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/**'
      - 'apps/kidults-enterprise-staging/public/data/portal-k100.json'
      - 'coordination/kidults/registry/track/**'
      - 'coordination/kidults/registry/blocker/**'
      - 'coordination/kidults/registry/mission/**'
      - 'coordination/kidults/registry/work-queue/**'
      - 'coordination/kidults/registry/digital-twin/**'
      - 'scripts/kidults/portal/**'
      - '.github/workflows/kidults-portal-v502-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check V502 JavaScript
        run: |
          node --check apps/kidults-enterprise-staging/public/portal/portal.js
          node --check apps/kidults-enterprise-staging/public/portal/detail.js
          node --check apps/kidults-enterprise-staging/public/portal/components/data-store.js
          node --check apps/kidults-enterprise-staging/public/portal/components/renderers.js
          node --check apps/kidults-enterprise-staging/public/portal/components/interactions.js
          node --check apps/kidults-enterprise-staging/public/portal/components/living-pulse.js
          node --check apps/kidults-enterprise-staging/public/portal/components/why-engine.js
          node --check apps/kidults-enterprise-staging/public/portal/components/copilot.js
          node --check apps/kidults-enterprise-staging/public/portal/components/compare-engine.js
          node --check apps/kidults-enterprise-staging/public/portal/components/decision-engine.js
          node --check apps/kidults-enterprise-staging/public/portal/components/workspace.js
          node --check apps/kidults-enterprise-staging/public/portal/components/integrity-hardening.js
          node --check apps/kidults-enterprise-staging/public/portal/components/k100-integrity-reset.js
          node --check apps/kidults-enterprise-staging/public/portal/components/mobile-reconstruction.js
          node --check apps/kidults-enterprise-staging/public/portal/components/mobile-hero-visibility.js
          node --check apps/kidults-enterprise-staging/public/portal/components/editorial-assets.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/racing-roadster-v658.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/racing-roadster-v658-part1.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/racing-roadster-v658-part2.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/racing-roadster-v658-part3.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-footwear-v658.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-footwear-v658-part1.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-footwear-v658-part2.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-footwear-v658-part3.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-camera-v658.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-toys-v658.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-toys-v658-part1.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-toys-v658-part2.js
          node --check apps/kidults-enterprise-staging/public/portal/components/assets/k100-toys-v658-part3.js
          node --check scripts/kidults/portal/validate-living-pulse.mjs
          node --check scripts/kidults/portal/validate-why-engine.mjs
          node --check scripts/kidults/portal/validate-copilot.mjs
          node --check scripts/kidults/portal/validate-compare-engine.mjs
          node --check scripts/kidults/portal/validate-decision-engine.mjs
          node --check scripts/kidults/portal/validate-workspace.mjs
          node --check scripts/kidults/portal/validate-integrity-hardening.mjs
          node --check scripts/kidults/portal/validate-v502-portal.mjs
          node --check scripts/kidults/portal/validate-k100-integrity-reset.mjs
          node --check scripts/kidults/portal/validate-mobile-reconstruction.mjs
          node --check scripts/kidults/portal/validate-320-overflow-hotfix.mjs
          node --check scripts/kidults/portal/validate-mobile-hero-visibility.mjs
          node --check scripts/kidults/portal/validate-v658-visual-assets.mjs

      - name: Validate shared coordination
        run: node scripts/kidults/coordination/validate-coordination.mjs

      - name: Validate operational registry
        run: node scripts/kidults/registry/validate-operational-registry.mjs

      - name: Validate mission control
        run: node scripts/kidults/mission-control/validate-mission-control.mjs

      - name: Validate V502 Registry projection
        run: node scripts/kidults/portal/build-v502-registry-view.mjs

      - name: Validate Portal V502 Release Candidate
        run: node scripts/kidults/portal/validate-v502-portal.mjs

      - name: Validate Living Pulse Engine
        run: node scripts/kidults/portal/validate-living-pulse.mjs

      - name: Validate WHY Engine
        run: node scripts/kidults/portal/validate-why-engine.mjs

      - name: Validate Copilot Engine
        run: node scripts/kidults/portal/validate-copilot.mjs

      - name: Validate Compare Engine
        run: node scripts/kidults/portal/validate-compare-engine.mjs

      - name: Validate Decision Support Engine
        run: node scripts/kidults/portal/validate-decision-engine.mjs

      - name: Validate Living Intelligence Workspace
        run: node scripts/kidults/portal/validate-workspace.mjs

      - name: Validate V6 Integrity Hardening
        run: node scripts/kidults/portal/validate-integrity-hardening.mjs

      - name: Validate K100 Integrity Reset
        run: node scripts/kidults/portal/validate-k100-integrity-reset.mjs

      - name: Validate V6 Mobile Reconstruction
        run: node scripts/kidults/portal/validate-mobile-reconstruction.mjs

      - name: Validate 320px Overflow Hotfix
        run: node scripts/kidults/portal/validate-320-overflow-hotfix.mjs

      - name: Validate Mobile Hero Visibility
        run: node scripts/kidults/portal/validate-mobile-hero-visibility.mjs

      - name: Validate V658 Visual Assets
        run: node scripts/kidults/portal/validate-v658-visual-assets.mjs

      - name: Upload V658 portal for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: kidults-v658-portal
          path: apps/kidults-enterprise-staging/public/portal
          if-no-files-found: error
          retention-days: 3
