name: KIDULTS Cloudflare Credential Identity Preflight V2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kidults-cloudflare-credential-identity-preflight-v2-one-shot
  cancel-in-progress: false

jobs:
  verify-credential-identity-v2:
    environment: kidults-cloudflare-staging-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize canonical runner-temp receipt
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-credential-identity-preflight-v2"
          RECEIPT="$ROOT/receipt.json"
          mkdir -p "$ROOT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              id:"kidults-cloudflare-credential-identity-preflight-receipt-v2",
              version:"1.0.0",
              approval_id:"CF-CREDENTIAL-IDENTITY-PREFLIGHT-20260901-02",
              approval_issue:1774,
              root_approval_comment_id:5490553068,
              root_approval_body_sha256:"sha256:3d6ea6b4c95d9abe7e3328c0402a6ae9a7b12013d2d4e34ce0cba3c18aaeccf6",
              approval_nonce:"4e47ac299e26f983d9773efdf913c7619b587978d2ab2e3b",
              approval_expires_at:"2026-09-02T07:36:40Z",
              state:"DISPATCH_RECEIVED_PREAUTHORIZATION_NOT_VERIFIED",
              repository:$repository,
              workflow:".github/workflows/kidults-cloudflare-credential-identity-preflight-v2.yml",
              environment:"kidults-cloudflare-staging-deploy",
              source_ref:$source_ref,
              source_sha:$source_sha,
              run_id:$run_id,
              run_attempt:$run_attempt,
              workflow_dispatch_count_max:1,
              external_read_request_count_max:2,
              external_read_request_count:0,
              authorization_consumed:false,
              authorization_consumed_on:"FIRST_VALID_V2_PREFLIGHT_DISPATCH_PASS_OR_FAIL",
              root_approval_verified:false,
              post_landing_binding_verified:false,
              unique_first_dispatch_verified:false,
              account_id_shape_valid:false,
              token_active:false,
              workers_account_scope_readable:false,
              cloudflare_error_codes:[],
              cloudflare_error_7003_observed:false,
              worker_mutation_count:0,
              pages_mutation_count:0,
              route_mutation_count:0,
              domain_mutation_count:0,
              provider_response_handling:"IN_MEMORY_SANITIZED_FIELDS_ONLY",
              raw_provider_responses_persisted:false,
              raw_provider_responses_uploaded:false,
              secret_values_logged:false,
              secret_values_persisted:false,
              authorization_header_persisted:false,
              public:"HOLD",
              production:"HOLD",
              g5:"HOLD"
            }' > "$RECEIPT"
          jq -e '.id=="kidults-cloudflare-credential-identity-preflight-receipt-v2"' "$RECEIPT" >/dev/null

      - name: Verify live main before provider credential resolution
        id: live_main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Checkout exact execution SHA
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up governed Node
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Verify exact Program Owner approval, binding and unique first dispatch
        id: approval
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-credential-identity-preflight-v2"
          node scripts/kidults/kpmo/verify-cloudflare-credential-identity-preflight-v2-approval.mjs \
            "$ROOT/receipt.json"

      - name: Execute approved read-only Cloudflare credential identity preflight v2
        id: probe
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-credential-identity-preflight-v2"
          node scripts/kidults/kpmo/run-cloudflare-credential-identity-preflight-v2.mjs \
            "$ROOT/receipt.json"

      - name: Finalize truthful terminal receipt
        id: finalize
        if: always()
        shell: bash
        env:
          LIVE_MAIN_OUTCOME: ${{ steps.live_main.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          APPROVAL_OUTCOME: ${{ steps.approval.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-credential-identity-preflight-v2"
          RECEIPT="$ROOT/receipt.json"
          TMP_RECEIPT="$ROOT/receipt.tmp.json"
          test -s "$RECEIPT"

          terminal_state="VERIFIED_FAIL_PREAUTHORIZATION"
          if jq -e '.authorization_consumed==true' "$RECEIPT" >/dev/null; then
            terminal_state="VERIFIED_FAIL_AUTHORIZATION_CONSUMED"
          fi
          if [ "$PROBE_OUTCOME" = "success" ]; then
            terminal_state="VERIFIED_PASS_CLOUDFLARE_CREDENTIAL_IDENTITY"
          fi

          jq \
            --arg terminal_state "$terminal_state" \
            --arg live_main "$LIVE_MAIN_OUTCOME" \
            --arg checkout "$CHECKOUT_OUTCOME" \
            --arg setup_node "$SETUP_NODE_OUTCOME" \
            --arg approval "$APPROVAL_OUTCOME" \
            --arg probe "$PROBE_OUTCOME" \
            '.state=$terminal_state
             | .terminal=true
             | .step_outcomes={
                 live_main:$live_main,
                 checkout:$checkout,
                 setup_node:$setup_node,
                 approval:$approval,
                 probe:$probe
               }
             | .replay_authorized=false
             | .rerun_authorized=false
             | .second_dispatch_authorized=false
             | .worker_mutation_count=0
             | .pages_mutation_count=0
             | .route_mutation_count=0
             | .domain_mutation_count=0
             | .provider_response_handling="IN_MEMORY_SANITIZED_FIELDS_ONLY"
             | .raw_provider_responses_persisted=false
             | .raw_provider_responses_uploaded=false
             | .secret_values_logged=false
             | .secret_values_persisted=false
             | .authorization_header_persisted=false
             | .public="HOLD"
             | .production="HOLD"
             | .g5="HOLD"' \
            "$RECEIPT" > "$TMP_RECEIPT"
          mv "$TMP_RECEIPT" "$RECEIPT"

          jq -e '
            .terminal==true
            and .external_read_request_count<=2
            and .replay_authorized==false
            and .rerun_authorized==false
            and .second_dispatch_authorized==false
            and .worker_mutation_count==0
            and .pages_mutation_count==0
            and .route_mutation_count==0
            and .domain_mutation_count==0
            and .raw_provider_responses_persisted==false
            and .raw_provider_responses_uploaded==false
            and .secret_values_logged==false
            and .secret_values_persisted==false
            and .authorization_header_persisted==false' \
            "$RECEIPT" >/dev/null

      - name: Upload sanitized credential identity terminal receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-cloudflare-credential-identity-preflight-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-cloudflare-credential-identity-preflight-v2/receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Preserve exact credential identity terminal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.live_main.outcome }}" = "success"
          test "${{ steps.checkout.outcome }}" = "success"
          test "${{ steps.setup_node.outcome }}" = "success"
          test "${{ steps.approval.outcome }}" = "success"
          test "${{ steps.probe.outcome }}" = "success"
