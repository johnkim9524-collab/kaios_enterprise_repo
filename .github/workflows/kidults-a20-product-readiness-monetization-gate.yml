name: kidults-a20-product-readiness-monetization-gate
on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-a20-product-readiness-monetization-gate.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run a20:certify
      - name: Upload A20 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a20-product-readiness-evidence
          path: services/kidults-autonomous-intelligence/reports/product-readiness/*.json
          if-no-files-found: error
