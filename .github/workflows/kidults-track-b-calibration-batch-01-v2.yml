name: KIDULTS Track B Calibration Batch 01 v2

on:
  pull_request:
    paths:
      - "scripts/kidults/source-intelligence/build-track-b-calibration-batch-01-v2.mjs"
      - "scripts/kidults/source-intelligence/validate-track-b-calibration-batch-assessment-v2.mjs"
      - ".github/workflows/kidults-track-b-calibration-batch-01-v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kidults-track-b-calibration-batch-01-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check scripts/kidults/source-intelligence/build-track-b-calibration-batch-01-v2.mjs
          node --check scripts/kidults/source-intelligence/validate-track-b-calibration-batch-assessment-v2.mjs

      - name: Download immutable evidence-only calibration input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/input/track-b-calibration-v2.3
          gh run download 32006503565 \
            --repo "johnkim9524-collab/kaios_enterprise_repo" \
            --name kidults-track-b-calibration-readiness-v2-blind \
            --dir artifacts/input/track-b-calibration-v2.3
          test -f artifacts/input/track-b-calibration-v2.3/track-b-calibration-review-package-v2.json
          test -f artifacts/input/track-b-calibration-v2.3/track-b-calibration-batches-v2.json

      - name: Build Batch 01 assessment
        run: |
          node scripts/kidults/source-intelligence/build-track-b-calibration-batch-01-v2.mjs \
            --input artifacts/input/track-b-calibration-v2.3 \
            --output artifacts/agci-os/track-b-calibration-batch-01-v2 \
            --write

      - name: Prove deterministic same-input same-output
        run: |
          for attempt in 1 2; do
            node scripts/kidults/source-intelligence/build-track-b-calibration-batch-01-v2.mjs \
              --input artifacts/input/track-b-calibration-v2.3 \
              --output "/tmp/track-b-calibration-batch-01-$attempt" \
              --write
          done
          cmp /tmp/track-b-calibration-batch-01-1/track-b-calibration-assessment-batch-01-v2.json /tmp/track-b-calibration-batch-01-2/track-b-calibration-assessment-batch-01-v2.json
          cmp /tmp/track-b-calibration-batch-01-1/run-manifest.json /tmp/track-b-calibration-batch-01-2/run-manifest.json
          cmp artifacts/agci-os/track-b-calibration-batch-01-v2/track-b-calibration-assessment-batch-01-v2.json /tmp/track-b-calibration-batch-01-1/track-b-calibration-assessment-batch-01-v2.json

      - name: Validate Batch 01 assessment
        run: |
          node scripts/kidults/source-intelligence/validate-track-b-calibration-batch-assessment-v2.mjs \
            artifacts/agci-os/track-b-calibration-batch-01-v2 \
            track-b-calibration-assessment-batch-01-v2.json

      - name: Revalidate canonical governance
        run: |
          node scripts/kidults/architecture/validate-agci-os-registry-v2.mjs
          node scripts/kidults/registry/validate-operational-registry.mjs
          node scripts/kidults/mission-control/validate-mission-control.mjs

      - name: Upload Batch 01 assessment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kidults-track-b-calibration-assessment-batch-01-v2
          path: artifacts/agci-os/track-b-calibration-batch-01-v2
          if-no-files-found: error
          retention-days: 30
