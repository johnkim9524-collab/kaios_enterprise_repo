name: Kidults A35 Autonomous Production Optimization & Capacity Governance

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/kidults-autonomous-intelligence/scripts/a35-capacity-governance.mjs'
      - 'services/kidults-autonomous-intelligence/fixtures/a35/**'
      - 'services/kidults-autonomous-intelligence/package.json'
      - '.github/workflows/kidults-a35-capacity-governance.yml'

concurrency:
  group: kidults-a35-capacity-governance
  cancel-in-progress: false

jobs:
  a35-capacity-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm install

      - name: Verify A35 package scripts exist
        working-directory: services/kidults-autonomous-intelligence
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            const required = ['a35:gate', 'a35:certify', 'a35:finalize'];
            const missing = required.filter(s => !pkg.scripts[s]);
            if (missing.length) { console.error('MISSING SCRIPTS:', missing.join(', ')); process.exit(1); }
            console.log('A35 scripts present:', required.join(', '));
          "

      - name: Typecheck
        working-directory: services/kidults-autonomous-intelligence
        run: npm run typecheck

      - name: Run A35 capacity governance gate
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a35:gate
        env:
          A35_MODE: SIMULATION

      - name: Run A35 certify
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a35:certify
        env:
          A35_MODE: SIMULATION

      - name: Run upstream A34 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a34:certify
        env:
          A34_MODE: SIMULATION

      - name: Run upstream A33 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a33:certify
        env:
          A33_MODE: SIMULATION

      - name: Run upstream A32 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a32:certify
        env:
          A32_MODE: SIMULATION

      - name: List package scripts
        working-directory: services/kidults-autonomous-intelligence
        run: npm run

      - name: Upload A35 evidence
        uses: actions/upload-artifact@v4
        with:
          name: a35-capacity-governance-evidence
          path: services/kidults-autonomous-intelligence/reports/capacity-governance/
          retention-days: 90
          if-no-files-found: error
