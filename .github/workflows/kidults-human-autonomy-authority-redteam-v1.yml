name: KIDULTS Human Autonomy Authority Red-Team V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/human-autonomy-authority-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-human-autonomy-authority-v1.mjs'
      - '.github/workflows/kidults-human-autonomy-authority-redteam-v1.yml'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/kpmo/human-autonomy-authority-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-human-autonomy-authority-v1.mjs'
      - '.github/workflows/kidults-human-autonomy-authority-redteam-v1.yml'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate human-autonomy authority and escalation controls
        run: node scripts/kidults/kpmo/validate-human-autonomy-authority-v1.mjs
