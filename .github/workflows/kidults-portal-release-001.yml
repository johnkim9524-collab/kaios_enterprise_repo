name: KIDULTS Portal Release-001
on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/public/portal-r001/**'
      - 'coordination/kidults/portal/portal-release-001-product-design-v1.md'
      - 'scripts/kidults/portal/validate-portal-release-001.mjs'
      - '.github/workflows/kidults-portal-release-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/kidults/portal/validate-portal-release-001.mjs
