name: KIDULTS ASI Source Family Gap Feedback Discovery v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/build-asi-source-family-discovery-intent-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-source-family-discovery-intent-v1.mjs'
      - 'scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs'
      - '.github/workflows/kidults-asi-source-family-gap-feedback-discovery-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  source-family-gap-feedback-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-source-family-discovery-intent-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-source-family-discovery-intent-v1.mjs
          node --check scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs
      - name: Build deterministic autobalance fixture
        run: |
          node - <<'NODE' >/tmp/autobalance.json
          const fs=require('fs');
          const scopes=JSON.parse(fs.readFileSync('coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json')).scopes.map(x=>x.scope_id);
          const families=['PRIMARY_OR_OFFICIAL_AUTHORITY','OPEN_MARKETPLACE_OR_DEALER','GRADING_AUTHENTICATION_OR_CONDITION','MEDIA_COMMUNITY_OR_EVENT_CONTEXT','MUSEUM_OR_INSTITUTIONAL_CONTEXT','UNCLASSIFIED_ANY_SITE_CANDIDATE'];
          const counts={PRIMARY_OR_OFFICIAL_AUTHORITY:30,OPEN_MARKETPLACE_OR_DEALER:1,GRADING_AUTHENTICATION_OR_CONDITION:0,MEDIA_COMMUNITY_OR_EVENT_CONTEXT:2,MUSEUM_OR_INSTITUTIONAL_CONTEXT:0,UNCLASSIFIED_ANY_SITE_CANDIDATE:40};
          const fp=families.map(id=>{const c=counts[id];return{id,count:c,priority_weight:c===0?3:c<5?2.8:1,coverage_ratio:c/40,reason:c===0?'ZERO_SOURCE_FAMILY_COVERAGE':c<5?'LOW_SOURCE_FAMILY_COVERAGE':'NORMAL'}}).sort((a,b)=>b.priority_weight-a.priority_weight);
          const sp=scopes.map((id,i)=>({id,count:i,priority_weight:i<4?3:1.2,coverage_ratio:i/32,reason:i<4?'LOW_SCOPE_COVERAGE':'NORMAL'}));
          const rp=['NORTH_AMERICA','EUROPE','JAPAN','KOREA','GREATER_CHINA','SOUTHEAST_ASIA','OCEANIA','LATAM_MEA'].map((id,i)=>({id,count:i,priority_weight:i<2?3:1.2,coverage_ratio:i/8,reason:i<2?'LOW_REGION_COVERAGE':'NORMAL'}));
          process.stdout.write(JSON.stringify({id:'kidults-asi-throughput-coverage-autobalance-v1',status:'SHADOW_AUTOBALANCE_PLAN_READY',next_cycle_budget:{source_family_priorities:fp,scope_priorities:sp,region_priorities:rp},rules:{rights_gate_can_never_be_weakened:true},public_release:'HOLD',production:'HOLD'}));
          NODE
      - name: Build and validate adaptive bounded intent
        run: |
          node scripts/kidults/source-intelligence/build-asi-source-family-discovery-intent-v1.mjs /tmp/autobalance.json /tmp/intent.json
          node scripts/kidults/source-intelligence/validate-asi-source-family-discovery-intent-v1.mjs /tmp/intent.json
      - name: Restore immutable 160-anchor foundation and build governed queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input queue discovery-out
          node scripts/kidults/supply-chain/restore-canonical-anchor-artifact-v1.mjs \
            /tmp/anchor-foundation.zip /tmp/kidults-canonical-anchor-restore-receipt-v1.json
          unzip -q -o /tmp/anchor-foundation.zip -d input
          node scripts/kidults/supply-chain/validate-canonical-anchor-extracted-v1.mjs input
          node scripts/kidults/source-intelligence/build-product-linked-targeted-asi-queue-v1.mjs input queue
          node scripts/kidults/source-intelligence/validate-product-linked-targeted-asi-queue-v1.mjs queue
      - name: Empirically execute provider-adaptive supplemental discovery
        env:
          GH_TOKEN: ${{ github.token }}
          ASI_SOURCE_FAMILY_DISCOVERY_INTENT: /tmp/intent.json
        run: |
          node scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs queue discovery-out
          node scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs discovery-out/global-low-risk-discovery.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery.json'));
          if(x.source_family_gap_intent_applied!==true)throw new Error('INTENT_NOT_APPLIED');
          const lane=x.lane_health.find(y=>y.lane_id==='DATACITE_SOURCE_FAMILY_GAP_SUPPLEMENT');
          if(!lane||!['SUCCESS_WITH_RESULTS','SUCCESS_ZERO_RESULTS'].includes(lane.status))throw new Error(`DATACITE_SUPPLEMENT_NOT_PROVEN:${lane?.status}`);
          if(!(x.source_family_gap_datacite_directive_count>0))throw new Error('NO_DATACITE_DIRECTIVES');
          if(x.baseline_discovery_executed!==true)throw new Error('BASELINE_REMOVED');
          console.log(JSON.stringify({status:'PASS',supplemental_query_count:x.supplemental_query_count,datacite_directives:x.source_family_gap_datacite_directive_count,datacite_lane:lane,candidates:x.candidate_count,live_external:x.live_external_candidate_count,production:x.production}));
          NODE
      - name: Reject baseline removal mutation
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/intent.json'));x.baseline_discovery_required=false;fs.writeFileSync('/tmp/bad-baseline.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-source-family-discovery-intent-v1.mjs /tmp/bad-baseline.json; then exit 1; fi
      - name: Reject unclassified target mutation
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/intent.json'));x.target_family_ids.push('UNCLASSIFIED_ANY_SITE_CANDIDATE');fs.writeFileSync('/tmp/bad-unclassified.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-source-family-discovery-intent-v1.mjs /tmp/bad-unclassified.json; then exit 1; fi
      - name: Reject rights weakening mutation
        run: |
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/intent.json'));x.rules.rights_gate_can_never_be_weakened=false;fs.writeFileSync('/tmp/bad-rights.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-source-family-discovery-intent-v1.mjs /tmp/bad-rights.json; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-source-family-gap-feedback-discovery-v1
          path: |
            /tmp/intent.json
            discovery-out/global-low-risk-discovery.json
          retention-days: 30
          if-no-files-found: error
