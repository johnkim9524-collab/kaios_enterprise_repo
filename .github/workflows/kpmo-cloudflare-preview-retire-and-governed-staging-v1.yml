name: KPMO Cloudflare Preview Retirement and Governed STAGING v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kpmo-cloudflare-preview-retire-and-governed-staging-v1.yml
      - scripts/ops/cloudflare-pages-preview-cleanup.sh
      - scripts/ops/cloudflare-pages-governed-staging-deploy.sh
      - scripts/ops/cloudflare-pages-boundary-readonly.sh
      - coordination/kidults/runtime/cloudflare-pages-staging-governance-v1.json
      - scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs

permissions:
  contents: read

concurrency:
  group: kpmo-cloudflare-preview-retire-and-governed-staging-v1
  cancel-in-progress: false

jobs:
  retire-and-deploy:
    if: github.actor == github.repository_owner
    environment: kidults-cloudflare-staging-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: kidults-workspace-staging
      EXPECTED_REPOSITORY: johnkim9524-collab/kaios_enterprise_repo
    steps:
      - name: Verify live protected main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate governance before mutation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs

      - name: Retire materialized Preview deployments only
        shell: bash
        env:
          RECEIPT_DIR: artifacts/cloudflare-preview-retirement
          CONTROL_REASON: Retire historical materialized Preview estate after automatic Preview and Production Git deployments were disabled and API-verified
        run: |
          set -euo pipefail
          bash scripts/ops/cloudflare-pages-preview-cleanup.sh --delete-preview
          jq -e '.state == "COMPLETE_VERIFIED" and .remaining_preview_ids == [] and .production_mutation == false' "$RECEIPT_DIR/final.json" >/dev/null

      - name: Deploy exact protected-main SHA to governed STAGING
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEPLOY_REASON: First governed exact-main STAGING deployment after ambient Git deployment containment and Preview estate retirement
          RECEIPT_DIR: artifacts/cloudflare-governed-staging-deploy
        run: |
          set -euo pipefail
          bash scripts/ops/cloudflare-pages-governed-staging-deploy.sh
          jq -e '.state == "COMPLETE_VERIFIED" and .exact_sha_bound == true and .deployment.trigger_type == "ad_hoc" and .automatic_git_deployments_disabled_after_deploy == true' "$RECEIPT_DIR/final.json" >/dev/null

      - name: Final read-back using same bounded credential
        shell: bash
        env:
          RECEIPT_DIR: artifacts/cloudflare-pages-boundary-final-readback
        run: |
          set -euo pipefail
          bash scripts/ops/cloudflare-pages-boundary-readonly.sh
          jq -e '.state == "COMPLETE_VERIFIED" and .settings_pass == true and .visible_preview_count == 0 and .latest_deployment_governed == true' "$RECEIPT_DIR/final.json" >/dev/null

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cloudflare-preview-retirement-governed-staging-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/cloudflare-preview-retirement
            artifacts/cloudflare-governed-staging-deploy
            artifacts/cloudflare-pages-boundary-final-readback
          if-no-files-found: error
          retention-days: 30
