name: KPMO Cloudflare Preview Retirement and Governed STAGING v1

on:
  workflow_run:
    workflows: ["KPMO Cloudflare External One-Shot Approval Consume v1"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kpmo-cf-kidults-14501ac-01-one-shot
  cancel-in-progress: false

jobs:
  retire-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_run' &&
      contains(github.event.workflow_run.head_commit.message, 'CF-KIDULTS-14501AC-01') &&
      false
    environment: kidults-cloudflare-staging-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"
          test "$EVENT_HEAD_SHA" = "$GITHUB_SHA"
          artifact_name="cf-external-one-shot-approval-receipt-${EVENT_HEAD_SHA}-${EVENT_RUN_ID}"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$EVENT_RUN_ID/artifacts?per_page=100" \
            > /tmp/approval-artifacts.json
          artifact_id="$(jq -r --arg name "$artifact_name" \
            '[.artifacts[] | select(.name==$name and .expired==false)] | if length==1 then .[0].id else empty end' \
            /tmp/approval-artifacts.json)"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          curl --fail-with-body --silent --show-error --location --proto '=https' --max-redirs 1 \
            --connect-timeout 10 --max-time 60 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/approval-receipt.zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: johnkim9524-collab/kaios_enterprise_repo
          ref: 14501ac022bdd7c918924a207f257b047b1ba970
          path: target-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact Program Owner approval and one-shot merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C target-source rev-parse HEAD)" = "14501ac022bdd7c918924a207f257b047b1ba970"
          git merge-base --is-ancestor 14501ac022bdd7c918924a207f257b047b1ba970 "$GITHUB_SHA"
          COMMIT_MESSAGE="$(git log -1 --format=%B)"
          grep -q '^Merge PR #[0-9][0-9]*: execute CF-KIDULTS-14501AC-01$' <<<"$(head -n 1 <<<"$COMMIT_MESSAGE")"
          grep -q 'approval_id=CF-KIDULTS-14501AC-01' <<<"$COMMIT_MESSAGE"
          NOW_EPOCH="$(date -u +%s)"
          EXPIRY_EPOCH="$(date -u -d "$(jq -r '.expires_at' coordination/kidults/runtime/cf-kidults-14501ac-01-approval.json)" +%s)"
          test "$NOW_EPOCH" -le "$EXPIRY_EPOCH"
          jq -e '
            .state == "PROGRAM_OWNER_EXPLICIT_ONE_SHOT_APPROVAL"
            and .approval_id == "CF-KIDULTS-14501AC-01"
            and .source_event_id == "CF-KIDULTS-14501AC-01"
            and .source_text_sha256 == "sha256:69bb0b446992e067269b36beb11f936f52e2a08d104d94d9f9940f2a6c9ad71f"
            and .one_time == true
            and .target_sha == "14501ac022bdd7c918924a207f257b047b1ba970"
            and .max_materialized_preview_deletions == 588
            and .truth_boundary.public_release == "HOLD"
            and .truth_boundary.production == "HOLD"
            and .truth_boundary.g5 == "HOLD"
          ' coordination/kidults/runtime/cf-kidults-14501ac-01-approval.json >/dev/null

      - name: Block current lane until signed exact-binding receipt delivery exists
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.state | startswith("BLOCKED_"))
            and .global_no_rerun.state == "HOLD"
            and .global_no_rerun.provider_calls_authorized == false
            and ([.mutation_lanes[] | select(.workflow == ".github/workflows/kpmo-cloudflare-preview-retire-and-governed-staging-v1.yml" and .hard_disabled == true)] | length == 1)
            and .external_blockers.signed_exact_binding_state_readback_issued == false
            and .authority_rules.repository_boolean_is_authority == false
          ' coordination/kidults/runtime/cloudflare-external-one-shot-approval-future-activation-v1.json >/dev/null
          exit 78

      - name: Materialize exact triggering signed receipt artifact
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/approval-receipt.zip
          mkdir -p artifacts
          unzip -q /tmp/approval-receipt.zip -d artifacts

      - name: Verify downloaded exact signed consume receipt before provider credentials
        if: ${{ false }}
        shell: bash
        env:
          KIDULTS_APPROVAL_LEDGER_RESPONSE_ED25519_PUBLIC_KEY_B64: ${{ vars.KIDULTS_APPROVAL_LEDGER_RESPONSE_ED25519_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          test -f artifacts/external-one-shot-approval-consume-request-v1.json
          test -f artifacts/external-one-shot-approval-client-receipt-v1.json
          export KIDULTS_APPROVAL_LEDGER_RESPONSE_ED25519_PUBLIC_KEY_SHA256="$(
            jq -r '.response_verification.public_key_spki_sha256' \
              coordination/kidults/runtime/cf-kidults-14501ac-01-ledger-binding-v1.json
          )"
          node scripts/governance/external-one-shot-approval-ledger-v1.mjs verify \
            --request artifacts/external-one-shot-approval-consume-request-v1.json \
            --receipt artifacts/external-one-shot-approval-client-receipt-v1.json

      - name: Validate governance before mutation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs
          node tests/kidults/kpmo/cf-kidults-14501ac-01-approval.test.mjs
          bash -n scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh

      - name: Execute one-shot Preview retirement and governed STAGING
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_LEGACY_UNUSED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: 235eaa51d04e7f4436a9faa507a04f9d
          CLOUDFLARE_PAGES_PROJECT_NAME: kidults-workspace-staging
          EXPECTED_REPOSITORY: johnkim9524-collab/kaios_enterprise_repo
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: 235eaa51d04e7f4436a9faa507a04f9d
          APPROVAL_ID: CF-KIDULTS-14501AC-01
          APPROVAL_RECEIPT_PATH: coordination/kidults/runtime/cf-kidults-14501ac-01-approval.json
          APPROVAL_LEDGER_BINDING_PATH: coordination/kidults/runtime/cf-kidults-14501ac-01-ledger-binding-v1.json
          KIDULTS_APPROVAL_LEDGER_RESPONSE_ED25519_PUBLIC_KEY_B64: ${{ vars.KIDULTS_APPROVAL_LEDGER_RESPONSE_ED25519_PUBLIC_KEY_B64 }}
          UPSTREAM_APPROVAL_CONSUME_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_APPROVAL_OPERATION_ID: CLOUDFLARE_PAGES_PREVIEW_RETIRE_AND_GOVERNED_STAGING
          EXPECTED_APPROVAL_WORKFLOW_REF: .github/workflows/kpmo-cloudflare-approval-consume-v1.yml@refs/heads/main
          TARGET_SHA: 14501ac022bdd7c918924a207f257b047b1ba970
          SOURCE_DIR: target-source/apps/kidults-enterprise-staging/public
          MAX_PREVIEW_DELETIONS: '588'
          RECEIPT_ROOT: artifacts/cf-kidults-14501ac-01
        run: bash scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cf-kidults-14501ac-01-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cf-kidults-14501ac-01
          if-no-files-found: error
          retention-days: 30
