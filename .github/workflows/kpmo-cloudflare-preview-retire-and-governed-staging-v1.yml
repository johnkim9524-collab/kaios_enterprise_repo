name: KPMO Cloudflare Preview Retirement and Governed STAGING v1

on:
  workflow_run:
    workflows: ["KPMO CF-KIDULTS-14501AC-01 Preflight"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kpmo-cf-kidults-14501ac-01-retired
  cancel-in-progress: false

jobs:
  retire-and-deploy:
    # Permanent tombstone. The approved one-shot completed in run 33262992819
    # and issue #1583 is closed as CONSUMED_COMPLETED. Keeping the registered
    # job shape until the secret-lane registry is migrated prevents silent
    # inventory drift, while this immutable false condition prevents secret
    # resolution and every remote action.
    if: ${{ false }}
    environment: kidults-cloudflare-staging-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Execute one-shot Preview retirement and governed STAGING
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPROVAL_ID: CF-KIDULTS-14501AC-01
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          bash scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh
