name: KIDULTS Full Value Chain Red-Team Orchestrator V1

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/kidults-full-value-chain-redteam-orchestrator-v1.yml"
      - "scripts/kidults/**"
      - "tests/kidults/**"
      - "coordination/kidults/**"
      - "apps/kidults-enterprise-staging/**"
      - "services/kidults-autonomous-intelligence/**"
      - "requirements*.txt"
      - "package*.json"
      - "Dockerfile"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  full-value-chain-redteam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Record authoritative runner identity
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS:-UNKNOWN}"
          echo "runner_arch=${RUNNER_ARCH:-UNKNOWN}"
          echo "image_os=${ImageOS:-UNKNOWN}"
          echo "image_version=${ImageVersion:-UNKNOWN}"
          echo "node=$(node --version)"
          cat /etc/os-release
      - name: Validate full value-chain live-authority binding regression
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/kidults/kpmo/validate-full-value-chain-live-authority-binding-v1.mjs
      - name: Validate live canonical current-main HOLD authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/validate-canonical-latest-block-scope-v1.mjs --self-test
          node scripts/kidults/kpmo/validate-canonical-latest-block-scope-v1.mjs
      - name: Validate live material-defect severity parity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/validate-material-defect-severity-parity-v2.mjs --self-test
          node scripts/kidults/kpmo/validate-material-defect-severity-parity-v2.mjs
      - name: Run aggregate full value-chain Red-Team suite
        run: node scripts/kidults/kpmo/run-full-value-chain-redteam-suite-v1.mjs
