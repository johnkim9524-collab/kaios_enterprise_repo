name: KIDULTS Full Value Chain Red-Team Orchestrator V1

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  full-value-chain-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run aggregate full value-chain Red-Team suite
        run: node scripts/kidults/kpmo/run-full-value-chain-redteam-suite-v1.mjs
