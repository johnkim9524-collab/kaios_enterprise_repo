name: KIDULTS Full Value Chain Red-Team Orchestrator V1

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  full-value-chain-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate full value-chain Red-Team orchestrator
        run: node scripts/kidults/kpmo/validate-full-value-chain-redteam-orchestrator-v1.mjs
