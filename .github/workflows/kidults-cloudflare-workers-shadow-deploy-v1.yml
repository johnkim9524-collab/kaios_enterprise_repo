name: KIDULTS Cloudflare Workers Shadow Deploy v1

# Consumed one-shot lane: use a runtime-valid event map that rejects every
# branch and tag push. No manual, PR, schedule, Environment, secret, checkout,
# or provider authority exists on this historical workflow.
on:
  push:
    branches-ignore:
      - '**'
    tags-ignore:
      - '**'

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-workers-shadow-deploy-v1-consumed
  cancel-in-progress: false

jobs:
  deploy-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create consumed authorization tombstone
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-workers-shadow-v1-consumed"
          RECEIPT="$ROOT/receipt.json"
          mkdir -p "$ROOT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              id:"kidults-cloudflare-workers-shadow-v1-consumed-tombstone-v1",
              approval_id:"CF-WORKERS-SHADOW-20260831-01",
              state:"CONSUMED_PRE_PROVIDER_NO_RUN_ARTIFACT",
              historical_consuming_run_id:33410598558,
              repository:$repository,
              source_ref:$source_ref,
              source_sha:$source_sha,
              tombstone_run_id:$run_id,
              tombstone_run_attempt:$run_attempt,
              authorization_consumed:true,
              executable_authority:false,
              environment_bound:false,
              credential_resolution_authorized:false,
              provider_activation_authorized:false,
              provider_process_invoked_in_historical_run:false,
              historical_provider_deployment_attempt_count:0,
              historical_execution_artifact_present:false,
              historical_evidence_class:"POST_HOC_CONTROL_RECORD_NOT_EXECUTION_ARTIFACT",
              replay_authorized:false,
              promotable:false,
              empirical_provider_success:false,
              boundary:"PUBLIC_PRODUCTION_G5_HOLD",
              public:"HOLD",
              production:"HOLD",
              g5:"HOLD"
            }' > "$RECEIPT"
          jq -e '.authorization_consumed==true and .executable_authority==false and .replay_authorized==false' "$RECEIPT" >/dev/null

      - name: Upload consumed authorization tombstone
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-cloudflare-workers-shadow-v1-consumed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-cloudflare-workers-shadow-v1-consumed/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce consumed authorization no replay
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'CONSUMED_ZERO_EXECUTABLE_AUTHORITY_NO_REPLAY'
          exit 78
