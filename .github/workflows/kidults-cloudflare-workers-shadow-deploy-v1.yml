name: KIDULTS Cloudflare Workers Shadow Deploy v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-workers-shadow-deploy-v1
  cancel-in-progress: false

jobs:
  spent-authorization-tombstone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Emit spent one-shot fail-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/kidults-cloudflare-workers-shadow-spent-authorization-receipt.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              id:"kidults-cloudflare-workers-shadow-spent-authorization-receipt-v1",
              state:"VERIFIED_FAIL_AUTHORIZATION_ALREADY_CONSUMED_NO_PROVIDER_AUTHORITY",
              repository:$repository,
              source_ref:$source_ref,
              source_sha:$source_sha,
              run_id:$run_id,
              run_attempt:$run_attempt,
              approval_id:"CF-WORKERS-SHADOW-20260831-01",
              authorization_state:"CONSUMED_FAILED_BEFORE_PROVIDER_ATTEMPT",
              authorization_consumed_by_run_id:33410598558,
              authorization_consumed_by_run_attempt:1,
              authorization_consumed_source_sha:"e5efb9435e4a8847927791ae4fc9b580b75506c1",
              provider_mutation_attempted:false,
              provider_deployment_attempt_count:0,
              historical_terminal_artifact_retained:false,
              replay_authorized:false,
              provider_execution_authorized:false,
              credential_resolution_authorized:false,
              production_routes:0,
              custom_domains:0,
              pages_delete:"FORBIDDEN",
              public:"HOLD",
              production:"HOLD",
              g5:"HOLD",
              promotion_eligible:false,
              terminal_state:"FAIL_CLOSED_TOMBSTONE_NO_REPLAY"
            }' > "$RECEIPT"
          test -s "$RECEIPT"

      - name: Upload sanitized spent-authorization receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-cloudflare-workers-shadow-spent-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-cloudflare-workers-shadow-spent-authorization-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fail-closed no-replay verdict
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'CF_WORKERS_SHADOW_ONE_SHOT_AUTHORIZATION_ALREADY_CONSUMED_NO_REPLAY'
          exit 78
