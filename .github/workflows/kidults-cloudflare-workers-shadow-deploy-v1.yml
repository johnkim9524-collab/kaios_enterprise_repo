name: KIDULTS Cloudflare Workers Shadow Deploy v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-workers-shadow-deploy-v1
  cancel-in-progress: false

jobs:
  consumed-authorization-tombstone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize sanitized consumed-authorization tombstone
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="${RUNNER_TEMP}/kidults-cloudflare-workers-shadow-consumed-tombstone.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              id:"kidults-cloudflare-workers-shadow-consumed-tombstone-v1",
              evidence_class:"EXECUTION_TOMBSTONE_CONTROL_RECEIPT_NOT_PROVIDER_EVIDENCE",
              state:"VERIFIED_FAIL_AUTHORIZATION_ALREADY_CONSUMED",
              approval_id:"CF-WORKERS-SHADOW-20260831-01",
              authorization_consumed:true,
              consuming_run:{id:33410598558,attempt:1,source_sha:"e5efb9435e4a8847927791ae4fc9b580b75506c1",event:"workflow_dispatch"},
              current_run:{repository:$repository,source_ref:$source_ref,source_sha:$source_sha,run_id:$run_id,run_attempt:$run_attempt,event:"workflow_dispatch"},
              provider_mutation_attempted:false,
              provider_deployment_attempt_count:0,
              credential_resolution_attempted:false,
              network_request_attempted:false,
              replay:"FORBIDDEN_AFTER_FIRST_WORKFLOW_DISPATCH_REGARDLESS_OF_TERMINAL_STATE",
              terminal_state:"FAIL_CLOSED_NO_REPLAY_NO_PROVIDER_AUTHORITY",
              production_routes:0,
              custom_domains:0,
              pages_delete:"FORBIDDEN",
              public:"HOLD",
              production:"HOLD",
              g5:"HOLD"
            }' > "$RECEIPT"

      - name: Upload consumed-authorization terminal tombstone
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-cloudflare-workers-shadow-consumed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-cloudflare-workers-shadow-consumed-tombstone.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve deterministic RED after terminal receipt
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'CLOUDFLARE_WORKERS_SHADOW_AUTHORIZATION_ALREADY_CONSUMED_NO_REPLAY'
          exit 78
