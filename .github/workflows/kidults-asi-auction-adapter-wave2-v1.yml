name: KIDULTS ASI Auction Adapter Wave 2 v1

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-auction-adapter-wave2-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-auction-adapter-wave2-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p1-market-event-adapter-runtime-contract-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'services/kidults-autonomous-intelligence/src/asi/market-adapter.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/public-auction-results-common.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/barrett-jackson-results.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/broad-arrow-results.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/collecting-cars-sold.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/iconic-auctioneers-results.ts'
      - 'services/kidults-autonomous-intelligence/scripts/asi-auction-adapter-wave2-test.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-auction-adapter-wave2-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs'
      - 'docs/kidults/asi/asi-auction-adapter-wave2-v1.md'
      - '.github/workflows/kidults-asi-auction-adapter-wave2-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-auction-adapter-wave2-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-auction-adapter-wave2-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p1-market-event-adapter-runtime-contract-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'services/kidults-autonomous-intelligence/src/asi/market-adapter.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/public-auction-results-common.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/barrett-jackson-results.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/broad-arrow-results.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/collecting-cars-sold.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/iconic-auctioneers-results.ts'
      - 'services/kidults-autonomous-intelligence/scripts/asi-auction-adapter-wave2-test.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-auction-adapter-wave2-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs'
      - 'docs/kidults/asi/asi-auction-adapter-wave2-v1.md'
      - '.github/workflows/kidults-asi-auction-adapter-wave2-v1.yml'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Bonhams Cars Results Reference Adapter v1'
      - 'KIDULTS ASI Autonomous Resolution Layer v1'
      - 'KIDULTS ASI P1 Market-Event Adapter Runtime v1'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-auction-adapter-wave2-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-auction-adapter-wave2:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json
      - name: Verify exact source syntax and contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check services/kidults-autonomous-intelligence/scripts/asi-auction-adapter-wave2-test.mjs
          node --check scripts/kidults/source-intelligence/build-asi-auction-adapter-wave2-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-auction-adapter-wave2-contract-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-auction-adapter-wave2-registry-v1.json','utf8'))"
      - name: Install bounded runtime dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck shared parser and four source adapters
        working-directory: services/kidults-autonomous-intelligence
        run: npm run typecheck
      - name: Run four source-specific adapter fixture and mutation suites
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          node scripts/asi-auction-adapter-wave2-test.mjs \
            | tee /tmp/auction-adapter-wave2-test-receipt-v1.json
      - name: Build wave 2 implementation registry twice
        run: |
          set -euo pipefail
          for RUN in 1 2; do
            node scripts/kidults/source-intelligence/build-asi-auction-adapter-wave2-v1.mjs \
              coordination/kidults/source-intelligence/asi-p1-market-event-adapter-runtime-contract-v1.json \
              coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv \
              coordination/kidults/source-intelligence/asi-auction-adapter-wave2-contract-v1.json \
              "/tmp/kidults-asi-auction-adapter-wave2-run-${RUN}"
          done
          diff -qr /tmp/kidults-asi-auction-adapter-wave2-run-1 /tmp/kidults-asi-auction-adapter-wave2-run-2
          cp -a /tmp/kidults-asi-auction-adapter-wave2-run-1 /tmp/kidults-asi-auction-adapter-wave2-v1
      - name: Validate four implemented adapters and eleven-item backlog
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs \
            /tmp/kidults-asi-auction-adapter-wave2-v1 \
            /tmp/auction-adapter-wave2-test-receipt-v1.json \
            | tee /tmp/auction-adapter-wave2-validation-v1.json
      - name: Reject ambiguous-dollar semantic weakening
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          cp src/asi/source-adapters/public-auction-results-common.ts /tmp/public-auction-results-common.ts
          python - <<'PY'
          p='src/asi/source-adapters/public-auction-results-common.ts'
          s=open(p).read().replace("return { state: 'AMBIGUOUS_DOLLAR', price: null, currency: null };", "return { state: 'MATCH', price: 125000, currency: 'USD' };")
          open(p,'w').write(s)
          PY
          if node scripts/asi-auction-adapter-wave2-test.mjs; then
            echo 'Fixture suite accepted ambiguous-dollar semantic weakening' >&2
            exit 1
          fi
          mv /tmp/public-auction-results-common.ts src/asi/source-adapters/public-auction-results-common.ts
      - name: Reject fixture-to-Evidence promotion
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-auction-adapter-wave2-contract-v1.json /tmp/auction-wave2-contract.json
          node - <<'NODE'
          const fs=require('fs');const p='coordination/kidults/source-intelligence/asi-auction-adapter-wave2-contract-v1.json';const x=JSON.parse(fs.readFileSync(p));x.fixture_policy.can_activate_adapter=true;x.fixture_policy.can_create_evidence_or_market_event=true;x.portfolio_state_after_wave.source_specific_adapters_activated=1;x.portfolio_state_after_wave.evidence_admitted=1;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs /tmp/kidults-asi-auction-adapter-wave2-v1 /tmp/auction-adapter-wave2-test-receipt-v1.json; then
            echo 'Validator accepted fixture promotion or false Evidence admission' >&2
            exit 1
          fi
          mv /tmp/auction-wave2-contract.json coordination/kidults/source-intelligence/asi-auction-adapter-wave2-contract-v1.json
      - name: Reject pending-template implementation overclaim
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-auction-adapter-wave2-v1 /tmp/bad-pending-template
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-pending-template/auction-adapter-wave2-implementation-registry-v1.json';const x=JSON.parse(fs.readFileSync(p));const item=x.profiles.find((v)=>v.source_id==='bonhams-watches-results');item.implementation_state='SOURCE_SPECIFIC_ADAPTER_IMPLEMENTED_FIXTURE_VERIFIED_NOT_EMPIRICALLY_ACTIVATED';item.deterministic_fixture_verified=true;item.generic_market_adapter_runtime_bound=true;x.wave2_source_specific_adapters_implemented=5;x.total_source_specific_adapters_implemented=6;x.source_specific_adapters_pending=10;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs /tmp/bad-pending-template /tmp/auction-adapter-wave2-test-receipt-v1.json; then
            echo 'Validator accepted pending template as an implemented source adapter' >&2
            exit 1
          fi
      - name: Reject false Evidence and Market Event state
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-auction-adapter-wave2-v1 /tmp/bad-evidence-state
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-evidence-state/auction-adapter-wave2-implementation-registry-v1.json';const x=JSON.parse(fs.readFileSync(p));x.evidence_admitted=1;x.market_events_created=1;x.profiles[0].adapter_activated=true;x.profiles[0].evidence_admitted=1;x.profiles[0].market_events_created=1;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs /tmp/bad-evidence-state /tmp/auction-adapter-wave2-test-receipt-v1.json; then
            echo 'Validator accepted unverified Evidence or Market Event state' >&2
            exit 1
          fi
      - name: Revalidate pristine wave 2 outputs
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-auction-adapter-wave2-v1.mjs \
            /tmp/kidults-asi-auction-adapter-wave2-v1 \
            /tmp/auction-adapter-wave2-test-receipt-v1.json \
            > /tmp/auction-adapter-wave2-final-validation-v1.json
      - name: Emit KPMO auction-adapter wave 2 receipt
        run: |
          node - <<'NODE' >/tmp/auction-adapter-wave2-kpmo-receipt-v1.json
          const fs=require('fs'),crypto=require('crypto');const test=JSON.parse(fs.readFileSync('/tmp/auction-adapter-wave2-test-receipt-v1.json'));const validation=JSON.parse(fs.readFileSync('/tmp/auction-adapter-wave2-final-validation-v1.json'));const manifest=JSON.parse(fs.readFileSync('/tmp/kidults-asi-auction-adapter-wave2-v1/auction-adapter-wave2-manifest-v1.json'));const digest=p=>'sha256:'+crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');process.stdout.write(JSON.stringify({id:'kidults-asi-auction-adapter-wave2-kpmo-receipt-v1',version:'1.0.0',state:'VERIFIED_PASS',source_sha:process.env.GITHUB_SHA,trigger_event:process.env.GITHUB_EVENT_NAME,test_digest:digest('/tmp/auction-adapter-wave2-test-receipt-v1.json'),validation_digest:digest('/tmp/auction-adapter-wave2-final-validation-v1.json'),manifest_digest:digest('/tmp/kidults-asi-auction-adapter-wave2-v1/auction-adapter-wave2-manifest-v1.json'),wave2_source_specific_adapters_implemented:validation.wave2_source_specific_adapters_implemented,total_source_specific_adapters_implemented:validation.total_source_specific_adapters_implemented,registered_source_profiles:validation.registered_source_profiles,source_specific_adapters_pending:validation.source_specific_adapters_pending,implemented_parser_assignment_coverage:validation.implemented_parser_assignment_coverage,pending_adapter_assignment_count:validation.pending_adapter_assignment_count,deterministic_replays_verified:test.deterministic_replays_verified,negative_fixture_mutations_rejected:test.negative_fixture_mutations_rejected,live_source_snapshots_verified:0,field_purpose_rights_verified_sources:0,source_specific_adapters_activated:0,evidence_admitted:0,market_events_created:0,autonomous_effect:manifest.autonomous_effect,global_effect:manifest.global_effect,irreplaceable_value_effect:manifest.irreplaceable_value_effect,transparency_effect:manifest.transparency_effect,public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/auction-adapter-wave2-kpmo-receipt-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-auction-adapter-wave2-v1
          path: |
            /tmp/auction-adapter-wave2-test-receipt-v1.json
            /tmp/auction-adapter-wave2-validation-v1.json
            /tmp/auction-adapter-wave2-final-validation-v1.json
            /tmp/kidults-asi-auction-adapter-wave2-v1
            /tmp/auction-adapter-wave2-kpmo-receipt-v1.json
          retention-days: 90
          if-no-files-found: error
