name: KIDULTS Shared Portal Lifecycle One-Shot Self Fix V1

on:
  push:
    branches:
      - codex/shared-portal-lifecycle-integrity-v1
    paths:
      - '.github/workflows/kidults-shared-portal-self-fix-v1.yml'

permissions:
  contents: write

concurrency:
  group: kidults-shared-portal-lifecycle-self-fix-v1
  cancel-in-progress: false

jobs:
  apply-exact-runner:
    name: Apply exact route-free BFCache runner
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact feature branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/shared-portal-lifecycle-integrity-v1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Restore exact reviewed runner bytes
        run: |
          set -euo pipefail
          cat > /tmp/kidults-runner.mjs.gz.b64 <<'B64'

B64
          base64 --decode /tmp/kidults-runner.mjs.gz.b64 | gzip --decompress > scripts/kidults/portal/runtime/run-shared-portal-lifecycle-integrity-v1.mjs
          test "$(sha256sum scripts/kidults/portal/runtime/run-shared-portal-lifecycle-integrity-v1.mjs | cut -d' ' -f1)" = "146559fb1bc877e452ad40068b400952af7cc1bf803a6c1139e9a9a75a15338b"
          test "$(git hash-object scripts/kidults/portal/runtime/run-shared-portal-lifecycle-integrity-v1.mjs)" = "8fac3b4ab43046f61a7e33ab2a6bb480a35ca6ec"
          node --check scripts/kidults/portal/runtime/run-shared-portal-lifecycle-integrity-v1.mjs
          node scripts/kidults/portal/runtime/run-shared-portal-lifecycle-integrity-v1.mjs --self-test
          git diff --check

      - name: Commit exact reversible correction to feature branch
        run: |
          set -euo pipefail
          git config user.name "KIDULTS KPMO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/kidults/portal/runtime/run-shared-portal-lifecycle-integrity-v1.mjs
          git diff --cached --quiet && { echo 'Expected runner correction is empty'; exit 1; }
          git commit -m "[CF-Pages-Skip] fix(portal): use route-free BFCache fixture"
          git push origin "HEAD:codex/shared-portal-lifecycle-integrity-v1"
