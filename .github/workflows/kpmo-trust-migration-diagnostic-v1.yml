name: KPMO Trust Migration Diagnostic v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-trust-migration-diagnostic-v1.yml'
      - 'scripts/kidults/**'
      - 'coordination/kidults/**'

permissions:
  contents: read

jobs:
  dependency-closure-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Capture dependency-closure result
        id: closure
        shell: bash
        run: |
          set +e
          node scripts/kidults/kpmo/validate-trusted-control-dependency-closure-v1.mjs > /tmp/trusted-closure.log 2>&1
          status=$?
          cat /tmp/trusted-closure.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kpmo-trusted-closure-diagnostic-${{ github.event.pull_request.head.sha }}
          path: /tmp/trusted-closure.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve fail-closed verdict
        shell: bash
        run: |
          test '${{ steps.closure.outputs.status }}' = '0'
