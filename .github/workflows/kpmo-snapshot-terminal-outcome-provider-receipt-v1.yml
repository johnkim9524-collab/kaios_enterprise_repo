name: KPMO Snapshot Terminal Outcome Provider Receipt V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-asi-snapshot-readiness-factory-v2.yml'
      - '.github/workflows/kpmo-snapshot-terminal-outcome-provider-receipt-v1.yml'
      - 'scripts/kidults/source-intelligence/validate-snapshot-terminal-outcome-provider-receipt-v1.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kidults-asi-snapshot-readiness-factory-v2.yml'
      - '.github/workflows/kpmo-snapshot-terminal-outcome-provider-receipt-v1.yml'
      - 'scripts/kidults/source-intelligence/validate-snapshot-terminal-outcome-provider-receipt-v1.mjs'

permissions:
  contents: read

jobs:
  validate-terminal-outcome-provider-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Validate HOLD and generated Snapshot terminal outcome receipt parity
        run: |
          set -euo pipefail
          node --check scripts/kidults/source-intelligence/validate-snapshot-terminal-outcome-provider-receipt-v1.mjs
          node scripts/kidults/source-intelligence/validate-snapshot-terminal-outcome-provider-receipt-v1.mjs
          node scripts/kidults/source-intelligence/validate-snapshot-terminal-outcome-provider-receipt-v1.mjs --self-test
