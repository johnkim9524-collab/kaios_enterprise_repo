name: P0 Remote PostgreSQL Persistence and PITR Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p0-remote-postgres-persistence-pitr.yml'
      - 'coordination/kidults/runtime/postgres-standing-authorization-containment-v1.json'
      - 'tests/kidults/kpmo/p0-postgres-standing-auth-containment-v1.test.mjs'

permissions:
  contents: read

concurrency:
  group: p0-remote-postgres-persistence-pitr-containment
  cancel-in-progress: false

jobs:
  fail-closed-activation-containment:
    name: PostgreSQL activation replay containment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and containment contract
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tests/kidults/kpmo/p0-postgres-standing-auth-containment-v1.test.mjs

      - name: Emit non-secret fail-closed containment receipt
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-remote-postgres
          python3 - <<'PY' > artifacts/p0-remote-postgres/activation-containment.json
          import json, os
          verified = os.environ.get("VERIFY_OUTCOME") == "success"
          print(json.dumps({
              "receipt_id": "kidults-p0-remote-postgres-activation-containment-v1",
              "version": "1.0.0",
              "state": "BLOCKED_ONE_SHOT_AUTHORIZATION_REQUIRED" if verified else "VERIFIED_FAIL_CONTAINMENT_CONTRACT",
              "issues": [1481, 1482],
              "containment_contract_verified": verified,
              "verification_outcome": os.environ.get("VERIFY_OUTCOME", "unknown"),
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "standing_boolean_consulted_by_executable_job": False,
              "standing_boolean_authority_accepted": False,
              "credentialed_job_condition": "false",
              "provider_environment_entered": False,
              "provider_secrets_resolved": False,
              "ssh_executed": False,
              "database_contacted": False,
              "remote_mutation_performed": False,
              "source_fixture_executed": False,
              "source_fixture_receipt": None,
              "pitr_proven": False,
              "required_next_control": "INDEPENDENT_RUN_BOUND_SINGLE_USE_AUTHORIZATION_CONSUMED_BEFORE_ENVIRONMENT_OR_SECRET_RESOLUTION",
              "required_external_state": "KIDULTS_REMOTE_POSTGRES_AUTO_ACTIVATION_AUTHORIZED=false",
              "production": "HOLD",
              "public": "HOLD",
              "g5": "HOLD"
          }, indent=2))
          PY
          test -s artifacts/p0-remote-postgres/activation-containment.json
          python3 -m json.tool artifacts/p0-remote-postgres/activation-containment.json >/dev/null
          cat artifacts/p0-remote-postgres/activation-containment.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: p0-remote-postgres-activation-containment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p0-remote-postgres/activation-containment.json
          if-no-files-found: error
          retention-days: 30

  remote-persistence-pitr-fixture:
    # Permanent fail-closed containment for #1481. The legacy standing boolean
    # may not authorize this credential-bearing lane. The job remains in the
    # registered inventory only until a fresh independent one-shot authority is
    # implemented and atomically consumed before Environment/secret resolution.
    if: ${{ false }}
    environment: kidults-do-staging-ssh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify explicit STAGING activation authorization before secret resolution
        shell: bash
        env:
          ACTIVATION_AUTHORIZED: ${{ vars.KIDULTS_REMOTE_POSTGRES_AUTO_ACTIVATION_AUTHORIZED }}
        run: |
          set -euo pipefail
          test "$ACTIVATION_AUTHORIZED" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push" -o "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Materialize dedicated STAGING key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.KIDULTS_STAGING_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SSH_PRIVATE_KEY_B64"
          unset SSH_PRIVATE_KEY_B64
          echo "Credentialed PostgreSQL source lane is fail-closed under #1481."
          exit 78

      - name: Execute source PostgreSQL fixture through pinned SSH tunnel
        shell: bash
        env:
          POSTGRES_DSN: ${{ secrets.KIDULTS_STAGING_POSTGRES_DSN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$POSTGRES_DSN"
          unset POSTGRES_DSN
          echo "No SSH, tunnel, database contact or source fixture is permitted."
          exit 78
