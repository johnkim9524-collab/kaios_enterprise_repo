name: P0 Remote PostgreSQL Persistence and PITR Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p0-remote-postgres-persistence-pitr.yml'
      - 'tests/kidults/kpmo/p0-postgres-standing-auth-containment-v1.test.mjs'

permissions:
  contents: read

concurrency:
  group: p0-remote-postgres-persistence-pitr-containment
  cancel-in-progress: false

jobs:
  fail-closed-activation-containment:
    name: PostgreSQL activation replay containment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source and containment contract
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tests/kidults/kpmo/p0-postgres-standing-auth-containment-v1.test.mjs

      - name: Emit non-secret fail-closed containment receipt
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-remote-postgres
          python3 - <<'PY' > artifacts/p0-remote-postgres/activation-containment.json
          import json, os
          verified = os.environ.get("VERIFY_OUTCOME") == "success"
          print(json.dumps({
              "receipt_id": "kidults-p0-remote-postgres-activation-containment-v1",
              "version": "1.0.0",
              "state": "BLOCKED_ONE_SHOT_AUTHORIZATION_REQUIRED" if verified else "VERIFIED_FAIL_CONTAINMENT_CONTRACT",
              "containment_contract_verified": verified,
              "verification_outcome": os.environ.get("VERIFY_OUTCOME", "unknown"),
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "standing_boolean_consulted": False,
              "standing_boolean_authority_accepted": False,
              "provider_environment_entered": False,
              "provider_secrets_resolved": False,
              "ssh_executed": False,
              "database_contacted": False,
              "remote_mutation_performed": False,
              "source_fixture_executed": False,
              "restore_performed": False,
              "pitr_proven": False,
              "required_next_control": "RUN_BOUND_SINGLE_USE_AUTHORIZATION_BOUND_TO_REPOSITORY_WORKFLOW_MAIN_SHA_DISPATCH_ID_EXPIRY_AND_NONCE",
              "required_external_state": "KIDULTS_REMOTE_POSTGRES_AUTO_ACTIVATION_AUTHORIZED=false",
              "production": "HOLD",
              "public": "HOLD",
              "g5": "HOLD"
          }, indent=2))
          PY
          test -s artifacts/p0-remote-postgres/activation-containment.json
          python3 -m json.tool artifacts/p0-remote-postgres/activation-containment.json >/dev/null
          cat artifacts/p0-remote-postgres/activation-containment.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: p0-remote-postgres-activation-containment-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/p0-remote-postgres/activation-containment.json
          if-no-files-found: error
          retention-days: 30
