name: P0 Remote PostgreSQL Persistence and PITR Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-remote-postgres-persistence-pitr
  cancel-in-progress: false

jobs:
  remote-persistence-pitr-readiness:
    if: github.ref == 'refs/heads/main'
    environment: kidults-do-staging-ssh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: ${{ vars.KIDULTS_STAGING_PUBLIC_IP }}
      EXPECTED_FINGERPRINT: ${{ vars.KIDULTS_STAGING_HOST_FINGERPRINT }}
      POSTGRES_DSN: ${{ secrets.KIDULTS_STAGING_POSTGRES_DSN }}
    steps:
      - name: Verify live protected main before credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          live_main_sha="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; s=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(s) if re.fullmatch(r"[0-9a-f]{40}",s) else sys.exit(65)'
          )"
          test "$live_main_sha" = "$GITHUB_SHA"

      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Assert required STAGING bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$EXPECTED_FINGERPRINT"
          test -n "$POSTGRES_DSN"
          test "$HOST" = '165.232.175.45'

      - name: Pin and verify ED25519 host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh"
          timeout 10 ssh-keyscan -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" | awk '{print $2}')"
          test "$observed" = "$EXPECTED_FINGERPRINT"

      - name: Materialize dedicated STAGING key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.KIDULTS_STAGING_SSH_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY_B64"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ssh/id_ed25519"
          tr -d '\r' < "$RUNNER_TEMP/ssh/id_ed25519" > "$RUNNER_TEMP/ssh/id_ed25519.normalized"
          mv "$RUNNER_TEMP/ssh/id_ed25519.normalized" "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/id_ed25519" >/dev/null
          unset SSH_PRIVATE_KEY_B64

      - name: Verify exact non-root STAGING identity
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          test "$("${SSH[@]}" kidults-staging@"$HOST" 'whoami')" = 'kidults-staging'
          test "$("${SSH[@]}" kidults-staging@"$HOST" 'hostname')" = 'ih-staging-01'

      - name: Stage verifier and DSN without exposing DSN in process arguments
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'umask 077; mkdir -p ~/kidults-runtime/bin ~/kidults-runtime/data ~/kidults-runtime/audit; cat > ~/kidults-runtime/bin/verify-remote-postgres-persistence-pitr.sh' < scripts/staging/verify-remote-postgres-persistence-pitr.sh
          "${SSH[@]}" kidults-staging@"$HOST" 'chmod 700 ~/kidults-runtime/bin/verify-remote-postgres-persistence-pitr.sh'
          printf '%s' "$POSTGRES_DSN" | "${SSH[@]}" kidults-staging@"$HOST" 'umask 077; cat > ~/kidults-runtime/data/postgres-staging.dsn; chmod 600 ~/kidults-runtime/data/postgres-staging.dsn'

      - name: Execute persistent PostgreSQL and WAL/PITR readiness proof
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          cleanup() {
            "${SSH[@]}" kidults-staging@"$HOST" 'rm -f ~/kidults-runtime/data/postgres-staging.dsn' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "${SSH[@]}" kidults-staging@"$HOST" '
            set -euo pipefail
            export KAIOS_ENVIRONMENT=staging
            export KAIOS_PRODUCTION_PROMOTION_AUTHORIZED=false
            KAIOS_POSTGRES_DSN="$(cat ~/kidults-runtime/data/postgres-staging.dsn)"
            export KAIOS_POSTGRES_DSN
            ~/kidults-runtime/bin/verify-remote-postgres-persistence-pitr.sh | tee ~/kidults-runtime/audit/postgres-persistence-pitr-readiness.json
          '

      - name: Collect non-secret receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-remote-postgres
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'cat ~/kidults-runtime/audit/postgres-persistence-pitr-readiness.json' > artifacts/p0-remote-postgres/postgres-persistence-pitr-readiness.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/p0-remote-postgres/postgres-persistence-pitr-readiness.json')
          r=json.loads(p.read_text())
          assert r['status']=='PASS'
          assert r['environment']=='STAGING'
          assert r['production_touch'] is False
          assert r['pitr_capability']=='READY_FOR_TARGET_TIME_RESTORE_EXERCISE'
          assert int(r['force_rls_tables']) >= 4
          assert r['before_lsn'] != r['after_lsn']
          print('REMOTE_POSTGRES_PERSISTENCE_PITR_READINESS_PASS')
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p0-remote-postgres-persistence-pitr-${{ github.sha }}
          path: artifacts/p0-remote-postgres
          retention-days: 30
