name: P0 Remote PostgreSQL Persistence and PITR Readiness

on:
  # Manual dispatch remains break-glass only; the same explicit activation gate applies.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p0-remote-postgres-persistence-pitr.yml'
      - 'scripts/staging/verify-remote-postgres-persistence-pitr.sh'
      - 'scripts/staging/verify-postgres-target-time-restore.sh'

permissions:
  contents: read

concurrency:
  group: p0-remote-postgres-persistence-pitr
  cancel-in-progress: false

jobs:
  remote-persistence-pitr-readiness:
    if: github.ref == 'refs/heads/main' && vars.KIDULTS_REMOTE_POSTGRES_AUTO_ACTIVATION_AUTHORIZED == 'true'
    environment: kidults-do-staging-ssh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: ${{ vars.KIDULTS_STAGING_PUBLIC_IP }}
      EXPECTED_FINGERPRINT: ${{ vars.KIDULTS_STAGING_HOST_FINGERPRINT }}
    steps:
      - name: Verify explicit STAGING activation authorization before secret resolution
        shell: bash
        env:
          ACTIVATION_AUTHORIZED: ${{ vars.KIDULTS_REMOTE_POSTGRES_AUTO_ACTIVATION_AUTHORIZED }}
        run: |
          set -euo pipefail
          test "$ACTIVATION_AUTHORIZED" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push" -o "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Assert required non-secret STAGING bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$EXPECTED_FINGERPRINT"
          test "$HOST" = '165.232.175.45'

      - name: Pin and verify ED25519 host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh"
          timeout 10 ssh-keyscan -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" | awk '{print $2}')"
          test "$observed" = "$EXPECTED_FINGERPRINT"

      - name: Materialize dedicated STAGING key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.KIDULTS_STAGING_SSH_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY_B64"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ssh/id_ed25519"
          tr -d '\r' < "$RUNNER_TEMP/ssh/id_ed25519" > "$RUNNER_TEMP/ssh/id_ed25519.normalized"
          mv "$RUNNER_TEMP/ssh/id_ed25519.normalized" "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/id_ed25519" >/dev/null
          unset SSH_PRIVATE_KEY_B64

      - name: Verify exact non-root STAGING identity
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          test "$("${SSH[@]}" kidults-staging@"$HOST" 'whoami')" = 'kidults-staging'
          test "$("${SSH[@]}" kidults-staging@"$HOST" 'hostname')" = 'ih-staging-01'

      - name: Discover existing PostgreSQL runtime read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-remote-postgres
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'python3 - <<'"'"'PY'"'"'
          import json, os, shutil, socket, subprocess
          def run(args):
              try:
                  p=subprocess.run(args, text=True, capture_output=True, timeout=5)
                  return {"rc":p.returncode,"stdout":p.stdout.strip()[:500],"stderr":p.stderr.strip()[:500]}
              except Exception as e:
                  return {"rc":127,"error":type(e).__name__}
          report={
              "hostname": socket.gethostname(),
              "user": os.environ.get("USER"),
              "psql_present": shutil.which("psql") is not None,
              "pg_isready_present": shutil.which("pg_isready") is not None,
              "systemctl_postgresql": run(["systemctl","is-active","postgresql"]),
              "loopback_5432": run(["bash","-lc","ss -lnt 2>/dev/null | grep -E '\''127\\.0\\.0\\.1:5432|\\[::1\\]:5432|0\\.0\\.0\\.0:5432'\'' || true"]),
              "pg_isready_loopback": run(["pg_isready","-h","127.0.0.1","-p","5432"]) if shutil.which("pg_isready") else {"rc":127},
              "peer_postgres_probe": run(["psql","--no-psqlrc","--dbname=postgres","--tuples-only","--no-align","--command=select current_user, current_database();"]) if shutil.which("psql") else {"rc":127},
          }
          print(json.dumps(report, separators=(",",":")))
          PY' > artifacts/p0-remote-postgres/staging-postgres-readonly-discovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/p0-remote-postgres/staging-postgres-readonly-discovery.json')
          r=json.loads(p.read_text())
          assert r['hostname']=='ih-staging-01'
          assert r['user']=='kidults-staging'
          print('STAGING_POSTGRES_READONLY_DISCOVERY_COMPLETE')
          print(json.dumps(r, indent=2))
          PY

      - name: Stage verifier and DSN without exposing DSN in process arguments
        env:
          POSTGRES_DSN: ${{ secrets.KIDULTS_STAGING_POSTGRES_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTGRES_DSN"
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'umask 077; mkdir -p ~/kidults-runtime/bin ~/kidults-runtime/data ~/kidults-runtime/audit; cat > ~/kidults-runtime/bin/verify-remote-postgres-persistence-pitr.sh' < scripts/staging/verify-remote-postgres-persistence-pitr.sh
          "${SSH[@]}" kidults-staging@"$HOST" 'chmod 700 ~/kidults-runtime/bin/verify-remote-postgres-persistence-pitr.sh'
          printf '%s' "$POSTGRES_DSN" | "${SSH[@]}" kidults-staging@"$HOST" 'umask 077; cat > ~/kidults-runtime/data/postgres-staging.dsn; chmod 600 ~/kidults-runtime/data/postgres-staging.dsn'
          unset POSTGRES_DSN

      - name: Execute persistent PostgreSQL and WAL/PITR readiness proof
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          cleanup() {
            "${SSH[@]}" kidults-staging@"$HOST" 'rm -f ~/kidults-runtime/data/postgres-staging.dsn' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "${SSH[@]}" kidults-staging@"$HOST" '
            set -euo pipefail
            export KAIOS_ENVIRONMENT=staging
            export KAIOS_PRODUCTION_PROMOTION_AUTHORIZED=false
            KAIOS_POSTGRES_DSN="$(cat ~/kidults-runtime/data/postgres-staging.dsn)"
            export KAIOS_POSTGRES_DSN
            ~/kidults-runtime/bin/verify-remote-postgres-persistence-pitr.sh | tee ~/kidults-runtime/audit/postgres-persistence-pitr-readiness.json
          '

      - name: Collect non-secret receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-remote-postgres
          SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          "${SSH[@]}" kidults-staging@"$HOST" 'cat ~/kidults-runtime/audit/postgres-persistence-pitr-readiness.json' > artifacts/p0-remote-postgres/postgres-persistence-pitr-readiness.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/p0-remote-postgres/postgres-persistence-pitr-readiness.json')
          r=json.loads(p.read_text())
          assert r['status']=='PASS'
          assert r['environment']=='STAGING'
          assert r['production_touch'] is False
          assert r['pitr_capability']=='READY_FOR_TARGET_TIME_RESTORE_EXERCISE'
          assert int(r['force_rls_tables']) >= 4
          assert r['before_lsn'] != r['after_lsn']
          print('REMOTE_POSTGRES_PERSISTENCE_PITR_READINESS_PASS')
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: p0-remote-postgres-persistence-pitr-${{ github.sha }}
          path: artifacts/p0-remote-postgres
          if-no-files-found: error
          retention-days: 30
