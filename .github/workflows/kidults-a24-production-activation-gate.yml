name: kidults-a24-production-activation-gate
on:
  push:
    branches: [main]
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'coordination/kidults/source-intelligence/current-sold-sample-governance-v1.json'
      - 'coordination/kidults/governance/current-sold-sample-governance-alignment-v1.json'
      - 'coordination/kidults/governance/field-level-rights-release-manifest-v1.json'
      - 'coordination/kidults/registry/provider/records/provider-operating-state-v1.json'
      - '.github/workflows/kidults-a24-production-activation-gate.yml'
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'coordination/kidults/source-intelligence/current-sold-sample-governance-v1.json'
      - 'coordination/kidults/governance/current-sold-sample-governance-alignment-v1.json'
      - 'coordination/kidults/governance/field-level-rights-release-manifest-v1.json'
      - 'coordination/kidults/registry/provider/records/provider-operating-state-v1.json'
      - '.github/workflows/kidults-a24-production-activation-gate.yml'
  workflow_dispatch:
concurrency:
  group: kidults-a24-production-activation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact evaluated source
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run a24:test
      - name: Evaluate exact source
        run: npm run a24:gate
        env:
          KIDULTS_A24_OUTPUT_DIR: ${{ runner.temp }}/kidults-a24-evidence
      - name: Verify repository remained read-only
        run: |
          git diff HEAD --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload A24 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-a24-production-activation-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/kidults-a24-evidence/*.json
          if-no-files-found: error
