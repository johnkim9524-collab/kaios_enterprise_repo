name: KIDULTS ASI Autobalance Steering Overlay Live v1

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/apply-asi-autobalance-steering-overlay-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs'
      - '.github/workflows/kidults-asi-autobalance-steering-overlay-live-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-autobalance-steering-overlay-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  steering-overlay-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.19.0'}
      - name: Verify exact source and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/apply-asi-autobalance-steering-overlay-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs
          node --check scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs
      - name: Restore latest steering and live autobalance inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base-raw /tmp/base-cycle /tmp/live-balance /tmp/live-gates-raw /tmp/live-gates discovery-out/raw discovery-out
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_JQ='[.artifacts[] | select(.name=="kidults-asi-self-driving-cycle-v1" and .expired==false)][0].id // empty'
            BAL_JQ='[.artifacts[] | select(.name=="kidults-asi-throughput-coverage-autobalance-live-v1" and .expired==false)][0].id // empty'
            META_JQ='[.artifacts[] | select(.name=="kidults-asi-global-any-site-source-pool-v1" and .expired==false)][0].id // empty'
            DISC_JQ='[.artifacts[] | select(.name=="kidults-asi-global-any-site-hourly-cycle-v1" and .expired==false)][0].id // empty'
          else
            BASE_JQ='[.artifacts[] | select(.name=="kidults-asi-self-driving-cycle-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty'
            BAL_JQ='[.artifacts[] | select(.name=="kidults-asi-throughput-coverage-autobalance-live-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty'
            META_JQ='[.artifacts[] | select(.name=="kidults-asi-global-any-site-source-pool-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty'
            DISC_JQ='[.artifacts[] | select(.name=="kidults-asi-global-any-site-hourly-cycle-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty'
          fi

          BASE_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq "$BASE_JQ")
          test -n "$BASE_ID"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ID}/zip" > /tmp/base.zip
          unzip -q -o /tmp/base.zip -d /tmp/base-raw
          BASE_SRC=$(find /tmp/base-raw -type f -name 'asi-discovery-steering-plan-v1.json' -print -quit)
          test -n "$BASE_SRC"
          cp "$BASE_SRC" /tmp/base-cycle/asi-discovery-steering-plan-v1.json

          BAL_CANON=/tmp/live-balance/asi-throughput-coverage-autobalance-live-v1.json
          BAL_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq "$BAL_JQ")
          if [ -n "$BAL_ID" ]; then
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BAL_ID}/zip" > /tmp/balance.zip
            unzip -q -o /tmp/balance.zip -d /tmp/live-balance
          fi
          BAL_SRC=$(find /tmp/live-balance -type f -name 'asi-throughput-coverage-autobalance-live-v1.json' -print -quit || true)

          if [ -z "$BAL_SRC" ]; then
            META_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq "$META_JQ")
            DISC_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq "$DISC_JQ")
            test -n "$META_ID"
            test -n "$DISC_ID"
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${META_ID}/zip" > /tmp/meta.zip
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DISC_ID}/zip" > /tmp/disc.zip
            unzip -q -o /tmp/meta.zip -d /tmp/live-gates-raw
            unzip -q -o /tmp/disc.zip -d discovery-out/raw
            for f in asi-gate1-safe-candidate-pool-v1.json asi-gate2-independent-reverification-v1.json asi-gate3-admission-runtime-v1.json asi-admitted-metadata-pool-v1.json; do
              SRC=$(find /tmp/live-gates-raw -type f -name "$f" -print -quit)
              test -n "$SRC"
              cp "$SRC" "/tmp/live-gates/$f"
            done
            DISC_SRC=$(find discovery-out/raw -type f -name 'global-low-risk-discovery.json' -print -quit)
            test -n "$DISC_SRC"
            cp "$DISC_SRC" discovery-out/global-low-risk-discovery.json
            node scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs \
              discovery-out/global-low-risk-discovery.json \
              /tmp/live-gates/asi-gate1-safe-candidate-pool-v1.json \
              /tmp/live-gates/asi-gate2-independent-reverification-v1.json \
              /tmp/live-gates/asi-gate3-admission-runtime-v1.json \
              /tmp/live-gates/asi-admitted-metadata-pool-v1.json \
              "$BAL_CANON"
            BAL_SRC="$BAL_CANON"
          fi

          node scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs "$BAL_SRC"
          if [ "$BAL_SRC" != "$BAL_CANON" ]; then cp "$BAL_SRC" "$BAL_CANON"; fi
          test -f "$BAL_CANON"
      - name: Apply sweep-safe live autobalance overlay
        run: |
          node scripts/kidults/source-intelligence/apply-asi-autobalance-steering-overlay-v1.mjs \
            /tmp/base-cycle/asi-discovery-steering-plan-v1.json \
            /tmp/live-balance/asi-throughput-coverage-autobalance-live-v1.json \
            /tmp/asi-discovery-steering-plan-autobalanced-v1.json
          node scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs /tmp/asi-discovery-steering-plan-autobalanced-v1.json
      - name: Reject permission mutation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/asi-discovery-steering-plan-autobalanced-v1.json';const x=JSON.parse(fs.readFileSync(p));x.category_plans[0].ordered_products[0].acquisition_authorized=true;fs.writeFileSync('/tmp/bad-overlay.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs /tmp/bad-overlay.json; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-autobalance-steering-overlay-live-v1
          path: /tmp/asi-discovery-steering-plan-autobalanced-v1.json
          retention-days: 30
          if-no-files-found: error
