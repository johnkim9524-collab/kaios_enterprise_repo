name: Owned Intelligence Core v1.1

on:
  push:
    branches: [main,"feat/**"]
    paths:
      - "coordination/kidults/architecture/owned-intelligence-core-v1.1.json"
      - "scripts/kidults/intelligence/owned-intelligence-core-v1.1.mjs"
      - "scripts/kidults/intelligence/validate-owned-intelligence-core-v1.1.mjs"
      - ".github/workflows/owned-intelligence-core-v1-1.yml"
  pull_request:
    branches: [main]
    paths:
      - "coordination/kidults/architecture/owned-intelligence-core-v1.1.json"
      - "scripts/kidults/intelligence/owned-intelligence-core-v1.1.mjs"
      - "scripts/kidults/intelligence/validate-owned-intelligence-core-v1.1.mjs"
      - ".github/workflows/owned-intelligence-core-v1-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse architecture contract
        run: node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/architecture/owned-intelligence-core-v1.1.json','utf8'))"
      - name: Validate base owned intelligence core
        run: node scripts/kidults/intelligence/validate-owned-intelligence-core-v1.mjs
      - name: Validate v1.1 final derived functions
        run: node scripts/kidults/intelligence/validate-owned-intelligence-core-v1.1.mjs
