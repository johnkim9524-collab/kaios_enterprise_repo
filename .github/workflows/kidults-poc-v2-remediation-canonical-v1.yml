name: KIDULTS PoC v2 Remediation Canonical v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/poc-v2-remediation-canonical-contract-v1.json'
      - 'docs/kidults/poc-v2-diagnostic-remediation-design-v1.md'
      - 'scripts/kidults/poc/validate-poc-v2-remediation-canonical-v1.mjs'
      - '.github/workflows/kidults-poc-v2-remediation-canonical-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Validate PoC v2 remediation canonical contract
        run: node scripts/kidults/poc/validate-poc-v2-remediation-canonical-v1.mjs
