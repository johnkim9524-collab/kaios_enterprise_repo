name: KIDULTS Cloudflare Worker Estate Policy v1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cloudflare-worker-estate-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/kidults/redteam/validate-cloudflare-worker-estate-policy-v1.mjs
      - run: node scripts/kidults/redteam/validate-enterprise-workspace-cutover-v1.mjs
      - run: node scripts/kidults/redteam/validate-workspace-registry-truth-source-v1.mjs
      - run: node scripts/kidults/portal/validate-current-truth-surface-v1.mjs
