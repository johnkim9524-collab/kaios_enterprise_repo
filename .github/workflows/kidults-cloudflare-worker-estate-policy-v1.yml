name: KIDULTS Cloudflare Worker Estate Policy v1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cloudflare-worker-estate-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - run: node scripts/kidults/redteam/validate-cloudflare-worker-estate-policy-v1.mjs
      - run: node scripts/kidults/redteam/validate-cloudflare-estate-classification-v1.mjs
      - run: node scripts/kidults/redteam/validate-enterprise-workspace-cutover-v1.mjs
      - run: node scripts/kidults/redteam/validate-workspace-registry-truth-source-v1.mjs
      - run: node scripts/kidults/portal/validate-current-truth-surface-v1.mjs
      - run: node scripts/kidults/redteam/validate-mobile-workspace-whitespace-v1.mjs
