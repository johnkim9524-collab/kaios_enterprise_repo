name: KIDULTS Scope Data Requirement Matrix v1.1
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope-data/**'
      - 'scripts/kidults/validate-scope-data-requirement-matrix-v1.1.mjs'
      - '.github/workflows/kidults-scope-data-requirement-matrix-v1.1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/kidults/validate-scope-data-requirement-matrix-v1.1.mjs