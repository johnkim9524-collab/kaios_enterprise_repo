name: KIDULTS ASI Hourly v2 Promotion Readiness v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-readiness-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-provenance-v1.mjs'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.py'
      - '.github/workflows/kidults-asi-hourly-v2-promotion-readiness-v1.yml'
  workflow_run:
    workflows: ['KIDULTS ASI Global Any-Site Hourly Pooling v2']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  promotion-contract-proof:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source, syntax, and pre-extraction guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-readiness-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-provenance-v1.mjs
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py
          node - <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('.github/workflows/kidults-asi-hourly-v2-promotion-readiness-v1.yml','utf8');
          const validation=src.indexOf('--archive "/tmp/v2-${i}.zip"');
          const extraction=src.indexOf('unzip -q -o "/tmp/v2-${i}.zip"');
          if(validation<0||extraction<0||validation>extraction)throw new Error('SAFE_ZIP_PRE_EXTRACTION_GUARD_MISSING');
          if(!src.includes('--required-basename asi-global-any-site-hourly-cycle-receipt-v2.json'))throw new Error('RECEIPT_BASENAME_CARDINALITY_GUARD_MISSING');
          NODE
      - name: Build deterministic two-cycle fixture
        run: |
          node - <<'NODE' >/tmp/promotion-input.json
          const v2=(run,observed,fresh)=>({artifact_id:`a${run}`,workflow_run_id:String(run),receipt:{id:'kidults-asi-global-any-site-hourly-cycle-receipt-v2',status:'SHADOW_ANY_SITE_COMMON_CRAWL_FULL_GATE_CHAIN_COMPLETE',discovered_candidates:183,live_external_candidates:119,healthy_live_lanes:4,common_crawl_applied:true,common_crawl_index_id:'CC-MAIN-2026-34',common_crawl_seed_hosts:8,common_crawl_observed_candidates:observed,common_crawl_new_candidates:fresh,gate1_purpose:'DISCOVERY_METADATA_INDEX_ONLY',gate1_safe_candidates:0,gate1_review_required:0,gate1_hard_blocked:0,gate2_verified_for_gate3:0,gate3_bounded_metadata_admitted:0,product_content_eligible_sources:0,active_admitted_metadata:0,rolling_discovery_pool_candidates:484,new_pool_candidates:fresh,content_acquisition_authorized:false,collection_right_created:false,public_release:'HOLD',production:'HOLD'}});
          const v1={artifact_id:'v1a',workflow_run_id:'900',receipt:{id:'kidults-asi-global-any-site-hourly-cycle-receipt-v1',status:'SHADOW_ANY_SITE_FULL_GATE_CHAIN_WITH_REVALIDATED_ADMISSION_COMPLETE',discovered_candidates:164,live_external_candidates:100,content_acquisition_authorized:false,collection_right_created:false,public_release:'HOLD',production:'HOLD'}};
          process.stdout.write(JSON.stringify({id:'kidults-asi-hourly-v2-promotion-input-v1',v1_baseline:v1,v2_cycles:[v2(1001,7,5),v2(1002,8,6)]}));
          NODE
      - name: Validate promotion readiness contract
        run: node scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-readiness-v1.mjs /tmp/promotion-input.json /tmp/promotion-readiness.json
      - name: Reject single-cycle, duplicate-run, boundary, population, and no-increment mutations
        run: |
          set -euo pipefail
          mutate_and_reject() {
            local name="$1" mutation="$2"
            node - "$mutation" "$name" <<'NODE'
          const fs=require('fs');
          const mutation=process.argv[2],name=process.argv[3];
          const x=JSON.parse(fs.readFileSync('/tmp/promotion-input.json','utf8'));
          if(mutation==='single')x.v2_cycles=x.v2_cycles.slice(0,1);
          if(mutation==='duplicate')x.v2_cycles[1].workflow_run_id=x.v2_cycles[0].workflow_run_id;
          if(mutation==='production')x.v2_cycles[0].receipt.production='APPROVED';
          if(mutation==='no_increment')for(const c of x.v2_cycles){c.receipt.common_crawl_observed_candidates=0;c.receipt.common_crawl_new_candidates=0;}
          if(mutation==='gate1_discovery_overflow'){const r=x.v2_cycles[0].receipt;r.gate1_safe_candidates=r.discovered_candidates+1;r.product_content_eligible_sources=r.discovered_candidates+1;}
          if(mutation==='gate1_eligible_overflow'){const r=x.v2_cycles[0].receipt;r.gate1_safe_candidates=1;r.product_content_eligible_sources=0;}
          fs.writeFileSync(`/tmp/${name}.json`,JSON.stringify(x));
          NODE
            if node scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-readiness-v1.mjs "/tmp/${name}.json" "/tmp/${name}-out.json"; then
              echo "mutation unexpectedly passed: ${name}" >&2
              exit 1
            fi
          }
          mutate_and_reject bad-single-cycle single
          mutate_and_reject bad-duplicate-run duplicate
          mutate_and_reject bad-production production
          mutate_and_reject bad-no-increment no_increment
          mutate_and_reject bad-gate1-discovery-overflow gate1_discovery_overflow
          mutate_and_reject bad-gate1-eligible-overflow gate1_eligible_overflow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-hourly-v2-promotion-contract-v1
          path: /tmp/promotion-readiness.json
          retention-days: 30
          if-no-files-found: error

  empirical-main-promotion-readiness:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
      CANONICAL_PRODUCER_PATH: .github/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml
      CANONICAL_V2_ARTIFACT: kidults-asi-global-any-site-source-pool-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source and promotion provenance contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-readiness-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-provenance-v1.mjs
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py
      - name: Bind triggering run and restore two exact-generation v2 cycles
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2/0 /tmp/v2/1
          test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
          test -n "$EXPECTED_SHA"
          test -n "$UPSTREAM_RUN_ID"
          MAIN_SHA="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$MAIN_SHA" = "$EXPECTED_SHA"

          validate_run() {
            local run_id="$1" payload
            payload="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_SHA" --arg path "$CANONICAL_PRODUCER_PATH" \
              '.conclusion=="success" and .head_branch=="main" and .head_sha==$sha and .repository.full_name==$repo and .path==$path' \
              <<<"$payload" >/dev/null
          }

          exact_artifact() {
            local run_id="$1" payload count artifact_id digest
            payload="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            count="$(jq --arg name "$CANONICAL_V2_ARTIFACT" '[.artifacts[] | select(.name==$name and .expired==false)] | length' <<<"$payload")"
            [ "$count" -eq 1 ] || { echo "expected exactly one canonical v2 artifact for run ${run_id}; got ${count}" >&2; exit 71; }
            artifact_id="$(jq -r --arg name "$CANONICAL_V2_ARTIFACT" '[.artifacts[] | select(.name==$name and .expired==false)][0].id' <<<"$payload")"
            digest="$(jq -r --arg name "$CANONICAL_V2_ARTIFACT" '[.artifacts[] | select(.name==$name and .expired==false)][0].digest // empty' <<<"$payload")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "canonical v2 artifact digest missing/invalid for run ${run_id}" >&2; exit 72; }
            printf '%s|%s' "$artifact_id" "$digest"
          }

          validate_run "$UPSTREAM_RUN_ID"
          RUNS="$(gh api --method GET -H 'Accept: application/vnd.github+json' -f branch=main -f status=success -f per_page=100 "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml/runs")"
          SECOND_RUN_ID="$(jq -r --arg sha "$EXPECTED_SHA" --arg trigger "$UPSTREAM_RUN_ID" '[.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success" and (.id|tostring)!=$trigger)] | sort_by(.updated_at) | reverse | .[0].id // empty' <<<"$RUNS")"
          if [ -z "$SECOND_RUN_ID" ]; then
            cat > /tmp/promotion-waiting.json <<JSON
          {"id":"kidults-asi-hourly-v2-promotion-readiness-v1","status":"WAITING_FOR_SECOND_DISTINCT_EXACT_SHA_V2_CYCLE","exact_head_sha":"${EXPECTED_SHA}","triggering_run_id":"${UPSTREAM_RUN_ID}","observed_exact_sha_v2_cycles":1,"public_release":"HOLD","production":"HOLD"}
          JSON
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'v2_cycle_count=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$SECOND_RUN_ID" != "$UPSTREAM_RUN_ID"
          validate_run "$SECOND_RUN_ID"

          for i in 0 1; do
            if [ "$i" -eq 0 ]; then RUN_ID="$UPSTREAM_RUN_ID"; else RUN_ID="$SECOND_RUN_ID"; fi
            IFS='|' read -r ART DIGEST <<<"$(exact_artifact "$RUN_ID")"
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > "/tmp/v2-${i}.zip"
            python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
              --archive "/tmp/v2-${i}.zip" \
              --expected-digest "$DIGEST" \
              --receipt "/tmp/v2-${i}-safe-zip-receipt.json" \
              --max-compressed-bytes 67108864 \
              --max-entries 2048 \
              --max-entry-uncompressed-bytes 67108864 \
              --max-total-uncompressed-bytes 268435456 \
              --max-compression-ratio 100 \
              --required-basename asi-global-any-site-hourly-cycle-receipt-v2.json
            SAFE_DIGEST="sha256:$(sha256sum "/tmp/v2-${i}-safe-zip-receipt.json" | awk '{print $1}')"
            [[ "$SAFE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            unzip -q -o "/tmp/v2-${i}.zip" -d "/tmp/v2/${i}"
            RECEIPT="$(find "/tmp/v2/${i}" -type f -name asi-global-any-site-hourly-cycle-receipt-v2.json -print -quit)"
            test -n "$RECEIPT"
            node - "$RECEIPT" <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.id!=='kidults-asi-global-any-site-hourly-cycle-receipt-v2')throw new Error('V2_RECEIPT_ID_MISMATCH');
          if(x.public_release!=='HOLD'||x.production!=='HOLD')throw new Error('V2_RECEIPT_RELEASE_BOUNDARY');
          NODE
            cp "$RECEIPT" "/tmp/v2/${i}/receipt.json"
            echo "v2_artifact_${i}=$ART" >> "$GITHUB_OUTPUT"
            echo "v2_digest_${i}=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "v2_safe_digest_${i}=$SAFE_DIGEST" >> "$GITHUB_OUTPUT"
            echo "v2_run_${i}=$RUN_ID" >> "$GITHUB_OUTPUT"
          done

          V2_SAFE_0="$(grep '^v2_safe_digest_0=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
          V2_SAFE_1="$(grep '^v2_safe_digest_1=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
          cat > /tmp/asi-hourly-v2-promotion-provenance-v1.json <<JSON
          {
            "id": "kidults-asi-hourly-v2-promotion-provenance-v1",
            "state": "VERIFIED_PASS_EXACT_GENERATION",
            "exact_head_sha": "${EXPECTED_SHA}",
            "canonical_producer_workflow": "${CANONICAL_PRODUCER_PATH}",
            "triggering_run_id": "${UPSTREAM_RUN_ID}",
            "triggering_run_included": true,
            "same_generation": true,
            "safe_zip_validated_before_extraction": true,
            "cycles": [
              {"run_id": "${UPSTREAM_RUN_ID}", "artifact_id": "$(grep '^v2_artifact_0=' "$GITHUB_OUTPUT" | cut -d= -f2)", "artifact_digest": "$(grep '^v2_digest_0=' "$GITHUB_OUTPUT" | cut -d= -f2-)", "safe_zip_receipt_digest": "${V2_SAFE_0}"},
              {"run_id": "${SECOND_RUN_ID}", "artifact_id": "$(grep '^v2_artifact_1=' "$GITHUB_OUTPUT" | cut -d= -f2)", "artifact_digest": "$(grep '^v2_digest_1=' "$GITHUB_OUTPUT" | cut -d= -f2-)", "safe_zip_receipt_digest": "${V2_SAFE_1}"}
            ],
            "v1_baseline": "OMITTED_NOT_REQUIRED_FOR_EXACT_V2_PAIR",
            "public_release": "HOLD",
            "production": "HOLD"
          }
          JSON
          jq -e '.triggering_run_included==true and .same_generation==true and .safe_zip_validated_before_extraction==true and (.cycles|length)==2 and (.cycles[0].run_id != .cycles[1].run_id) and (.cycles|all((.artifact_digest|test("^sha256:[0-9a-f]{64}$")) and (.safe_zip_receipt_digest|test("^sha256:[0-9a-f]{64}$")))) and .public_release=="HOLD" and .production=="HOLD"' /tmp/asi-hourly-v2-promotion-provenance-v1.json >/dev/null
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'v2_cycle_count=2' >> "$GITHUB_OUTPUT"
      - name: Emit waiting evidence
        if: steps.restore.outputs.ready != 'true'
        run: cat /tmp/promotion-waiting.json
      - name: Build exact-generation promotion input
        if: steps.restore.outputs.ready == 'true'
        env:
          V2_ART_0: ${{ steps.restore.outputs.v2_artifact_0 }}
          V2_RUN_0: ${{ steps.restore.outputs.v2_run_0 }}
          V2_ART_1: ${{ steps.restore.outputs.v2_artifact_1 }}
          V2_RUN_1: ${{ steps.restore.outputs.v2_run_1 }}
        run: |
          node - <<'NODE' >/tmp/asi-hourly-v2-promotion-input-v1.json
          const fs=require('fs');const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const v2=[0,1].map(i=>({artifact_id:process.env[`V2_ART_${i}`],workflow_run_id:process.env[`V2_RUN_${i}`],receipt:read(`/tmp/v2/${i}/receipt.json`)}));
          if(v2[0].workflow_run_id!==process.env.UPSTREAM_RUN_ID)throw new Error('TRIGGERING_RUN_OMITTED');
          process.stdout.write(JSON.stringify({id:'kidults-asi-hourly-v2-promotion-input-v1',v1_baseline:null,v2_cycles:v2},null,2));
          NODE
      - name: Validate two-cycle exact-generation promotion readiness
        if: steps.restore.outputs.ready == 'true'
        run: node scripts/kidults/source-intelligence/validate-asi-hourly-v2-promotion-readiness-v1.mjs /tmp/asi-hourly-v2-promotion-input-v1.json /tmp/asi-hourly-v2-promotion-readiness-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kidults-asi-hourly-v2-promotion-readiness-v1
          path: |
            /tmp/promotion-waiting.json
            /tmp/asi-hourly-v2-promotion-provenance-v1.json
            /tmp/asi-hourly-v2-promotion-input-v1.json
            /tmp/asi-hourly-v2-promotion-readiness-v1.json
            /tmp/v2-0-safe-zip-receipt.json
            /tmp/v2-1-safe-zip-receipt.json
          retention-days: 90
          if-no-files-found: warn
