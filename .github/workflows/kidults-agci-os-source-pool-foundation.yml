name: KIDULTS AGCI-OS Scope Source Pool Foundation

on:
  push:
    branches:
      - "feat/kidults-phase2-content-data-provider-foundation"
    paths:
      - "coordination/kidults/data-scope/category-1000-scale-contract-v1.json"
      - "coordination/kidults/data-scope/collection-scope-registry-v1.json"
      - "coordination/kidults/source-intelligence/autonomous-source-intelligence-program-v1.json"
      - "coordination/kidults/source-intelligence/scope-source-pool-readiness-contract-v1.json"
      - "coordination/kidults/registry/trusted-source/**"
      - "coordination/kidults/autonomous/source-discovery/contracts/**"
      - "scripts/kidults/source-intelligence/build-scope-source-pool-readiness-v1.mjs"
      - "scripts/kidults/source-intelligence/validate-scope-source-pool-readiness-v1.mjs"
      - ".github/workflows/kidults-agci-os-source-pool-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-agci-os-source-pool-foundation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Syntax check
        run: |
          node --check scripts/kidults/source-intelligence/build-scope-source-pool-readiness-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-scope-source-pool-readiness-v1.mjs

      - name: Build Scope Source Pool and continuous discovery plans
        run: |
          node scripts/kidults/source-intelligence/build-scope-source-pool-readiness-v1.mjs \
            --output artifacts/agci-os/scope-source-pool-foundation-v1 \
            --write

      - name: Prove same-input same-output
        run: |
          node --input-type=module <<'NODE' > /tmp/source-pool-1.json
          import { buildScopeSourcePoolReadiness } from './scripts/kidults/source-intelligence/build-scope-source-pool-readiness-v1.mjs';
          process.stdout.write(JSON.stringify(buildScopeSourcePoolReadiness()));
          NODE
          node --input-type=module <<'NODE' > /tmp/source-pool-2.json
          import { buildScopeSourcePoolReadiness } from './scripts/kidults/source-intelligence/build-scope-source-pool-readiness-v1.mjs';
          process.stdout.write(JSON.stringify(buildScopeSourcePoolReadiness()));
          NODE
          cmp /tmp/source-pool-1.json /tmp/source-pool-2.json

      - name: Validate Scope Source Pool foundation
        run: |
          node scripts/kidults/source-intelligence/validate-scope-source-pool-readiness-v1.mjs \
            artifacts/agci-os/scope-source-pool-foundation-v1

      - name: Validate program reset and Collection Scope foundation
        run: |
          node scripts/kidults/data-scope/build-program-reset-v2.mjs \
            --output artifacts/agci-os/program-reset-category-1000-v1 \
            --write
          node scripts/kidults/data-scope/validate-program-reset-v2.mjs \
            artifacts/agci-os/program-reset-category-1000-v1
          node scripts/kidults/data-scope/validate-collection-scope-registry-v1.mjs

      - name: Validate existing AGCI-OS governance
        run: |
          node scripts/kidults/architecture/validate-agci-os-registry-v2.mjs
          node scripts/kidults/registry/validate-operational-registry.mjs
          node scripts/kidults/mission-control/validate-mission-control.mjs

      - name: Upload Scope Source Pool evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-agci-os-scope-source-pool-foundation-v1
          path: |
            artifacts/agci-os/scope-source-pool-foundation-v1
            artifacts/agci-os/program-reset-category-1000-v1
          if-no-files-found: error
          retention-days: 30
