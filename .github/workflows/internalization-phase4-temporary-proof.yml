name: KIDULTS Internalization Phase4 Temporary Proof

on:
  pull_request:
    paths:
      - 'coordination/kidults/internalization/**'
      - 'scripts/kidults/internalization/**'
      - '.github/workflows/internalization-phase4-temporary-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run acceptance hardening
        run: node scripts/kidults/internalization/validate-internalization-acceptance-hardening-v1.mjs
      - name: Run full internalization foundation
        run: node scripts/kidults/internalization/validate-internalization-foundation-v1.mjs
