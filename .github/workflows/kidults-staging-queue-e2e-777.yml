name: KIDULTS STAGING Queue E2E #777 Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-staging-queue-e2e-777.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-queue-failure-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_DB: kidults-intelligence-db-staging
      FAILED_OUTBOX_ID: outbox-kpmo-32343488684_1
      TARGET_QUEUE: kidults-asi-shadow-discovery-wikidata
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate read-only diagnostic boundary
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          test "$STAGING_DB" = 'kidults-intelligence-db-staging'
          test "$FAILED_OUTBOX_ID" = 'outbox-kpmo-32343488684_1'
      - name: Install Wrangler only
        working-directory: services/kidults-autonomous-intelligence
        run: npm install --ignore-scripts
      - name: DIAGNOSE — read failed processed-message and DLQ state only
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          SQL1="SELECT queue_name,outbox_id,message_id,event_id,status,attempt_count,first_seen_at,last_seen_at,completed_at,last_error FROM asi_processed_messages WHERE outbox_id='$FAILED_OUTBOX_ID';"
          npx wrangler d1 execute "$STAGING_DB" --remote --command "$SQL1" --json > /tmp/processed.json
          SQL2="SELECT id,queue_name,source_queue_name,message_id,event_id,attempts,error_code,error_message,recorded_at,replayed_at,replay_event_id FROM asi_dead_letters WHERE event_id='event-kpmo-32343488684_1' OR message_id IN (SELECT message_id FROM asi_processed_messages WHERE outbox_id='$FAILED_OUTBOX_ID') ORDER BY recorded_at DESC LIMIT 10;"
          npx wrangler d1 execute "$STAGING_DB" --remote --command "$SQL2" --json > /tmp/deadletters.json
          SQL3="SELECT engine_fleet,queue_name,state,processed_count,failed_count,retry_count,dead_letter_count,last_success_at,last_failure_at,updated_at FROM asi_engine_health WHERE queue_name='$TARGET_QUEUE';"
          npx wrangler d1 execute "$STAGING_DB" --remote --command "$SQL3" --json > /tmp/health.json
          node - <<'NODE'
          const fs=require('fs');
          const get=f=>JSON.parse(fs.readFileSync(f,'utf8')).flatMap(v=>v.results||[]);
          const p=get('/tmp/processed.json');
          if(p.length!==1||p[0].status!=='FAILED'||Number(p[0].attempt_count)<1) throw new Error('EXPECTED_FAILED_MESSAGE_NOT_FOUND');
          const d=get('/tmp/deadletters.json');
          const h=get('/tmp/health.json');
          const safe={
            issue:777,
            outbox_id:p[0].outbox_id,
            queue_name:p[0].queue_name,
            status:p[0].status,
            attempt_count:Number(p[0].attempt_count),
            last_error:p[0].last_error||null,
            dead_letter_count:d.length,
            dead_letters:d.map(x=>({attempts:x.attempts,error_code:x.error_code,error_message:x.error_message,recorded_at:x.recorded_at,replayed_at:x.replayed_at||null})),
            engine_health:h.map(x=>({engine_fleet:x.engine_fleet,state:x.state,processed_count:x.processed_count,failed_count:x.failed_count,retry_count:x.retry_count,dead_letter_count:x.dead_letter_count,last_failure_at:x.last_failure_at,updated_at:x.updated_at})),
            remote_mutation:false,
            message_injected:false,
            production:'HOLD'
          };
          fs.writeFileSync('/tmp/diagnostic-receipt.json',JSON.stringify(safe,null,2)+'\n');
          console.log(JSON.stringify({status:safe.status,attempt_count:safe.attempt_count,last_error:safe.last_error,dead_letter_count:safe.dead_letter_count,remote_mutation:false,production:'HOLD'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-staging-queue-e2e-777-failure-diagnostic
          path: /tmp/diagnostic-receipt.json
          retention-days: 30
