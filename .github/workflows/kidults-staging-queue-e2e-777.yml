name: KIDULTS STAGING Runtime Evidence #777

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-staging-queue-e2e-777.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-runtime-readonly-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_DB: kidults-intelligence-db-staging
      PRODUCTION_DB: kidults-intelligence-db
      FAILED_OUTBOX_ID: outbox-kpmo-32343488684_1
      FAILED_EVENT_ID: event-kpmo-32343488684_1
      TARGET_QUEUE: kidults-asi-shadow-discovery-wikidata
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate read-only evidence boundary
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          test "$STAGING_DB" = 'kidults-intelligence-db-staging'
          test "$PRODUCTION_DB" = 'kidults-intelligence-db'
          test "$FAILED_OUTBOX_ID" = 'outbox-kpmo-32343488684_1'
      - name: Install Wrangler only
        working-directory: services/kidults-autonomous-intelligence
        run: npm install --ignore-scripts
      - name: Read STAGING failure, health, DLQ and storage counters
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          npx wrangler d1 info "$STAGING_DB" --json > /tmp/staging-info.json
          npx wrangler d1 execute "$STAGING_DB" --remote --command "SELECT queue_name,outbox_id,message_id,event_id,status,attempt_count,first_seen_at,last_seen_at,completed_at,last_error FROM asi_processed_messages WHERE outbox_id='$FAILED_OUTBOX_ID';" --json > /tmp/processed.json
          npx wrangler d1 execute "$STAGING_DB" --remote --command "SELECT id,queue_name,source_queue_name,message_id,event_id,attempts,error_code,error_message,recorded_at,replayed_at,replay_event_id FROM asi_dead_letters WHERE event_id='$FAILED_EVENT_ID' OR message_id IN (SELECT message_id FROM asi_processed_messages WHERE outbox_id='$FAILED_OUTBOX_ID') ORDER BY recorded_at DESC LIMIT 10;" --json > /tmp/deadletters.json
          npx wrangler d1 execute "$STAGING_DB" --remote --command "SELECT engine_fleet,queue_name,state,processed_count,failed_count,retry_count,dead_letter_count,last_success_at,last_failure_at,updated_at FROM asi_engine_health WHERE queue_name='$TARGET_QUEUE';" --json > /tmp/health.json
          npx wrangler d1 execute "$STAGING_DB" --remote --command "SELECT (SELECT COUNT(*) FROM asi_event_log) AS event_log_rows,(SELECT COUNT(*) FROM asi_outbox) AS outbox_rows,(SELECT COUNT(*) FROM asi_processed_messages) AS processed_rows,(SELECT COUNT(*) FROM asi_dead_letters) AS dead_letter_rows,(SELECT COUNT(*) FROM asi_transport_attempts) AS transport_attempt_rows,(SELECT COUNT(*) FROM asi_replay_requests) AS replay_request_rows,(SELECT COUNT(*) FROM audit_log) AS audit_log_rows;" --json > /tmp/counts.json
      - name: Prove Production remains read-only and runtime-row isolated
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          npx wrangler d1 info "$PRODUCTION_DB" --json > /tmp/production-info.json
          npx wrangler d1 execute "$PRODUCTION_DB" --remote --command "SELECT 1 AS production_read_probe;" --json > /tmp/production-read.json
          npx wrangler d1 execute "$PRODUCTION_DB" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='asi_processed_messages';" --json > /tmp/production-runtime-table.json
      - name: Build public-safe empirical receipt
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const rows=f=>JSON.parse(fs.readFileSync(f,'utf8')).flatMap(v=>v.results||[]);
          const p=rows('/tmp/processed.json');
          if(p.length!==1) throw new Error(`FAILED_ROW_COUNT:${p.length}`);
          const r=p[0];
          if(r.status!=='FAILED'||Number(r.attempt_count)!==4||r.last_error!=='ASI_QUEUE_TASK_OUTBOX_PROVENANCE_MISMATCH') throw new Error('FAILED_ROW_TRUTH_DRIFT');
          const first=Date.parse(r.first_seen_at),last=Date.parse(r.last_seen_at);
          if(!Number.isFinite(first)||!Number.isFinite(last)||last<first) throw new Error('RETRY_TIMESTAMPS_INVALID');
          const retrySpanMs=last-first;
          const dlq=rows('/tmp/deadletters.json');
          const health=rows('/tmp/health.json');
          const counts=rows('/tmp/counts.json')[0]||{};
          const prodRead=JSON.parse(fs.readFileSync('/tmp/production-read.json','utf8'));
          const prodRuntime=rows('/tmp/production-runtime-table.json');
          if(!prodRead.every(v=>v.success===true)||!prodRead.flatMap(v=>v.results||[]).some(v=>v.production_read_probe===1)) throw new Error('PRODUCTION_READ_FAILED');
          if(prodRead.some(v=>Number(v.meta?.rows_written||0)!==0||Number(v.meta?.changes||0)!==0)) throw new Error('PRODUCTION_READ_MUTATED');
          const receipt={
            issue:777,
            evidence_class:'REMOTE_STAGING_READONLY_FAILURE_RECOVERY_BASELINE',
            queue_name:r.queue_name,
            outbox_id:r.outbox_id,
            event_id:r.event_id,
            consumer_delivery_proven:true,
            worker_d1_write_proven:true,
            terminal_status:r.status,
            attempts:Number(r.attempt_count),
            first_seen_at:r.first_seen_at,
            last_seen_at:r.last_seen_at,
            retry_span_ms:retrySpanMs,
            last_error:r.last_error,
            dead_letter_records_for_control:dlq.length,
            engine_health:health.map(x=>({engine_fleet:x.engine_fleet,state:x.state,processed_count:Number(x.processed_count||0),failed_count:Number(x.failed_count||0),retry_count:Number(x.retry_count||0),dead_letter_count:Number(x.dead_letter_count||0),last_success_at:x.last_success_at||null,last_failure_at:x.last_failure_at||null,updated_at:x.updated_at||null})),
            staging_counts:Object.fromEntries(Object.entries(counts).map(([k,v])=>[k,Number(v||0)])),
            production_processed_messages_table_present:prodRuntime.length>0,
            production_mutation:false,
            new_queue_messages_sent:0,
            new_d1_writes:0,
            golden_path_pass:false,
            blocker:'TEMPORARY_STAGING_D1_EDIT_SECRET_ABSENT_FOR_CANONICAL_PROVENANCE_SEED',
            production:'HOLD'
          };
          fs.writeFileSync('/tmp/runtime-readonly-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-staging-runtime-readonly-evidence-777
          path: |
            /tmp/runtime-readonly-receipt.json
            /tmp/staging-info.json
            /tmp/production-info.json
          retention-days: 30
          if-no-files-found: error
