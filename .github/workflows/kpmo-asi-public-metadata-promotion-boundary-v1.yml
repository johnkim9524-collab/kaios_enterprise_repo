name: KIDULTS ASI Public Metadata Promotion Boundary v1

on:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/validate-asi-openalex-gdelt-public-metadata-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-public-metadata-promotion-boundary-v1.mjs'
      - '.github/workflows/kpmo-asi-public-metadata-promotion-boundary-v1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/kidults/source-intelligence/validate-asi-openalex-gdelt-public-metadata-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-public-metadata-promotion-boundary-v1.mjs'
      - '.github/workflows/kpmo-asi-public-metadata-promotion-boundary-v1.yml'

permissions:
  contents: read

jobs:
  promotion-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Validate public-metadata promotion boundary
        run: |
          node --check scripts/kidults/source-intelligence/validate-asi-openalex-gdelt-public-metadata-discovery-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-public-metadata-promotion-boundary-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-public-metadata-promotion-boundary-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-public-metadata-promotion-boundary-v1.mjs --self-test
