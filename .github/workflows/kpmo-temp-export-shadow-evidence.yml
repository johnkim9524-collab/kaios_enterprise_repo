name: KPMO Temporary Export SHADOW Evidence

on:
  push:
    branches:
      - kpmo/cloudflare-staging-governance-v1
    paths:
      - .github/workflows/kpmo-temp-export-shadow-evidence.yml

permissions:
  contents: read

jobs:
  export:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Build and validate exact deterministic SHADOW evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix services/kidults-autonomous-intelligence
          mkdir -p /tmp/kpmo-shadow-evidence
          node scripts/kidults/source-intelligence/build-asi-shadow-operating-evidence-v1.mjs \
            --output /tmp/kpmo-shadow-evidence/asi-shadow-operating-evidence-v1.json --write
          node scripts/kidults/source-intelligence/validate-asi-shadow-operating-evidence-v1.mjs \
            --input /tmp/kpmo-shadow-evidence/asi-shadow-operating-evidence-v1.json
          sha256sum /tmp/kpmo-shadow-evidence/asi-shadow-operating-evidence-v1.json \
            > /tmp/kpmo-shadow-evidence/SHA256SUMS

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kpmo-shadow-evidence-export-${{ github.sha }}
          path: /tmp/kpmo-shadow-evidence
          if-no-files-found: error
          retention-days: 1
