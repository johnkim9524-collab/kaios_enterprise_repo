name: KPMO Temporary Refresh SHADOW Evidence

on:
  push:
    branches:
      - kpmo/cloudflare-staging-governance-v1
    paths:
      - .github/workflows/kpmo-temp-export-shadow-evidence.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: kpmo/cloudflare-staging-governance-v1
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Build, validate and commit exact deterministic SHADOW evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "kpmo/cloudflare-staging-governance-v1"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix services/kidults-autonomous-intelligence
          OUT="/tmp/asi-shadow-operating-evidence-v1.json"
          node scripts/kidults/source-intelligence/build-asi-shadow-operating-evidence-v1.mjs \
            --output "$OUT" --write
          node scripts/kidults/source-intelligence/validate-asi-shadow-operating-evidence-v1.mjs \
            --input "$OUT"
          cp "$OUT" artifacts/agci-os/asi-shadow-operating-evidence-v1.json
          node scripts/kidults/source-intelligence/validate-asi-shadow-operating-evidence-v1.mjs \
            --input artifacts/agci-os/asi-shadow-operating-evidence-v1.json
          git config user.name 'johnkim9524-collab'
          git config user.email 'john.kim9524@gmail.com'
          git add artifacts/agci-os/asi-shadow-operating-evidence-v1.json
          test -n "$(git status --porcelain)"
          git commit -m '[CF-Pages-Skip] fix(asi): refresh deterministic SHADOW evidence'
          git push origin "HEAD:$GITHUB_REF_NAME"
