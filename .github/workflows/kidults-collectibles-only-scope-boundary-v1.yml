name: KIDULTS Collectibles Only Scope Boundary v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/governance/collectibles-only-scope-boundary-v1.json'
      - 'scripts/kidults/governance/validate-collectibles-only-scope-boundary-v1.mjs'
      - '.github/workflows/kidults-collectibles-only-scope-boundary-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/kidults/governance/validate-collectibles-only-scope-boundary-v1.mjs
