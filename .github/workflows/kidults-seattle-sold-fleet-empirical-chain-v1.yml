name: KIDULTS Seattle Sold Fleet Empirical Chain v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/seattle-sold-fleet-empirical-admission-v1.json'
      - 'scripts/kidults/source-intelligence/run-seattle-sold-fleet-empirical-chain-v1.mjs'
      - '.github/workflows/kidults-seattle-sold-fleet-empirical-chain-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - name: Execute empirical sold-reference chain
        run: |
          node scripts/kidults/source-intelligence/run-seattle-sold-fleet-empirical-chain-v1.mjs \
            coordination/kidults/source-intelligence/seattle-sold-fleet-empirical-admission-v1.json \
            | tee seattle-sold-fleet-empirical-chain-receipt-v1.json
          cmp seattle-sold-fleet-empirical-chain-receipt-v1.json \
            coordination/kidults/source-intelligence/seattle-sold-fleet-empirical-chain-receipt-v1.json
      - name: Upload immutable run receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seattle-sold-fleet-empirical-chain-receipt-v1
          path: seattle-sold-fleet-empirical-chain-receipt-v1.json
          retention-days: 90
