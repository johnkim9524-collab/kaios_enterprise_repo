name: Provider Adapter Contract v1

on:
  pull_request:
    branches: [main]
    paths:
      - "coordination/kidults/provider/provider-adapter-contract-v1.json"
      - "scripts/kidults/intelligence/validate-provider-adapter-contract-v1.mjs"
      - ".github/workflows/provider-adapter-contract-v1.yml"
      - "scripts/kidults/kpmo/validate-provider-adapter-workflow-provenance-v1.mjs"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "coordination/kidults/provider/provider-adapter-contract-v1.json"
      - "scripts/kidults/intelligence/validate-provider-adapter-contract-v1.mjs"
      - ".github/workflows/provider-adapter-contract-v1.yml"
      - "scripts/kidults/kpmo/validate-provider-adapter-workflow-provenance-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: node scripts/kidults/intelligence/validate-provider-adapter-contract-v1.mjs
      - run: node scripts/kidults/kpmo/validate-provider-adapter-workflow-provenance-v1.mjs
