name: KIDULTS D1 Legacy Resource Policy v1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  d1-legacy-resource-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/kidults/redteam/validate-d1-legacy-resource-policy-v1.mjs
