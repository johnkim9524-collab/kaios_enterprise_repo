name: KIDULTS D1 Legacy Resource Policy v1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  d1-legacy-resource-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node scripts/kidults/redteam/validate-d1-legacy-resource-policy-v1.mjs
