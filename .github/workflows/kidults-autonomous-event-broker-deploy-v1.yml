name: KIDULTS Autonomous Event Broker Deploy V1
run-name: KIDULTS Autonomous Event Broker Deploy V1 ${{ github.sha }}
# Normal STAGING code/reduction updates auto-deploy after no-authority-expansion proof; manual dispatch remains recovery-only.

on:
  push:
    branches: [main]
    paths:
      - infrastructure/aws/staging/autonomous-event-token-broker-v1.cjs
      - infrastructure/aws/staging/autonomous-event-token-broker-v1.json
      - .github/workflows/kidults-autonomous-event-broker-deploy-v1.yml
  workflow_dispatch:
    inputs:
      main_sha:
        description: Exact protected-main SHA authorized for this deployment
        required: true
        type: string
      stack_name:
        description: Exact STAGING stack name
        required: true
        default: kidults-autonomous-event-token-broker-staging
        type: string
      change_set_name:
        description: Exact one-use CloudFormation change-set name
        required: true
        type: string
      authorization_id:
        description: Exact single-use DEPLOY_STAGING_BROKER authorization ID
        required: true
        type: string
      owner_timeout_30_to_180:
        description: Owner opt-in for BrokerFunction Timeout exactly 30 to 180 seconds
        required: false
        default: false
        type: boolean

concurrency:
  group: kidults-autonomous-event-broker-staging-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy-and-deny-canary:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.sha == inputs.main_sha))
    runs-on: ubuntu-24.04
    environment: KIDULTS-AUTONOMOUS-BROKER-DEPLOYER
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Derive exact bounded deployment inputs
        shell: bash
        env:
          INPUT_MAIN_SHA: ${{ inputs.main_sha }}
          INPUT_STACK_NAME: ${{ inputs.stack_name }}
          INPUT_CHANGE_SET_NAME: ${{ inputs.change_set_name }}
          INPUT_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            main_sha="$GITHUB_SHA"
            stack_name=kidults-autonomous-event-token-broker-staging
            change_set_name="kidults-broker-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
            authorization_id="AUTO-STAGING-BROKER-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          else
            main_sha="$INPUT_MAIN_SHA"
            stack_name="$INPUT_STACK_NAME"
            change_set_name="$INPUT_CHANGE_SET_NAME"
            authorization_id="$INPUT_AUTHORIZATION_ID"
          fi
          for bounded_input in "$main_sha" "$stack_name" "$change_set_name" "$authorization_id"; do
            [[ "$bounded_input" != *$'\n'* && "$bounded_input" != *$'\r'* ]]
          done
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$main_sha" = "$GITHUB_SHA"
          test "$stack_name" = kidults-autonomous-event-token-broker-staging
          [[ "$change_set_name" =~ ^kidults-broker-[0-9a-f]{12}-[0-9]+$ ]]
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$authorization_id" = "DEPLOY-STAGING-BROKER-${GITHUB_SHA:0:12}-${change_set_name}"
          else
            test "$authorization_id" = "AUTO-STAGING-BROKER-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          fi
          printf 'DEPLOY_MAIN_SHA=%s\nSTACK_NAME=%s\nCHANGE_SET_NAME=%s\nAUTHORIZATION_ID=%s\n' "$main_sha" "$stack_name" "$change_set_name" "$authorization_id" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate reviewed broker source and tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$DEPLOY_MAIN_SHA"
          test "$STACK_NAME" = kidults-autonomous-event-token-broker-staging
          [[ "$CHANGE_SET_NAME" =~ ^kidults-broker-[0-9a-f]{12}-[0-9]+$ ]]
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            expected_authorization_id="DEPLOY-STAGING-BROKER-${GITHUB_SHA:0:12}-${CHANGE_SET_NAME}"
            test "$AUTHORIZATION_ID" = "$expected_authorization_id"
            [[ "$AUTHORIZATION_ID" != *"-${GITHUB_RUN_ID}" ]]
          else
            test "$AUTHORIZATION_ID" = "AUTO-STAGING-BROKER-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          fi
          node tests/kidults/staging-operations/autonomous-event-token-broker-v1.test.cjs
          jq -e '.Resources.BrokerFunction and .Resources.EventBrokerInvokerRole' infrastructure/aws/staging/autonomous-event-token-broker-v1.json >/dev/null

      - name: Deploy and verify exact STAGING broker in one credential boundary
        env:
          AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_BROKER_DEPLOY_ROLE_ARN }}
          GITHUB_APP_ID: ${{ vars.KIDULTS_GITHUB_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ vars.KIDULTS_GITHUB_INSTALLATION_ID }}
          GITHUB_PRIVATE_KEY_SECRET_ARN: ${{ vars.KIDULTS_GITHUB_PRIVATE_KEY_SECRET_ARN }}
          GITHUB_OIDC_PROVIDER_ARN: ${{ vars.KIDULTS_GITHUB_OIDC_PROVIDER_ARN }}
          OWNER_TIMEOUT_OPT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_timeout_30_to_180 == true }}
          SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assert_current_main() {
            local live_main
            live_main=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $SOURCE_READ_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/johnkim9524-collab/kaios_enterprise_repo/git/ref/heads/main | jq -er '.object.sha')
            test "$live_main" = "$DEPLOY_MAIN_SHA"
          }
          trap 'unset CREDS OIDC_JSON OIDC_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION' EXIT
          test -n "$AWS_ROLE_ARN"
          OIDC_JSON=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(jq -r '.value' <<<"$OIDC_JSON")
          echo "::add-mask::$OIDC_TOKEN"
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "kidults-broker-deploy-${GITHUB_RUN_ID}" --web-identity-token "$OIDC_TOKEN" --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$CREDS"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          export AWS_REGION=ap-northeast-2
          unset CREDS OIDC_JSON OIDC_TOKEN
          test -n "$GITHUB_APP_ID" && test -n "$GITHUB_INSTALLATION_ID" && test -n "$GITHUB_PRIVATE_KEY_SECRET_ARN" && test -n "$GITHUB_OIDC_PROVIDER_ARN"

          # Normal STAGING operation may update Lambda code or reduce IAM authority.
          # Any trust expansion, new resource, permission expansion, or unrelated infrastructure delta fails closed.
          aws cloudformation get-template --stack-name "$STACK_NAME" --template-stage Original --query TemplateBody --output json > /tmp/current-broker-template.json
          desired_template=infrastructure/aws/staging/autonomous-event-token-broker-v1.json
          resume_parameters=()
          # After the separately authorized bootstrap, retain its table and cutover.
          # This selector cannot bootstrap the new authority on a normal push.
          if jq -e '(if type=="string" then fromjson else . end).Resources.ResumeOperationTable' /tmp/current-broker-template.json >/dev/null; then
            desired_template=infrastructure/aws/staging/autonomous-event-token-broker-resume-v1.json
            resume_parameters=(ParameterKey=ResumeActivationRunFloor,UsePreviousValue=true)
          fi
          owner_timeout_args=()
          if [ "$OWNER_TIMEOUT_OPT_IN" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
            owner_timeout_args=(--allow-owner-reviewed-broker-timeout-30-to-180)
          fi
          node scripts/governance/validate-staging-no-authority-expansion-v1.mjs \
            --current /tmp/current-broker-template.json \
            --desired "$desired_template" \
            --allow-lambda-code-change "${owner_timeout_args[@]}"

          assert_current_main
          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type UPDATE \
            --template-body "file://$desired_template" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters ParameterKey=GitHubAppId,ParameterValue="$GITHUB_APP_ID" ParameterKey=GitHubInstallationId,ParameterValue="$GITHUB_INSTALLATION_ID" ParameterKey=GitHubPrivateKeySecretArn,ParameterValue="$GITHUB_PRIVATE_KEY_SECRET_ARN" ParameterKey=GitHubRepositoryId,ParameterValue="$GITHUB_REPOSITORY_ID" ParameterKey=GitHubRepository,ParameterValue="$GITHUB_REPOSITORY" ParameterKey=GitHubOidcProviderArn,ParameterValue="$GITHUB_OIDC_PROVIDER_ARN" "${resume_parameters[@]}" >/dev/null
          set +e
          aws cloudformation wait change-set-create-complete --stack-name "$STACK_NAME" --change-set-name "$CHANGE_SET_NAME"
          wait_status=$?
          set -e
          if [ "$wait_status" -eq 0 ]; then
            assert_current_main
            aws cloudformation execute-change-set --stack-name "$STACK_NAME" --change-set-name "$CHANGE_SET_NAME"
            aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"
          else
            change_status=$(aws cloudformation describe-change-set --stack-name "$STACK_NAME" --change-set-name "$CHANGE_SET_NAME" --query Status --output text)
            change_reason=$(aws cloudformation describe-change-set --stack-name "$STACK_NAME" --change-set-name "$CHANGE_SET_NAME" --query StatusReason --output text)
            if [ "$change_status" = "FAILED" ] && [[ "$change_reason" == *"didn't contain changes"* ]]; then
              echo "Exact template is already deployed; continuing with canary verification."
              aws cloudformation delete-change-set --stack-name "$STACK_NAME" --change-set-name "$CHANGE_SET_NAME"
            else
              echo "Change set creation failed: status=$change_status reason=$change_reason" >&2
              exit 1
            fi
          fi

          mkdir -p out/autonomous-event-broker-deploy-v1
          function_name=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='BrokerFunctionName'].OutputValue" --output text)
          expected_timeout=$(jq -r '.Resources.BrokerFunction.Properties.Timeout' "$desired_template")
          observed_timeout=$(aws lambda get-function-configuration --function-name "$function_name" --query Timeout --output text)
          test "$observed_timeout" = "$expected_timeout"
          aws lambda invoke --function-name "$function_name" --cli-binary-format raw-in-base64-out --payload '{"action":"DENY_CANARY"}' /tmp/deny.json >/tmp/invoke.json || true
          test "$(jq -r '.errorMessage' /tmp/deny.json)" = EVENT_TOKEN_BROKER_DENIED:INPUT
          jq -n --arg stack "$STACK_NAME" --arg change_set "$CHANGE_SET_NAME" --arg authorization_id "$AUTHORIZATION_ID" --arg function "$function_name" --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" '{state:"DEPLOYED_AND_NEGATIVE_CANARY_PASS",operation:"DEPLOY_STAGING_BROKER",stack:$stack,change_set:$change_set,authorization_id:$authorization_id,function:$function,workflow_sha:$sha,run_id:$run_id,positive_canary:"DISPATCHER_LIVE_TOKEN_PATH"}' > out/autonomous-event-broker-deploy-v1/receipt.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kidults-autonomous-event-broker-deploy-${{ github.run_id }}
          path: out/autonomous-event-broker-deploy-v1/receipt.json
          if-no-files-found: error
          retention-days: 90
