name: KIDULTS Autonomous Event Broker Deploy V1
run-name: KIDULTS Autonomous Event Broker Deploy V1 ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Exact protected-main SHA authorized for this deployment
        required: true
        type: string
      stack_name:
        description: Exact STAGING stack name
        required: true
        default: kidults-autonomous-event-token-broker-staging
        type: string
      change_set_name:
        description: Exact one-use CloudFormation change-set name
        required: true
        type: string
      authorization_id:
        description: Exact single-use DEPLOY_STAGING_BROKER authorization ID
        required: true
        type: string

concurrency:
  group: kidults-autonomous-event-broker-staging-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy-and-deny-canary:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == github.repository_owner && github.sha == inputs.main_sha
    runs-on: ubuntu-24.04
    environment: KIDULTS-AUTONOMOUS-BROKER-DEPLOYER
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate reviewed broker source and tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "${{ inputs.main_sha }}"
          test "${{ inputs.stack_name }}" = kidults-autonomous-event-token-broker-staging
          [[ "${{ inputs.change_set_name }}" =~ ^kidults-broker-[0-9a-f]{12}-[0-9]+$ ]]
          expected_authorization_id="DEPLOY-STAGING-BROKER-${GITHUB_SHA:0:12}-${{ inputs.change_set_name }}"
          test "${{ inputs.authorization_id }}" = "$expected_authorization_id"
          [[ "${{ inputs.authorization_id }}" != *"-${GITHUB_RUN_ID}" ]]
          node tests/kidults/staging-operations/autonomous-event-token-broker-v1.test.cjs
          jq -e '.Resources.BrokerFunction and .Resources.EventBrokerInvokerRole' infrastructure/aws/staging/autonomous-event-token-broker-v1.json >/dev/null

      - name: Acquire STAGING deployment credentials through GitHub OIDC
        env:
          AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_BROKER_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          OIDC_JSON=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(jq -r '.value' <<<"$OIDC_JSON")
          echo "::add-mask::$OIDC_TOKEN"
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "kidults-broker-deploy-${GITHUB_RUN_ID}" --web-identity-token "$OIDC_TOKEN" --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$CREDS"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
            echo "AWS_REGION=ap-northeast-2"
          } >> "$GITHUB_ENV"
          unset CREDS OIDC_JSON OIDC_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

      - name: Deploy exact STAGING broker stack without console
        env:
          GITHUB_APP_ID: ${{ vars.KIDULTS_GITHUB_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ vars.KIDULTS_GITHUB_INSTALLATION_ID }}
          GITHUB_PRIVATE_KEY_SECRET_ARN: ${{ vars.KIDULTS_GITHUB_PRIVATE_KEY_SECRET_ARN }}
          GITHUB_OIDC_PROVIDER_ARN: ${{ vars.KIDULTS_GITHUB_OIDC_PROVIDER_ARN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_APP_ID" && test -n "$GITHUB_INSTALLATION_ID" && test -n "$GITHUB_PRIVATE_KEY_SECRET_ARN" && test -n "$GITHUB_OIDC_PROVIDER_ARN"
          aws cloudformation create-change-set \
            --stack-name "${{ inputs.stack_name }}" \
            --change-set-name "${{ inputs.change_set_name }}" \
            --change-set-type UPDATE \
            --template-body file://infrastructure/aws/staging/autonomous-event-token-broker-v1.json \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters ParameterKey=GitHubAppId,ParameterValue="$GITHUB_APP_ID" ParameterKey=GitHubInstallationId,ParameterValue="$GITHUB_INSTALLATION_ID" ParameterKey=GitHubPrivateKeySecretArn,ParameterValue="$GITHUB_PRIVATE_KEY_SECRET_ARN" ParameterKey=GitHubRepositoryId,ParameterValue="$GITHUB_REPOSITORY_ID" ParameterKey=GitHubRepository,ParameterValue="$GITHUB_REPOSITORY" ParameterKey=GitHubOidcProviderArn,ParameterValue="$GITHUB_OIDC_PROVIDER_ARN" >/dev/null
          set +e
          aws cloudformation wait change-set-create-complete --stack-name "${{ inputs.stack_name }}" --change-set-name "${{ inputs.change_set_name }}"
          wait_status=$?
          set -e
          if [ "$wait_status" -eq 0 ]; then
            aws cloudformation execute-change-set --stack-name "${{ inputs.stack_name }}" --change-set-name "${{ inputs.change_set_name }}"
            aws cloudformation wait stack-update-complete --stack-name "${{ inputs.stack_name }}"
          else
            change_status=$(aws cloudformation describe-change-set --stack-name "${{ inputs.stack_name }}" --change-set-name "${{ inputs.change_set_name }}" --query Status --output text)
            change_reason=$(aws cloudformation describe-change-set --stack-name "${{ inputs.stack_name }}" --change-set-name "${{ inputs.change_set_name }}" --query StatusReason --output text)
            if [ "$change_status" = "FAILED" ] && [[ "$change_reason" == *"didn't contain changes"* ]]; then
              echo "Exact template is already deployed; continuing with canary verification."
              aws cloudformation delete-change-set --stack-name "${{ inputs.stack_name }}" --change-set-name "${{ inputs.change_set_name }}"
            else
              echo "Change set creation failed: status=$change_status reason=$change_reason" >&2
              exit 1
            fi
          fi

      - name: Run fail-closed negative canary and seal deployment evidence
        run: |
          set -euo pipefail
          mkdir -p out/autonomous-event-broker-deploy-v1
          function_name=$(aws cloudformation describe-stacks --stack-name "${{ inputs.stack_name }}" --query "Stacks[0].Outputs[?OutputKey=='BrokerFunctionName'].OutputValue" --output text)
          aws lambda invoke --function-name "$function_name" --cli-binary-format raw-in-base64-out --payload '{"action":"DENY_CANARY"}' /tmp/deny.json >/tmp/invoke.json || true
          test "$(jq -r '.errorMessage' /tmp/deny.json)" = EVENT_TOKEN_BROKER_DENIED
          jq -n --arg stack "${{ inputs.stack_name }}" --arg change_set "${{ inputs.change_set_name }}" --arg authorization_id "${{ inputs.authorization_id }}" --arg function "$function_name" --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" '{state:"DEPLOYED_AND_NEGATIVE_CANARY_PASS",operation:"DEPLOY_STAGING_BROKER",stack:$stack,change_set:$change_set,authorization_id:$authorization_id,function:$function,workflow_sha:$sha,run_id:$run_id,positive_canary:"DISPATCHER_LIVE_TOKEN_PATH"}' > out/autonomous-event-broker-deploy-v1/receipt.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kidults-autonomous-event-broker-deploy-${{ github.run_id }}
          path: out/autonomous-event-broker-deploy-v1/receipt.json
          if-no-files-found: error
          retention-days: 90
