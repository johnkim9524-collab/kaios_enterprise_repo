name: KIDULTS Cloudflare Workers Shadow Deploy v3

# Consumed one-shot lane: no event may start this historical workflow.
on: []

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-workers-shadow-deploy-v3-consumed
  cancel-in-progress: false

jobs:
  deploy-shadow-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create consumed authorization tombstone
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/kidults-cloudflare-workers-shadow-v3-consumed"
          RECEIPT="$ROOT/receipt.json"
          mkdir -p "$ROOT"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              id:"kidults-cloudflare-workers-shadow-v3-consumed-tombstone-v1",
              approval_id:"CF-WORKERS-SHADOW-20260901-03",
              state:"CONSUMED_PROVIDER_API_7003_NO_DEPLOYMENT_READBACK",
              historical_consuming_run_id:33465807642,
              historical_consuming_job_id:99725309548,
              historical_source_sha:"b467787d358b85968ebfe7d993a538faa8b70e13",
              repository:$repository,
              source_ref:$source_ref,
              source_sha:$source_sha,
              tombstone_run_id:$run_id,
              tombstone_run_attempt:$run_attempt,
              authorization_consumed:true,
              executable_authority:false,
              environment_bound:false,
              credential_resolution_authorized:false,
              provider_activation_authorized:false,
              provider_process_invoked_in_historical_run:true,
              historical_provider_deployment_attempt_count:1,
              historical_cloudflare_error_code:7003,
              historical_failure_class:"CLOUDFLARE_ACCOUNT_ID_OR_TOKEN_ACCOUNT_SCOPE_MISMATCH",
              historical_execution_artifact_id:9784793397,
              historical_execution_artifact_digest:"sha256:0ab4517f47cfbb2cdf3de1a81e03af981df2dd5285df403dc8b4f611c5267c05",
              historical_worker_deployment_success:false,
              historical_workers_dev_url:null,
              historical_provider_readback:"SKIPPED",
              remote_api_request_evidenced:true,
              remote_mutation_evidenced:false,
              replay_authorized:false,
              promotable:false,
              empirical_provider_success:false,
              boundary:"PUBLIC_PRODUCTION_G5_HOLD",
              public:"HOLD",
              production:"HOLD",
              g5:"HOLD"
            }' > "$RECEIPT"
          jq -e '
            .authorization_consumed==true
            and .executable_authority==false
            and .credential_resolution_authorized==false
            and .provider_activation_authorized==false
            and .replay_authorized==false' \
            "$RECEIPT" >/dev/null

      - name: Upload consumed authorization tombstone
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-cloudflare-workers-shadow-v3-consumed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-cloudflare-workers-shadow-v3-consumed/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce consumed authorization no replay
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'CONSUMED_ZERO_EXECUTABLE_AUTHORITY_NO_REPLAY'
          exit 78
