name: KIDULTS DigitalOcean STAGING Portal Deploy

on:
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/runtime/staging-portal-deploy-request-v1.json'
  workflow_dispatch:

concurrency:
  group: kidults-digitalocean-staging-portal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject non-main source before privileged validation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) exit 64 ;;
          esac
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Record STAGING validation runner identity
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS:-UNKNOWN}"
          echo "runner_arch=${RUNNER_ARCH:-UNKNOWN}"
          echo "image_os=${ImageOS:-UNKNOWN}"
          echo "image_version=${ImageVersion:-UNKNOWN}"
          cat /etc/os-release
      - name: Validate deploy contract and safety boundaries
        run: python scripts/operations/validate_digitalocean_staging_portal_deploy_v1.py
      - name: Validate Portal Release-001
        run: node scripts/kidults/portal/validate-portal-release-001.mjs
      - name: Validate explicit deploy request on push
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          p=json.load(open('coordination/kidults/runtime/staging-portal-deploy-request-v1.json'))
          assert p['environment']=='STAGING'
          assert p['action']=='DEPLOY_PORTAL_RELEASE_001'
          assert p['public_bind'] is False
          assert p['production']=='HOLD'
          assert p['g5']=='HOLD'
          PY

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: validate
    environment: kidults-do-staging-ssh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOST: ${{ vars.KIDULTS_STAGING_PUBLIC_IP }}
      PRIVATE_IP: ${{ vars.KIDULTS_STAGING_PRIVATE_IP }}
      EXPECTED_FINGERPRINT: ${{ vars.KIDULTS_STAGING_HOST_FINGERPRINT }}
    steps:
      - name: Enforce exact main before any SSH secret or remote access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) exit 64 ;;
          esac
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - name: Record STAGING deploy runner identity
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS:-UNKNOWN}"
          echo "runner_arch=${RUNNER_ARCH:-UNKNOWN}"
          echo "image_os=${ImageOS:-UNKNOWN}"
          echo "image_version=${ImageVersion:-UNKNOWN}"
          cat /etc/os-release
      - name: Assert exact STAGING bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST" = "165.232.175.45"
          test "$PRIVATE_IP" = "10.104.0.3"
          test -n "$EXPECTED_FINGERPRINT"
      - name: Materialize SSH identity and pin host
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.KIDULTS_STAGING_SSH_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY_B64"
          mkdir -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          OBSERVED="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" | awk '{print $2}')"
          test "$OBSERVED" = "$EXPECTED_FINGERPRINT"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ssh/id_ed25519"
          tr -d '\r' < "$RUNNER_TEMP/ssh/id_ed25519" > "$RUNNER_TEMP/ssh/id_ed25519.normalized"
          mv "$RUNNER_TEMP/ssh/id_ed25519.normalized" "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/id_ed25519" >/dev/null
      - name: Verify non-root STAGING identity
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          test "$("${SSH[@]}" kidults-staging@"$HOST" whoami)" = "kidults-staging"
          test "$("${SSH[@]}" kidults-staging@"$HOST" hostname)" = "ih-staging-01"
      - name: Package Portal Release-001
        shell: bash
        run: |
          set -euo pipefail
          tar -C apps/kidults-enterprise-staging/public/portal-r001 -czf "$RUNNER_TEMP/portal-r001.tgz" .
          sha256sum "$RUNNER_TEMP/portal-r001.tgz"
      - name: Transfer and deploy to remote localhost-only STAGING
        id: remote_deploy
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          RELEASE_ID="portal-r001-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_ARCHIVE="/tmp/${RELEASE_ID}.tgz"
          DEPLOY_EXIT_CODE=0
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/portal-r001.tgz" kidults-staging@"$HOST":"$REMOTE_ARCHIVE" \
            || DEPLOY_EXIT_CODE=$?
          if [[ "$DEPLOY_EXIT_CODE" -eq 0 ]]; then
            ssh "${SSH_OPTS[@]}" kidults-staging@"$HOST" \
              'bash -s -- ih-staging-01 165.232.175.45 10.104.0.3 '"$RELEASE_ID $REMOTE_ARCHIVE $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" \
              < scripts/operations/digitalocean_staging_portal_deploy_v1.sh \
              || DEPLOY_EXIT_CODE=$?
          fi
          ssh "${SSH_OPTS[@]}" kidults-staging@"$HOST" "rm -f -- $REMOTE_ARCHIVE" || true
          {
            echo "release_id=$RELEASE_ID"
            echo "exit_code=$DEPLOY_EXIT_CODE"
          } >> "$GITHUB_OUTPUT"
      - name: Collect deployment-scoped remote receipts and localhost body
        if: always() && steps.remote_deploy.outputs.release_id != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/digitalocean-staging-portal
          SSH=(ssh -o KexAlgorithms=curve25519-sha256 -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519")
          RELEASE_ID="${{ steps.remote_deploy.outputs.release_id }}"
          DEPLOY_EXIT_CODE="${{ steps.remote_deploy.outputs.exit_code }}"
          REMOTE_RECEIPT_DIR="~/kidults-runtime/audit/portal-r001-deployments/$RELEASE_ID"
          for receipt in deploy-receipt.json health-receipt.json rollback-receipt.json; do
            if "${SSH[@]}" kidults-staging@"$HOST" "test -f $REMOTE_RECEIPT_DIR/$receipt"; then
              "${SSH[@]}" kidults-staging@"$HOST" "cat $REMOTE_RECEIPT_DIR/$receipt" \
                > "artifacts/digitalocean-staging-portal/$receipt"
            fi
          done
          BODY_NAME=index.html
          if [[ "$DEPLOY_EXIT_CODE" -ne 0 ]]; then BODY_NAME=rollback-index.html; fi
          if ! "${SSH[@]}" kidults-staging@"$HOST" 'curl -fsS http://127.0.0.1:4173/index.html' \
            > "artifacts/digitalocean-staging-portal/$BODY_NAME"; then
            rm -f "artifacts/digitalocean-staging-portal/$BODY_NAME"
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={
            'id':'kidults-digitalocean-staging-portal-runner-execution-v1',
            'receipt_type':'GITHUB_RUNNER_EXECUTION',
            'state':'CAPTURED_NOT_ATTESTED',
            'repository':os.environ['GITHUB_REPOSITORY'],
            'workflow_name':os.environ['GITHUB_WORKFLOW'],
            'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],
            'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],
            'source_ref':os.environ['GITHUB_REF'],
            'event_name':os.environ['GITHUB_EVENT_NAME'],
            'job_name':os.environ['GITHUB_JOB'],
            'deployment_id':os.environ['RELEASE_ID'],
            'source_commit_sha':os.environ['GITHUB_SHA'],
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'workflow_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'remote_deploy_exit_code':int(os.environ['DEPLOY_EXIT_CODE']),
            'evidence_class':'REMOTE_STAGING',
            'collected_at':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
            'successful_workflow_attested':False,
            'public':'HOLD',
            'production':'HOLD',
            'g5':'HOLD'
          }
          Path('artifacts/digitalocean-staging-portal/runner-execution.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
        env:
          RELEASE_ID: ${{ steps.remote_deploy.outputs.release_id }}
          DEPLOY_EXIT_CODE: ${{ steps.remote_deploy.outputs.exit_code }}
      - name: Validate exact remote receipt bundle
        id: validate_receipts
        if: always() && steps.remote_deploy.outputs.release_id != ''
        shell: bash
        run: |
          set -uo pipefail
          OUTCOME=DEPLOYED
          EXTRA_ARGS=(--require-rollback-target)
          if [[ "${{ steps.remote_deploy.outputs.exit_code }}" -ne 0 ]]; then
            OUTCOME=ROLLED_BACK
            EXTRA_ARGS=()
          fi
          VALIDATOR_EXIT_CODE=0
          python scripts/operations/validate_digitalocean_staging_portal_receipts_v1.py \
            --artifact-dir artifacts/digitalocean-staging-portal \
            --expected-outcome "$OUTCOME" \
            --expected-deployment-id "${{ steps.remote_deploy.outputs.release_id }}" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-name "$GITHUB_WORKFLOW" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --expected-source-ref "$GITHUB_REF" \
            --expected-event-name "$GITHUB_EVENT_NAME" \
            --expected-job-name "$GITHUB_JOB" \
            --expected-evidence-class REMOTE_STAGING \
            "${EXTRA_ARGS[@]}" \
            --output artifacts/digitalocean-staging-portal/receipt-validation.json \
            || VALIDATOR_EXIT_CODE=$?
          echo "exit_code=$VALIDATOR_EXIT_CODE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: kidults-digitalocean-staging-portal
          path: artifacts/digitalocean-staging-portal
          retention-days: 30
          if-no-files-found: warn
      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Enforce successful deploy and receipt validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.remote_deploy.outputs.exit_code }}" = "0"
          test "${{ steps.validate_receipts.outputs.exit_code }}" = "0"
