name: KIDULTS Cloudflare Pages Boundary Readonly v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-pages-boundary-readonly-v1
  cancel-in-progress: true

jobs:
  audit-pages-boundary:
    if: ${{ false }} # P0 #1831: fresh exact-main Program Owner approval required before any provider-secret resolution
    environment: kidults-cloudflare-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Read-only Cloudflare Pages boundary and deployment inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: kidults-workspace-staging
          EXPECTED_REPOSITORY: johnkim9524-collab/kaios_enterprise_repo
          RECEIPT_DIR: artifacts/cloudflare-pages-boundary-readonly
        run: bash scripts/ops/cloudflare-pages-boundary-readonly.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: cloudflare-pages-boundary-readonly-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cloudflare-pages-boundary-readonly
          if-no-files-found: error
          retention-days: 30
