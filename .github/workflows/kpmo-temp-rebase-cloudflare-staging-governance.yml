name: KPMO Temporary Rebase Cloudflare STAGING Governance

on:
  push:
    branches:
      - kpmo/cloudflare-staging-governance-v1
    paths:
      - .github/workflows/kpmo-temp-rebase-cloudflare-staging-governance.yml

permissions:
  contents: write

concurrency:
  group: kpmo-temp-rebase-cloudflare-staging-governance
  cancel-in-progress: false

jobs:
  rebase:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: kpmo/cloudflare-staging-governance-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase Draft governance branch onto latest protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "kpmo/cloudflare-staging-governance-v1"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          git config user.name 'johnkim9524-collab'
          git config user.email 'john.kim9524@gmail.com'
          START_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" != "$START_SHA"
          git rebase origin/main
          rm -f .github/workflows/kpmo-temp-rebase-cloudflare-staging-governance.yml
          git add -A
          git commit -m '[CF-Pages-Skip] chore(kpmo): remove temporary rebase workflow'
          test "$(git merge-base HEAD origin/main)" = "$MAIN_SHA"
          git push --force-with-lease origin "HEAD:$GITHUB_REF_NAME"
