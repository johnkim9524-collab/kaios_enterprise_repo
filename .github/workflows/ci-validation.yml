name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate KAIOS Foundation
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository at exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact source SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Verify mandatory GitHub-source agent bootstrap
        run: |
          set -euo pipefail
          node --check scripts/governance/bootstrap-ai-agent-from-github-v1.mjs
          node --check scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs
          node --check scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
          export KIDULTS_BOOTSTRAP_NONCE="$(openssl rand -base64 48 | tr -d '\n')"
          TASK_ID="ci-validation-${GITHUB_RUN_ID}"
          SESSION_ID="ci-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}"
          BOOTSTRAP_RESULT="$(node scripts/governance/bootstrap-ai-agent-from-github-v1.mjs \
            --require-clean \
            --agent-id KPMO_CI_VALIDATION \
            --agent-class RUNTIME_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA")"
          RECEIPT_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.receipt_path)' "$BOOTSTRAP_RESULT")"
          VERIFY_RESULT="$(node scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs \
            --receipt "$RECEIPT_PATH" \
            --agent-id KPMO_CI_VALIDATION \
            --agent-class RUNTIME_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --consume \
            )"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.state!=="BOOTSTRAP_VERIFIED"||x.consumed!==true||x.task_dispatch_allowed_for_bound_task_session!==true||x.working_sha!==process.env.EXPECTED_SHA) throw new Error("BOOTSTRAP_VERIFICATION_RESULT_INVALID")' "$VERIFY_RESULT"
          printf '%s\n' "$VERIFY_RESULT" > /tmp/kpmo-ci-agent-bootstrap-verification-v1.json
          node scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs \
            > /tmp/kpmo-ci-agent-bootstrap-static-validation-v1.json

      - name: Reject unbounded GitHub Actions API access
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-github-actions-api-bounds-v1.mjs --self-test
          node scripts/kidults/source-intelligence/validate-github-actions-api-bounds-v1.mjs

      - name: Enforce bounded PR impact routing
        run: node scripts/kidults/kpmo/validate-pr-impact-routing-v1.mjs

      - name: Enforce dependency bootstrap locks
        run: |
          set -euo pipefail
          node --test tests/kidults/kpmo/dependency-bootstrap-lock-v1.test.mjs
          node scripts/kidults/kpmo/validate-dependency-bootstrap-lock-v1.mjs

      - name: Verify Production release gate synthetic controls
        run: |
          set -euo pipefail
          node --test tests/production/production-release-evidence-gate-v1.test.mjs
          node scripts/kidults/kpmo/validate-production-rollback-contract-v1.mjs

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-ci.lock.txt

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f requirements-ci.in
          test -f requirements-ci.lock.txt
          test -f requirements-runtime.in
          test -f requirements-runtime.lock.txt
          test -f Dockerfile
          test -f docker-compose.yml
          test -f .dockerignore
          test -f .env.example
          test -f scripts/run_kaios.py
          test -f scripts/run_gateway.py
          test -f deploy/healthcheck.py
          test -f deploy/smoke_test.py
          test -d app
          test -d config
          test -d public
          test -d tests

      - name: Run tests
        run: pytest -q

      - name: Validate Kidults staging intelligence
        run: npm --prefix apps/kidults-enterprise-staging test

      - name: Validate source eligibility receipt expiry and producer lineage
        run: node --test tests/kidults/source-intelligence/source-eligibility-receipt-v1.test.mjs

      - name: Validate global SOLD source registry persistence controls
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/global-sold-source-registry-v1.mjs
          node scripts/kidults/source-intelligence/source-intelligence-evidence-manifest-v1.mjs
          node --test \
            tests/kidults/source-intelligence/global-sold-source-registry-v1.test.mjs \
            tests/kidults/source-intelligence/source-intelligence-evidence-manifest-v1.test.mjs

      - name: Run KAIOS pipeline
        run: python scripts/run_kaios.py

      - name: Verify generated outputs
        run: |
          test -f public/monthly-data.json
          test -f public/api/status.json
          test -f public/api/health.json
          test -d public/archive

      - name: Show generated status
        run: |
          cat public/api/status.json
          cat public/api/health.json

  container:
    name: Validate Production Container
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout repository at exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Build production image
        run: |
          docker build \
            --tag kaios-enterprise:ci \
            .

      - name: Start production container
        run: |
          docker run \
            --detach \
            --name kaios-enterprise-ci \
            --publish 8787:8787 \
            --env KAIOS_ENVIRONMENT=production \
            --env KAIOS_API_SECRET=kaios-ci-validation-secret \
            kaios-enterprise:ci

      - name: Run deployment smoke test
        run: |
          python deploy/smoke_test.py

      - name: Inspect container
        if: always()
        run: |
          docker ps --all
          docker inspect kaios-enterprise-ci || true
          docker logs kaios-enterprise-ci || true

      - name: Stop production container
        if: always()
        run: |
          docker rm --force kaios-enterprise-ci || true
