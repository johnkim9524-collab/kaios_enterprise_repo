name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-resume-postgres:
    name: Verify resume on disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaios
        options: >-
          --health-cmd "pg_isready -U postgres -d kaios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Verify real database claim and response-loss reconciliation
        env:
          KIDULTS_RESUME_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node tests/kidults/staging-operations/resume-postgres-v1.integration.mjs
  validate:
    name: Validate KAIOS Foundation
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository at exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          # Bounded history includes the fixed protected-main IAM comparison base.
          fetch-depth: 16
          persist-credentials: false

      - name: Verify exact source SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Verify mandatory GitHub-source agent bootstrap
        run: |
          set -euo pipefail
          node --check scripts/governance/bootstrap-ai-agent-from-github-v1.mjs
          node --check scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs
          node --check scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
          export KIDULTS_BOOTSTRAP_NONCE="$(openssl rand -base64 48 | tr -d '\n')"
          TASK_ID="ci-validation-${GITHUB_RUN_ID}"
          SESSION_ID="ci-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}"
          BOOTSTRAP_RESULT="$(node scripts/governance/bootstrap-ai-agent-from-github-v1.mjs \
            --require-clean \
            --agent-id KPMO_CI_VALIDATION \
            --agent-class RUNTIME_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA")"
          RECEIPT_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.receipt_path)' "$BOOTSTRAP_RESULT")"
          VERIFY_RESULT="$(node scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs \
            --receipt "$RECEIPT_PATH" \
            --agent-id KPMO_CI_VALIDATION \
            --agent-class RUNTIME_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --consume \
            )"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.state!=="BOOTSTRAP_VERIFIED"||x.consumed!==true||x.task_dispatch_allowed_for_bound_task_session!==true||x.working_sha!==process.env.EXPECTED_SHA) throw new Error("BOOTSTRAP_VERIFICATION_RESULT_INVALID")' "$VERIFY_RESULT"
          printf '%s\n' "$VERIFY_RESULT" > /tmp/kpmo-ci-agent-bootstrap-verification-v1.json
          node scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs \
            > /tmp/kpmo-ci-agent-bootstrap-static-validation-v1.json
          node scripts/governance/bootstrap-ai-agent-from-github-v1.mjs --self-test-event-sha-binding
          node --test tests/governance/bootstrap-workflow-run-consumption-v1.test.mjs
          node --test tests/governance/development-branch-resume-v1.test.mjs tests/governance/development-draft-proposal-resume-v1.test.mjs tests/kidults/kpmo/durable-canonical-ledger-canary-v1.test.mjs tests/kidults/kpmo/sentinel-snapshot-retry-v1.test.mjs tests/kidults/kpmo/wait-exact-sha-producer-cohort-v1.test.mjs
          node --test tests/kidults/kpmo/natural-clock-dispatch-v1.test.mjs tests/kidults/kpmo/natural-clock-intake-v1.test.mjs
          node --test tests/kidults/kpmo/assurance-full-proof-v1.test.mjs tests/kidults/kpmo/whole-platform-collector-v1.test.mjs
          node --test tests/kidults/kpmo/runtime-domain-evidence-demand-v1.test.mjs
          node --test tests/kidults/kpmo/internal-operating-recovery-v1.test.mjs
          node --test tests/kidults/kpmo/security-runtime-domain-producer-v1.test.mjs
          node --test tests/kidults/kpmo/business-input-stage-v1.test.mjs
          node --test tests/kidults/kpmo/assurance-failure-retention-v1.test.mjs
          node --test tests/kidults/kpmo/private-acquisition-receipt-v1.test.mjs

      - name: Verify holistic correction negative and boundary cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test tests/kidults/kpmo/assurance-full-proof-v1.test.mjs tests/governance/autonomous-policy-alignment-v1.test.mjs tests/governance/autonomous-approval-policy-envelope-v1.test.mjs tests/kidults/staging-operations/provider-control-v1.test.mjs tests/kidults/kpmo/direct-owner-merge-window-v1.test.mjs
          node --test services/kidults-control-plane/scripts/provider-control-runtime-v1.test.mjs services/kidults-control-plane/scripts/psa-private-file-store-v1.test.mjs services/kidults-control-plane/scripts/psa-private-evaluation-v1.test.mjs services/kidults-control-plane/scripts/psa-cert-verification-adapter-v1.test.mjs
          node scripts/kidults/provider/validate-psa-120-admission-controls-v1.mjs

      - name: Reject unbounded GitHub Actions API access
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-github-actions-api-bounds-v1.mjs --self-test
          node scripts/kidults/source-intelligence/validate-github-actions-api-bounds-v1.mjs

      - name: Enforce bounded PR impact routing
        run: node scripts/kidults/kpmo/validate-pr-impact-routing-v1.mjs

      - name: Validate permanent platform constitution
        run: node --test tests/kidults/governance/constitution-v4.test.mjs

      - name: Validate root governance scope registry
        run: node --test tests/kidults/kpmo/scope-aware-root-policy-v1.test.mjs

      - name: Enforce STAGING normal-operations autonomy
        run: |
          node scripts/governance/validate-staging-normal-ops-autonomy-v1.mjs
          node --test tests/governance/staging-normal-ops-autonomy-v1.test.mjs
          node --test tests/governance/staging-no-authority-expansion-v1.test.mjs

      - name: Enforce dependency bootstrap locks
        run: |
          set -euo pipefail
          node --test tests/kidults/kpmo/dependency-bootstrap-lock-v1.test.mjs
          node scripts/kidults/kpmo/validate-dependency-bootstrap-lock-v1.mjs
          node --test tests/kidults/kpmo/requirement-coverage-dependency-bootstrap-v1.test.mjs
          node scripts/kidults/kpmo/validate-requirement-coverage-dependency-bootstrap-v1.mjs

      - name: Verify Production release gate synthetic controls
        run: |
          set -euo pipefail
          node --test tests/production/production-release-evidence-gate-v1.test.mjs
          node scripts/kidults/kpmo/validate-production-rollback-contract-v1.mjs

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-ci.lock.txt

      - name: Verify repository structure
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f requirements-ci.in
          test -f requirements-ci.lock.txt
          test -f requirements-runtime.in
          test -f requirements-runtime.lock.txt
          test -f Dockerfile
          test -f docker-compose.yml
          test -f .dockerignore
          test -f .env.example
          test -f scripts/run_kaios.py
          test -f scripts/run_gateway.py
          test -f deploy/healthcheck.py
          test -f deploy/smoke_test.py
          test -d app
          test -d config
          test -d public
          test -d tests

      - name: Run tests
        run: |
          set -euo pipefail
          pytest -q
          node tests/kidults/staging-operations/autonomous-dispatcher-v1.test.mjs
          node tests/kidults/staging-operations/autonomous-event-token-broker-v1.test.cjs

      - name: Verify resume reconciliation and retained authority guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test tests/kidults/staging-operations/github-lifecycle-resume-v1.test.mjs
          node --test tests/kidults/staging-operations/github-lifecycle-readback-v1.test.mjs tests/kidults/staging-operations/github-lifecycle-executor-v1.test.mjs
          node --test tests/governance/owner-recovery-bootstrap-resume-v1.test.mjs
          node --test tests/kidults/staging-operations/broker-resume-dispatch-v1.test.mjs tests/kidults/staging-operations/dynamodb-operation-ledger-v1.test.mjs tests/kidults/staging-operations/resume-dispatch-fanout-v1.test.mjs tests/kidults/staging-operations/resume-operation-v1.test.mjs tests/kidults/staging-operations/postgres-transition-ledger-v1.test.mjs tests/kidults/staging-operations/autonomous-dispatch-fanout-v1.test.mjs tests/governance/markdown-capability-format-v1.test.mjs tests/governance/autonomous-policy-alignment-v1.test.mjs

      - name: Validate Kidults staging intelligence
        run: npm --prefix apps/kidults-enterprise-staging test

      - name: Validate source eligibility receipt expiry and producer lineage
        run: node --test tests/kidults/source-intelligence/source-eligibility-receipt-v1.test.mjs

      - name: Independently verify bounded postmerge terminal recovery at exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test tests/kidults/kpmo/autonomous-postmerge-recovery-v1.test.mjs tests/kidults/kpmo/postmerge-recovery-*.test.mjs tests/kidults/staging-operations/autonomous-landing-staging-deployer-v1.test.mjs
          node --test tests/kidults/kpmo/autonomous-terminal-immutable-v1.test.mjs tests/kidults/kpmo/whole-platform-operating-proof-v1.test.mjs tests/kidults/kpmo/whole-platform-runtime-evidence-v1.test.mjs tests/kidults/kpmo/whole-platform-collector-v1.test.mjs tests/kidults/kpmo/coverage-alias-runtime-name-v1.test.mjs tests/kidults/kpmo/shadow-assurance-runtime-binding-v1.test.mjs
          python -m pytest -q tests/kidults/kpmo/test_autonomous_postmerge_recovery_ledger_v1.py tests/kidults/kpmo/test_postmerge_recovery_workflow_v1.py tests/kidults/kpmo/test_authority_gate_archive_v1.py
          python scripts/kidults/staging-operations/bundle-postmerge-recovery-ledger-v1.py
          node scripts/kidults/kpmo/validate-workflow-repository-mutation-boundary-v1.mjs

      - name: Verify autonomous finalizer exact postmerge evidence selection
        run: node --test tests/kidults/kpmo/autonomous-postmerge-validation-v1.test.mjs

      - name: Validate global SOLD source registry persistence controls
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/global-sold-source-registry-v1.mjs
          node scripts/kidults/source-intelligence/source-intelligence-evidence-manifest-v1.mjs
          node --test \
            tests/kidults/source-intelligence/global-sold-source-registry-v1.test.mjs \
            tests/kidults/source-intelligence/source-intelligence-evidence-manifest-v1.test.mjs \
            tests/kidults/source-intelligence/source-intelligence-writer-snapshot-v1.test.mjs

      - name: Run KAIOS pipeline
        run: python scripts/run_kaios.py

      - name: Verify generated outputs
        run: |
          test -f public/monthly-data.json
          test -f public/api/status.json
          test -f public/api/health.json
          test -d public/archive

      - name: Show generated status
        run: |
          cat public/api/status.json
          cat public/api/health.json

  container:
    name: Validate Production Container
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout repository at exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Build production image
        run: |
          docker build \
            --tag kaios-enterprise:ci \
            .

      - name: Start production container
        run: |
          docker run \
            --detach \
            --name kaios-enterprise-ci \
            --publish 8787:8787 \
            --env KAIOS_ENVIRONMENT=production \
            --env KAIOS_API_SECRET=kaios-ci-validation-secret \
            kaios-enterprise:ci

      - name: Run deployment smoke test
        run: |
          python deploy/smoke_test.py

      - name: Inspect container
        if: always()
        run: |
          docker ps --all
          docker inspect kaios-enterprise-ci || true
          docker logs kaios-enterprise-ci || true

      - name: Stop production container
        if: always()
        run: |
          docker rm --force kaios-enterprise-ci || true
