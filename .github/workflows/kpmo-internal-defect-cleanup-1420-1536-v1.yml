name: KPMO Internal Defect Cleanup 1420 1536 V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-canonical-issue-transition-guard-v1.yml'
      - '.github/workflows/kpmo-exact-head-ci-supersession-v1.yml'
      - '.github/workflows/kpmo-internal-defect-cleanup-1420-1536-v1.yml'
      - 'scripts/kidults/governance/test-internal-defect-cleanup-1420-1536-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Bind exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Validate cleanup invariants
        run: node scripts/kidults/governance/test-internal-defect-cleanup-1420-1536-v1.mjs
