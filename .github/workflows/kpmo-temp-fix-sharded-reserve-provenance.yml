name: KPMO Temporary Fix Sharded Reserve Provenance

on:
  push:
    branches:
      - kpmo/cloudflare-staging-governance-v1
    paths:
      - .github/workflows/kpmo-temp-fix-sharded-reserve-provenance.yml

permissions:
  contents: write

concurrency:
  group: kpmo-temp-fix-sharded-reserve-provenance
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: kpmo/cloudflare-staging-governance-v1
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Restore exact workflow-run upstream SHA binding
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "kpmo/cloudflare-staging-governance-v1"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/kidults-asi-sharded-source-reserve-v1.yml')
          text = path.read_text()
          old = '            test "$UPSTREAM_HEAD_SHA" = "$EXPECTED_SHA"\n'
          new = '            test "$UPSTREAM_HEAD_SHA" = "$GITHUB_SHA"\n            test "$UPSTREAM_HEAD_SHA" = "$EXPECTED_SHA"\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one upstream EXPECTED_SHA guard, observed {count}')
          path.write_text(text.replace(old, new))
          PY
          node scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-provenance-v1.mjs
          rm -f .github/workflows/kpmo-temp-fix-sharded-reserve-provenance.yml

      - name: Commit exact root correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'johnkim9524-collab'
          git config user.email 'john.kim9524@gmail.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m '[CF-Pages-Skip] fix(asi): restore exact workflow-run upstream SHA binding'
          git push origin "HEAD:$GITHUB_REF_NAME"
