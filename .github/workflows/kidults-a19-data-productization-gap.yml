name: kidults-a19-data-productization-gap
on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-a19-data-productization-gap.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run a19:certify
      - name: Upload A19 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a19-productization-gap-evidence
          path: services/kidults-autonomous-intelligence/reports/productization/*.json
          if-no-files-found: error
