name: KPMO Continuous Assurance Success Authority Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-continuous-assurance-success-authority-gate-v1.yml'
      - 'scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs'
      - 'scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs'
      - 'scripts/kidults/kpmo/validate-sentinel-producer-content-v1.mjs'
      - 'scripts/kidults/kpmo/read-sentinel-artifact-v1.py'
      - 'scripts/kidults/kpmo/select-latest-natural-sentinel-run-v1.mjs'
      - 'tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs'
      - 'tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs'
      - 'coordination/kidults/kpmo/platform-continuous-assurance-v1.json'
  workflow_run:
    workflows: ['KIDULTS Platform Continuous Assurance V1']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kpmo-continuous-assurance-success-authority-gate-${{ github.event.workflow_run.id || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact source and universal success authority-gate contract
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs
          node scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs --self-test
          node --test tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs
          node scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs

  success-authority-gate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name == 'KIDULTS Platform Continuous Assurance V1' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      GATE_DIR: /tmp/kpmo-success-assurance-authority-gate
    steps:
      - name: Initialize durable fail-closed gate receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GATE_DIR"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const stable=(value)=>Array.isArray(value)?`[${value.map(stable).join(',')}]`:value&&typeof value==='object'?`{${Object.keys(value).sort().map((key)=>`${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`:JSON.stringify(value);
          const sha256=(value)=>`sha256:${crypto.createHash('sha256').update(stable(value)).digest('hex')}`;
          const base={
            receipt_id:'kpmo-continuous-assurance-success-authority-gate-v1',
            version:'1.0.0', state:'VERIFIED_FAIL',
            failure_class:'SUCCESSFUL_ASSURANCE_AUTHORITY_NOT_RECONCILED',
            repository:process.env.GITHUB_REPOSITORY,
            upstream_observation:{
              workflow_name:process.env.UPSTREAM_WORKFLOW_NAME,
              run_id:Number(process.env.UPSTREAM_RUN_ID),
              run_attempt:Number(process.env.UPSTREAM_RUN_ATTEMPT),
              head_sha:process.env.UPSTREAM_SHA,
              event:process.env.UPSTREAM_EVENT,
              conclusion:process.env.UPSTREAM_CONCLUSION
            },
            upstream_assurance:process.env.UPSTREAM_WORKFLOW_NAME==='KIDULTS Platform Continuous Assurance V1'?{
              run_id:Number(process.env.UPSTREAM_RUN_ID),run_attempt:Number(process.env.UPSTREAM_RUN_ATTEMPT),
              head_sha:process.env.UPSTREAM_SHA,event:process.env.UPSTREAM_EVENT,conclusion:process.env.UPSTREAM_CONCLUSION
            }:null,
            current_protected_main_sha:null,
            producer_health_run_id:null,
            producer_health_run_attempt:null,
            producer_health_event:null,
            producer_health_receipt_digest:null,
            producer_health_conclusion:null,
            producer_health_state:'UNAVAILABLE',
            coverage_scope:'CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM',
            whole_platform_authority:false,
            promotion_eligible:false,
            empirical_authority:false,
            provider_authority:false,
            database_authority:false,
            empirical_delta:0,
            public:'HOLD', production:'HOLD', g5:'HOLD'
          };
          const receipt={...base,receipt_digest:sha256(base)};
          fs.writeFileSync(`${process.env.GATE_DIR}/kpmo-continuous-assurance-success-authority-gate-v1.json`,`${JSON.stringify(receipt,null,2)}\n`);
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Verify exact upstream source is still current protected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/branches/main" > "$GATE_DIR/main.json"
          CURRENT_MAIN=$(jq -r '.commit.sha // empty' "$GATE_DIR/main.json")
          test "$CURRENT_MAIN" = "$UPSTREAM_SHA"
          echo "CURRENT_MAIN_SHA=$CURRENT_MAIN" >> "$GITHUB_ENV"

      - name: Restore latest exact-main natural Sentinel producer-health receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}" \
            > "$GATE_DIR/upstream-assurance-run.json"
          UPSTREAM_CREATED_AT=$(jq -r '.created_at // empty' "$GATE_DIR/upstream-assurance-run.json")
          test -n "$UPSTREAM_CREATED_AT"
          # Query the same authenticated time boundary the selector validates.
          # A naturally newer run belongs to the next Assurance observation.
                    SENTINEL_PAGE_LIMIT=1000
          SENTINEL_EXPECTED_TOTAL=''
          SENTINEL_FETCHED_COUNT=0
          SENTINEL_PAGINATION_COMPLETE=false
          : > "$GATE_DIR/sentinel-runs.jsonl"
          for PAGE in $(seq 1 "$SENTINEL_PAGE_LIMIT"); do
            PAGE_PATH="$GATE_DIR/sentinel-runs-page-${PAGE}.json"
            gh api --method GET -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/kpmo-continuous-assurance-sentinel-health-v1.yml/runs" \
              -f branch=main -f per_page=100 -f page="$PAGE" -f "created=<=${UPSTREAM_CREATED_AT}" \
              > "$PAGE_PATH"
            PAGE_TOTAL=$(jq -r '.total_count // empty' "$PAGE_PATH")
            PAGE_COUNT=$(jq -r '.workflow_runs | length' "$PAGE_PATH")
            [[ "$PAGE_TOTAL" =~ ^[0-9]+$ ]]
            [[ "$PAGE_COUNT" =~ ^[0-9]+$ ]]
            test "$PAGE_COUNT" -le 100
            if [ -z "$SENTINEL_EXPECTED_TOTAL" ]; then
              SENTINEL_EXPECTED_TOTAL="$PAGE_TOTAL"
              test "$SENTINEL_EXPECTED_TOTAL" -le $((SENTINEL_PAGE_LIMIT * 100))
            else
              test "$PAGE_TOTAL" = "$SENTINEL_EXPECTED_TOTAL" || {
                echo SENTINEL_PAGINATION_TOTAL_DRIFT >&2
                exit 1
              }
            fi
            jq -c '.workflow_runs[]' "$PAGE_PATH" >> "$GATE_DIR/sentinel-runs.jsonl"
            SENTINEL_FETCHED_COUNT=$((SENTINEL_FETCHED_COUNT + PAGE_COUNT))
            if [ "$SENTINEL_FETCHED_COUNT" -eq "$SENTINEL_EXPECTED_TOTAL" ]; then
              SENTINEL_PAGINATION_COMPLETE=true
              break
            fi
            if [ "$PAGE_COUNT" -lt 100 ]; then
              echo SENTINEL_PAGINATION_TRUNCATED >&2
              exit 1
            fi
          done
          test "$SENTINEL_PAGINATION_COMPLETE" = true || {
            echo SENTINEL_PAGINATION_BOUND_EXCEEDED >&2
            exit 1
          }
          jq -s --argjson total "$SENTINEL_EXPECTED_TOTAL" \
            '{total_count:$total,workflow_runs:.}' "$GATE_DIR/sentinel-runs.jsonl" \
            > "$GATE_DIR/sentinel-runs.json"
          jq -e '.workflow_runs as $runs | ($runs|length)==.total_count and ($runs|length)==($runs|map(.id)|unique|length)' \
            "$GATE_DIR/sentinel-runs.json" >/dev/null
          node scripts/kidults/kpmo/select-latest-natural-sentinel-run-v1.mjs \
            "$GATE_DIR/sentinel-runs.json" "$UPSTREAM_SHA" "$UPSTREAM_CREATED_AT" "$GITHUB_REPOSITORY" \
            > "$GATE_DIR/sentinel-selection.json"
          jq '.latest // {}' "$GATE_DIR/sentinel-selection.json" > "$GATE_DIR/selected-sentinel-run.json"
          SENTINEL_RUN_ID=$(jq -r '.id // empty' "$GATE_DIR/selected-sentinel-run.json")
          SENTINEL_RUN_ATTEMPT=$(jq -r '.run_attempt // empty' "$GATE_DIR/selected-sentinel-run.json")
          SENTINEL_EVENT=$(jq -r '.event // empty' "$GATE_DIR/selected-sentinel-run.json")
          SENTINEL_CONCLUSION=$(jq -r '.conclusion // empty' "$GATE_DIR/selected-sentinel-run.json")
          [[ "$SENTINEL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$SENTINEL_RUN_ATTEMPT" = 1
          [[ "$SENTINEL_EVENT" =~ ^(workflow_run|repository_dispatch|schedule)$ ]]
          {
            echo "PRODUCER_HEALTH_RUN_ID=$SENTINEL_RUN_ID"
            echo "PRODUCER_HEALTH_RUN_ATTEMPT=$SENTINEL_RUN_ATTEMPT"
            echo "PRODUCER_HEALTH_EVENT=$SENTINEL_EVENT"
            echo "PRODUCER_HEALTH_CONCLUSION=$SENTINEL_CONCLUSION"
          } >> "$GITHUB_ENV"
          jq -e '.state=="VERIFIED_PASS" and .latest.status=="completed" and .latest.conclusion=="success"' \
            "$GATE_DIR/sentinel-selection.json" >/dev/null
          ARTIFACT_NAME="kpmo-continuous-assurance-sentinel-health-v1-${UPSTREAM_SHA}-${SENTINEL_RUN_ID}-${SENTINEL_RUN_ATTEMPT}"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SENTINEL_RUN_ID}/artifacts?per_page=100" \
            > "$GATE_DIR/sentinel-artifacts.json"
          ARTIFACT_COUNT=$(jq --arg name "$ARTIFACT_NAME" --argjson run "$SENTINEL_RUN_ID" --arg sha "$UPSTREAM_SHA" \
            '[.artifacts[] | select(.name==$name and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' \
            "$GATE_DIR/sentinel-artifacts.json")
          test "$ARTIFACT_COUNT" -eq 1
          ARTIFACT_ID=$(jq -r --arg name "$ARTIFACT_NAME" --argjson run "$SENTINEL_RUN_ID" --arg sha "$UPSTREAM_SHA" \
            '[.artifacts[] | select(.name==$name and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)][0].id' \
            "$GATE_DIR/sentinel-artifacts.json")
          ARTIFACT_DIGEST=$(jq -r --arg name "$ARTIFACT_NAME" --argjson run "$SENTINEL_RUN_ID" --arg sha "$UPSTREAM_SHA" \
            '[.artifacts[] | select(.name==$name and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)][0].digest // empty' \
            "$GATE_DIR/sentinel-artifacts.json")
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$GATE_DIR/upstream-health.zip"
          python3 scripts/kidults/kpmo/read-sentinel-artifact-v1.py "$ARTIFACT_DIGEST" \
            < "$GATE_DIR/upstream-health.zip" > "$GATE_DIR/upstream-health-packet.json"
          jq -e \
            '[.members[] | select((.name|split("/")|last)=="kpmo-continuous-assurance-sentinel-health-v1.json")] | length==1' \
            "$GATE_DIR/upstream-health-packet.json" >/dev/null
          jq -r \
            '[.members[] | select((.name|split("/")|last)=="kpmo-continuous-assurance-sentinel-health-v1.json")][0].text' \
            "$GATE_DIR/upstream-health-packet.json" \
            > "$GATE_DIR/kpmo-continuous-assurance-sentinel-health-v1.json"

      - name: Seal exact successful Assurance authority-gate receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const stable=(value)=>Array.isArray(value)?`[${value.map(stable).join(',')}]`:value&&typeof value==='object'?`{${Object.keys(value).sort().map((key)=>`${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`:JSON.stringify(value);
          const sha256=(value)=>`sha256:${crypto.createHash('sha256').update(stable(value)).digest('hex')}`;
          const gatePath=`${process.env.GATE_DIR}/kpmo-continuous-assurance-success-authority-gate-v1.json`;
          const healthPath=`${process.env.GATE_DIR}/kpmo-continuous-assurance-sentinel-health-v1.json`;
          const prior=JSON.parse(fs.readFileSync(gatePath,'utf8'));
          let health=null;
          try { health=JSON.parse(fs.readFileSync(healthPath,'utf8')); } catch {}
          const healthUnsigned=health?structuredClone(health):null;
          if(healthUnsigned) delete healthUnsigned.receipt_digest;
          const healthDigest=health&&/^sha256:[0-9a-f]{64}$/.test(health.receipt_digest||'')&&health.receipt_digest===sha256(healthUnsigned)?health.receipt_digest:null;
          const exactSource=process.env.CURRENT_MAIN_SHA===process.env.UPSTREAM_SHA && /^[0-9a-f]{40}$/.test(process.env.UPSTREAM_SHA||'');
          const upstreamAssurancePass=process.env.UPSTREAM_CONCLUSION==='success' && process.env.UPSTREAM_WORKFLOW_NAME==='KIDULTS Platform Continuous Assurance V1';
          const healthPass=health?.receipt_id==='kpmo-continuous-assurance-sentinel-health-v1' && health?.state==='VERIFIED_PASS' &&
            health?.source_sha===process.env.UPSTREAM_SHA && health?.coverage_scope==='CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM' &&
            health?.semantic_content_verified===true && health?.runtime_health_proven===false &&
            health?.whole_platform_authority===false && health?.promotion_eligible===false && healthDigest;
          const base={
            ...prior,
            state: exactSource&&upstreamAssurancePass&&healthPass?'VERIFIED_PASS':'VERIFIED_FAIL',
            failure_class: exactSource&&upstreamAssurancePass&&healthPass?null:'LATEST_NATURAL_SENTINEL_OR_ASSURANCE_NOT_VERIFIED',
            current_protected_main_sha:process.env.CURRENT_MAIN_SHA||null,
            producer_health_run_id:/^[1-9][0-9]*$/.test(process.env.PRODUCER_HEALTH_RUN_ID||'')?Number(process.env.PRODUCER_HEALTH_RUN_ID):null,
            producer_health_run_attempt:process.env.PRODUCER_HEALTH_RUN_ATTEMPT==='1'?1:null,
            producer_health_event:/^(workflow_run|repository_dispatch|schedule)$/.test(process.env.PRODUCER_HEALTH_EVENT||'')?process.env.PRODUCER_HEALTH_EVENT:null,
            producer_health_receipt_digest:healthDigest,
            producer_health_conclusion:process.env.PRODUCER_HEALTH_CONCLUSION||null,
            producer_health_state:health?.state||'UNAVAILABLE'
          };
          delete base.receipt_digest;
          const receipt={...base,receipt_digest:sha256(base)};
          fs.writeFileSync(gatePath,`${JSON.stringify(receipt,null,2)}\n`);
          NODE

      - name: Upload exact-run successful Assurance authority-gate packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpmo-continuous-assurance-success-authority-gate-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ env.GATE_DIR }}/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce successful Assurance authority gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GATE_DIR/kpmo-continuous-assurance-success-authority-gate-v1.json"
          jq -e '
            .receipt_id=="kpmo-continuous-assurance-success-authority-gate-v1" and
            .repository==env.GITHUB_REPOSITORY and
            .upstream_observation.run_id==(env.UPSTREAM_RUN_ID|tonumber) and
            .upstream_observation.run_attempt==(env.UPSTREAM_RUN_ATTEMPT|tonumber) and
            .upstream_observation.head_sha==env.UPSTREAM_SHA and
            .upstream_observation.workflow_name==env.UPSTREAM_WORKFLOW_NAME and
            (.upstream_observation.event|type)=="string" and
            (.upstream_observation.event|length)>0 and
            .current_protected_main_sha==env.UPSTREAM_SHA and
            (.producer_health_run_id|type)=="number" and
            .producer_health_run_attempt==1 and
            (.producer_health_event=="repository_dispatch" or .producer_health_event=="schedule" or .producer_health_event=="workflow_run") and
            .producer_health_conclusion=="success" and
            (.producer_health_receipt_digest|test("^sha256:[0-9a-f]{64}$")) and
            .producer_health_state=="VERIFIED_PASS" and
            .coverage_scope=="CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM" and
            .whole_platform_authority==false and
            .promotion_eligible==false and
            .empirical_authority==false and
            .provider_authority==false and
            .database_authority==false and
            .empirical_delta==0 and
            .public=="HOLD" and .production=="HOLD" and .g5=="HOLD" and
            (.upstream_observation.conclusion=="success" and .upstream_observation.workflow_name=="KIDULTS Platform Continuous Assurance V1") and
            .state=="VERIFIED_PASS"
          ' "$GATE_DIR/kpmo-continuous-assurance-success-authority-gate-v1.json" >/dev/null
