name: KPMO Continuous Assurance Success Authority Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-continuous-assurance-success-authority-gate-v1.yml'
      - 'scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs'
      - 'scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs'
      - 'scripts/kidults/kpmo/validate-sentinel-producer-content-v1.mjs'
      - 'scripts/kidults/kpmo/read-sentinel-artifact-v1.py'
      - 'scripts/kidults/kpmo/select-latest-natural-sentinel-run-v1.mjs'
      - 'scripts/kidults/kpmo/collect-sentinel-continuation-evidence-v1.mjs'
      - 'scripts/kidults/kpmo/lib/authenticated-sentinel-continuation-v1.mjs'
      - 'tests/kidults/kpmo/authenticated-sentinel-continuation-v1.test.mjs'
      - 'scripts/kidults/kpmo/lib/assurance-runtime-proof-handoff-v1.mjs'
      - 'scripts/kidults/kpmo/verify-assurance-runtime-proof-handoff-v1.mjs'
      - 'scripts/kidults/kpmo/run-deferred-assurance-proof-gate-v1.mjs'
      - 'scripts/kidults/kpmo/lib/whole-platform-runtime-evidence-v1.mjs'
      - 'tests/kidults/kpmo/assurance-runtime-proof-handoff-v1.test.mjs'
      - 'tests/kidults/kpmo/verify-assurance-runtime-proof-handoff-v1.test.mjs'
      - '.github/workflows/kidults-autonomous-kpmo-authorization-v1.yml'
      - 'scripts/kidults/kpmo/collect-whole-platform-operating-proof-v1.mjs'
      - 'scripts/kidults/kpmo/lib/assurance-full-proof-v1.mjs'
      - 'scripts/kidults/kpmo/lib/assurance-sentinel-observation-route-v1.mjs'
      - 'scripts/kidults/kpmo/lib/assurance-completion-disposition-v1.mjs'
      - 'scripts/kidults/kpmo/classify-assurance-completion-disposition-v1.mjs'
      - 'tests/kidults/kpmo/assurance-completion-disposition-v1.test.mjs'
      - 'tests/kidults/kpmo/assurance-full-proof-v1.test.mjs'
      - 'tests/kidults/kpmo/whole-platform-collector-v1.test.mjs'
      - 'tests/kidults/kpmo/whole-platform-operating-proof-v1.test.mjs'
      - 'tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs'
      - 'tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs'
      - 'coordination/kidults/kpmo/platform-continuous-assurance-v1.json'
  workflow_run:
    workflows: ['KIDULTS Platform Continuous Assurance V1', 'KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1', 'KIDULTS Autonomous KPMO Authorization V1']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kpmo-continuous-assurance-success-authority-gate-${{ github.event.workflow_run.id || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact source and universal success authority-gate contract
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs
          node scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs --self-test
          node --test tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs
          node --test tests/kidults/kpmo/authenticated-sentinel-continuation-v1.test.mjs tests/kidults/kpmo/assurance-full-proof-v1.test.mjs tests/kidults/kpmo/assurance-completion-disposition-v1.test.mjs tests/kidults/kpmo/assurance-runtime-proof-handoff-v1.test.mjs tests/kidults/kpmo/verify-assurance-runtime-proof-handoff-v1.test.mjs
          node --test tests/kidults/kpmo/whole-platform-collector-v1.test.mjs tests/kidults/kpmo/whole-platform-operating-proof-v1.test.mjs
          node scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs

  sentinel-failure-authority-gate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name == 'KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      SENTINEL_RUN_ID: ${{ github.event.workflow_run.id }}
      SENTINEL_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SENTINEL_SHA: ${{ github.event.workflow_run.head_sha }}
      SENTINEL_EVENT: ${{ github.event.workflow_run.event }}
      SENTINEL_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      NEGATIVE_GATE_DIR: /tmp/kpmo-negative-authority-gate
    steps:
      - name: Emit direct terminal negative authority receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NEGATIVE_GATE_DIR"
          CURRENT_MAIN_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test -n "$CURRENT_MAIN_SHA"
          export CURRENT_MAIN_SHA
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const base={
            receipt_id:'kpmo-continuous-assurance-negative-authority-gate-v1',
            version:'1.0.0',
            state:'VERIFIED_FAIL',
            failure_class:'SENTINEL_TERMINAL_NON_SUCCESS',
            authority_invalidated:true,
            invalidates_prior_success:true,
            repository:process.env.GITHUB_REPOSITORY,
            upstream_observation:{
              workflow_name:'KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1',
              run_id:Number(process.env.SENTINEL_RUN_ID),
              run_attempt:Number(process.env.SENTINEL_RUN_ATTEMPT),
              head_sha:process.env.SENTINEL_SHA,
              event:process.env.SENTINEL_EVENT,
              conclusion:process.env.SENTINEL_CONCLUSION
            },
            current_protected_main_sha:process.env.CURRENT_MAIN_SHA,
            source_sha_matches_current_main:process.env.CURRENT_MAIN_SHA===process.env.SENTINEL_SHA,
            whole_platform_authority:false,
            promotion_eligible:false,
            empirical_authority:false,
            public:'HOLD', production:'HOLD', g5:'HOLD'
          };
          const digest='sha256:'+crypto.createHash('sha256').update(JSON.stringify(base)).digest('hex');
          fs.writeFileSync(`${process.env.NEGATIVE_GATE_DIR}/kpmo-continuous-assurance-negative-authority-gate-v1.json`,JSON.stringify({...base,receipt_digest:digest},null,2)+'\n');
          NODE
      - name: Upload direct terminal negative authority receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpmo-continuous-assurance-negative-authority-gate-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ env.NEGATIVE_GATE_DIR }}/
          if-no-files-found: error
          retention-days: 90
  classify-assurance-completion:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/kidults-platform-continuous-assurance-v1.yml' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'repository_dispatch' ||
       (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.actor.login == 'github-actions[bot]')) &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible_full_audit: ${{ steps.disposition.outputs.eligible_full_audit }}
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      DISPOSITION_DIR: /tmp/kpmo-assurance-completion-disposition
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Classify exact attempt audit disposition without granting authority
        id: disposition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          mkdir -p "$DISPOSITION_DIR"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}" > "$DISPOSITION_DIR/run.json"
          TOTAL=''
          for PAGE in $(seq 1 10); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/attempts/${UPSTREAM_RUN_ATTEMPT}/jobs?per_page=100&page=${PAGE}" > "$DISPOSITION_DIR/jobs-page-$PAGE.json"
            PAGE_TOTAL=$(jq -er '.total_count | select(type=="number" and .>=1 and .<=1000)' "$DISPOSITION_DIR/jobs-page-$PAGE.json")
            if [[ -z "$TOTAL" ]]; then TOTAL="$PAGE_TOTAL"; fi
            test "$TOTAL" = "$PAGE_TOTAL"
            COUNT=$(jq '.jobs|length' "$DISPOSITION_DIR/jobs-page-$PAGE.json")
            if (( PAGE * 100 >= TOTAL )); then break; fi
            test "$COUNT" -eq 100
          done
          jq -s '{total_count: .[0].total_count, jobs: [.[].jobs[]]}' "$DISPOSITION_DIR"/jobs-page-*.json > "$DISPOSITION_DIR/jobs.json"
          node scripts/kidults/kpmo/classify-assurance-completion-disposition-v1.mjs "$DISPOSITION_DIR/run.json" "$DISPOSITION_DIR/jobs.json" "$DISPOSITION_DIR/disposition.json"
      - name: Preserve non-authorizing completion disposition
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-assurance-completion-disposition-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ env.DISPOSITION_DIR }}/
          if-no-files-found: error
          retention-days: 90
  deferred-runtime-proof-handoff-gate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/kidults-autonomous-kpmo-authorization-v1.yml' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.status == 'completed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      GATE_DIR: /tmp/kpmo-deferred-assurance-proof-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Run the independent exact-parent proof handoff verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$GATE_DIR"
          node scripts/kidults/kpmo/run-deferred-assurance-proof-gate-v1.mjs \
            "$GATE_DIR/kpmo-deferred-assurance-runtime-proof-gate-v1.json"
      - name: Preserve exact deferred Assurance gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpmo-deferred-assurance-runtime-proof-gate-${{ env.SOURCE_SHA }}-${{ env.PRODUCER_RUN_ID }}-${{ env.PRODUCER_RUN_ATTEMPT }}
          path: ${{ env.GATE_DIR }}/kpmo-deferred-assurance-runtime-proof-gate-v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Require exact autonomous Assurance proof closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e '(.state=="VERIFIED_PASS" or .state=="NOT_APPLICABLE") and .source_sha==env.SOURCE_SHA and .whole_platform_authority==false and .promotion_eligible==false and .production=="HOLD" and .public=="HOLD" and .g5=="HOLD" and (.state!="VERIFIED_PASS" or ((.producer_health_run_id|type)=="number" and .producer_health_run_attempt==1 and (.producer_health_receipt_digest|test("^sha256:[0-9a-f]{64}$"))))' \
            "$GATE_DIR/kpmo-deferred-assurance-runtime-proof-gate-v1.json" >/dev/null
