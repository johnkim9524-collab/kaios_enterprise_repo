name: KPMO Continuous Assurance Success Authority Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-continuous-assurance-success-authority-gate-v1.yml'
      - 'scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs'
      - 'scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs'
      - 'scripts/kidults/kpmo/validate-sentinel-producer-content-v1.mjs'
      - 'scripts/kidults/kpmo/read-sentinel-artifact-v1.py'
      - 'scripts/kidults/kpmo/select-latest-natural-sentinel-run-v1.mjs'
      - 'tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs'
      - 'tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs'
      - 'coordination/kidults/kpmo/platform-continuous-assurance-v1.json'
  workflow_run:
    workflows: ['KIDULTS Platform Continuous Assurance V1']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kpmo-continuous-assurance-success-authority-gate-${{ github.event.workflow_run.id || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact source and universal success authority-gate contract
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs
          node scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs --self-test
          node --test tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs
          node scripts/kidults/kpmo/validate-continuous-assurance-success-authority-gate-v1.mjs

  success-authority-gate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name == 'KIDULTS Platform Continuous Assurance V1' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'workflow_run' ||
       github.event.workflow_run.event == 'repository_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      GATE_DIR: /tmp/kpmo-success-assurance-authority-gate
    steps:
      - name: Initialize durable fail-closed gate receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GATE_DIR"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const stable=(value)=>Array.isArray(value)?`[${value.map(stable).join(',')}]`:value&&typeof value==='object'?`{${Object.keys(value).sort().map((key)=>`${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`:JSON.stringify(value);
          const sha256=(value)=>`sha256:${crypto.createHash('sha256').update(stable(value)).digest('hex')}`;
          const base={
            receipt_id:'kpmo-continuous-assurance-success-authority-gate-v1',
            version:'1.0.0', state:'VERIFIED_FAIL',
            failure_class:'SUCCESSFUL_ASSURANCE_AUTHORITY_NOT_RECONCILED',
            repository:process.env.GITHUB_REPOSITORY,
            upstream_observation:{
              workflow_name:process.env.UPSTREAM_WORKFLOW_NAME,
              run_id:Number(process.env.UPSTREAM_RUN_ID),
              run_attempt:Number(process.env.UPSTREAM_RUN_ATTEMPT),
              head_sha:process.env.UPSTREAM_SHA,
              event:process.env.UPSTREAM_EVENT,
              conclusion:process.env.UPSTREAM_CONCLUSION
            },
            upstream_assurance:process.env.UPSTREAM_WORKFLOW_NAME==='KIDULTS Platform Continuous Assurance V1'?{
              run_id:Number(process.env.UPSTREAM_RUN_ID),run_attempt:Number(process.env.UPSTREAM_RUN_ATTEMPT),
              head_sha:process.env.UPSTREAM_SHA,event:process.env.UPSTREAM_EVENT,conclusion:process.env.UPSTREAM_CONCLUSION
            }:null,
            current_protected_main_sha:null,
            producer_health_run_id:null,
            producer_health_run_attempt:null,
            producer_health_event:null,
            producer_health_receipt_digest:null,
            producer_health_conclusion:null,
            producer_health_state:'UNAVAILABLE',
            assurance_receipt_digest:null,
            assurance_actual_upstream:null,
            producer_health_eligible:false,
            coverage_scope:'CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM',
            whole_platform_authority:false,
            promotion_eligible:false,
            empirical_authority:false,
            provider_authority:false,
            database_authority:false,
            empirical_delta:0,
            public:'HOLD', production:'HOLD', g5:'HOLD'
          };
          const receipt={...base,receipt_digest:sha256(base)};
          fs.writeFileSync(`${process.env.GATE_DIR}/kpmo-continuous-assurance-success-authority-gate-v1.json`,`${JSON.stringify(receipt,null,2)}\n`);
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Verify exact upstream source is still current protected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/branches/main" > "$GATE_DIR/main.json"
          CURRENT_MAIN=$(jq -r '.commit.sha // empty' "$GATE_DIR/main.json")
          test "$CURRENT_MAIN" = "$UPSTREAM_SHA"
          echo "CURRENT_MAIN_SHA=$CURRENT_MAIN" >> "$GITHUB_ENV"

      - name: Restore and verify exact Assurance receipt and causal upstream tuple
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}" \
            > "${GATE_DIR}/upstream-assurance-run.json"
          jq -e \
            --argjson run "${UPSTREAM_RUN_ID}" --argjson attempt "${UPSTREAM_RUN_ATTEMPT}" \
            --arg sha "${UPSTREAM_SHA}" --arg repo "${GITHUB_REPOSITORY}" \
            '.id==$run and .run_attempt==$attempt and .name=="KIDULTS Platform Continuous Assurance V1" and
             .repository.full_name==$repo and .head_repository.full_name==$repo and .head_branch=="main" and
             .head_sha==$sha and .status=="completed" and .conclusion=="success"' \
            "${GATE_DIR}/upstream-assurance-run.json" >/dev/null
          ASSURANCE_ARTIFACT_NAME="kidults-continuous-assurance-${UPSTREAM_SHA}-${UPSTREAM_RUN_ID}-${UPSTREAM_RUN_ATTEMPT}"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/artifacts?per_page=100" \
            > "${GATE_DIR}/upstream-assurance-artifacts.json"
          ASSURANCE_ARTIFACT_COUNT=$(jq --arg name "$ASSURANCE_ARTIFACT_NAME" --argjson run "$UPSTREAM_RUN_ID" --arg sha "$UPSTREAM_SHA" \
            '[.artifacts[] | select(.name==$name and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' \
            "$GATE_DIR/upstream-assurance-artifacts.json")
          test "$ASSURANCE_ARTIFACT_COUNT" -eq 1
          ASSURANCE_ARTIFACT_ID=$(jq -r --arg name "$ASSURANCE_ARTIFACT_NAME" \
            '[.artifacts[] | select(.name==$name and .expired==false)][0].id' "$GATE_DIR/upstream-assurance-artifacts.json")
          ASSURANCE_ARTIFACT_DIGEST=$(jq -r --arg name "$ASSURANCE_ARTIFACT_NAME" \
            '[.artifacts[] | select(.name==$name and .expired==false)][0].digest // empty' "$GATE_DIR/upstream-assurance-artifacts.json")
          [[ "$ASSURANCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ASSURANCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSURANCE_ARTIFACT_ID}/zip" \
            > "${GATE_DIR}/upstream-assurance.zip"
          python3 scripts/kidults/kpmo/read-sentinel-artifact-v1.py "$ASSURANCE_ARTIFACT_DIGEST" \
            < "$GATE_DIR/upstream-assurance.zip" > "$GATE_DIR/upstream-assurance-packet.json"
          jq -e '[.members[] | select((.name|split("/")|last)=="audit-receipt.json")] | length==1' \
            "$GATE_DIR/upstream-assurance-packet.json" >/dev/null
          jq -r '[.members[] | select((.name|split("/")|last)=="audit-receipt.json")][0].text' \
            "$GATE_DIR/upstream-assurance-packet.json" > "$GATE_DIR/upstream-assurance-receipt.json"
          jq -e \
            --arg run "$UPSTREAM_RUN_ID" --arg attempt "$UPSTREAM_RUN_ATTEMPT" --arg sha "$UPSTREAM_SHA" \
            '.receipt_type=="KIDULTS_PLATFORM_CONTINUOUS_ASSURANCE" and
             .source.expected_sha==$sha and .source.actual_sha==$sha and .source.sha==$sha and .source.match==true and
             (.execution.workflow_run_id|tostring)==$run and (.execution.workflow_run_attempt|tostring)==$attempt and
             .execution.trigger=="workflow_run" and .states.internal_control_state=="VERIFIED_PASS" and
             .states.promotion_eligible==false and .states.release_state=="HOLD" and
             (.receipt_digest|test("^sha256:[0-9a-f]{64}$"))' \
            "$GATE_DIR/upstream-assurance-receipt.json" >/dev/null
          ACTUAL_UPSTREAM_NAME=$(jq -r '.execution.upstream.workflow_name // empty' "$GATE_DIR/upstream-assurance-receipt.json")
          if [ "$ACTUAL_UPSTREAM_NAME" = "KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1" ]; then
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$UPSTREAM_SHA" \
              '.execution.upstream.repository==$repo and .execution.upstream.head_sha==$sha and
               .execution.upstream.conclusion=="success" and
               (.execution.upstream.run_id|tostring|test("^[1-9][0-9]*$")) and
               (.execution.upstream.run_attempt|tostring|test("^[1-9][0-9]*$"))' \
              "$GATE_DIR/upstream-assurance-receipt.json" >/dev/null
            {
              echo "CAUSAL_ELIGIBLE=true"
              echo "PRODUCER_HEALTH_RUN_ID=$(jq -r '.execution.upstream.run_id' "$GATE_DIR/upstream-assurance-receipt.json")"
              echo "PRODUCER_HEALTH_RUN_ATTEMPT=$(jq -r '.execution.upstream.run_attempt' "$GATE_DIR/upstream-assurance-receipt.json")"
              echo "PRODUCER_HEALTH_EVENT=$(jq -r '.execution.upstream.workflow_event' "$GATE_DIR/upstream-assurance-receipt.json")"
              echo "PRODUCER_HEALTH_CONCLUSION=$(jq -r '.execution.upstream.conclusion' "$GATE_DIR/upstream-assurance-receipt.json")"
            } >> "$GITHUB_ENV"
          else
            echo "CAUSAL_ELIGIBLE=false" >> "$GITHUB_ENV"
          fi

      - name: Restore causally bound exact-main Sentinel producer-health receipt
        if: env.CAUSAL_ELIGIBLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_HEALTH_RUN_ID}" \
            > "${GATE_DIR}/selected-sentinel-run.json"
          jq -e \
            --argjson run "$PRODUCER_HEALTH_RUN_ID" --argjson attempt "$PRODUCER_HEALTH_RUN_ATTEMPT" \
            --arg sha "$UPSTREAM_SHA" --arg repo "$GITHUB_REPOSITORY" --arg event "$PRODUCER_HEALTH_EVENT" \
            '.id==$run and .run_attempt==$attempt and
             .name=="KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1" and
             .repository.full_name==$repo and .head_repository.full_name==$repo and .head_branch=="main" and
             .head_sha==$sha and .event==$event and .status=="completed" and .conclusion=="success"' \
            "$GATE_DIR/selected-sentinel-run.json" >/dev/null
          ARTIFACT_NAME="kpmo-continuous-assurance-sentinel-health-v1-${UPSTREAM_SHA}-${PRODUCER_HEALTH_RUN_ID}-${PRODUCER_HEALTH_RUN_ATTEMPT}"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_HEALTH_RUN_ID}/artifacts?per_page=100" \
            > "${GATE_DIR}/sentinel-artifacts.json"
          ARTIFACT_COUNT=$(jq --arg name "$ARTIFACT_NAME" --argjson run "$PRODUCER_HEALTH_RUN_ID" --arg sha "$UPSTREAM_SHA" \
            '[.artifacts[] | select(.name==$name and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' \
            "$GATE_DIR/sentinel-artifacts.json")
          test "$ARTIFACT_COUNT" -eq 1
          ARTIFACT_ID=$(jq -r --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name==$name and .expired==false)][0].id' "$GATE_DIR/sentinel-artifacts.json")
          ARTIFACT_DIGEST=$(jq -r --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name==$name and .expired==false)][0].digest // empty' "$GATE_DIR/sentinel-artifacts.json")
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${GATE_DIR}/upstream-health.zip"
          python3 scripts/kidults/kpmo/read-sentinel-artifact-v1.py "$ARTIFACT_DIGEST" \
            < "$GATE_DIR/upstream-health.zip" > "$GATE_DIR/upstream-health-packet.json"
          jq -e '[.members[] | select((.name|split("/")|last)=="kpmo-continuous-assurance-sentinel-health-v1.json")] | length==1' \
            "$GATE_DIR/upstream-health-packet.json" >/dev/null
          jq -r '[.members[] | select((.name|split("/")|last)=="kpmo-continuous-assurance-sentinel-health-v1.json")][0].text' \
            "$GATE_DIR/upstream-health-packet.json" > "$GATE_DIR/kpmo-continuous-assurance-sentinel-health-v1.json"

      - name: Seal exact successful Assurance authority-gate receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const stable=(value)=>Array.isArray(value)?'['+value.map(stable).join(',')+']':value&&typeof value==='object'?'{'+Object.keys(value).sort().map((key)=>JSON.stringify(key)+':'+stable(value[key])).join(',')+'}':JSON.stringify(value);
          const sha256=(value)=>'sha256:'+crypto.createHash('sha256').update(stable(value)).digest('hex');
          const gatePath=process.env.GATE_DIR+'/kpmo-continuous-assurance-success-authority-gate-v1.json';
          const assurancePath=process.env.GATE_DIR+'/upstream-assurance-receipt.json';
          const healthPath=process.env.GATE_DIR+'/kpmo-continuous-assurance-sentinel-health-v1.json';
          const prior=JSON.parse(fs.readFileSync(gatePath,'utf8'));
          let assurance=null,health=null;
          try { assurance=JSON.parse(fs.readFileSync(assurancePath,'utf8')); } catch {}
          try { health=JSON.parse(fs.readFileSync(healthPath,'utf8')); } catch {}
          const digestOf=(receipt)=>{
            if(!receipt) return null;
            const unsigned=structuredClone(receipt); delete unsigned.receipt_digest;
            const withoutObservation=structuredClone(unsigned); delete withoutObservation.observed_at;
            const valid=/^sha256:[0-9a-f]{64}$/.test(receipt.receipt_digest||'') &&
              (receipt.receipt_digest===sha256(unsigned) || receipt.receipt_digest===sha256(withoutObservation));
            return valid?receipt.receipt_digest:null;
          };
          const assuranceDigest=digestOf(assurance);
          const healthDigest=digestOf(health);
          const exactSource=process.env.CURRENT_MAIN_SHA===process.env.UPSTREAM_SHA && /^[0-9a-f]{40}$/.test(process.env.UPSTREAM_SHA||'');
          const upstreamAssurancePass=process.env.UPSTREAM_CONCLUSION==='success' &&
            process.env.UPSTREAM_WORKFLOW_NAME==='KIDULTS Platform Continuous Assurance V1' &&
            assurance?.receipt_type==='KIDULTS_PLATFORM_CONTINUOUS_ASSURANCE' &&
            String(assurance?.execution?.workflow_run_id)===process.env.UPSTREAM_RUN_ID &&
            String(assurance?.execution?.workflow_run_attempt)===process.env.UPSTREAM_RUN_ATTEMPT &&
            assurance?.source?.sha===process.env.UPSTREAM_SHA && assuranceDigest;
          const actual=assurance?.execution?.upstream||null;
          const eligible=process.env.CAUSAL_ELIGIBLE==='true' &&
            actual?.workflow_name==='KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1';
          const causalTuplePass=eligible &&
            String(actual?.run_id)===process.env.PRODUCER_HEALTH_RUN_ID &&
            String(actual?.run_attempt)===process.env.PRODUCER_HEALTH_RUN_ATTEMPT &&
            actual?.head_sha===process.env.UPSTREAM_SHA &&
            actual?.repository===process.env.GITHUB_REPOSITORY &&
            actual?.conclusion==='success';
          const healthPass=causalTuplePass &&
            health?.receipt_id==='kpmo-continuous-assurance-sentinel-health-v1' &&
            health?.state==='VERIFIED_PASS' && health?.source_sha===process.env.UPSTREAM_SHA &&
            health?.coverage_scope==='CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM' &&
            health?.semantic_content_verified===true && health?.runtime_health_proven===false &&
            health?.causal_reserve_binding?.required===true && health?.causal_reserve_binding?.state==='VERIFIED_PASS' &&
            health?.causal_reserve_binding?.triggering_run_id===health?.causal_reserve_binding?.selected_run_id &&
            health?.causal_reserve_binding?.triggering_run_attempt===health?.causal_reserve_binding?.selected_run_attempt &&
            health?.whole_platform_authority===false && health?.promotion_eligible===false && healthDigest;
          const pass=Boolean(exactSource&&upstreamAssurancePass&&healthPass);
          const hold=Boolean(exactSource&&upstreamAssurancePass&&!eligible);
          const base={
            ...prior,
            state:pass?'VERIFIED_PASS':hold?'VERIFIED_HOLD':'VERIFIED_FAIL',
            failure_class:pass?null:hold?'ASSURANCE_ACTUAL_UPSTREAM_NOT_SENTINEL':'CAUSAL_SENTINEL_OR_ASSURANCE_NOT_VERIFIED',
            current_protected_main_sha:process.env.CURRENT_MAIN_SHA||null,
            assurance_receipt_digest:assuranceDigest,
            assurance_actual_upstream:actual,
            producer_health_eligible:eligible,
            producer_health_run_id:causalTuplePass?Number(process.env.PRODUCER_HEALTH_RUN_ID):null,
            producer_health_run_attempt:causalTuplePass?Number(process.env.PRODUCER_HEALTH_RUN_ATTEMPT):null,
            producer_health_event:causalTuplePass?process.env.PRODUCER_HEALTH_EVENT:null,
            producer_health_receipt_digest:healthDigest,
            producer_health_conclusion:causalTuplePass?process.env.PRODUCER_HEALTH_CONCLUSION:null,
            producer_health_state:health?.state||'UNAVAILABLE',
            causal_reserve_binding:health?.causal_reserve_binding||null
          };
          delete base.receipt_digest;
          const receipt={...base,receipt_digest:sha256(base)};
          fs.writeFileSync(gatePath,JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Upload exact-run successful Assurance authority-gate packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpmo-continuous-assurance-success-authority-gate-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ env.GATE_DIR }}/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce successful Assurance authority gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GATE_DIR/kpmo-continuous-assurance-success-authority-gate-v1.json"
          jq -e '
            .receipt_id=="kpmo-continuous-assurance-success-authority-gate-v1" and
            .repository==env.GITHUB_REPOSITORY and
            .upstream_observation.run_id==(env.UPSTREAM_RUN_ID|tonumber) and
            .upstream_observation.run_attempt==(env.UPSTREAM_RUN_ATTEMPT|tonumber) and
            .upstream_observation.head_sha==env.UPSTREAM_SHA and
            .upstream_observation.workflow_name==env.UPSTREAM_WORKFLOW_NAME and
            .current_protected_main_sha==env.UPSTREAM_SHA and
            (.assurance_receipt_digest|test("^sha256:[0-9a-f]{64}$")) and
            .coverage_scope=="CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM" and
            .whole_platform_authority==false and .promotion_eligible==false and
            .empirical_authority==false and .provider_authority==false and .database_authority==false and
            .empirical_delta==0 and .public=="HOLD" and .production=="HOLD" and .g5=="HOLD" and
            (
              (.state=="VERIFIED_PASS" and .producer_health_eligible==true and
               .assurance_actual_upstream.workflow_name=="KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1" and
               .producer_health_run_id==(.assurance_actual_upstream.run_id|tonumber) and
               .producer_health_run_attempt==(.assurance_actual_upstream.run_attempt|tonumber) and
               .assurance_actual_upstream.head_sha==env.UPSTREAM_SHA and
               .assurance_actual_upstream.repository==env.GITHUB_REPOSITORY and
               .assurance_actual_upstream.conclusion=="success" and
               .producer_health_conclusion=="success" and .producer_health_state=="VERIFIED_PASS" and
               .causal_reserve_binding.state=="VERIFIED_PASS" and
               (.producer_health_receipt_digest|test("^sha256:[0-9a-f]{64}$")))
              or
              (.state=="VERIFIED_HOLD" and .producer_health_eligible==false and
               .assurance_actual_upstream.workflow_name!="KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1" and
               .producer_health_run_id==null and .producer_health_receipt_digest==null)
            )
          ' "$GATE_DIR/kpmo-continuous-assurance-success-authority-gate-v1.json" >/dev/null

  non-authorizing-success-observation:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.name == 'KIDULTS Platform Continuous Assurance V1' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RECEIPT_DIR: /tmp/kpmo-success-assurance-non-authorizing-observation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Emit exact non-authorizing successful Assurance observation receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$CURRENT_MAIN_SHA" != ""
          export CURRENT_MAIN_SHA
          mkdir -p "$RECEIPT_DIR"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const policy=JSON.parse(fs.readFileSync('coordination/kidults/kpmo/platform-continuous-assurance-v1.json','utf8'));
          const gate=policy.successful_assurance_authority_gate;
          const event=process.env.UPSTREAM_EVENT;
          if (!gate.non_authorizing_observation_events.includes(event)) throw new Error('SUCCESSFUL_ASSURANCE_EVENT_NOT_CLASSIFIED_NON_AUTHORIZING');
          if (gate.producer_health_eligible_upstream_events.includes(event)) throw new Error('SUCCESSFUL_ASSURANCE_EVENT_CLASS_OVERLAP');
          const stable=(value)=>Array.isArray(value)?'['+value.map(stable).join(',')+']':value&&typeof value==='object'?'{'+Object.keys(value).sort().map((key)=>JSON.stringify(key)+':'+stable(value[key])).join(',')+'}':JSON.stringify(value);
          const sha256=(value)=>'sha256:'+crypto.createHash('sha256').update(stable(value)).digest('hex');
          const base={
            receipt_id:'kpmo-continuous-assurance-non-authorizing-observation-v1',
            version:'1.0.0',state:'VERIFIED_HOLD',
            disposition:'NON_AUTHORIZING_EVENT_CLASS',
            reason:'UPSTREAM_EVENT_NOT_PRODUCER_HEALTH_ELIGIBLE',
            repository:process.env.GITHUB_REPOSITORY,
            upstream_observation:{
              workflow_name:process.env.UPSTREAM_WORKFLOW_NAME,
              run_id:Number(process.env.UPSTREAM_RUN_ID),
              run_attempt:Number(process.env.UPSTREAM_RUN_ATTEMPT),
              head_sha:process.env.UPSTREAM_SHA,
              head_branch:process.env.UPSTREAM_BRANCH,
              event,
              conclusion:process.env.UPSTREAM_CONCLUSION
            },
            current_protected_main_sha:process.env.CURRENT_MAIN_SHA,
            producer_health_eligible:false,
            producer_health_receipt_required:false,
            coverage_scope:'CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM',
            whole_platform_authority:false,
            promotion_eligible:false,
            empirical_authority:false,
            provider_authority:false,
            database_authority:false,
            empirical_delta:0,
            public:'HOLD',production:'HOLD',g5:'HOLD',
            evaluated_at:new Date().toISOString()
          };
          const receipt={...base,receipt_digest:sha256(base)};
          fs.writeFileSync(process.env.RECEIPT_DIR+'/kpmo-continuous-assurance-non-authorizing-observation-v1.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Upload exact non-authorizing successful Assurance observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpmo-continuous-assurance-non-authorizing-observation-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce non-authorizing observation boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$RECEIPT_DIR/kpmo-continuous-assurance-non-authorizing-observation-v1.json"
          test -s "$RECEIPT"
          jq -e '
            .receipt_id=="kpmo-continuous-assurance-non-authorizing-observation-v1" and
            .repository==env.GITHUB_REPOSITORY and
            .upstream_observation.run_id==(env.UPSTREAM_RUN_ID|tonumber) and
            .upstream_observation.run_attempt==(env.UPSTREAM_RUN_ATTEMPT|tonumber) and
            .upstream_observation.head_sha==env.UPSTREAM_SHA and
            .upstream_observation.event==env.UPSTREAM_EVENT and
            .upstream_observation.conclusion=="success" and
            (.upstream_observation.event=="pull_request" or .upstream_observation.event=="push" or .upstream_observation.event=="schedule" or .upstream_observation.event=="workflow_dispatch") and
            (.current_protected_main_sha|test("^[0-9a-f]{40}$")) and
            .producer_health_eligible==false and
            .producer_health_receipt_required==false and
            .coverage_scope=="CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM" and
            .whole_platform_authority==false and
            .promotion_eligible==false and
            .empirical_authority==false and
            .provider_authority==false and
            .database_authority==false and
            .empirical_delta==0 and
            .public=="HOLD" and .production=="HOLD" and .g5=="HOLD" and
            (.receipt_digest|test("^sha256:[0-9a-f]{64}$")) and
            .state=="VERIFIED_HOLD"
          ' "$RECEIPT" >/dev/null

