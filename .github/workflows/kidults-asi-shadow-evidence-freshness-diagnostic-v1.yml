      - ".github/workflows/kidults-candidate-evidence-handoff-preflight-r2.yml"
      - ".github/workflows/kidults-autonomous-runtime.yml"
      - "package.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/kidults-asi-shadow-evidence-freshness-diagnostic-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  diagnose-shadow-evidence-freshness:
    name: Diagnose SHADOW Evidence Freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.19.0"

      - name: Install root validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install autonomous intelligence dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Enforce required-input trigger coverage
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const builder = fs.readFileSync("scripts/kidults/source-intelligence/build-asi-shadow-operating-evidence-v1.mjs", "utf8");
          const workflow = fs.readFileSync(".github/workflows/kidults-asi-shadow-evidence-freshness-diagnostic-v1.yml", "utf8");
          const start = builder.indexOf("const requiredCanonicalCodeInputs");
          const end = builder.indexOf("const requiredApprovedCalibrationStrata");
          if (start < 0 || end <= start) throw new Error("REQUIRED_INPUT_REGISTRY_NOT_FOUND");
          const required = [...builder.slice(start, end).matchAll(/:\\s*"([^"]+)"/g)].map(match => match[1]);
          const pullStart = workflow.indexOf("  pull_request:");
          const dispatchStart = workflow.indexOf("\n  workflow_dispatch:");
          if (pullStart < 0 || dispatchStart <= pullStart) throw new Error("PULL_REQUEST_TRIGGER_NOT_FOUND");
          const patterns = [...workflow.slice(pullStart, dispatchStart).matchAll(/-\\s+"([^"]+)"/g)].map(match => match[1]);
          const covered = (pattern, input) => pattern.endsWith("/**")
            ? input.startsWith(pattern.slice(0, -3))
            : pattern === input;
          const missing = required.filter(input => !patterns.some(pattern => covered(pattern, input)));
          for (const negative of [
            "package.json",
            "services/kidults-autonomous-intelligence/package.json",
            "scripts/kidults/poc/validate-candidate-evidence-handoff-r2.mjs"
          ]) {
            if (!required.includes(negative) || missing.includes(negative)) {
              throw new Error(`REQUIRED_NEGATIVE_TRIGGER_UNCOVERED:${negative}`);
            }
          }
          if (missing.length > 0) throw new Error(`REQUIRED_INPUT_TRIGGER_GAP:${missing.join(",")}`);
          console.log(JSON.stringify({ required_inputs: required.length, trigger_patterns: patterns.length, missing: 0 }));
          NODE

      - name: Build exact-run SHADOW evidence
        run: |
          node scripts/kidults/source-intelligence/build-asi-shadow-operating-evidence-v1.mjs \
            --output /tmp/asi-shadow-operating-evidence-generated.json --write

      - name: Compare committed and generated evidence
        id: freshness
        continue-on-error: true
        run: |
          set -euo pipefail
          cmp artifacts/agci-os/asi-shadow-operating-evidence-v1.json \
              /tmp/asi-shadow-operating-evidence-generated.json

      - name: Emit bounded freshness receipt
        if: always()
        run: |
          set -euo pipefail
          COMMITTED_SHA="MISSING"
          GENERATED_SHA="MISSING"
          if [[ -f artifacts/agci-os/asi-shadow-operating-evidence-v1.json ]]; then
            COMMITTED_SHA="$(sha256sum artifacts/agci-os/asi-shadow-operating-evidence-v1.json | awk '{print $1}')"
          fi
          if [[ -f /tmp/asi-shadow-operating-evidence-generated.json ]]; then
            GENERATED_SHA="$(sha256sum /tmp/asi-shadow-operating-evidence-generated.json | awk '{print $1}')"
          fi
          MISMATCH_JSON="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const read = file => fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : null;
          const committed = read("artifacts/agci-os/asi-shadow-operating-evidence-v1.json");
          const generated = read("/tmp/asi-shadow-operating-evidence-generated.json");
          const left = committed?.canonical_code_inputs ?? {};
          const right = generated?.canonical_code_inputs ?? {};
          const keys = [...new Set([...Object.keys(left), ...Object.keys(right)])].sort();
          const mismatches = keys.filter(key =>
            left[key]?.path !== right[key]?.path ||
            left[key]?.sha256 !== right[key]?.sha256 ||
            left[key]?.byte_count !== right[key]?.byte_count
          ).map(key => right[key]?.path ?? left[key]?.path ?? key);
          console.log(JSON.stringify(mismatches));
          NODE
          )"
          mkdir -p /tmp/shadow-freshness-receipt
          cat > /tmp/shadow-freshness-receipt/receipt.json <<JSON
          {
            "schema": "KIDULTS_ASI_SHADOW_EVIDENCE_FRESHNESS_DIAGNOSTIC_V1",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "execution_sha": "${GITHUB_SHA}",
            "pr_head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "pr_base_sha": "${{ github.event.pull_request.base.sha || github.sha }}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "event": "${GITHUB_EVENT_NAME}",
            "committed_sha256": "${COMMITTED_SHA}",
            "generated_sha256": "${GENERATED_SHA}",
            "comparison_outcome": "${{ steps.freshness.outcome }}",
            "mismatched_canonical_code_inputs": ${MISMATCH_JSON},
            "control_state": "HOLD",
            "promotion_eligible": false,
            "production_public_g5": "HOLD"
          }
          JSON

      - name: Retain exact-run generated evidence and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-shadow-evidence-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/asi-shadow-operating-evidence-generated.json
            /tmp/shadow-freshness-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fail-closed stale-evidence verdict
        if: always()
        run: |
          if [[ "${{ steps.freshness.outcome }}" != "success" ]]; then
            echo "SHADOW committed evidence is stale or missing; exact-run diagnostic artifact retained." >&2
            exit 1
          fi
