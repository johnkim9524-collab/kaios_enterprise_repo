      - ".github/workflows/kidults-er-r7b-serialized-reference-real.yml"
      - ".github/workflows/kidults-er-r7c-variant-release-real.yml"
      - ".github/workflows/kidults-er-r7e-serialized-cross-authority.yml"
      - ".github/workflows/kidults-er-r7f-vehicle-minimums.yml"
      - ".github/workflows/kidults-er-r7g-variant-minimums.yml"
      - ".github/workflows/kidults-er-r7h-pressing-minimums.yml"
      - ".github/workflows/kidults-er-r7i-provenance-minimums.yml"
      - ".github/workflows/kidults-er-r7j-designer-maker-minimums.yml"
