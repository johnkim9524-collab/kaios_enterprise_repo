name: KIDULTS ER Provenance Residual Capacity R1
on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/probe-provenance-residual-capacity-r1.mjs'
      - 'coordination/kidults/entity-resolution/provenance-residual-capacity-r1.json'
      - '.github/workflows/kidults-er-provenance-residual-capacity-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure-residual-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure live Getty residual provenance capacity
        run: node scripts/kidults/entity-resolution/probe-provenance-residual-capacity-r1.mjs /tmp/provenance-residual-capacity-r1.json
      - name: Enforce fail-closed candidate boundary
        run: |
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/provenance-residual-capacity-r1.json','utf8'));
          if(x.stratum_id!=='er-stratum-provenance-unique-object'||x.rights_state!=='ALLOW') throw new Error('STRATUM_OR_RIGHTS');
          if(x.labels_present!==false||x.reviewers_assigned!==0||x.empirical_cases_created!==0||x.track_b!=='NOT_STARTED') throw new Error('OVERCLAIM');
          if(x.production!=='HOLD'||x.public_release!=='HOLD') throw new Error('RELEASE');
          if(x.metrics.ambiguous_capacity>50||x.metrics.hard_negative_capacity>20) throw new Error('CAPACITY_OVER_TARGET');
          console.log(JSON.stringify({status:x.status,metrics:x.metrics,blockers:x.blockers,production:'HOLD'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-er-provenance-residual-capacity-r1
          path: /tmp/provenance-residual-capacity-r1.json
          retention-days: 14
