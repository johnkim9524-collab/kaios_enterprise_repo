name: KIDULTS Cloudflare Credential Identity Preflight V1 Closure Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-cloudflare-credential-identity-preflight-v1.yml'
      - '.github/workflows/kidults-cloudflare-credential-identity-preflight-validation-v1.yml'
      - 'coordination/kidults/governance/cloudflare-credential-identity-preflight-authorization-20260901-v1.json'
      - 'coordination/kidults/governance/cloudflare-workers-shadow-credential-identity-preflight-v1.json'
      - 'coordination/kidults/governance/cloudflare-credential-identity-preflight-v2-spec-v1.json'
      - 'coordination/kidults/governance/receipts/CF-CREDENTIAL-IDENTITY-PREFLIGHT-20260901-01.md'
      - 'coordination/kidults/governance/receipts/CF-CREDENTIAL-IDENTITY-PREFLIGHT-20260901-01-terminal.json'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
      - 'scripts/kidults/kpmo/extract-github-comment-body-byte-exact-v1.mjs'
      - 'scripts/kidults/kpmo/validate-cloudflare-credential-identity-preflight-v1.mjs'
      - 'tests/kidults/kpmo/github-comment-body-byte-exact-v1.test.mjs'
      - 'scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-credential-preflight-v1-closure-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact validation source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up governed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate v1 preauthorization failure truth and zero-authority tombstone
        run: node scripts/kidults/kpmo/validate-cloudflare-credential-identity-preflight-v1.mjs

      - name: Regress byte-exact GitHub comment body extraction
        run: node tests/kidults/kpmo/github-comment-body-byte-exact-v1.test.mjs

      - name: Validate complete secret-bearing workflow registry
        run: node scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs --enforce-registry
