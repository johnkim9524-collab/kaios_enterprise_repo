name: KIDULTS ER R7D Designer Maker Real

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/extend-er-r7c-designer-maker-r7d.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-r7b-variant-release-r7c.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-r7a-serialized-reference-r7b.mjs'
      - 'scripts/kidults/entity-resolution/promote-er-r6-to-approved-strata-r7a.mjs'
      - 'coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json'
      - 'scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs'
      - '.github/workflows/kidults-er-r7d-designer-maker-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-r7d:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build R1-R6
        run: |
          node scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs /tmp/er-r1.json
          node scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs /tmp/er-r1.json /tmp/er-r2.json
          node scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs /tmp/er-r2.json /tmp/er-r3.json
          node scripts/kidults/entity-resolution/extend-er-dataset-cross-market-alias-r5.mjs /tmp/er-r3.json /tmp/er-r5.json
          node scripts/kidults/entity-resolution/extend-er-dataset-ambiguous-review-r6.mjs /tmp/er-r5.json /tmp/er-r6.json
      - name: Build R7A-R7C
        run: |
          node scripts/kidults/entity-resolution/promote-er-r6-to-approved-strata-r7a.mjs /tmp/er-r6.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json /tmp/er-r7a.json
          node scripts/kidults/entity-resolution/extend-er-r7a-serialized-reference-r7b.mjs /tmp/er-r7a.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json /tmp/er-r7b.json
          node scripts/kidults/entity-resolution/extend-er-r7b-variant-release-r7c.mjs /tmp/er-r7b.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json /tmp/er-r7c.json
      - name: Add designer-maker edition R7D
        run: |
          node scripts/kidults/entity-resolution/extend-er-r7c-designer-maker-r7d.mjs /tmp/er-r7c.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json /tmp/er-r7d.json
      - name: Run benchmark
        run: |
          node scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs /tmp/er-r7d.json /tmp/er-r7d-results.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json
      - name: Verify designer-maker stratum complete and 6-of-7 represented
        run: |
          node - <<'NODE'
          const d=require('/tmp/er-r7d.json'); const r=require('/tmp/er-r7d-results.json');
          const id='er-stratum-designer-maker-edition'; const rows=d.cases.filter(x=>x.scope_id===id);
          const classes=new Set(rows.map(x=>x.case_class)), boundaries=new Set(rows.map(x=>x.identity_boundary));
          const required=new Set(d.required_scope_ids), represented=new Set(d.cases.map(x=>x.scope_id).filter(x=>required.has(x)));
          if(represented.size!==6) process.exit(1);
          for(const c of ['SAME_OBJECT_NORMALIZATION','SAME_DESIGN_DIFFERENT_OBJECT','HARD_NEGATIVE']) if(!classes.has(c)) process.exit(1);
          for(const b of ['SOURCE_RECORD','CANONICAL_DESIGN','PHYSICAL_OBJECT']) if(!boundaries.has(b)) process.exit(1);
          if(r.strata_manifest_binding.binding_valid!==true) process.exit(1);
          if(r.coverage.per_stratum[id].complete!==true) process.exit(1);
          if(r.coverage.per_stratum_requirements_complete!==false) process.exit(1);
          if(r.coverage.scope_stratification_complete!==false) process.exit(1);
          if(r.accuracy!==1||r.blind_accuracy!==1||r.critical_false_auto_merge!==0||r.blind_critical_false_auto_merge!==0) process.exit(1);
          if(r.coverage.provenance_coverage!==1||r.coverage.rights_coverage!==1) process.exit(1);
          if(r.promotion_gate.promotion_eligible_before_track_b!==false) process.exit(1);
          console.log('R7D PASS: DESIGNER_MAKER_EDITION satisfies all declared minimums; 6/7 strata represented; final promotion remains blocked.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-er-r7d-designer-maker-real
          path: |
            /tmp/er-r7d.json
            /tmp/er-r7d-results.json
          if-no-files-found: error
          retention-days: 30
