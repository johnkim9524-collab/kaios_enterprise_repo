name: KIDULTS ASI SHADOW Regenerate Diagnostic R1

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/extend-er-r7h-provenance-minimums-r7i.mjs'
      - '.github/workflows/kidults-asi-shadow-regenerate-diagnostic-r1.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install autonomous intelligence dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate deterministic SHADOW evidence exactly
        run: node scripts/kidults/source-intelligence/build-asi-shadow-operating-evidence-v1.mjs --output artifacts/agci-os/asi-shadow-operating-evidence-v1.json --write
      - name: Commit exact sealed evidence refresh and remove temporary diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/agci-os/asi-shadow-operating-evidence-v1.json
          git rm .github/workflows/kidults-asi-shadow-regenerate-diagnostic-r1.yml
          git commit -m 'KIDULTS: refresh deterministic ASI evidence after R7I stabilization'
          git push origin HEAD:${{ github.head_ref }}
