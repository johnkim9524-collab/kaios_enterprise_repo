name: KIDULTS ASI SHADOW Regenerate Diagnostic R1

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/extend-er-r7h-provenance-minimums-r7i.mjs'
      - '.github/workflows/kidults-asi-shadow-regenerate-diagnostic-r1.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install autonomous intelligence dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate deterministic SHADOW evidence without altering repository
        run: node scripts/kidults/source-intelligence/build-asi-shadow-operating-evidence-v1.mjs --output /tmp/asi-shadow-operating-evidence-v1.json --write
      - name: Upload regenerated evidence for exact refresh
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-shadow-regenerated-r1
          path: /tmp/asi-shadow-operating-evidence-v1.json
          if-no-files-found: error
          retention-days: 1
