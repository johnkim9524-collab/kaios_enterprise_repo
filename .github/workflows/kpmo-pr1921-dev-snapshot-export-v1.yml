name: KPMO PR1921 Development Snapshot Export V1
run-name: KPMO PR1921 development snapshot / ${{ github.sha }}

on:
  push:
    branches:
      - 'kpmo/p0-track-a-current-sold-jd-holistic-v1'

permissions:
  contents: read

concurrency:
  group: kpmo-pr1921-dev-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export-source-snapshot:
    if: github.repository == 'johnkim9524-collab/kaios_enterprise_repo' && github.actor == 'johnkim9524-collab'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Package exact repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/kpmo-pr1921-dev-snapshot-export-v1.yml -czf /tmp/kpmo-pr1921-dev-source.tgz .
          sha256sum /tmp/kpmo-pr1921-dev-source.tgz | tee /tmp/kpmo-pr1921-dev-source.sha256
      - name: Retain bounded development snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kpmo-pr1921-dev-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/kpmo-pr1921-dev-source.tgz
            /tmp/kpmo-pr1921-dev-source.sha256
          retention-days: 1
          if-no-files-found: error
