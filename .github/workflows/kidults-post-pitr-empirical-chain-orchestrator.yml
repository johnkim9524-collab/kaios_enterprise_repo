name: KIDULTS Post-PITR Empirical Chain Orchestrator

on:
  workflow_run:
    workflows:
      - P0 PostgreSQL Target-Time Restore Verification
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-post-pitr-empirical-chain
  cancel-in-progress: true

jobs:
  evaluate-empirical-chain:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Prove exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12.14'
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Re-evaluate exact Candidate/Evidence → Track B → Projection chain
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kidults/integration/validate-live-assessment-audit-hardening-v1.py
          python scripts/kidults/integration/evaluate-exact-pair-arrival-v1.py artifacts/post-pitr-chain/arrival-state.json
          python scripts/kidults/integration/build-live-chain-audit-v1.py artifacts/post-pitr-chain/arrival-state.json artifacts/post-pitr-chain/audit-chain.json

      - name: Enforce fail-closed release boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('artifacts/post-pitr-chain/arrival-state.json'))
          a=json.load(open('artifacts/post-pitr-chain/audit-chain.json'))
          assert p['result']=='PASS'
          assert p['production']=='HOLD'
          assert p['public_intelligence']=='HOLD'
          assert a['production']=='HOLD'
          assert a['public_intelligence']=='HOLD'
          assert a['raw_provider_payloads'] is False
          assert a['credentials'] is False
          assert a['secrets'] is False
          print('POST_PITR_EMPIRICAL_CHAIN_STATE='+p['state'])
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-post-pitr-empirical-chain-${{ env.SOURCE_SHA }}
          path: artifacts/post-pitr-chain
          if-no-files-found: error
          retention-days: 30
