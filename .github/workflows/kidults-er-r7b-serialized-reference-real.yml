name: KIDULTS ER R7B Serialized Reference Real

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/extend-er-r7a-serialized-reference-r7b.mjs'
      - 'scripts/kidults/entity-resolution/promote-er-r6-to-approved-strata-r7a.mjs'
      - 'coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json'
      - 'scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs'
      - '.github/workflows/kidults-er-r7b-serialized-reference-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-r7b:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build real R1-R6 aggregate
        run: |
          node scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs /tmp/er-r1.json
          node scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs /tmp/er-r1.json /tmp/er-r2.json
          node scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs /tmp/er-r2.json /tmp/er-r3.json
          node scripts/kidults/entity-resolution/extend-er-dataset-cross-market-alias-r5.mjs /tmp/er-r3.json /tmp/er-r5.json
          node scripts/kidults/entity-resolution/extend-er-dataset-ambiguous-review-r6.mjs /tmp/er-r5.json /tmp/er-r6.json
      - name: Build R7A 3-of-7 approved strata
        run: |
          node scripts/kidults/entity-resolution/promote-er-r6-to-approved-strata-r7a.mjs \
            /tmp/er-r6.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json /tmp/er-r7a.json
      - name: Add live serialized-reference evidence R7B
        run: |
          node scripts/kidults/entity-resolution/extend-er-r7a-serialized-reference-r7b.mjs \
            /tmp/er-r7a.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json /tmp/er-r7b.json
      - name: Run benchmark with exact manifest binding
        run: |
          node scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs \
            /tmp/er-r7b.json /tmp/er-r7b-results.json coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json
      - name: Verify serialized real progress and missing cross-market requirement remains fail-closed
        run: |
          node - <<'NODE'
          const d=require('/tmp/er-r7b.json'); const r=require('/tmp/er-r7b-results.json');
          const id='er-stratum-serialized-reference';
          const rows=d.cases.filter(x=>x.scope_id===id);
          const classes=new Set(rows.map(x=>x.case_class)); const boundaries=new Set(rows.map(x=>x.identity_boundary));
          if(!classes.has('SAME_OBJECT_NORMALIZATION')||!classes.has('HARD_NEGATIVE')) process.exit(1);
          if(classes.has('CROSS_MARKET_ALIAS')) process.exit(1);
          if(!boundaries.has('SOURCE_RECORD')||!boundaries.has('PHYSICAL_OBJECT')) process.exit(1);
          if(r.strata_manifest_binding.binding_valid!==true) process.exit(1);
          if(r.coverage.per_stratum[id].case_classes_complete!==false) process.exit(1);
          if(r.coverage.per_stratum[id].boundaries_complete!==true) process.exit(1);
          if(r.coverage.per_stratum_requirements_complete!==false) process.exit(1);
          if(r.accuracy!==1||r.blind_accuracy!==1||r.critical_false_auto_merge!==0||r.blind_critical_false_auto_merge!==0) process.exit(1);
          if(r.coverage.provenance_coverage!==1||r.coverage.rights_coverage!==1) process.exit(1);
          if(r.promotion_gate.promotion_eligible_before_track_b!==false) process.exit(1);
          console.log('R7B PASS: SERIALIZED_REFERENCE has real normalization + hard-negative + both required boundaries; CROSS_MARKET_ALIAS remains explicit blocker.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-er-r7b-serialized-reference-real
          path: |
            /tmp/er-r7b.json
            /tmp/er-r7b-results.json
          if-no-files-found: error
          retention-days: 30
