name: Apply KIDULTS V502 Release Candidate

on:
  push:
    branches:
      - release/v502-portal-rc
    paths:
      - 'scripts/kidults/portal/apply-v502-release-candidate.mjs'
      - 'scripts/kidults/portal/v502-bundle/**'
      - '.github/workflows/kidults-apply-v502.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kidults-v502-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v502-portal-rc
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply integrated V502 file set
        run: node scripts/kidults/portal/apply-v502-release-candidate.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check apps/kidults-enterprise-staging/public/portal/portal.js
          node --check apps/kidults-enterprise-staging/public/portal/detail.js
          node --check apps/kidults-enterprise-staging/public/portal/components/data-store.js
          node --check apps/kidults-enterprise-staging/public/portal/components/interactions.js
          node --check apps/kidults-enterprise-staging/public/portal/components/renderers.js
          node --check scripts/kidults/portal/build-v502-registry-view.mjs
          node --check scripts/kidults/portal/validate-v502-portal.mjs

      - name: Build V502 registry projection
        run: node scripts/kidults/portal/build-v502-registry-view.mjs --write

      - name: Validate coordination and registry
        run: |
          node scripts/kidults/coordination/validate-coordination.mjs
          node scripts/kidults/registry/validate-operational-registry.mjs
          node scripts/kidults/mission-control/validate-mission-control.mjs

      - name: Validate V502 release candidate
        run: node scripts/kidults/portal/validate-v502-portal.mjs

      - name: Check generated diff
        run: git diff --check

      - name: Commit integrated V502 implementation
        run: |
          git config user.name "johnkim9524-collab"
          git config user.email "john.kim9524@gmail.com"
          git add -A
          git commit -m "feat(kidults): implement V502 portal release candidate"
          git push origin HEAD:release/v502-portal-rc
