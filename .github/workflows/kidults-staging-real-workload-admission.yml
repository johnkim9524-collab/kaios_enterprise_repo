name: KIDULTS STAGING Real-Workload Admission

on:
  pull_request:
    paths:
      - 'coordination/kidults/runtime/staging-real-workload-admission-contract-v1.json'
      - 'scripts/kidults/runtime/validate-staging-real-workload-admission-v1.mjs'
      - '.github/workflows/kidults-staging-real-workload-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate fail-closed real-workload admission state
        run: node scripts/kidults/runtime/validate-staging-real-workload-admission-v1.mjs
