name: KIDULTS ASI Throughput Coverage Autobalance Live v1

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-throughput-autobalance-provenance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-autobalance-hourly-producer-freshness-v1.mjs'
      - 'coordination/kidults/governance/management-control-tower-contract-v1.json'
      - '.github/workflows/kidults-asi-throughput-coverage-autobalance-live-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-throughput-coverage-autobalance-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-autobalance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.19.0'}
      - name: Verify exact source and provenance guard
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs
          node scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs --self-test
          node --check scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-throughput-autobalance-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-throughput-autobalance-provenance-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-autobalance-hourly-producer-freshness-v1.mjs
          node scripts/kidults/source-intelligence/validate-autobalance-hourly-producer-freshness-v1.mjs --self-test
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py
          node - <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('.github/workflows/kidults-asi-throughput-coverage-autobalance-live-v1.yml','utf8');
          for(const archive of ['meta','disc']){
            const validation=src.indexOf(`--archive /tmp/${archive}.zip`);
            const extraction=src.indexOf(`unzip -q -o /tmp/${archive}.zip`);
            if(validation<0||extraction<0||validation>extraction)throw new Error(`SAFE_ZIP_PRE_EXTRACTION_GUARD_MISSING:${archive}`);
          }
          const freshness=src.indexOf('validate-autobalance-hourly-producer-freshness-v1.mjs \\\n                --created-at');
          const artifactRead=src.indexOf('/actions/runs/${HOURLY_RUN_ID}/artifacts?per_page=100');
          if(freshness<0||artifactRead<0||freshness>artifactRead)throw new Error('AUTOBALANCE_FRESHNESS_BEFORE_ARTIFACT_READ_GUARD_MISSING');
          for(const marker of ['AUTOBALANCE_HOURLY_RUN_CREATED_AT','AUTOBALANCE_HOURLY_FRESHNESS_OBSERVED_AT','AUTOBALANCE_HOURLY_PRODUCER_AGE_SECONDS','AUTOBALANCE_HOURLY_FRESHNESS_SLO_MINUTES','AUTOBALANCE_HOURLY_FRESHNESS_RECEIPT_DIGEST']){
            if(!src.includes(marker))throw new Error(`AUTOBALANCE_FRESHNESS_PROVENANCE_MARKER_MISSING:${marker}`);
          }
          NODE

      # PRs prove the producer-selection contract and negative mutations above.
      # Live producer consumption is schedule/manual only because a fresh PR base SHA
      # is not guaranteed to have an hourly producer generation yet.
      - name: Restore exact-generation hourly gate artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-gates/raw /tmp/live-gates/canonical discovery-out/raw discovery-out

          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            EXPECTED_PRODUCER_SHA="$PR_BASE_SHA"
            BINDING_MODE="PR_BASE_COMPATIBILITY"
          else
            test "$GITHUB_REF" = "refs/heads/main"
            EXPECTED_PRODUCER_SHA="$CURRENT_SHA"
            BINDING_MODE="EXACT_CURRENT_MAIN"
          fi

          AUTOBALANCE_PRODUCER_WAIT_MAX_ATTEMPTS=10
          AUTOBALANCE_PRODUCER_WAIT_SECONDS=3
          HOURLY_RUN_ID=""
          HOURLY_SOURCE_SHA=""
          HOURLY_RUN_CREATED_AT=""
          HOURLY_RUN_STATE="NONE"
          HOURLY_FRESHNESS_OBSERVED_AT=""
          HOURLY_PRODUCER_AGE_SECONDS=""
          HOURLY_FRESHNESS_SLO_MINUTES=""
          HOURLY_FRESHNESS_RECEIPT_DIGEST=""
          for ATTEMPT in $(seq 1 "$AUTOBALANCE_PRODUCER_WAIT_MAX_ATTEMPTS"); do
            gh api --method GET -H 'Accept: application/vnd.github+json' \
              -f branch=main -f per_page=100 \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml/runs" \
              > /tmp/hourly-runs.json

            LATEST_EXACT_RUN=$(jq -c --arg sha "$EXPECTED_PRODUCER_SHA" \
              '[.workflow_runs[]
                | select(
                    .name=="KIDULTS ASI Global Any-Site Hourly Pooling v2"
                    and .path==".github/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml"
                    and .head_branch=="main"
                    and .head_sha==$sha
                  )
              ] | sort_by(.created_at) | reverse | .[0] // empty' /tmp/hourly-runs.json)

            if [ -n "$LATEST_EXACT_RUN" ]; then
              HOURLY_RUN_ID=$(jq -r '.id // empty' <<<"$LATEST_EXACT_RUN")
              HOURLY_SOURCE_SHA=$(jq -r '.head_sha // empty' <<<"$LATEST_EXACT_RUN")
              HOURLY_RUN_CREATED_AT=$(jq -r '.created_at // empty' <<<"$LATEST_EXACT_RUN")
              HOURLY_RUN_STATUS=$(jq -r '.status // empty' <<<"$LATEST_EXACT_RUN")
              HOURLY_RUN_CONCLUSION=$(jq -r '.conclusion // empty' <<<"$LATEST_EXACT_RUN")
              HOURLY_RUN_STATE="${HOURLY_RUN_STATUS}:${HOURLY_RUN_CONCLUSION:-NONE}"
              test "$HOURLY_SOURCE_SHA" = "$EXPECTED_PRODUCER_SHA"
              if [ "$HOURLY_RUN_STATUS" = "completed" ] && [ "$HOURLY_RUN_CONCLUSION" = "success" ]; then
                HOURLY_FRESHNESS_OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                node scripts/kidults/source-intelligence/validate-autobalance-hourly-producer-freshness-v1.mjs \
                  --created-at "$HOURLY_RUN_CREATED_AT" \
                  --observed-at "$HOURLY_FRESHNESS_OBSERVED_AT" \
                  --source-sha "$HOURLY_SOURCE_SHA" \
                  --run-id "$HOURLY_RUN_ID" \
                  --output /tmp/autobalance-hourly-producer-freshness-v1.json
                HOURLY_PRODUCER_AGE_SECONDS=$(jq -r '.producer_age_seconds' /tmp/autobalance-hourly-producer-freshness-v1.json)
                HOURLY_FRESHNESS_SLO_MINUTES=$(jq -r '.freshness_slo_minutes' /tmp/autobalance-hourly-producer-freshness-v1.json)
                HOURLY_FRESHNESS_RECEIPT_DIGEST="sha256:$(sha256sum /tmp/autobalance-hourly-producer-freshness-v1.json | awk '{print $1}')"
                [[ "$HOURLY_PRODUCER_AGE_SECONDS" =~ ^[0-9]+$ ]]
                test "$HOURLY_FRESHNESS_SLO_MINUTES" = "90"
                [[ "$HOURLY_FRESHNESS_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
                break
              fi
              if [ "$HOURLY_RUN_STATUS" = "completed" ]; then
                echo "::error title=Autobalance producer failed::UPSTREAM_EXACT_GENERATION_TERMINAL_NON_SUCCESS:${HOURLY_RUN_ID}:${HOURLY_RUN_CONCLUSION}" >&2
                exit 1
              fi
            fi

            if [ "$ATTEMPT" -eq "$AUTOBALANCE_PRODUCER_WAIT_MAX_ATTEMPTS" ]; then
              echo "::error title=Autobalance producer not terminal::UPSTREAM_EXACT_GENERATION_NOT_TERMINAL:${EXPECTED_PRODUCER_SHA}:${HOURLY_RUN_STATE}" >&2
              exit 1
            fi
            sleep "$AUTOBALANCE_PRODUCER_WAIT_SECONDS"
          done
          test -n "$HOURLY_RUN_ID"
          test "$HOURLY_SOURCE_SHA" = "$EXPECTED_PRODUCER_SHA"
          test -n "$HOURLY_RUN_CREATED_AT"
          test -s /tmp/autobalance-hourly-producer-freshness-v1.json

          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${HOURLY_RUN_ID}/artifacts?per_page=100" \
            > /tmp/hourly-artifacts.json

          META_RECORD=$(jq -c --argjson run "$HOURLY_RUN_ID" --arg sha "$HOURLY_SOURCE_SHA" \
            '[.artifacts[]
              | select(
                  .name=="kidults-asi-global-any-site-source-pool-v2"
                  and .expired==false
                  and .workflow_run.id==$run
                  and .workflow_run.head_sha==$sha
                )
            ] | if length==1 then .[0] else empty end' /tmp/hourly-artifacts.json)
          DISC_RECORD=$(jq -c --argjson run "$HOURLY_RUN_ID" --arg sha "$HOURLY_SOURCE_SHA" \
            '[.artifacts[]
              | select(
                  .name=="kidults-asi-global-any-site-hourly-cycle-v2"
                  and .expired==false
                  and .workflow_run.id==$run
                  and .workflow_run.head_sha==$sha
                )
            ] | if length==1 then .[0] else empty end' /tmp/hourly-artifacts.json)
          test -n "$META_RECORD"
          test -n "$DISC_RECORD"

          META_ID=$(jq -r '.id' <<<"$META_RECORD")
          DISC_ID=$(jq -r '.id' <<<"$DISC_RECORD")
          META_DIGEST=$(jq -r '.digest // empty' <<<"$META_RECORD")
          DISC_DIGEST=$(jq -r '.digest // empty' <<<"$DISC_RECORD")
          [[ "$META_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DISC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${META_ID}/zip" > /tmp/meta.zip
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DISC_ID}/zip" > /tmp/disc.zip

          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
            --archive /tmp/meta.zip \
            --expected-digest "$META_DIGEST" \
            --receipt /tmp/meta-safe-zip-receipt.json \
            --max-compressed-bytes 67108864 \
            --max-entries 2048 \
            --max-entry-uncompressed-bytes 67108864 \
            --max-total-uncompressed-bytes 268435456 \
            --max-compression-ratio 100 \
            --required-basename asi-gate1-safe-candidate-pool-v2.json \
            --required-basename asi-gate2-independent-reverification-v2.json \
            --required-basename asi-gate3-admission-runtime-v2.json \
            --required-basename asi-admitted-metadata-pool-v2.json
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
            --archive /tmp/disc.zip \
            --expected-digest "$DISC_DIGEST" \
            --receipt /tmp/disc-safe-zip-receipt.json \
            --max-compressed-bytes 67108864 \
            --max-entries 2048 \
            --max-entry-uncompressed-bytes 67108864 \
            --max-total-uncompressed-bytes 268435456 \
            --max-compression-ratio 100 \
            --required-basename global-low-risk-discovery-governed-v2.json

          META_SAFE_ZIP_RECEIPT_DIGEST="sha256:$(sha256sum /tmp/meta-safe-zip-receipt.json | awk '{print $1}')"
          DISC_SAFE_ZIP_RECEIPT_DIGEST="sha256:$(sha256sum /tmp/disc-safe-zip-receipt.json | awk '{print $1}')"
          [[ "$META_SAFE_ZIP_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DISC_SAFE_ZIP_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          unzip -q -o /tmp/meta.zip -d /tmp/live-gates/raw
          unzip -q -o /tmp/disc.zip -d discovery-out/raw

          for f in asi-gate1-safe-candidate-pool-v2.json asi-gate2-independent-reverification-v2.json asi-gate3-admission-runtime-v2.json asi-admitted-metadata-pool-v2.json; do
            SRC=$(find /tmp/live-gates/raw -type f -name "$f" -print -quit)
            test -n "$SRC"
            cp "$SRC" "/tmp/live-gates/canonical/$f"
          done
          DISC_SRC=$(find discovery-out/raw -type f -name 'global-low-risk-discovery-governed-v2.json' -print -quit)
          test -n "$DISC_SRC"
          cp "$DISC_SRC" discovery-out/global-low-risk-discovery-governed-v2.json

          {
            echo "AUTOBALANCE_BINDING_MODE=$BINDING_MODE"
            echo "AUTOBALANCE_EXPECTED_PRODUCER_SHA=$EXPECTED_PRODUCER_SHA"
            echo "AUTOBALANCE_HOURLY_RUN_ID=$HOURLY_RUN_ID"
            echo "AUTOBALANCE_HOURLY_SOURCE_SHA=$HOURLY_SOURCE_SHA"
            echo "AUTOBALANCE_HOURLY_RUN_CREATED_AT=$HOURLY_RUN_CREATED_AT"
            echo "AUTOBALANCE_HOURLY_FRESHNESS_OBSERVED_AT=$HOURLY_FRESHNESS_OBSERVED_AT"
            echo "AUTOBALANCE_HOURLY_PRODUCER_AGE_SECONDS=$HOURLY_PRODUCER_AGE_SECONDS"
            echo "AUTOBALANCE_HOURLY_FRESHNESS_SLO_MINUTES=$HOURLY_FRESHNESS_SLO_MINUTES"
            echo "AUTOBALANCE_HOURLY_FRESHNESS_RECEIPT_DIGEST=$HOURLY_FRESHNESS_RECEIPT_DIGEST"
            echo "AUTOBALANCE_META_ID=$META_ID"
            echo "AUTOBALANCE_META_DIGEST=$META_DIGEST"
            echo "AUTOBALANCE_META_SAFE_ZIP_RECEIPT_DIGEST=$META_SAFE_ZIP_RECEIPT_DIGEST"
            echo "AUTOBALANCE_DISC_ID=$DISC_ID"
            echo "AUTOBALANCE_DISC_DIGEST=$DISC_DIGEST"
            echo "AUTOBALANCE_DISC_SAFE_ZIP_RECEIPT_DIGEST=$DISC_SAFE_ZIP_RECEIPT_DIGEST"
            echo "AUTOBALANCE_DISCOVERY_PAYLOAD=global-low-risk-discovery-governed-v2.json"
          } >> "$GITHUB_ENV"

      - name: Build and validate live autobalance plan
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs \
            discovery-out/global-low-risk-discovery-governed-v2.json \
            /tmp/live-gates/canonical/asi-gate1-safe-candidate-pool-v2.json \
            /tmp/live-gates/canonical/asi-gate2-independent-reverification-v2.json \
            /tmp/live-gates/canonical/asi-gate3-admission-runtime-v2.json \
            /tmp/live-gates/canonical/asi-admitted-metadata-pool-v2.json \
            /tmp/asi-throughput-coverage-autobalance-live-v1.json
          node scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs /tmp/asi-throughput-coverage-autobalance-live-v1.json

      - name: Emit exact producer provenance receipt
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const required = [
            'AUTOBALANCE_BINDING_MODE',
            'AUTOBALANCE_EXPECTED_PRODUCER_SHA',
            'AUTOBALANCE_HOURLY_RUN_ID',
            'AUTOBALANCE_HOURLY_SOURCE_SHA',
            'AUTOBALANCE_HOURLY_RUN_CREATED_AT',
            'AUTOBALANCE_HOURLY_FRESHNESS_OBSERVED_AT',
            'AUTOBALANCE_HOURLY_PRODUCER_AGE_SECONDS',
            'AUTOBALANCE_HOURLY_FRESHNESS_SLO_MINUTES',
            'AUTOBALANCE_HOURLY_FRESHNESS_RECEIPT_DIGEST',
            'AUTOBALANCE_META_ID',
            'AUTOBALANCE_META_DIGEST',
            'AUTOBALANCE_META_SAFE_ZIP_RECEIPT_DIGEST',
            'AUTOBALANCE_DISC_ID',
            'AUTOBALANCE_DISC_DIGEST',
            'AUTOBALANCE_DISC_SAFE_ZIP_RECEIPT_DIGEST',
            'AUTOBALANCE_DISCOVERY_PAYLOAD'
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`MISSING_${key}`);
          }
          if (process.env.AUTOBALANCE_HOURLY_SOURCE_SHA !== process.env.AUTOBALANCE_EXPECTED_PRODUCER_SHA) {
            throw new Error('PRODUCER_SHA_MISMATCH');
          }
          if (!/^\d+$/.test(process.env.AUTOBALANCE_HOURLY_PRODUCER_AGE_SECONDS) || Number(process.env.AUTOBALANCE_HOURLY_PRODUCER_AGE_SECONDS) > 5400) throw new Error('PRODUCER_FRESHNESS_INVALID');
          if (process.env.AUTOBALANCE_HOURLY_FRESHNESS_SLO_MINUTES !== '90') throw new Error('PRODUCER_FRESHNESS_SLO_INVALID');
          for (const key of ['AUTOBALANCE_HOURLY_FRESHNESS_RECEIPT_DIGEST','AUTOBALANCE_META_DIGEST', 'AUTOBALANCE_META_SAFE_ZIP_RECEIPT_DIGEST', 'AUTOBALANCE_DISC_DIGEST', 'AUTOBALANCE_DISC_SAFE_ZIP_RECEIPT_DIGEST']) {
            if (!/^sha256:[0-9a-f]{64}$/.test(process.env[key])) throw new Error(`INVALID_${key}`);
          }
          const receipt = {
            id: 'kidults-asi-throughput-autobalance-provenance-v1',
            status: 'VERIFIED_EXACT_FRESH_PRODUCER_BINDING',
            binding_mode: process.env.AUTOBALANCE_BINDING_MODE,
            consumer_source_sha: process.env.GITHUB_SHA,
            expected_producer_sha: process.env.AUTOBALANCE_EXPECTED_PRODUCER_SHA,
            discovery_payload: process.env.AUTOBALANCE_DISCOVERY_PAYLOAD,
            safe_zip_validated_before_extraction: true,
            freshness_validated_before_artifact_download: true,
            producer: {
              repository: process.env.GITHUB_REPOSITORY,
              workflow_path: '.github/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml',
              workflow_name: 'KIDULTS ASI Global Any-Site Hourly Pooling v2',
              run_id: Number(process.env.AUTOBALANCE_HOURLY_RUN_ID),
              head_sha: process.env.AUTOBALANCE_HOURLY_SOURCE_SHA,
              created_at: process.env.AUTOBALANCE_HOURLY_RUN_CREATED_AT,
              freshness_observed_at: process.env.AUTOBALANCE_HOURLY_FRESHNESS_OBSERVED_AT,
              age_seconds: Number(process.env.AUTOBALANCE_HOURLY_PRODUCER_AGE_SECONDS),
              freshness_slo_minutes: Number(process.env.AUTOBALANCE_HOURLY_FRESHNESS_SLO_MINUTES),
              freshness_receipt_digest: process.env.AUTOBALANCE_HOURLY_FRESHNESS_RECEIPT_DIGEST
            },
            artifacts: [
              {
                name: 'kidults-asi-global-any-site-source-pool-v2',
                id: Number(process.env.AUTOBALANCE_META_ID),
                digest: process.env.AUTOBALANCE_META_DIGEST,
                safe_zip_receipt_digest: process.env.AUTOBALANCE_META_SAFE_ZIP_RECEIPT_DIGEST
              },
              {
                name: 'kidults-asi-global-any-site-hourly-cycle-v2',
                id: Number(process.env.AUTOBALANCE_DISC_ID),
                digest: process.env.AUTOBALANCE_DISC_DIGEST,
                safe_zip_receipt_digest: process.env.AUTOBALANCE_DISC_SAFE_ZIP_RECEIPT_DIGEST
              }
            ],
            mixed_generation_allowed: false,
            public_release: 'HOLD',
            production: 'HOLD'
          };
          fs.writeFileSync('/tmp/asi-throughput-autobalance-provenance-v1.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

      - name: Reject permission weakening mutation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/asi-throughput-coverage-autobalance-live-v1.json';const x=JSON.parse(fs.readFileSync(p));x.rules.rights_gate_can_never_be_weakened=false;fs.writeFileSync('/tmp/bad-live-autobalance.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs /tmp/bad-live-autobalance.json; then exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: kidults-asi-throughput-coverage-autobalance-live-v1
          path: |
            /tmp/asi-throughput-coverage-autobalance-live-v1.json
            /tmp/asi-throughput-autobalance-provenance-v1.json
            /tmp/autobalance-hourly-producer-freshness-v1.json
          retention-days: 30
          if-no-files-found: error
