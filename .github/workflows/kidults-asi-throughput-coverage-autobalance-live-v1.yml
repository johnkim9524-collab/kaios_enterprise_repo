name: KIDULTS ASI Throughput Coverage Autobalance Live v1

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-throughput-autobalance-provenance-v1.mjs'
      - '.github/workflows/kidults-asi-throughput-coverage-autobalance-live-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-throughput-coverage-autobalance-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-autobalance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.19.0'}
      - name: Verify exact source and provenance guard
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-throughput-autobalance-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-throughput-autobalance-provenance-v1.mjs

      - name: Restore exact-generation hourly gate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-gates/raw /tmp/live-gates/canonical discovery-out/raw discovery-out

          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            EXPECTED_PRODUCER_SHA="$PR_BASE_SHA"
            BINDING_MODE="PR_BASE_COMPATIBILITY"
          else
            test "$GITHUB_REF" = "refs/heads/main"
            EXPECTED_PRODUCER_SHA="$CURRENT_SHA"
            BINDING_MODE="EXACT_CURRENT_MAIN"
          fi

          gh api --method GET -H 'Accept: application/vnd.github+json' \
            -f branch=main -f status=success -f per_page=100 \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-global-any-site-hourly-pooling-v1.yml/runs" \
            > /tmp/hourly-runs.json

          HOURLY_RUN_ID=$(jq -r --arg sha "$EXPECTED_PRODUCER_SHA" \
            '[.workflow_runs[]
              | select(
                  .name=="KIDULTS ASI Global Any-Site Hourly Pooling v1"
                  and .path==".github/workflows/kidults-asi-global-any-site-hourly-pooling-v1.yml"
                  and .head_branch=="main"
                  and .head_sha==$sha
                  and .status=="completed"
                  and .conclusion=="success"
                )
            ][0].id // empty' /tmp/hourly-runs.json)
          test -n "$HOURLY_RUN_ID"

          HOURLY_SOURCE_SHA=$(jq -r --argjson run "$HOURLY_RUN_ID" \
            '[.workflow_runs[] | select(.id==$run)][0].head_sha // empty' /tmp/hourly-runs.json)
          test "$HOURLY_SOURCE_SHA" = "$EXPECTED_PRODUCER_SHA"

          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${HOURLY_RUN_ID}/artifacts?per_page=100" \
            > /tmp/hourly-artifacts.json

          META_RECORD=$(jq -c --argjson run "$HOURLY_RUN_ID" --arg sha "$HOURLY_SOURCE_SHA" \
            '[.artifacts[]
              | select(
                  .name=="kidults-asi-global-any-site-source-pool-v1"
                  and .expired==false
                  and .workflow_run.id==$run
                  and .workflow_run.head_sha==$sha
                )
            ] | if length==1 then .[0] else empty end' /tmp/hourly-artifacts.json)
          DISC_RECORD=$(jq -c --argjson run "$HOURLY_RUN_ID" --arg sha "$HOURLY_SOURCE_SHA" \
            '[.artifacts[]
              | select(
                  .name=="kidults-asi-global-any-site-hourly-cycle-v1"
                  and .expired==false
                  and .workflow_run.id==$run
                  and .workflow_run.head_sha==$sha
                )
            ] | if length==1 then .[0] else empty end' /tmp/hourly-artifacts.json)
          test -n "$META_RECORD"
          test -n "$DISC_RECORD"

          META_ID=$(jq -r '.id' <<<"$META_RECORD")
          DISC_ID=$(jq -r '.id' <<<"$DISC_RECORD")
          META_DIGEST=$(jq -r '.digest // empty' <<<"$META_RECORD")
          DISC_DIGEST=$(jq -r '.digest // empty' <<<"$DISC_RECORD")
          [[ "$META_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DISC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${META_ID}/zip" > /tmp/meta.zip
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DISC_ID}/zip" > /tmp/disc.zip
          unzip -q -o /tmp/meta.zip -d /tmp/live-gates/raw
          unzip -q -o /tmp/disc.zip -d discovery-out/raw

          for f in asi-gate1-safe-candidate-pool-v1.json asi-gate2-independent-reverification-v1.json asi-gate3-admission-runtime-v1.json asi-admitted-metadata-pool-v1.json; do
            SRC=$(find /tmp/live-gates/raw -type f -name "$f" -print -quit)
            test -n "$SRC"
            cp "$SRC" "/tmp/live-gates/canonical/$f"
          done
          DISC_SRC=$(find discovery-out/raw -type f -name 'global-low-risk-discovery.json' -print -quit)
          test -n "$DISC_SRC"
          cp "$DISC_SRC" discovery-out/global-low-risk-discovery.json

          {
            echo "AUTOBALANCE_BINDING_MODE=$BINDING_MODE"
            echo "AUTOBALANCE_EXPECTED_PRODUCER_SHA=$EXPECTED_PRODUCER_SHA"
            echo "AUTOBALANCE_HOURLY_RUN_ID=$HOURLY_RUN_ID"
            echo "AUTOBALANCE_HOURLY_SOURCE_SHA=$HOURLY_SOURCE_SHA"
            echo "AUTOBALANCE_META_ID=$META_ID"
            echo "AUTOBALANCE_META_DIGEST=$META_DIGEST"
            echo "AUTOBALANCE_DISC_ID=$DISC_ID"
            echo "AUTOBALANCE_DISC_DIGEST=$DISC_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Build and validate live autobalance plan
        run: |
          node scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs \
            discovery-out/global-low-risk-discovery.json \
            /tmp/live-gates/canonical/asi-gate1-safe-candidate-pool-v1.json \
            /tmp/live-gates/canonical/asi-gate2-independent-reverification-v1.json \
            /tmp/live-gates/canonical/asi-gate3-admission-runtime-v1.json \
            /tmp/live-gates/canonical/asi-admitted-metadata-pool-v1.json \
            /tmp/asi-throughput-coverage-autobalance-live-v1.json
          node scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs /tmp/asi-throughput-coverage-autobalance-live-v1.json

      - name: Emit exact producer provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const required = [
            'AUTOBALANCE_BINDING_MODE',
            'AUTOBALANCE_EXPECTED_PRODUCER_SHA',
            'AUTOBALANCE_HOURLY_RUN_ID',
            'AUTOBALANCE_HOURLY_SOURCE_SHA',
            'AUTOBALANCE_META_ID',
            'AUTOBALANCE_META_DIGEST',
            'AUTOBALANCE_DISC_ID',
            'AUTOBALANCE_DISC_DIGEST'
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`MISSING_${key}`);
          }
          if (process.env.AUTOBALANCE_HOURLY_SOURCE_SHA !== process.env.AUTOBALANCE_EXPECTED_PRODUCER_SHA) {
            throw new Error('PRODUCER_SHA_MISMATCH');
          }
          for (const key of ['AUTOBALANCE_META_DIGEST', 'AUTOBALANCE_DISC_DIGEST']) {
            if (!/^sha256:[0-9a-f]{64}$/.test(process.env[key])) throw new Error(`INVALID_${key}`);
          }
          const receipt = {
            id: 'kidults-asi-throughput-autobalance-provenance-v1',
            status: 'VERIFIED_EXACT_PRODUCER_BINDING',
            binding_mode: process.env.AUTOBALANCE_BINDING_MODE,
            consumer_source_sha: process.env.GITHUB_SHA,
            expected_producer_sha: process.env.AUTOBALANCE_EXPECTED_PRODUCER_SHA,
            producer: {
              repository: process.env.GITHUB_REPOSITORY,
              workflow_path: '.github/workflows/kidults-asi-global-any-site-hourly-pooling-v1.yml',
              workflow_name: 'KIDULTS ASI Global Any-Site Hourly Pooling v1',
              run_id: Number(process.env.AUTOBALANCE_HOURLY_RUN_ID),
              head_sha: process.env.AUTOBALANCE_HOURLY_SOURCE_SHA
            },
            artifacts: [
              {
                name: 'kidults-asi-global-any-site-source-pool-v1',
                id: Number(process.env.AUTOBALANCE_META_ID),
                digest: process.env.AUTOBALANCE_META_DIGEST
              },
              {
                name: 'kidults-asi-global-any-site-hourly-cycle-v1',
                id: Number(process.env.AUTOBALANCE_DISC_ID),
                digest: process.env.AUTOBALANCE_DISC_DIGEST
              }
            ],
            mixed_generation_allowed: false,
            public_release: 'HOLD',
            production: 'HOLD'
          };
          fs.writeFileSync('/tmp/asi-throughput-autobalance-provenance-v1.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

      - name: Reject permission weakening mutation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/asi-throughput-coverage-autobalance-live-v1.json';const x=JSON.parse(fs.readFileSync(p));x.rules.rights_gate_can_never_be_weakened=false;fs.writeFileSync('/tmp/bad-live-autobalance.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs /tmp/bad-live-autobalance.json; then exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-throughput-coverage-autobalance-live-v1
          path: |
            /tmp/asi-throughput-coverage-autobalance-live-v1.json
            /tmp/asi-throughput-autobalance-provenance-v1.json
          retention-days: 30
          if-no-files-found: error
