name: Kidults Final Portal

on:
  push:
    branches: [main]
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/**'
      - 'apps/kidults-enterprise-staging/public/a13/assets/**'
      - 'apps/kidults-enterprise-staging/public/data/**'
      - '.github/workflows/kidults-mobile-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kidults-final-portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp V660 final visual revision
        run: |
          find apps/kidults-enterprise-staging/public/portal -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) -print0 \
            | xargs -0 sed -i \
              -e 's/?v=658/?v=660/g' \
              -e 's/?v=659/?v=660/g' \
              -e 's/racing-roadster-v658-desktop.webp/racing-roadster-v660-master.webp/g'
          grep -q 'v658-visual-freeze.css?v=660' apps/kidults-enterprise-staging/public/portal/index.html
          grep -q 'portal.js?v=660' apps/kidults-enterprise-staging/public/portal/index.html
          grep -q 'racing-roadster-v660-master.webp?v=660' apps/kidults-enterprise-staging/public/portal/index.html
          grep -q 'k100-integrity-reset.css?v=660' apps/kidults-enterprise-staging/public/portal/components/k100-integrity-reset.js
          test ! -e apps/kidults-enterprise-staging/public/portal/assets/hero/racing-roadster-v658-mobile.webp

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Kidults portal v660
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/kidults-enterprise-staging/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
