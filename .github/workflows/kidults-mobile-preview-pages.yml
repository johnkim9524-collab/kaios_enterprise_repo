name: Kidults V665 Experience Freeze

on:
  push:
    branches: [main]
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/**'
      - 'apps/kidults-enterprise-staging/public/a13/assets/**'
      - 'apps/kidults-enterprise-staging/public/data/**'
      - 'scripts/kidults/portal/capture-v662-visual-check.mjs'
      - 'scripts/kidults/portal/validate-v663-hero-layout.mjs'
      - 'scripts/kidults/portal/validate-v664-hero-visual.mjs'
      - '.github/workflows/kidults-mobile-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kidults-final-portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V665 public-experience freeze
        run: |
          set -euo pipefail
          portal='apps/kidults-enterprise-staging/public/portal'
          grep -q 'portal.js?v=665' "$portal/index.html"
          grep -q 'data-visual-freeze="v665"' "$portal/index.html"
          grep -q 'v662-stability-freeze.css?v=662-visual95-final' "$portal/index.html"
          grep -q 'racing-roadster-v662.webp?v=662-visual95-final' "$portal/index.html"
          grep -q 'data-portal-version="v663"' "$portal/index.html"
          grep -q 'v663-hero-integrated-footer.css?v=663' "$portal/index.html"
          grep -q 'v664-visible-hero-footer.css?v=665' "$portal/index.html"
          grep -q 'data-hero-layout="v663-integrated-footer"' "$portal/index.html"
          grep -q 'data-hero-surface="v665-single-surface"' "$portal/index.html"
          grep -q 'homepage-structure.js?v=662-visual95-final' "$portal/portal.js"
          grep -q 'editorial-assets.js?v=662-visual95-final' "$portal/portal.js"
          grep -q 'mobile-hero-visibility.js?v=662-visual95-final' "$portal/portal.js"
          grep -q 'renderers.js?v=665' "$portal/portal.js"
          grep -q 'visualFreeze: "v665"' "$portal/portal.js"
          grep -q 'getUTCHours' "$portal/portal.js"
          grep -q 'CACHE_REVISION = "visual95"' "$portal/components/editorial-assets.js"
          grep -q 'FINAL_TUNE_REVISION = "final"' "$portal/components/editorial-assets.js"
          grep -q 'single-studio-v662-visual95' "$portal/components/editorial-assets.js"
          grep -q '#f4f2ee' "$portal/components/v663-hero-integrated-footer.css"
          grep -q 'V665 extends the foundation' "$portal/components/v664-visible-hero-footer.css"
          grep -q 'mix-blend-mode:darken!important' "$portal/components/v664-visible-hero-footer.css"
          grep -q 'border-top:0!important' "$portal/components/v664-visible-hero-footer.css"
          grep -q 'workspace-page.js?v=662' "$portal/workspace.html"
          grep -q 'workspace-page.css?v=662' "$portal/workspace.html"
          grep -q 'racing-roadster-v662.webp' "$portal/data/v502-manifest.json"
          node scripts/kidults/portal/validate-v663-hero-layout.mjs
          node scripts/kidults/portal/validate-v662-stability-recovery.mjs
          test ! -e "$portal/assets/hero/racing-roadster-v654.webp"
          test ! -e "$portal/assets/hero/racing-roadster-v658-desktop.webp"
          test ! -e "$portal/assets/hero/racing-roadster-v660-master.webp"
          test ! -e "$portal/assets/hero/racing-roadster-v658-mobile.webp"
          python3 - <<'PY'
          from pathlib import Path

          portal = Path('apps/kidults-enterprise-staging/public/portal')
          assets = [
              portal / 'assets/hero/racing-roadster-v662.webp',
              portal / 'assets/kidult100/footwear-v654.webp',
              portal / 'assets/kidult100/camera-v654.webp',
              portal / 'assets/kidult100/toys-v654.webp',
              portal / 'assets/kidult100/watch-v655.webp',
          ]
          for asset in assets:
              data = asset.read_bytes()
              assert data[:4] == b'RIFF', f'{asset} is not a RIFF file'
              assert data[8:12] == b'WEBP', f'{asset} is not a WebP file'
              assert len(data) > 25_000, f'{asset} is unexpectedly small: {len(data)}'
              print(f'V665 asset verified: {asset} ({len(data)} bytes)')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Kidults portal V665
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/kidults-enterprise-staging/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    name: Verify deployed V665 portal
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wait for the exact V665 artifact at the public Pages URL
        env:
          KIDULTS_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${KIDULTS_BASE_URL%/}"

          for attempt in $(seq 1 30); do
            echo "Live V665 verification attempt ${attempt}/30: ${base}"
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${base}/portal/index.html?v=665&deployment=${GITHUB_SHA}" \
              --output /tmp/kidults-v665-live-index.html; then
              if grep -q 'portal.js?v=665' /tmp/kidults-v665-live-index.html \
                && grep -q 'data-visual-freeze="v665"' /tmp/kidults-v665-live-index.html \
                && grep -q 'data-portal-version="v663"' /tmp/kidults-v665-live-index.html \
                && grep -q 'v663-hero-integrated-footer.css?v=663' /tmp/kidults-v665-live-index.html \
                && grep -q 'v664-visible-hero-footer.css?v=665' /tmp/kidults-v665-live-index.html \
                && grep -q 'data-hero-surface="v665-single-surface"' /tmp/kidults-v665-live-index.html; then
                echo "V665 HTML is active at the public Pages URL."
                break
              fi
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "The public Pages URL did not expose the V665 artifact within the retry window."
              cat /tmp/kidults-v665-live-index.html 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "${base}/portal/components/v664-visible-hero-footer.css?v=665&deployment=${GITHUB_SHA}" \
            --output /tmp/kidults-v665-hero.css
          grep -q '#f4f2ee' /tmp/kidults-v665-hero.css
          grep -q 'mix-blend-mode:darken!important' /tmp/kidults-v665-hero.css
          grep -q 'border-top:0!important' /tmp/kidults-v665-hero.css

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "${base}/portal/portal.js?v=665&deployment=${GITHUB_SHA}" \
            --output /tmp/kidults-v665-portal.js
          grep -q 'visualFreeze: "v665"' /tmp/kidults-v665-portal.js
          grep -q 'renderers.js?v=665' /tmp/kidults-v665-portal.js
          grep -q 'getUTCHours' /tmp/kidults-v665-portal.js

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "${base}/portal/workspace.html?deployment=${GITHUB_SHA}" \
            --output /tmp/kidults-v665-live-workspace.html
          grep -q 'workspace-page.js?v=662' /tmp/kidults-v665-live-workspace.html
          grep -q 'workspace-page.css?v=662' /tmp/kidults-v665-live-workspace.html

          mkdir -p /tmp/kidults-v665-assets
          for relative in \
            'assets/hero/racing-roadster-v662.webp' \
            'assets/kidult100/footwear-v654.webp' \
            'assets/kidult100/camera-v654.webp' \
            'assets/kidult100/toys-v654.webp' \
            'assets/kidult100/watch-v655.webp'; do
            target="/tmp/kidults-v665-assets/$(basename "$relative")"
            curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${base}/portal/${relative}?v=665&deployment=${GITHUB_SHA}" \
              --output "$target"
          done

          python3 - <<'PY'
          from pathlib import Path
          for asset in Path('/tmp/kidults-v665-assets').glob('*.webp'):
              data = asset.read_bytes()
              assert data[:4] == b'RIFF', f'{asset} is not RIFF'
              assert data[8:12] == b'WEBP', f'{asset} is not WebP'
              assert len(data) > 25_000, f'{asset} is unexpectedly small: {len(data)}'
              print(f'Live V665 asset verified: {asset.name} ({len(data)} bytes)')
          PY

          for retired in \
            racing-roadster-v654.webp \
            racing-roadster-v658-desktop.webp \
            racing-roadster-v660-master.webp \
            racing-roadster-v658-mobile.webp; do
            status="$(curl --silent --location --output /dev/null --write-out '%{http_code}' \
              "${base}/portal/assets/hero/${retired}?deployment=${GITHUB_SHA}")"
            test "$status" = "404"
          done

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate the public V665 Pages URL at 320 / 390 / 768 / 1440
        env:
          KIDULTS_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          KIDULTS_VISUAL_OUTPUT: artifacts/kidults-v665-live
        run: node scripts/kidults/portal/capture-v662-visual-check.mjs

      - name: Upload live V665 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-v665-live-evidence
          path: artifacts/kidults-v665-live
          if-no-files-found: warn
          retention-days: 14
