name: Kidults V663 Hero Clean Portal

on:
  push:
    branches: [main]
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/**'
      - 'apps/kidults-enterprise-staging/public/a13/assets/**'
      - 'apps/kidults-enterprise-staging/public/data/**'
      - 'scripts/kidults/portal/capture-v662-visual-check.mjs'
      - 'scripts/kidults/portal/validate-v663-hero-layout.mjs'
      - '.github/workflows/kidults-mobile-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kidults-final-portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify V662 Visual95 source freeze + V663 Hero layout
        run: |
          set -euo pipefail
          portal='apps/kidults-enterprise-staging/public/portal'
          grep -q 'portal.js?v=662-visual95-final' "$portal/index.html"
          grep -q 'v662-stability-freeze.css?v=662-visual95-final' "$portal/index.html"
          grep -q 'racing-roadster-v662.webp?v=662-visual95-final' "$portal/index.html"
          grep -q 'data-portal-version="v663"' "$portal/index.html"
          grep -q 'v663-hero-integrated-footer.css?v=663' "$portal/index.html"
          grep -q 'data-hero-layout="v663-integrated-footer"' "$portal/index.html"
          grep -q 'homepage-structure.js?v=662-visual95-final' "$portal/portal.js"
          grep -q 'editorial-assets.js?v=662-visual95-final' "$portal/portal.js"
          grep -q 'mobile-hero-visibility.js?v=662-visual95-final' "$portal/portal.js"
          grep -q 'CACHE_REVISION = "visual95"' "$portal/components/editorial-assets.js"
          grep -q 'FINAL_TUNE_REVISION = "final"' "$portal/components/editorial-assets.js"
          grep -q 'single-studio-v662-visual95' "$portal/components/editorial-assets.js"
          grep -q '#f4f2ee' "$portal/components/v663-hero-integrated-footer.css"
          grep -q 'background:rgba(244,242,238,.97)!important' "$portal/components/v663-hero-integrated-footer.css"
          grep -q 'workspace-page.js?v=662' "$portal/workspace.html"
          grep -q 'workspace-page.css?v=662' "$portal/workspace.html"
          grep -q 'racing-roadster-v662.webp' "$portal/data/v502-manifest.json"
          node scripts/kidults/portal/validate-v663-hero-layout.mjs
          test ! -e "$portal/assets/hero/racing-roadster-v654.webp"
          test ! -e "$portal/assets/hero/racing-roadster-v658-desktop.webp"
          test ! -e "$portal/assets/hero/racing-roadster-v660-master.webp"
          test ! -e "$portal/assets/hero/racing-roadster-v658-mobile.webp"
          python3 - <<'PY'
          from pathlib import Path

          portal = Path('apps/kidults-enterprise-staging/public/portal')
          assets = [
              portal / 'assets/hero/racing-roadster-v662.webp',
              portal / 'assets/kidult100/footwear-v654.webp',
              portal / 'assets/kidult100/camera-v654.webp',
              portal / 'assets/kidult100/toys-v654.webp',
              portal / 'assets/kidult100/watch-v655.webp',
          ]
          for asset in assets:
              data = asset.read_bytes()
              assert data[:4] == b'RIFF', f'{asset} is not a RIFF file'
              assert data[8:12] == b'WEBP', f'{asset} is not a WebP file'
              assert len(data) > 25_000, f'{asset} is unexpectedly small: {len(data)}'
              print(f'V663 asset verified: {asset} ({len(data)} bytes)')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Kidults portal V663
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/kidults-enterprise-staging/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    name: Verify deployed V663 Hero portal
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Wait for the exact V663 artifact at the public Pages URL
        env:
          KIDULTS_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${KIDULTS_BASE_URL%/}"

          for attempt in $(seq 1 30); do
            echo "Live V663 verification attempt ${attempt}/30: ${base}"
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${base}/portal/index.html?deployment=${GITHUB_SHA}" \
              --output /tmp/kidults-v663-live-index.html; then
              if grep -q 'portal.js?v=662-visual95-final' /tmp/kidults-v663-live-index.html \
                && grep -q 'data-portal-version="v663"' /tmp/kidults-v663-live-index.html \
                && grep -q 'v663-hero-integrated-footer.css?v=663' /tmp/kidults-v663-live-index.html \
                && grep -q 'data-hero-layout="v663-integrated-footer"' /tmp/kidults-v663-live-index.html; then
                echo "V663 Hero HTML is active at the public Pages URL."
                break
              fi
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "The public Pages URL did not expose the V663 artifact within the retry window."
              cat /tmp/kidults-v663-live-index.html 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "${base}/portal/components/v663-hero-integrated-footer.css?v=663&deployment=${GITHUB_SHA}" \
            --output /tmp/kidults-v663-hero.css
          grep -q '#f4f2ee' /tmp/kidults-v663-hero.css
          grep -q 'background:rgba(244,242,238,.97)!important' /tmp/kidults-v663-hero.css

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "${base}/portal/workspace.html?deployment=${GITHUB_SHA}" \
            --output /tmp/kidults-v663-live-workspace.html
          grep -q 'workspace-page.js?v=662' /tmp/kidults-v663-live-workspace.html
          grep -q 'workspace-page.css?v=662' /tmp/kidults-v663-live-workspace.html

          mkdir -p /tmp/kidults-v663-assets
          for relative in \
            'assets/hero/racing-roadster-v662.webp' \
            'assets/kidult100/footwear-v654.webp' \
            'assets/kidult100/camera-v654.webp' \
            'assets/kidult100/toys-v654.webp' \
            'assets/kidult100/watch-v655.webp'; do
            target="/tmp/kidults-v663-assets/$(basename "$relative")"
            curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${base}/portal/${relative}?v=663&deployment=${GITHUB_SHA}" \
              --output "$target"
          done

          python3 - <<'PY'
          from pathlib import Path
          for asset in Path('/tmp/kidults-v663-assets').glob('*.webp'):
              data = asset.read_bytes()
              assert data[:4] == b'RIFF', f'{asset} is not RIFF'
              assert data[8:12] == b'WEBP', f'{asset} is not WebP'
              assert len(data) > 25_000, f'{asset} is unexpectedly small: {len(data)}'
              print(f'Live V663 asset verified: {asset.name} ({len(data)} bytes)')
          PY

          for retired in \
            racing-roadster-v654.webp \
            racing-roadster-v658-desktop.webp \
            racing-roadster-v660-master.webp \
            racing-roadster-v658-mobile.webp; do
            status="$(curl --silent --location --output /dev/null --write-out '%{http_code}' \
              "${base}/portal/assets/hero/${retired}?deployment=${GITHUB_SHA}")"
            test "$status" = "404"
          done

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate the public V663 Pages URL at 320 / 390 / 768 / 1440
        env:
          KIDULTS_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          KIDULTS_VISUAL_OUTPUT: artifacts/kidults-v663-live
        run: node scripts/kidults/portal/capture-v662-visual-check.mjs

      - name: Upload live V663 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # Compatibility marker: kidults-v662-visual95-final-live-evidence
          name: kidults-v663-hero-live-evidence
          path: artifacts/kidults-v663-live
          if-no-files-found: warn
          retention-days: 14
