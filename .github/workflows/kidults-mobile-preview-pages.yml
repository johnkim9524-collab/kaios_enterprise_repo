name: Kidults Final Portal

on:
  push:
    branches: [main]
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/**'
      - 'apps/kidults-enterprise-staging/public/a13/assets/**'
      - 'apps/kidults-enterprise-staging/public/data/**'
      - '.github/workflows/kidults-mobile-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kidults-final-portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp V659 visual cache revision
        run: |
          find apps/kidults-enterprise-staging/public/portal -type f \( -name '*.html' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i 's/?v=658/?v=659/g'
          grep -q 'v658-visual-freeze.css?v=659' apps/kidults-enterprise-staging/public/portal/index.html
          grep -q 'k100-integrity-reset.css?v=659' apps/kidults-enterprise-staging/public/portal/components/k100-integrity-reset.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Kidults portal v659
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/kidults-enterprise-staging/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
