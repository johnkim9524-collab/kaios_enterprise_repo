name: KIDULTS E2E Canonical Product Vertical Slice Contract v1

on:
  pull_request:
    paths:
      - 'coordination/kidults/e2e/canonical-product-vertical-slice-contract-v1.json'
      - 'scripts/kidults/e2e/validate-canonical-product-vertical-slice-contract-v1.mjs'
      - '.github/workflows/kidults-e2e-canonical-vertical-slice-contract-v1.yml'
  workflow_dispatch:

jobs:
  validate-e2e-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - run: node scripts/kidults/e2e/validate-canonical-product-vertical-slice-contract-v1.mjs
