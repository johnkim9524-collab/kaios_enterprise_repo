name: KIDULTS ASI Requirement-to-Adapter Coverage v1
run-name: KIDULTS Coverage / ${{ github.event_name == 'workflow_run' && format('source-{0}', github.event.workflow_run.head_sha) || format('manual-{0}', github.run_id) }}

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'KIDULTS ASI Autonomous Resolution Layer v1'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-requirement-adapter-coverage:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run')
    concurrency:
      group: kidults-asi-requirement-adapter-coverage-v1-${{ github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.head_sha, 'ASI_AUTONOMOUS_RESOLUTION') || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source and coverage syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-requirement-adapter-coverage-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-requirement-adapter-coverage-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/source-purpose-rights-gate-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-requirement-adapter-coverage-registry-v1.mjs
          node --check scripts/kidults/source-intelligence/resolve-asi-requirement-adapter-coverage-canonical-guard-v1.mjs
          node --check scripts/kidults/source-intelligence/build-asi-requirement-adapter-coverage-semantic-input-v1.mjs
          node --check scripts/kidults/source-intelligence/resolve-asi-orchestration-run-history-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py scripts/kidults/kpmo/validate-safe-zip-archive-v1.test.py
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.test.py
          node scripts/kidults/source-intelligence/validate-asi-requirement-adapter-coverage-canonical-guard-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs
          node scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-requirement-adapter-coverage-contract-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-requirement-adapter-coverage-registry-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/schemas/asi-autonomous-resolution-artifact-binding-v1.schema.json','utf8'))"
      - name: Validate requirement coverage registry and automatic continuation
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-requirement-adapter-coverage-registry-v1.mjs \
            | tee /tmp/kidults-asi-requirement-adapter-coverage-registry-validation-v1.json
      - name: Restore exact artifact-producing autonomous-resolution run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || 'main' }}
          ARTIFACT_VALIDATION_SCOPE: ${{ github.event_name == 'pull_request' && 'PULL_REQUEST_HEAD' || 'MAIN' }}
          EVENT_ARL_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_ARL_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_ARL_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arl-expanded /tmp/arl-input
          rm -f /tmp/arl-run.json /tmp/arl-artifact.json

          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            test -n "$EVENT_ARL_RUN_ID"
            test "$EVENT_ARL_EVENT" != push
            test "$EVENT_ARL_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
            RUN_ID="$EVENT_ARL_RUN_ID"
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_ARL_RUN_ID}" \
              > /tmp/arl-run.json
            EVENT_ARL_RUN_ID="$EVENT_ARL_RUN_ID" EVENT_ARL_EVENT="$EVENT_ARL_EVENT" TARGET_SOURCE_SHA="$TARGET_SOURCE_SHA" EXPECTED_HEAD_BRANCH="$EXPECTED_HEAD_BRANCH" node - <<'NODE'
          const fs=require('fs');
          const run=JSON.parse(fs.readFileSync('/tmp/arl-run.json','utf8'));
          if(run.id!==Number(process.env.EVENT_ARL_RUN_ID))throw new Error('AUTONOMOUS_RESOLUTION_TRIGGER_RUN_ID_MISMATCH');
          const ordinaryRunName=/^KIDULTS ARL \/ p1-[1-9][0-9]*$/;
          if(!ordinaryRunName.test(run.name)||run.path!=='.github/workflows/kidults-asi-autonomous-resolution-layer-v1.yml')throw new Error('AUTONOMOUS_RESOLUTION_TRIGGER_IDENTITY');
          if(run.head_sha!==process.env.TARGET_SOURCE_SHA||run.head_branch!==process.env.EXPECTED_HEAD_BRANCH)throw new Error('AUTONOMOUS_RESOLUTION_TRIGGER_SOURCE_SCOPE');
          if(run.status!=='completed'||run.conclusion!=='success')throw new Error('AUTONOMOUS_RESOLUTION_TRIGGER_NOT_SUCCESS');
          if(run.event!==process.env.EVENT_ARL_EVENT||run.event==='push')throw new Error(`AUTONOMOUS_RESOLUTION_NON_ARTIFACT_EVENT:${run.event}`);
          NODE
          else
            for ATTEMPT in $(seq 1 24); do
              gh api -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-autonomous-resolution-layer-v1.yml/runs?head_sha=${TARGET_SOURCE_SHA}&status=success&per_page=100" \
                > /tmp/arl-runs.json
              TARGET_SOURCE_SHA="$TARGET_SOURCE_SHA" EXPECTED_HEAD_BRANCH="$EXPECTED_HEAD_BRANCH" node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/arl-runs.json','utf8'));
          const target=process.env.TARGET_SOURCE_SHA;
          const expectedBranch=process.env.EXPECTED_HEAD_BRANCH;
          const artifactProducingEvents=new Set(['workflow_run']);
          const runs=(x.workflow_runs||[])
            .filter((run)=>/^KIDULTS ARL \/ p1-[1-9][0-9]*$/.test(run.name)&&
              run.path==='.github/workflows/kidults-asi-autonomous-resolution-layer-v1.yml'&&
              run.head_sha===target&&run.head_branch===expectedBranch&&
              run.status==='completed'&&run.conclusion==='success'&&
              run.event!=='push'&&artifactProducingEvents.has(run.event))
            .sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)||b.id-a.id);
          if(runs.length)fs.writeFileSync('/tmp/arl-run.json',JSON.stringify(runs[0],null,2));
          NODE
              if [ -s /tmp/arl-run.json ]; then break; fi
              if [ "$ATTEMPT" -eq 24 ]; then
                echo "NO_SUCCESSFUL_ARTIFACT_PRODUCING_SAME_SHA_AUTONOMOUS_RESOLUTION_RUN:${TARGET_SOURCE_SHA}" >&2
                exit 1
              fi
              sleep 10
            done
            RUN_ID=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/arl-run.json')).id")
          fi

          test -n "$RUN_ID"
          for ATTEMPT in $(seq 1 12); do
            rm -f /tmp/arl-artifact.json
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              > /tmp/arl-artifacts.json
            node - <<'NODE'
          const fs=require('fs');
          const run=JSON.parse(fs.readFileSync('/tmp/arl-run.json','utf8'));
          const x=JSON.parse(fs.readFileSync('/tmp/arl-artifacts.json','utf8'));
          const artifacts=(x.artifacts||[])
            .filter((artifact)=>artifact.name==='kidults-asi-autonomous-resolution-layer-v1'&&
              artifact.expired===false&&artifact.workflow_run?.id===run.id&&
              artifact.workflow_run?.head_sha===run.head_sha);
          if(artifacts.length>1)throw new Error(`AUTONOMOUS_RESOLUTION_ARTIFACT_CARDINALITY:${artifacts.length}`);
          if(artifacts.length===1)fs.writeFileSync('/tmp/arl-artifact.json',JSON.stringify(artifacts[0],null,2));
          NODE
            if [ -s /tmp/arl-artifact.json ]; then break; fi
            if [ "$ATTEMPT" -eq 12 ]; then
              echo "AUTONOMOUS_RESOLUTION_ARTIFACT_NOT_AVAILABLE:${RUN_ID}" >&2
              exit 1
            fi
            sleep 5
          done

          ARTIFACT_ID=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/arl-artifact.json')).id")
          ARTIFACT_DIGEST=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/arl-artifact.json')).digest || ''")
          ARTIFACT_EXPIRES_AT=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/arl-artifact.json')).expires_at || ''")
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ARTIFACT_EXPIRES_AT="$ARTIFACT_EXPIRES_AT" node -e "const expires=Date.parse(process.env.ARTIFACT_EXPIRES_AT);if(!Number.isFinite(expires)||expires<=Date.now())throw new Error('AUTONOMOUS_RESOLUTION_ARTIFACT_EXPIRY_INVALID')"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/arl.zip
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
            --archive /tmp/arl.zip \
            --expected-digest "$ARTIFACT_DIGEST" \
            --receipt /tmp/arl-archive-validation-receipt-v1.json \
            --max-compressed-bytes 4194304 \
            --max-entries 256 \
            --max-entry-uncompressed-bytes 8388608 \
            --max-total-uncompressed-bytes 33554432 \
            --max-compression-ratio 100
          unzip -q -o /tmp/arl.zip -d /tmp/arl-expanded
          for NAME in \
            replacement-source-mission-queue-v1.json \
            autonomous-resolution-manifest-v1.json \
            kidults-asi-autonomous-resolution-layer-kpmo-receipt-v1.json; do
            mapfile -t FILES < <(find /tmp/arl-expanded -type f -name "$NAME" -print)
            test "${#FILES[@]}" -eq 1
            cp "${FILES[0]}" "/tmp/arl-input/$NAME"
          done
          node scripts/kidults/source-intelligence/resolve-asi-orchestration-run-history-v1.mjs \
            --mode coverage-exact-producer \
            --run /tmp/arl-run.json \
            --receipt /tmp/arl-input/kidults-asi-autonomous-resolution-layer-kpmo-receipt-v1.json \
            --source-sha "$TARGET_SOURCE_SHA" --head-branch "$EXPECTED_HEAD_BRANCH" \
            --output /tmp/coverage-exact-upstream-producer-receipt-v1.json
          AUTHORITATIVE_PRODUCER_CARDINALITY=$(jq -r '.authoritative_producer_cardinality' /tmp/coverage-exact-upstream-producer-receipt-v1.json)
          test "$AUTHORITATIVE_PRODUCER_CARDINALITY" = 1
          PRODUCER_HEAD_SHA=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/arl-run.json')).head_sha")
          EXECUTION_SHA=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/arl-input/kidults-asi-autonomous-resolution-layer-kpmo-receipt-v1.json')).source_sha")
          CONSUMER_SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$PRODUCER_HEAD_SHA" "$CONSUMER_SHA"
          git merge-base --is-ancestor "$EXECUTION_SHA" "$CONSUMER_SHA"
          export PRODUCER_HEAD_SHA EXECUTION_SHA CONSUMER_SHA AUTHORITATIVE_PRODUCER_CARDINALITY
          node - <<'NODE'
          const fs=require('fs');
          const run=JSON.parse(fs.readFileSync('/tmp/arl-run.json','utf8'));
          const artifact=JSON.parse(fs.readFileSync('/tmp/arl-artifact.json','utf8'));
          const expectedSourceSha=process.env.TARGET_SOURCE_SHA;
          const expectedHeadBranch=process.env.EXPECTED_HEAD_BRANCH;
          const validationScope=process.env.ARTIFACT_VALIDATION_SCOPE;
          const executionSha=process.env.EXECUTION_SHA;
          if(run.head_sha!==expectedSourceSha||run.head_sha!==process.env.PRODUCER_HEAD_SHA)throw new Error('AUTONOMOUS_RESOLUTION_SOURCE_SHA_SCOPE');
          if(run.head_branch!==expectedHeadBranch)throw new Error('AUTONOMOUS_RESOLUTION_HEAD_BRANCH_SCOPE');
          if(run.event!=='workflow_run')throw new Error(`AUTONOMOUS_RESOLUTION_NONAUTHORITATIVE_PRODUCER_EVENT:${run.event}`);
          if(!['MAIN','PULL_REQUEST_HEAD'].includes(validationScope))throw new Error('AUTONOMOUS_RESOLUTION_VALIDATION_SCOPE');
          const receipt=JSON.parse(fs.readFileSync('/tmp/arl-input/kidults-asi-autonomous-resolution-layer-kpmo-receipt-v1.json','utf8'));
          if(receipt.producer_workflow_run_id!==run.id||receipt.producer_display_title!==run.display_title)throw new Error('AUTONOMOUS_RESOLUTION_RECEIPT_PRODUCER_IDENTITY_MISMATCH');
          const upstreamClass='ASI_AUTONOMOUS_RESOLUTION';
          const canonicalRunKey=`${run.head_sha}:${upstreamClass}`;
          const binding={id:'kidults-asi-autonomous-resolution-artifact-binding-v1',version:'1.3.0',artifact_id:artifact.id,artifact_name:artifact.name,expired:artifact.expired,workflow_run_id:run.id,workflow_event:run.event,consumer_event:process.env.GITHUB_EVENT_NAME,workflow_name:run.name,workflow_path:run.path,producer_display_title:run.display_title,authoritative_generation_key:receipt.authoritative_generation_key,authoritative_producer_cardinality:Number(process.env.AUTHORITATIVE_PRODUCER_CARDINALITY),upstream_class:upstreamClass,canonical_run_key:canonicalRunKey,head_branch:run.head_branch,expected_head_branch:expectedHeadBranch,head_sha:run.head_sha,expected_source_sha:expectedSourceSha,execution_sha:executionSha,consumer_sha:process.env.CONSUMER_SHA,validation_scope:validationScope,main_scope_validated:validationScope==='MAIN',production_authorized:false,exact_triggering_run_bound:process.env.GITHUB_EVENT_NAME==='workflow_run',authoritative_producer_event:run.event==='workflow_run',source_sha_ancestor_of_consumer:true,execution_sha_ancestor_of_consumer:true,status:run.status,conclusion:run.conclusion,created_at:artifact.created_at,expires_at:artifact.expires_at};
          fs.writeFileSync('/tmp/arl-input/autonomous-resolution-artifact-binding-v1.json',JSON.stringify(binding,null,2)+'\n');
          NODE
          echo "ARL_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "ARL_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "ARL_ARTIFACT_DIGEST=$ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "ARL_ARCHIVE_VALIDATION_RECEIPT_DIGEST=sha256:$(sha256sum /tmp/arl-archive-validation-receipt-v1.json | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "ARL_PRODUCER_HEAD_SHA=$PRODUCER_HEAD_SHA" >> "$GITHUB_ENV"
          echo "ARL_EXECUTION_SHA=$EXECUTION_SHA" >> "$GITHUB_ENV"
          echo "arl_run_id=$RUN_ID artifact_id=$ARTIFACT_ID producer_head_sha=$PRODUCER_HEAD_SHA execution_sha=$EXECUTION_SHA consumer_sha=$CONSUMER_SHA"
      - name: Resolve bounded Coverage canonical leader or alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GUARD_DIR=/tmp/kidults-coverage-canonical-guard
          CANDIDATE_DIR="$GUARD_DIR/candidates"
          mkdir -p "$CANDIDATE_DIR"
          SOURCE_SHA="$ARL_PRODUCER_HEAD_SHA"
          UPSTREAM_CLASS=ASI_AUTONOMOUS_RESOLUTION
          CANONICAL_RUN_KEY="${SOURCE_SHA}:${UPSTREAM_CLASS}"
          CANONICAL_KEY_DIGEST=$(CANONICAL_RUN_KEY="$CANONICAL_RUN_KEY" node -e "const c=require('crypto');process.stdout.write(c.createHash('sha256').update(process.env.CANONICAL_RUN_KEY).digest('hex'))")
          CANONICAL_ARTIFACT_NAME="kidults-asi-requirement-adapter-coverage-canonical-${CANONICAL_KEY_DIGEST}"
          CANONICAL_CONTRACT_DIGEST="sha256:$(sha256sum coordination/kidults/source-intelligence/asi-requirement-adapter-coverage-contract-v1.json | cut -d ' ' -f1)"
          UPSTREAM_BINDING_DIGEST="sha256:$(sha256sum /tmp/arl-input/autonomous-resolution-artifact-binding-v1.json | cut -d ' ' -f1)"
          node scripts/kidults/source-intelligence/build-asi-requirement-adapter-coverage-semantic-input-v1.mjs \
            --source-sha "$SOURCE_SHA" --upstream-class "$UPSTREAM_CLASS" \
            --queue /tmp/arl-input/replacement-source-mission-queue-v1.json \
            --manifest /tmp/arl-input/autonomous-resolution-manifest-v1.json \
            --receipt /tmp/arl-input/kidults-asi-autonomous-resolution-layer-kpmo-receipt-v1.json \
            --contract coordination/kidults/source-intelligence/asi-requirement-adapter-coverage-contract-v1.json \
            --output "$GUARD_DIR/coverage-semantic-input-receipt-v1.json"
          CANONICAL_INPUT_DIGEST=$(jq -r '.canonical_input_digest' "$GUARD_DIR/coverage-semantic-input-receipt-v1.json")
          SEMANTIC_INPUT_RECEIPT_DIGEST="sha256:$(sha256sum "$GUARD_DIR/coverage-semantic-input-receipt-v1.json" | cut -d ' ' -f1)"
          [[ "$CANONICAL_INPUT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          READBACK_STATE=BYPASS
          READBACK_TOTAL=0
          READBACK_RETURNED=0
          PRIOR_SUCCESS_COUNT=0
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            READBACK_STATE=COMPLETE
            if ! gh api --method GET -H 'Accept: application/vnd.github+json' \
              -f name="$CANONICAL_ARTIFACT_NAME" -f per_page=100 \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts" > "$GUARD_DIR/artifacts.json"; then
              READBACK_STATE=API_READBACK_FAILED
              printf '{"total_count":0,"artifacts":[]}\n' > "$GUARD_DIR/artifacts.json"
            fi
            if ! jq -e '.total_count|numbers' "$GUARD_DIR/artifacts.json" >/dev/null; then
              READBACK_STATE=API_RESPONSE_INVALID
              printf '{"total_count":0,"artifacts":[]}\n' > "$GUARD_DIR/artifacts.json"
            fi
            READBACK_TOTAL=$(jq -r '.total_count' "$GUARD_DIR/artifacts.json")
            READBACK_RETURNED=$(jq -r '.artifacts|length' "$GUARD_DIR/artifacts.json")
            if [ "$READBACK_TOTAL" -ne "$READBACK_RETURNED" ]; then READBACK_STATE=API_RESPONSE_TRUNCATED; fi
            CREATED_SINCE=$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)
            if ! gh api --method GET -H 'Accept: application/vnd.github+json' \
              -f branch=main -f head_sha="$SOURCE_SHA" -f event=workflow_run -f status=success \
              -f created=">=${CREATED_SINCE}" -f per_page=100 \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-requirement-adapter-coverage-v1.yml/runs" \
              > "$GUARD_DIR/prior-success-runs.json"; then
              READBACK_STATE=PRIOR_SUCCESS_READBACK_FAILED
            elif ! jq -e '.total_count|numbers' "$GUARD_DIR/prior-success-runs.json" >/dev/null || \
              ! jq -e '.workflow_runs|arrays' "$GUARD_DIR/prior-success-runs.json" >/dev/null; then
              READBACK_STATE=PRIOR_SUCCESS_RESPONSE_INVALID
            elif ! node scripts/kidults/source-intelligence/resolve-asi-orchestration-run-history-v1.mjs \
              --mode coverage-prior-success \
              --input "$GUARD_DIR/prior-success-runs.json" \
              --source-sha "$SOURCE_SHA" --head-branch main --created-since "$CREATED_SINCE" \
              --output "$GUARD_DIR/coverage-prior-success-exact-query-receipt-v1.json"; then
              READBACK_STATE=PRIOR_SUCCESS_EXACT_QUERY_INVALID
            else
              PRIOR_SUCCESS_COUNT=$(jq -r '.prior_success_count' "$GUARD_DIR/coverage-prior-success-exact-query-receipt-v1.json")
            fi
            node scripts/kidults/kpmo/read-strict-json-boolean-v1.mjs --self-test
            mapfile -t ARTIFACT_ROWS < <(jq -c '.artifacts[]' "$GUARD_DIR/artifacts.json")
            for ROW in "${ARTIFACT_ROWS[@]}"; do
              ARTIFACT_ID=$(jq -r '.id // 0' <<<"$ROW")
              CANDIDATE="$CANDIDATE_DIR/candidate-${ARTIFACT_ID}.json"
              if ! EXPIRED=$(node scripts/kidults/kpmo/read-strict-json-boolean-v1.mjs expired <<<"$ROW"); then
                READBACK_STATE=CANONICAL_ARTIFACT_EXPIRY_INVALID
                jq -n --argjson artifact "$ROW" '{artifact:$artifact,run:null,receipt:null}' > "$CANDIDATE"
                continue
              fi
              if [ "$EXPIRED" = true ]; then
                jq -n --argjson artifact "$ROW" '{artifact:$artifact,run:null,receipt:null}' > "$CANDIDATE"
                continue
              fi
              RUN_ID=$(jq -r '.workflow_run.id // 0' <<<"$ROW")
              if ! gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$CANDIDATE_DIR/run-${ARTIFACT_ID}.json"; then
                READBACK_STATE=CANONICAL_RUN_READBACK_FAILED
                jq -n --argjson artifact "$ROW" '{artifact:$artifact,run:null,receipt:null}' > "$CANDIDATE"
                continue
              fi
              DIGEST=$(jq -r '.digest // empty' <<<"$ROW")
              if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                jq -n --argjson artifact "$ROW" --slurpfile run "$CANDIDATE_DIR/run-${ARTIFACT_ID}.json" '{artifact:$artifact,run:$run[0],receipt:null}' > "$CANDIDATE"
                continue
              fi
              ARCHIVE="$CANDIDATE_DIR/artifact-${ARTIFACT_ID}.zip"
              EXTRACT="$CANDIDATE_DIR/extract-${ARTIFACT_ID}"
              mkdir -p "$EXTRACT"
              if ! gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$ARCHIVE" || \
                 ! python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
                   --archive "$ARCHIVE" --expected-digest "$DIGEST" \
                   --receipt "$CANDIDATE_DIR/archive-validation-${ARTIFACT_ID}.json" \
                   --max-compressed-bytes 4194304 --max-entries 32 \
                   --max-entry-uncompressed-bytes 2097152 --max-total-uncompressed-bytes 8388608 \
                   --max-compression-ratio 100; then
                READBACK_STATE=CANONICAL_ARTIFACT_INTEGRITY_FAILED
                jq -n --argjson artifact "$ROW" --slurpfile run "$CANDIDATE_DIR/run-${ARTIFACT_ID}.json" '{artifact:$artifact,run:$run[0],receipt:null}' > "$CANDIDATE"
                continue
              fi
              unzip -q -o "$ARCHIVE" -d "$EXTRACT"
              mapfile -d '' -t RECEIPTS < <(find "$EXTRACT" -type f -name coverage-canonical-leader-receipt-v1.json -print0)
              mapfile -d '' -t SEMANTIC_RECEIPTS < <(find "$EXTRACT" -type f -name coverage-semantic-input-receipt-v1.json -print0)
              if [ "${#RECEIPTS[@]}" -ne 1 ] || [ "${#SEMANTIC_RECEIPTS[@]}" -ne 1 ]; then
                READBACK_STATE=CANONICAL_RECEIPT_CARDINALITY_INVALID
                jq -n --argjson artifact "$ROW" --slurpfile run "$CANDIDATE_DIR/run-${ARTIFACT_ID}.json" '{artifact:$artifact,run:$run[0],receipt:null}' > "$CANDIDATE"
                continue
              fi
              SEMANTIC_FILE_DIGEST="sha256:$(sha256sum "${SEMANTIC_RECEIPTS[0]}" | cut -d ' ' -f1)"
              jq -n --argjson artifact "$ROW" --arg semanticFileDigest "$SEMANTIC_FILE_DIGEST" \
