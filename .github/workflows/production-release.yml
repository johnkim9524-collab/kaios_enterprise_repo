name: Production Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Record release runner identity
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS:-UNKNOWN}"
          echo "runner_arch=${RUNNER_ARCH:-UNKNOWN}"
          echo "image_os=${ImageOS:-UNKNOWN}"
          echo "image_version=${ImageVersion:-UNKNOWN}"
          cat /etc/os-release

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          python -m scripts.validate_release_tag \
            --tag "${GITHUB_REF_NAME}"

      - name: Validate Docker Compose
        run: docker compose config

      - name: Run full test suite
        run: python -m pytest -q

      - name: Generate release notes
        run: python -m scripts.generate_release_notes

      - name: Validate production smoke secret
        if: github.event_name == 'workflow_dispatch'
        env:
          KAIOS_PRODUCTION_ADMIN_TOKEN: ${{ secrets.KAIOS_PRODUCTION_ADMIN_TOKEN }}
        run: |
          if [ -z "${KAIOS_PRODUCTION_ADMIN_TOKEN}" ]; then
            echo "Missing repository secret: KAIOS_PRODUCTION_ADMIN_TOKEN" >&2
            exit 1
          fi

      - name: Production smoke certification
        if: github.event_name == 'workflow_dispatch'
        env:
          SMOKE_BASE_URL: https://kaios.kidults.com
          KAIOS_PRODUCTION_ADMIN_TOKEN: ${{ secrets.KAIOS_PRODUCTION_ADMIN_TOKEN }}
        run: |
          python -m scripts.production_smoke \
            --base-url "${SMOKE_BASE_URL}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kaios-production-release
          path: release/
          retention-days: 90
