name: Production Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      smoke_base_url:
        description: Production smoke-test base URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          python -m scripts.validate_release_tag \
            --tag "${GITHUB_REF_NAME}"

      - name: Validate Docker Compose
        run: docker compose config

      - name: Run full test suite
        run: python -m pytest -q

      - name: Generate release notes
        run: python -m scripts.generate_release_notes

      - name: Production smoke test
        env:
          SMOKE_BASE_URL: ${{ inputs.smoke_base_url }}
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m scripts.production_smoke \
            --base-url "${SMOKE_BASE_URL}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaios-production-release
          path: release/
          retention-days: 90