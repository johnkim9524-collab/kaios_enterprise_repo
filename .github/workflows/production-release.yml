name: Production Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: kidults-production-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Record release runner identity
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS:-UNKNOWN}"
          echo "runner_arch=${RUNNER_ARCH:-UNKNOWN}"
          echo "image_os=${ImageOS:-UNKNOWN}"
          echo "image_version=${ImageVersion:-UNKNOWN}"
          cat /etc/os-release

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-ci.lock.txt

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          python -m scripts.validate_release_tag \
            --tag "${GITHUB_REF_NAME}"

      - name: Validate Docker Compose
        run: docker compose config

      - name: Run full test suite
        run: python -m pytest -q

      - name: Generate release notes
        run: python -m scripts.generate_release_notes

      - name: Production smoke certification
        if: github.event_name == 'workflow_dispatch'
        env:
          SMOKE_BASE_URL: https://kaios.kidults.com
          KAIOS_PRODUCTION_ADMIN_TOKEN: ${{ secrets.KAIOS_PRODUCTION_ADMIN_TOKEN }}
        run: |
          if [ -z "${KAIOS_PRODUCTION_ADMIN_TOKEN}" ]; then
            echo "Missing Environment secret: KAIOS_PRODUCTION_ADMIN_TOKEN" >&2
            exit 1
          fi
          python -m scripts.production_smoke \
            --base-url "${SMOKE_BASE_URL}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kaios-production-release
          path: release/
          retention-days: 90
