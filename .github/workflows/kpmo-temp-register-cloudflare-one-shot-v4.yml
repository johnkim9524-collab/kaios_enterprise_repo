name: KPMO Temporary Bind Cloudflare One-Shot Registry v4

on:
  push:
    branches: [kpmo/cloudflare-preview-retirement-v3]
    paths: [.github/workflows/kpmo-temp-register-cloudflare-one-shot-v4.yml]

permissions:
  contents: write

jobs:
  bind:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: kpmo/cloudflare-preview-retirement-v3
          fetch-depth: 1
          persist-credentials: true
      - name: Bind registry and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json')
          d=json.loads(p.read_text())
          wf='.github/workflows/kpmo-cloudflare-preview-retire-and-governed-staging-v1.yml'
          was=wf in d.get('registered_workflows',[])
          if not was:
              d.setdefault('registered_workflows',[]).append(wf)
              d['registered_workflows']=sorted(set(d['registered_workflows']))
          d['registered_count']=len(d['registered_workflows'])
          b={'workflow':wf,'job':'retire-and-deploy','environment':'kidults-cloudflare-staging-deploy','required_secret_name_digest':'sha256:9d106dc2b7f97ab70b18b83662808f580c0e9068f2d207b4c40e741cacd14978','required_secret_step_names':['Execute one-shot Preview retirement and governed STAGING'],'allowed_trigger_classes':['workflow_run'],'remote_mutation_class':'REMOTE_STAGING_MUTATION'}
          rows=[x for x in d.get('required_environment_bindings',[]) if not (x.get('workflow')==wf and x.get('job')=='retire-and-deploy')]
          rows.append(b); d['required_environment_bindings']=sorted(rows,key=lambda x:(x.get('workflow',''),x.get('job','')))
          rb=d.setdefault('repository_binding_state',{})
          if not was:
              for k in ['environment_bound_secret_bearing_jobs','exact_main_guarded_secret_bearing_jobs','live_main_sha_guarded_secret_bearing_jobs','step_scoped_secret_bearing_jobs','privileged_secret_steps']:
                  if isinstance(rb.get(k),int): rb[k]+=1
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git rm .github/workflows/kpmo-temp-register-cloudflare-one-shot-v4.yml
          git config user.name 'johnkim9524-collab'
          git config user.email 'john.kim9524@gmail.com'
          git add coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json
          git commit -m '[CF-Pages-Skip] fix(kpmo): bind Cloudflare one-shot lane to current main'
          git push origin HEAD:kpmo/cloudflare-preview-retirement-v3
