name: KIDULTS Track B Historical Assessment Archive

on:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/candidates/candidate-structural-20260816-r1/**'
      - 'coordination/kidults/registry/assessment/**'
      - 'coordination/kidults/registry/track/records/track-b-rankability-validation-gate.json'
      - 'coordination/kidults/registry/role/records/role-track-b.json'
      - 'scripts/kidults/assessment/validate-first-rankability-assessment.mjs'
      - '.github/workflows/kidults-track-b-first-assessment.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/candidates/candidate-structural-20260816-r1/**'
      - 'coordination/kidults/registry/assessment/**'
      - 'coordination/kidults/registry/track/records/track-b-rankability-validation-gate.json'
      - 'coordination/kidults/registry/role/records/role-track-b.json'
      - 'scripts/kidults/assessment/validate-first-rankability-assessment.mjs'
      - '.github/workflows/kidults-track-b-first-assessment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-track-b-historical-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate-historical-archive:
    name: Validate historical assessment is non-authoritative
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Syntax check historical authority guard
        run: node --check scripts/kidults/assessment/validate-first-rankability-assessment.mjs
      - name: Prove immutable historical assessment blob
        shell: bash
        run: |
          set -euo pipefail
          file='coordination/kidults/registry/assessment/records/assessment-candidate-structural-20260816-r1-v1.json'
          test "$(git hash-object "$file")" = 'fa44778ae839006f3d599ff897a900661df9e27e'
      - name: Enforce historical-only authority and current waiting state
        run: node scripts/kidults/assessment/validate-first-rankability-assessment.mjs
