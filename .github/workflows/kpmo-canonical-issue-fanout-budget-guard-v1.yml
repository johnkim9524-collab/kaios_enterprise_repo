name: KPMO Canonical Issue Fan-out Budget Guard V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-canonical-issue-fanout-budget-guard-v1.yml'
      - '.github/workflows/kpmo-material-defect-severity-parity-v1.yml'
      - '.github/workflows/kpmo-canonical-latest-block-scope-v1.yml'
      - '.github/workflows/kpmo-canonical-issue-transition-guard-v1.yml'
      - 'scripts/kidults/kpmo/validate-canonical-issue-fanout-budget-v1.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-canonical-issue-fanout-budget-guard-v1.yml'
      - '.github/workflows/kpmo-material-defect-severity-parity-v1.yml'
      - '.github/workflows/kpmo-canonical-latest-block-scope-v1.yml'
      - '.github/workflows/kpmo-canonical-issue-transition-guard-v1.yml'
      - 'scripts/kidults/kpmo/validate-canonical-issue-fanout-budget-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpmo-canonical-issue-fanout-budget-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-fanout-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Enforce coalesced whole-board validation and per-issue local guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node scripts/kidults/kpmo/validate-canonical-issue-fanout-budget-v1.mjs \
            .github/workflows/kpmo-material-defect-severity-parity-v1.yml \
            .github/workflows/kpmo-canonical-latest-block-scope-v1.yml \
            .github/workflows/kpmo-canonical-issue-transition-guard-v1.yml
