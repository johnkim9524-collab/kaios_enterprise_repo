name: KIDULTS Autonomous Runtime

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-engine-mesh-v1.json'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-event-v1.schema.json'
      - 'coordination/kidults/source-intelligence/asi-queue-and-partition-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-purpose-specific-admission-policy-v1.json'
      - 'coordination/kidults/source-intelligence/global-pool-r1-frontier-seed-channel-contract-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-contract-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'coordination/kidults/source-intelligence/scope-registry-v1-to-v2-crosswalk-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'scripts/kidults/source-intelligence/*global-pool-r1*'
      - 'coordination/kidults/architecture/platform-market-funnel-alignment-v1.json'
      - '.github/workflows/kidults-autonomous-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-engine-mesh-v1.json'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-event-v1.schema.json'
      - 'coordination/kidults/source-intelligence/asi-queue-and-partition-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-purpose-specific-admission-policy-v1.json'
      - 'coordination/kidults/source-intelligence/global-pool-r1-frontier-seed-channel-contract-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-contract-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'coordination/kidults/source-intelligence/scope-registry-v1-to-v2-crosswalk-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'scripts/kidults/source-intelligence/*global-pool-r1*'
      - 'coordination/kidults/architecture/platform-market-funnel-alignment-v1.json'
      - '.github/workflows/kidults-autonomous-runtime.yml'

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: kidults-autonomous-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0

      - name: Install autonomous intelligence dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Cloudflare binding types
        run: npm run types:generate

      - name: Typecheck autonomous worker
        run: npm run typecheck

      - name: Validate 25-fleet mesh and fail-closed deployment contract
        run: npm run deploy:preflight

      - name: Exercise durable 4+7 fan-in and SHADOW source-pool guards
        run: npm run asi:processor:test

      - name: Exercise all 25 processors through the Queue/D1 SHADOW runtime
        run: npm run asi:processor:e2e

      - name: Exercise recovery fairness, lease fencing, circuit and terminal DLQ controls
        run: npm run asi:runtime-recovery:test

      - name: Validate Wrangler configuration and bundle without deploying
        run: npm run deploy:dry-run

      - name: Verify A26 package-script wiring
        run: |
          npm run | grep -E 'a26:recovery|a26:certify|a26:finalize'

      - name: Run A26 recovery certification
        run: npm run a26:recovery

      - name: Run A26 certify chain
        run: npm run a26:certify

      - name: Apply local D1 migrations and verify invariants
        run: npm run runtime:smoke
