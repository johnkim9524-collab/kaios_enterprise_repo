name: KIDULTS Autonomous Runtime

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-engine-mesh-v1.json'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-event-v1.schema.json'
      - 'coordination/kidults/source-intelligence/asi-queue-and-partition-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-purpose-specific-admission-policy-v1.json'
      - 'coordination/kidults/architecture/platform-market-funnel-alignment-v1.json'
      - '.github/workflows/kidults-autonomous-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-engine-mesh-v1.json'
      - 'coordination/kidults/source-intelligence/asi-market-funnel-event-v1.schema.json'
      - 'coordination/kidults/source-intelligence/asi-queue-and-partition-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-purpose-specific-admission-policy-v1.json'
      - 'coordination/kidults/architecture/platform-market-funnel-alignment-v1.json'
      - '.github/workflows/kidults-autonomous-runtime.yml'

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install autonomous intelligence dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Cloudflare binding types
        run: npm run types:generate

      - name: Typecheck autonomous worker
        run: npm run typecheck

      - name: Validate 25-fleet mesh and fail-closed deployment contract
        run: npm run deploy:preflight

      - name: Validate Wrangler configuration and bundle without deploying
        run: npm run deploy:dry-run

      - name: Verify A26 package-script wiring
        run: |
          npm run | grep -E 'a26:recovery|a26:certify|a26:finalize'

      - name: Run A26 recovery certification
        run: npm run a26:recovery

      - name: Run A26 certify chain
        run: npm run a26:certify

      - name: Apply local D1 migrations and verify invariants
        run: npm run runtime:smoke
