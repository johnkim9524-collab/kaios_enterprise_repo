name: KIDULTS Global Source Mesh v1

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Source Fabric Scale PI1'
    branches: [main]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json'
      - 'coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-registry-v2.json'
      - 'scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs'
      - 'scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'docs/kidults/asi/asi-sourcing-direction-v2.md'
      - '.github/workflows/kidults-global-source-mesh-v1.yml'
      - 'scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-workflow-run-generation-estate-v1.mjs'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json'
      - 'coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-registry-v2.json'
      - 'scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs'
      - 'scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'docs/kidults/asi/asi-sourcing-direction-v2.md'
      - '.github/workflows/kidults-global-source-mesh-v1.yml'
      - 'scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-workflow-run-generation-estate-v1.mjs'

permissions:
  contents: read

concurrency:
  group: kidults-global-source-mesh-v1-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  classify-workflow-run-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: KPMO_WORKFLOW_RUN_GENERATION_GUARD_V1
        id: classify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "classification=NOT_APPLICABLE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);const sha=String(x?.commit?.sha||'');if(!/^[0-9a-f]{40}$/.test(sha))process.exit(65);process.stdout.write(sha)})"
          )"
          node scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs \
            "$GITHUB_EVENT_PATH" "$LIVE_MAIN_SHA" "$GITHUB_SHA" "$GITHUB_REPOSITORY" \
            '.github/workflows/kidults-asi-source-fabric-scale-pi1.yml' \
            "$RUNNER_TEMP/workflow-run-generation-classification-v1.json"
          CLASSIFICATION="$(node -p "require(process.argv[1]).classification" "$RUNNER_TEMP/workflow-run-generation-classification-v1.json")"
          STATE="$(node -p "require(process.argv[1]).state" "$RUNNER_TEMP/workflow-run-generation-classification-v1.json")"
          echo "classification=$CLASSIFICATION" >> "$GITHUB_OUTPUT"
          case "$CLASSIFICATION" in
            CURRENT_MAIN_EXACT)
              test "$STATE" = VERIFIED_PASS
              ;;
            EXPECTED_NONAUTHORITATIVE_SKIP)
              test "$STATE" = VERIFIED_SKIP
              ;;
            INVALID_TRIGGER)
              echo "WORKFLOW_RUN_GENERATION_INVALID_TRIGGER" >&2
              exit 1
              ;;
            *)
              echo "WORKFLOW_RUN_GENERATION_UNKNOWN_CLASSIFICATION:$CLASSIFICATION" >&2
              exit 1
              ;;
          esac

  validate-source-mesh:
    needs: classify-workflow-run-generation
    if: needs.classify-workflow-run-generation.outputs.classification != 'EXPECTED_NONAUTHORITATIVE_SKIP' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source and syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs
          node --check scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs
      - name: Validate ASI sourcing direction before planning
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs \
            > /tmp/asi-sourcing-direction-validation-v2.json
      - name: Build deterministic 32-scope four-direction global market-cell mesh
        run: |
          node scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs \
            coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json \
            coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json \
            /tmp/kidults-global-source-mesh-v1.json
      - name: Verify fail-closed global coverage, direction vectors and claim ceilings
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs \
            --mesh /tmp/kidults-global-source-mesh-v1.json \
            > /tmp/asi-sourcing-direction-mesh-validation-v2.json
          node - <<'NODE'
          const r=require('/tmp/kidults-global-source-mesh-v1.json');
          if(r.production!=='HOLD'||r.public_release!=='HOLD'||r.market_cell_count!==768||r.scope_count!==32||r.evidence_class_count!==8) process.exit(1);
          if(r.named_provider_global_selection!==false||r.source_count_is_not_goal!==true||r.provider_first_selection_forbidden!==true) process.exit(1);
          if(r.direction_floor_pass_count!==r.market_cell_count) process.exit(1);
          if(r.market_cells.some(x=>x.rights_admitted||x.evidence_admitted||x.collection_authorized||x.claim_authorized||x.named_provider_selected||x.production!=='HOLD'||x.public_release!=='HOLD')) process.exit(1);
          const required=['NO_CURRENT_PRICE_OR_TRANSACTION_CLAIM','NO_POPULATION_OR_SCARCITY_CLAIM','NO_LIQUIDITY_OR_TIME_TO_SALE_CLAIM'];
          for(const x of required) if(!r.cannot_yet_claim_summary.includes(x)) process.exit(1);
          for(const x of ['AUTONOMOUS_REQUIRES_REGISTERED_EXECUTION_PATH','GLOBAL_REQUIRES_EMPIRICAL_MARGINAL_COVERAGE','IRREPLACEABLE_VALUE_MUST_ACCRUE_TO_KIDULTS_OWNED_INTELLIGENCE_ASSETS','TRANSPARENT_SOURCE_SELECTION_REQUIRES_REASON_AND_EVIDENCE_RECEIPT']) if(!r.rules.includes(x)) process.exit(1);
          console.log('Global Source Mesh four-direction fail-closed validation PASS');
          NODE
      - name: Reject priority-score permission promotion mutation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/kidults-global-source-mesh-v1.json','utf8'));
          x.market_cells[0].collection_authorized=true;
          fs.writeFileSync('/tmp/bad-priority-permission-mesh.json',JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs --mesh /tmp/bad-priority-permission-mesh.json; then
            echo 'Validator accepted priority-created collection permission' >&2
            exit 1
          fi
      - name: Emit KPMO sourcing direction receipt
        run: |
          node - <<'NODE' >/tmp/kidults-asi-sourcing-direction-kpmo-receipt-v2.json
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/kidults-global-source-mesh-v1.json','utf8'));
          process.stdout.write(JSON.stringify({
            id:'kidults-asi-sourcing-direction-kpmo-receipt-v2',
            state:'VERIFIED_PASS',
            trigger_event:process.env.GITHUB_EVENT_NAME,
            sourcing_direction_order:r.sourcing_direction_order,
            source_selection_model:r.source_selection_model,
            source_universe_target:r.source_universe_target,
            market_cells:r.market_cell_count,
            direction_floor_pass_count:r.direction_floor_pass_count,
            execution_wave_order:r.execution_wave_order,
            autonomous_effect:'POSITIVE',
            global_effect:'POSITIVE',
            irreplaceable_value_effect:'POSITIVE',
            transparency_effect:'POSITIVE',
            source_count_is_not_goal:true,
            provider_first_selection_forbidden:true,
            priority_score_is_tiebreaker_only:true,
            rights_admitted:false,
            collection_authorized:false,
            claim_authorized:false,
            public_release:'HOLD',
            production:'HOLD',
            evidence_ref:'/tmp/kidults-global-source-mesh-v1.json',
            source_hash_sha256:r.source_hash_sha256
          },null,2));
          NODE
          cat /tmp/kidults-asi-sourcing-direction-kpmo-receipt-v2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-global-source-mesh-v1
          path: |
            /tmp/kidults-global-source-mesh-v1.json
            /tmp/asi-sourcing-direction-validation-v2.json
            /tmp/asi-sourcing-direction-mesh-validation-v2.json
            /tmp/kidults-asi-sourcing-direction-kpmo-receipt-v2.json
          if-no-files-found: error
          retention-days: 90
