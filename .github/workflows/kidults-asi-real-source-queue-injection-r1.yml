name: KIDULTS ASI Real Source Queue Injection R1

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/scripts/asi-real-source-queue-injection-r1.mjs'
      - '.github/workflows/kidults-asi-real-source-queue-injection-r1.yml'
      - 'scripts/kidults/source-intelligence/build-real-source-processor-bridge-r1.mjs'
      - 'scripts/kidults/source-intelligence/run-met-real-source-admission-r1.mjs'
      - 'scripts/kidults/source-intelligence/run-getty-historical-sale-r1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-source-queue-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve live Met identity/context artifact
        run: node scripts/kidults/source-intelligence/run-met-real-source-admission-r1.mjs /tmp/met-real-source-admission-r1.json
      - name: Retrieve live Getty historical transaction artifact
        run: node scripts/kidults/source-intelligence/run-getty-historical-sale-r1.mjs /tmp/getty-historical-sale-r1.json
      - name: Build canonical admitted-source bridge
        run: node scripts/kidults/source-intelligence/build-real-source-processor-bridge-r1.mjs /tmp/met-real-source-admission-r1.json /tmp/getty-historical-sale-r1.json /tmp/asi-real-source-processor-bridge-r1.json
      - name: Install ASI runtime dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci
      - name: Inject Getty admitted record through canonical Queue/D1 path
        working-directory: services/kidults-autonomous-intelligence
        run: node scripts/asi-real-source-queue-injection-r1.mjs /tmp/asi-real-source-processor-bridge-r1.json
      - name: Preserve fail-closed boundary
        run: |
          node -e "const x=require('/tmp/asi-real-source-processor-bridge-r1.json'); if(x.market_event_admission_report.current_market_event!=='NOT_EVIDENCED'||x.candidate_handoff_preflight.ready!==false||x.production_mutation!==false) process.exit(1); console.log('Real-source Queue/D1 injection PASS; current-market and Candidate gates remain closed.')"
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-asi-real-source-queue-injection-r1
          path: |
            /tmp/met-real-source-admission-r1.json
            /tmp/getty-historical-sale-r1.json
            /tmp/asi-real-source-processor-bridge-r1.json
          if-no-files-found: error
          retention-days: 30
