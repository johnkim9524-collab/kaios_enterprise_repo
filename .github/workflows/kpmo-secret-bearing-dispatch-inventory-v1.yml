name: KPMO Secret-Bearing Dispatch Inventory V1

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enforce complete privileged-manual-lane inventory without reading secrets
        run: node scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs --enforce-registry
