name: KIDULTS ASI Sharded Source Reserve v1

on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/kidults/source-intelligence/build-asi-sharded-source-reserve-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-provenance-v1.mjs'
      - 'coordination/kidults/governance/ai-agent-github-bootstrap-contract-v1.json'
      - 'coordination/kidults/kpmo/operating-principles-and-resilience-controls-v1.json'
      - 'package.json'
      - 'scripts/governance/bootstrap-ai-agent-from-github-v1.mjs'
      - 'scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs'
      - 'scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs'
      - '.github/workflows/kidults-asi-sharded-source-reserve-v1.yml'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Global Any-Site Hourly Pooling v2'
    branches: [main]
    types: [completed]
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/build-asi-sharded-source-reserve-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-provenance-v1.mjs'
      - 'coordination/kidults/governance/ai-agent-github-bootstrap-contract-v1.json'
      - 'coordination/kidults/kpmo/operating-principles-and-resilience-controls-v1.json'
      - 'package.json'
      - 'scripts/governance/bootstrap-ai-agent-from-github-v1.mjs'
      - 'scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs'
      - 'scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs'
      - '.github/workflows/kidults-asi-sharded-source-reserve-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-sharded-source-reserve-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  validate-sharded-source-reserve-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify mandatory GitHub-source agent bootstrap
        run: |
          set -euo pipefail
          node --check scripts/governance/bootstrap-ai-agent-from-github-v1.mjs
          node --check scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs
          node --check scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
          export KIDULTS_BOOTSTRAP_NONCE="$(openssl rand -base64 48 | tr -d '\n')"
          TASK_ID="reserve-contract-${GITHUB_RUN_ID}"
          SESSION_ID="reserve-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}"
          BOOTSTRAP_RESULT="$(node scripts/governance/bootstrap-ai-agent-from-github-v1.mjs \
            --require-clean \
            --agent-id ASI_RESERVE_CONTRACT_CI \
            --agent-class ASI \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA")"
          RECEIPT_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.receipt_path)' "$BOOTSTRAP_RESULT")"
          VERIFY_RESULT="$(node scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs \
            --receipt "$RECEIPT_PATH" \
            --agent-id ASI_RESERVE_CONTRACT_CI \
            --agent-class ASI \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --consume \
            )"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.state!=="BOOTSTRAP_VERIFIED"||x.consumed!==true||x.task_dispatch_allowed_for_bound_task_session!==true||x.working_sha!==process.env.EXPECTED_SHA) throw new Error("BOOTSTRAP_VERIFICATION_RESULT_INVALID")' "$VERIFY_RESULT"
          printf '%s\n' "$VERIFY_RESULT"
          node scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
      - name: Validate reserve contract without producer artifact consumption
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-sharded-source-reserve-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-provenance-v1.mjs
          node scripts/kidults/kpmo/validate-sharded-reserve-assurance-watch-v1.mjs

  rolling-live-reserve:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify mandatory GitHub-source agent bootstrap
        run: |
          set -euo pipefail
          node --check scripts/governance/bootstrap-ai-agent-from-github-v1.mjs
          node --check scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs
          node --check scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
          export KIDULTS_BOOTSTRAP_NONCE="$(openssl rand -base64 48 | tr -d '\n')"
          TASK_ID="rolling-reserve-${GITHUB_RUN_ID}"
          SESSION_ID="rolling-reserve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}"
          BOOTSTRAP_RESULT="$(node scripts/governance/bootstrap-ai-agent-from-github-v1.mjs \
            --require-clean \
            --agent-id ASI_ROLLING_RESERVE \
            --agent-class ASI \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA")"
          RECEIPT_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.receipt_path)' "$BOOTSTRAP_RESULT")"
          VERIFY_RESULT="$(node scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs \
            --receipt "$RECEIPT_PATH" \
            --agent-id ASI_ROLLING_RESERVE \
            --agent-class ASI \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --consume \
            )"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.state!=="BOOTSTRAP_VERIFIED"||x.consumed!==true||x.task_dispatch_allowed_for_bound_task_session!==true||x.working_sha!==process.env.EXPECTED_SHA) throw new Error("BOOTSTRAP_VERIFICATION_RESULT_INVALID")' "$VERIFY_RESULT"
          printf '%s\n' "$VERIFY_RESULT"
          node scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
      - name: Verify exact source, syntax, provenance and autonomous trigger
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-sharded-source-reserve-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-provenance-v1.mjs
          node - <<'NODE'
          const fs=require('fs');const p=fs.readFileSync('.github/workflows/kidults-asi-sharded-source-reserve-v1.yml','utf8');
          for(const marker of ['workflow_dispatch:','schedule:','push:','workflow_run:'])if(!p.includes(marker))throw new Error(`MISSING_AUTONOMOUS_TRIGGER:${marker}`);
          const c=JSON.parse(fs.readFileSync('coordination/kidults/kpmo/operating-principles-and-resilience-controls-v1.json','utf8'));
          if(JSON.stringify(c.constitutional_order)!==JSON.stringify(['AUTONOMOUS','GLOBAL','IRREPLACEABLE_VALUE','TRANSPARENT']))throw new Error('PLATFORM_PRINCIPLE_ORDER');
          if(c.autonomous_activation_rule?.manual_only_normal_activation_forbidden!==true)throw new Error('MANUAL_ONLY_NOT_FORBIDDEN');
          NODE
      - name: Restore producer-bound discovery and previous successful reserve
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery-out /tmp/reserve-discovery /tmp/previous-asi-sharded-source-reserve-v1
          TARGET_SHA="$EXPECTED_SHA"
          VALIDATION_ONLY=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            TARGET_SHA="$PR_BASE_SHA"
            VALIDATION_ONLY=true
          fi

          validate_discovery_run() {
            local run_id="$1" expected_sha="$2" payload
            payload="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg sha "$expected_sha" \
              '.conclusion=="success"
               and .head_branch=="main"
               and .head_sha==$sha
               and .repository.full_name==$repo
               and .path==".github/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml"' \
              <<<"$payload" >/dev/null || {
                echo "discovery producer run failed exact repository/main/SHA/workflow binding" >&2
                exit 67
              }
          }

          exact_discovery_artifact() {
            local run_id="$1" payload count
            payload="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            count="$(jq '[.artifacts[] | select(.name=="kidults-asi-global-any-site-hourly-cycle-v2" and .expired==false)] | length' <<<"$payload")"
            [ "$count" -eq 1 ] || {
              echo "expected exactly one producer-bound v2 discovery artifact for run ${run_id}; got ${count}" >&2
              exit 68
            }
            jq -r '[.artifacts[] | select(.name=="kidults-asi-global-any-site-hourly-cycle-v2" and .expired==false)][0].id' <<<"$payload"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            test -n "$UPSTREAM_RUN_ID"
            test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$UPSTREAM_HEAD_BRANCH" = "main"
            test "$UPSTREAM_HEAD_SHA" = "$EXPECTED_SHA"
            DISCOVERY_RUN_ID="$UPSTREAM_RUN_ID"
          else
            RUNS="$(gh api --method GET -H 'Accept: application/vnd.github+json' \
              -f branch=main -f status=success -f per_page=100 \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml/runs")"
            DISCOVERY_RUN_ID="$(jq -r --arg sha "$TARGET_SHA" \
              '[.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success")] | sort_by(.updated_at) | reverse | .[0].id // empty' \
              <<<"$RUNS")"
            if [ -z "$DISCOVERY_RUN_ID" ]; then
              echo "no successful v2 discovery producer exists on exact target SHA ${TARGET_SHA}; emitting WAITING/HOLD receipt"
              {
                echo "KIDULTS_RESERVE_PRODUCER_STATE=WAITING_FOR_EXACT_DISCOVERY_PRODUCER"
                echo "KIDULTS_RESERVE_DISCOVERY_RUN_ID=NONE"
                echo "KIDULTS_RESERVE_DISCOVERY_HEAD_SHA=${TARGET_SHA}"
                echo "KIDULTS_RESERVE_DISCOVERY_ARTIFACT_ID=NONE"
                echo "KIDULTS_RESERVE_PREVIOUS_RUN_ID=NONE"
                echo "KIDULTS_RESERVE_PREVIOUS_ARTIFACT_ID=NONE"
                echo "KIDULTS_RESERVE_VALIDATION_ONLY=${VALIDATION_ONLY}"
              } >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          validate_discovery_run "$DISCOVERY_RUN_ID" "$TARGET_SHA"
          DISCOVERY_ID="$(exact_discovery_artifact "$DISCOVERY_RUN_ID")"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DISCOVERY_ID}/zip" > /tmp/reserve-discovery.zip
          unzip -q -o /tmp/reserve-discovery.zip -d /tmp/reserve-discovery
          SRC="$(find /tmp/reserve-discovery -type f -name global-low-risk-discovery-governed-v2.json -print -quit)"
          test -n "$SRC"
          cp "$SRC" discovery-out/global-low-risk-discovery.json

          PREV_RUNS="$(gh api --method GET -H 'Accept: application/vnd.github+json' \
            -f branch=main -f status=success -f per_page=100 \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-sharded-source-reserve-v1.yml/runs")"
          PREV_RUN_ID=""
          PREV_ID=""
          mapfile -t PREV_CANDIDATES < <(jq -r --argjson current "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.id != $current and .conclusion=="success" and .head_branch=="main")] | sort_by(.updated_at) | reverse | .[].id' \
            <<<"$PREV_RUNS")
          for CANDIDATE_RUN_ID in "${PREV_CANDIDATES[@]}"; do
            PREV_ARTIFACTS="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100")"
            PREV_COUNT="$(jq '[.artifacts[] | select(.name=="kidults-asi-sharded-source-reserve-v1" and .expired==false)] | length' <<<"$PREV_ARTIFACTS")"
            if [ "$PREV_COUNT" -gt 1 ]; then
              echo "previous successful reserve run ${CANDIDATE_RUN_ID} exposes ambiguous reserve artifacts" >&2
              exit 70
            fi
            if [ "$PREV_COUNT" -eq 1 ]; then
              PREV_RUN_ID="$CANDIDATE_RUN_ID"
              PREV_ID="$(jq -r '[.artifacts[] | select(.name=="kidults-asi-sharded-source-reserve-v1" and .expired==false)][0].id' <<<"$PREV_ARTIFACTS")"
              break
            fi
          done
          if [ -n "$PREV_ID" ]; then
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREV_ID}/zip" > /tmp/previous-reserve.zip
            unzip -q -o /tmp/previous-reserve.zip -d /tmp/previous-asi-sharded-source-reserve-v1
          fi

          {
            echo "KIDULTS_RESERVE_PRODUCER_STATE=READY"
            echo "KIDULTS_RESERVE_DISCOVERY_RUN_ID=${DISCOVERY_RUN_ID}"
            echo "KIDULTS_RESERVE_DISCOVERY_HEAD_SHA=${TARGET_SHA}"
            echo "KIDULTS_RESERVE_DISCOVERY_ARTIFACT_ID=${DISCOVERY_ID}"
            echo "KIDULTS_RESERVE_PREVIOUS_RUN_ID=${PREV_RUN_ID:-NONE}"
            echo "KIDULTS_RESERVE_PREVIOUS_ARTIFACT_ID=${PREV_ID:-NONE}"
            echo "KIDULTS_RESERVE_VALIDATION_ONLY=${VALIDATION_ONLY}"
          } >> "$GITHUB_ENV"

          echo "discovery_producer_run_id=$DISCOVERY_RUN_ID"
          echo "discovery_producer_head_sha=$TARGET_SHA"
          echo "discovery_artifact_id=$DISCOVERY_ID"
          echo "previous_successful_reserve_run_id=${PREV_RUN_ID:-NONE}"
          echo "previous_reserve_artifact_id=${PREV_ID:-NONE}"
      - name: Build and validate rolling 256-shard reserve
        if: env.KIDULTS_RESERVE_PRODUCER_STATE == 'READY'
        run: |
          node scripts/kidults/source-intelligence/build-asi-sharded-source-reserve-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/previous-asi-sharded-source-reserve-v1 /tmp/asi-sharded-source-reserve-v1
          node scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-v1.mjs /tmp/asi-sharded-source-reserve-v1
      - name: Reject reserve rights promotion mutation
        if: env.KIDULTS_RESERVE_PRODUCER_STATE == 'READY'
        shell: bash
        run: |
          cp -a /tmp/asi-sharded-source-reserve-v1 /tmp/bad-reserve-rights
          FILE=$(find /tmp/bad-reserve-rights/shards -type f -size +0c -print -quit)
          test -n "$FILE"
          node - "$FILE" <<'NODE'
          const fs=require('fs');const p=process.argv[2];const lines=fs.readFileSync(p,'utf8').trim().split(/\r?\n/);const x=JSON.parse(lines[0]);x.rights_state='ALLOW';lines[0]=JSON.stringify(x);fs.writeFileSync(p,lines.join('\n')+'\n');
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-sharded-source-reserve-v1.mjs /tmp/bad-reserve-rights; then exit 1; fi
      - name: Emit transparent reserve receipt
        if: env.KIDULTS_RESERVE_PRODUCER_STATE == 'READY'
        run: |
          node - <<'NODE' >/tmp/asi-sharded-source-reserve-activation-receipt-v1.json
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/asi-sharded-source-reserve-v1/asi-sharded-source-reserve-manifest-v1.json','utf8'));
          process.stdout.write(JSON.stringify({id:'kidults-asi-sharded-source-reserve-activation-receipt-v1',state:'VERIFIED_PASS',trigger_event:process.env.GITHUB_EVENT_NAME,discovery_producer_run_id:Number(process.env.KIDULTS_RESERVE_DISCOVERY_RUN_ID),discovery_producer_head_sha:process.env.KIDULTS_RESERVE_DISCOVERY_HEAD_SHA,discovery_artifact_id:Number(process.env.KIDULTS_RESERVE_DISCOVERY_ARTIFACT_ID),previous_reserve_run_id:process.env.KIDULTS_RESERVE_PREVIOUS_RUN_ID,previous_reserve_artifact_id:process.env.KIDULTS_RESERVE_PREVIOUS_ARTIFACT_ID,exact_generation_bound:true,validation_only:process.env.KIDULTS_RESERVE_VALIDATION_ONLY==='true',promotion_authority:false,autonomous_effect:'POSITIVE',global_effect:'POSITIVE',irreplaceable_value_effect:'POSITIVE',transparency_effect:'POSITIVE',reserve_cycle:r.cycle_number,reserve_unique_candidates:r.unique_candidate_count,reserve_unique_hosts:r.unique_host_count,reserve_new_candidates:r.new_candidate_count,reserve_updated_candidates:r.updated_candidate_count,reserve_nonempty_shards:r.nonempty_shard_count,reserve_design_capacity:r.design_capacity_minimum_candidates,reserve_is_not_safe_pool:true,content_acquisition_authorized:false,collection_right_created:false,public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/asi-sharded-source-reserve-activation-receipt-v1.json
      - name: Emit producer-absent WAITING/HOLD receipt
        if: env.KIDULTS_RESERVE_PRODUCER_STATE == 'WAITING_FOR_EXACT_DISCOVERY_PRODUCER'
        run: |
          node - <<'NODE' >/tmp/asi-sharded-source-reserve-waiting-receipt-v1.json
          process.stdout.write(JSON.stringify({id:'kidults-asi-sharded-source-reserve-waiting-receipt-v1',state:'WAITING_FOR_EXACT_DISCOVERY_PRODUCER',trigger_event:process.env.GITHUB_EVENT_NAME,discovery_producer_run_id:'NONE',discovery_producer_head_sha:process.env.KIDULTS_RESERVE_DISCOVERY_HEAD_SHA,discovery_artifact_id:'NONE',exact_generation_bound:false,artifact_cardinality:0,promotion_eligible:false,completion_claim_allowed:false,content_acquisition_authorized:false,collection_right_created:false,public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/asi-sharded-source-reserve-waiting-receipt-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.KIDULTS_RESERVE_PRODUCER_STATE == 'WAITING_FOR_EXACT_DISCOVERY_PRODUCER'
        with:
          name: kidults-asi-sharded-source-reserve-waiting-v1
          path: /tmp/asi-sharded-source-reserve-waiting-receipt-v1.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.KIDULTS_RESERVE_PRODUCER_STATE == 'READY'
        with:
          name: kidults-asi-sharded-source-reserve-v1
          path: |
            /tmp/asi-sharded-source-reserve-v1
            /tmp/asi-sharded-source-reserve-activation-receipt-v1.json
          retention-days: 90
          if-no-files-found: error

  capacity-100k-proof:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify mandatory GitHub-source agent bootstrap
        run: |
          set -euo pipefail
          node --check scripts/governance/bootstrap-ai-agent-from-github-v1.mjs
          node --check scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs
          node --check scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
          export KIDULTS_BOOTSTRAP_NONCE="$(openssl rand -base64 48 | tr -d '\n')"
          TASK_ID="reserve-capacity-${GITHUB_RUN_ID}"
          SESSION_ID="reserve-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}"
          BOOTSTRAP_RESULT="$(node scripts/governance/bootstrap-ai-agent-from-github-v1.mjs \
            --require-clean \
            --agent-id ASI_RESERVE_CAPACITY_CI \
            --agent-class TEST_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA")"
          RECEIPT_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.receipt_path)' "$BOOTSTRAP_RESULT")"
          VERIFY_RESULT="$(node scripts/governance/verify-ai-agent-bootstrap-receipt-v1.mjs \
            --receipt "$RECEIPT_PATH" \
            --agent-id ASI_RESERVE_CAPACITY_CI \
            --agent-class TEST_AGENTS \
            --task-id "$TASK_ID" \
            --session-id "$SESSION_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --consume \
            )"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.state!=="BOOTSTRAP_VERIFIED"||x.consumed!==true||x.task_dispatch_allowed_for_bound_task_session!==true||x.working_sha!==process.env.EXPECTED_SHA) throw new Error("BOOTSTRAP_VERIFICATION_RESULT_INVALID")' "$VERIFY_RESULT"
          printf '%s\n' "$VERIFY_RESULT"
          node scripts/governance/validate-ai-agent-github-bootstrap-v1.mjs
