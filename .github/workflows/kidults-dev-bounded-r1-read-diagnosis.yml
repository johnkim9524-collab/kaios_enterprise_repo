name: KIDULTS DEV Bounded R1 Read Diagnosis
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/kidults-dev-bounded-r1-read-diagnosis.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1: kidults-intelligence-db-dev
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: READ — exact DEV R1 state only
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute "$DEV_D1" --remote --command "SELECT event_id,event_type,correlation_id,received_at FROM asi_event_log WHERE producer_engine='KPMO_DEV_SLO_R1' ORDER BY received_at; SELECT id,event_id,engine_fleet,queue_name,status,attempt_count,last_error FROM asi_outbox WHERE event_id IN (SELECT event_id FROM asi_event_log WHERE producer_engine='KPMO_DEV_SLO_R1') ORDER BY created_at; SELECT queue_name,outbox_id,event_id,status,attempt_count,first_seen_at,last_seen_at,completed_at,last_error FROM asi_processed_messages WHERE event_id IN (SELECT event_id FROM asi_event_log WHERE producer_engine='KPMO_DEV_SLO_R1') ORDER BY first_seen_at; SELECT lease_id,outbox_id,task_event_id,attempt_count,last_error,released_at,release_state FROM asi_task_leases WHERE task_event_id IN (SELECT event_id FROM asi_event_log WHERE producer_engine='KPMO_DEV_SLO_R1') ORDER BY acquired_at; SELECT id,queue_name,source_queue_name,event_id,attempts,error_code,error_message,recorded_at FROM asi_dead_letters WHERE event_id IN (SELECT event_id FROM asi_event_log WHERE producer_engine='KPMO_DEV_SLO_R1') ORDER BY recorded_at" --json > /tmp/diagnosis.json
          node - <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/diagnosis.json','utf8')),rows=i=>x?.[i]?.results||[];const events=rows(0),outboxes=rows(1),processed=rows(2),leases=rows(3),dead=rows(4);const safe={state:'DEV_R1_READ_DIAGNOSIS',events:events.length,event_ids:events.map(r=>r.event_id),outboxes:outboxes.map(r=>({event_id:r.event_id,fleet:r.engine_fleet,queue:r.queue_name,status:r.status,attempts:r.attempt_count,error:r.last_error})),processed:processed.map(r=>({event_id:r.event_id,queue:r.queue_name,status:r.status,attempts:r.attempt_count,error:r.last_error,first:r.first_seen_at,last:r.last_seen_at,completed:r.completed_at})),leases:leases.map(r=>({event_id:r.task_event_id,attempts:r.attempt_count,error:r.last_error,released:r.released_at,state:r.release_state})),dead_letters:dead.map(r=>({event_id:r.event_id,queue:r.queue_name,source_queue:r.source_queue_name,attempts:r.attempts,error_code:r.error_code,error_message:r.error_message,recorded_at:r.recorded_at})),mutation:false};fs.mkdirSync('/tmp/safe',{recursive:true});fs.writeFileSync('/tmp/safe/receipt.json',JSON.stringify(safe,null,2));console.log(JSON.stringify(safe,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-dev-bounded-r1-read-diagnosis
          path: /tmp/safe/receipt.json
          retention-days: 30
          if-no-files-found: error
