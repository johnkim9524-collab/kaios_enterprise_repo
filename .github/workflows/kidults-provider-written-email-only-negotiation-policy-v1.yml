name: KIDULTS Provider Written-Email-Only Negotiation Policy V1

on:
  pull_request:
    paths:
      - 'docs/strategy/IH_GROUP_PROVIDER_WRITTEN_EMAIL_ONLY_NEGOTIATION_POLICY_V1.md'
      - 'coordination/kidults/governance/provider-written-email-only-negotiation-policy-v1.json'
      - 'coordination/kidults/governance/ih-group-provider-sourcing-contract-v1.json'
      - 'coordination/kidults/internalization/partner-pre-send-internalization-gate-v1.json'
      - 'coordination/kidults/internalization/minimum-external-dependency-negotiation-contract-v1.json'
      - 'scripts/kidults/provider/validate-provider-written-email-only-negotiation-policy-v1.mjs'
      - 'scripts/kidults/internalization/validate-partner-pre-send-internalization-gate-v1.mjs'
      - 'scripts/kidults/internalization/validate-minimum-external-dependency-negotiation-v1.mjs'
      - '.github/workflows/kidults-provider-written-email-only-negotiation-policy-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/strategy/IH_GROUP_PROVIDER_WRITTEN_EMAIL_ONLY_NEGOTIATION_POLICY_V1.md'
      - 'coordination/kidults/governance/provider-written-email-only-negotiation-policy-v1.json'
      - 'coordination/kidults/governance/ih-group-provider-sourcing-contract-v1.json'
      - 'coordination/kidults/internalization/partner-pre-send-internalization-gate-v1.json'
      - 'coordination/kidults/internalization/minimum-external-dependency-negotiation-contract-v1.json'
      - 'scripts/kidults/provider/validate-provider-written-email-only-negotiation-policy-v1.mjs'
      - 'scripts/kidults/internalization/validate-partner-pre-send-internalization-gate-v1.mjs'
      - 'scripts/kidults/internalization/validate-minimum-external-dependency-negotiation-v1.mjs'
      - '.github/workflows/kidults-provider-written-email-only-negotiation-policy-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate mandatory written-email-only negotiation strategy
        run: |
          set -euo pipefail
          node --check scripts/kidults/provider/validate-provider-written-email-only-negotiation-policy-v1.mjs
          node --check scripts/kidults/internalization/validate-partner-pre-send-internalization-gate-v1.mjs
          node --check scripts/kidults/internalization/validate-minimum-external-dependency-negotiation-v1.mjs
          node scripts/kidults/provider/validate-provider-written-email-only-negotiation-policy-v1.mjs
          node scripts/kidults/internalization/validate-partner-pre-send-internalization-gate-v1.mjs
          node scripts/kidults/internalization/validate-minimum-external-dependency-negotiation-v1.mjs
