name: KIDULTS Atomic Governed Landing V1
run-name: "KIDULTS Atomic Landing PR #${{ inputs.pull_request_number }} @ ${{ inputs.expected_head_sha }} / ${{ inputs.landing_authorization_id }}"

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Exact pull request number
        required: true
        type: string
      expected_base_sha:
        description: Exact current protected-main SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character pull request head SHA
        required: true
        type: string
      expected_head_tree_sha:
        description: Exact tree SHA of the approved pull request head
        required: true
        type: string
      landing_authorization_id:
        description: LAND-PR-<number>-<first-12-head-sha>
        required: true
        type: string
      event_emitting_transport_wait_seconds:
        description: Direct Owner event-emitting merge window, 60-900 seconds
        required: true
        default: '600'
        type: string

concurrency:
  group: kidults-atomic-governed-landing-v1-main
  cancel-in-progress: false

jobs:
  atomic-governed-landing:
    name: Atomic governed landing executor
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout protected main implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify protected main checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main

      # Every dispatch gets a sanitized, fail-closed receipt before any gate can
      # stop the job. This guarantees durable evidence for malformed tuples
      # without consuming approval or creating merge authority.
      - name: Initialize fail-closed atomic dispatch terminal receipt
        env:
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          LANDING_AUTHORIZATION_ID: ${{ inputs.landing_authorization_id }}
          LANDING_ACTOR: ${{ github.actor }}
          ATOMIC_LANDING_TERMINAL_RECEIPT_PATH: ${{ runner.temp }}/kidults-atomic-landing-terminal/receipt.json
        run: node scripts/kidults/kpmo/initialize-atomic-dispatch-terminal-receipt-v1.mjs

      - name: Require base-workflow to candidate terminal handoff compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: node scripts/kidults/kpmo/run-atomic-landing-handoff-preflight-v1.mjs

      - name: Verify event-emitting merge transport before authority consumption
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_TREE_SHA: ${{ inputs.expected_head_tree_sha }}
          LANDING_ACTOR: ${{ github.actor }}
          ATOMIC_EVENT_TRANSPORT_WAIT_SECONDS: ${{ inputs.event_emitting_transport_wait_seconds }}
          ATOMIC_EVENT_TRANSPORT_RECEIPT_PATH: ${{ runner.temp }}/kpmo-atomic-landing/event-transport-availability.json
        run: node scripts/kidults/kpmo/run-atomic-event-emitting-transport-preflight-v1.mjs

      # Lifecycle authority and the complete exact-head Program Owner approval
      # contract are validated before the one-use authorization is consumed.
      # Missing/stale/RED lifecycle or malformed/expired/overlong approval must
      # fail without burning an otherwise valid landing generation.
      - name: Require latest terminal exact-head lifecycle authority
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_TREE_SHA: ${{ inputs.expected_head_tree_sha }}
          LANDING_AUTHORIZATION_ID: ${{ inputs.landing_authorization_id }}
          LANDING_ACTOR: ${{ github.actor }}
          LIFECYCLE_AUTHORITY_PATH: ${{ runner.temp }}/kpmo-atomic-landing/lifecycle-authority.json
        run: node scripts/kidults/kpmo/run-atomic-landing-lifecycle-preflight-v1.mjs

      - name: Consume one-use exact-head landing authorization
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_TREE_SHA: ${{ inputs.expected_head_tree_sha }}
          LANDING_AUTHORIZATION_ID: ${{ inputs.landing_authorization_id }}
          LANDING_ACTOR: ${{ github.actor }}
          ATOMIC_LANDING_CONSUMPTION_PATH: ${{ runner.temp }}/kidults-atomic-landing-consumption/receipt.json
        run: node scripts/kidults/kpmo/run-atomic-landing-one-use-preflight-v1.mjs

      - name: Stage trusted Current-SOLD post-landing validator
        run: |
          set -euo pipefail
          install -m 0500 \
            scripts/kidults/market/current-sold-postlanding-v1.mjs \
            "$RUNNER_TEMP/current-sold-postlanding-v1.mjs"

      - name: Initialize durable atomic landing terminal receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_TREE_SHA: ${{ inputs.expected_head_tree_sha }}
          LANDING_AUTHORIZATION_ID: ${{ inputs.landing_authorization_id }}
          LANDING_ACTOR: ${{ github.actor }}
          ATOMIC_LANDING_CONSUMPTION_PATH: ${{ runner.temp }}/kidults-atomic-landing-consumption/receipt.json
          ATOMIC_EVENT_TRANSPORT_RECEIPT_PATH: ${{ runner.temp }}/kpmo-atomic-landing/event-transport-availability.json
          ATOMIC_LANDING_TERMINAL_RECEIPT_PATH: ${{ runner.temp }}/kidults-atomic-landing-terminal/receipt.json
        run: node scripts/kidults/kpmo/reconcile-atomic-landing-terminal-v1.mjs --initialize

      - name: Upload pre-mutation atomic landing intent
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-atomic-governed-landing-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-atomic-landing-terminal/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Re-read live authority and await exact-head event-emitting merge
        id: landing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_TREE_SHA: ${{ inputs.expected_head_tree_sha }}
          LANDING_AUTHORIZATION_ID: ${{ inputs.landing_authorization_id }}
          LANDING_ACTOR: ${{ github.actor }}
          ATOMIC_LANDING_CONSUMPTION_PATH: ${{ runner.temp }}/kidults-atomic-landing-consumption/receipt.json
          LIFECYCLE_AUTHORITY_PATH: ${{ runner.temp }}/kpmo-atomic-landing/lifecycle-authority.json
          ATOMIC_EVENT_TRANSPORT_WAIT_SECONDS: ${{ inputs.event_emitting_transport_wait_seconds }}
          ATOMIC_EVENT_TRANSPORT_RECEIPT_PATH: ${{ runner.temp }}/kpmo-atomic-landing/event-transport-availability.json
        run: node scripts/kidults/kpmo/run-atomic-governed-landing-v1.mjs

      - name: Consume exact merge-SHA protected-main push suite
        id: postmerge_push_suite
        if: steps.landing.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_TREE_SHA: ${{ inputs.expected_head_tree_sha }}
          EXACT_MERGE_SHA: ${{ steps.landing.outputs.merge_commit_sha }}
          MERGED_AT: ${{ steps.landing.outputs.merged_at }}
          ATOMIC_POSTMERGE_PUSH_SUITE_RECEIPT_PATH: ${{ runner.temp }}/kidults-atomic-landing-postmerge/receipt.json
          POSTMERGE_PUSH_SUITE_POLICY_PATH: coordination/kidults/kpmo/direct-owner-postmerge-push-suite-policy-v1.json
          POSTMERGE_PUSH_SUITE_WAIT_SECONDS: '120'
        run: node scripts/kidults/kpmo/consume-atomic-postmerge-push-suite-v1.mjs

      - name: Checkout exact merged Current-SOLD target
        if: steps.landing.outputs.current_sold_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ steps.landing.outputs.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact merged Current-SOLD checkout
        if: steps.landing.outputs.current_sold_changed == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.landing.outputs.merge_commit_sha }}"

      - name: Set up Node for Current-SOLD post-landing validation
        if: steps.landing.outputs.current_sold_changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false

      - name: Validate exact merged Current-SOLD target and publish commit status
        id: current_sold_postlanding
        if: steps.landing.outputs.current_sold_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_SOLD_MERGE_SHA: ${{ steps.landing.outputs.merge_commit_sha }}
          CURRENT_SOLD_PREMERGE_MAIN_SHA: ${{ steps.landing.outputs.premerge_main_sha }}
          CURRENT_SOLD_MERGED_PR_HEAD_SHA: ${{ steps.landing.outputs.merged_pr_head_sha }}
          CURRENT_SOLD_PR_NUMBER: ${{ steps.landing.outputs.pull_request_number }}
          CURRENT_SOLD_LANDING_RUN_ID: ${{ steps.landing.outputs.landing_run_id }}
          CURRENT_SOLD_LANDING_RUN_ATTEMPT: ${{ steps.landing.outputs.landing_run_attempt }}
          CURRENT_SOLD_LANDING_AUTHORIZATION_ID: ${{ steps.landing.outputs.landing_authorization_id }}
          CURRENT_SOLD_RECEIPT_PATH: out/current-sold-postlanding/receipt.json
          ATOMIC_POSTMERGE_PUSH_SUITE_OUTCOME: ${{ steps.postmerge_push_suite.outcome }}
          ATOMIC_POSTMERGE_PUSH_SUITE_RECEIPT_PATH: ${{ runner.temp }}/kidults-atomic-landing-postmerge/receipt.json
        run: node "$RUNNER_TEMP/current-sold-postlanding-v1.mjs"

      - name: Upload exact merged Current-SOLD post-landing receipt
        if: ${{ always() && steps.landing.outputs.current_sold_changed == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-current-sold-postlanding-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/current-sold-postlanding
          if-no-files-found: error
          retention-days: 30

      - name: Reconcile durable atomic landing terminal receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HEAD_TREE_SHA: ${{ inputs.expected_head_tree_sha }}
          LANDING_AUTHORIZATION_ID: ${{ inputs.landing_authorization_id }}
          LANDING_ACTOR: ${{ github.actor }}
          LANDING_STEP_OUTCOME: ${{ steps.landing.outcome }}
          CURRENT_SOLD_POSTLANDING_OUTCOME: ${{ steps.current_sold_postlanding.outcome }}
          CURRENT_SOLD_CHANGED: ${{ steps.landing.outputs.current_sold_changed }}
          CURRENT_SOLD_RECEIPT_PATH: out/current-sold-postlanding/receipt.json
          ATOMIC_POSTMERGE_PUSH_SUITE_OUTCOME: ${{ steps.postmerge_push_suite.outcome }}
          ATOMIC_POSTMERGE_PUSH_SUITE_RECEIPT_PATH: ${{ runner.temp }}/kidults-atomic-landing-postmerge/receipt.json
          ATOMIC_LANDING_CONSUMPTION_PATH: ${{ runner.temp }}/kidults-atomic-landing-consumption/receipt.json
          ATOMIC_EVENT_TRANSPORT_RECEIPT_PATH: ${{ runner.temp }}/kpmo-atomic-landing/event-transport-availability.json
          ATOMIC_LANDING_TERMINAL_RECEIPT_PATH: ${{ runner.temp }}/kidults-atomic-landing-terminal/receipt.json
        run: node scripts/kidults/kpmo/reconcile-atomic-landing-terminal-v1.mjs --finalize

      - name: Upload durable atomic landing terminal receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-atomic-governed-landing-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kidults-atomic-landing-terminal/receipt.json
          if-no-files-found: error
          retention-days: 90
