name: KIDULTS Institutional Trust Red-Team V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/institutional-trust-risk-controls-v1.json'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-institutional-trust-risk-controls-v1.mjs'
      - '.github/workflows/kidults-institutional-trust-redteam-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/kpmo/institutional-trust-risk-controls-v1.json'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-institutional-trust-risk-controls-v1.mjs'
      - '.github/workflows/kidults-institutional-trust-redteam-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate institutional-grade trust attack controls
        run: node scripts/kidults/kpmo/validate-institutional-trust-risk-controls-v1.mjs
