name: KIDULTS Operating Principles Resilience V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/operating-principles-and-resilience-controls-v1.json'
      - 'coordination/kidults/kpmo/operational-resilience-hedges-v1.json'
      - 'coordination/kidults/kpmo/autonomous-intelligence-behavior-control-v1.json'
      - 'coordination/kidults/kpmo/autonomy-safety-controls-v1.json'
      - 'coordination/kidults/kpmo/verified-intelligence-surface-baseline-v1.json'
      - 'scripts/kidults/kpmo/validate-operating-principles-resilience-v1.mjs'
      - '.github/workflows/kidults-operating-principles-resilience-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/kpmo/operating-principles-and-resilience-controls-v1.json'
      - 'coordination/kidults/kpmo/operational-resilience-hedges-v1.json'
      - 'coordination/kidults/kpmo/autonomous-intelligence-behavior-control-v1.json'
      - 'coordination/kidults/kpmo/autonomy-safety-controls-v1.json'
      - 'coordination/kidults/kpmo/verified-intelligence-surface-baseline-v1.json'
      - 'scripts/kidults/kpmo/validate-operating-principles-resilience-v1.mjs'
      - '.github/workflows/kidults-operating-principles-resilience-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validate four operating principles and resilience invariants
        run: node scripts/kidults/kpmo/validate-operating-principles-resilience-v1.mjs
