name: KIDULTS Projection Dry-Run

on:
  pull_request:
    paths:
      - 'coordination/kidults/projection-dry-run/**'
      - 'scripts/kidults/projection/validate-projection-dry-run-v1.mjs'
      - 'apps/kidults-enterprise-staging/public/portal-r001/projection-store.js'
      - 'coordination/kidults/audit/unified-audit-control-plane-v1.json'
      - 'coordination/kidults/registry/track/records/track-e-executive-operating-system.json'
      - '.github/workflows/kidults-projection-dry-run.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/projection-dry-run/**'
      - 'scripts/kidults/projection/validate-projection-dry-run-v1.mjs'
      - 'apps/kidults-enterprise-staging/public/portal-r001/projection-store.js'
      - 'coordination/kidults/audit/unified-audit-control-plane-v1.json'
      - 'coordination/kidults/registry/track/records/track-e-executive-operating-system.json'
      - '.github/workflows/kidults-projection-dry-run.yml'

permissions:
  contents: read

jobs:
  projection-dry-run:
    name: Projection Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Execute NON_PROMOTABLE Projection chain
        run: node scripts/kidults/projection/validate-projection-dry-run-v1.mjs
