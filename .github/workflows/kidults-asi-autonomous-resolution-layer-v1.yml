            jq --slurp '.[0] + [.[1]]' \
              /tmp/arl-authoritative-generation-run-pages.json "$PAGE_FILE" \
              > /tmp/arl-authoritative-generation-run-pages.next.json
            mv /tmp/arl-authoritative-generation-run-pages.next.json /tmp/arl-authoritative-generation-run-pages.json
