name: KIDULTS ASI Autonomous Resolution Layer v1
run-name: KIDULTS ARL / ${{ github.event_name == 'workflow_run' && format('p1-{0}', github.event.workflow_run.id) || format('recovery-{0}', github.sha) }}

on:
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-registry-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'coordination/kidults/source-intelligence/scope-registry-v1-to-v2-crosswalk-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p1-market-event-adapter-runtime-contract-v1.json'
      - 'coordination/kidults/source-intelligence/top16-empirical-activation-preflight-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-autonomous-resolution-layer-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-common-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-current-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-replacement-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/source-purpose-rights-gate-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-registry-v1.mjs'
      - 'scripts/kidults/source-intelligence/resolve-asi-orchestration-run-history-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.py'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.test.py'
      - 'docs/kidults/asi/asi-autonomous-resolution-layer-v1.md'
      - '.github/workflows/kidults-asi-autonomous-resolution-layer-v1.yml'
      - 'coordination/kidults/source-intelligence/asi-requirement-adapter-coverage-*.json'
      - 'coordination/kidults/source-intelligence/asi-bonhams-cars-results-adapter-*.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave*-*.json'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/**'
      - 'scripts/kidults/source-intelligence/*requirement-adapter-coverage*.mjs'
      - 'docs/kidults/asi/asi-requirement-adapter-coverage-v1.md'
      - '.github/workflows/kidults-asi-requirement-adapter-coverage-v1.yml'
      - 'scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs'
      - 'scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs'
      - 'scripts/kidults/source-intelligence/test-workflow-run-generation-classification-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-registry-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'coordination/kidults/source-intelligence/scope-registry-v1-to-v2-crosswalk-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p1-market-event-adapter-runtime-contract-v1.json'
      - 'coordination/kidults/source-intelligence/top16-empirical-activation-preflight-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-autonomous-resolution-layer-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-common-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-current-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-replacement-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/source-purpose-rights-gate-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-registry-v1.mjs'
      - 'scripts/kidults/source-intelligence/resolve-asi-orchestration-run-history-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.py'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.test.py'
      - 'docs/kidults/asi/asi-autonomous-resolution-layer-v1.md'
      - '.github/workflows/kidults-asi-autonomous-resolution-layer-v1.yml'
      - 'coordination/kidults/source-intelligence/asi-requirement-adapter-coverage-*.json'
      - 'coordination/kidults/source-intelligence/asi-bonhams-cars-results-adapter-*.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave*-*.json'
      - 'services/kidults-autonomous-intelligence/src/asi/source-adapters/**'
      - 'scripts/kidults/source-intelligence/*requirement-adapter-coverage*.mjs'
      - 'docs/kidults/asi/asi-requirement-adapter-coverage-v1.md'
      - '.github/workflows/kidults-asi-requirement-adapter-coverage-v1.yml'
      - 'scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs'
      - 'scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs'
      - 'scripts/kidults/source-intelligence/test-workflow-run-generation-classification-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs'
  workflow_run:
    workflows:
      - 'KIDULTS ASI P1 Source Preflight v1'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-autonomous-resolution-layer-v1-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  validate-autonomous-resolution-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Validate autonomous-resolution contract without producer artifact consumption
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-autonomous-resolution-layer-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-common-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-current-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-replacement-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/source-purpose-rights-gate-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-registry-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs
          node --check scripts/kidults/source-intelligence/resolve-asi-orchestration-run-history-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs
          node --check scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs
          node --check scripts/kidults/source-intelligence/test-workflow-run-generation-classification-v1.mjs
          node scripts/kidults/source-intelligence/test-workflow-run-generation-classification-v1.mjs
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py scripts/kidults/kpmo/validate-safe-zip-archive-v1.test.py
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.test.py
          node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-registry-v1.mjs

  request-p1-recovery:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Defer canonical publication to exact P1 workflow-run leader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api --method GET -H 'Accept: application/vnd.github+json' \
            -f branch=main -f per_page=100 \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-p1-source-preflight-v1.yml/runs" \
            > /tmp/p1-recovery-leadership-runs.json
          ACTIVE_P1_RUN_ID=$(jq -r --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.name=="KIDULTS ASI P1 Source Preflight v1" and .path==".github/workflows/kidults-asi-p1-source-preflight-v1.yml" and .head_branch=="main" and .head_sha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending"))] | sort_by(.created_at) | reverse | .[0].id // empty' \
            /tmp/p1-recovery-leadership-runs.json)
          RECOVERY_DISPATCHED=false
          if [ -z "$ACTIVE_P1_RUN_ID" ]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              -f ref=main \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-p1-source-preflight-v1.yml/dispatches"
            RECOVERY_DISPATCHED=true
          fi
          ACTIVE_P1_RUN_ID="$ACTIVE_P1_RUN_ID" RECOVERY_DISPATCHED="$RECOVERY_DISPATCHED" node - <<'NODE' >/tmp/kidults-asi-autonomous-resolution-recovery-v1.json
          process.stdout.write(JSON.stringify({
            id:'kidults-asi-autonomous-resolution-recovery-receipt-v1',
            version:'1.0.0',
            state:'DEFERRED_TO_WORKFLOW_RUN_PRODUCER',
            source_sha:process.env.GITHUB_SHA,
            recovery_request_run_id:Number(process.env.GITHUB_RUN_ID),
            active_p1_run_id:process.env.ACTIVE_P1_RUN_ID?Number(process.env.ACTIVE_P1_RUN_ID):null,
            recovery_dispatch_performed:process.env.RECOVERY_DISPATCHED==='true',
            artifact_role:'RECOVERY_NON_CONSUMABLE',
            authoritative_producer:false,
            downstream_consumable:false,
            canonical_artifact_published:false,
            exact_generation_leader:'WORKFLOW_RUN_BOUND_TO_P1_RUN_ID',
            production:'HOLD',public_release:'HOLD',g5:'HOLD'
          },null,2)+'\n');
          NODE
          cat /tmp/kidults-asi-autonomous-resolution-recovery-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-autonomous-resolution-recovery-v1-${{ github.run_id }}
          path: /tmp/kidults-asi-autonomous-resolution-recovery-v1.json
          retention-days: 30
          if-no-files-found: error


  classify-p1-generation:
    if: github.event_name == 'workflow_run'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      reason: ${{ steps.classify.outputs.reason }}
      current_main_sha: ${{ steps.classify.outputs.current_main_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Classify immutable P1 producer generation
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA=$(gh api -H 'Accept: application/vnd.github+json'             "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          node scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs             "$GITHUB_EVENT_PATH"             "$CURRENT_MAIN_SHA"             "$GITHUB_SHA"             "$GITHUB_REPOSITORY"             '.github/workflows/kidults-asi-p1-source-preflight-v1.yml'             /tmp/arl-p1-generation-classification-v1.json
          echo "classification=$(jq -r .classification /tmp/arl-p1-generation-classification-v1.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r .reason /tmp/arl-p1-generation-classification-v1.json)" >> "$GITHUB_OUTPUT"
          echo "current_main_sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"
          cat /tmp/arl-p1-generation-classification-v1.json
      - name: Retain immutable P1 generation classification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-arl-p1-generation-classification-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/arl-p1-generation-classification-v1.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve invalid-trigger RED after receipt retention
        if: steps.classify.outputs.classification == 'INVALID_TRIGGER'
        run: exit 1

  resolve-current-p1-actions:
    needs: classify-p1-generation
    if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.classify-p1-generation.outputs.classification == 'CURRENT_MAIN_EXACT'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source and autonomous-resolution syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-autonomous-resolution-layer-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-common-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-current-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/asi-autonomous-resolution-replacement-v1.mjs
          node --check scripts/kidults/source-intelligence/lib/source-purpose-rights-gate-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-registry-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs
          node --check scripts/kidults/source-intelligence/resolve-asi-orchestration-run-history-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs
          node --check scripts/kidults/source-intelligence/classify-workflow-run-generation-v1.mjs
          node --check scripts/kidults/source-intelligence/test-workflow-run-generation-classification-v1.mjs
          node scripts/kidults/source-intelligence/test-workflow-run-generation-classification-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-orchestration-run-history-v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-contract-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-registry-v1.json','utf8'))"
      - name: Validate registered resolution engines and automatic activation
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-registry-v1.mjs \
            | tee /tmp/kidults-asi-autonomous-resolution-layer-registry-validation-v1.json
      - name: Restore exact producer-bound P1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_PATH: ${{ github.event.workflow_run.path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-expanded /tmp/p1-input
          CURRENT_SHA=$(git rev-parse HEAD)
          TARGET_SHA="$CURRENT_SHA"
          VALIDATION_ONLY=false
          test "$GITHUB_EVENT_NAME" = workflow_run
          test -n "$UPSTREAM_RUN_ID"
          test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$UPSTREAM_HEAD_BRANCH" = main
          test "$UPSTREAM_HEAD_SHA" = "$CURRENT_SHA"
          test "$UPSTREAM_PATH" = '.github/workflows/kidults-asi-p1-source-preflight-v1.yml'
          P1_RUN_ID="$UPSTREAM_RUN_ID"
          P1_SOURCE_SHA="$UPSTREAM_HEAD_SHA"
          P1_RECOVERY_DISPATCHED=false
          test -n "$P1_RUN_ID"
          test -n "$P1_SOURCE_SHA"
          test "$P1_SOURCE_SHA" = "$TARGET_SHA"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${P1_RUN_ID}" > /tmp/p1-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$TARGET_SHA" \
            '.repository.full_name==$repo and .name=="KIDULTS ASI P1 Source Preflight v1" and .path==".github/workflows/kidults-asi-p1-source-preflight-v1.yml" and .head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success"' \
            /tmp/p1-run.json >/dev/null
          for ARTIFACT_ATTEMPT in {1..12}; do
            rm -f /tmp/p1-artifact.json
            gh api --method GET -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${P1_RUN_ID}/artifacts?per_page=100" \
              > /tmp/p1-artifacts.json
            P1_ARTIFACT_COUNT=$(P1_RUN_ID="$P1_RUN_ID" P1_SOURCE_SHA="$P1_SOURCE_SHA" node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/p1-artifacts.json','utf8'));
          const matches=(x.artifacts||[]).filter((artifact)=>
            artifact.name==='kidults-asi-p1-source-preflight-v1'&&artifact.expired===false&&
            artifact.workflow_run?.id===Number(process.env.P1_RUN_ID)&&
            artifact.workflow_run?.head_sha===process.env.P1_SOURCE_SHA);
          if(matches.length>1)throw new Error(`P1_ARTIFACT_CARDINALITY:${matches.length}`);
          if(matches.length===1)fs.writeFileSync('/tmp/p1-artifact.json',JSON.stringify(matches[0],null,2));
          process.stdout.write(String(matches.length));
          NODE
            )
            if [ "$P1_ARTIFACT_COUNT" = 1 ]; then break; fi
            if [ "$ARTIFACT_ATTEMPT" -eq 12 ]; then
              echo "EXACT_MAIN_P1_ARTIFACT_NOT_AVAILABLE:${P1_RUN_ID}" >&2
              exit 1
            fi
            sleep 5
          done
          test "$P1_ARTIFACT_COUNT" = 1
          P1_ID=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/p1-artifact.json')).id")
          test -n "$P1_RUN_ID"
          test -n "$P1_SOURCE_SHA"
          test -n "$P1_ID"
          P1_DIGEST=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/p1-artifact.json')).digest")
          test -n "$P1_DIGEST"
          [[ "$P1_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P1_ID}/zip" > /tmp/p1.zip
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
            --archive /tmp/p1.zip \
            --expected-digest "$P1_DIGEST" \
            --receipt /tmp/p1-archive-validation-receipt-v1.json \
            --max-compressed-bytes 4194304 \
            --max-entries 256 \
            --max-entry-uncompressed-bytes 8388608 \
            --max-total-uncompressed-bytes 33554432 \
            --max-compression-ratio 100 \
            --required-basename p0b-source-candidate-registry-v1.json \
            --required-basename p0b-mission-candidate-binding-ledger-v1.json \
            --required-basename p1-gate1-source-safety-decisions-v1.json \
            --required-basename p1-evidence-admission-candidate-register-v1.json \
            --required-basename p1-preflight-action-queue-v1.json
          unzip -q -o /tmp/p1.zip -d /tmp/p1-expanded
          for NAME in \
            p0b-source-candidate-registry-v1.json \
            p0b-mission-candidate-binding-ledger-v1.json \
            p1-gate1-source-safety-decisions-v1.json \
            p1-evidence-admission-candidate-register-v1.json \
            p1-preflight-action-queue-v1.json; do
            mapfile -t FILES < <(find /tmp/p1-expanded -type f -name "$NAME" -print)
            test "${#FILES[@]}" -eq 1
            cp "${FILES[0]}" "/tmp/p1-input/$NAME"
          done
          P1_RUN_ID="$P1_RUN_ID" P1_ID="$P1_ID" P1_SOURCE_SHA="$P1_SOURCE_SHA" CURRENT_SHA="$CURRENT_SHA" P1_DIGEST="$P1_DIGEST" VALIDATION_ONLY="$VALIDATION_ONLY" P1_RECOVERY_DISPATCHED="$P1_RECOVERY_DISPATCHED" node - <<'NODE'
          const fs=require('fs');
          const binding={id:'kidults-asi-p1-upstream-artifact-binding-v1',version:'1.1.0',workflow_name:'KIDULTS ASI P1 Source Preflight v1',workflow_path:'.github/workflows/kidults-asi-p1-source-preflight-v1.yml',workflow_run_id:Number(process.env.P1_RUN_ID),artifact_name:'kidults-asi-p1-source-preflight-v1',artifact_id:Number(process.env.P1_ID),artifact_digest:process.env.P1_DIGEST,artifact_cardinality:1,head_branch:'main',source_sha:process.env.P1_SOURCE_SHA,consumer_sha:process.env.CURRENT_SHA,exact_generation_bound:true,exact_triggering_run_bound:process.env.GITHUB_EVENT_NAME==='workflow_run',recovery_dispatch_performed:process.env.P1_RECOVERY_DISPATCHED==='true',validation_only:process.env.VALIDATION_ONLY==='true',promotion_authority:false,status:'completed',conclusion:'success',expired:false};
          fs.writeFileSync('/tmp/p1-input/p1-upstream-artifact-binding-v1.json',JSON.stringify(binding,null,2)+'\n');
          NODE
          echo "P1_ARTIFACT_ID=$P1_ID" >> "$GITHUB_ENV"
          echo "P1_RUN_ID=$P1_RUN_ID" >> "$GITHUB_ENV"
          echo "P1_SOURCE_SHA=$P1_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "P1_ARTIFACT_DIGEST=$P1_DIGEST" >> "$GITHUB_ENV"
          P1_GENERATION_WINDOW_START=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/p1-run.json')).created_at")
          echo "P1_GENERATION_WINDOW_START=$P1_GENERATION_WINDOW_START" >> "$GITHUB_ENV"
