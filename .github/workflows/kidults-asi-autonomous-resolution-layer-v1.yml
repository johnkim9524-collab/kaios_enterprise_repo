      - name: Reject false resolution promotions and incomplete terminalization
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-layer-v1.mjs \
              "$1" \
              /tmp/p1-input/p0b-source-candidate-registry-v1.json \
              /tmp/p1-input/p0b-mission-candidate-binding-ledger-v1.json \
              /tmp/p1-input/p1-gate1-source-safety-decisions-v1.json \
              /tmp/p1-input/p1-evidence-admission-candidate-register-v1.json \
              /tmp/p1-input/p1-preflight-action-queue-v1.json \
              coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv \
              coordination/kidults/source-intelligence/scope-registry-v1-to-v2-crosswalk-v1.json \
              coordination/kidults/source-intelligence/asi-p1-market-event-adapter-runtime-contract-v1.json \
              coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-contract-v1.json \
              coordination/kidults/source-intelligence/top16-empirical-activation-preflight-v1.json
          }
          mutate_and_reject() {
            local NAME="$1"
            local SCRIPT="$2"
            local DIR="/tmp/bad-${NAME}"
            cp -a /tmp/kidults-asi-autonomous-resolution-layer-run-1 "$DIR"
            node - "$DIR" "$SCRIPT" <<'NODE'
          const fs=require('fs');const path=require('path');const dir=process.argv[2];const kind=process.argv[3];
          const load=n=>{const p=path.join(dir,n);return [p,JSON.parse(fs.readFileSync(p,'utf8'))]};
          if(kind==='semantic-pass'){const [p,x]=load('semantic-resolution-ledger-v1.json');x.records[0].decision='PASS';x.records[0].state='VERIFIED_CURRENT_MARKET_EVIDENCE';x.pass_count=1;x.terminal_reject_count-=1;fs.writeFileSync(p,JSON.stringify(x,null,2));}
          if(kind==='rights-allow'){const [p,x]=load('rights-resolution-ledger-v1.json');x.records[0].rights_state='ALLOW';x.records[0].rights_pass_created=true;x.rights_pass_count=1;x.rights_unknown_count-=1;fs.writeFileSync(p,JSON.stringify(x,null,2));}
          if(kind==='gate1-pass'){const [p,x]=load('gate1-resolution-ledger-v1.json');x.records[0].resolved_decision='PASS';x.pass_count=1;x.reject_count-=1;fs.writeFileSync(p,JSON.stringify(x,null,2));}
          if(kind==='unresolved-action'){const [p,x]=load('action-resolution-ledger-v1.json');x.records[0].terminal_state='QUEUED_NOT_EXECUTED';x.unresolved_action_count=1;x.terminal_action_count-=1;fs.writeFileSync(p,JSON.stringify(x,null,2));}
          if(kind==='evidence-admission'){const [p,x]=load('evidence-admission-resolution-ledger-v1.json');x.records[0].resolved_state='ADMITTED';x.records[0].evidence_admitted=true;x.records[0].admitted_evidence_id='fabricated';x.admitted_count=1;x.rejected_count-=1;fs.writeFileSync(p,JSON.stringify(x,null,2));}
          if(kind==='rights-hold-promotion'){const [p,x]=load('replacement-source-mission-queue-v1.json');if(!x.rights_preflight_queue?.length)throw new Error('RIGHTS_QUEUE_EXPECTED');x.rights_preflight_queue[0].rights_eligibility_state='RIGHTS_CLEAR_FOR_PURPOSE';x.rights_preflight_queue[0].adapter_backlog_eligible=true;fs.writeFileSync(p,JSON.stringify(x,null,2));}
          if(kind==='global-retirement'){const [p,x]=load('semantic-resolution-ledger-v1.json');x.records[0].candidate_globally_retired=true;x.records[0].rejection_scope='GLOBAL';fs.writeFileSync(p,JSON.stringify(x,null,2));}
          NODE
            if validate "$DIR"; then
              echo "Validator accepted forbidden mutation: $NAME" >&2
              exit 1
            fi
          }
          mutate_and_reject semantic-pass semantic-pass
          mutate_and_reject rights-allow rights-allow
          mutate_and_reject gate1-pass gate1-pass
          mutate_and_reject unresolved-action unresolved-action
          mutate_and_reject evidence-admission evidence-admission
          mutate_and_reject rights-hold-promotion rights-hold-promotion
          mutate_and_reject global-retirement global-retirement
