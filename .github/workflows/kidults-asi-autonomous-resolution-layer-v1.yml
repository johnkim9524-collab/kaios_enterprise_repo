            /tmp/arl-current-run.json)
          CREATED_WINDOW="${P1_GENERATION_WINDOW_START}..${CURRENT_ARL_CREATED_AT}"
          printf '[]\n' > /tmp/arl-authoritative-generation-run-pages.json
          ARL_HISTORY_COMPLETE=false
          for ARL_HISTORY_PAGE in $(seq 1 20); do
            PAGE_FILE="/tmp/arl-authoritative-generation-runs-page-${ARL_HISTORY_PAGE}.json"
            gh api --method GET -H 'Accept: application/vnd.github+json' \
