name: KIDULTS Delegated Autonomous Internal Authority V1
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/AI_AGENT_OPERATING_RULES.md'
      - '.github/workflows/delegated-autonomous-internal-authority-enforcement-v1.yml'
      - 'coordination/kidults/governance/delegated-autonomous-**'
      - 'coordination/kidults/governance/autonomous-approval-policy-envelope-v1.json'
      - 'coordination/kidults/governance/approval-policy-inventory-v1.json'
      - 'coordination/kidults/governance/autonomous-internal-landing-policy-v1.json'
      - 'coordination/kidults/kpmo/governed-landing-authorization-policy-v1.json'
      - 'docs/governance/DELEGATED_AUTONOMOUS_INTERNAL_AUTHORITY_V1.md'
      - 'scripts/governance/validate-delegated-autonomous-internal-authority-v1.mjs'
      - 'scripts/governance/validate-autonomous-approval-policy-envelope-v1.mjs'
      - 'scripts/kidults/kpmo/lib/autonomous-internal-landing-v1.mjs'
      - 'scripts/kidults/kpmo/lib/independent-capability-verifier-v1.mjs'
      - 'scripts/kidults/kpmo/lib/semantic-capability-delta-v1.mjs'
      - 'scripts/kidults/kpmo/run-autonomous-dispatcher-v1.mjs'
      - 'scripts/kidults/kpmo/run-autonomous-internal-landing-v1.mjs'
      - 'scripts/kidults/kpmo/validate-autonomous-internal-landing-v1.mjs'
      - 'scripts/kidults/kpmo/validate-workflow-repository-mutation-boundary-v1.mjs'
      - 'tests/governance/autonomous-approval-policy-envelope-v1.test.mjs'
      - 'tests/governance/autonomous-policy-alignment-v1.test.mjs'
      - 'tests/governance/delegated-autonomous-internal-authority-v1.test.mjs'
      - 'package.json'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delegated-autonomous-authority-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate:delegated-autonomous-authority
      - run: npm run test:delegated-autonomous-authority
      - run: npm run validate:autonomous-approval-envelope
      - run: npm run test:autonomous-approval-envelope
      - name: Exercise semantic capability fail-closed canary
        run: node --test tests/governance/autonomous-policy-alignment-v1.test.mjs
      - run: node scripts/kidults/kpmo/validate-autonomous-internal-landing-v1.mjs
