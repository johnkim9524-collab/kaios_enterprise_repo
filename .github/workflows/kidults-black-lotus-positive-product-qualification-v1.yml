name: KIDULTS Black Lotus Legacy Qualification Quarantine v1

on:
  pull_request:
    paths:
      - 'coordination/kidults/e2e/black-lotus-positive-evidence-seed-v1.json'
      - 'scripts/kidults/e2e/build-black-lotus-positive-slice-v1.mjs'
      - 'scripts/kidults/e2e/assess-black-lotus-track-b-v1.mjs'
      - 'scripts/kidults/e2e/build-black-lotus-projection-v1.mjs'
      - 'scripts/kidults/e2e/validate-black-lotus-positive-slice-v1.mjs'
      - 'scripts/kidults/e2e/validate-black-lotus-legacy-quarantine-v1.mjs'
      - '.github/workflows/kidults-black-lotus-positive-product-qualification-v1.yml'

permissions:
  contents: read

env:
  KIDULTS_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  legacy-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KIDULTS_EXACT_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out source
        run: test "$(git rev-parse HEAD)" = "$KIDULTS_EXACT_HEAD_SHA"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prove legacy qualification remains non-executable and non-promotable
        run: node scripts/kidults/e2e/validate-black-lotus-legacy-quarantine-v1.mjs
