name: KIDULTS Economic Strategic Red-Team V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/economic-strategic-attack-controls-v1.json'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-economic-strategic-attack-controls-v1.mjs'
      - '.github/workflows/kidults-economic-strategic-redteam-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/kpmo/economic-strategic-attack-controls-v1.json'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-economic-strategic-attack-controls-v1.mjs'
      - '.github/workflows/kidults-economic-strategic-redteam-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate economic and strategic attack controls
        run: node scripts/kidults/kpmo/validate-economic-strategic-attack-controls-v1.mjs
