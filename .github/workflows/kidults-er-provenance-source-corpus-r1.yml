name: KIDULTS ER Provenance Source Corpus R1

on:
  pull_request:
    paths:
      - 'coordination/kidults/entity-resolution/provenance-source-corpus-r1.json'
      - 'scripts/kidults/entity-resolution/acquire-provenance-source-corpus-r1.mjs'
      - 'scripts/kidults/entity-resolution/validate-provenance-source-corpus-r1.mjs'
      - '.github/workflows/kidults-er-provenance-source-corpus-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-provenance-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate acquisition and validator syntax
        run: |
          set -euo pipefail
          node --check scripts/kidults/entity-resolution/acquire-provenance-source-corpus-r1.mjs
          node --check scripts/kidults/entity-resolution/validate-provenance-source-corpus-r1.mjs
      - name: Acquire 120 explicit Getty Activity to HumanMadeObject pairs
        run: |
          set -euo pipefail
          node scripts/kidults/entity-resolution/acquire-provenance-source-corpus-r1.mjs /tmp/provenance-source-corpus-r1.json
      - name: Validate explicit source linkage and truth boundary
        run: |
          set -euo pipefail
          node scripts/kidults/entity-resolution/validate-provenance-source-corpus-r1.mjs \
            /tmp/provenance-source-corpus-r1.json \
            coordination/kidults/entity-resolution/provenance-source-corpus-r1.json
      - name: Prove semantic tampering fails closed
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const source=JSON.parse(fs.readFileSync('/tmp/provenance-source-corpus-r1.json','utf8'));
          const canonical=value=>Array.isArray(value)?value.map(canonical):value&&typeof value==='object'?Object.fromEntries(Object.keys(value).sort().map(key=>[key,canonical(value[key])])):value;
          const digest=value=>`sha256:${crypto.createHash('sha256').update(JSON.stringify(canonical(value))).digest('hex')}`;
          const write=(name,mutate)=>{
            const candidate=structuredClone(source);
            mutate(candidate);
            candidate.corpus_evidence_sha256=digest(candidate.pairs);
            fs.writeFileSync(`/tmp/provenance-${name}.json`,JSON.stringify(candidate));
          };
          write('forged-link',candidate=>{
            const pair=candidate.pairs[0];
            pair.explicit_source_link.link_evidence.referenced_object.id=candidate.pairs[1].object.source_reference;
            pair.explicit_source_link.source_link_evidence_sha256=digest(pair.explicit_source_link.link_evidence);
          });
          write('label-leak',candidate=>{ candidate.pairs[0].gold_label='MATCH'; });
          write('rights-drift',candidate=>{ candidate.pairs[0].rights_basis='UNKNOWN'; });
          NODE
          for mutant in forged-link label-leak rights-drift; do
            if node scripts/kidults/entity-resolution/validate-provenance-source-corpus-r1.mjs \
              "/tmp/provenance-${mutant}.json" \
              coordination/kidults/entity-resolution/provenance-source-corpus-r1.json; then
              echo "validator accepted ${mutant}" >&2
              exit 1
            fi
          done
          echo 'PASS: forged link, outcome leakage and rights drift all fail closed.'
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-er-provenance-source-corpus-r1
          path: /tmp/provenance-source-corpus-r1.json
          retention-days: 14
