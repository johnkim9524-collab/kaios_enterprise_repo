name: KPMO Canonical Issue Serialization Contract V1
on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/canonical-issue-serialization-v1.json'
      - 'scripts/kidults/kpmo/validate-canonical-issue-serialization-contract-v1.mjs'
      - '.github/workflows/kpmo-canonical-issue-serialization-contract-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: node scripts/kidults/kpmo/validate-canonical-issue-serialization-contract-v1.mjs
