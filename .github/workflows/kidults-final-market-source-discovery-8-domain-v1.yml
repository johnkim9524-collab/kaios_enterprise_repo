name: KIDULTS Final Market Source Discovery 8-Domain v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope/final-market-source-discovery-8-domain-v1.json'
      - 'scripts/kidults/scope/validate-final-market-source-discovery-8-domain-v1.mjs'
      - '.github/workflows/kidults-final-market-source-discovery-8-domain-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate final market source discovery
        run: node scripts/kidults/scope/validate-final-market-source-discovery-8-domain-v1.mjs
