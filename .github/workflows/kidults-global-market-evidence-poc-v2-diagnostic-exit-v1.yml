name: KIDULTS Global Market Evidence PoC v2 Diagnostic Exit
on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/global-market-evidence-poc-v2-diagnostic-exit-v1.json'
      - 'docs/kidults/global-market-evidence-poc-v2-diagnostic-exit-v1.md'
      - 'scripts/kidults/poc/validate-global-market-evidence-poc-v2-diagnostic-exit-v1.mjs'
      - '.github/workflows/kidults-global-market-evidence-poc-v2-diagnostic-exit-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Validate diagnostic exit
        run: node scripts/kidults/poc/validate-global-market-evidence-poc-v2-diagnostic-exit-v1.mjs
