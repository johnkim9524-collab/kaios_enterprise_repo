name: KPMO Material Defect Severity Parity V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-material-defect-severity-parity-v1.yml'
      - 'scripts/kidults/kpmo/validate-material-defect-severity-parity-v2.mjs'
      - 'scripts/kidults/kpmo/material-defect-registry-v3.mjs'
      - 'scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-material-defect-severity-parity-v1.yml'
      - 'scripts/kidults/kpmo/validate-material-defect-severity-parity-v2.mjs'
      - 'scripts/kidults/kpmo/material-defect-registry-v3.mjs'
      - 'scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs'
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: kpmo-material-defect-severity-parity-${{ github.event_name }}-${{ github.event_name == 'issues' && github.event.issue.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-severity-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate open material-defect severity parity with complete pagination
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/validate-material-defect-severity-parity-v2.mjs --self-test
          node scripts/kidults/kpmo/validate-material-defect-severity-parity-v2.mjs
