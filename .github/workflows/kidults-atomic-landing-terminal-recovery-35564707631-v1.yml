name: KIDULTS Atomic Landing Terminal Recovery 35564707631 V1
run-name: "KIDULTS Atomic Landing Recovery Run #35564707631 @ ${{ inputs.expected_current_main_sha }} / ${{ inputs.recovery_authorization_id }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-atomic-landing-terminal-recovery-35564707631-v1.yml'
      - 'scripts/kidults/kpmo/atomic-landing-terminal-recovery-35564707631-v1.mjs'
      - 'scripts/kidults/kpmo/validate-atomic-landing-terminal-recovery-35564707631-v1.mjs'
      - 'scripts/kidults/kpmo/lib/governed-landing-native-gates-v1.mjs'
      - 'scripts/kidults/kpmo/run-atomic-governed-landing-v1.mjs'
      - 'tests/kidults/kpmo/governed-landing-native-gates-v1.test.mjs'
      - 'coordination/kidults/kpmo/atomic-landing-terminal-recovery-35564707631-v1.json'
  workflow_dispatch:
    inputs:
      expected_current_main_sha:
        description: Exact current protected-main SHA after the corrective PR lands
        required: true
        type: string
      recovery_authorization_id:
        description: RECOVER-RUN-35564707631-<first-12-current-main-sha>
        required: true
        type: string

concurrency:
  group: kidults-atomic-governed-landing-v1-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-recovery-contract:
    name: Validate exact-owner race tolerance and distinct-context recovery
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact candidate SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false

      - name: Run final-reread race regressions
        run: node --test tests/kidults/kpmo/governed-landing-native-gates-v1.test.mjs

      - name: Run incident-bound recovery authorization regressions
        run: node scripts/kidults/kpmo/validate-atomic-landing-terminal-recovery-35564707631-v1.mjs

  reconcile-evidence:
    name: Reconcile immutable incident evidence without status-write authority
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      evidence_artifact_id: ${{ steps.upload_evidence.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.upload_evidence.outputs.artifact-digest }}
      evidence_receipt_sha256: ${{ steps.evidence_digest.outputs.sha256 }}
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact current protected-main execution
        env:
          EXPECTED_CURRENT_MAIN_SHA: ${{ inputs.expected_current_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CURRENT_MAIN_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false

      - name: Consume fresh recovery approval and reconcile evidence read-only
        id: reconcile
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_CURRENT_MAIN_SHA: ${{ inputs.expected_current_main_sha }}
          RECOVERY_AUTHORIZATION_ID: ${{ inputs.recovery_authorization_id }}
          ATOMIC_LANDING_RECOVERY_RECEIPT_PATH: out/atomic-landing-recovery/evidence-receipt.json
        run: >-
          node scripts/kidults/kpmo/atomic-landing-terminal-recovery-35564707631-v1.mjs
          --reconcile
          coordination/kidults/kpmo/atomic-landing-terminal-recovery-35564707631-v1.json

      - name: Digest evidence receipt bytes
        id: evidence_digest
        if: always()
        run: |
          set -euo pipefail
          test -f out/atomic-landing-recovery/evidence-receipt.json
          printf 'sha256=sha256:%s\n' "$(sha256sum out/atomic-landing-recovery/evidence-receipt.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload sealed read-only evidence receipt
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-atomic-landing-recovery-evidence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/atomic-landing-recovery/evidence-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Reapply fail-closed reconciliation verdict
        if: always()
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          set -euo pipefail
          test "$RECONCILE_OUTCOME" = success

  publish-distinct-recovery-status:
    name: Publish one distinct recovery status from sealed evidence
    if: github.event_name == 'workflow_dispatch' && needs.reconcile-evidence.result == 'success'
    needs: [reconcile-evidence]
    permissions:
      actions: read
      contents: read
      issues: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact current protected-main execution
        env:
          EXPECTED_CURRENT_MAIN_SHA: ${{ inputs.expected_current_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CURRENT_MAIN_SHA"

      - name: Download exact sealed evidence receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kidults-atomic-landing-recovery-evidence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/atomic-landing-recovery/sealed-evidence

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false

      - name: Revalidate approval and publish only the distinct recovery context
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_CURRENT_MAIN_SHA: ${{ inputs.expected_current_main_sha }}
          RECOVERY_AUTHORIZATION_ID: ${{ inputs.recovery_authorization_id }}
          EVIDENCE_ARTIFACT_ID: ${{ needs.reconcile-evidence.outputs.evidence_artifact_id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ needs.reconcile-evidence.outputs.evidence_artifact_digest }}
          EVIDENCE_ARTIFACT_NAME: kidults-atomic-landing-recovery-evidence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          EVIDENCE_RECEIPT_SHA256: ${{ needs.reconcile-evidence.outputs.evidence_receipt_sha256 }}
          ATOMIC_LANDING_RECOVERY_RECEIPT_PATH: out/atomic-landing-recovery/publication-receipt.json
        run: >-
          node scripts/kidults/kpmo/atomic-landing-terminal-recovery-35564707631-v1.mjs
          --publish
          coordination/kidults/kpmo/atomic-landing-terminal-recovery-35564707631-v1.json
          out/atomic-landing-recovery/sealed-evidence/evidence-receipt.json

      - name: Upload durable publication receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-atomic-landing-recovery-publication-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/atomic-landing-recovery/publication-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Reapply fail-closed publication verdict
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          test "$PUBLISH_OUTCOME" = success
