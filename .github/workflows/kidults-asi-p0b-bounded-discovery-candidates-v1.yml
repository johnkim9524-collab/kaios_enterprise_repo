name: KIDULTS ASI P0B Bounded Discovery Candidates v1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0-mission-consumption-registry-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-p0b-bounded-discovery-candidates-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-registry-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p0b-provider-hard-disable-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-public-metadata-source-fabric-v1.mjs'
      - 'scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.py'
      - 'docs/kidults/asi/asi-p0b-bounded-discovery-candidates-v1.md'
      - '.github/workflows/kidults-asi-p0b-bounded-discovery-candidates-v1.yml'
      - '.github/workflows/kidults-asi-p0b-provider-hard-disable-regression-v1.yml'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Source Fabric Scale PI1'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-p0b-bounded-discovery-candidates-v1-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-consumer-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact PR source and consumer-only contracts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          for file in \
            scripts/kidults/source-intelligence/build-asi-p0b-bounded-discovery-candidates-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-registry-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p0b-provider-hard-disable-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-public-metadata-source-fabric-v1.mjs \
            scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs; do
            node --check "$file"
          done
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-registry-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-p0b-provider-hard-disable-v1.mjs

  bounded-discovery-candidates:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact runtime source and consumer-only contracts
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-registry-v1.mjs \
            | tee /tmp/kidults-asi-p0b-registry-validation-v1.json
          node scripts/kidults/source-intelligence/validate-asi-p0b-provider-hard-disable-v1.mjs

      - name: Restore exact Source Fabric input
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          EVENT_REPOSITORY: ${{ github.event.workflow_run.repository.full_name || '' }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          EVENT_WORKFLOW_PATH: ${{ github.event.workflow_run.path || '' }}
          EVENT_WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p0b-source-fabric-expanded
          mkdir -p /tmp/p0b-source-fabric-expanded
          LIVE_MAIN_SHA=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          [[ "$LIVE_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]

          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            [[ "$EVENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$EVENT_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$EVENT_WORKFLOW_NAME" = 'KIDULTS ASI Source Fabric Scale PI1'
            test "$EVENT_WORKFLOW_PATH" = '.github/workflows/kidults-asi-source-fabric-scale-pi1.yml'
            test "$EVENT_HEAD_BRANCH" = 'main'
            test "$EVENT_CONCLUSION" = 'success'
            case "$EVENT_WORKFLOW_EVENT" in schedule|workflow_dispatch|push) ;; *) echo 'P0B_SOURCE_FABRIC_EVENT_NOT_RUNTIME_AUTHORITATIVE' >&2; exit 1 ;; esac
            test "$EVENT_SOURCE_SHA" = "$LIVE_MAIN_SHA"

            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}" > /tmp/p0b-source-fabric-run.json
            jq -e \
              --argjson run "$EVENT_RUN_ID" --arg sha "$EVENT_SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" --arg event "$EVENT_WORKFLOW_EVENT" \
              '.id==$run and .repository.full_name==$repo and .name=="KIDULTS ASI Source Fabric Scale PI1" and .path==".github/workflows/kidults-asi-source-fabric-scale-pi1.yml" and .head_branch=="main" and .head_sha==$sha and .event==$event and .status=="completed" and .conclusion=="success"' \
              /tmp/p0b-source-fabric-run.json >/dev/null

            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}/artifacts?per_page=100" > /tmp/p0b-source-fabric-artifacts.json
            jq -e '.total_count == (.artifacts | length) and .total_count <= 100' /tmp/p0b-source-fabric-artifacts.json >/dev/null
            SOURCE_FABRIC_RECORD=$(jq -c --argjson run "$EVENT_RUN_ID" --arg sha "$EVENT_SOURCE_SHA" \
              '[.artifacts[] | select(.name=="kidults-asi-source-fabric-scale-pi1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | if length==1 then .[0] else empty end' \
              /tmp/p0b-source-fabric-artifacts.json)
            test -n "$SOURCE_FABRIC_RECORD"
            SOURCE_FABRIC_ARTIFACT_ID=$(jq -r '.id' <<<"$SOURCE_FABRIC_RECORD")
            SOURCE_FABRIC_ARTIFACT_DIGEST=$(jq -r '.digest // empty' <<<"$SOURCE_FABRIC_RECORD")
            [[ "$SOURCE_FABRIC_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_FABRIC_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_FABRIC_ARTIFACT_ID}/zip" > /tmp/p0b-source-fabric.zip
            python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
              --archive /tmp/p0b-source-fabric.zip \
              --expected-digest "$SOURCE_FABRIC_ARTIFACT_DIGEST" \
              --receipt /tmp/p0b-source-fabric-archive-validation-v1.json \
              --max-compressed-bytes 67108864 \
              --max-entries 4096 \
              --max-entry-uncompressed-bytes 16777216 \
              --max-total-uncompressed-bytes 268435456 \
              --max-compression-ratio 100 \
              --required-basename asi-public-metadata-source-fabric-v1.json \
              --required-basename asi-source-fabric-scale-pi1-receipt.json
            unzip -q -o /tmp/p0b-source-fabric.zip -d /tmp/p0b-source-fabric-expanded
            P0B_INPUT_MODE='EXACT_TRIGGERING_SOURCE_FABRIC_ARTIFACT'
            P0B_ORIGIN_RUN_ID="$EVENT_RUN_ID"
            P0B_ORIGIN_SOURCE_SHA="$EVENT_SOURCE_SHA"
            P0B_ORIGIN_EVENT="$EVENT_WORKFLOW_EVENT"
          else
            test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
            test "$GITHUB_REF" = 'refs/heads/main'
            test "$(git rev-parse HEAD)" = "$LIVE_MAIN_SHA"
            node scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs \
              --workflow-path .github/workflows/kidults-asi-source-fabric-scale-pi1.yml \
              --workflow-name 'KIDULTS ASI Source Fabric Scale PI1' \
              --artifact-name kidults-asi-source-fabric-scale-pi1 \
              --branch main \
              --archive /tmp/p0b-source-fabric.zip \
              --extract-dir /tmp/p0b-source-fabric-expanded \
              --receipt /tmp/p0b-source-fabric-exact-restore-receipt-v1.json \
              --required-basename asi-public-metadata-source-fabric-v1.json \
              --required-basename asi-source-fabric-scale-pi1-receipt.json \
              --allowed-event schedule --allowed-event workflow_dispatch --allowed-event push \
              --max-pages 40 --lookback-days 95 --max-compressed-bytes 67108864
            P0B_ORIGIN_RUN_ID=$(jq -r '.producer_run_id' /tmp/p0b-source-fabric-exact-restore-receipt-v1.json)
            P0B_ORIGIN_SOURCE_SHA=$(jq -r '.producer_source_sha' /tmp/p0b-source-fabric-exact-restore-receipt-v1.json)
            P0B_ORIGIN_EVENT=$(jq -r '.producer_event' /tmp/p0b-source-fabric-exact-restore-receipt-v1.json)
            SOURCE_FABRIC_ARTIFACT_ID=$(jq -r '.artifact_id' /tmp/p0b-source-fabric-exact-restore-receipt-v1.json)
            SOURCE_FABRIC_ARTIFACT_DIGEST=$(jq -r '.artifact_digest' /tmp/p0b-source-fabric-exact-restore-receipt-v1.json)
            test "$P0B_ORIGIN_SOURCE_SHA" = "$LIVE_MAIN_SHA"
            P0B_INPUT_MODE='EXACT_CURRENT_MAIN_RECOVERY_ARTIFACT'
          fi

          mapfile -t FABRIC_FILES < <(find /tmp/p0b-source-fabric-expanded -type f -name 'asi-public-metadata-source-fabric-v1.json' -print)
          mapfile -t RECEIPT_FILES < <(find /tmp/p0b-source-fabric-expanded -type f -name 'asi-source-fabric-scale-pi1-receipt.json' -print)
          test "${#FABRIC_FILES[@]}" -eq 1
          test "${#RECEIPT_FILES[@]}" -eq 1
          cp "${FABRIC_FILES[0]}" /tmp/asi-public-metadata-source-fabric-v1.json
          cp "${RECEIPT_FILES[0]}" /tmp/asi-source-fabric-scale-pi1-receipt.json
          node scripts/kidults/source-intelligence/validate-asi-public-metadata-source-fabric-v1.mjs /tmp/asi-public-metadata-source-fabric-v1.json
          jq -e '.public_release=="HOLD" and .production=="HOLD" and .content_acquisition_authorized==false and .collection_right_created==false' /tmp/asi-source-fabric-scale-pi1-receipt.json >/dev/null

          {
            echo "P0B_INPUT_MODE=$P0B_INPUT_MODE"
            echo "P0B_ORIGIN_RUN_ID=$P0B_ORIGIN_RUN_ID"
            echo "P0B_ORIGIN_SOURCE_SHA=$P0B_ORIGIN_SOURCE_SHA"
            echo "P0B_ORIGIN_EVENT=$P0B_ORIGIN_EVENT"
            echo "P0B_SOURCE_FABRIC_ARTIFACT_ID=$SOURCE_FABRIC_ARTIFACT_ID"
            echo "P0B_SOURCE_FABRIC_ARTIFACT_DIGEST=$SOURCE_FABRIC_ARTIFACT_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Rebuild current P0 mission task queue
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs \
            coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json \
            coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json \
            /tmp/kidults-global-source-mesh-v1.json
          node scripts/kidults/source-intelligence/build-asi-intelligence-preparation-wave-v1.mjs \
            /tmp/kidults-global-source-mesh-v1.json \
            coordination/kidults/kpmo/verified-intelligence-surface-baseline-v1.json \
            coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json \
            /tmp/kidults-asi-intelligence-preparation-wave-v1
          node scripts/kidults/source-intelligence/validate-asi-intelligence-preparation-wave-v1.mjs \
            /tmp/kidults-asi-intelligence-preparation-wave-v1 \
            coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json \
            > /tmp/kidults-asi-intelligence-preparation-wave-validation-v1.json
          node scripts/kidults/source-intelligence/build-asi-p0-mission-consumption-v1.mjs \
            /tmp/kidults-asi-intelligence-preparation-wave-v1/autonomous-mission-queue-v1.json \
            coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json \
            services/kidults-autonomous-intelligence/src/asi/registry.ts \
            /tmp/kidults-asi-p0-mission-consumption-v1
          node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs \
            /tmp/kidults-asi-p0-mission-consumption-v1 \
            coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json \
            > /tmp/kidults-asi-p0-mission-consumption-validation-v1.json

      - name: Build P0B source candidate increment from Source Fabric
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-asi-p0b-bounded-discovery-candidates-v1.mjs \
            /tmp/kidults-asi-p0-mission-consumption-v1/p0-source-discovery-task-queue-v1.json \
            /tmp/asi-public-metadata-source-fabric-v1.json \
            coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 \
            coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json \
            | tee /tmp/kidults-asi-p0b-candidate-validation-v1.json

      - name: Reject source-candidate-as-evidence mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 /tmp/p0b-bad-evidence
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p0b-bad-evidence/p0b-source-candidate-registry-v1.json';const x=JSON.parse(fs.readFileSync(p));if(!x.candidates.length)throw new Error('P0B_NEGATIVE_SUBJECT_MISSING');x.candidates[0].evidence_admitted=true;x.candidates[0].evidence_state='ADMITTED';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs /tmp/p0b-bad-evidence; then exit 1; fi
      - name: Reject region-hint-as-coverage mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 /tmp/p0b-bad-region
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p0b-bad-region/p0b-mission-candidate-binding-ledger-v1.json';const x=JSON.parse(fs.readFileSync(p));if(!x.bindings.length)throw new Error('P0B_NEGATIVE_SUBJECT_MISSING');x.bindings[0].regional_coverage_proven=true;x.missions_with_regional_coverage_proven=1;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs /tmp/p0b-bad-region; then exit 1; fi
      - name: Reject host-as-factual-origin mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 /tmp/p0b-bad-origin
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p0b-bad-origin/p0b-provider-host-diversity-v1.json';const x=JSON.parse(fs.readFileSync(p));x.distinct_host_is_distinct_factual_origin=true;x.factual_origin_independence_proven_count=1;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs /tmp/p0b-bad-origin; then exit 1; fi
      - name: Reject target-content acquisition mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 /tmp/p0b-bad-content
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p0b-bad-content/p0b-source-candidate-registry-v1.json';const x=JSON.parse(fs.readFileSync(p));if(!x.candidates.length)throw new Error('P0B_NEGATIVE_SUBJECT_MISSING');x.candidates[0].target_site_body_crawled=true;x.candidates[0].target_content_acquired=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs /tmp/p0b-bad-content; then exit 1; fi
      - name: Reject unsupported market claim mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 /tmp/p0b-bad-claim
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p0b-bad-claim/p0b-bounded-discovery-manifest-v1.json';const x=JSON.parse(fs.readFileSync(p));x.results.market_claims_created=1;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs /tmp/p0b-bad-claim; then exit 1; fi

      - name: Revalidate pristine P0B execution
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-registry-v1.mjs \
            > /tmp/kidults-asi-p0b-registry-final-validation-v1.json
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 \
            coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json \
            > /tmp/kidults-asi-p0b-candidate-final-validation-v1.json

      - name: Emit fail-closed KPMO P0B consumer receipt
        if: always()
        env:
          KPMO_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          node - <<'NODE' >/tmp/kidults-asi-p0b-bounded-discovery-receipt-v1.json
          const fs=require('fs');
          const crypto=require('crypto');
          const manifestPath='/tmp/kidults-asi-p0b-bounded-discovery-candidates-v1/p0b-bounded-discovery-manifest-v1.json';
          const manifestExists=fs.existsSync(manifestPath);
          const originBound=/^[1-9][0-9]*$/.test(process.env.P0B_ORIGIN_RUN_ID||'')&&/^[a-f0-9]{40}$/.test(process.env.P0B_ORIGIN_SOURCE_SHA||'')&&/^sha256:[a-f0-9]{64}$/.test(process.env.P0B_SOURCE_FABRIC_ARTIFACT_DIGEST||'');
          const pass=process.env.KPMO_JOB_STATUS==='success'&&manifestExists&&originBound;
          const receipt={
            id:'kidults-asi-p0b-bounded-discovery-receipt-v1',version:'1.1.0',
            state:pass?'VERIFIED_PASS':'VERIFIED_FAIL',source_sha:process.env.GITHUB_SHA,
            trigger_event:process.env.GITHUB_EVENT_NAME,run_id:process.env.GITHUB_RUN_ID,run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT||'0'),
            job_status:process.env.KPMO_JOB_STATUS,manifest_present:manifestExists,failure_contained:!pass,
            failure_code:pass?null:'P0B_SOURCE_FABRIC_CONSUMER_CHAIN_FAILED',
            input_mode:process.env.P0B_INPUT_MODE||null,
            source_fabric_origin:{run_id:Number(process.env.P0B_ORIGIN_RUN_ID||'0'),source_sha:process.env.P0B_ORIGIN_SOURCE_SHA||null,event:process.env.P0B_ORIGIN_EVENT||null,artifact_id:Number(process.env.P0B_SOURCE_FABRIC_ARTIFACT_ID||'0'),artifact_digest:process.env.P0B_SOURCE_FABRIC_ARTIFACT_DIGEST||null},
            provider_requests_issued_by_p0b:0,provider_execution_authority:false,shared_provider_budget_required:true,
            candidate_admission:pass?'VALIDATED_SOURCE_CANDIDATES_ONLY':'NONE',evidence_admission:'NONE',public_release:'HOLD',production:'HOLD',g5:'HOLD'
          };
          if(manifestExists){const bytes=fs.readFileSync(manifestPath);const m=JSON.parse(bytes);receipt.manifest_digest='sha256:'+crypto.createHash('sha256').update(bytes).digest('hex');receipt.results=m.results;receipt.autonomous_effect=m.autonomous_effect;receipt.global_effect=m.global_effect;receipt.irreplaceable_value_effect=m.irreplaceable_value_effect;receipt.transparency_effect=m.transparency_effect;}
          process.stdout.write(JSON.stringify(receipt,null,2));
          NODE
          cat /tmp/kidults-asi-p0b-bounded-discovery-receipt-v1.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kidults-asi-p0b-bounded-discovery-candidates-v1
          path: |
            /tmp/asi-public-metadata-source-fabric-v1.json
            /tmp/asi-source-fabric-scale-pi1-receipt.json
            /tmp/p0b-source-fabric-archive-validation-v1.json
            /tmp/p0b-source-fabric-exact-restore-receipt-v1.json
            /tmp/kidults-asi-p0-mission-consumption-v1
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1
            /tmp/kidults-asi-p0b-registry-validation-v1.json
            /tmp/kidults-asi-p0b-registry-final-validation-v1.json
            /tmp/kidults-asi-p0b-candidate-validation-v1.json
            /tmp/kidults-asi-p0b-candidate-final-validation-v1.json
            /tmp/kidults-asi-p0b-bounded-discovery-receipt-v1.json
          retention-days: 90
          if-no-files-found: error