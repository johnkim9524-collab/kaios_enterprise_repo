name: KIDULTS Cloudflare Automatic Deployment Containment v1

on:
  push:
    branches:
      - codex/cloudflare-preview-estate-cleanup
    paths:
      - .github/workflows/kidults-cloudflare-preview-estate-cleanup-v1.yml
      - scripts/ops/cloudflare-pages-auto-deployment-containment.sh

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-auto-deployment-containment-v1
  cancel-in-progress: false

jobs:
  contain-automatic-deployments:
    name: Disable Pages Git auto-deployments and verify read-back
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: kidults-workspace-staging
      EXPECTED_REPOSITORY: johnkim9524-collab/kaios_enterprise_repo
      RECEIPT_DIR: artifacts/cloudflare-auto-deployment-containment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact containment authority and credential availability
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/cloudflare-preview-estate-cleanup"
          test "$CLOUDFLARE_PAGES_PROJECT_NAME" = "kidults-workspace-staging"
          test "$EXPECTED_REPOSITORY" = "$GITHUB_REPOSITORY"
          mkdir -p "$RECEIPT_DIR"
          if test -z "$CLOUDFLARE_API_TOKEN"; then
            jq -n \
              --arg project "$CLOUDFLARE_PAGES_PROJECT_NAME" \
              --arg state "BLOCKED" \
              --arg blocker "CLOUDFLARE_WRITE_TOKEN_ABSENT" \
              --arg source_sha "$GITHUB_SHA" \
              '{
                project:$project,
                state:$state,
                blocker:$blocker,
                source_sha:$source_sha,
                cloudflare_patch_executed:false,
                project_setting_readback_obtained:false,
                deployment_created:false,
                deployment_deleted:false,
                production_history_mutated:false,
                public_release:"HOLD",
                production:"HOLD",
                g5:"HOLD"
              }' > "$RECEIPT_DIR/final.json"
            exit 66
          fi
          if test -z "$CLOUDFLARE_ACCOUNT_ID"; then
            jq -n \
              --arg project "$CLOUDFLARE_PAGES_PROJECT_NAME" \
              --arg state "BLOCKED" \
              --arg blocker "CLOUDFLARE_ACCOUNT_ID_ABSENT" \
              --arg source_sha "$GITHUB_SHA" \
              '{
                project:$project,
                state:$state,
                blocker:$blocker,
                source_sha:$source_sha,
                cloudflare_patch_executed:false,
                project_setting_readback_obtained:false,
                deployment_created:false,
                deployment_deleted:false,
                production_history_mutated:false,
                public_release:"HOLD",
                production:"HOLD",
                g5:"HOLD"
              }' > "$RECEIPT_DIR/final.json"
            exit 67
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Disable Production and Preview Git auto-deployments
        shell: bash
        run: bash scripts/ops/cloudflare-pages-auto-deployment-containment.sh --execute

      - name: Verify sanitized success receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .state == "COMPLETE_VERIFIED"
            and .exact_readback.legacy_deployments_enabled == false
            and .exact_readback.production_deployments_enabled == false
            and .exact_readback.preview_deployment_setting == "none"
            and (.exact_readback.preview_branch_includes | length == 0)
            and (.exact_readback.preview_branch_excludes | length == 0)
            and .deployment_created == false
            and .deployment_deleted == false
            and .public_release == "HOLD"
            and .production == "HOLD"
            and .g5 == "HOLD"
          ' "$RECEIPT_DIR/final.json" >/dev/null

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: cloudflare-auto-deployment-containment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cloudflare-auto-deployment-containment
          if-no-files-found: error
          retention-days: 30
