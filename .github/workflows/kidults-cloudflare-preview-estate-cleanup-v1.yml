name: KIDULTS Cloudflare Preview Estate Cleanup v1

on:
  push:
    branches:
      - codex/cloudflare-preview-estate-cleanup
    paths:
      - .github/workflows/kidults-cloudflare-preview-estate-cleanup-v1.yml
      - scripts/ops/cloudflare-pages-preview-cleanup.sh

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-preview-estate-cleanup-v1
  cancel-in-progress: false

jobs:
  cleanup-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: kidults-workspace-staging
      RECEIPT_DIR: artifacts/cloudflare-preview-cleanup
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact cleanup authority and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/cloudflare-preview-estate-cleanup"
          test "$CLOUDFLARE_PAGES_PROJECT_NAME" = "kidults-workspace-staging"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "Production deletion is forbidden; Preview-only selection is enforced by the cleanup script."

      - name: Delete Preview deployments and preserve Production
        shell: bash
        run: bash scripts/ops/cloudflare-pages-preview-cleanup.sh --execute

      - name: Upload sanitized cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-estate-cleanup-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cloudflare-preview-cleanup
          if-no-files-found: error
          retention-days: 30
