  pull_request:
    paths:
      - "coordination/kidults/architecture/platform-market-funnel-alignment-v1.json"
      - "coordination/kidults/architecture/autonomous-global-collectibles-intelligence-os-v3.1.md"
      - "coordination/kidults/registry/engine/records/engine-agci-os-v2-contract-v1.json"
      - "coordination/kidults/strategy/agci-os-total-program-strategy-reset-v2.json"
      - "coordination/kidults/source-intelligence/autonomous-source-intelligence-program-v1.json"
      - "coordination/kidults/source-intelligence/asi-market-funnel-engine-mesh-v1.json"
      - "coordination/kidults/source-intelligence/asi-purpose-specific-admission-policy-v1.json"
      - "coordination/kidults/source-intelligence/asi-queue-and-partition-contract-v1.json"
      - "coordination/kidults/source-intelligence/asi-market-funnel-event-v1.schema.json"
      - "coordination/kidults/source-intelligence/global-pool-r1-frontier-seed-channel-contract-v1.json"
      - "coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-contract-v1.json"
