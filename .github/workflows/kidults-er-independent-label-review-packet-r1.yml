name: KIDULTS ER Independent Label Review Packet R1

on:
  pull_request:
    paths:
      - 'coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json'
      - 'scripts/kidults/entity-resolution/validate-independent-label-review-packet-contract-r1.mjs'
      - '.github/workflows/kidults-er-independent-label-review-packet-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate independent reviewer and blind-label boundaries
        run: node scripts/kidults/entity-resolution/validate-independent-label-review-packet-contract-r1.mjs
