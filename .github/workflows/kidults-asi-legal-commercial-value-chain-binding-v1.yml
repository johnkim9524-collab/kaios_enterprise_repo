name: KIDULTS ASI Legal Commercial Value Chain Binding v1

on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/asi-legal-commercial-value-chain-binding-v1.json'
      - 'scripts/kidults/source-intelligence/validate-asi-legal-commercial-value-chain-binding-v1.mjs'
      - '.github/workflows/kidults-asi-legal-commercial-value-chain-binding-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-legal-commercial-value-chain-binding-v1.json'
      - 'scripts/kidults/source-intelligence/validate-asi-legal-commercial-value-chain-binding-v1.mjs'
      - '.github/workflows/kidults-asi-legal-commercial-value-chain-binding-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-value-chain-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Validate cross-value-chain binding
        run: node scripts/kidults/source-intelligence/validate-asi-legal-commercial-value-chain-binding-v1.mjs coordination/kidults/source-intelligence/asi-legal-commercial-value-chain-binding-v1.json
      - name: Reject Track B Gate3 bypass
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='coordination/kidults/source-intelligence/asi-legal-commercial-value-chain-binding-v1.json'; const x=JSON.parse(fs.readFileSync(p)); x.bindings.track_b.rule='ALLOW_WITHOUT_GATE3'; fs.writeFileSync('/tmp/bad-b.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-legal-commercial-value-chain-binding-v1.mjs /tmp/bad-b.json; then echo 'Track B Gate3 bypass not rejected' >&2; exit 1; fi
      - name: Reject Runtime Gate3 bypass
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='coordination/kidults/source-intelligence/asi-legal-commercial-value-chain-binding-v1.json'; const x=JSON.parse(fs.readFileSync(p)); x.bindings.track_d.rule='RUNTIME_INGEST_WITHOUT_GATE3'; fs.writeFileSync('/tmp/bad-d.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-legal-commercial-value-chain-binding-v1.mjs /tmp/bad-d.json; then echo 'Runtime Gate3 bypass not rejected' >&2; exit 1; fi
      - name: Reject Portal raw-source consumption
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='coordination/kidults/source-intelligence/asi-legal-commercial-value-chain-binding-v1.json'; const x=JSON.parse(fs.readFileSync(p)); x.bindings.track_c.rule='DIRECT_SOURCE_ALLOWED'; fs.writeFileSync('/tmp/bad-c.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-legal-commercial-value-chain-binding-v1.mjs /tmp/bad-c.json; then echo 'Portal raw-source bypass not rejected' >&2; exit 1; fi
