name: KIDULTS Provider Contact Readiness Gate v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/provider/provider-contact-readiness-gate-v1.json'
      - 'coordination/kidults/provider/provider-communication-evidence-2026-08-30-v1.json'
      - 'coordination/kidults/registry/provider/index.json'
      - 'coordination/kidults/registry/provider/records/provider-operating-state-v1.json'
      - 'coordination/kidults/governance/ih-group-provider-sourcing-contract-v1.json'
      - 'coordination/kidults/index/provider-authorization-action-queue-v1.json'
      - 'coordination/kidults/provider/psa-120-admission-controls-receipt-v1.json'
      - 'coordination/kidults/provider/psa-120-known-cert-manifest-v1.json'
      - 'coordination/kidults/provider/psa-premium-api-connection-receipt-v1.json'
      - 'coordination/kidults/provider/psa-private-evaluation-readiness-receipt-v2.json'
      - 'coordination/kidults/provider/gemrate-bounded-pilot-preflight-v1.json'
      - 'coordination/kidults/market/classic-bundle3-provider-response-intake-v1.json'
      - 'apps/kidults-enterprise-staging/public/a13-b10/data/provider-outreach.json'
      - 'apps/kidults-enterprise-staging/public/a13-b10/data/provider-outreach-pack.json'
      - 'apps/kidults-enterprise-staging/public/a13-b10/data/provider-dispatch-ledger.json'
      - 'scripts/kidults/provider/validate-provider-contact-readiness-gate-v1.mjs'
      - 'scripts/kidults/provider/validate-provider-communication-evidence-v1.mjs'
      - 'scripts/kidults/provider/validate-provider-operating-state-v1.mjs'
      - '.github/workflows/kidults-provider-contact-readiness-gate-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Program Owner contact gate
        run: |
          node scripts/kidults/provider/validate-provider-communication-evidence-v1.mjs
          node scripts/kidults/provider/validate-provider-operating-state-v1.mjs
          node scripts/kidults/provider/validate-provider-contact-readiness-gate-v1.mjs
