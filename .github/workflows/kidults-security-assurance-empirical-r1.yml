name: KIDULTS Security Assurance Empirical R1
on:
  pull_request:
  workflow_dispatch:

jobs:
  security-assurance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dependency and integrity inventories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kidults-security-r1
          git ls-files | sort > /tmp/kidults-security-r1/tracked-files.txt
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/kidults-security-r1/tracked-files.txt > /tmp/kidults-security-r1/source-integrity.sha256
          git ls-files | grep -E '(^|/)(package(-lock)?\.json|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile(\.lock)?|Dockerfile)$' | sort > /tmp/kidults-security-r1/dependency-inputs.txt || true
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/kidults-security-r1/dependency-inputs.txt > /tmp/kidults-security-r1/dependency-inputs.sha256
          printf '{"tracked_file_count":%s,"dependency_input_count":%s}\n' "$(wc -l < /tmp/kidults-security-r1/tracked-files.txt)" "$(wc -l < /tmp/kidults-security-r1/dependency-inputs.txt)" > /tmp/kidults-security-r1/inventory-summary.json

      - name: High-confidence committed-secret scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,subprocess,json
          patterns={
            'private_key':re.compile(r'-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'),
            'github_token':re.compile(r'\b(?:ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{30,})\b'),
            'aws_access_key':re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
            'slack_token':re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b'),
            'google_api_key':re.compile(r'\bAIza[0-9A-Za-z_-]{35}\b'),
            'openai_style_key':re.compile(r'\bsk-[A-Za-z0-9_-]{24,}\b')
          }
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          findings=[]
          for f in files:
            p=pathlib.Path(f)
            try:
              b=p.read_bytes()
              if b'\x00' in b: continue
              text=b.decode('utf-8')
            except Exception: continue
            for name,rx in patterns.items():
              for m in rx.finditer(text):
                line=text.count('\n',0,m.start())+1
                findings.append({'rule':name,'path':f,'line':line})
          pathlib.Path('/tmp/kidults-security-r1/secret-scan.json').write_text(json.dumps({'finding_count':len(findings),'findings':findings},indent=2))
          if findings:
            print(json.dumps(findings,indent=2))
            raise SystemExit('HIGH_CONFIDENCE_SECRET_PATTERN_FOUND')
          print('High-confidence secret scan PASS')
          PY

      - name: Node dependency vulnerability audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kidults-security-r1/npm-audit
          rc=0
          while IFS= read -r lock; do
            [ -n "$lock" ] || continue
            d=$(dirname "$lock")
            safe=$(echo "$d" | tr '/.' '__')
            (cd "$d" && npm audit --omit=dev --json) > "/tmp/kidults-security-r1/npm-audit/${safe}.json" || true
          done < <(git ls-files '*package-lock.json')
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dir='/tmp/kidults-security-r1/npm-audit';
          const files=fs.existsSync(dir)?fs.readdirSync(dir).filter(x=>x.endsWith('.json')):[];
          let high=0,critical=0,invalid=0;
          for(const f of files){try{const x=JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')); const v=x.metadata?.vulnerabilities||{}; high+=v.high||0; critical+=v.critical||0;}catch{invalid++;}}
          const out={audit_file_count:files.length,high,critical,invalid};
          fs.writeFileSync('/tmp/kidults-security-r1/npm-audit-summary.json',JSON.stringify(out,null,2));
          console.log(out);
          if(invalid||high||critical) process.exit(1);
          NODE

      - name: Python dependency vulnerability audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kidults-security-r1/pip-audit
          reqs=$(git ls-files 'requirements*.txt' '**/requirements*.txt' || true)
          if [ -z "$reqs" ]; then
            echo '{"requirements_file_count":0,"state":"NOT_APPLICABLE_NO_REQUIREMENTS_FILES"}' > /tmp/kidults-security-r1/pip-audit-summary.json
            exit 0
          fi
          python -m pip install --disable-pip-version-check --quiet pip-audit
          count=0
          failed=0
          while IFS= read -r req; do
            [ -n "$req" ] || continue
            count=$((count+1))
            safe=$(echo "$req" | tr '/.' '__')
            if ! pip-audit -r "$req" -f json -o "/tmp/kidults-security-r1/pip-audit/${safe}.json"; then failed=$((failed+1)); fi
          done <<< "$reqs"
          python - "$count" "$failed" <<'PY'
          import json,sys,pathlib
          count,failed=map(int,sys.argv[1:])
          vulns=0
          for p in pathlib.Path('/tmp/kidults-security-r1/pip-audit').glob('*.json'):
            try:
              x=json.loads(p.read_text())
              deps=x.get('dependencies',x if isinstance(x,list) else [])
              for d in deps: vulns += len(d.get('vulns',[]))
            except Exception: failed+=1
          out={'requirements_file_count':count,'vulnerability_count':vulns,'audit_failures':failed}
          pathlib.Path('/tmp/kidults-security-r1/pip-audit-summary.json').write_text(json.dumps(out,indent=2))
          print(out)
          if failed or vulns: raise SystemExit(1)
          PY

      - name: Validate vulnerability response ownership
        shell: bash
        run: |
          node - <<'NODE'
          const x=require('./coordination/kidults/governance/vulnerability-response-plan-v1.json');
          if(x.production!=='HOLD'||x.status!=='ACTIVE_PREPRODUCTION') process.exit(1);
          for(const k of ['triage_and_evidence','runtime_containment_and_recovery','code_or_configuration_remediation','production_risk_acceptance']) if(!x.owners?.[k]) process.exit(1);
          if(x.severity_policy?.critical!=='RELEASE_HOLD_IMMEDIATE_REMEDIATION') process.exit(1);
          console.log('Vulnerability response ownership PASS');
          NODE

      - name: Build assurance result
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const root='/tmp/kidults-security-r1';
          const read=(f)=>{try{return JSON.parse(fs.readFileSync(`${root}/${f}`,'utf8'))}catch{return null}};
          const integ=fs.existsSync(`${root}/source-integrity.sha256`)?crypto.createHash('sha256').update(fs.readFileSync(`${root}/source-integrity.sha256`)).digest('hex'):null;
          const report={id:'kidults-security-assurance-empirical-r1',production:'HOLD',dependency_inventory:read('inventory-summary.json'),secret_scan:read('secret-scan.json'),npm_audit:read('npm-audit-summary.json'),pip_audit:read('pip-audit-summary.json'),source_integrity_manifest_sha256:integ,vulnerability_response_owner:'REGISTERED',truth_boundary:'This is pre-production repository and dependency assurance evidence. It is not a penetration test, external infrastructure security assessment, legal/privacy clearance, or Production authorization.'};
          fs.writeFileSync(`${root}/security-assurance-report.json`,JSON.stringify(report,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kidults-security-assurance-empirical-r1
          path: /tmp/kidults-security-r1
          retention-days: 30
