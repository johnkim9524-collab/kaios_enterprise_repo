name: Kidults A37 Autonomous Revenue, Monetization & Commercial Governance

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/kidults-autonomous-intelligence/scripts/a37-commercial-governance.mjs'
      - 'services/kidults-autonomous-intelligence/fixtures/a37/**'
      - 'services/kidults-autonomous-intelligence/package.json'
      - 'services/kidults-autonomous-intelligence/package-lock.json'
      - '.github/workflows/kidults-a37-commercial-governance.yml'

concurrency:
  group: kidults-a37-commercial-governance
  cancel-in-progress: false

jobs:
  a37-commercial-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json

      - name: Install dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --no-audit --no-fund

      - name: Verify A37 package scripts exist
        working-directory: services/kidults-autonomous-intelligence
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            const required = ['a37:gate', 'a37:certify', 'a37:finalize'];
            const missing = required.filter(s => !pkg.scripts[s]);
            if (missing.length) { console.error('MISSING SCRIPTS:', missing.join(', ')); process.exit(1); }
            console.log('A37 scripts present:', required.join(', '));
          "

      - name: Typecheck
        working-directory: services/kidults-autonomous-intelligence
        run: npm run typecheck

      - name: Run A37 commercial governance gate
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a37:gate
        env:
          A37_MODE: SIMULATION

      - name: Run A37 certify
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a37:certify
        env:
          A37_MODE: SIMULATION

      - name: Run upstream A36 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a36:certify
        env:
          A36_MODE: SIMULATION

      - name: Run upstream A35 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a35:certify
        env:
          A35_MODE: SIMULATION

      - name: Run upstream A34 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a34:certify
        env:
          A34_MODE: SIMULATION

      - name: Run upstream A33 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a33:certify
        env:
          A33_MODE: SIMULATION

      - name: Run upstream A32 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a32:certify
        env:
          A32_MODE: SIMULATION

      - name: List package scripts
        working-directory: services/kidults-autonomous-intelligence
        run: npm run

      - name: Upload A37 evidence
        uses: actions/upload-artifact@v4
        with:
          name: a37-commercial-governance-evidence
          path: services/kidults-autonomous-intelligence/reports/commercial-governance/
          retention-days: 90
          if-no-files-found: error
