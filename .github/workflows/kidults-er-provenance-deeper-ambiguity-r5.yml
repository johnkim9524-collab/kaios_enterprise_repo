name: KIDULTS ER Provenance Deeper Ambiguity R5
on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/probe-provenance-deeper-ambiguity-r5.mjs'
      - 'scripts/kidults/entity-resolution/build-provenance-deeper-ambiguity-packet-r5.mjs'
      - '.github/workflows/kidults-er-provenance-deeper-ambiguity-r5.yml'
      - 'scripts/kidults/entity-resolution/probe-provenance-deeper-ambiguity-r4.mjs'
      - 'scripts/kidults/entity-resolution/build-provenance-deeper-ambiguity-packet-r4.mjs'
      - 'scripts/kidults/entity-resolution/probe-provenance-deep-ambiguity-r3.mjs'
      - 'scripts/kidults/entity-resolution/build-provenance-deep-ambiguity-packet-r3.mjs'
      - 'scripts/kidults/entity-resolution/probe-provenance-residual-capacity-r2.mjs'
      - 'scripts/kidults/entity-resolution/build-provenance-residual-review-packet-r2.mjs'
      - 'scripts/kidults/entity-resolution/acquire-provenance-source-corpus-r1.mjs'
      - 'scripts/kidults/entity-resolution/build-provenance-review-packet-r1.mjs'
      - 'coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json'
      - 'coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  close-provenance-material-deficit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild current 73-case Provenance base plus residual packet
        run: |
          node scripts/kidults/entity-resolution/acquire-provenance-source-corpus-r1.mjs /tmp/provenance-source-corpus-r1.json
          node scripts/kidults/entity-resolution/build-provenance-review-packet-r1.mjs /tmp/provenance-source-corpus-r1.json coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json /tmp/provenance-review-packet-r1.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/provenance-review-packet-r1.json','utf8'));const refs=[];for(const c of x.cases||[]){if(c.source_a_reference)refs.push(c.source_a_reference);if(c.source_b_reference)refs.push(c.source_b_reference);}fs.writeFileSync('/tmp/exclude-base.json',JSON.stringify({references:[...new Set(refs)].sort()},null,2));
          NODE
          node scripts/kidults/entity-resolution/probe-provenance-residual-capacity-r2.mjs /tmp/provenance-residual-capacity-r2.json /tmp/exclude-base.json
          node scripts/kidults/entity-resolution/build-provenance-residual-review-packet-r2.mjs /tmp/provenance-residual-capacity-r2.json coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json /tmp/provenance-residual-review-packet-r2.json
      - name: Rebuild current R3 and R4 packets and exact 94-case exclusion set
        run: |
          node - <<'NODE'
          const fs=require('fs');const base=JSON.parse(fs.readFileSync('/tmp/provenance-review-packet-r1.json','utf8'));const r2=JSON.parse(fs.readFileSync('/tmp/provenance-residual-review-packet-r2.json','utf8'));const refs=[];for(const c of [...(base.cases||[]),...(r2.cases||[])]){if(c.source_a_reference)refs.push(c.source_a_reference);if(c.source_b_reference)refs.push(c.source_b_reference);for(const r of c.source_b_references||[])refs.push(r);}fs.writeFileSync('/tmp/exclude-r3-input.json',JSON.stringify({references:[...new Set(refs)].sort()},null,2));
          NODE
          node scripts/kidults/entity-resolution/probe-provenance-deep-ambiguity-r3.mjs /tmp/provenance-deep-ambiguity-r3.json /tmp/exclude-r3-input.json
          node scripts/kidults/entity-resolution/build-provenance-deep-ambiguity-packet-r3.mjs /tmp/provenance-deep-ambiguity-r3.json coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json /tmp/provenance-deep-ambiguity-packet-r3.json
          node - <<'NODE'
          const fs=require('fs');const files=['/tmp/provenance-review-packet-r1.json','/tmp/provenance-residual-review-packet-r2.json','/tmp/provenance-deep-ambiguity-packet-r3.json'];const refs=[];for(const f of files){const x=JSON.parse(fs.readFileSync(f,'utf8'));for(const c of x.cases||[]){if(c.source_a_reference)refs.push(c.source_a_reference);if(c.source_b_reference)refs.push(c.source_b_reference);for(const r of c.source_b_references||[])refs.push(r);}}fs.writeFileSync('/tmp/provenance-exclude-r4.json',JSON.stringify({references:[...new Set(refs)].sort()},null,2));
          NODE
          node scripts/kidults/entity-resolution/probe-provenance-deeper-ambiguity-r4.mjs /tmp/provenance-deeper-ambiguity-r4.json /tmp/provenance-exclude-r4.json
          node scripts/kidults/entity-resolution/build-provenance-deeper-ambiguity-packet-r4.mjs /tmp/provenance-deeper-ambiguity-r4.json coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json /tmp/provenance-deeper-ambiguity-packet-r4.json
          node - <<'NODE'
          const fs=require('fs');const base=JSON.parse(fs.readFileSync('/tmp/provenance-review-packet-r1.json','utf8'));const r2=JSON.parse(fs.readFileSync('/tmp/provenance-residual-review-packet-r2.json','utf8'));const r3=JSON.parse(fs.readFileSync('/tmp/provenance-deep-ambiguity-packet-r3.json','utf8'));const r4=JSON.parse(fs.readFileSync('/tmp/provenance-deeper-ambiguity-packet-r4.json','utf8'));const packets=[base,r2,r3,r4];const count=packets.reduce((n,x)=>n+(x.case_count||0),0);if(count!==94||r4.case_count!==15||r4.total_reviewer_ready_if_combined!==94) throw new Error(`CURRENT_94_NOT_REPRODUCED:${count}:${r4.case_count}`);const refs=[];for(const x of packets){for(const c of x.cases||[]){if(c.source_a_reference)refs.push(c.source_a_reference);if(c.source_b_reference)refs.push(c.source_b_reference);for(const r of c.source_b_references||[])refs.push(r);}}fs.writeFileSync('/tmp/provenance-exclude-r5.json',JSON.stringify({references:[...new Set(refs)].sort()},null,2));console.log(JSON.stringify({current_reviewer_ready:count,excluded_reference_count:[...new Set(refs)].length}));
          NODE
      - name: Measure pages 241-480 remaining ambiguity capacity
        run: node scripts/kidults/entity-resolution/probe-provenance-deeper-ambiguity-r5.mjs /tmp/provenance-deeper-ambiguity-r5.json /tmp/provenance-exclude-r5.json
      - name: Packetize only proven R5 ambiguity cases
        run: node scripts/kidults/entity-resolution/build-provenance-deeper-ambiguity-packet-r5.mjs /tmp/provenance-deeper-ambiguity-r5.json coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json /tmp/provenance-deeper-ambiguity-packet-r5.json
      - name: Enforce source-disjoint fail-closed boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const cap=JSON.parse(fs.readFileSync('/tmp/provenance-deeper-ambiguity-r5.json','utf8'));const packet=JSON.parse(fs.readFileSync('/tmp/provenance-deeper-ambiguity-packet-r5.json','utf8'));const excluded=new Set(JSON.parse(fs.readFileSync('/tmp/provenance-exclude-r5.json','utf8')).references||[]);
          if(cap.stratum_id!=='er-stratum-provenance-unique-object'||cap.rights_state!=='ALLOW') throw new Error('STRATUM_OR_RIGHTS');
          if(cap.metrics.target_remaining_ambiguity_capacity!==26||cap.metrics.source_disjoint_ambiguity_capacity>26) throw new Error('CAPACITY_BOUNDARY');
          if(packet.case_count!==cap.metrics.source_disjoint_ambiguity_capacity||packet.total_reviewer_ready_if_combined!==94+packet.case_count||packet.remaining_case_count!==26-packet.case_count) throw new Error('PACKET_CAPACITY_MISMATCH');
          const refs=[];for(const c of packet.cases||[]){refs.push(c.source_a_reference,...(c.source_b_references||[]));}if(refs.some(r=>excluded.has(r))||new Set(refs).size!==refs.length) throw new Error('SOURCE_REFERENCE_REUSE');
          if(packet.labels_present!==false||packet.reviewer_a!=='NOT_ASSIGNED'||packet.reviewer_b!=='NOT_ASSIGNED'||packet.empirical_pass!==false||packet.track_b!=='NOT_STARTED') throw new Error('OVERCLAIM');
          if(packet.production!=='HOLD'||packet.public_release!=='HOLD'||packet.blind_partition.state!=='CANDIDATE_NOT_SEALED') throw new Error('RELEASE_BOUNDARY');
          if(/"payload"\s*:/.test(JSON.stringify({cap,packet}))) throw new Error('RAW_PAYLOAD_FIELD_FORBIDDEN');
          console.log(JSON.stringify({additional:packet.case_count,total_provenance:packet.total_reviewer_ready_if_combined,remaining:packet.remaining_case_count,blind_candidates_added:packet.blind_partition.case_count,production:'HOLD'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-er-provenance-deeper-ambiguity-r5
          path: |
            /tmp/provenance-deeper-ambiguity-r5.json
            /tmp/provenance-deeper-ambiguity-packet-r5.json
          retention-days: 14
