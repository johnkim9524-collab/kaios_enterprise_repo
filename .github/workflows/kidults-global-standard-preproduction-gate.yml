name: KIDULTS Global Standard Preproduction Gate

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/global-standard-preproduction-gate-v1.json'
      - 'coordination/kidults/kpmo/zero-base-global-standard-review-v2.md'
      - 'scripts/kidults/governance/validate-global-standard-preproduction-gate-v1.mjs'
      - '.github/workflows/kidults-global-standard-preproduction-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check scripts/kidults/governance/validate-global-standard-preproduction-gate-v1.mjs
      - name: Validate global-standard completion gate
        run: node scripts/kidults/governance/validate-global-standard-preproduction-gate-v1.mjs
