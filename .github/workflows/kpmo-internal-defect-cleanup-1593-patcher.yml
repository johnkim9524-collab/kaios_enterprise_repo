name: KPMO Internal Defect Cleanup 1593 Patcher

on:
  push:
    branches:
      - fix/asi-p1-transitive-lineage-1593-v1
    paths:
      - '.github/workflows/kpmo-internal-defect-cleanup-1593-patcher.yml'

permissions:
  contents: read

concurrency:
  group: kpmo-internal-defect-cleanup-1593-patcher
  cancel-in-progress: false

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply and prove deterministic transitive-lineage correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kidults/kpmo/internal-defect-cleanup-1593-patcher.py
          node --check scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs
          node --check tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs
          node tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs
          git diff --check

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: internal-defect-1593-patched-files-${{ github.sha }}-${{ github.run_id }}
          path: |
            .github/workflows/kidults-asi-p1-source-preflight-v1.yml
            .github/workflows/kidults-asi-autonomous-resolution-layer-v1.yml
            scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs
            tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
