name: KPMO Internal Defect Cleanup 1593 Patcher

on:
  push:
    branches:
      - fix/asi-p1-transitive-lineage-1593-v1
    paths:
      - '.github/workflows/kpmo-internal-defect-cleanup-1593-patcher.yml'

permissions:
  contents: write

concurrency:
  group: kpmo-internal-defect-cleanup-1593-patcher
  cancel-in-progress: false

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply transitive P0B to P1 to ARL lineage correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p1_path = Path('.github/workflows/kidults-asi-p1-source-preflight-v1.yml')
          arl_path = Path('.github/workflows/kidults-asi-autonomous-resolution-layer-v1.yml')
          validator_path = Path('scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs')
          test_path = Path('tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs')

          def replace_count(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          validator = r'''#!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const SHA_RE = /^[0-9a-f]{40}$/;
          const DIGEST_RE = /^sha256:[0-9a-f]{64}$/;
          const P0B_ARTIFACT_NAME = 'kidults-asi-p0b-bounded-discovery-candidates-v1';
          const P1_ARTIFACT_NAME = 'kidults-asi-p1-source-preflight-v1';
          const CONTROL_MODES = new Set([
            'REBUILT_LOCAL_CONTROL',
            'ANCESTOR_MAIN_CONTROL_FOR_PULL_REQUEST'
          ]);

          export class P1LineageValidationError extends Error {
            constructor(code, detail = '') {
              super(detail ? `${code}:${detail}` : code);
              this.name = 'P1LineageValidationError';
              this.code = code;
            }
          }

          function fail(code, detail = '') {
            throw new P1LineageValidationError(code, detail);
          }

          function requireCondition(condition, code, detail = '') {
            if (!condition) fail(code, detail);
          }

          function positiveInteger(value, field, nullable = false) {
            if (value === null || value === undefined || value === '') {
              if (nullable) return null;
              fail('POSITIVE_INTEGER_REQUIRED', field);
            }
            const parsed = Number(value);
            requireCondition(Number.isSafeInteger(parsed) && parsed > 0, 'POSITIVE_INTEGER_REQUIRED', field);
            return parsed;
          }

          function nullableString(value) {
            return value === null || value === undefined || value === '' ? null : String(value);
          }

          export function validateP1ReceiptClassification(receipt) {
            requireCondition(receipt && typeof receipt === 'object' && !Array.isArray(receipt), 'RECEIPT_OBJECT_REQUIRED');
            requireCondition(receipt.id === 'kidults-asi-p1-source-preflight-receipt-v1', 'RECEIPT_ID_MISMATCH');
            requireCondition(receipt.state === 'VERIFIED_PASS', 'RECEIPT_STATE_NOT_VERIFIED_PASS');
            requireCondition(SHA_RE.test(String(receipt.source_sha || '')), 'SOURCE_SHA_INVALID');
            requireCondition(SHA_RE.test(String(receipt.p0b_origin_source_sha || '')), 'P0B_ORIGIN_SOURCE_SHA_INVALID');
            requireCondition(receipt.public_release === 'HOLD', 'PUBLIC_RELEASE_NOT_HOLD');
            requireCondition(receipt.production === 'HOLD', 'PRODUCTION_NOT_HOLD');
            requireCondition(receipt.g5 === 'HOLD', 'G5_NOT_HOLD');

            const mode = String(receipt.p0b_input_mode || '');
            const role = String(receipt.artifact_role || '');
            const originRunId = positiveInteger(receipt.p0b_origin_run_id, 'p0b_origin_run_id', true);
            const originArtifactId = positiveInteger(receipt.p0b_origin_artifact_id, 'p0b_origin_artifact_id', true);
            const originArtifactName = nullableString(receipt.p0b_origin_artifact_name);
            const originArtifactDigest = nullableString(receipt.p0b_origin_artifact_digest);
            const originArtifactCardinality = Number(receipt.p0b_origin_artifact_cardinality);
            const authoritativeSignals = [
              receipt.trigger_event === 'workflow_run',
              mode === 'EXACT_TRIGGERING_WORKFLOW_RUN',
              role === 'AUTHORITATIVE_P1_PRODUCER',
              receipt.authoritative_producer === true,
              receipt.downstream_consumable === true
            ];
            const authoritative = authoritativeSignals.some(Boolean);

            if (authoritative) {
              requireCondition(authoritativeSignals.every(Boolean), 'PARTIAL_AUTHORITATIVE_SIGNAL_SET');
              requireCondition(receipt.trigger_event === 'workflow_run', 'AUTHORITATIVE_TRIGGER_NOT_WORKFLOW_RUN');
              requireCondition(mode === 'EXACT_TRIGGERING_WORKFLOW_RUN', 'AUTHORITATIVE_P0B_MODE_NOT_EXACT');
              requireCondition(role === 'AUTHORITATIVE_P1_PRODUCER', 'AUTHORITATIVE_ROLE_MISMATCH');
              requireCondition(receipt.authoritative_producer === true, 'AUTHORITATIVE_PRODUCER_FALSE');
              requireCondition(receipt.downstream_consumable === true, 'DOWNSTREAM_CONSUMABLE_FALSE');
              requireCondition(originRunId !== null, 'P0B_ORIGIN_RUN_ID_MISSING');
              requireCondition(originArtifactId !== null, 'P0B_ORIGIN_ARTIFACT_ID_MISSING');
              requireCondition(originArtifactName === P0B_ARTIFACT_NAME, 'P0B_ORIGIN_ARTIFACT_NAME_MISMATCH');
              requireCondition(DIGEST_RE.test(String(originArtifactDigest || '')), 'P0B_ORIGIN_ARTIFACT_DIGEST_INVALID');
              requireCondition(originArtifactCardinality === 1, 'P0B_ORIGIN_ARTIFACT_CARDINALITY_NOT_ONE');
              requireCondition(receipt.p0b_origin_source_sha === receipt.source_sha, 'P0B_TO_P1_SOURCE_SHA_MISMATCH');
              return {
                state: 'AUTHORITATIVE_LINEAGE_VERIFIED',
                authoritative: true,
                downstream_consumable: true,
                p0b_origin_run_id: originRunId,
                p0b_origin_artifact_id: originArtifactId,
                p0b_origin_artifact_name: originArtifactName,
                p0b_origin_artifact_digest: originArtifactDigest,
                p0b_origin_artifact_cardinality: originArtifactCardinality,
                source_sha: receipt.source_sha
              };
            }

            requireCondition(CONTROL_MODES.has(mode), 'UNKNOWN_CONTROL_INPUT_MODE');
            requireCondition(role === 'CONTROL_NON_CONSUMABLE', 'CONTROL_ROLE_MISMATCH');
            requireCondition(receipt.authoritative_producer === false, 'CONTROL_MARKED_AUTHORITATIVE');
            requireCondition(receipt.downstream_consumable === false, 'CONTROL_MARKED_CONSUMABLE');
            requireCondition(receipt.trigger_event !== 'workflow_run', 'WORKFLOW_RUN_CANNOT_BE_CONTROL_MODE');

            if (mode === 'REBUILT_LOCAL_CONTROL') {
              requireCondition(['workflow_dispatch', 'schedule', 'push'].includes(receipt.trigger_event), 'LOCAL_CONTROL_TRIGGER_INVALID');
              requireCondition(originRunId === null, 'LOCAL_CONTROL_ORIGIN_RUN_FORBIDDEN');
              requireCondition(originArtifactId === null, 'LOCAL_CONTROL_ORIGIN_ARTIFACT_FORBIDDEN');
              requireCondition(originArtifactName === null, 'LOCAL_CONTROL_ARTIFACT_NAME_FORBIDDEN');
              requireCondition(originArtifactDigest === null, 'LOCAL_CONTROL_ARTIFACT_DIGEST_FORBIDDEN');
              requireCondition(originArtifactCardinality === 0, 'LOCAL_CONTROL_ARTIFACT_CARDINALITY_NOT_ZERO');
              requireCondition(receipt.p0b_origin_source_sha === receipt.source_sha, 'LOCAL_CONTROL_SOURCE_SHA_MISMATCH');
            } else {
              requireCondition(receipt.trigger_event === 'pull_request', 'PR_CONTROL_TRIGGER_INVALID');
              requireCondition(originRunId !== null, 'PR_CONTROL_ORIGIN_RUN_REQUIRED');
              requireCondition(originArtifactId !== null, 'PR_CONTROL_ORIGIN_ARTIFACT_REQUIRED');
              requireCondition(originArtifactName === P0B_ARTIFACT_NAME, 'PR_CONTROL_ARTIFACT_NAME_MISMATCH');
              requireCondition(DIGEST_RE.test(String(originArtifactDigest || '')), 'PR_CONTROL_ARTIFACT_DIGEST_INVALID');
              requireCondition(originArtifactCardinality === 1, 'PR_CONTROL_ARTIFACT_CARDINALITY_NOT_ONE');
            }

            return {
              state: 'CONTROL_NON_CONSUMABLE_VERIFIED',
              authoritative: false,
              downstream_consumable: false,
              p0b_origin_run_id: originRunId,
              p0b_origin_artifact_id: originArtifactId,
              source_sha: receipt.source_sha
            };
          }

          export function validateP1ConsumerLineage(receipt, expected) {
            const classification = validateP1ReceiptClassification(receipt);
            requireCondition(classification.authoritative === true, 'CONTROL_ARTIFACT_NOT_CONSUMABLE');

            const p1RunId = positiveInteger(expected?.p1_run_id, 'p1_run_id');
            const p1ArtifactId = positiveInteger(expected?.p1_artifact_id, 'p1_artifact_id');
            const p1ArtifactDigest = String(expected?.p1_artifact_digest || '');
            const p1ArtifactName = String(expected?.p1_artifact_name || '');
            const p1SourceSha = String(expected?.p1_source_sha || '');
            const consumerSha = String(expected?.consumer_sha || '');

            requireCondition(p1ArtifactName === P1_ARTIFACT_NAME, 'P1_ARTIFACT_NAME_MISMATCH');
            requireCondition(DIGEST_RE.test(p1ArtifactDigest), 'P1_ARTIFACT_DIGEST_INVALID');
            requireCondition(SHA_RE.test(p1SourceSha), 'P1_SOURCE_SHA_INVALID');
            requireCondition(SHA_RE.test(consumerSha), 'CONSUMER_SHA_INVALID');
            requireCondition(receipt.source_sha === p1SourceSha, 'RECEIPT_TO_P1_SOURCE_SHA_MISMATCH');
            requireCondition(p1SourceSha === consumerSha, 'P1_TO_CONSUMER_SOURCE_SHA_MISMATCH');
            requireCondition(p1RunId !== classification.p0b_origin_run_id, 'P1_RUN_SELF_ORIGIN_FORBIDDEN');
            requireCondition(p1ArtifactId !== classification.p0b_origin_artifact_id, 'P1_ARTIFACT_SELF_ORIGIN_FORBIDDEN');

            return {
              id: 'kidults-asi-p1-authoritative-lineage-validation-v1',
              state: 'COMPLETE_VERIFIED',
              p1_run_id: p1RunId,
              p1_artifact_id: p1ArtifactId,
              p1_artifact_name: p1ArtifactName,
              p1_artifact_digest: p1ArtifactDigest,
              p1_source_sha: p1SourceSha,
              consumer_sha: consumerSha,
              p0b_origin_run_id: classification.p0b_origin_run_id,
              p0b_origin_artifact_id: classification.p0b_origin_artifact_id,
              p0b_origin_artifact_name: classification.p0b_origin_artifact_name,
              p0b_origin_artifact_digest: classification.p0b_origin_artifact_digest,
              p0b_origin_artifact_cardinality: classification.p0b_origin_artifact_cardinality,
              authoritative_producer: true,
              downstream_consumable: true,
              candidate_created: false,
              evidence_created: false,
              public_release: 'HOLD',
              production: 'HOLD',
              g5: 'HOLD'
            };
          }

          function argument(name) {
            const index = process.argv.indexOf(name);
            return index >= 0 ? process.argv[index + 1] : null;
          }

          function runCli() {
            const mode = argument('--mode');
            const receiptPath = argument('--receipt');
            requireCondition(mode === 'producer' || mode === 'consumer', 'CLI_MODE_INVALID');
            requireCondition(Boolean(receiptPath), 'CLI_RECEIPT_PATH_REQUIRED');
            const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
            const result = mode === 'producer'
              ? validateP1ReceiptClassification(receipt)
              : validateP1ConsumerLineage(receipt, {
                  p1_run_id: process.env.P1_RUN_ID,
                  p1_artifact_id: process.env.P1_ARTIFACT_ID,
                  p1_artifact_name: process.env.P1_ARTIFACT_NAME || P1_ARTIFACT_NAME,
                  p1_artifact_digest: process.env.P1_ARTIFACT_DIGEST,
                  p1_source_sha: process.env.P1_SOURCE_SHA,
                  consumer_sha: process.env.CONSUMER_SHA
                });
            process.stdout.write(`${JSON.stringify(result, null, 2)}\n`);
          }

          const invokedPath = process.argv[1] ? path.resolve(process.argv[1]) : '';
          if (invokedPath === fileURLToPath(import.meta.url)) {
            try {
              runCli();
            } catch (error) {
              const code = error instanceof P1LineageValidationError ? error.code : 'UNEXPECTED_VALIDATION_ERROR';
              process.stderr.write(`${code}:${error.message}\n`);
              process.exit(1);
            }
          }
          '''

          test = r'''#!/usr/bin/env node
          import assert from 'node:assert/strict';
          import {
            P1LineageValidationError,
            validateP1ConsumerLineage,
            validateP1ReceiptClassification
          } from '../../../scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs';

          const sha = 'a'.repeat(40);
          const digest = `sha256:${'b'.repeat(64)}`;
          const p1Digest = `sha256:${'c'.repeat(64)}`;

          const authoritative = {
            id: 'kidults-asi-p1-source-preflight-receipt-v1',
            version: '1.1.0',
            state: 'VERIFIED_PASS',
            source_sha: sha,
            trigger_event: 'workflow_run',
            p0b_input_mode: 'EXACT_TRIGGERING_WORKFLOW_RUN',
            p0b_origin_run_id: 101,
            p0b_origin_source_sha: sha,
            p0b_origin_artifact_name: 'kidults-asi-p0b-bounded-discovery-candidates-v1',
            p0b_origin_artifact_id: 201,
            p0b_origin_artifact_digest: digest,
            p0b_origin_artifact_cardinality: 1,
            artifact_role: 'AUTHORITATIVE_P1_PRODUCER',
            authoritative_producer: true,
            downstream_consumable: true,
            public_release: 'HOLD',
            production: 'HOLD',
            g5: 'HOLD'
          };

          const expected = {
            p1_run_id: 301,
            p1_artifact_id: 401,
            p1_artifact_name: 'kidults-asi-p1-source-preflight-v1',
            p1_artifact_digest: p1Digest,
            p1_source_sha: sha,
            consumer_sha: sha
          };

          assert.equal(validateP1ReceiptClassification(authoritative).state, 'AUTHORITATIVE_LINEAGE_VERIFIED');
          assert.equal(validateP1ConsumerLineage(authoritative, expected).state, 'COMPLETE_VERIFIED');

          const manualControl = {
            ...authoritative,
            trigger_event: 'workflow_dispatch',
            p0b_input_mode: 'REBUILT_LOCAL_CONTROL',
            p0b_origin_run_id: null,
            p0b_origin_artifact_name: null,
            p0b_origin_artifact_id: null,
            p0b_origin_artifact_digest: null,
            p0b_origin_artifact_cardinality: 0,
            artifact_role: 'CONTROL_NON_CONSUMABLE',
            authoritative_producer: false,
            downstream_consumable: false
          };
          assert.equal(validateP1ReceiptClassification(manualControl).state, 'CONTROL_NON_CONSUMABLE_VERIFIED');
          assert.throws(() => validateP1ConsumerLineage(manualControl, expected), P1LineageValidationError);

          const prControl = {
            ...authoritative,
            trigger_event: 'pull_request',
            p0b_input_mode: 'ANCESTOR_MAIN_CONTROL_FOR_PULL_REQUEST',
            artifact_role: 'CONTROL_NON_CONSUMABLE',
            authoritative_producer: false,
            downstream_consumable: false,
            source_sha: 'd'.repeat(40),
            p0b_origin_source_sha: sha
          };
          assert.equal(validateP1ReceiptClassification(prControl).state, 'CONTROL_NON_CONSUMABLE_VERIFIED');
          assert.throws(() => validateP1ConsumerLineage(prControl, expected), P1LineageValidationError);

          const rejectedMutations = [
            ['local-renamed-authoritative', {...manualControl, artifact_role: 'AUTHORITATIVE_P1_PRODUCER'}],
            ['null-p0b-run', {...authoritative, p0b_origin_run_id: null}],
            ['null-p0b-artifact', {...authoritative, p0b_origin_artifact_id: null}],
            ['wrong-p0b-name', {...authoritative, p0b_origin_artifact_name: 'renamed-control'}],
            ['wrong-p0b-digest', {...authoritative, p0b_origin_artifact_digest: 'sha256:bad'}],
            ['wrong-p0b-cardinality', {...authoritative, p0b_origin_artifact_cardinality: 2}],
            ['wrong-p0b-sha', {...authoritative, p0b_origin_source_sha: 'e'.repeat(40)}],
            ['partial-authority', {...authoritative, downstream_consumable: false}],
            ['unknown-control-mode', {...manualControl, p0b_input_mode: 'UNKNOWN'}]
          ];
          for (const [name, receipt] of rejectedMutations) {
            assert.throws(
              () => validateP1ReceiptClassification(receipt),
              P1LineageValidationError,
              name
            );
          }

          assert.throws(
            () => validateP1ConsumerLineage(authoritative, {...expected, p1_run_id: 101}),
            P1LineageValidationError
          );
          assert.throws(
            () => validateP1ConsumerLineage(authoritative, {...expected, p1_artifact_id: 201}),
            P1LineageValidationError
          );
          assert.throws(
            () => validateP1ConsumerLineage(authoritative, {...expected, consumer_sha: 'f'.repeat(40)}),
            P1LineageValidationError
          );
          assert.throws(
            () => validateP1ConsumerLineage(authoritative, {...expected, p1_artifact_digest: 'sha256:bad'}),
            P1LineageValidationError
          );

          console.log(JSON.stringify({
            suite: 'KIDULTS_ASI_P1_AUTHORITATIVE_LINEAGE_V1',
            result: 'PASS',
            exact_workflow_run_lineage_accepted: true,
            rebuilt_local_control_non_consumable: true,
            pull_request_control_non_consumable: true,
            transitive_p0b_run_artifact_digest_sha_cardinality_enforced: true,
            self_origin_rejected: true,
            candidate_created: false,
            evidence_created: false,
            public_release: 'HOLD',
            production: 'HOLD',
            g5: 'HOLD'
          }, null, 2));
          '''

          # Remove indentation introduced by this bootstrap source.
          validator = '\n'.join(line[10:] if line.startswith('          ') else line for line in validator.splitlines()) + '\n'
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          validator_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.parent.mkdir(parents=True, exist_ok=True)
          validator_path.write_text(validator, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')

          p1 = p1_path.read_text(encoding='utf-8')
          p1_registry_path = "      - 'scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-registry-v1.mjs'\n"
          p1 = replace_count(
              p1,
              p1_registry_path,
              p1_registry_path
              + "      - 'scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs'\n"
              + "      - 'tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs'\n",
              2,
              'p1 path triggers'
          )
          p1 = replace_count(
              p1,
              "            scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-registry-v1.mjs \\\n            services/kidults-autonomous-intelligence/scripts/asi-p1-source-preflight-runtime-test.mjs; do\n",
              "            scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-registry-v1.mjs \\\n            scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs \\\n            tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs \\\n            services/kidults-autonomous-intelligence/scripts/asi-p1-source-preflight-runtime-test.mjs; do\n",
              1,
              'p1 syntax inventory'
          )
          p1 = replace_count(
              p1,
              "          node -e \"JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-p1-source-preflight-registry-v1.json','utf8'))\"\n",
              "          node -e \"JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-p1-source-preflight-registry-v1.json','utf8'))\"\n"
              "          node tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs\n",
              1,
              'p1 regression execution'
          )

          artifact_marker = '          [[ "$P0B_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]\n'
          artifact_metadata = '''          P0B_ORIGIN_ARTIFACT_NAME=$(jq -r --argjson id "$P0B_ARTIFACT_ID" '.artifacts[] | select(.id==$id) | .name' /tmp/p0b-artifacts.json)
          P0B_ORIGIN_ARTIFACT_DIGEST=$(jq -r --argjson id "$P0B_ARTIFACT_ID" '.artifacts[] | select(.id==$id) | .digest // empty' /tmp/p0b-artifacts.json)
          P0B_ORIGIN_ARTIFACT_CARDINALITY=$(jq -r --argjson run "${P0B_EVENT_RUN_ID:-$P0B_ORIGIN_RUN_ID}" --arg sha "${P0B_EVENT_SOURCE_SHA:-$P0B_ORIGIN_SOURCE_SHA}" '[.artifacts[] | select(.name=="kidults-asi-p0b-bounded-discovery-candidates-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' /tmp/p0b-artifacts.json)
          test "$P0B_ORIGIN_ARTIFACT_NAME" = "kidults-asi-p0b-bounded-discovery-candidates-v1"
          [[ "$P0B_ORIGIN_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$P0B_ORIGIN_ARTIFACT_CARDINALITY" = "1"
'''
          p1 = replace_count(p1, artifact_marker, artifact_marker + artifact_metadata, 2, 'p0b artifact metadata binding')

          exact_echo = '          echo "P0B_ORIGIN_SOURCE_SHA=$P0B_EVENT_SOURCE_SHA" >> "$GITHUB_ENV"\n'
          pr_echo = '          echo "P0B_ORIGIN_SOURCE_SHA=$P0B_ORIGIN_SOURCE_SHA" >> "$GITHUB_ENV"\n'
          artifact_env = '''          echo "P0B_ORIGIN_ARTIFACT_NAME=$P0B_ORIGIN_ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_ARTIFACT_ID=$P0B_ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_ARTIFACT_DIGEST=$P0B_ORIGIN_ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_ARTIFACT_CARDINALITY=$P0B_ORIGIN_ARTIFACT_CARDINALITY" >> "$GITHUB_ENV"
'''
          p1 = replace_count(p1, exact_echo, exact_echo + artifact_env, 1, 'exact p0b artifact env')
          p1 = replace_count(p1, pr_echo, pr_echo + artifact_env, 1, 'pr p0b artifact env')
          local_echo = '          echo "P0B_ORIGIN_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"\n'
          local_env = '''          echo "P0B_ORIGIN_ARTIFACT_NAME=" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_ARTIFACT_ID=" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_ARTIFACT_DIGEST=" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_ARTIFACT_CARDINALITY=0" >> "$GITHUB_ENV"
'''
          p1 = replace_count(p1, local_echo, local_echo + local_env, 1, 'local control artifact env')

          receipt_block = '''      - name: Emit and validate KPMO P1 source-preflight receipt
        run: |
          set -euo pipefail
          node - <<'NODE' >/tmp/kidults-asi-p1-source-preflight-receipt-v1.json
          const fs=require('fs');
          const crypto=require('crypto');
          const p='/tmp/kidults-asi-p1-source-preflight-v1/p1-source-preflight-manifest-v1.json';
          const m=JSON.parse(fs.readFileSync(p));
          const runtime=JSON.parse(fs.readFileSync('/tmp/kidults-asi-p1-source-preflight-runtime-receipts-v1.json'));
          const digest='sha256:'+crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const positive=(value)=>/^[1-9][0-9]*$/.test(String(value||''))?Number(value):null;
          const authoritative=process.env.GITHUB_EVENT_NAME==='workflow_run'&&process.env.P0B_INPUT_MODE==='EXACT_TRIGGERING_WORKFLOW_RUN';
          const receipt={
            id:'kidults-asi-p1-source-preflight-receipt-v1',
            version:'1.1.0',
            state:'VERIFIED_PASS',
            source_sha:process.env.GITHUB_SHA,
            trigger_event:process.env.GITHUB_EVENT_NAME,
            p0b_input_mode:process.env.P0B_INPUT_MODE,
            p0b_origin_run_id:positive(process.env.P0B_ORIGIN_RUN_ID),
            p0b_origin_source_sha:process.env.P0B_ORIGIN_SOURCE_SHA,
            p0b_origin_artifact_name:process.env.P0B_ORIGIN_ARTIFACT_NAME||null,
            p0b_origin_artifact_id:positive(process.env.P0B_ORIGIN_ARTIFACT_ID),
            p0b_origin_artifact_digest:process.env.P0B_ORIGIN_ARTIFACT_DIGEST||null,
            p0b_origin_artifact_cardinality:Number(process.env.P0B_ORIGIN_ARTIFACT_CARDINALITY||0),
            artifact_role:authoritative?'AUTHORITATIVE_P1_PRODUCER':'CONTROL_NON_CONSUMABLE',
            authoritative_producer:authoritative,
            downstream_consumable:authoritative,
            manifest_digest:digest,
            results:m.results,
            runtime_preflight:{
              grains:runtime.candidate_mission_grains_runtime_preflighted,
              tasks:runtime.source_preflight_tasks_runtime_preflighted,
              classification_tasks:runtime.classification_tasks_runtime_preflighted,
              qualification_tasks:runtime.qualification_tasks_runtime_preflighted,
              fleets:runtime.runtime_registered_fleets_exercised,
              receipts:runtime.alignment_receipts
            },
            autonomous_effect:m.autonomous_effect,
            global_effect:m.global_effect,
            irreplaceable_value_effect:m.irreplaceable_value_effect,
            transparency_effect:m.transparency_effect,
            candidate_created:false,
            evidence_created:false,
            public_release:'HOLD',
            production:'HOLD',
            g5:'HOLD'
          };
          process.stdout.write(JSON.stringify(receipt,null,2)+'\\n');
          NODE
          node scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs \\
            --mode producer \\
            --receipt /tmp/kidults-asi-p1-source-preflight-receipt-v1.json \\
            | tee /tmp/kidults-asi-p1-authoritative-lineage-validation-v1.json
          cat /tmp/kidults-asi-p1-source-preflight-receipt-v1.json
'''
          p1, count = re.subn(
              r"      - name: Emit KPMO P1 source-preflight receipt\n        run: \|\n.*?(?=      - uses: actions/upload-artifact@)",
              receipt_block,
              p1,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise RuntimeError(f'p1 receipt block: expected 1 match, found {count}')
          p1 = replace_count(
              p1,
              '            /tmp/kidults-asi-p1-source-preflight-receipt-v1.json\n',
              '            /tmp/kidults-asi-p1-source-preflight-receipt-v1.json\n'
              '            /tmp/kidults-asi-p1-authoritative-lineage-validation-v1.json\n',
              1,
              'p1 artifact receipt validation'
          )
          p1_path.write_text(p1, encoding='utf-8')

          arl = arl_path.read_text(encoding='utf-8')
          arl_provenance_path = "      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs'\n"
          arl = replace_count(
              arl,
              arl_provenance_path,
              arl_provenance_path
              + "      - 'scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs'\n"
              + "      - 'tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs'\n",
              2,
              'arl path triggers'
          )
          arl = replace_count(
              arl,
              "    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'\n",
              "    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run'\n",
              1,
              'arl upstream event gate'
          )
          arl = replace_count(
              arl,
              '          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs\n',
              '          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs\n'
              '          node --check scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs\n'
              '          node --check tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs\n',
              2,
              'arl syntax checks'
          )
          arl = replace_count(
              arl,
              '          node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs\n',
              '          node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs\n'
              '          node tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs\n',
              2,
              'arl lineage regression execution'
          )
          arl = replace_count(
              arl,
              '            p1-preflight-action-queue-v1.json; do\n',
              '            p1-preflight-action-queue-v1.json \\\n            kidults-asi-p1-source-preflight-receipt-v1.json; do\n',
              1,
              'arl receipt restoration'
          )

          binding_marker = '          P1_RUN_ID="$P1_RUN_ID" P1_ID="$P1_ID" P1_SOURCE_SHA="$P1_SOURCE_SHA" CURRENT_SHA="$CURRENT_SHA" P1_DIGEST="$P1_DIGEST" VALIDATION_ONLY="$VALIDATION_ONLY" P1_RECOVERY_DISPATCHED="$P1_RECOVERY_DISPATCHED" node - <<\'NODE\'\n'
          validator_call = '''          P1_RUN_ID="$P1_RUN_ID" \\
          P1_ARTIFACT_ID="$P1_ID" \\
          P1_ARTIFACT_NAME="kidults-asi-p1-source-preflight-v1" \\
          P1_ARTIFACT_DIGEST="$P1_DIGEST" \\
          P1_SOURCE_SHA="$P1_SOURCE_SHA" \\
          CONSUMER_SHA="$CURRENT_SHA" \\
            node scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs \\
              --mode consumer \\
              --receipt /tmp/p1-input/kidults-asi-p1-source-preflight-receipt-v1.json \\
              | tee /tmp/p1-authoritative-lineage-validation-v1.json
'''
          arl = replace_count(arl, binding_marker, validator_call + binding_marker, 1, 'arl consumer validator call')

          marker_index = arl.index(binding_marker)
          node_start = marker_index + len(binding_marker)
          node_end = arl.index('          NODE\n', node_start)
          binding_node = '''          const fs=require('fs');
          const receipt=JSON.parse(fs.readFileSync('/tmp/p1-input/kidults-asi-p1-source-preflight-receipt-v1.json','utf8'));
          const lineage=JSON.parse(fs.readFileSync('/tmp/p1-authoritative-lineage-validation-v1.json','utf8'));
          const binding={
            id:'kidults-asi-p1-upstream-artifact-binding-v1',
            version:'1.2.0',
            workflow_name:'KIDULTS ASI P1 Source Preflight v1',
            workflow_path:'.github/workflows/kidults-asi-p1-source-preflight-v1.yml',
            workflow_run_id:Number(process.env.P1_RUN_ID),
            artifact_name:'kidults-asi-p1-source-preflight-v1',
            artifact_id:Number(process.env.P1_ID),
            artifact_digest:process.env.P1_DIGEST,
            artifact_cardinality:1,
            head_branch:'main',
            source_sha:process.env.P1_SOURCE_SHA,
            consumer_sha:process.env.CURRENT_SHA,
            exact_generation_bound:true,
            exact_triggering_run_bound:process.env.GITHUB_EVENT_NAME==='workflow_run',
            recovery_dispatch_performed:process.env.P1_RECOVERY_DISPATCHED==='true',
            validation_only:process.env.VALIDATION_ONLY==='true',
            artifact_role:'AUTHORITATIVE_ARL_INPUT',
            authoritative_producer:true,
            downstream_consumable:true,
            transitive_p0b:{
              input_mode:receipt.p0b_input_mode,
              origin_run_id:receipt.p0b_origin_run_id,
              origin_source_sha:receipt.p0b_origin_source_sha,
              origin_artifact_name:receipt.p0b_origin_artifact_name,
              origin_artifact_id:receipt.p0b_origin_artifact_id,
              origin_artifact_digest:receipt.p0b_origin_artifact_digest,
              origin_artifact_cardinality:receipt.p0b_origin_artifact_cardinality
            },
            lineage_validation_state:lineage.state,
            promotion_authority:false,
            status:'completed',
            conclusion:'success',
            expired:false,
            candidate_created:false,
            evidence_created:false,
            public_release:'HOLD',
            production:'HOLD',
            g5:'HOLD'
          };
          fs.writeFileSync('/tmp/p1-input/p1-upstream-artifact-binding-v1.json',JSON.stringify(binding,null,2)+'\\n');
'''
          arl = arl[:node_start] + binding_node + arl[node_end:]
          arl_path.write_text(arl, encoding='utf-8')

          patcher = Path('.github/workflows/kpmo-internal-defect-cleanup-1593-patcher.yml')
          patcher.unlink()
          PY

          node --check scripts/kidults/source-intelligence/validate-asi-p1-authoritative-lineage-v1.mjs
          node --check tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs
          node tests/kidults/source-intelligence/asi-p1-authoritative-lineage-v1.test.mjs
          git diff --check

      - name: Commit correction to cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KPMO Internal Defect Remediator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No correction produced' >&2; exit 1; }
          git commit -m 'fix(asi): enforce transitive P0B lineage before ARL publication'
          git push origin "HEAD:${GITHUB_REF_NAME}"
