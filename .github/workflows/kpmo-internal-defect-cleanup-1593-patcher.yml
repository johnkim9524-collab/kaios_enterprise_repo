name: KPMO Internal Defect Cleanup 1593 Patcher

on:
  push:
    branches:
      - fix/asi-p1-transitive-lineage-1593-v1
    paths:
      - '.github/workflows/kpmo-internal-defect-cleanup-1593-patcher.yml'

permissions:
  contents: write

concurrency:
  group: kpmo-internal-defect-cleanup-1593-patcher
  cancel-in-progress: false

jobs:
  patch-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply runtime P0B to P1 to ARL lineage guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kidults/kpmo/internal-defect-cleanup-1593-runtime-patcher.py
          node --check scripts/kidults/source-intelligence/build-asi-autonomous-resolution-layer-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-p1-runtime-lineage-v1.mjs
          node --check tests/kidults/source-intelligence/asi-p1-runtime-lineage-v1.test.mjs
          node tests/kidults/source-intelligence/asi-p1-runtime-lineage-v1.test.mjs
          node scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs
          git diff --check

      - name: Commit internal non-workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KPMO Internal Defect Remediator'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            scripts/kidults/source-intelligence/build-asi-autonomous-resolution-layer-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-autonomous-resolution-provenance-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p1-runtime-lineage-v1.mjs \
            tests/kidults/source-intelligence/asi-p1-runtime-lineage-v1.test.mjs
          git diff --cached --quiet && { echo 'No correction produced' >&2; exit 1; }
          git commit -m 'fix(asi): reject non-authoritative P1 lineage before ARL build'
          git push origin "HEAD:${GITHUB_REF_NAME}"
