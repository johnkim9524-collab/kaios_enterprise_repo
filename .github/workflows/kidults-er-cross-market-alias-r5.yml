name: KIDULTS ER Cross Market Alias R5

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-cross-market-alias-r5.mjs'
      - 'scripts/kidults/entity-resolution/freeze-er-blind-holdout-v1.mjs'
      - 'scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs'
      - 'coordination/kidults/entity-resolution/entity-resolution-benchmark-v2-contract.json'
      - 'coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - '.github/workflows/kidults-entity-resolution-benchmark-v2-runner.yml'
      - '.github/workflows/kidults-er-real-dataset-r1.yml'
      - '.github/workflows/kidults-er-getty-transaction-r2.yml'
      - '.github/workflows/kidults-er-canonical-design-r3.yml'
      - '.github/workflows/kidults-er-real-holdout-r4.yml'
      - '.github/workflows/kidults-er-cross-market-alias-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: kidults-er-cross-market-alias-r5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-and-run-r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
      - name: Build R1-R3 live-source-derived constructed-control aggregate
        run: |
          node scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs /tmp/er-r1.json
          node scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs /tmp/er-r1.json /tmp/er-r2.json
          node scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs /tmp/er-r2.json /tmp/er-r3.json
      - name: Add authoritative cross-market alias R5
        run: node scripts/kidults/entity-resolution/extend-er-dataset-cross-market-alias-r5.mjs /tmp/er-r3.json /tmp/er-r5.json
      - name: Run canonical benchmark
        run: node scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs /tmp/er-r5.json /tmp/er-r5-results.json
      - name: Verify cross-market evidence and fail-closed scope gate
        run: |
          node - <<'NODE'
          const d=require('/tmp/er-r5.json'); const r=require('/tmp/er-r5-results.json');
          if(d.dataset_class!=='REAL_SOURCE_DERIVED_CONSTRUCTED_CONTROL'||d.constructed_control!==true||d.empirical_benchmark_eligible!==false||d.independent_label_review_complete!==false||d.label_adjudication_complete!==false||d.holdout_sealed_before_modeling!==false||d.production!=='HOLD') process.exit(1);
          if(d.cases.some(x=>x.blind_holdout===true)||r.blind_holdout_count!==0||r.blind_accuracy!==null) process.exit(1);
          if(!d.cases.some(x=>x.case_class==='CROSS_MARKET_ALIAS')) process.exit(1);
          if(r.accuracy!==1||r.critical_false_auto_merge!==0) process.exit(1);
          if(r.coverage.provenance_coverage!==1||r.coverage.rights_coverage!==1) process.exit(1);
          if(r.coverage.scope_stratification_complete!==false||r.promotion_gate.empirical_benchmark_gate_pass!==false||r.promotion_gate.promotion_eligible_before_track_b!==false||r.promotion_gate.production_promotion_authorized!==false) process.exit(1);
          console.log('R5 authoritative-ID-derived constructed control PASS; no blind holdout, current-market claim, empirical promotion, or Production authorization.');
          NODE
      - name: Upload R5 diagnostic artifacts
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-er-source-derived-constructed-control-r5
          path: |
            /tmp/er-r5.json
            /tmp/er-r5-results.json
          if-no-files-found: error
          retention-days: 30
