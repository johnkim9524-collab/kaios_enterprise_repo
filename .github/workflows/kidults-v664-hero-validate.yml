name: KIDULTS Portal V664 Hero Validate

on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/index.html'
      - 'apps/kidults-enterprise-staging/public/portal/components/v663-hero-integrated-footer.css'
      - 'apps/kidults-enterprise-staging/public/portal/components/v664-visible-hero-footer.css'
      - 'scripts/kidults/portal/validate-v663-hero-layout.mjs'
      - 'scripts/kidults/portal/validate-v664-hero-visual.mjs'
      - '.github/workflows/kidults-v664-hero-validate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/kidults-enterprise-staging/public/portal/index.html'
      - 'apps/kidults-enterprise-staging/public/portal/components/v663-hero-integrated-footer.css'
      - 'apps/kidults-enterprise-staging/public/portal/components/v664-visible-hero-footer.css'
      - 'scripts/kidults/portal/validate-v663-hero-layout.mjs'
      - 'scripts/kidults/portal/validate-v664-hero-visual.mjs'
      - '.github/workflows/kidults-v664-hero-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate V664 source contract
        run: |
          node --check scripts/kidults/portal/validate-v663-hero-layout.mjs
          node --check scripts/kidults/portal/validate-v664-hero-visual.mjs
          node scripts/kidults/portal/validate-v663-hero-layout.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local KIDULTS portal
        run: |
          python3 -m http.server 4173 --directory apps/kidults-enterprise-staging/public > /tmp/kidults-v664-server.log 2>&1 &
          echo $! > /tmp/kidults-v664-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/portal/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kidults-v664-server.log
          exit 1

      - name: Validate V664 at 1366x768, 1440x900, 390x844 and 320x740
        env:
          KIDULTS_V664_OUTPUT: artifacts/kidults-v664-hero
        run: node scripts/kidults/portal/validate-v664-hero-visual.mjs

      - name: Upload V664 Hero evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kidults-v664-hero-evidence
          path: artifacts/kidults-v664-hero
          if-no-files-found: warn
          retention-days: 14

  live:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Wait for public V664 deployment
        run: |
          set -euo pipefail
          url='https://johnkim9524-collab.github.io/kaios_enterprise_repo/portal/index.html?v=664'
          for attempt in $(seq 1 36); do
            echo "V664 public check ${attempt}/36"
            if curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "${url}&deployment=${GITHUB_SHA}" --output /tmp/kidults-v664-live.html; then
              if grep -q 'data-portal-hotfix="v664"' /tmp/kidults-v664-live.html \
                && grep -q 'v664-visible-hero-footer.css?v=664' /tmp/kidults-v664-live.html \
                && grep -q 'data-hero-revision="v664-visible-footer"' /tmp/kidults-v664-live.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          cat /tmp/kidults-v664-live.html 2>/dev/null || true
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate public V664 Hero
        env:
          KIDULTS_BASE_URL: https://johnkim9524-collab.github.io/kaios_enterprise_repo
          KIDULTS_V664_OUTPUT: artifacts/kidults-v664-live
        run: node scripts/kidults/portal/validate-v664-hero-visual.mjs

      - name: Upload public V664 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kidults-v664-hero-live-evidence
          path: artifacts/kidults-v664-live
          if-no-files-found: warn
          retention-days: 14
