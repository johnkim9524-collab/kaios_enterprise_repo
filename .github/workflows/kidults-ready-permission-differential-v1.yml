name: KIDULTS Ready Permission Differential V1

on:
  push:
    branches: [governance/leadership-restart-20260930]
    paths:
      - '.github/workflows/kidults-ready-permission-differential-v1.yml'

permissions:
  contents: read
  id-token: write

jobs:
  differential:
    runs-on: ubuntu-24.04
    environment: KIDULTS-AUTONOMOUS-DISPATCHER
    timeout-minutes: 5
    env:
      TEST_PR: '2434'
      TEST_BASE_SHA: '13f53fa2211fac1abf580d5b34f23ef2d4498211'
      TEST_HEAD_SHA: '6b05a417376f7c192a2074e8af79d2d6259fdc0a'
      AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_EVENT_BROKER_ROLE_ARN }}
      BROKER_FUNCTION: ${{ vars.KIDULTS_AUTONOMOUS_EVENT_TOKEN_BROKER_FUNCTION }}
      EXPECTED_APP_ID: ${{ vars.KIDULTS_GITHUB_APP_ID }}
      EXPECTED_INSTALLATION_ID: ${{ vars.KIDULTS_GITHUB_INSTALLATION_ID }}
    steps:
      - name: Bounded permission differential
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup() {
            unset NARROW_TOKEN BROAD_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN OIDC_TOKEN CREDS
            rm -f /tmp/narrow.json /tmp/broad.json /tmp/narrow-gql.json /tmp/broad-gql.json /tmp/restore-gql.json
          }
          trap cleanup EXIT
          test -n "$AWS_ROLE_ARN" && test -n "$BROKER_FUNCTION" && test -n "$EXPECTED_APP_ID" && test -n "$EXPECTED_INSTALLATION_ID"
          PR_JSON=$(curl --fail --silent --show-error -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$TEST_PR")
          test "$(jq -r .draft <<<"$PR_JSON")" = "true"
          test "$(jq -r .head.sha <<<"$PR_JSON")" = "$TEST_HEAD_SHA"
          test "$(jq -r .base.sha <<<"$PR_JSON")" = "$TEST_BASE_SHA"
          NODE_ID=$(jq -r .node_id <<<"$PR_JSON")

          OIDC_JSON=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(jq -r .value <<<"$OIDC_JSON")
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" --role-session-name "ready-diff-${GITHUB_RUN_ID}" --web-identity-token "$OIDC_TOKEN" --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$CREDS"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION=ap-northeast-2
          unset OIDC_JSON OIDC_TOKEN CREDS

          mint() {
            profile="$1"; outfile="$2"
            payload=$(jq -cn --arg repository "$GITHUB_REPOSITORY" --arg repository_id "$GITHUB_REPOSITORY_ID" --argjson pull_request "$TEST_PR" --arg base_sha "$TEST_BASE_SHA" --arg head_sha "$TEST_HEAD_SHA" --arg profile "$profile" --arg generation "ready-diff-${GITHUB_RUN_ID}-$profile" '{action:"MINT_INSTALLATION_TOKEN",permission_profile:$profile,repository:$repository,repository_id:$repository_id,pull_request:$pull_request,base_sha:$base_sha,head_sha:$head_sha,authorization_generation:$generation,allow_draft_recovery:true}')
            aws lambda invoke --function-name "$BROKER_FUNCTION" --cli-binary-format raw-in-base64-out --payload "$payload" "$outfile" >/dev/null
          }
          gql_ready() {
            token="$1"; outfile="$2"
            curl --fail --silent --show-error https://api.github.com/graphql -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary "$(jq -cn --arg id "$NODE_ID" '{query:"mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft state}}}",variables:{id:$id}}')" > "$outfile"
          }
          gql_draft() {
            token="$1"; outfile="$2"
            curl --fail --silent --show-error https://api.github.com/graphql -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary "$(jq -cn --arg id "$NODE_ID" '{query:"mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{number isDraft state}}}",variables:{id:$id}}')" > "$outfile"
          }

          mint DRAFT_READY_TRANSITION /tmp/narrow.json
          NARROW_TOKEN=$(jq -r .token /tmp/narrow.json); echo "::add-mask::$NARROW_TOKEN"
          NARROW_PERMS=$(jq -c '.permissions|sort' /tmp/narrow.json)
          gql_ready "$NARROW_TOKEN" /tmp/narrow-gql.json
          NARROW_TYPE=$(jq -r '.errors[0].type // "NONE"' /tmp/narrow-gql.json)
          NARROW_DRAFT=$(jq -r '.data.markPullRequestReadyForReview.pullRequest.isDraft // "null"' /tmp/narrow-gql.json)

          if [ "$NARROW_DRAFT" = "false" ]; then
            gql_draft "$NARROW_TOKEN" /tmp/restore-gql.json
            test "$(jq -r '.data.convertPullRequestToDraft.pullRequest.isDraft' /tmp/restore-gql.json)" = "true"
            echo "DIFFERENTIAL_RESULT=NARROW_SUCCEEDED_CONTENTS_WRITE_NOT_REQUIRED"
            echo "NARROW_PERMISSIONS=$NARROW_PERMS"
            exit 0
          fi
          test "$NARROW_TYPE" = "FORBIDDEN"

          mint AUTONOMOUS_EVENT_DISPATCH /tmp/broad.json
          BROAD_TOKEN=$(jq -r .token /tmp/broad.json); echo "::add-mask::$BROAD_TOKEN"
          BROAD_PERMS=$(jq -c '.permissions|sort' /tmp/broad.json)
          gql_ready "$BROAD_TOKEN" /tmp/broad-gql.json
          test "$(jq -r '.errors | length // 0' /tmp/broad-gql.json)" = "0"
          test "$(jq -r '.data.markPullRequestReadyForReview.pullRequest.isDraft' /tmp/broad-gql.json)" = "false"
          gql_draft "$BROAD_TOKEN" /tmp/restore-gql.json
          test "$(jq -r '.errors | length // 0' /tmp/restore-gql.json)" = "0"
          test "$(jq -r '.data.convertPullRequestToDraft.pullRequest.isDraft' /tmp/restore-gql.json)" = "true"

          echo "DIFFERENTIAL_RESULT=CONTENTS_WRITE_REQUIRED_FOR_READY_MUTATION"
          echo "NARROW_PERMISSIONS=$NARROW_PERMS"
          echo "BROAD_PERMISSIONS=$BROAD_PERMS"
          echo "NARROW_ERROR_TYPE=$NARROW_TYPE"
          echo "TEST_PR_RESTORED_TO_DRAFT=true"
