name: KIDULTS Global Market Evidence PoC v2 Defect Framework
on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/global-market-evidence-poc-v2-defect-framework.json'
      - 'coordination/kidults/poc/global-market-evidence-poc-v2-defect-register-schema.json'
      - 'scripts/kidults/poc/validate-global-market-evidence-poc-v2-defect-framework.mjs'
      - '.github/workflows/kidults-global-market-evidence-poc-v2-defect-framework.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate defect-finding PoC v2 framework
        run: node scripts/kidults/poc/validate-global-market-evidence-poc-v2-defect-framework.mjs
