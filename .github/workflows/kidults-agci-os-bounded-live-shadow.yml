name: KIDULTS AGCI-OS Bounded-Live Authority Shadow

on:
  push:
    branches:
      - "feat/kidults-phase2-content-data-provider-foundation"
    paths:
      - "coordination/kidults/engine-v2/shadow-inputs/**"
      - "coordination/kidults/registry/engine/**"
      - "coordination/kidults/registry/raw-quarantine/**"
      - "coordination/kidults/registry/universe/**"
      - "coordination/kidults/registry/entity/**"
      - "coordination/kidults/registry/evidence/**"
      - "coordination/kidults/registry/market-graph/**"
      - "coordination/kidults/registry/cluster/**"
      - "coordination/kidults/registry/projection/**"
      - "scripts/kidults/engine-v2/run-bounded-live-shadow.mjs"
      - "scripts/kidults/engine-v2/validate-bounded-live-shadow*.mjs"
      - ".github/workflows/kidults-agci-os-bounded-live-shadow.yml"
  pull_request:
    paths:
      - "coordination/kidults/engine-v2/shadow-inputs/**"
      - "coordination/kidults/registry/**"
      - "scripts/kidults/engine-v2/run-bounded-live-shadow.mjs"
      - "scripts/kidults/engine-v2/validate-bounded-live-shadow*.mjs"
      - ".github/workflows/kidults-agci-os-bounded-live-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Syntax check
        run: |
          node --check scripts/kidults/engine-v2/run-bounded-live-shadow.mjs
          node --check scripts/kidults/engine-v2/validate-bounded-live-shadow.mjs
          node --check scripts/kidults/engine-v2/validate-bounded-live-shadow-registry.mjs
      - name: Build deterministic bounded-live Shadow evidence
        run: node scripts/kidults/engine-v2/run-bounded-live-shadow.mjs --write
      - name: Prove same-input same-output
        run: |
          node --input-type=module <<'NODE' > /tmp/shadow-1.json
          import { buildAuthorityShadow, loadAuthorityShadowInput } from './scripts/kidults/engine-v2/run-bounded-live-shadow.mjs';
          process.stdout.write(JSON.stringify(buildAuthorityShadow(loadAuthorityShadowInput())));
          NODE
          node --input-type=module <<'NODE' > /tmp/shadow-2.json
          import { buildAuthorityShadow, loadAuthorityShadowInput } from './scripts/kidults/engine-v2/run-bounded-live-shadow.mjs';
          process.stdout.write(JSON.stringify(buildAuthorityShadow(loadAuthorityShadowInput())));
          NODE
          cmp /tmp/shadow-1.json /tmp/shadow-2.json
      - name: Validate Engine outputs and fail-closed boundaries
        run: node scripts/kidults/engine-v2/validate-bounded-live-shadow.mjs
      - name: Validate Registry and Projection alignment
        run: node scripts/kidults/engine-v2/validate-bounded-live-shadow-registry.mjs
      - name: Validate existing governance
        run: |
          node scripts/kidults/architecture/validate-agci-os-registry-v2.mjs
          node scripts/kidults/registry/validate-operational-registry.mjs
          node scripts/kidults/mission-control/validate-mission-control.mjs
      - name: Upload bounded-live Shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-agci-os-bounded-live-authority-shadow-r1
          path: artifacts/agci-os/authority-shadow-r1
          if-no-files-found: error
          retention-days: 30
