name: KIDULTS A10 Scale Certification

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-a10-scale.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: A10 scale certification
        run: npm run a10:certify

      - name: Upload scale reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kidults-a10-scale-reports
          path: services/kidults-autonomous-intelligence/reports/scale/*.json
          if-no-files-found: warn
