name: KPMO TEMP Vendor Wrangler Lock v1

on:
  push:
    branches:
      - codex/cloudflare-pages-to-workers-migration-v1
    paths:
      - '.github/workflows/kpmo-temp-vendor-wrangler-lock-v1.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: codex/cloudflare-pages-to-workers-migration-v1
          fetch-depth: 1

      - name: Set up governed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Generate exact Wrangler lock
        shell: bash
        run: |
          set -euo pipefail
          DIR='tooling/kidults-cloudflare-workers-shadow'
          mkdir -p "$DIR"
          cat > "$DIR/package.json" <<'JSON'
          {
            "name": "kidults-cloudflare-workers-shadow-tooling",
            "private": true,
            "version": "1.0.0",
            "packageManager": "npm@11.17.0",
            "devDependencies": {
              "wrangler": "4.127.1"
            }
          }
          JSON
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix "$DIR"
          node -e 'const p=require("./tooling/kidults-cloudflare-workers-shadow/package-lock.json"); if(p.lockfileVersion!==3)process.exit(1); const e=p.packages?.["node_modules/wrangler"]; if(e?.version!=="4.127.1"||!e.integrity)process.exit(1)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR/package.json"
          git add -f "$DIR/package-lock.json"
          git commit -m 'build(cloudflare): lock Wrangler shadow deployment tooling'
          git push origin HEAD:codex/cloudflare-pages-to-workers-migration-v1
