name: KIDULTS Coordination Validate

on:
  pull_request:
    paths:
      - 'coordination/kidults/**'
      - 'docs/operations/KIDULTS_*.md'
      - 'scripts/kidults/coordination/**'
      - '.github/workflows/kidults-coordination-validate.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/**'
      - 'docs/operations/KIDULTS_*.md'
      - 'scripts/kidults/coordination/**'
      - '.github/workflows/kidults-coordination-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Validate KIDULTS coordination registry
        run: node scripts/kidults/coordination/validate-coordination.mjs
