name: KIDULTS ASI Source Domain Observation Graph v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/build-asi-source-domain-observation-graph-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-source-domain-observation-graph-v1.mjs'
      - '.github/workflows/kidults-asi-source-domain-observation-graph-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-source-domain-observation-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-domain-observation-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact source and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-source-domain-observation-graph-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-source-domain-observation-graph-v1.mjs
      - name: Restore latest main Self-Driving cycle inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-domain-input discovery-out
          ART_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="kidults-asi-self-driving-cycle-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty')
          test -n "$ART_ID"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/source-domain-input.zip
          unzip -q -o /tmp/source-domain-input.zip -d /tmp/source-domain-input
          DISCOVERY=$(find /tmp/source-domain-input -type f -name 'global-low-risk-discovery.json' -print -quit)
          POOL=$(find /tmp/source-domain-input -type f -name 'asi-proactive-source-pool-v1.json' -print -quit)
          test -n "$DISCOVERY"
          test -n "$POOL"
          cp "$DISCOVERY" discovery-out/global-low-risk-discovery.json
          cp "$POOL" /tmp/asi-proactive-source-pool-v1.json
      - name: Build and validate conservative source-domain graph
        run: |
          node scripts/kidults/source-intelligence/build-asi-source-domain-observation-graph-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-proactive-source-pool-v1.json /tmp/asi-source-domain-observation-graph-v1.json
          node scripts/kidults/source-intelligence/validate-asi-source-domain-observation-graph-v1.mjs /tmp/asi-source-domain-observation-graph-v1.json
      - name: Prove deterministic graph topology replay
        run: |
          node scripts/kidults/source-intelligence/build-asi-source-domain-observation-graph-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-proactive-source-pool-v1.json /tmp/asi-source-domain-observation-graph-replay-v1.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/asi-source-domain-observation-graph-v1.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/asi-source-domain-observation-graph-replay-v1.json','utf8'));
          if(a.graph_digest!==b.graph_digest)throw new Error('GRAPH_REPLAY_NONDETERMINISTIC');
          if(JSON.stringify(a.nodes)!==JSON.stringify(b.nodes)||JSON.stringify(a.edges)!==JSON.stringify(b.edges))throw new Error('GRAPH_TOPOLOGY_REPLAY_NONDETERMINISTIC');
          console.log(JSON.stringify({status:'PASS',graph_digest:a.graph_digest,nodes:a.nodes.length,edges:a.edges.length,production:'HOLD'}));
          NODE
      - name: Reject cross-domain same-organization mutation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/asi-source-domain-observation-graph-v1.json','utf8'));
          const hosts=x.nodes.filter(n=>n.node_type==='OBSERVED_HOST');
          if(hosts.length<2)process.exit(2);
          x.edges.push({edge_id:'edge:forbidden-same-organization',edge_type:'SAME_ORGANIZATION',from_node_id:hosts[0].node_id,to_node_id:hosts[1].node_id,assertion_state:'INFERRED'});
          fs.writeFileSync('/tmp/bad-source-domain-org-merge.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-source-domain-observation-graph-v1.mjs /tmp/bad-source-domain-org-merge.json; then exit 1; fi
      - name: Reject topology-created rights mutation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/asi-source-domain-observation-graph-v1.json','utf8'));
          const source=x.nodes.find(n=>n.node_type==='SOURCE_CANDIDATE');
          if(!source)process.exit(2);
          source.rights_state='ALLOW';
          fs.writeFileSync('/tmp/bad-source-domain-rights.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-source-domain-observation-graph-v1.mjs /tmp/bad-source-domain-rights.json; then exit 1; fi
      - name: Reject registrable-domain or legal-owner inference mutation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/asi-source-domain-observation-graph-v1.json','utf8'));
          const host=x.nodes.find(n=>n.node_type==='OBSERVED_HOST');
          if(!host)process.exit(2);
          host.registrable_domain_inferred=true;
          host.legal_owner_inferred=true;
          fs.writeFileSync('/tmp/bad-source-domain-owner.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-source-domain-observation-graph-v1.mjs /tmp/bad-source-domain-owner.json; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-source-domain-observation-graph-v1
          path: |
            /tmp/asi-source-domain-observation-graph-v1.json
            /tmp/asi-source-domain-observation-graph-replay-v1.json
          retention-days: 30
          if-no-files-found: error
