name: KIDULTS Provider Rights Decision Gate

on:
  pull_request:
    paths:
      - 'coordination/kidults/market/provider-rights-decision-gate-v1.json'
      - 'coordination/kidults/market/classic-private-activation-contract-r1.json'
      - 'coordination/kidults/market/classic-bundle3-provider-response-intake-v1.json'
      - 'scripts/kidults/market/validate-provider-rights-decision-gate-v1.mjs'
      - 'scripts/kidults/market/validate-classic-bundle3-provider-response-intake-v1.mjs'
      - '.github/workflows/kidults-provider-rights-decision-gate.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/market/provider-rights-decision-gate-v1.json'
      - 'coordination/kidults/market/classic-private-activation-contract-r1.json'
      - 'coordination/kidults/market/classic-bundle3-provider-response-intake-v1.json'
      - 'scripts/kidults/market/validate-provider-rights-decision-gate-v1.mjs'
      - 'scripts/kidults/market/validate-classic-bundle3-provider-response-intake-v1.mjs'

jobs:
  provider-rights-decision-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Validate deterministic provider rights decision boundary
        run: node scripts/kidults/market/validate-provider-rights-decision-gate-v1.mjs
