name: KIDULTS Autonomous Object Lock Canary V1
run-name: "KIDULTS Object Lock Canary ${{ inputs.expected_main_sha }}"

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact protected main SHA to bind
        required: true
        type: string

concurrency:
  group: kidults-object-lock-canary-${{ inputs.expected_main_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  object-lock-canary:
    name: Verify FINALIZER immutable receipt boundary
    runs-on: ubuntu-24.04
    environment: KIDULTS-AUTONOMOUS-FINALIZER
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind exact main and HOLD boundary
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "${{ vars.KIDULTS_PRODUCTION_STATE || 'HOLD' }}" = HOLD
          test "${{ vars.KIDULTS_PUBLIC_STATE || 'HOLD' }}" = HOLD
          test "${{ vars.KIDULTS_G5_STATE || 'HOLD' }}" = HOLD
          echo 'PRODUCTION=HOLD'
          echo 'PUBLIC=HOLD'
          echo 'G5=HOLD'

      - name: Deny unconfigured FINALIZER authority
        env:
          AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_WORKLOAD_ROLE_ARN }}
          RECEIPT_BUCKET: ${{ vars.KIDULTS_AUTONOMOUS_RECEIPT_BUCKET }}
          RECEIPT_KEY_ARN: ${{ vars.KIDULTS_AUTONOMOUS_RECEIPT_KEY_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          test -n "$RECEIPT_BUCKET"
          test -n "$RECEIPT_KEY_ARN"
          test "$AWS_ROLE_ARN" != UNCONFIGURED
          test "$RECEIPT_BUCKET" != UNCONFIGURED
          test "$RECEIPT_KEY_ARN" != UNCONFIGURED

      - name: Acquire FINALIZER credentials through exact GitHub OIDC subject
        env:
          AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_WORKLOAD_ROLE_ARN }}
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(jq -r '.value' <<<"$OIDC_JSON")
          test -n "$OIDC_TOKEN"
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "$AWS_ROLE_ARN" \
            --role-session-name "kidults-object-lock-canary-${GITHUB_RUN_ID}" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 900 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$CREDS"
          test -n "$AWS_ACCESS_KEY_ID"
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
            echo "AWS_REGION=ap-northeast-2"
          } >> "$GITHUB_ENV"

      - name: Execute positive and negative Object Lock canary
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RECEIPT_BUCKET: ${{ vars.KIDULTS_AUTONOMOUS_RECEIPT_BUCKET }}
          RECEIPT_KEY_ARN: ${{ vars.KIDULTS_AUTONOMOUS_RECEIPT_KEY_ARN }}
        run: |
          set -euo pipefail
          mkdir -p out/autonomous-object-lock-canary-v1
          RETAIN_UNTIL=$(date -u -d '+10 years' '+%Y-%m-%dT%H:%M:%SZ')
          PREFIX="receipts/canary/${EXPECTED_MAIN_SHA}/${GITHUB_RUN_ID}"
          PROBE_KEY="${PREFIX}/probe.json"
          TERMINAL_KEY="${PREFIX}/terminal.json"

          jq -n \
            --arg exact_sha "$EXPECTED_MAIN_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg created_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{id:"kidults-object-lock-canary-probe-v1",exact_sha:$exact_sha,run_id:$run_id,created_at:$created_at,production:"HOLD",public:"HOLD",g5:"HOLD"}' \
            > out/autonomous-object-lock-canary-v1/probe.json

          PUT=$(aws s3api put-object \
            --bucket "$RECEIPT_BUCKET" \
            --key "$PROBE_KEY" \
            --body out/autonomous-object-lock-canary-v1/probe.json \
            --checksum-algorithm SHA256 \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$RECEIPT_KEY_ARN" \
            --object-lock-mode COMPLIANCE \
            --object-lock-retain-until-date "$RETAIN_UNTIL" \
            --metadata "exact-head-sha=$EXPECTED_MAIN_SHA,canary=positive" \
            --output json)
          VERSION_ID=$(jq -er '.VersionId' <<<"$PUT")
          HEAD=$(aws s3api head-object \
            --bucket "$RECEIPT_BUCKET" \
            --key "$PROBE_KEY" \
            --version-id "$VERSION_ID" \
            --checksum-mode ENABLED \
            --output json)
          test "$(jq -r '.ObjectLockMode' <<<"$HEAD")" = COMPLIANCE
          test "$(jq -r '.ServerSideEncryption' <<<"$HEAD")" = aws:kms
          test "$(jq -r '.SSEKMSKeyId' <<<"$HEAD")" = "$RECEIPT_KEY_ARN"
          test "$(jq -r '.Metadata["exact-head-sha"]' <<<"$HEAD")" = "$EXPECTED_MAIN_SHA"
          test "$(jq -r '.ChecksumSHA256 | length > 0' <<<"$HEAD")" = true
          echo 'POSITIVE_CANARY=PASS'

          set +e
          UNENCRYPTED_ERROR=$(aws s3api put-object \
            --bucket "$RECEIPT_BUCKET" \
            --key "${PREFIX}/forbidden-unencrypted.json" \
            --body out/autonomous-object-lock-canary-v1/probe.json \
            --checksum-algorithm SHA256 2>&1)
          UNENCRYPTED_EXIT=$?
          DELETE_ERROR=$(aws s3api delete-object \
            --bucket "$RECEIPT_BUCKET" \
            --key "$PROBE_KEY" \
            --version-id "$VERSION_ID" 2>&1)
          DELETE_EXIT=$?
          set -e
          test "$UNENCRYPTED_EXIT" -ne 0
          test "$DELETE_EXIT" -ne 0
          grep -Eq 'AccessDenied|InvalidRequest' <<<"$UNENCRYPTED_ERROR"
          grep -Eq 'AccessDenied|InvalidRequest' <<<"$DELETE_ERROR"
          echo 'NEGATIVE_CANARY=PASS'

          jq -n \
            --arg exact_sha "$EXPECTED_MAIN_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg probe_key "$PROBE_KEY" \
            --arg probe_version_id "$VERSION_ID" \
            --arg checksum_sha256 "$(jq -r '.ChecksumSHA256' <<<"$HEAD")" \
            --arg retain_until "$(jq -r '.ObjectLockRetainUntilDate' <<<"$HEAD")" \
            '{id:"kidults-autonomous-object-lock-canary-terminal-receipt-v1",version:"1.0.0",state:"VERIFIED_PASS",exact_sha:$exact_sha,run_id:$run_id,positive_canary:"PASS",negative_canary:"PASS",object_lock_mode:"COMPLIANCE",probe:{key:$probe_key,version_id:$probe_version_id,checksum_sha256:$checksum_sha256,retain_until:$retain_until},production:"HOLD",public:"HOLD",g5:"HOLD"}' \
            > out/autonomous-object-lock-canary-v1/terminal-receipt.json

          TERMINAL_PUT=$(aws s3api put-object \
            --bucket "$RECEIPT_BUCKET" \
            --key "$TERMINAL_KEY" \
            --body out/autonomous-object-lock-canary-v1/terminal-receipt.json \
            --checksum-algorithm SHA256 \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$RECEIPT_KEY_ARN" \
            --object-lock-mode COMPLIANCE \
            --object-lock-retain-until-date "$RETAIN_UNTIL" \
            --metadata "exact-head-sha=$EXPECTED_MAIN_SHA,terminal-receipt=pass" \
            --output json)
          TERMINAL_VERSION_ID=$(jq -er '.VersionId' <<<"$TERMINAL_PUT")
          TERMINAL_HEAD=$(aws s3api head-object \
            --bucket "$RECEIPT_BUCKET" \
            --key "$TERMINAL_KEY" \
            --version-id "$TERMINAL_VERSION_ID" \
            --checksum-mode ENABLED \
            --output json)
          test "$(jq -r '.ObjectLockMode' <<<"$TERMINAL_HEAD")" = COMPLIANCE
          test "$(jq -r '.Metadata["exact-head-sha"]' <<<"$TERMINAL_HEAD")" = "$EXPECTED_MAIN_SHA"

          jq \
            --arg bucket "$RECEIPT_BUCKET" \
            --arg key "$TERMINAL_KEY" \
            --arg version_id "$TERMINAL_VERSION_ID" \
            --arg checksum_sha256 "$(jq -r '.ChecksumSHA256' <<<"$TERMINAL_HEAD")" \
            --arg retain_until "$(jq -r '.ObjectLockRetainUntilDate' <<<"$TERMINAL_HEAD")" \
            '. + {immutable_copy:{state:"OBJECT_LOCK_COMPLIANCE_VERIFIED",bucket:$bucket,key:$key,version_id:$version_id,checksum_sha256:$checksum_sha256,retain_until:$retain_until}}' \
            out/autonomous-object-lock-canary-v1/terminal-receipt.json \
            > out/autonomous-object-lock-canary-v1/terminal-envelope.json
          echo 'OBJECT_LOCK_COMPLIANCE_VERIFIED=PASS'
          echo 'TERMINAL_RECEIPT=PASS'

      - name: Upload exact-SHA terminal evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kidults-object-lock-canary-${{ inputs.expected_main_sha }}-${{ github.run_id }}
          path: out/autonomous-object-lock-canary-v1/
          if-no-files-found: error
          retention-days: 90
