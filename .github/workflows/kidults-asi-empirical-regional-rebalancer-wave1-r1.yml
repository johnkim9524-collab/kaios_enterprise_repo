name: KIDULTS ASI Empirical Regional Rebalancer Wave1 R1
on:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/factor-eligibility-v1-lib.mjs'
      - 'scripts/kidults/source-intelligence/build-empirical-regional-rebalancer-wave1-r1.mjs'
      - 'scripts/kidults/source-intelligence/validate-empirical-regional-rebalancer-wave1-r1.mjs'
      - 'scripts/kidults/source-intelligence/test-empirical-regional-rebalancer-factor-gates-r1.mjs'
      - '.github/workflows/kidults-asi-empirical-regional-rebalancer-wave1-r1.yml'
      - 'coordination/kidults/source-intelligence/regional-market-rebalancer-v1.json'
  push:
    branches: [main]
    paths:
      - 'scripts/kidults/source-intelligence/factor-eligibility-v1-lib.mjs'
      - 'scripts/kidults/source-intelligence/build-empirical-regional-rebalancer-wave1-r1.mjs'
      - 'scripts/kidults/source-intelligence/validate-empirical-regional-rebalancer-wave1-r1.mjs'
      - 'scripts/kidults/source-intelligence/test-empirical-regional-rebalancer-factor-gates-r1.mjs'
      - '.github/workflows/kidults-asi-empirical-regional-rebalancer-wave1-r1.yml'
      - 'coordination/kidults/source-intelligence/regional-market-rebalancer-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empirical-shadow-rebalancer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - name: Rebuild bounded regional evidence surface
        run: |
          node scripts/kidults/source-intelligence/probe-musicbrainz-regional-catalog-observation-r1.mjs /tmp/musicbrainz-regional-catalog-observation-r1.json
          node scripts/kidults/source-intelligence/build-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json /tmp/musicbrainz-regional-catalog-observation-r1.json
          node scripts/kidults/source-intelligence/validate-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json
          node scripts/kidults/source-intelligence/build-asi-regional-data-usability-factor-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json /tmp/musicbrainz-regional-catalog-observation-r1.json /tmp/empirical-regional-baseline-with-data-usability-r1.json
          node scripts/kidults/source-intelligence/validate-asi-regional-data-usability-factor-r1.mjs /tmp/empirical-regional-baseline-with-data-usability-r1.json
      - name: Build SHADOW rebalancer twice
        run: |
          node scripts/kidults/source-intelligence/build-empirical-regional-rebalancer-wave1-r1.mjs /tmp/empirical-regional-baseline-with-data-usability-r1.json /tmp/rebalancer-a.json
          node scripts/kidults/source-intelligence/build-empirical-regional-rebalancer-wave1-r1.mjs /tmp/empirical-regional-baseline-with-data-usability-r1.json /tmp/rebalancer-b.json
      - name: Validate deterministic fail-closed plans and shared factor eligibility
        run: |
          node scripts/kidults/source-intelligence/validate-empirical-regional-rebalancer-wave1-r1.mjs /tmp/rebalancer-a.json
          node scripts/kidults/source-intelligence/validate-empirical-regional-rebalancer-wave1-r1.mjs /tmp/rebalancer-b.json
          cmp /tmp/rebalancer-a.json /tmp/rebalancer-b.json
          node scripts/kidults/source-intelligence/test-empirical-regional-rebalancer-factor-gates-r1.mjs /tmp/empirical-regional-baseline-with-data-usability-r1.json
      - name: Upload SHADOW evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-asi-empirical-regional-rebalancer-wave1-r1
          path: |
            /tmp/empirical-regional-baseline-with-data-usability-r1.json
            /tmp/rebalancer-a.json
          retention-days: 30
          if-no-files-found: error
