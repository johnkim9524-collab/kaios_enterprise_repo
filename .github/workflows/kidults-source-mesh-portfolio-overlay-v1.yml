name: KIDULTS Source Mesh Portfolio Overlay v1
on:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/build-source-mesh-portfolio-overlay-v1.mjs'
      - 'coordination/kidults/source-intelligence/**'
      - '.github/workflows/kidults-source-mesh-portfolio-overlay-v1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build portfolio overlay
        run: node scripts/kidults/source-intelligence/build-source-mesh-portfolio-overlay-v1.mjs /tmp/kidults-source-mesh-portfolio-overlay-v1.json
      - name: Verify fail-closed truth
        run: |
          node - <<'NODE'
          const x=require('/tmp/kidults-source-mesh-portfolio-overlay-v1.json');
          if(x.production!=='HOLD'||x.global_provider_selected!==false) process.exit(1);
          if(x.strict_rights_admitted_source_count<3) process.exit(1);
          if(x.current_sold_strict_source_count!==0||x.current_sold_gap_state!=='OPEN_NO_STRICT_R1_CURRENT_SOLD_SOURCE') process.exit(1);
          if(x.strict_rights_admitted_sources.some(s=>s.cell_evidence_admitted!==false||s.named_provider_global_truth!==false)) process.exit(1);
          if(x.conditional_or_declaration_sources.some(s=>s.runtime_admitted!==false||s.current_market_claim_authorized!==false)) process.exit(1);
          console.log('Portfolio overlay truth boundary PASS');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-source-mesh-portfolio-overlay-v1
          path: /tmp/kidults-source-mesh-portfolio-overlay-v1.json
          retention-days: 30
