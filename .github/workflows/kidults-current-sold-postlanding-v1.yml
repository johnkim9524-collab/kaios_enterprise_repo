name: KIDULTS Current-SOLD Post-Landing V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/market/current-sold-*.json'
      - 'scripts/kidults/market/current-sold-*.mjs'
      - 'tests/kidults/market/current-sold-*.mjs'
      - 'infrastructure/postgres/current-sold/**'
      - 'docs/kidults/market/current-sold-engine-v1.md'
      - '.github/workflows/kidults-current-sold-engine-v1.yml'
      - '.github/workflows/kidults-current-sold-postlanding-v1.yml'
  workflow_run:
    workflows:
      - KIDULTS Atomic Governed Landing V1
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-post-landing-current-sold:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact validation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact target and Atomic Landing lineage
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$source_sha" = "$expected_sha"

          trigger_class='DIAGNOSTIC_EXACT_HEAD'
          post_landing_authoritative=false
          token_suppression_compensated=false
          triggering_landing_run_id=''
          premerge_main_sha=''
          merged_pr_head_sha=''

          if [ "${{ github.event_name }}" = 'workflow_run' ]; then
            test "$GITHUB_REF" = 'refs/heads/main'
            test "${{ github.event.workflow_run.name }}" = 'KIDULTS Atomic Governed Landing V1'
            test "${{ github.event.workflow_run.event }}" = 'workflow_dispatch'
            test "${{ github.event.workflow_run.conclusion }}" = 'success'
            test "${{ github.event.workflow_run.head_branch }}" = 'main'

            parent_line="$(git rev-list --parents -n 1 "$source_sha")"
            set -- $parent_line
            test "$#" -eq 3
            premerge_main_sha="$2"
            merged_pr_head_sha="$3"
            test "$premerge_main_sha" = "${{ github.event.workflow_run.head_sha }}"
            git log -1 --format='%s' "$source_sha" | grep -Eq '^Merge pull request #[0-9]+ '

            changed_files="$(git diff --name-only "$premerge_main_sha" "$source_sha")"
            printf '%s\n' "$changed_files" | grep -Eq '^((coordination|scripts|tests)/kidults/market/current-sold-|infrastructure/postgres/current-sold/|docs/kidults/market/current-sold-engine-v1\.md$|\.github/workflows/kidults-current-sold-(engine|postlanding)-v1\.yml$)'

            trigger_class='ATOMIC_GOVERNED_LANDING_WORKFLOW_RUN'
            post_landing_authoritative=true
            token_suppression_compensated=true
            triggering_landing_run_id="${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = 'pull_request' ]; then
            trigger_class='PULL_REQUEST_EXACT_HEAD'
          elif [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            trigger_class='MANUAL_DIAGNOSTIC_ONLY'
          fi

          {
            echo "source_sha=$source_sha"
            echo "trigger_class=$trigger_class"
            echo "post_landing_authoritative=$post_landing_authoritative"
            echo "token_suppression_compensated=$token_suppression_compensated"
            echo "triggering_landing_run_id=$triggering_landing_run_id"
            echo "premerge_main_sha=$premerge_main_sha"
            echo "merged_pr_head_sha=$merged_pr_head_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false

      - name: Parse all Current-SOLD control schemas
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'coordination/kidults/market/current-sold-event-schema-v1.json',
            'coordination/kidults/market/current-sold-evidence-schema-v1.json',
            'coordination/kidults/market/current-sold-receipt-registry-schema-v1.json',
            'coordination/kidults/market/current-sold-batch-envelope-schema-v1.json',
            'coordination/kidults/market/current-sold-batch-receipt-schema-v1.json',
            'coordination/kidults/market/current-sold-private-dry-run-receipt-schema-v1.json',
            'coordination/kidults/market/current-sold-ledger-write-receipt-schema-v1.json',
            'coordination/kidults/market/current-sold-engine-v1.json'
          ];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`CURRENT_SOLD_SCHEMA_JSON_PASS=${files.length}`);
          NODE

      - name: Check Current-SOLD module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/kidults/market/current-sold-*.mjs tests/kidults/market/current-sold-*.mjs; do
            node --check "$file"
          done

      - name: Run Current-SOLD fail-closed test suite
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/kidults/market/current-sold-*.test.mjs | tee /tmp/current-sold-tests.tap
          grep -Eq '^# tests 53$' /tmp/current-sold-tests.tap
          grep -Eq '^# pass 53$' /tmp/current-sold-tests.tap
          grep -Eq '^# fail 0$' /tmp/current-sold-tests.tap

      - name: Verify legacy raw bundle persistence is disabled
        shell: bash
        run: |
          set -euo pipefail
          file='scripts/kidults/market/current-sold-batch-v1.mjs'
          grep -q 'CURRENT_SOLD_BATCH_RAW_BUNDLE_PERSISTENCE_DISABLED' "$file"
          grep -q 'CURRENT_SOLD_BATCH_LEGACY_CLI_DISABLED_USE_PRIVATE_DRY_RUN' "$file"
          if grep -Eq 'fs\.writeFile\(outputPath|writeCurrentSoldBatchBundle\(outputPath' "$file"; then
            echo 'CURRENT_SOLD_LEGACY_RAW_PERSISTENCE_NEGATIVE_CHECK_FAIL' >&2
            exit 1
          fi

      - name: Run runtime-generated synthetic control smoke
        shell: bash
        env:
          CURRENT_SOLD_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p out/current-sold-postlanding
          node scripts/kidults/market/current-sold-control-smoke-v1.mjs \
            --output out/current-sold-postlanding/control-smoke-receipt.json
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('out/current-sold-postlanding/control-smoke-receipt.json', 'utf8'));
          if (receipt.status !== 'PASS') throw new Error('CURRENT_SOLD_CONTROL_SMOKE_STATUS_NOT_PASS');
          if (receipt.execution_class !== 'CONTROL_SYNTHETIC') throw new Error('CURRENT_SOLD_CONTROL_SMOKE_CLASS_MISMATCH');
          if (receipt.counts.control_synthetic_admitted !== 1 ||
              receipt.counts.private_candidate_admitted !== 0 ||
              receipt.counts.lawful_empirical_admitted !== 0) {
            throw new Error('CURRENT_SOLD_CONTROL_SMOKE_EMPIRICAL_BOUNDARY_BROKEN');
          }
          if (!receipt.atomicity.whole_batch_atomic || !receipt.atomicity.non_pass_admission_withheld) {
            throw new Error('CURRENT_SOLD_CONTROL_SMOKE_ATOMICITY_MISSING');
          }
          if (receipt.ledger.write_performed || receipt.ledger.migration_applied || receipt.ledger.rows_written !== 0) {
            throw new Error('CURRENT_SOLD_CONTROL_SMOKE_LEDGER_BOUNDARY_BROKEN');
          }
          if (receipt.claim_boundary.public !== 'HOLD' ||
              receipt.claim_boundary.production !== 'HOLD' ||
              receipt.claim_boundary.g5 !== 'HOLD') {
            throw new Error('CURRENT_SOLD_CONTROL_SMOKE_RELEASE_BOUNDARY_BROKEN');
          }
          NODE
          test "$(stat -c '%a' out/current-sold-postlanding/control-smoke-receipt.json)" = 600
          if grep -Eq 'example\.invalid|control:synthetic|realized_consideration|source_url' out/current-sold-postlanding/control-smoke-receipt.json; then
            echo 'CURRENT_SOLD_CONTROL_SMOKE_RAW_DATA_LEAK' >&2
            exit 1
          fi

      - name: Verify append-only PostgreSQL migration boundary
        shell: bash
        run: |
          set -euo pipefail
          sql='infrastructure/postgres/current-sold/0001_current_sold_append_only_ledger_v1.sql'
          grep -q 'BEFORE UPDATE OR DELETE ON kidults_private.current_sold_event_ledger' "$sql"
          grep -q 'BEFORE TRUNCATE ON kidults_private.current_sold_event_ledger' "$sql"
          grep -q 'REVOKE UPDATE, DELETE, TRUNCATE' "$sql"
          if grep -Eqi 'ON CONFLICT.*DO UPDATE|UPDATE[[:space:]]+kidults_private\.current_sold_|DELETE[[:space:]]+FROM[[:space:]]+kidults_private\.current_sold_' "$sql"; then
            echo 'CURRENT_SOLD_APPEND_ONLY_NEGATIVE_CHECK_FAIL' >&2
            exit 1
          fi

      - name: Emit exact-target post-landing receipt
        if: always()
        shell: bash
        env:
          CURRENT_SOLD_EXACT_SHA: ${{ steps.source.outputs.source_sha }}
          CURRENT_SOLD_TRIGGER_CLASS: ${{ steps.source.outputs.trigger_class }}
          CURRENT_SOLD_POST_LANDING_AUTHORITY: ${{ steps.source.outputs.post_landing_authoritative }}
          CURRENT_SOLD_TOKEN_SUPPRESSION_COMPENSATED: ${{ steps.source.outputs.token_suppression_compensated }}
          CURRENT_SOLD_LANDING_RUN_ID: ${{ steps.source.outputs.triggering_landing_run_id }}
          CURRENT_SOLD_PREMERGE_MAIN_SHA: ${{ steps.source.outputs.premerge_main_sha }}
          CURRENT_SOLD_MERGED_PR_HEAD_SHA: ${{ steps.source.outputs.merged_pr_head_sha }}
        run: |
          set -euo pipefail
          mkdir -p out/current-sold-postlanding
          cat > out/current-sold-postlanding/receipt.json <<EOF_RECEIPT
          {
            "control":"KIDULTS_CURRENT_SOLD_POST_LANDING_V1",
            "source_sha":"${CURRENT_SOLD_EXACT_SHA}",
            "run_id":"${GITHUB_RUN_ID}",
            "run_attempt":"${GITHUB_RUN_ATTEMPT}",
            "trigger_event":"${GITHUB_EVENT_NAME}",
            "trigger_class":"${CURRENT_SOLD_TRIGGER_CLASS}",
            "post_landing_authoritative":${CURRENT_SOLD_POST_LANDING_AUTHORITY:-false},
            "github_token_push_suppression_compensated":${CURRENT_SOLD_TOKEN_SUPPRESSION_COMPENSATED:-false},
            "triggering_landing_run_id":"${CURRENT_SOLD_LANDING_RUN_ID}",
            "premerge_main_sha":"${CURRENT_SOLD_PREMERGE_MAIN_SHA}",
            "merged_pr_head_sha":"${CURRENT_SOLD_MERGED_PR_HEAD_SHA}",
            "expected_tests":53,
            "lawful_empirical_current_sold_count":0,
            "private_candidate_current_sold_count":0,
            "postgres_migration_applied":false,
            "postgres_rows_written":0,
            "provider_calls":0,
            "deployment":false,
            "public":"HOLD",
            "production":"HOLD",
            "g5":"HOLD"
          }
          EOF_RECEIPT

      - name: Upload post-landing receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-current-sold-postlanding-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/current-sold-postlanding
          if-no-files-found: error
          retention-days: 30
