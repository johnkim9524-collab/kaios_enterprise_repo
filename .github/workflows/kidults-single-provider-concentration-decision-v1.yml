name: KIDULTS Single Provider Concentration Decision V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/single-provider-concentration-decision-v1.json'
      - 'coordination/kidults/poc/minimum-lawful-claim-profile-v1.json'
      - 'coordination/kidults/source-intelligence/collectaio-shadow-sold-admission-r1.json'
      - 'coordination/kidults/source-intelligence/strict-current-market-admission-gate-v1.json'
      - 'scripts/kidults/poc/validate-single-provider-concentration-decision-v1.mjs'
      - '.github/workflows/kidults-single-provider-concentration-decision-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate bounded concentration acceptance and replacement plan
        run: node scripts/kidults/poc/validate-single-provider-concentration-decision-v1.mjs
