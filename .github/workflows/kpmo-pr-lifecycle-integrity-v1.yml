name: KPMO PR Lifecycle Integrity V1

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-pr-lifecycle-integrity-v1.yml'
      - 'scripts/kidults/kpmo/run-pr-lifecycle-with-native-convergence-v1.mjs'
      - 'scripts/kidults/kpmo/validate-pr-lifecycle-integrity-v1.mjs'
      - 'scripts/kidults/kpmo/lib/atomic-landing-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/lib/direct-owner-ready-event-v1.mjs'
      - 'scripts/kidults/kpmo/lib/atomic-landing-staged-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/lib/atomic-landing-handoff-compatibility-v1.mjs'
      - 'scripts/kidults/kpmo/run-atomic-landing-handoff-preflight-v1.mjs'
      - 'scripts/kidults/kpmo/validate-atomic-landing-handoff-compatibility-v1.mjs'
      - 'scripts/kidults/kpmo/validate-atomic-landing-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/validate-direct-owner-ready-event-v1.mjs'
      - 'scripts/kidults/kpmo/validate-atomic-landing-staged-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/validate-pr-impact-routing-v1.mjs'
      - 'coordination/kidults/kpmo/scope-aware-required-status-policy-v1.json'
  push:
    branches:
      - 'codex/pr-lifecycle-integrity-v1-*'
    paths:
      - '.github/workflows/kpmo-pr-lifecycle-integrity-v1.yml'
      - 'scripts/kidults/kpmo/run-pr-lifecycle-with-native-convergence-v1.mjs'
      - 'scripts/kidults/kpmo/validate-pr-lifecycle-integrity-v1.mjs'
      - 'scripts/kidults/kpmo/lib/atomic-landing-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/lib/direct-owner-ready-event-v1.mjs'
      - 'scripts/kidults/kpmo/lib/atomic-landing-staged-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/lib/atomic-landing-handoff-compatibility-v1.mjs'
      - 'scripts/kidults/kpmo/run-atomic-landing-handoff-preflight-v1.mjs'
      - 'scripts/kidults/kpmo/validate-atomic-landing-handoff-compatibility-v1.mjs'
      - 'scripts/kidults/kpmo/validate-atomic-landing-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/validate-direct-owner-ready-event-v1.mjs'
      - 'scripts/kidults/kpmo/validate-atomic-landing-staged-lifecycle-authority-v1.mjs'
      - 'scripts/kidults/kpmo/validate-pr-impact-routing-v1.mjs'
      - 'coordination/kidults/kpmo/scope-aware-required-status-policy-v1.json'

permissions:
  contents: read

concurrency:
  group: kpmo-pr-lifecycle-integrity-v1-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Validate lifecycle classifier negative cases
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run lifecycle classification self-test
        run: node scripts/kidults/kpmo/validate-pr-lifecycle-integrity-v1.mjs --self-test

      - name: Run lifecycle native-convergence self-test
        run: node scripts/kidults/kpmo/run-pr-lifecycle-with-native-convergence-v1.mjs --self-test

      - name: Run atomic lifecycle authority regression
        run: node scripts/kidults/kpmo/validate-atomic-landing-lifecycle-authority-v1.mjs

      - name: Run direct repository-owner Ready regression
        run: node scripts/kidults/kpmo/validate-direct-owner-ready-event-v1.mjs

      - name: Run staged lifecycle authority regression
        run: node scripts/kidults/kpmo/validate-atomic-landing-staged-lifecycle-authority-v1.mjs

      - name: Run atomic landing frozen-workflow handoff regression
        run: node scripts/kidults/kpmo/validate-atomic-landing-handoff-compatibility-v1.mjs

  classify-live-pr:
    name: Classify exact PR readiness against native governance evidence
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify trusted base checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"

      - name: Converge native statuses, classify lifecycle, and preserve original verdict
        id: lifecycle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RECEIPT_PATH: /tmp/kpmo-pr-lifecycle/receipt.json
          LIFECYCLE_CONVERGENCE_MAX_ATTEMPTS: '60'
          LIFECYCLE_CONVERGENCE_DELAY_MS: '3000'\n          LIFECYCLE_EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: node scripts/kidults/kpmo/run-pr-lifecycle-with-native-convergence-v1.mjs

      - name: Persist fail-closed receipt if evaluator did not write one
        if: always()
        env:
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RECEIPT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RECEIPT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          receipt=/tmp/kpmo-pr-lifecycle/receipt.json
          if [ ! -s "$receipt" ]; then
            mkdir -p "$(dirname "$receipt")"
            node --input-type=module -e '
              import fs from "node:fs";
              const receipt = {
                id: "kpmo-pr-lifecycle-integrity-receipt-v1",
                repository: process.env.GH_REPOSITORY,
                pull_request: Number(process.env.PR_NUMBER),
                exact_head_sha: process.env.RECEIPT_HEAD_SHA,
                exact_base_sha: process.env.RECEIPT_BASE_SHA,
                workflow_run_id: process.env.GITHUB_RUN_ID,
                workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
                state: "READY_NON_PROMOTABLE",
                reason: "LIFECYCLE_EVALUATOR_DID_NOT_WRITE_RECEIPT",
                validator_authority: "CONTROL_ONLY",
                promotion_eligible: false,
                public_release: "HOLD",
                production: "HOLD",
                g5: "HOLD",
                final_live_reread: false
              };
              fs.writeFileSync(process.argv[1], JSON.stringify(receipt, null, 2) + "\n");
            ' "$receipt"
          fi

      - name: Upload run-attempt-base-head-bound lifecycle receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kpmo-pr-lifecycle-integrity-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/kpmo-pr-lifecycle/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reapply fail-closed lifecycle verdict
        if: always()
        env:
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$LIFECYCLE_OUTCOME" = success
