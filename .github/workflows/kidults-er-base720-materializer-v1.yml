name: KIDULTS ER Base-720 Materializer V1

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/er-base720-materializer-v1-lib.mjs'
      - 'scripts/kidults/entity-resolution/materialize-er-base720-v1.mjs'
      - 'scripts/kidults/entity-resolution/er-release-lineage-adapter-v1-lib.mjs'
      - 'tests/kidults/entity-resolution/er-base720-materializer-v1.test.mjs'
      - 'tests/kidults/entity-resolution/er-release-lineage-adapter-v1.test.mjs'
      - 'coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json'
      - '.github/workflows/kidults-er-base720-materializer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test exact six-strata base-720 materialization and fail-closed controls
        run: node --test tests/kidults/entity-resolution/er-base720-materializer-v1.test.mjs tests/kidults/entity-resolution/er-release-lineage-adapter-v1.test.mjs
