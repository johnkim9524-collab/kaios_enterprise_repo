name: KIDULTS ASI Global Source Pool Control V1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "coordination/kidults/source-intelligence/asi-global-source-pool-control-v1.json"
      - "scripts/kidults/source-intelligence/*provider-operation-receipt-v1.mjs"
      - "scripts/kidults/source-intelligence/validate-asi-global-source-pool-control-v1.mjs"
      - "scripts/kidults/source-intelligence/*asi-source-product-value-v1.mjs"
      - "scripts/kidults/source-intelligence/*asi-product-value-backfill-v1.mjs"
      - "scripts/kidults/source-intelligence/*asi-product-value-gate*v1.mjs"
      - "scripts/kidults/source-intelligence/*asi-rights-analysis-fast-lane-v1.mjs"
      - "scripts/kidults/source-intelligence/validate-asi-rights-analysis-fast-lane-decisions-v1.mjs"
      - "coordination/kidults/source-intelligence/asi-rights-analysis-fast-lane-v1.json"
      - "coordination/kidults/source-intelligence/asi-rights-analysis-fast-lane-decisions-v1.json"
      - ".github/workflows/kidults-asi-global-any-site-hourly-pooling-v2.yml"
      - ".github/workflows/kidults-asi-global-source-pool-control-v1.yml"
permissions:
  contents: read
concurrency:
  group: kidults-asi-global-source-pool-control-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  validate-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - name: Validate global source pool control
        run: node scripts/kidults/source-intelligence/validate-asi-global-source-pool-control-v1.mjs
      - name: Prove product-value admission and rejection boundaries
        run: node scripts/kidults/source-intelligence/test-asi-source-product-value-v1.mjs
      - name: Prove canonical 64 value backfill and no false promotion
        run: |
          node scripts/kidults/source-intelligence/build-asi-product-value-backfill-v1.mjs coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv coordination/kidults/source-intelligence/top16-empirical-activation-preflight-v1.json /tmp/asi-product-value-backfill-v1.json
          node scripts/kidults/source-intelligence/validate-asi-product-value-backfill-v1.mjs /tmp/asi-product-value-backfill-v1.json
      - name: Prove bounded rights-analysis Fast Lane and fail-closed atoms
        run: |
          node scripts/kidults/source-intelligence/build-asi-rights-analysis-fast-lane-v1.mjs /tmp/asi-product-value-backfill-v1.json coordination/kidults/source-intelligence/asi-rights-analysis-fast-lane-v1.json /tmp/asi-rights-analysis-fast-lane-v1.json
          node scripts/kidults/source-intelligence/validate-asi-rights-analysis-fast-lane-v1.mjs /tmp/asi-rights-analysis-fast-lane-v1.json
          node scripts/kidults/source-intelligence/validate-asi-rights-analysis-fast-lane-decisions-v1.mjs /tmp/asi-rights-analysis-fast-lane-v1.json coordination/kidults/source-intelligence/asi-rights-analysis-fast-lane-decisions-v1.json
      - name: Prove provider preflight fail-closed without network
        run: node scripts/kidults/source-intelligence/test-provider-operation-receipt-v1.mjs
