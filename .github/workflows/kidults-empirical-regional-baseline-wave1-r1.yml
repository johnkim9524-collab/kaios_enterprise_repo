name: KIDULTS Empirical Regional Baseline Wave1 R1
on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/empirical-regional-baseline-wave1-contract-r1.json'
      - 'scripts/kidults/source-intelligence/build-empirical-regional-baseline-wave1-r1.mjs'
      - '.github/workflows/kidults-empirical-regional-baseline-wave1-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/kidults/source-intelligence/build-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json
      - name: Fail closed against fabricated market scale
        run: |
          node - <<'NODE'
          const r=require('/tmp/empirical-regional-baseline-wave1-r1.json');
          if(r.production!=='HOLD') process.exit(1);
          if(r.macroregions.some(x=>x.bootstrap_is_market_share!==false)) process.exit(1);
          if(r.macroregions.some(x=>x.market_scale!=='UNKNOWN'||x.market_maturity!=='UNKNOWN')) process.exit(1);
          if(!r.truth_boundary.includes('NO_RECORD_COUNT_AS_MARKET_SCALE')) process.exit(1);
          console.log('Empirical Regional Baseline Wave1 fail-closed diagnostic PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: empirical-regional-baseline-wave1-r1
          path: /tmp/empirical-regional-baseline-wave1-r1.json
          retention-days: 30
