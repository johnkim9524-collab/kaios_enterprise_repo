name: KIDULTS Empirical Regional Baseline Wave1 R1
on:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/empirical-regional-baseline-wave1-contract-r1.json'
      - 'coordination/kidults/source-intelligence/musicbrainz-regional-catalog-observation-admission-r1.json'
      - 'scripts/kidults/source-intelligence/probe-musicbrainz-regional-catalog-observation-r1.mjs'
      - 'scripts/kidults/source-intelligence/build-empirical-regional-baseline-wave1-r1.mjs'
      - 'scripts/kidults/source-intelligence/validate-empirical-regional-baseline-wave1-r1.mjs'
      - '.github/workflows/kidults-empirical-regional-baseline-wave1-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Acquire bounded region-bound catalog observations
        run: node scripts/kidults/source-intelligence/probe-musicbrainz-regional-catalog-observation-r1.mjs /tmp/musicbrainz-regional-catalog-observation-r1.json
      - name: Build empirical Wave 1 baseline from admitted observations
        run: node scripts/kidults/source-intelligence/build-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json /tmp/musicbrainz-regional-catalog-observation-r1.json
      - name: Validate fail-closed empirical baseline
        run: node scripts/kidults/source-intelligence/validate-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json
      - name: Enforce blocker transition without market-factor promotion
        run: |
          node - <<'NODE'
          const r=require('/tmp/empirical-regional-baseline-wave1-r1.json');
          if(r.production!=='HOLD'||r.public_release!=='HOLD') throw new Error('RELEASE');
          if(r.coverage_debt_report.region_bound_source_assets!==1) throw new Error('EXPECTED_ONE_REGION_BOUND_SOURCE');
          if(r.coverage_debt_report.region_bound_observation_count<1) throw new Error('NO_REGION_BOUND_OBSERVATIONS');
          if(r.coverage_debt_report.factor_assertions_verified!==0) throw new Error('MARKET_FACTOR_OVERCLAIM');
          if(r.coverage_debt_report.blocker!=='REGION_BOUND_CATALOG_OBSERVATIONS_PRESENT_MARKET_FACTOR_EVIDENCE_ABSENT') throw new Error('BLOCKER_TRANSITION');
          if(r.cells.some(x=>x.collection_quota!==null||x.analytical_weight!==null||x.eligibility!=='NOT_VERIFIED')) throw new Error('PREMATURE_WEIGHT_ACTIVATION');
          if(r.shadow_delta.status!=='NO_MUTATION_FAIL_CLOSED'||r.shadow_delta.reason!=='REGION_BINDING_EXISTS_BUT_ZERO_VERIFIED_MARKET_FACTORS') throw new Error('SHADOW_BOUNDARY');
          console.log(JSON.stringify({status:'PASS',region_bound_source_assets:r.coverage_debt_report.region_bound_source_assets,region_bound_observation_count:r.coverage_debt_report.region_bound_observation_count,verified_market_factors:0,blocker:r.coverage_debt_report.blocker,production:'HOLD'}));
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: empirical-regional-baseline-wave1-r1
          path: |
            /tmp/musicbrainz-regional-catalog-observation-r1.json
            /tmp/empirical-regional-baseline-wave1-r1.json
          retention-days: 30
