name: KIDULTS Runtime Control Baseline R1

on:
  pull_request:
    paths:
      - 'scripts/kidults/runtime/run-real-source-runtime-control-baseline-r1.mjs'
      - '.github/workflows/kidults-runtime-control-baseline-r1.yml'
      - 'scripts/kidults/source-intelligence/run-met-real-source-admission-r1.mjs'
      - 'scripts/kidults/source-intelligence/run-getty-historical-sale-r1.mjs'
      - 'scripts/kidults/source-intelligence/build-real-source-processor-bridge-r1.mjs'
      - 'services/kidults-autonomous-intelligence/scripts/asi-real-source-queue-injection-r1.mjs'
      - 'services/kidults-autonomous-intelligence/scripts/asi-real-source-retry-dlq-quarantine-r1.mjs'
      - 'services/kidults-autonomous-intelligence/scripts/asi-processor-runtime-e2e-test.mjs'
      - 'services/kidults-autonomous-intelligence/src/asi/event.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/processors.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/processor-runtime.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/runtime.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/registry.ts'
      - 'services/kidults-autonomous-intelligence/migrations/0001_canonical_foundation.sql'
      - 'services/kidults-autonomous-intelligence/migrations/0002_autonomous_orchestration.sql'
      - 'services/kidults-autonomous-intelligence/migrations/0003_asi_market_funnel_shadow.sql'
      - 'services/kidults-autonomous-intelligence/migrations/0004_asi_processor_shadow.sql'
      - 'services/kidults-autonomous-intelligence/migrations/0005_asi_runtime_recovery_fairness_shadow.sql'
      - 'services/kidults-autonomous-intelligence/migrations/0006_asi_task_lease_atomic_fencing_shadow.sql'
      - 'services/kidults-autonomous-intelligence/package.json'
      - 'services/kidults-autonomous-intelligence/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: kidults-runtime-control-baseline-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-control-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
      - name: Install ASI runtime dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure live-metadata-derived local in-memory CI control workload
        run: node scripts/kidults/runtime/run-real-source-runtime-control-baseline-r1.mjs /tmp/kidults-runtime-control-baseline-r1.json
      - name: Enforce exact local synthetic control-only truth boundary
        run: |
          node -e "const x=require('/tmp/kidults-runtime-control-baseline-r1.json'); if(x.environment_class!=='CI_CONTROL'||x.workload_class!=='LIVE_METADATA_DERIVED_LOCAL_IN_MEMORY_BOUNDED_CONTROL'||x.backend.database!=='LOCAL_IN_MEMORY_SQLITE'||x.backend.queue!=='LOCAL_DETERMINISTIC_IN_MEMORY_QUEUE'||x.backend.remote_cloudflare!==false||x.backend.canonical_cloudflare_durability_verified!==false||x.original_source_record_processed!==false||x.validations.timing_instrumentation!=='PASS'||x.validations.live_metadata_retrieval_workflow!=='PASS'||x.validations.local_queue_d1_compatible_harness!=='PASS'||x.validations.synthetic_retry_dlq_control!=='PASS'||x.validations.synthetic_fail_closed_rights_hold!=='PASS'||x.validations.forced_failure_source_observed!==false||x.validations.unknown_rights_source_observed!==false||x.validations.remote_cloudflare_execution_verified!==false||x.validations.dev_environment_measured!=='NOT_YET'||x.validations.staging_environment_measured!=='NOT_YET'||x.validations.business_capacity_claim_authorized!==false||x.validations.production_mutation!==false||x.production!=='HOLD') process.exit(1); console.log('Local in-memory CI control baseline PASS; remote Cloudflare, DEV/STAGING capacity, and business claims remain blocked.')"
      - name: Upload local runtime control artifacts
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-runtime-control-baseline-r1
          path: |
            /tmp/kidults-runtime-control-baseline-r1.json
            /tmp/met-real-source-admission-r1.json
            /tmp/getty-historical-sale-r1.json
            /tmp/asi-real-source-processor-bridge-r1.json
            /tmp/asi-real-source-queue-injection-r1.json
            /tmp/asi-real-source-retry-dlq-quarantine-r1.json
          if-no-files-found: error
          retention-days: 30
