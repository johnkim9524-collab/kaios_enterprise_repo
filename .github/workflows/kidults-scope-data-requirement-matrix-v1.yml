name: KIDULTS Scope Data Requirement Matrix v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope-data/**'
      - 'scripts/kidults/validate-scope-data-requirement-matrix-v1.mjs'
      - '.github/workflows/kidults-scope-data-requirement-matrix-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validate 32-Scope Matrix
        run: node scripts/kidults/validate-scope-data-requirement-matrix-v1.mjs
