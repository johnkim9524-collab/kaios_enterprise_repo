name: KIDULTS Provider Removal Continuity V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/internalization/provider-removal-baseline-v1.json'
      - 'coordination/kidults/internalization/provider-removal-simulation-contract-v1.json'
      - 'scripts/kidults/internalization/validate-provider-removal-baseline-v1.mjs'
      - 'scripts/kidults/internalization/validate-provider-removal-simulation-v1.mjs'
      - '.github/workflows/kidults-provider-removal-continuity-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/internalization/provider-removal-baseline-v1.json'
      - 'coordination/kidults/internalization/provider-removal-simulation-contract-v1.json'
      - 'scripts/kidults/internalization/validate-provider-removal-baseline-v1.mjs'
      - 'scripts/kidults/internalization/validate-provider-removal-simulation-v1.mjs'
      - '.github/workflows/kidults-provider-removal-continuity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-provider-removal-continuity-v1-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  provider-removal-continuity:
    name: provider-removal-continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'

      - name: Validate provider-removal baseline truth
        run: node scripts/kidults/internalization/validate-provider-removal-baseline-v1.mjs

      - name: Validate provider-removal simulation contract
        run: node scripts/kidults/internalization/validate-provider-removal-simulation-v1.mjs

      - name: Reject continuity-contract weakening
        shell: bash
        run: |
          set -euo pipefail
          file='coordination/kidults/internalization/provider-removal-simulation-contract-v1.json'
          cp "$file" /tmp/provider-removal-contract.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='coordination/kidults/internalization/provider-removal-simulation-contract-v1.json';
          const value=JSON.parse(fs.readFileSync(file,'utf8'));
          value.required_continuity_invariants=value.required_continuity_invariants.filter((x)=>x!=='canonical_identity_continuity');
          fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');
          NODE
          if node scripts/kidults/internalization/validate-provider-removal-simulation-v1.mjs; then
            echo 'negative mutation unexpectedly passed' >&2
            exit 1
          fi
          mv /tmp/provider-removal-contract.json "$file"

      - name: Reject premature empirical promotion
        shell: bash
        run: |
          set -euo pipefail
          file='coordination/kidults/internalization/provider-removal-baseline-v1.json'
          cp "$file" /tmp/provider-removal-baseline.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='coordination/kidults/internalization/provider-removal-baseline-v1.json';
          const value=JSON.parse(fs.readFileSync(file,'utf8'));
          const psa=value.providers.find((x)=>x.provider_id==='PSA');
          psa.removal_test_state='PASS';
          psa.decision='PASS_FOR_REPLACEABLE_USE';
          value.summary.empirical_pass=1;
          value.summary.not_measured=5;
          fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');
          NODE
          if node scripts/kidults/internalization/validate-provider-removal-baseline-v1.mjs; then
            echo 'premature empirical promotion unexpectedly passed' >&2
            exit 1
          fi
          mv /tmp/provider-removal-baseline.json "$file"

      - name: Confirm working tree restored
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
