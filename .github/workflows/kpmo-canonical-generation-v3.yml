name: KPMO Canonical Generation V3 Bootstrap Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-canonical-generation-v3.yml'
      - '.github/workflows/kpmo-canonical-generation-v3-apply.yml'
      - 'scripts/kidults/kpmo/canonical-generation-v3.mjs'
      - 'scripts/kidults/kpmo/canonical-generation-v3-lib.mjs'
      - 'scripts/kidults/kpmo/material-defect-registry-v3.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpmo-canonical-generation-v3-bootstrap-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: CANONICAL_V3_BOOTSTRAP_VALIDATION_ONLY
        run: echo 'Canonical V3 bootstrap is read-only; issue writes are not reachable from this workflow.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact validation source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate append-only V3 payload contract and negative mutations
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/canonical-generation-v3.mjs --self-test
      - name: Prove bootstrap cannot reach issue-write authority
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='.github/workflows/kpmo-canonical-generation-v3.yml';
          const s=fs.readFileSync(p,'utf8');
          for(const forbidden of [/issues:\s*write/, /^  push:/m, /^  issues:/m, /^  schedule:/m]) {
            if(forbidden.test(s)) throw new Error(`CANONICAL_V3_BOOTSTRAP_WRITE_SURFACE_PRESENT:${forbidden}`);
          }
          const writeFlag=['--','write'].join('');
          if(s.includes(writeFlag)) throw new Error('CANONICAL_V3_BOOTSTRAP_WRITE_FLAG_PRESENT');
          if(!/^  pull_request:/m.test(s)||!/^  workflow_dispatch:/m.test(s)) throw new Error('CANONICAL_V3_BOOTSTRAP_TRIGGER_BOUNDARY_INVALID');
          console.log('Canonical V3 bootstrap write authority unreachable: PASS');
          NODE
      - name: Validate one-shot apply workflow authority surface
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='.github/workflows/kpmo-canonical-generation-v3-apply.yml';
          const s=fs.readFileSync(p,'utf8');
          for(const forbidden of [/^  pull_request:/m,/^  push:/m,/^  issues:/m,/^  schedule:/m,/^  workflow_run:/m,/\$\{\{[^}]*secrets/i]) {
            if(forbidden.test(s)) throw new Error(`CANONICAL_V3_APPLY_FORBIDDEN_SURFACE:${forbidden}`);
          }
          for(const required of [
            /^  workflow_dispatch:/m,
            /contents:\s*read/,
            /issues:\s*write/,
            /actions:\s*read/,
            /authorization_id:/,
            /target_main_sha:/,
            /CANONICAL_GENERATION_EXPLICIT_WRITE_AUTHORITY:\s*AUTHORIZED/,
            /node scripts\/kidults\/kpmo\/canonical-generation-v3\.mjs --write/,
            /cancel-in-progress:\s*false/,
            /if:\s*always\(\)/,
            /retention-days:\s*90/
          ]) if(!required.test(s)) throw new Error(`CANONICAL_V3_APPLY_REQUIRED_CONTRACT_MISSING:${required}`);
          console.log('Canonical V3 one-shot apply authority contract: PASS');
          NODE
