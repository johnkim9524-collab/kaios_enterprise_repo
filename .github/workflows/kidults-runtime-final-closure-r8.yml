name: KIDULTS Runtime Final Closure R8
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/kidults-runtime-final-closure-r8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-final-r8:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_D1: kidults-intelligence-db-staging
      PRODUCTION_D1: kidults-intelligence-db
      R3_EVENT_ID: evt_kpmo_golden_r3_5e1374c71eda3e73
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: GATE — read-only least privilege
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 info "$STAGING_D1" --json > /tmp/staging-info.json
          grep -Fq '9bc6a406-6fca-4959-be7f-dd7f715b092c' /tmp/staging-info.json

      - name: READ — fresh R7 idempotency and throughput evidence
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT event_id,received_at FROM asi_event_log WHERE producer_engine='KPMO_RUNTIME_FINAL_R7' ORDER BY received_at DESC LIMIT 5" --json > /tmp/r7-events.json
          node - <<'NODE' > /tmp/r7.env
          const x=require('/tmp/r7-events.json');const rows=x.flatMap(v=>v.results||[]);if(rows.length!==5||new Set(rows.map(r=>r.event_id)).size!==5)throw new Error(`R7_EVENT_SET_NOT_EXACT_5:${rows.length}`);console.log(`EVENT_IDS=${rows.map(r=>r.event_id).join(',')}`);console.log(`FIRST_EVENT=${rows[0].event_id}`);
          NODE
          source /tmp/r7.env
          IDS=$(printf '%s' "$EVENT_IDS" | awk -F, '{for(i=1;i<=NF;i++){printf "%s%s%s",(i>1?",":""),"\047",$i"\047"}}')
          npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT (SELECT COUNT(*) FROM asi_event_log WHERE event_id='$FIRST_EVENT') AS event_rows,(SELECT COUNT(*) FROM asi_outbox WHERE event_id='$FIRST_EVENT') AS outbox_rows,(SELECT COUNT(*) FROM asi_processed_messages WHERE event_id='$FIRST_EVENT' AND status='SUCCEEDED') AS success_rows" --json > /tmp/idem.json
          npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT COUNT(DISTINCT e.event_id) AS events,MIN(e.received_at) AS started_at,MAX(p.completed_at) AS completed_at FROM asi_event_log e JOIN asi_processed_messages p ON p.event_id=e.event_id AND p.status='SUCCEEDED' WHERE e.event_id IN ($IDS)" --json > /tmp/throughput-remote.json
          node - <<'NODE'
          const fs=require('fs'); const idem=require('/tmp/idem.json')?.[0]?.results?.[0]||{}; if(Number(idem.event_rows)!==1||Number(idem.outbox_rows)!==1||Number(idem.success_rows)!==1) throw new Error(`IDEMPOTENCY_NOT_EXACT:${JSON.stringify(idem)}`);
          const r=require('/tmp/throughput-remote.json')?.[0]?.results?.[0]||{}; if(Number(r.events)!==5||!r.started_at||!r.completed_at) throw new Error(`THROUGHPUT_SET_INCOMPLETE:${JSON.stringify(r)}`); const ms=Date.parse(r.completed_at)-Date.parse(r.started_at); if(!Number.isFinite(ms)||ms<0) throw new Error('THROUGHPUT_TIME_INVALID'); const out={events:5,elapsed_ms:ms,events_per_second:ms===0?null:5/(ms/1000),started_at:r.started_at,completed_at:r.completed_at}; fs.writeFileSync('/tmp/throughput.json',JSON.stringify(out,null,2)); console.log(JSON.stringify({idempotency:'PASS',throughput:out},null,2));
          NODE

      - name: BACKUP — read-only logical snapshot of runtime-critical ledgers
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          mkdir -p /tmp/runtime-backup
          for T in asi_event_log asi_outbox asi_processed_messages asi_dead_letters asi_terminal_dlq_receipts; do
            npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='$T'" --json > "/tmp/runtime-backup/schema-$T.json"
            npx wrangler d1 execute "$STAGING_D1" --remote --command "SELECT * FROM $T" --json > "/tmp/runtime-backup/data-$T.json"
          done
          END=$(date +%s%3N); printf 'BACKUP_READ_MS=%s\n' "$((END-START))" > /tmp/r8-metrics.env
          python - <<'PY'
          import hashlib,json,pathlib
          h=hashlib.sha256()
          for p in sorted(pathlib.Path('/tmp/runtime-backup').glob('*.json')):
              h.update(p.name.encode());h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          pathlib.Path('/tmp/backup.sha256').write_text(h.hexdigest())
          PY

      - name: RESTORE — independent offline SQLite clone
        run: |
          set -euo pipefail
          START=$(date +%s%3N)
          python - <<'PY'
          import json,sqlite3,pathlib
          tables=['asi_event_log','asi_outbox','asi_processed_messages','asi_dead_letters','asi_terminal_dlq_receipts']
          root=pathlib.Path('/tmp/runtime-backup'); db=sqlite3.connect('/tmp/runtime-r8-restore.sqlite'); db.execute('PRAGMA foreign_keys=OFF')
          def rows(path):
              x=json.load(open(path)); return [r for block in x for r in block.get('results',[])]
          for t in tables:
              s=rows(root/f'schema-{t}.json')
              if len(s)!=1 or not s[0].get('sql'): raise SystemExit(f'MISSING_SCHEMA:{t}')
              db.execute(s[0]['sql'])
          for t in tables:
              rs=rows(root/f'data-{t}.json')
              if not rs: continue
              cols=list(rs[0].keys()); q=','.join('?' for _ in cols); names=','.join('"'+c.replace('"','""')+'"' for c in cols)
              db.executemany(f'INSERT INTO "{t}" ({names}) VALUES ({q})',[[r.get(c) for c in cols] for r in rs])
          db.commit();db.close()
          PY
          END=$(date +%s%3N); printf 'RESTORE_MS=%s\n' "$((END-START))" >> /tmp/r8-metrics.env

      - name: VERIFY — zero-loss restored control records and DLQ evidence
        run: |
          set -euo pipefail
          source /tmp/r7.env
          python - <<'PY'
          import json,sqlite3,os
          ids=os.environ['EVENT_IDS'].split(','); q=','.join('?' for _ in ids); db=sqlite3.connect('/tmp/runtime-r8-restore.sqlite')
          tables=db.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('asi_event_log','asi_outbox','asi_processed_messages','asi_dead_letters','asi_terminal_dlq_receipts')").fetchone()[0]
          events=db.execute(f'SELECT COUNT(*) FROM asi_event_log WHERE event_id IN ({q})',ids).fetchone()[0]
          outboxes=db.execute(f'SELECT COUNT(*) FROM asi_outbox WHERE event_id IN ({q})',ids).fetchone()[0]
          succeeded=db.execute(f"SELECT COUNT(DISTINCT event_id) FROM asi_processed_messages WHERE event_id IN ({q}) AND status='SUCCEEDED'",ids).fetchone()[0]
          r3=os.environ['R3_EVENT_ID']; dead=db.execute('SELECT COUNT(*) FROM asi_dead_letters WHERE event_id=?',(r3,)).fetchone()[0]; receipts=db.execute('SELECT COUNT(*) FROM asi_terminal_dlq_receipts WHERE event_id=?',(r3,)).fetchone()[0]
          db.close(); result={'restore_target':'EPHEMERAL_OFFLINE_SQLITE_CLONE','required_tables':tables,'r7_control_events':events,'r7_control_outboxes':outboxes,'r7_control_succeeded':succeeded,'r3_dead_letter_rows':dead,'r3_terminal_receipt_rows':receipts,'control_record_loss':5-events}
          json.dump(result,open('/tmp/restore.json','w'),indent=2); print(json.dumps(result,indent=2))
          if tables!=5 or events!=5 or outboxes!=5 or succeeded!=5 or dead<1 or receipts<1 or 5-events!=0: raise SystemExit('RESTORE_VALIDATION_FAILED')
          PY

      - name: VERIFY — Production remains read-only
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PRODUCTION_D1" --remote --command "SELECT 1 AS production_read_probe" --json > /tmp/prod.json
          node - <<'NODE'
          const x=require('/tmp/prod.json');if(!x.every(v=>v.success===true)||x.some(v=>Number(v.meta?.rows_written||0)!==0||Number(v.meta?.changes||0)!==0))throw new Error('PRODUCTION_MUTATION');
          NODE

      - name: RECEIPT — runtime recovery closure
        run: |
          set -euo pipefail
          mkdir -p /tmp/r8-safe
          node - <<'NODE'
          const fs=require('fs'),m={};for(const l of fs.readFileSync('/tmp/r8-metrics.env','utf8').split(/\n/)){const i=l.indexOf('=');if(i>0)m[l.slice(0,i)]=Number(l.slice(i+1))} const throughput=require('/tmp/throughput.json'),restore=require('/tmp/restore.json'); const receipt={state:'RUNTIME_R8_CLOSURE_PASS',idempotency:'PASS_EXACT_ONE_EVENT_OUTBOX_SUCCESS_AFTER_DUPLICATE_ENQUEUE',throughput,backup_restore:restore,backup_sha256:'sha256:'+fs.readFileSync('/tmp/backup.sha256','utf8').trim(),metrics_ms:m,rto_observed_restore_ms:m.RESTORE_MS,rpo_observed_control_record_loss:restore.control_record_loss,recovery_audit:true,credential_scope:'READ_ONLY_D1_NO_EXPORT_PERMISSION_REQUIRED',production_mutation:false,production:'HOLD'}; fs.writeFileSync('/tmp/r8-safe/receipt.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: kidults-runtime-final-closure-r8
          path: /tmp/r8-safe/receipt.json
          retention-days: 30
