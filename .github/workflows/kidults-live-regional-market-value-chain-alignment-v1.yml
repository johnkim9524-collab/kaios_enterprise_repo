name: KIDULTS Live Regional Market Value Chain Alignment V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/architecture/live-regional-market-value-chain-alignment-v1.json'
      - 'coordination/kidults/source-intelligence/asi-global-regional-market-balance-policy-v1.json'
      - 'scripts/kidults/source-intelligence/validate-live-regional-market-value-chain-alignment-v1.mjs'
      - '.github/workflows/kidults-live-regional-market-value-chain-alignment-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/architecture/live-regional-market-value-chain-alignment-v1.json'
      - 'coordination/kidults/source-intelligence/asi-global-regional-market-balance-policy-v1.json'
      - 'scripts/kidults/source-intelligence/validate-live-regional-market-value-chain-alignment-v1.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validate live regional value-chain alignment
        run: node scripts/kidults/source-intelligence/validate-live-regional-market-value-chain-alignment-v1.mjs
