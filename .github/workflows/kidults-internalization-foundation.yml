name: KIDULTS Internalization Foundation

on:
  pull_request:
    paths:
      - 'coordination/kidults/internalization/**'
      - 'scripts/kidults/internalization/**'
      - '.github/workflows/kidults-internalization-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate rights intelligence
        run: node scripts/kidults/internalization/validate-rights-intelligence-policy-v1.mjs
      - name: Validate provider economics
        run: node scripts/kidults/internalization/validate-provider-economics-v1.mjs
      - name: Validate source reputation
        run: node scripts/kidults/internalization/validate-source-reputation-v1.mjs
      - name: Validate market integrity
        run: node scripts/kidults/internalization/validate-market-integrity-v1.mjs
      - name: Validate canonical ontology evolution
        run: node scripts/kidults/internalization/validate-canonical-ontology-evolution-v1.mjs
      - name: Validate historical learning memory
        run: node scripts/kidults/internalization/validate-historical-learning-memory-v1.mjs
      - name: Validate provider removal continuity
        run: node scripts/kidults/internalization/validate-provider-removal-simulation-v1.mjs
