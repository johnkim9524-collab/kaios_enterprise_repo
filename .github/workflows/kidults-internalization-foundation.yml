name: KIDULTS Internalization Foundation

on:
  pull_request:
    paths:
      - 'coordination/kidults/internalization/**'
      - 'scripts/kidults/internalization/**'
      - '.github/workflows/kidults-internalization-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate full internalization foundation
        run: node scripts/kidults/internalization/validate-internalization-foundation-v1.mjs
