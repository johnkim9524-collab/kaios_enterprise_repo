name: KIDULTS PostgreSQL One-Shot Authorization Native Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-postgres-one-shot-authorization-boundary-v1.yml'
      - '.github/workflows/p0-postgres-target-time-restore-verification.yml'
      - '.github/workflows/p0-remote-postgres-persistence-pitr.yml'
      - 'coordination/kidults/governance/external-one-shot-approval-ledger-v1.json'
      - 'coordination/kidults/kpmo/github-trusted-ref-environment-readback-contract-v1.json'
      - 'coordination/kidults/kpmo/scope-aware-required-status-policy-v1.json'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
      - 'coordination/kidults/runtime/postgres-external-one-shot-authorization-v1.json'
      - 'docs/kidults/security/github-trusted-ref-environment-readback-v1.md'
      - 'docs/kidults/security/postgres-external-one-shot-authorization-v1.md'
      - 'package.json'
      - 'scripts/governance/external-one-shot-approval-ledger-v1.mjs'
      - 'scripts/kidults/kpmo/github-trusted-ref-environment-readback-v1.mjs'
      - 'scripts/kidults/kpmo/lib/governed-landing-native-gates-v1.mjs'
      - 'scripts/kidults/kpmo/validate-github-trusted-ref-environment-readback-v1.mjs'
      - 'scripts/kidults/kpmo/validate-governed-landing-coverage-v1.mjs'
      - 'scripts/staging/validate-postgres-external-one-shot-authorization-v1.mjs'
      - 'scripts/staging/run-postgres-verifier-through-ssh-tunnel.sh'
      - 'scripts/staging/verify-remote-postgres-persistence-pitr.sh'
      - 'scripts/staging/verify-postgres-target-time-restore.sh'
      - 'scripts/staging/verify-postgres-one-shot-authorization-fresh-v1.sh'
      - 'tests/kidults/kpmo/external-one-shot-approval-ledger-v1.test.mjs'
      - 'tests/kidults/kpmo/github-trusted-ref-environment-readback-v1.test.mjs'
      - 'tests/kidults/kpmo/governed-landing-native-gates-v1.test.mjs'
      - 'tests/staging/postgres-external-one-shot-authorization-v1.test.mjs'

permissions:
  contents: read

concurrency:
  group: kidults-postgres-one-shot-authorization-boundary-v1-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: KIDULTS PostgreSQL One-Shot Authorization Boundary V1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact pull-request source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate PostgreSQL one-shot, trusted-ref and native scope boundaries
        run: |
          set -euo pipefail
          node --check scripts/governance/external-one-shot-approval-ledger-v1.mjs
          node --check scripts/kidults/kpmo/github-trusted-ref-environment-readback-v1.mjs
          node --check scripts/kidults/kpmo/validate-github-trusted-ref-environment-readback-v1.mjs
          node --check scripts/staging/validate-postgres-external-one-shot-authorization-v1.mjs
          bash -n scripts/staging/verify-postgres-one-shot-authorization-fresh-v1.sh
          npm run validate:postgres-one-shot
          node --test tests/kidults/kpmo/external-one-shot-approval-ledger-v1.test.mjs
          node scripts/kidults/kpmo/validate-github-trusted-ref-environment-readback-v1.mjs
          node --test tests/kidults/kpmo/github-trusted-ref-environment-readback-v1.test.mjs
          node scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs --enforce-registry
          node scripts/kidults/kpmo/validate-governed-landing-coverage-v1.mjs
          node --test tests/kidults/kpmo/governed-landing-native-gates-v1.test.mjs
