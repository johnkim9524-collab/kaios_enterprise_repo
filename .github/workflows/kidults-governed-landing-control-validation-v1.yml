name: KIDULTS Governed Landing Control Validation V1

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
      - "services/kidults-control-plane/**"
      - "services/kidults-autonomous-intelligence/src/**"
      - "services/kidults-autonomous-intelligence/package.json"
      - "services/kidults-autonomous-intelligence/wrangler.jsonc"
      - "coordination/kidults/redteam/d1-legacy-resource-policy-v1.json"
      - "coordination/kidults/kpmo/governed-landing-authorization-policy-v1.json"
      - "coordination/kidults/kpmo/scope-aware-required-status-policy-v1.json"
      - "coordination/kidults/kpmo/trusted-governed-control-freeze-v1.json"
      - "scripts/kidults/kpmo/validate-governed-landing-coverage-v1.mjs"
      - "scripts/kidults/kpmo/validate-workflow-repository-mutation-boundary-v1.mjs"
      - "scripts/kidults/kpmo/validate-trusted-governed-control-freeze-v1.mjs"
      - "scripts/kidults/kpmo/run-atomic-governed-landing-v1.mjs"
      - "scripts/kidults/kpmo/run-scope-aware-authoritative-status-v1.mjs"
      - "scripts/kidults/kpmo/lib/governed-landing-*.mjs"
      - "tests/kidults/kpmo/governed-landing-native-gates-v1.test.mjs"
      - "tests/kidults/kpmo/trusted-governed-control-freeze-v1.test.mjs"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kidults-governed-landing-control-validation-bootstrap-v1-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  exact-seven-control-bootstrap:
    name: KIDULTS Governed Landing Control Validation V1
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject non-canonical event lineage
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request_target
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BASE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: trusted-control

      - name: Checkout exact candidate as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Bind exact commits and candidate tree
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_CANDIDATE_TREE: 6b293c55260b737e6bc1ee9ee5da4cbafa594788
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted-control rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$EXPECTED_CANDIDATE_TREE"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$(git -C candidate write-tree)"
          git -C candidate diff --quiet HEAD --
          git -C candidate diff --cached --quiet HEAD --
          if git -C candidate ls-files -s | awk '$1 == "120000" || $1 == "160000" { found=1 } END { exit !found }'; then
            echo 'Symlink or submodule entries are forbidden.' >&2
            exit 1
          fi

      - name: Use exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'

      - name: Validate exact owner-approved changed-file packet and final live state
        env:
          EXPECTED_CANDIDATE_TREE: 6b293c55260b737e6bc1ee9ee5da4cbafa594788
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_FILE_COUNT: "156"
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PACKET_SHA256: "sha256:17dde6623ec474a546b99fd2f2f525d07861c894f3596152cbdbdd649df4ebfd"
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';

          const required = (condition, code) => { if (!condition) throw new Error(code); };
          const repository = process.env.GH_REPOSITORY;
          const expectedCount = Number(process.env.EXPECTED_FILE_COUNT);
          const expectedDigest = process.env.EXPECTED_PACKET_SHA256;
          const expectedTree = process.env.EXPECTED_CANDIDATE_TREE;
          required(Number.isInteger(expectedCount) && expectedCount > 0, 'EXPECTED_FILE_COUNT_INVALID');
          required(/^sha256:[0-9a-f]{64}$/.test(expectedDigest || ''), 'EXPECTED_PACKET_DIGEST_INVALID');
          required(/^[0-9a-f]{40}$/.test(expectedTree || ''), 'EXPECTED_CANDIDATE_TREE_INVALID');
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kidults-governed-landing-control-bootstrap-v1',
          };
          const api = async apiPath => {
            const response = await fetch(`https://api.github.com/repos/${repository}${apiPath}`, {
              headers,
              redirect: 'error',
              signal: AbortSignal.timeout(30_000),
            });
            required(response.ok, `GITHUB_API_${response.status}:${apiPath}`);
            return response.json();
          };
          const validateLive = async ({expectedBaseSha, expectedHeadSha}) => {
            const [repo, branch, pr] = await Promise.all([
              api(''), api('/branches/main'), api(`/pulls/${process.env.PR_NUMBER}`),
            ]);
            required(repo.full_name === repository && repo.default_branch === 'main', 'LIVE_REPOSITORY_MAIN_BINDING_INVALID');
            required(branch.name === 'main' && branch.commit?.sha === expectedBaseSha, 'LIVE_MAIN_BASE_SHA_DRIFT');
            required(pr.state === 'open' && pr.draft === false && pr.merged === false, 'LIVE_PULL_REQUEST_STATE_INVALID');
            required(pr.base?.ref === 'main' && pr.base?.repo?.full_name === repository, 'LIVE_PULL_REQUEST_BASE_INVALID');
            required(pr.base?.sha === expectedBaseSha, 'LIVE_BASE_SHA_DRIFT');
            required(pr.head?.sha === expectedHeadSha && pr.head?.repo?.full_name === repository, 'LIVE_HEAD_BINDING_DRIFT');
            required(pr.user?.login === repo.owner?.login, 'PROGRAM_OWNER_AUTHOR_REQUIRED');
            required(pr.changed_files === expectedCount, 'PACKET_CHANGED_FILE_COUNT_MISMATCH');
            return {repo, pr};
          };
          const expectedBaseSha = process.env.EXPECTED_BASE_SHA;
          required(/^[0-9a-f]{40}$/.test(expectedBaseSha || ''), 'INITIAL_BASE_SHA_INVALID');
          const {pr} = await validateLive({expectedBaseSha, expectedHeadSha:process.env.EXPECTED_HEAD_SHA});
          required(execFileSync('git', ['-C','candidate','rev-parse','HEAD^{tree}'], {encoding:'utf8'}).trim() === expectedTree, 'CANDIDATE_TREE_DRIFT');
          const files = [];
          for (let page = 1; page <= 10; page += 1) {
            const values = await api(`/pulls/${process.env.PR_NUMBER}/files?per_page=100&page=${page}`);
            required(Array.isArray(values), 'PACKET_FILES_SHAPE_INVALID');
            files.push(...values);
            if (values.length < 100) break;
            required(page < 10, 'PACKET_FILES_PAGINATION_BOUND_EXCEEDED');
          }
          required(files.length === expectedCount, 'PACKET_FILES_PAGINATION_INCOMPLETE');
          const canonicalPath = '.github/workflows/kidults-governed-landing-control-validation-v1.yml';
          const oldBootstrapPath = '.github/workflows/kidults-governed-landing-prt-bootstrap-v1.yml';
          required(files.filter(file => file.filename === canonicalPath && file.status === 'modified').length === 1, 'CANONICAL_SAME_PATH_HANDOFF_REQUIRED');
          required(!files.some(file => file.filename === oldBootstrapPath), 'LEGACY_BOOTSTRAP_PATH_FORBIDDEN');
          files.sort((left, right) => Buffer.compare(Buffer.from(left.filename, 'utf8'), Buffer.from(right.filename, 'utf8')));
          const entries = [];
          for (const file of files) {
            required(['added','modified'].includes(file.status), `PACKET_FILE_STATUS_FORBIDDEN:${file.filename}:${file.status}`);
            required(typeof file.filename === 'string' && !file.filename.startsWith('/') && !file.filename.split('/').includes('..'), 'PACKET_PATH_INVALID');
            const line = execFileSync('git', ['-C','candidate','ls-files','-s','--',file.filename], {encoding:'utf8'}).trim();
            const match = line.match(/^(100644|100755) ([0-9a-f]{40}) 0\t(.+)$/);
            required(Boolean(match), `PACKET_FILE_MODE_OR_CARDINALITY_INVALID:${file.filename}`);
            required(match[2] === file.sha && match[3] === file.filename, `PACKET_BLOB_BINDING_INVALID:${file.filename}`);
            entries.push(`${file.status}\0${file.filename}\0${match[1]}\0${match[2]}`);
          }
          const digest = `sha256:${crypto.createHash('sha256').update(`${entries.join('\n')}\n`).digest('hex')}`;
          required(digest === expectedDigest, `PACKET_DIGEST_MISMATCH:${digest}`);
          await validateLive({expectedBaseSha, expectedHeadSha:process.env.EXPECTED_HEAD_SHA});
          required(execFileSync('git', ['-C','candidate','rev-parse','HEAD^{tree}'], {encoding:'utf8'}).trim() === expectedTree, 'FINAL_CANDIDATE_TREE_DRIFT');
          console.log(JSON.stringify({state:'VERIFIED_PASS', exact_base_sha:expectedBaseSha, exact_head_sha:pr.head.sha, candidate_tree:expectedTree, changed_files:files.length, packet_sha256:digest}));
          NODE
