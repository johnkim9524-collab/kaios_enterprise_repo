name: KPMO Exact-Head CI Supersession v1

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: kpmo-exact-head-supersession-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel-stale-pr-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel stale queued and in-progress runs for this PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          cancelled=0
          examined=0

          for page in $(seq 1 10); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/runs?branch=${HEAD_BRANCH}&per_page=100&page=${page}")"

            count="$(jq '.workflow_runs | length' <<<"${response}")"
            examined=$((examined + count))

            while IFS=$'\t' read -r run_id head_sha status; do
              [[ -n "${run_id}" ]] || continue
              [[ "${run_id}" != "${CURRENT_RUN_ID}" ]] || continue
              [[ "${head_sha}" != "${EXACT_HEAD_SHA}" ]] || continue
              [[ "${status}" == "queued" || "${status}" == "in_progress" || "${status}" == "waiting" || "${status}" == "pending" ]] || continue

              code="$(curl --silent --show-error --output /tmp/cancel-response.json --write-out '%{http_code}' \
                --request POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/actions/runs/${run_id}/cancel")"

              if [[ "${code}" == "202" || "${code}" == "409" ]]; then
                cancelled=$((cancelled + 1))
              else
                cat /tmp/cancel-response.json
                echo "Unexpected cancellation status ${code} for run ${run_id}" >&2
                exit 1
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .head_sha, .status] | @tsv' <<<"${response}")

            [[ "${count}" -eq 100 ]] || break
          done

          jq -n \
            --arg state "VERIFIED_PASS" \
            --arg exact_head_sha "${EXACT_HEAD_SHA}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson examined "${examined}" \
            --argjson cancelled "${cancelled}" \
            '{id:"kpmo-exact-head-ci-supersession-v1",state:$state,pr_number:$pr_number,exact_head_sha:$exact_head_sha,runs_examined:$examined,stale_runs_cancelled:$cancelled,lookup_bound:{pages:10,per_page:100}}'
