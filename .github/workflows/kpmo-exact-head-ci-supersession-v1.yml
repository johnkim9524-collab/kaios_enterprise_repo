name: KPMO Exact-Head CI Supersession v1

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kpmo-exact-head-supersession-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale-pr-runs:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve exact-head impact checks and cancel stale runs
        id: supersession
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          receipt_dir="${RUNNER_TEMP}/kpmo-exact-head-supersession"
          receipt_path="${receipt_dir}/receipt.json"
          mkdir -p "${receipt_dir}"

          cancelled=0
          stale_cancelled=0
          exact_head_retained=0
          cancellation_retry_attempts=0
          terminal_race_readbacks=0
          terminal_readback_attempts=0
          terminal_readback_transients=0
          terminalization_timeouts=0
          second_phase_reconciliations=0
          final_authoritative_reads=0
          examined=0
          lookup_total=0
          outcome_state="VERIFIED_FAIL"
          failure_reason="UNINITIALIZED"

          emit_receipt() {
            jq -n \
              --arg state "${outcome_state}" \
              --arg failure_reason "${failure_reason}" \
              --arg exact_head_sha "${EXACT_HEAD_SHA}" \
              --arg event_name "${EVENT_NAME}" \
              --argjson pr_number "${PR_NUMBER}" \
              --argjson examined "${examined}" \
              --argjson lookup_total "${lookup_total}" \
              --argjson cancelled "${cancelled}" \
              --argjson stale_cancelled "${stale_cancelled}" \
              --argjson exact_head_retained "${exact_head_retained}" \
              --argjson cancellation_retry_attempts "${cancellation_retry_attempts}" \
              --argjson terminal_race_readbacks "${terminal_race_readbacks}" \
              --argjson terminal_readback_attempts "${terminal_readback_attempts}" \
              --argjson terminal_readback_transients "${terminal_readback_transients}" \
              --argjson terminalization_timeouts "${terminalization_timeouts}" \
              --argjson second_phase_reconciliations "${second_phase_reconciliations}" \
              --argjson final_authoritative_reads "${final_authoritative_reads}" \
              '{id:"kpmo-exact-head-ci-supersession-v1",version:"1.2.0",state:$state,failure_reason:(if $failure_reason=="NONE" then null else $failure_reason end),event:$event_name,pr_number:$pr_number,exact_head_sha:$exact_head_sha,runs_examined:$examined,lookup_total:$lookup_total,runs_cancelled:$cancelled,same_head_runs_cancelled:0,stale_runs_cancelled:$stale_cancelled,exact_head_impact_runs_retained:$exact_head_retained,cancellation_retry_attempts:$cancellation_retry_attempts,terminal_race_readbacks:$terminal_race_readbacks,terminal_readback_attempts:$terminal_readback_attempts,terminal_readback_transient_errors:$terminal_readback_transients,terminalization_timeouts:$terminalization_timeouts,second_phase_reconciliations:$second_phase_reconciliations,final_authoritative_reads:$final_authoritative_reads,terminal_proof_required_before_cancel_count:true,terminalization_policy:{phase_one_attempts:8,phase_one_sleep_seconds:2,phase_two_attempts:12,phase_two_sleep_seconds:5,final_authoritative_read:true},lookup_bound:{pages:10,per_page:100,max_results:1000},fork_pr_actions_write:false,production:"HOLD",public:"HOLD",g5:"HOLD"}' \
              > "${receipt_path}"
            test -s "${receipt_path}"
            jq empty "${receipt_path}"
          }

          fail_closed() {
            failure_reason="$1"
            outcome_state="VERIFIED_FAIL"
            emit_receipt
            cat "${receipt_path}" >&2
            echo "Supersession failed closed: ${failure_reason}" >&2
            exit 1
          }

          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            [[ "${BASE_BRANCH}" == "main" ]] || fail_closed "NON_MAIN_PR_TARGET"
            [[ "${HEAD_REPOSITORY}" == "${REPOSITORY}" ]] || fail_closed "FORK_ACTIONS_WRITE_REFUSED"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            [[ "${HEAD_BRANCH}" == "main" ]] || fail_closed "NON_MAIN_PUSH"
          else
            fail_closed "UNSUPPORTED_EVENT:${EVENT_NAME}"
          fi

          read_run_terminal() {
            local target_run_id="$1"
            local attempts=0
            local transients=0
            local latest_status="UNKNOWN"
            local latest_conclusion=""
            local response_file="/tmp/run-readback-${target_run_id}.json"

            read_once() {
              local code
              code="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/actions/runs/${target_run_id}")"
              attempts=$((attempts + 1))
              if [[ "${code}" == "200" ]]; then
                latest_status="$(jq -r '.status // "UNKNOWN"' "${response_file}")"
                latest_conclusion="$(jq -r '.conclusion // ""' "${response_file}")"
                return 0
              fi
              if [[ "${code}" == "429" || "${code}" =~ ^5[0-9][0-9]$ ]]; then
                transients=$((transients + 1))
                latest_status="TRANSIENT_HTTP_${code}"
                latest_conclusion=""
                return 0
              fi
              cat "${response_file}" >&2 || true
              return 65
            }

            for phase_one_attempt in $(seq 1 8); do
              read_once || return 65
              if [[ "${latest_status}" == "completed" ]]; then
                jq -cn --arg status "${latest_status}" --arg conclusion "${latest_conclusion}" --arg phase "PHASE_ONE" --argjson attempts "${attempts}" --argjson transients "${transients}" '{terminal:true,status:$status,conclusion:$conclusion,phase:$phase,attempts:$attempts,transients:$transients,final_authoritative_read:false}'
                return 0
              fi
              sleep 2
            done

            for reconciliation_attempt in $(seq 1 12); do
              read_once || return 65
              if [[ "${latest_status}" == "completed" ]]; then
                jq -cn --arg status "${latest_status}" --arg conclusion "${latest_conclusion}" --arg phase "PHASE_TWO_RECONCILIATION" --argjson attempts "${attempts}" --argjson transients "${transients}" '{terminal:true,status:$status,conclusion:$conclusion,phase:$phase,attempts:$attempts,transients:$transients,final_authoritative_read:false}'
                return 0
              fi
              sleep 5
            done

            # Mandatory final authoritative read after both bounded polling phases.
            read_once || return 65
            if [[ "${latest_status}" == "completed" ]]; then
              jq -cn --arg status "${latest_status}" --arg conclusion "${latest_conclusion}" --argjson attempts "${attempts}" --argjson transients "${transients}" '{terminal:true,status:$status,conclusion:$conclusion,phase:"FINAL_AUTHORITATIVE_READ",attempts:$attempts,transients:$transients,final_authoritative_read:true}'
            else
              jq -cn --arg status "${latest_status}" --arg conclusion "${latest_conclusion}" --argjson attempts "${attempts}" --argjson transients "${transients}" '{terminal:false,status:$status,conclusion:$conclusion,phase:"FINAL_AUTHORITATIVE_READ",attempts:$attempts,transients:$transients,final_authoritative_read:true}'
            fi
          }

          for page in $(seq 1 10); do
            response="$(curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "branch=${HEAD_BRANCH}" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=${page}" \
              "${api}/actions/runs")" || fail_closed "RUN_LOOKUP_FAILED:page=${page}"

            count="$(jq '.workflow_runs | length' <<<"${response}")"
            total="$(jq -r '.total_count // -1' <<<"${response}")"
            [[ "${total}" =~ ^[0-9]+$ ]] || fail_closed "RUN_LOOKUP_TOTAL_INVALID"
            if [[ "${page}" -eq 1 ]]; then
              lookup_total="${total}"
              (( lookup_total <= 1000 )) || fail_closed "RUN_LOOKUP_LIMIT_EXCEEDED:${lookup_total}"
            elif [[ "${total}" -ne "${lookup_total}" ]]; then
              fail_closed "RUN_LOOKUP_CARDINALITY_MOVED:${lookup_total}->${total}"
            fi
            examined=$((examined + count))

            while IFS=$'\t' read -r run_id head_sha status workflow_name; do
              [[ -n "${run_id}" ]] || continue
              [[ "${run_id}" != "${CURRENT_RUN_ID}" ]] || continue
              [[ "${status}" == "queued" || "${status}" == "in_progress" || "${status}" == "waiting" || "${status}" == "pending" ]] || continue

              if [[ "${head_sha}" == "${EXACT_HEAD_SHA}" ]]; then
                exact_head_retained=$((exact_head_retained + 1))
                continue
              fi

              code=""
              for attempt in 1 2 3; do
                code="$(curl --silent --show-error --output /tmp/cancel-response.json --write-out '%{http_code}' \
                  --request POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${api}/actions/runs/${run_id}/cancel")"
                if [[ "${code}" == "202" || "${code}" == "409" ]]; then break; fi
                if [[ "${code}" == "429" || "${code}" =~ ^5[0-9][0-9]$ ]]; then
                  cancellation_retry_attempts=$((cancellation_retry_attempts + 1))
                  sleep $((attempt * 2))
                  continue
                fi
                break
              done

              if [[ ! "${code}" == "202" && ! "${code}" == "409" && ! "${code}" == "429" && ! "${code}" =~ ^5[0-9][0-9]$ ]]; then
                cat /tmp/cancel-response.json >&2 || true
                fail_closed "UNEXPECTED_CANCELLATION_STATUS:${run_id}:${code}"
              fi

              readback_result="$(read_run_terminal "${run_id}")" || fail_closed "RUN_READBACK_FAILED:${run_id}"
              latest_status="$(jq -r '.status' <<<"${readback_result}")"
              latest_conclusion="$(jq -r '.conclusion' <<<"${readback_result}")"
              readback_attempts="$(jq -r '.attempts' <<<"${readback_result}")"
              readback_transients="$(jq -r '.transients' <<<"${readback_result}")"
              readback_phase="$(jq -r '.phase' <<<"${readback_result}")"
              final_read="$(jq -r '.final_authoritative_read' <<<"${readback_result}")"
              terminal="$(jq -r '.terminal' <<<"${readback_result}")"
              terminal_readback_attempts=$((terminal_readback_attempts + readback_attempts))
              terminal_readback_transients=$((terminal_readback_transients + readback_transients))
              if [[ "${readback_phase}" == "PHASE_TWO_RECONCILIATION" || "${readback_phase}" == "FINAL_AUTHORITATIVE_READ" ]]; then
                second_phase_reconciliations=$((second_phase_reconciliations + 1))
              fi
              if [[ "${final_read}" == "true" ]]; then
                final_authoritative_reads=$((final_authoritative_reads + 1))
              fi

              if [[ "${terminal}" == "true" && "${latest_status}" == "completed" ]]; then
                if [[ "${latest_conclusion}" == "cancelled" ]]; then
                  cancelled=$((cancelled + 1))
                  stale_cancelled=$((stale_cancelled + 1))
                else
                  terminal_race_readbacks=$((terminal_race_readbacks + 1))
                fi
                continue
              fi

              terminalization_timeouts=$((terminalization_timeouts + 1))
              fail_closed "CANCELLATION_NOT_TERMINAL:${run_id}:status=${latest_status}:conclusion=${latest_conclusion}:code=${code}"
            done < <(jq -r '.workflow_runs[] | [.id, .head_sha, .status, .name] | @tsv' <<<"${response}")

            if [[ "${count}" -lt 100 ]]; then break; fi
            if [[ "${page}" -eq 10 ]]; then fail_closed "RUN_LOOKUP_PAGINATION_LIMIT:${examined}/${lookup_total}"; fi
          done

          (( examined == lookup_total )) || fail_closed "RUN_LOOKUP_CARDINALITY_MISMATCH:${examined}/${lookup_total}"
          outcome_state="VERIFIED_PASS"
          failure_reason="NONE"
          emit_receipt
          cat "${receipt_path}"

      - name: Upload exact supersession receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kpmo-exact-head-ci-supersession-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kpmo-exact-head-supersession/receipt.json
          if-no-files-found: error
          retention-days: 30
