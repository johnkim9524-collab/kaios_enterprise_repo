name: KPMO Exact-Head CI Supersession v1

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: kpmo-exact-head-supersession-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale-pr-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bound exact-head fan-out and cancel stale runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          cancelled=0
          same_head_cancelled=0
          stale_cancelled=0
          unique_same_head_retained=0
          examined=0
          declare -A exact_head_workflow_seen=()

          for page in $(seq 1 10); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/runs?branch=${HEAD_BRANCH}&per_page=100&page=${page}")"

            count="$(jq '.workflow_runs | length' <<<"${response}")"
            examined=$((examined + count))

            while IFS=$'\t' read -r run_id head_sha status workflow_name; do
              [[ -n "${run_id}" ]] || continue
              [[ "${run_id}" != "${CURRENT_RUN_ID}" ]] || continue
              [[ "${status}" == "queued" || "${status}" == "in_progress" || "${status}" == "waiting" || "${status}" == "pending" ]] || continue

              if [[ "${head_sha}" == "${EXACT_HEAD_SHA}" ]]; then
                if [[ -z "${exact_head_workflow_seen[${workflow_name}]+x}" ]]; then
                  exact_head_workflow_seen["${workflow_name}"]="${run_id}"
                  unique_same_head_retained=$((unique_same_head_retained + 1))
                  continue
                fi
              fi

              code="$(curl --silent --show-error --output /tmp/cancel-response.json --write-out '%{http_code}' \
                --request POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/actions/runs/${run_id}/cancel")"

              if [[ "${code}" == "202" || "${code}" == "409" ]]; then
                cancelled=$((cancelled + 1))
                if [[ "${head_sha}" == "${EXACT_HEAD_SHA}" ]]; then
                  same_head_cancelled=$((same_head_cancelled + 1))
                else
                  stale_cancelled=$((stale_cancelled + 1))
                fi
              else
                cat /tmp/cancel-response.json
                echo "Unexpected cancellation status ${code} for run ${run_id}" >&2
                exit 1
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .head_sha, .status, .name] | @tsv' <<<"${response}")

            [[ "${count}" -eq 100 ]] || break
          done

          jq -n \
            --arg state "VERIFIED_PASS" \
            --arg exact_head_sha "${EXACT_HEAD_SHA}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson examined "${examined}" \
            --argjson cancelled "${cancelled}" \
            --argjson same_head_cancelled "${same_head_cancelled}" \
            --argjson stale_cancelled "${stale_cancelled}" \
            --argjson unique_same_head_retained "${unique_same_head_retained}" \
            '{id:"kpmo-exact-head-ci-supersession-v1",state:$state,pr_number:$pr_number,exact_head_sha:$exact_head_sha,runs_examined:$examined,runs_cancelled:$cancelled,same_head_duplicate_runs_cancelled:$same_head_cancelled,stale_runs_cancelled:$stale_cancelled,unique_same_head_workflows_retained:$unique_same_head_retained,same_head_policy:"RETAIN_ONE_ACTIVE_RUN_PER_WORKFLOW",lookup_bound:{pages:10,per_page:100}}'
