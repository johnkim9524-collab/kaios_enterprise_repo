name: KPMO Exact-Head CI Supersession v1

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kpmo-exact-head-supersession-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale-pr-runs:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve exact-head impact checks and cancel stale runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"

          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            [[ "${BASE_BRANCH}" == "main" ]] || { echo "Refusing non-main PR target" >&2; exit 1; }
            [[ "${HEAD_REPOSITORY}" == "${REPOSITORY}" ]] || { echo "Refusing Actions write for fork PR" >&2; exit 1; }
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            [[ "${HEAD_BRANCH}" == "main" ]] || { echo "Refusing non-main push" >&2; exit 1; }
          else
            echo "Unsupported event ${EVENT_NAME}" >&2
            exit 1
          fi

          cancelled=0
          stale_cancelled=0
          exact_head_retained=0
          cancellation_retry_attempts=0
          terminal_race_readbacks=0
          terminal_readback_attempts=0
          examined=0

          read_run_terminal() {
            local target_run_id="$1"
            local readback_code=""
            local latest_status=""
            local latest_conclusion=""
            local attempts=0
            for readback_attempt in $(seq 1 42); do
              attempts="${readback_attempt}"
              readback_code="$(curl --silent --show-error --output /tmp/run-readback.json --write-out '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/actions/runs/${target_run_id}")"
              if [[ "${readback_code}" == "200" ]]; then
                latest_status="$(jq -r '.status' /tmp/run-readback.json)"
                latest_conclusion="$(jq -r '.conclusion // ""' /tmp/run-readback.json)"
                if [[ "${latest_status}" == "completed" ]]; then
                  jq -cn --arg status "${latest_status}" --arg conclusion "${latest_conclusion}" --argjson attempts "${attempts}" '{status:$status,conclusion:$conclusion,attempts:$attempts}'
                  return 0
                fi
              elif [[ "${readback_code}" == "429" || "${readback_code}" =~ ^5[0-9][0-9]$ ]]; then
                :
              else
                cat /tmp/run-readback.json
                echo "Unexpected run read-back status ${readback_code} for run ${target_run_id}" >&2
                return 1
              fi
              sleep 5
            done
            jq -cn --arg status "${latest_status:-UNKNOWN}" --arg conclusion "${latest_conclusion:-}" --argjson attempts "${attempts}" '{status:$status,conclusion:$conclusion,attempts:$attempts}'
          }

          for page in $(seq 1 10); do
            response="$(curl --fail-with-body --silent --show-error --get \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "branch=${HEAD_BRANCH}" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=${page}" \
              "${api}/actions/runs")"

            count="$(jq '.workflow_runs | length' <<<"${response}")"
            examined=$((examined + count))

            while IFS=$'\t' read -r run_id head_sha status workflow_name; do
              [[ -n "${run_id}" ]] || continue
              [[ "${run_id}" != "${CURRENT_RUN_ID}" ]] || continue
              [[ "${status}" == "queued" || "${status}" == "in_progress" || "${status}" == "waiting" || "${status}" == "pending" ]] || continue

              if [[ "${head_sha}" == "${EXACT_HEAD_SHA}" ]]; then
                exact_head_retained=$((exact_head_retained + 1))
                continue
              fi

              code=""
              for attempt in 1 2 3; do
                code="$(curl --silent --show-error --output /tmp/cancel-response.json --write-out '%{http_code}' \
                  --request POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${api}/actions/runs/${run_id}/cancel")"

                if [[ "${code}" == "202" || "${code}" == "409" ]]; then
                  break
                fi
                if [[ "${code}" == "429" || "${code}" =~ ^5[0-9][0-9]$ ]]; then
                  cancellation_retry_attempts=$((cancellation_retry_attempts + 1))
                  sleep $((attempt * 2))
                  continue
                fi
                break
              done

              if [[ "${code}" == "202" || "${code}" == "409" || "${code}" == "429" || "${code}" =~ ^5[0-9][0-9]$ ]]; then
                readback_result="$(read_run_terminal "${run_id}")"
                latest_status="$(jq -r '.status' <<<"${readback_result}")"
                latest_conclusion="$(jq -r '.conclusion' <<<"${readback_result}")"
                readback_attempts="$(jq -r '.attempts' <<<"${readback_result}")"
                terminal_readback_attempts=$((terminal_readback_attempts + readback_attempts))
                if [[ "${latest_status}" == "completed" ]]; then
                  if [[ "${latest_conclusion}" == "cancelled" ]]; then
                    cancelled=$((cancelled + 1))
                    stale_cancelled=$((stale_cancelled + 1))
                  else
                    terminal_race_readbacks=$((terminal_race_readbacks + 1))
                  fi
                  continue
                fi

                cat /tmp/cancel-response.json
                echo "Normal cancellation not terminally confirmed within bounded passive read-back for run ${run_id} status=${latest_status} conclusion=${latest_conclusion} code=${code}" >&2
                exit 1
              else
                cat /tmp/cancel-response.json
                echo "Unexpected cancellation status ${code} for run ${run_id}" >&2
                exit 1
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .head_sha, .status, .name] | @tsv' <<<"${response}")

            [[ "${count}" -eq 100 ]] || break
          done

          jq -n \
            --arg state "VERIFIED_PASS" \
            --arg exact_head_sha "${EXACT_HEAD_SHA}" \
            --arg cancellation_authority "NORMAL_CANCEL_ONLY" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson examined "${examined}" \
            --argjson cancelled "${cancelled}" \
            --argjson stale_cancelled "${stale_cancelled}" \
            --argjson exact_head_retained "${exact_head_retained}" \
            --argjson cancellation_retry_attempts "${cancellation_retry_attempts}" \
            --argjson terminal_race_readbacks "${terminal_race_readbacks}" \
            --argjson terminal_readback_attempts "${terminal_readback_attempts}" \
            '{id:"kpmo-exact-head-ci-supersession-v1",state:$state,pr_number:$pr_number,exact_head_sha:$exact_head_sha,runs_examined:$examined,runs_cancelled:$cancelled,same_head_runs_cancelled:0,stale_runs_cancelled:$stale_cancelled,force_cancelled:$force_cancelled,exact_head_impact_runs_retained:$exact_head_retained,cancellation_retry_attempts:$cancellation_retry_attempts,force_cancel_attempts:$force_cancel_attempts,terminal_race_readbacks:$terminal_race_readbacks,terminal_readback_attempts:$terminal_readback_attempts,lookup_bound:{pages:10,per_page:100},fork_pr_actions_write:false}'
