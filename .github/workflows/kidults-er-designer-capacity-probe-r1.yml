name: KIDULTS ER Designer Capacity Probe R1

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/probe-designer-maker-capacity-r1.mjs'
      - '.github/workflows/kidults-er-designer-capacity-probe-r1.yml'
      - 'coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe exact 120-case Designer/Maker source capacity
        env:
          KAIOS_REQUIRE_DESIGNER_120_READY: '1'
        run: node scripts/kidults/entity-resolution/probe-designer-maker-capacity-r1.mjs coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json /tmp/designer-capacity.json
      - name: Upload bounded capacity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-er-designer-capacity-r1
          path: /tmp/designer-capacity.json
          retention-days: 14
          if-no-files-found: warn
