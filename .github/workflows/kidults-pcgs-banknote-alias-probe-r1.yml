name: KIDULTS PCGS Banknote Alias Probe R1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-banknote-alias-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KAIOS_PCGS_ACCOUNT_AUTHORIZED: ${{ vars.KAIOS_PCGS_ACCOUNT_AUTHORIZED }}
      KAIOS_PCGS_EULA_COMPATIBLE: ${{ vars.KAIOS_PCGS_EULA_COMPATIBLE }}
      KAIOS_PCGS_API_TOKEN: ${{ secrets.KAIOS_PCGS_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact dispatch source SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run bounded PCGS banknote authoritative alias probe
        run: node scripts/kidults/source-intelligence/probe-pcgs-banknote-alias-r1.mjs
