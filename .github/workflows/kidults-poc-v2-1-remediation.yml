name: KIDULTS PoC v2.1 Remediation Gate

on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/poc-v2-1-remediation-execution-contract-v1.json'
      - 'scripts/kidults/poc/validate-poc-v2-1-remediation.mjs'
      - '.github/workflows/kidults-poc-v2-1-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate PoC v2.1 remediation contract
        run: node scripts/kidults/poc/validate-poc-v2-1-remediation.mjs
