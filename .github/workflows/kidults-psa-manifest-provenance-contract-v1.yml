name: KIDULTS PSA Manifest Provenance Contract v1

on:
  pull_request:
    paths:
      - 'coordination/kidults/provider/psa-120-known-cert-manifest-v1.json'
      - 'scripts/kidults/provider/build-psa-lawful-manifest-entry-v1.mjs'
      - 'scripts/kidults/provider/validate-psa-manifest-provenance-contract-v1.mjs'
      - '.github/workflows/kidults-psa-manifest-provenance-contract-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/provider/psa-120-known-cert-manifest-v1.json'
      - 'scripts/kidults/provider/build-psa-lawful-manifest-entry-v1.mjs'
      - 'scripts/kidults/provider/validate-psa-manifest-provenance-contract-v1.mjs'
      - '.github/workflows/kidults-psa-manifest-provenance-contract-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: node scripts/kidults/provider/validate-psa-manifest-provenance-contract-v1.mjs
