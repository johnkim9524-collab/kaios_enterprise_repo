name: KPMO CF-KIDULTS-14501AC-01 Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*cloudflare*'
      - '.github/workflows/kpmo-cf-*'
      - 'coordination/kidults/runtime/cloudflare-*'
      - 'coordination/kidults/runtime/cf-*'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
      - 'docs/kidults/runtime/cloudflare-*'
      - 'scripts/ops/cloudflare-pages-*'
      - 'tests/kidults/kpmo/cloudflare-*'
      - 'tests/kidults/kpmo/cf-*'
      - '.github/workflows/kpmo-cf-kidults-14501ac-01-preflight.yml'
      - '.github/workflows/kpmo-cloudflare-preview-retire-and-governed-staging-v1.yml'
      - '.github/workflows/kpmo-cloudflare-approval-consume-v1.yml'
      - 'coordination/kidults/runtime/cf-kidults-14501ac-01-ledger-binding-v1.json'
      - 'coordination/kidults/runtime/cloudflare-external-one-shot-approval-future-activation-v1.json'
      - 'coordination/kidults/governance/external-one-shot-approval-ledger-v1.json'
      - 'coordination/kidults/redteam/cloudflare-worker-estate-policy-v1.json'
      - 'scripts/kidults/redteam/validate-cloudflare-worker-estate-policy-v1.mjs'
      - 'services/kidults-autonomous-intelligence/package.json'
      - 'services/kidults-autonomous-intelligence/scripts/cloudflare-global-no-rerun.mjs'
      - 'services/kidults-autonomous-intelligence/scripts/remote-d1-preflight.mjs'
      - 'services/kidults-autonomous-intelligence/scripts/a14-remote-capacity-canary.mjs'
      - 'services/kidults-autonomous-intelligence/scripts/a9-finalize.ps1'
      - 'scripts/governance/external-one-shot-approval-ledger-v1.mjs'
      - 'scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs'
      - 'scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs'
      - 'services/kidults-cloudflare-approval-trust-root/**'
      - 'services/kidults-autonomous-intelligence/scripts/**'
      - 'coordination/kidults/runtime/cf-kidults-14501ac-01-approval.json'
      - 'scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh'
      - 'tests/kidults/kpmo/cf-kidults-14501ac-01-approval.test.mjs'
      - 'tests/kidults/kpmo/external-one-shot-approval-ledger-v1.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-global-no-rerun-v1.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-pages-readonly-governed-lineage-v1.test.mjs'
      - 'scripts/ops/cloudflare-pages-governed-staging-deploy.sh'
      - 'scripts/ops/cloudflare-pages-preview-cleanup.sh'
      - 'scripts/ops/cloudflare-pages-auto-deployment-containment.sh'
      - 'scripts/ops/cloudflare-pages-boundary-readonly.sh'
      - '.github/workflows/kidults-cloudflare-pages-staging-governance-validation-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*cloudflare*'
      - '.github/workflows/kpmo-cf-*'
      - 'coordination/kidults/runtime/cloudflare-*'
      - 'coordination/kidults/runtime/cf-*'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
      - 'docs/kidults/runtime/cloudflare-*'
      - 'scripts/ops/cloudflare-pages-*'
      - 'tests/kidults/kpmo/cloudflare-*'
      - 'tests/kidults/kpmo/cf-*'
      - '.github/workflows/kpmo-cf-kidults-14501ac-01-preflight.yml'
      - '.github/workflows/kpmo-cloudflare-preview-retire-and-governed-staging-v1.yml'
      - '.github/workflows/kpmo-cloudflare-approval-consume-v1.yml'
      - 'coordination/kidults/runtime/cf-kidults-14501ac-01-ledger-binding-v1.json'
      - 'coordination/kidults/runtime/cloudflare-external-one-shot-approval-future-activation-v1.json'
      - 'coordination/kidults/governance/external-one-shot-approval-ledger-v1.json'
      - 'scripts/governance/external-one-shot-approval-ledger-v1.mjs'
      - 'scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs'
      - 'scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs'
      - 'services/kidults-cloudflare-approval-trust-root/**'
      - 'coordination/kidults/runtime/cf-kidults-14501ac-01-approval.json'
      - 'scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh'
      - 'tests/kidults/kpmo/cf-kidults-14501ac-01-approval.test.mjs'
      - 'tests/kidults/kpmo/external-one-shot-approval-ledger-v1.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-global-no-rerun-v1.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-pages-readonly-governed-lineage-v1.test.mjs'
      - 'scripts/ops/cloudflare-pages-governed-staging-deploy.sh'
      - 'scripts/ops/cloudflare-pages-preview-cleanup.sh'
      - 'scripts/ops/cloudflare-pages-auto-deployment-containment.sh'
      - 'scripts/ops/cloudflare-pages-boundary-readonly.sh'
      - '.github/workflows/kidults-cloudflare-pages-staging-governance-validation-v1.yml'

permissions:
  contents: read

concurrency:
  group: kpmo-cf-kidults-14501ac-01-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: KIDULTS Cloudflare One-Shot Trust Boundary V1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate exact approval, bounded script and workflow binding
        run: |
          set -euo pipefail
          node tests/kidults/kpmo/cf-kidults-14501ac-01-approval.test.mjs
          node --test tests/kidults/kpmo/external-one-shot-approval-ledger-v1.test.mjs
          node --test services/kidults-cloudflare-approval-trust-root/test/approval-ledger.test.mjs
          node --test tests/kidults/kpmo/cloudflare-global-no-rerun-v1.test.mjs
          node scripts/kidults/redteam/validate-cloudflare-worker-estate-policy-v1.mjs
          node tests/kidults/kpmo/cloudflare-pages-readonly-governed-lineage-v1.test.mjs
          bash -n scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh
