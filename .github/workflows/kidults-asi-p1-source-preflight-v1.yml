name: KIDULTS ASI P1 Source Preflight v1

on:
  workflow_dispatch:
  schedule:
    - cron: '52 * * * *'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-p1-source-classification-admission-preflight-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p1-source-preflight-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-registry-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-p1-source-preflight-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-registry-v1.mjs'
      - 'services/kidults-autonomous-intelligence/src/asi/event.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/registry.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/alignment.ts'
      - 'services/kidults-autonomous-intelligence/scripts/asi-p1-source-preflight-runtime-test.mjs'
      - 'docs/kidults/asi/asi-p1-source-preflight-v1.md'
      - '.github/workflows/kidults-asi-p1-source-preflight-v1.yml'
      - 'coordination/kidults/source-intelligence/asi-owned-source-intelligence-graph-*.json'
      - 'scripts/kidults/source-intelligence/*asi-owned-source-intelligence-graph*.mjs'
      - 'docs/kidults/asi/asi-owned-source-intelligence-graph-v2.md'
      - '.github/workflows/kidults-asi-owned-source-intelligence-graph-v2.yml'
      - 'scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-p1-source-classification-admission-preflight-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p1-source-preflight-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-registry-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-p1-source-preflight-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-registry-v1.mjs'
      - 'services/kidults-autonomous-intelligence/src/asi/event.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/registry.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/alignment.ts'
      - 'services/kidults-autonomous-intelligence/scripts/asi-p1-source-preflight-runtime-test.mjs'
      - 'docs/kidults/asi/asi-p1-source-preflight-v1.md'
      - '.github/workflows/kidults-asi-p1-source-preflight-v1.yml'
      - 'coordination/kidults/source-intelligence/asi-owned-source-intelligence-graph-*.json'
      - 'scripts/kidults/source-intelligence/*asi-owned-source-intelligence-graph*.mjs'
      - 'docs/kidults/asi/asi-owned-source-intelligence-graph-v2.md'
      - '.github/workflows/kidults-asi-owned-source-intelligence-graph-v2.yml'
      - 'scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs'
  workflow_run:
    workflows:
      - 'KIDULTS ASI P0B Bounded Discovery Candidates v1'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  # A skipped/ineligible workflow_run must never cancel a valid push producer.
  # Successful P0B completions are isolated by upstream run id.
  group: kidults-asi-p1-source-preflight-v1-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json
      - name: Verify exact source, syntax and contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for file in \
            scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-intelligence-preparation-wave-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-intelligence-preparation-wave-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-p0-mission-consumption-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs \
            scripts/kidults/source-intelligence/asi-openalex-gdelt-public-metadata-discovery-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-openalex-gdelt-public-metadata-discovery-v1.mjs \
            scripts/kidults/source-intelligence/merge-asi-public-metadata-rotations-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-public-metadata-source-fabric-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-p0b-bounded-discovery-candidates-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-p1-source-preflight-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-registry-v1.mjs \
            services/kidults-autonomous-intelligence/scripts/asi-p1-source-preflight-runtime-test.mjs; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-p1-source-classification-admission-preflight-contract-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-p1-source-preflight-registry-v1.json','utf8'))"
      - name: Validate P1 registry and autonomous activation
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-registry-v1.mjs \
            | tee /tmp/kidults-asi-p1-registry-validation-v1.json
      - name: Restore exact triggering P0B artifact for workflow-run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          P0B_EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          P0B_EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$P0B_EVENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$P0B_EVENT_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$P0B_EVENT_RUN_ID" != "$GITHUB_RUN_ID"
          gh api -H 'Accept: application/vnd.github+json'             "/repos/${GITHUB_REPOSITORY}/actions/runs/${P0B_EVENT_RUN_ID}"             > /tmp/p0b-trigger-run.json
          jq -e             --argjson run "$P0B_EVENT_RUN_ID"             --arg sha "$P0B_EVENT_SOURCE_SHA"             --arg repo "$GITHUB_REPOSITORY"             '.id==$run
             and .name=="KIDULTS ASI P0B Bounded Discovery Candidates v1"
             and .path==".github/workflows/kidults-asi-p0b-bounded-discovery-candidates-v1.yml"
             and .repository.full_name==$repo
             and .head_branch=="main"
             and .head_sha==$sha
             and .status=="completed"
             and .conclusion=="success"'             /tmp/p0b-trigger-run.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json'             "/repos/${GITHUB_REPOSITORY}/actions/runs/${P0B_EVENT_RUN_ID}/artifacts?per_page=100"             > /tmp/p0b-artifacts.json
          P0B_ARTIFACT_ID=$(jq -r --argjson run "$P0B_EVENT_RUN_ID" --arg sha "$P0B_EVENT_SOURCE_SHA"             '[.artifacts[] | select(.name=="kidults-asi-p0b-bounded-discovery-candidates-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | if length==1 then .[0].id else empty end'             /tmp/p0b-artifacts.json)
          [[ "$P0B_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/vnd.github+json'             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0B_ARTIFACT_ID}/zip"             > /tmp/p0b.zip
          rm -rf /tmp/p0b-expanded /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1
          mkdir -p /tmp/p0b-expanded /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1
          unzip -q -o /tmp/p0b.zip -d /tmp/p0b-expanded
          for NAME in             p0b-source-candidate-registry-v1.json             p0b-mission-candidate-binding-ledger-v1.json             p0b-candidate-gap-register-v1.json             p0b-provider-host-diversity-v1.json             p0b-bounded-discovery-manifest-v1.json; do
            mapfile -t FILES < <(find /tmp/p0b-expanded -type f -name "$NAME" -print)
            test "${#FILES[@]}" -eq 1
            cp "${FILES[0]}" "/tmp/kidults-asi-p0b-bounded-discovery-candidates-v1/$NAME"
          done
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs             /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1             coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json             > /tmp/kidults-asi-p0b-candidate-validation-v1.json
          echo "P0B_INPUT_MODE=EXACT_TRIGGERING_WORKFLOW_RUN" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_RUN_ID=$P0B_EVENT_RUN_ID" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_SOURCE_SHA=$P0B_EVENT_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Restore exact successful main P0B for pull-request validation
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA=$(git rev-parse HEAD)
          gh api --method GET -H 'Accept: application/vnd.github+json' \
            -f branch=main -f status=success -f per_page=100 \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-p0b-bounded-discovery-candidates-v1.yml/runs" \
            > /tmp/p0b-runs.json
          mapfile -t P0B_CANDIDATES < <(jq -r \
            '.workflow_runs[] | select(.name=="KIDULTS ASI P0B Bounded Discovery Candidates v1" and .path==".github/workflows/kidults-asi-p0b-bounded-discovery-candidates-v1.yml" and .head_branch=="main" and .status=="completed" and .conclusion=="success") | [.id,.head_sha] | @tsv' \
            /tmp/p0b-runs.json)
          P0B_ORIGIN_RUN_ID=''
          P0B_ORIGIN_SOURCE_SHA=''
          for candidate in "${P0B_CANDIDATES[@]}"; do
            IFS=$'\t' read -r candidate_run candidate_sha <<<"$candidate"
            if git merge-base --is-ancestor "$candidate_sha" "$CURRENT_SHA"; then
              P0B_ORIGIN_RUN_ID="$candidate_run"
              P0B_ORIGIN_SOURCE_SHA="$candidate_sha"
              break
            fi
          done
          [[ "$P0B_ORIGIN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$P0B_ORIGIN_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${P0B_ORIGIN_RUN_ID}/artifacts?per_page=100" \
            > /tmp/p0b-artifacts.json
          P0B_ARTIFACT_ID=$(jq -r --argjson run "$P0B_ORIGIN_RUN_ID" --arg sha "$P0B_ORIGIN_SOURCE_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-p0b-bounded-discovery-candidates-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | if length==1 then .[0].id else empty end' \
            /tmp/p0b-artifacts.json)
          [[ "$P0B_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0B_ARTIFACT_ID}/zip" \
            > /tmp/p0b.zip
          mkdir -p /tmp/p0b-expanded /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1
          unzip -q -o /tmp/p0b.zip -d /tmp/p0b-expanded
          for NAME in \
            p0b-source-candidate-registry-v1.json \
            p0b-mission-candidate-binding-ledger-v1.json \
            p0b-candidate-gap-register-v1.json \
            p0b-provider-host-diversity-v1.json \
            p0b-bounded-discovery-manifest-v1.json; do
            mapfile -t FILES < <(find /tmp/p0b-expanded -type f -name "$NAME" -print)
            test "${#FILES[@]}" -eq 1
            cp "${FILES[0]}" "/tmp/kidults-asi-p0b-bounded-discovery-candidates-v1/$NAME"
          done
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 \
            coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json \
            > /tmp/kidults-asi-p0b-candidate-validation-v1.json
          echo "P0B_INPUT_MODE=ANCESTOR_MAIN_CONTROL_FOR_PULL_REQUEST" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_RUN_ID=$P0B_ORIGIN_RUN_ID" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_SOURCE_SHA=$P0B_ORIGIN_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Rebuild current P0B source candidates
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs \
            coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json \
            coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json \
            /tmp/kidults-global-source-mesh-v1.json
          node scripts/kidults/source-intelligence/build-asi-intelligence-preparation-wave-v1.mjs \
            /tmp/kidults-global-source-mesh-v1.json \
            coordination/kidults/kpmo/verified-intelligence-surface-baseline-v1.json \
            coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json \
            /tmp/kidults-asi-intelligence-preparation-wave-v1
          node scripts/kidults/source-intelligence/validate-asi-intelligence-preparation-wave-v1.mjs \
            /tmp/kidults-asi-intelligence-preparation-wave-v1 \
            coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json \
            > /tmp/kidults-asi-intelligence-preparation-wave-validation-v1.json
          node scripts/kidults/source-intelligence/build-asi-p0-mission-consumption-v1.mjs \
            /tmp/kidults-asi-intelligence-preparation-wave-v1/autonomous-mission-queue-v1.json \
            coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json \
            services/kidults-autonomous-intelligence/src/asi/registry.ts \
            /tmp/kidults-asi-p0-mission-consumption-v1
          node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs \
            /tmp/kidults-asi-p0-mission-consumption-v1 \
            coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json \
            > /tmp/kidults-asi-p0-mission-consumption-validation-v1.json
          mkdir -p /tmp/p1-rotations
          for R in 0 1 2 3; do
            ASI_SCOPE_ROTATION="$R" ASI_PROVIDER_CIRCUIT=/tmp/p1-no-prior-circuit.json \
              node scripts/kidults/source-intelligence/asi-openalex-gdelt-public-metadata-discovery-v1.mjs "/tmp/p1-rotations/r${R}.json"
            node scripts/kidults/source-intelligence/validate-asi-openalex-gdelt-public-metadata-discovery-v1.mjs "/tmp/p1-rotations/r${R}.json"
          done
          node scripts/kidults/source-intelligence/merge-asi-public-metadata-rotations-v1.mjs \
            /tmp/p1-rotations/r0.json /tmp/p1-rotations/r1.json /tmp/p1-rotations/r2.json /tmp/p1-rotations/r3.json \
            /tmp/asi-public-metadata-source-fabric-v1.json
          node scripts/kidults/source-intelligence/validate-asi-public-metadata-source-fabric-v1.mjs \
            /tmp/asi-public-metadata-source-fabric-v1.json
          node scripts/kidults/source-intelligence/build-asi-p0b-bounded-discovery-candidates-v1.mjs \
            /tmp/kidults-asi-p0-mission-consumption-v1/p0-source-discovery-task-queue-v1.json \
            /tmp/asi-public-metadata-source-fabric-v1.json \
            coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1
          node scripts/kidults/source-intelligence/validate-asi-p0b-bounded-discovery-candidates-v1.mjs \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1 \
            coordination/kidults/source-intelligence/asi-p0b-bounded-discovery-candidate-contract-v1.json \
            > /tmp/kidults-asi-p0b-candidate-validation-v1.json
          echo "P0B_INPUT_MODE=REBUILT_LOCAL_CONTROL" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_RUN_ID=" >> "$GITHUB_ENV"
          echo "P0B_ORIGIN_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Enforce P0B producer identity and input-mode contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const mode=process.env.P0B_INPUT_MODE;
          const origin=process.env.P0B_ORIGIN_RUN_ID || null;
          const source=process.env.P0B_ORIGIN_SOURCE_SHA;
          if (process.env.GITHUB_EVENT_NAME==='workflow_run') {
            const expected=String(event.workflow_run?.id || '');
            if (mode!=='EXACT_TRIGGERING_WORKFLOW_RUN') throw new Error('P0B_INPUT_MODE_NOT_EXACT');
            if (!expected || origin!==expected) throw new Error('P0B_ORIGIN_NOT_TRIGGERING_RUN');
            if (origin===process.env.GITHUB_RUN_ID) throw new Error('P0B_SELF_ORIGIN_FORBIDDEN');
            if (source!==event.workflow_run?.head_sha) throw new Error('P0B_ORIGIN_SHA_MISMATCH');
          } else if (process.env.GITHUB_EVENT_NAME==='pull_request') {
            if (mode!=='ANCESTOR_MAIN_CONTROL_FOR_PULL_REQUEST') throw new Error('P0B_PR_INPUT_MODE_INVALID');
            if (!origin || origin===process.env.GITHUB_RUN_ID) throw new Error('P0B_PR_ORIGIN_INVALID');
          } else {
            if (mode!=='REBUILT_LOCAL_CONTROL') throw new Error('P0B_LOCAL_INPUT_MODE_INVALID');
            if (origin!==null) throw new Error('P0B_LOCAL_REBUILD_MUST_NOT_CLAIM_PRODUCER_RUN');
            if (source!==process.env.GITHUB_SHA) throw new Error('P0B_LOCAL_SOURCE_SHA_MISMATCH');
          }
          NODE
      - name: Build P1 classification qualification and Gate 1 outputs
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-asi-p1-source-preflight-v1.mjs \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1/p0b-source-candidate-registry-v1.json \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1/p0b-mission-candidate-binding-ledger-v1.json \
            /tmp/kidults-asi-p0b-bounded-discovery-candidates-v1/p0b-candidate-gap-register-v1.json \
            coordination/kidults/source-intelligence/asi-p1-source-classification-admission-preflight-contract-v1.json \
            services/kidults-autonomous-intelligence/src/asi/registry.ts \
            /tmp/kidults-asi-p1-source-preflight-v1
          node scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-v1.mjs \
            /tmp/kidults-asi-p1-source-preflight-v1 \
            coordination/kidults/source-intelligence/asi-p1-source-classification-admission-preflight-contract-v1.json \
            | tee /tmp/kidults-asi-p1-source-preflight-validation-v1.json
      - name: Install bounded runtime dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all P1 tasks through actual ASI runtime alignment preflight
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          node scripts/asi-p1-source-preflight-runtime-test.mjs \
            /tmp/kidults-asi-p1-source-preflight-v1/p1-source-preflight-task-queue-v1.json \
            /tmp/kidults-asi-p1-source-preflight-runtime-receipts-v1.json \
            | tee /tmp/kidults-asi-p1-source-preflight-runtime-validation-v1.json
      - name: Reject owner-hint-to-owner-fact mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p1-source-preflight-v1 /tmp/p1-bad-owner
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p1-bad-owner/p1-source-classification-ledger-v1.json';const x=JSON.parse(fs.readFileSync(p));const r=x.records.find(v=>v.assertion_type==='OWNER_LINEAGE');r.decision='PASS';r.state='OWNER_IDENTIFIED';r.observed_fact_ceiling='OWNER_FACT';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-v1.mjs /tmp/p1-bad-owner; then
            echo 'Validator accepted owner hint as owner fact' >&2
            exit 1
          fi
      - name: Reject rights-unknown-to-allow mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p1-source-preflight-v1 /tmp/p1-bad-rights
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p1-bad-rights/p1-source-qualification-ledger-v1.json';const x=JSON.parse(fs.readFileSync(p));const r=x.records.find(v=>v.assertion_type==='COLLECT');r.decision='PASS';r.state='ALLOW';r.rights_state='ALLOW';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-v1.mjs /tmp/p1-bad-rights; then
            echo 'Validator accepted unknown rights as ALLOW' >&2
            exit 1
          fi
      - name: Reject region-hint-to-coverage mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p1-source-preflight-v1 /tmp/p1-bad-region
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/p1-bad-region/p1-source-classification-ledger-v1.json';const x=JSON.parse(fs.readFileSync(p));const r=x.records.find(v=>v.assertion_type==='REGION_LANGUAGE');r.decision='PASS';r.state='REGIONAL_COVERAGE_PROVEN';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p1-source-preflight-v1.mjs /tmp/p1-bad-region; then
            echo 'Validator accepted region hint as coverage proof' >&2
            exit 1
          fi
      - name: Reject Gate 1 HOLD-to-PASS mutation
        run: |
          set -euo pipefail
