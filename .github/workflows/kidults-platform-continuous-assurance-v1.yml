name: KIDULTS Platform Continuous Assurance V1

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'coordination/kidults/**'
      - 'scripts/kidults/**'
      - 'services/kidults-autonomous-intelligence/**'
      - 'tooling/kidults-portal-r001-browser-qa/**'
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Snapshot Readiness Factory v2'
      - 'KIDULTS ASI Intelligence Preparation Wave v1'
      - 'KIDULTS Autonomous Met Open Access Sample'
      - 'KIDULTS Autonomous V&A Fashion Sample'
      - 'KIDULTS Full Value Chain Red-Team Orchestrator V1'
      - 'KIDULTS Unified Audit Control Plane'
      - 'KIDULTS Trusted Merge Control Monotonicity'
      - 'KIDULTS ASI Source Adapter Wave 2 v1'
      - 'KIDULTS ASI Source Adapter Wave 3 v1'
      - 'KIDULTS ASI Source Adapter Wave 4 v1'
      - 'KIDULTS ASI State Department Camera Evidence v1'
      - 'KIDULTS ASI Getty Historical Transaction Admission v1'
      - 'KIDULTS ASI P0 Mission Consumption v1'
      - 'KIDULTS ASI P0B Bounded Discovery Candidates v1'
      - 'KIDULTS ASI Autonomous Resolution Layer v1'
      - 'KIDULTS ASI Requirement-to-Adapter Coverage v1'
      - 'KIDULTS ASI Sharded Source Reserve v1'
      - 'KIDULTS ASI SHADOW Operating Evidence v1'
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      profile:
        description: Audit depth
        required: true
        default: deep
        type: choice
        options: [sentinel, deep]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KPMO_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      KPMO_SOURCE_KIND: ${{ github.event_name == 'pull_request' && 'PULL_REQUEST_MERGE_RESULT' || github.event_name == 'workflow_run' && 'PROTECTED_MAIN_WORKFLOW_RUN' || github.event_name == 'schedule' && 'PROTECTED_MAIN_SCHEDULE' || github.event_name == 'workflow_dispatch' && 'PROTECTED_MAIN_MANUAL' || 'PROTECTED_MAIN_PUSH' }}
      KPMO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      KPMO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      KPMO_PR_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      KPMO_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      KPMO_UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
      KPMO_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
      KPMO_UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name || '' }}
      KPMO_UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
      KPMO_AUDIT_PROFILE: ${{ github.event_name == 'schedule' && 'sentinel' || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && 'sentinel' || inputs.profile || 'deep' }}
      KPMO_PACKET_SUFFIX: kidults-continuous-assurance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize fail-closed assurance packet
        shell: bash
        run: |
          set -euo pipefail
          export KPMO_PACKET_DIR="$RUNNER_TEMP/$KPMO_PACKET_SUFFIX"
          mkdir -p "$KPMO_PACKET_DIR"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          function stable(value) {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') {
              return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            }
            return JSON.stringify(value);
          }
          const digest = (value) => `sha256:${crypto.createHash('sha256').update(value).digest('hex')}`;
          const base = {
            schema_version: '1.0.0',
            receipt_type: 'KIDULTS_PLATFORM_CONTINUOUS_ASSURANCE',
            source: {
              expected_sha: process.env.KPMO_SOURCE_SHA || 'UNAVAILABLE',
              actual_sha: 'UNAVAILABLE',
              kind: process.env.KPMO_SOURCE_KIND || 'UNKNOWN'
            },
            states: {
              internal_control_state: 'VERIFIED_FAIL',
              external_empirical_state: 'HOLD',
              release_state: 'HOLD',
              overall_state: 'RED',
              promotion_eligible: false
            },
            checks: [{ id: 'AUDIT_BOOTSTRAP', required: true, state: 'VERIFIED_FAIL' }],
            unresolved_gates: [],
            evidence: [],
            fatal_error_code: 'BOOTSTRAP_NOT_COMPLETED',
            empirical_truth_effect: {
              graded_delta: 0,
              human_review_delta: 0,
              dated_sold_delta: 0,
              candidate_or_evidence_created: false,
              track_b_started: false,
              projection_approved: false
            },
            authority_boundary: {
              detector_authority: 'READ_ONLY',
              repository_mutation_performed: false,
              credentialed_external_mutation_performed: false,
              secret_material_read: false,
              production_or_g5_promoted: false
            }
          };
          const receipt = { ...base, observed_at: new Date().toISOString(), receipt_digest: digest(stable(base)) };
          fs.writeFileSync(`${process.env.KPMO_PACKET_DIR}/audit-receipt.json`, `${JSON.stringify(receipt, null, 2)}\n`);
          fs.writeFileSync(`${process.env.KPMO_PACKET_DIR}/remediation-plan.json`, `${JSON.stringify({
            schema_version: '1.0.0',
            plan_type: 'KIDULTS_SAFE_REMEDIATION_PACKET',
            source_sha: base.source.expected_sha,
            disposition: 'CIRCUIT_OPEN_MANUAL_HOLD',
            failed_check_ids: ['AUDIT_BOOTSTRAP'],
            activation_eligible: false,
            direct_main_write: false,
            auto_merge: false
          }, null, 2)}\n`);
          NODE

      - name: Checkout exact audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.KPMO_SOURCE_SHA }}
          persist-credentials: false

      - name: Assert exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KPMO_SOURCE_SHA"

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate exact ASI SHADOW upstream evidence binding
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'KIDULTS ASI SHADOW Operating Evidence v1'
        env:
          GH_TOKEN: ${{ github.token }}
          SHADOW_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          SHADOW_UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          SHADOW_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHADOW_UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SHADOW_UPSTREAM_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SHADOW_UPSTREAM_CONCLUSION" = "success"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SHADOW_UPSTREAM_RUN_ID}" \
            > /tmp/shadow-upstream-run.json
          jq -e \
            --argjson run "$SHADOW_UPSTREAM_RUN_ID" \
            --arg sha "$SHADOW_UPSTREAM_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.id==$run
             and .name=="KIDULTS ASI SHADOW Operating Evidence v1"
             and .path==".github/workflows/kidults-asi-shadow-operating-evidence-v1.yml"
             and .repository.full_name==$repo
             and .head_branch=="main"
             and .head_sha==$sha
             and .status=="completed"
             and .conclusion=="success"' \
            /tmp/shadow-upstream-run.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SHADOW_UPSTREAM_RUN_ID}/artifacts?per_page=100" \
            > /tmp/shadow-upstream-artifacts.json
          SHADOW_ARTIFACT_COUNT=$(jq \
            --argjson run "$SHADOW_UPSTREAM_RUN_ID" \
            --arg sha "$SHADOW_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-shadow-operating-evidence-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' \
            /tmp/shadow-upstream-artifacts.json)
          test "$SHADOW_ARTIFACT_COUNT" -eq 1
          SHADOW_ARTIFACT_ID=$(jq -r \
            --argjson run "$SHADOW_UPSTREAM_RUN_ID" \
            --arg sha "$SHADOW_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-shadow-operating-evidence-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)][0].id' \
            /tmp/shadow-upstream-artifacts.json)
          SHADOW_ARTIFACT_DIGEST=$(jq -r \
            --argjson run "$SHADOW_UPSTREAM_RUN_ID" \
            --arg sha "$SHADOW_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-shadow-operating-evidence-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)][0].digest // empty' \
            /tmp/shadow-upstream-artifacts.json)
          [[ "$SHADOW_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SHADOW_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          jq -n \
            --argjson run "$SHADOW_UPSTREAM_RUN_ID" \
            --arg sha "$SHADOW_UPSTREAM_SHA" \
            --argjson artifact "$SHADOW_ARTIFACT_ID" \
            --arg digest "$SHADOW_ARTIFACT_DIGEST" \
            '{status:"VERIFIED_PASS",upstream_run_id:$run,upstream_sha:$sha,artifact_id:$artifact,artifact_digest:$digest,production:"HOLD"}' \
            > /tmp/kidults-shadow-upstream-binding.json

      - name: Validate exact Requirement Coverage upstream evidence binding
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'KIDULTS ASI Requirement-to-Adapter Coverage v1'
        env:
          REQUIREMENT_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUIREMENT_UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUIREMENT_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUIREMENT_UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUIREMENT_UPSTREAM_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$REQUIREMENT_UPSTREAM_CONCLUSION" = "success"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${REQUIREMENT_UPSTREAM_RUN_ID}" \
            > /tmp/requirement-upstream-run.json
          jq -e \
            --argjson run "$REQUIREMENT_UPSTREAM_RUN_ID" \
            --arg sha "$REQUIREMENT_UPSTREAM_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.id==$run
             and .name=="KIDULTS ASI Requirement-to-Adapter Coverage v1"
             and .path==".github/workflows/kidults-asi-requirement-adapter-coverage-v1.yml"
             and .repository.full_name==$repo
             and .head_branch=="main"
             and .head_sha==$sha
             and .status=="completed"
             and .conclusion=="success"' \
            /tmp/requirement-upstream-run.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${REQUIREMENT_UPSTREAM_RUN_ID}/artifacts?per_page=100" \
            > /tmp/requirement-upstream-artifacts.json
          REQUIREMENT_ARTIFACT_COUNT=$(jq \
            --argjson run "$REQUIREMENT_UPSTREAM_RUN_ID" \
            --arg sha "$REQUIREMENT_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-requirement-adapter-coverage-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' \
            /tmp/requirement-upstream-artifacts.json)
          test "$REQUIREMENT_ARTIFACT_COUNT" -eq 1
          REQUIREMENT_ARTIFACT_ID=$(jq -r \
            --argjson run "$REQUIREMENT_UPSTREAM_RUN_ID" \
            --arg sha "$REQUIREMENT_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-requirement-adapter-coverage-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)][0].id' \
            /tmp/requirement-upstream-artifacts.json)
          REQUIREMENT_ARTIFACT_DIGEST=$(jq -r \
            --argjson run "$REQUIREMENT_UPSTREAM_RUN_ID" \
            --arg sha "$REQUIREMENT_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-requirement-adapter-coverage-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)][0].digest // empty' \
            /tmp/requirement-upstream-artifacts.json)
          [[ "$REQUIREMENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUIREMENT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          jq -n \
            --argjson run "$REQUIREMENT_UPSTREAM_RUN_ID" \
            --arg sha "$REQUIREMENT_UPSTREAM_SHA" \
            --argjson artifact "$REQUIREMENT_ARTIFACT_ID" \
            --arg digest "$REQUIREMENT_ARTIFACT_DIGEST" \
            '{status:"VERIFIED_PASS",upstream_run_id:$run,upstream_sha:$sha,artifact_id:$artifact,artifact_digest:$digest,production:"HOLD"}' \
            > /tmp/kidults-requirement-upstream-binding.json
      - name: Validate exact Sharded Reserve upstream terminal binding
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'KIDULTS ASI Sharded Source Reserve v1'
        env:
          RESERVE_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          RESERVE_UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          RESERVE_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESERVE_UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RESERVE_UPSTREAM_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RESERVE_UPSTREAM_CONCLUSION" =~ ^(success|failure|cancelled|timed_out|action_required|neutral|skipped|stale)$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RESERVE_UPSTREAM_RUN_ID}" \
            > /tmp/reserve-upstream-run.json
          jq -e \
            --argjson run "$RESERVE_UPSTREAM_RUN_ID" \
            --arg sha "$RESERVE_UPSTREAM_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg conclusion "$RESERVE_UPSTREAM_CONCLUSION" \
            '.id==$run
             and .name=="KIDULTS ASI Sharded Source Reserve v1"
             and .path==".github/workflows/kidults-asi-sharded-source-reserve-v1.yml"
             and .repository.full_name==$repo
             and .head_branch=="main"
             and .head_sha==$sha
             and .status=="completed"
             and .conclusion==$conclusion' \
            /tmp/reserve-upstream-run.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RESERVE_UPSTREAM_RUN_ID}/artifacts?per_page=100" \
            > /tmp/reserve-upstream-artifacts.json
          RESERVE_PASS_ARTIFACT_COUNT=$(jq \
            --argjson run "$RESERVE_UPSTREAM_RUN_ID" --arg sha "$RESERVE_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-sharded-source-reserve-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' \
            /tmp/reserve-upstream-artifacts.json)
          RESERVE_WAITING_ARTIFACT_COUNT=$(jq \
            --argjson run "$RESERVE_UPSTREAM_RUN_ID" --arg sha "$RESERVE_UPSTREAM_SHA" \
            '[.artifacts[] | select(.name=="kidults-asi-sharded-source-reserve-waiting-v1" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length' \
            /tmp/reserve-upstream-artifacts.json)
          RESERVE_TOTAL_ARTIFACT_COUNT=$((RESERVE_PASS_ARTIFACT_COUNT + RESERVE_WAITING_ARTIFACT_COUNT))
          RESERVE_OBSERVED_STATE=VERIFIED_FAIL
          RESERVE_ARTIFACT_ID=0
          RESERVE_ARTIFACT_DIGEST=NONE
          if [ "$RESERVE_UPSTREAM_CONCLUSION" = success ]; then
            test "$RESERVE_TOTAL_ARTIFACT_COUNT" -eq 1
            if [ "$RESERVE_PASS_ARTIFACT_COUNT" -eq 1 ]; then
              RESERVE_OBSERVED_STATE=VERIFIED_PASS
              RESERVE_ARTIFACT_NAME=kidults-asi-sharded-source-reserve-v1
            else
              test "$RESERVE_WAITING_ARTIFACT_COUNT" -eq 1
              RESERVE_OBSERVED_STATE=WAITING_FOR_EXACT_DISCOVERY_PRODUCER
              RESERVE_ARTIFACT_NAME=kidults-asi-sharded-source-reserve-waiting-v1
            fi
            RESERVE_ARTIFACT_ID=$(jq -r --arg name "$RESERVE_ARTIFACT_NAME" \
              '[.artifacts[] | select(.name==$name and .expired==false)][0].id' /tmp/reserve-upstream-artifacts.json)
            RESERVE_ARTIFACT_DIGEST=$(jq -r --arg name "$RESERVE_ARTIFACT_NAME" \
              '[.artifacts[] | select(.name==$name and .expired==false)][0].digest // empty' /tmp/reserve-upstream-artifacts.json)
            [[ "$RESERVE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$RESERVE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          else
            test "$RESERVE_TOTAL_ARTIFACT_COUNT" -eq 0
          fi
          jq -n \
            --argjson run "$RESERVE_UPSTREAM_RUN_ID" \
            --arg sha "$RESERVE_UPSTREAM_SHA" \
            --arg conclusion "$RESERVE_UPSTREAM_CONCLUSION" \
            --arg state "$RESERVE_OBSERVED_STATE" \
            --argjson artifacts "$RESERVE_TOTAL_ARTIFACT_COUNT" \
            --argjson artifact "$RESERVE_ARTIFACT_ID" \
            --arg digest "$RESERVE_ARTIFACT_DIGEST" \
            '{status:"VERIFIED_PASS",upstream_run_id:$run,upstream_sha:$sha,upstream_conclusion:$conclusion,reserve_state:$state,artifact_cardinality:$artifacts,artifact_id:$artifact,artifact_digest:$digest,promotion_eligible:false,production:"HOLD",public:"HOLD"}' \
            > "$RUNNER_TEMP/$KPMO_PACKET_SUFFIX/reserve-upstream-binding.json"

      - name: Validate Met acquisition cancellation and Assurance binding
        run: node scripts/kidults/redteam/validate-met-acquisition-assurance-v1.mjs

      - name: Validate V&A acquisition cancellation and Assurance binding
        run: node scripts/kidults/redteam/validate-vam-acquisition-assurance-v1.mjs

      - name: Validate continuous assurance contract
        run: |
          node scripts/kidults/kpmo/validate-platform-continuous-assurance-v1.mjs
          node --check scripts/kidults/redteam/validate-intelligence-preparation-assurance-coverage-v1.mjs
          node scripts/kidults/redteam/validate-intelligence-preparation-assurance-coverage-v1.mjs

      - name: Validate adapter cancellation watch coverage
        run: node scripts/kidults/kpmo/validate-continuous-assurance-adapter-cancellation-watch-v1.mjs

      - name: Validate SHADOW, Requirement, and Reserve evidence watch coverage
        run: |
          node scripts/kidults/kpmo/validate-continuous-assurance-shadow-evidence-watch-v1.mjs
          node scripts/kidults/kpmo/validate-sharded-reserve-assurance-watch-v1.mjs

      - name: Run audit and always retain receipt
        run: >-
          node scripts/kidults/kpmo/run-platform-a-to-z-readiness-audit-v1.mjs
          --profile "$KPMO_AUDIT_PROFILE"
          --output "$RUNNER_TEMP/$KPMO_PACKET_SUFFIX/audit-receipt.json"

      - name: Emit safe remediation packet
        if: always()
        run: >-
          node scripts/kidults/kpmo/plan-safe-remediation-v1.mjs
          --receipt "$RUNNER_TEMP/$KPMO_PACKET_SUFFIX/audit-receipt.json"
          --policy coordination/kidults/kpmo/platform-continuous-assurance-v1.json
          --output "$RUNNER_TEMP/$KPMO_PACKET_SUFFIX/remediation-plan.json"

      - name: Upload exact-run assurance packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-continuous-assurance-${{ env.KPMO_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.KPMO_PACKET_SUFFIX }}/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve control result without promoting overall HOLD
        if: always()
        run: >-
          node -e
          "const d=process.env.RUNNER_TEMP+'/'+process.env.KPMO_PACKET_SUFFIX;
          const r=require(d+'/audit-receipt.json');const p=require(d+'/remediation-plan.json');
          if(r.states?.internal_control_state!=='VERIFIED_PASS'||r.states?.promotion_eligible!==false||
          p.source_receipt_digest!==r.receipt_digest||p.integrity_findings?.length||p.activation?.eligible!==false)process.exit(1)"
