name: KIDULTS DigitalOcean STAGING Bootstrap Safety

on:
  pull_request:
    paths:
      - 'coordination/kidults/runtime/digitalocean-staging-bootstrap-contract-v1.json'
      - 'scripts/operations/validate_digitalocean_staging_bootstrap_v1.py'
      - '.github/workflows/digitalocean-staging-bootstrap-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fail-closed STAGING bootstrap contract
        run: python scripts/operations/validate_digitalocean_staging_bootstrap_v1.py
