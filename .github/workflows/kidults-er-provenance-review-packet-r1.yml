name: KIDULTS ER Provenance Review Packet R1
on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/build-provenance-review-packet-r1.mjs'
      - 'scripts/kidults/entity-resolution/validate-provenance-review-packet-r1.mjs'
      - '.github/workflows/kidults-er-provenance-review-packet-r1.yml'
      - 'scripts/kidults/entity-resolution/acquire-provenance-source-corpus-r1.mjs'
      - 'coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json'
      - 'coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-partial-review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.23.2'}
      - name: Acquire 120 real Getty provenance source-linked pairs
        run: node scripts/kidults/entity-resolution/acquire-provenance-source-corpus-r1.mjs /tmp/provenance-source-corpus-r1.json
      - name: Build 50 transaction-to-object reviewer cases
        run: node scripts/kidults/entity-resolution/build-provenance-review-packet-r1.mjs /tmp/provenance-source-corpus-r1.json coordination/kidults/entity-resolution/independent-label-review-packet-contract-r1.json coordination/kidults/entity-resolution/empirical-validation-sampling-plan-r1.json /tmp/provenance-review-packet-r1.json
      - name: Validate partial packet truth boundaries
        run: node scripts/kidults/entity-resolution/validate-provenance-review-packet-r1.mjs /tmp/provenance-review-packet-r1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-er-provenance-review-packet-r1
          path: /tmp/provenance-review-packet-r1.json
          retention-days: 14
