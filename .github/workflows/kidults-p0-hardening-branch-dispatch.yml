name: KIDULTS P0 Hardening Branch Dispatch

on:
  push:
    branches:
      - hardening/p0-speed-quality
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'coordination/kidults/**'
      - '.github/workflows/kidults-p0-speed-quality.yml'
      - '.github/workflows/kidults-p0-hardening-branch-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-p0:
    runs-on: ubuntu-latest
    steps:
      - name: Verify integration base freshness before P0 dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          compare_json=$(gh api "repos/$REPO/compare/main...$HEAD_SHA")
          status=$(jq -r '.status // "unknown"' <<<"$compare_json")
          ahead=$(jq -r '.ahead_by // -1' <<<"$compare_json")
          behind=$(jq -r '.behind_by // -1' <<<"$compare_json")
          main_sha=$(jq -r '.base_commit.sha // "unknown"' <<<"$compare_json")
          merge_base_sha=$(jq -r '.merge_base_commit.sha // "unknown"' <<<"$compare_json")

          jq -n \
            --arg stage "P0_HARDENING_INTEGRATION_BASE_FRESHNESS" \
            --arg status "$status" \
            --arg headSha "$HEAD_SHA" \
            --arg mainSha "$main_sha" \
            --arg mergeBaseSha "$merge_base_sha" \
            --argjson aheadBy "$ahead" \
            --argjson behindBy "$behind" \
            --argjson fresh "$([ "$behind" = "0" ] && printf true || printf false)" \
            '{stage:$stage,status:$status,headSha:$headSha,mainSha:$mainSha,mergeBaseSha:$mergeBaseSha,aheadBy:$aheadBy,behindBy:$behindBy,integrationBaseFresh:$fresh,partialEvidenceAccepted:false,evidenceSemanticsModified:false,rightsProvenanceModified:false,productionGateWeakened:false}' \
            > integration-base-drift.json

          jq -n \
            --arg stage "P0_HARDENING_INTEGRATION_RECONCILIATION" \
            --arg status "NOT_REQUIRED_INTEGRATION_BASE_FRESH" \
            --arg headSha "$HEAD_SHA" \
            --arg mainSha "$main_sha" \
            --arg mergeBaseSha "$merge_base_sha" \
            '{stage:$stage,status:$status,headSha:$headSha,mainSha:$mainSha,mergeBaseSha:$mergeBaseSha,automaticMergeAttempted:false,automaticConflictResolutionAttempted:false,governanceSemanticResolutionAttempted:false,partialEvidenceAccepted:false,evidenceSemanticsModified:false,rightsProvenanceModified:false,productionGateWeakened:false}' \
            > integration-reconciliation-diagnostic.json

          echo "Integration base: status=$status ahead=$ahead behind=$behind main=$main_sha merge_base=$merge_base_sha"
          if [ "$behind" -lt 0 ]; then
            echo "::error::Unable to determine integration-base freshness; P0 dispatch remains fail-closed."
            exit 1
          fi

          if [ "$behind" -eq 0 ]; then
            decision_meta=$(gh api --method GET "repos/$REPO/contents/coordination/kidults/registry/decision-registry.json" -f ref="$HEAD_SHA")
            decision_json=$(jq -r '.content // empty' <<<"$decision_meta" | base64 --decode)
            if ! jq -e '.entries[]? | select(.decision_id == "DEC-2026-08-12-004" and .status == "approved")' <<<"$decision_json" >/dev/null; then
              echo "::error::Canonical DEC-2026-08-12-004 approval is missing; P0 dispatch remains fail-closed."
              exit 1
            fi
          fi

          if [ "$behind" -ne 0 ]; then
            if main_compare=$(gh api "repos/$REPO/compare/$merge_base_sha...main") && \
               head_compare=$(gh api "repos/$REPO/compare/$merge_base_sha...$HEAD_SHA"); then
              main_files=$(jq -c '[.files[]?.filename] | unique' <<<"$main_compare")
              head_files=$(jq -c '[.files[]?.filename] | unique' <<<"$head_compare")
              overlap_files=$(jq -cn \
                --argjson main "$main_files" \
                --argjson head "$head_files" \
                '$head | map(select(. as $file | $main | index($file))) | unique')
              sensitive_pattern='(^|/)(registry|governance|decision|handoff)|track-b|portal|\.github/workflows'
              sensitive_overlap=$(jq -cn \
                --argjson overlap "$overlap_files" \
                --arg pattern "$sensitive_pattern" \
                '$overlap | map(select(test($pattern; "i"))) | unique')

              identical_overlap='[]'
              divergent_overlap='[]'
              unresolved_overlap='[]'
              while IFS= read -r file; do
                main_blob=""
                head_blob=""
                if main_meta=$(gh api --method GET "repos/$REPO/contents/$file" -f ref="$main_sha" 2>/dev/null); then
                  main_blob=$(jq -r '.sha // empty' <<<"$main_meta")
                fi
                if head_meta=$(gh api --method GET "repos/$REPO/contents/$file" -f ref="$HEAD_SHA" 2>/dev/null); then
                  head_blob=$(jq -r '.sha // empty' <<<"$head_meta")
                fi

                if [ -n "$main_blob" ] && [ -n "$head_blob" ] && [ "$main_blob" = "$head_blob" ]; then
                  identical_overlap=$(jq -c --arg file "$file" '. + [$file] | unique' <<<"$identical_overlap")
                elif [ -n "$main_blob" ] && [ -n "$head_blob" ]; then
                  divergent_overlap=$(jq -c --arg file "$file" '. + [$file] | unique' <<<"$divergent_overlap")
                else
                  unresolved_overlap=$(jq -c --arg file "$file" '. + [$file] | unique' <<<"$unresolved_overlap")
                fi
              done < <(jq -r '.[]' <<<"$overlap_files")

              sensitive_identical_overlap=$(jq -cn \
                --argjson files "$identical_overlap" \
                --arg pattern "$sensitive_pattern" \
                '$files | map(select(test($pattern; "i"))) | unique')
              sensitive_divergent_overlap=$(jq -cn \
                --argjson files "$divergent_overlap" \
                --arg pattern "$sensitive_pattern" \
                '$files | map(select(test($pattern; "i"))) | unique')
              sensitive_unresolved_overlap=$(jq -cn \
                --argjson files "$unresolved_overlap" \
                --arg pattern "$sensitive_pattern" \
                '$files | map(select(test($pattern; "i"))) | unique')

              main_file_count=$(jq 'length' <<<"$main_files")
              head_file_count=$(jq 'length' <<<"$head_files")
              overlap_count=$(jq 'length' <<<"$overlap_files")
              sensitive_overlap_count=$(jq 'length' <<<"$sensitive_overlap")
              identical_overlap_count=$(jq 'length' <<<"$identical_overlap")
              divergent_overlap_count=$(jq 'length' <<<"$divergent_overlap")
              unresolved_overlap_count=$(jq 'length' <<<"$unresolved_overlap")
              sensitive_identical_overlap_count=$(jq 'length' <<<"$sensitive_identical_overlap")
              sensitive_divergent_overlap_count=$(jq 'length' <<<"$sensitive_divergent_overlap")
              sensitive_unresolved_overlap_count=$(jq 'length' <<<"$sensitive_unresolved_overlap")
              main_commit_count=$(jq -r '.ahead_by // -1' <<<"$main_compare")
              head_commit_count=$(jq -r '.ahead_by // -1' <<<"$head_compare")
              main_files_possibly_truncated=$([ "$main_file_count" -ge 300 ] && printf true || printf false)
              head_files_possibly_truncated=$([ "$head_file_count" -ge 300 ] && printf true || printf false)
              byte_identity_complete=$([ "$unresolved_overlap_count" -eq 0 ] && printf true || printf false)

              jq -n \
                --arg stage "P0_HARDENING_INTEGRATION_RECONCILIATION" \
                --arg status "OWNER_RECONCILIATION_REQUIRED" \
                --arg headSha "$HEAD_SHA" \
                --arg mainSha "$main_sha" \
                --arg mergeBaseSha "$merge_base_sha" \
                --arg nextSafeAction "OWNER_LED_CONFLICT_AWARE_RECONCILIATION" \
                --arg sensitivePattern "$sensitive_pattern" \
                --argjson mainCommitCount "$main_commit_count" \
                --argjson headCommitCount "$head_commit_count" \
                --argjson mainChangedFileCount "$main_file_count" \
                --argjson headChangedFileCount "$head_file_count" \
                --argjson overlapChangedFileCount "$overlap_count" \
                --argjson sensitiveOverlapCount "$sensitive_overlap_count" \
                --argjson identicalOverlapCount "$identical_overlap_count" \
                --argjson divergentOverlapCount "$divergent_overlap_count" \
                --argjson unresolvedOverlapCount "$unresolved_overlap_count" \
                --argjson sensitiveIdenticalOverlapCount "$sensitive_identical_overlap_count" \
                --argjson sensitiveDivergentOverlapCount "$sensitive_divergent_overlap_count" \
                --argjson sensitiveUnresolvedOverlapCount "$sensitive_unresolved_overlap_count" \
                --argjson mainFileListPossiblyTruncated "$main_files_possibly_truncated" \
                --argjson headFileListPossiblyTruncated "$head_files_possibly_truncated" \
                --argjson byteIdentityClassificationComplete "$byte_identity_complete" \
                --argjson overlapFiles "$overlap_files" \
                --argjson sensitiveOverlapFiles "$sensitive_overlap" \
                --argjson identicalOverlapFiles "$identical_overlap" \
                --argjson divergentOverlapFiles "$divergent_overlap" \
                --argjson unresolvedOverlapFiles "$unresolved_overlap" \
                --argjson sensitiveIdenticalOverlapFiles "$sensitive_identical_overlap" \
                --argjson sensitiveDivergentOverlapFiles "$sensitive_divergent_overlap" \
                --argjson sensitiveUnresolvedOverlapFiles "$sensitive_unresolved_overlap" \
                '{stage:$stage,status:$status,headSha:$headSha,mainSha:$mainSha,mergeBaseSha:$mergeBaseSha,mainCommitCount:$mainCommitCount,headCommitCount:$headCommitCount,mainChangedFileCount:$mainChangedFileCount,headChangedFileCount:$headChangedFileCount,overlapChangedFileCount:$overlapChangedFileCount,sensitiveOverlapCount:$sensitiveOverlapCount,identicalOverlapCount:$identicalOverlapCount,divergentOverlapCount:$divergentOverlapCount,unresolvedOverlapCount:$unresolvedOverlapCount,sensitiveIdenticalOverlapCount:$sensitiveIdenticalOverlapCount,sensitiveDivergentOverlapCount:$sensitiveDivergentOverlapCount,sensitiveUnresolvedOverlapCount:$sensitiveUnresolvedOverlapCount,mainFileListPossiblyTruncated:$mainFileListPossiblyTruncated,headFileListPossiblyTruncated:$headFileListPossiblyTruncated,byteIdentityClassificationComplete:$byteIdentityClassificationComplete,overlapFiles:$overlapFiles,sensitiveOverlapFiles:$sensitiveOverlapFiles,identicalOverlapFiles:$identicalOverlapFiles,divergentOverlapFiles:$divergentOverlapFiles,unresolvedOverlapFiles:$unresolvedOverlapFiles,sensitiveIdenticalOverlapFiles:$sensitiveIdenticalOverlapFiles,sensitiveDivergentOverlapFiles:$sensitiveDivergentOverlapFiles,sensitiveUnresolvedOverlapFiles:$sensitiveUnresolvedOverlapFiles,sensitiveClassificationPattern:$sensitivePattern,nextSafeAction:$nextSafeAction,byteIdentityUsedForAutomaticResolution:false,automaticMergeAttempted:false,automaticConflictResolutionAttempted:false,governanceSemanticResolutionAttempted:false,partialEvidenceAccepted:false,evidenceSemanticsModified:false,rightsProvenanceModified:false,productionGateWeakened:false}' \
                > integration-reconciliation-diagnostic.json

              echo "Integration reconciliation: main_files=$main_file_count head_files=$head_file_count overlap=$overlap_count sensitive_overlap=$sensitive_overlap_count identical=$identical_overlap_count divergent=$divergent_overlap_count unresolved=$unresolved_overlap_count sensitive_divergent=$sensitive_divergent_overlap_count"
            else
              jq -n \
                --arg stage "P0_HARDENING_INTEGRATION_RECONCILIATION" \
                --arg status "DIAGNOSTIC_FETCH_FAILED_FAIL_CLOSED" \
                --arg headSha "$HEAD_SHA" \
                --arg mainSha "$main_sha" \
                --arg mergeBaseSha "$merge_base_sha" \
                '{stage:$stage,status:$status,headSha:$headSha,mainSha:$mainSha,mergeBaseSha:$mergeBaseSha,nextSafeAction:"OWNER_LED_CONFLICT_AWARE_RECONCILIATION",automaticMergeAttempted:false,automaticConflictResolutionAttempted:false,governanceSemanticResolutionAttempted:false,partialEvidenceAccepted:false,evidenceSemanticsModified:false,rightsProvenanceModified:false,productionGateWeakened:false}' \
                > integration-reconciliation-diagnostic.json
              echo "::warning::Unable to build complete integration reconciliation diagnostic; P0 dispatch still remains fail-closed."
            fi

            echo "::error::hardening/p0-speed-quality is $behind commits behind main; synchronize the branch before dispatching another production-readiness P0 run."
            exit 1
          fi

      - name: Upload integration-base diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-p0-integration-base-diagnostics
          path: |
            integration-base-drift.json
            integration-reconciliation-diagnostic.json
          retention-days: 30
          if-no-files-found: error

      - name: Dispatch existing P0 workflow on hardening branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          gh workflow run kidults-p0-speed-quality.yml --repo "$REPO" --ref "$REF"
