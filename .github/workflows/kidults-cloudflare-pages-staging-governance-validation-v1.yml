name: KIDULTS Cloudflare Pages STAGING Governance Validation v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-cloudflare-pages-boundary-readonly-v1.yml'
      - '.github/workflows/kidults-cloudflare-pages-emergency-control-v1.yml'
      - '.github/workflows/kidults-cloudflare-pages-staging-deploy-v1.yml'
      - '.github/workflows/kidults-cloudflare-pages-staging-governance-validation-v1.yml'
      - '.github/workflows/kpmo-cf-kidults-14501ac-01-preflight.yml'
      - '.github/workflows/kpmo-cloudflare-preview-retire-and-governed-staging-v1.yml'
      - 'scripts/ops/cloudflare-pages-boundary-readonly.sh'
      - 'scripts/ops/cloudflare-pages-auto-deployment-containment.sh'
      - 'scripts/ops/cloudflare-pages-preview-cleanup.sh'
      - 'scripts/ops/cloudflare-pages-governed-staging-deploy.sh'
      - 'scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh'
      - 'scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs'
      - 'coordination/kidults/runtime/cloudflare-pages-staging-governance-v1.json'
      - 'coordination/kidults/runtime/cf-kidults-14501ac-01-approval.json'
      - 'coordination/kidults/runtime/cloudflare-privileged-mutation-containment-v1.json'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
      - 'docs/kidults/runtime/cloudflare-pages-staging-governance-v1.md'
      - 'tests/kidults/kpmo/cloudflare-pages-staging-governance-v1.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-pages-readonly-governed-lineage-v1.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-pages-readonly-credential-failure-receipt-v1.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-pages-api-pagination-v1.test.mjs'
      - 'tests/kidults/kpmo/cf-kidults-14501ac-01-approval.test.mjs'
      - 'tests/kidults/kpmo/cloudflare-privileged-mutation-containment-v1.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate Cloudflare STAGING governance and negative mutations
        run: |
          node scripts/kidults/kpmo/validate-cloudflare-pages-staging-governance-v1.mjs
          node tests/kidults/kpmo/cloudflare-pages-staging-governance-v1.test.mjs
          node tests/kidults/kpmo/cloudflare-pages-readonly-governed-lineage-v1.test.mjs
          node tests/kidults/kpmo/cloudflare-pages-readonly-credential-failure-receipt-v1.test.mjs
          node tests/kidults/kpmo/cloudflare-pages-api-pagination-v1.test.mjs
          node tests/kidults/kpmo/cf-kidults-14501ac-01-approval.test.mjs
          node tests/kidults/kpmo/cloudflare-privileged-mutation-containment-v1.test.mjs
          node scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs --enforce-registry
          bash -n scripts/ops/cloudflare-pages-boundary-readonly.sh
          bash -n scripts/ops/cloudflare-pages-auto-deployment-containment.sh
          bash -n scripts/ops/cloudflare-pages-preview-cleanup.sh
          bash -n scripts/ops/cloudflare-pages-governed-staging-deploy.sh
          bash -n scripts/ops/cloudflare-pages-cf-kidults-14501ac-01.sh
