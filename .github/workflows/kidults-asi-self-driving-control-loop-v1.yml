name: KIDULTS ASI Self-Driving Control Loop v1
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/asi-self-driving-control-loop-v1.json'
      - 'coordination/kidults/source-intelligence/asi-autonomous-safe-action-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-proactive-source-pool-accumulator-v1.json'
      - 'coordination/kidults/source-intelligence/asi-market-structure-acquisition-feedback-v1.json'
      - 'coordination/kidults/source-intelligence/asi-regional-data-usability-factor-r1.json'
      - 'coordination/kidults/source-intelligence/global-data-acquisition-master-matrix-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'scripts/kidults/source-intelligence/build-asi-market-structure-acquisition-feedback-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-market-structure-acquisition-feedback-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-regional-data-usability-factor-r1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-regional-data-usability-factor-r1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-autonomous-action-queue-v2.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-action-queue-v2.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-discovery-steering-plan-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-discovery-steering-plan-v1.mjs'
      - 'scripts/kidults/source-intelligence/apply-asi-autobalance-steering-overlay-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/rotate-product-linked-discovery-queue-v2.mjs'
      - 'scripts/kidults/source-intelligence/test-asi-discovery-steering-freeze-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/prepare-asi-previous-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-common-crawl-seed-frontier-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-seed-frontier-v1.mjs'
      - 'scripts/kidults/source-intelligence/test-asi-common-crawl-dynamic-frontier-fairness-v1.mjs'
      - 'scripts/kidults/source-intelligence/merge-asi-common-crawl-into-global-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-canonical-merge-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-self-driving-binding-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-legacy-bounded-discovery-retirement-v1.mjs'
      - 'scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs'
      - 'scripts/kidults/supply-chain/validate-exact-github-artifact-restore-v1.mjs'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.py'
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-self-driving-control-loop-v1.json'
      - 'coordination/kidults/source-intelligence/asi-market-structure-acquisition-feedback-v1.json'
      - 'coordination/kidults/source-intelligence/asi-regional-data-usability-factor-r1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'scripts/kidults/source-intelligence/build-asi-market-structure-acquisition-feedback-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-regional-data-usability-factor-r1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-autonomous-action-queue-v2.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-discovery-steering-plan-v1.mjs'
      - 'scripts/kidults/source-intelligence/apply-asi-autobalance-steering-overlay-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs'
      - 'scripts/kidults/source-intelligence/rotate-product-linked-discovery-queue-v2.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/prepare-asi-previous-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-common-crawl-seed-frontier-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-seed-frontier-v1.mjs'
      - 'scripts/kidults/source-intelligence/test-asi-common-crawl-dynamic-frontier-fairness-v1.mjs'
      - 'scripts/kidults/source-intelligence/merge-asi-common-crawl-into-global-discovery-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-canonical-merge-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-self-driving-binding-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-legacy-bounded-discovery-retirement-v1.mjs'
      - 'scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs'
      - 'scripts/kidults/supply-chain/validate-exact-github-artifact-restore-v1.mjs'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.py'
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: kidults-asi-self-driving-${{ github.ref }}
  cancel-in-progress: true
jobs:
  autonomous-shadow-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: VERIFY — exact source, syntax and legacy retirement
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/kidults/source-intelligence/validate-asi-legacy-bounded-discovery-retirement-v1.mjs .github/workflows/kidults-asi-self-driving-control-loop-v1.yml
          node --check scripts/kidults/source-intelligence/apply-asi-autobalance-steering-overlay-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs
          node --check scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs
          node --check scripts/kidults/source-intelligence/merge-asi-common-crawl-into-global-discovery-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-canonical-merge-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-self-driving-binding-v1.mjs
          node --check scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs
          node --check scripts/kidults/source-intelligence/prepare-asi-previous-source-pool-v1.mjs
          node --check scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs
          node scripts/kidults/supply-chain/validate-exact-github-artifact-restore-v1.mjs
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py
      - name: OBSERVE — rebuild structural acquisition matrix
        run: |
          node scripts/kidults/source-intelligence/build-global-data-acquisition-master-matrix-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json
          node scripts/kidults/source-intelligence/validate-global-data-acquisition-master-matrix-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json
      - name: MARKET_STRUCTURE — refresh rights-cleared regional observation
        run: node scripts/kidults/source-intelligence/probe-musicbrainz-regional-catalog-observation-r1.mjs /tmp/musicbrainz-regional-catalog-observation-r1.json
      - name: MARKET_STRUCTURE — build empirical baseline and verified data-usability overlay
        run: |
          node scripts/kidults/source-intelligence/build-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json /tmp/musicbrainz-regional-catalog-observation-r1.json
          node scripts/kidults/source-intelligence/validate-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json
          node scripts/kidults/source-intelligence/build-asi-regional-data-usability-factor-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json /tmp/musicbrainz-regional-catalog-observation-r1.json /tmp/empirical-regional-baseline-with-data-usability-r1.json
          node scripts/kidults/source-intelligence/validate-asi-regional-data-usability-factor-r1.mjs /tmp/empirical-regional-baseline-with-data-usability-r1.json
      - name: FEEDBACK — build verified-only acquisition priority matrix and queue
        run: |
          node scripts/kidults/source-intelligence/build-asi-market-structure-acquisition-feedback-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json /tmp/empirical-regional-baseline-with-data-usability-r1.json /tmp/global-data-acquisition-master-matrix-feedback-v1.json
          node scripts/kidults/source-intelligence/validate-asi-market-structure-acquisition-feedback-v1.mjs /tmp/global-data-acquisition-master-matrix-feedback-v1.json
          node scripts/kidults/source-intelligence/build-asi-autonomous-action-queue-v2.mjs /tmp/global-data-acquisition-master-matrix-feedback-v1.json /tmp/asi-autonomous-action-queue-v2.json
          node scripts/kidults/source-intelligence/validate-asi-autonomous-action-queue-v2.mjs /tmp/asi-autonomous-action-queue-v2.json
      - name: DISCOVER — restore prior pool/steering state, autobalance budget and immutable anchor foundation
        id: discovery-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input queue discovery-out /tmp/previous-source-pool /tmp/autobalance-raw /tmp/live-balance
          node scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs \
            --workflow-path .github/workflows/kidults-asi-self-driving-control-loop-v1.yml \
            --workflow-name 'KIDULTS ASI Self-Driving Control Loop v1' \
            --artifact-name kidults-asi-proactive-source-pool-v1 \
            --branch main \
            --archive /tmp/previous-source-pool.zip \
            --extract-dir /tmp/previous-source-pool \
            --receipt /tmp/previous-source-pool-exact-restore-receipt-v1.json \
            --required-basename asi-proactive-source-pool-v1.json \
            --required-basename asi-discovery-steering-plan-v1.json \
            --max-pages 40 \
            --lookback-days 95 \
            --max-compressed-bytes 67108864 \
            --allow-no-producer-history
          PREV_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/previous-source-pool-exact-restore-receipt-v1.json")).artifact_id || ""')
          PREP=$(node scripts/kidults/source-intelligence/prepare-asi-previous-source-pool-v1.mjs /tmp/previous-source-pool/asi-proactive-source-pool-v1.json)
          echo "$PREP"
          CYCLE_INDEX=$(printf '%s' "$PREP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write(String(Number(x.cycle_index||0)))})")
          PREV_COUNT=$(printf '%s' "$PREP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write(String(Number(x.previous_cycle_count||0)))})")
          PREV_VALID=$(printf '%s' "$PREP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(Boolean(JSON.parse(s).previous_pool_valid))))")

          node scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs \
            --workflow-path .github/workflows/kidults-asi-throughput-coverage-autobalance-live-v1.yml \
            --workflow-name 'KIDULTS ASI Throughput Coverage Autobalance Live v1' \
            --artifact-name kidults-asi-throughput-coverage-autobalance-live-v1 \
            --branch main \
            --archive /tmp/autobalance.zip \
            --extract-dir /tmp/autobalance-raw \
            --receipt /tmp/autobalance-exact-restore-receipt-v1.json \
            --required-basename asi-throughput-coverage-autobalance-live-v1.json \
            --max-pages 40 \
            --lookback-days 35 \
            --max-compressed-bytes 4194304 \
            --allow-no-producer-history
          BAL_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/autobalance-exact-restore-receipt-v1.json")).artifact_id || ""')
          if [ -n "$BAL_ID" ]; then
            BAL_SRC=$(find /tmp/autobalance-raw -type f -name 'asi-throughput-coverage-autobalance-live-v1.json' -print -quit || true)
            if [ -n "$BAL_SRC" ]; then
              cp "$BAL_SRC" /tmp/live-balance/asi-throughput-coverage-autobalance-live-v1.json
              node scripts/kidults/source-intelligence/validate-asi-throughput-coverage-autobalance-v1.mjs /tmp/live-balance/asi-throughput-coverage-autobalance-live-v1.json
            fi
          fi

          node scripts/kidults/supply-chain/restore-canonical-anchor-artifact-v1.mjs \
            /tmp/anchor-foundation.zip /tmp/kidults-canonical-anchor-restore-receipt-v1.json
          ANCHOR_DIGEST=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/kidults-canonical-anchor-restore-receipt-v1.json")).artifact_digest')
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
            --archive /tmp/anchor-foundation.zip \
            --expected-digest "$ANCHOR_DIGEST" \
            --receipt /tmp/anchor-foundation-safe-zip-receipt-v1.json \
            --max-compressed-bytes 67108864 \
            --max-entries 2048 \
            --max-entry-uncompressed-bytes 67108864 \
            --max-total-uncompressed-bytes 268435456 \
            --max-compression-ratio 100 \
            --required-basename category-representative-product-registry-v1.json \
            --required-basename representative-product-evidence-plan-v1.json \
            --required-basename representative-product-gap-matrix-v1.json \
            --required-basename representative-product-engine-alignment-v1.json \
            --required-basename representative-product-source-sufficiency-driver-v1.json \
            --required-basename run-manifest.json
          unzip -q -o /tmp/anchor-foundation.zip -d input
          node scripts/kidults/supply-chain/validate-canonical-anchor-extracted-v1.mjs input
          echo "cycle_index=$CYCLE_INDEX" >> "$GITHUB_OUTPUT"
          echo "previous_cycle_count=$PREV_COUNT" >> "$GITHUB_OUTPUT"
          echo "previous_pool_valid=$PREV_VALID" >> "$GITHUB_OUTPUT"
          echo "previous_artifact_id=${PREV_ID:-NONE}" >> "$GITHUB_OUTPUT"
          echo "autobalance_artifact_id=${BAL_ID:-NONE}" >> "$GITHUB_OUTPUT"
      - name: DISCOVER — build 160-anchor product demand queue
        run: |
          node scripts/kidults/source-intelligence/build-product-linked-targeted-asi-queue-v1.mjs input queue
          node scripts/kidults/source-intelligence/validate-product-linked-targeted-asi-queue-v1.mjs queue
      - name: STEER — build base plan and promote sweep-safe autobalance to default steering
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-asi-discovery-steering-plan-v1.mjs queue /tmp/global-data-acquisition-master-matrix-feedback-v1.json /tmp/previous-source-pool/asi-discovery-steering-plan-v1.json '${{ steps.discovery-state.outputs.previous_cycle_count }}' /tmp/asi-discovery-steering-plan-base-v1.json
          node scripts/kidults/source-intelligence/validate-asi-discovery-steering-plan-v1.mjs /tmp/asi-discovery-steering-plan-base-v1.json
          if [ -f /tmp/live-balance/asi-throughput-coverage-autobalance-live-v1.json ]; then
            node scripts/kidults/source-intelligence/apply-asi-autobalance-steering-overlay-v1.mjs /tmp/asi-discovery-steering-plan-base-v1.json /tmp/live-balance/asi-throughput-coverage-autobalance-live-v1.json /tmp/asi-discovery-steering-plan-v1.json
            node scripts/kidults/source-intelligence/validate-asi-autobalance-steering-overlay-v1.mjs /tmp/asi-discovery-steering-plan-v1.json
          else
            cp /tmp/asi-discovery-steering-plan-base-v1.json /tmp/asi-discovery-steering-plan-v1.json
          fi
          node scripts/kidults/source-intelligence/validate-asi-discovery-steering-plan-v1.mjs /tmp/asi-discovery-steering-plan-v1.json
          node scripts/kidults/source-intelligence/rotate-product-linked-discovery-queue-v2.mjs queue /tmp/asi-discovery-steering-plan-v1.json '${{ steps.discovery-state.outputs.cycle_index }}'
      - name: VERIFY — prove base steering freeze and 160-anchor full-sweep fairness
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: node scripts/kidults/source-intelligence/test-asi-discovery-steering-freeze-v1.mjs queue /tmp/global-data-acquisition-master-matrix-feedback-v1.json /tmp/asi-discovery-steering-plan-base-v1.json
      - name: DISCOVER — Global Any-Site source candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs queue discovery-out
      - name: VERIFY — baseline Global Any-Site discovery boundary
        run: node scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs discovery-out/global-low-risk-discovery.json
      - name: EXPAND — Common Crawl public-index same-domain candidates
        run: |
          node scripts/kidults/source-intelligence/test-asi-common-crawl-dynamic-frontier-fairness-v1.mjs
          node scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-common-crawl-host-expansion-v1.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-seed-frontier-v1.mjs /tmp/asi-common-crawl-seed-frontier-v1.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs /tmp/asi-common-crawl-host-expansion-v1.json
      - name: EXPAND — reject rights promotion before canonical merge
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/asi-common-crawl-host-expansion-v1.json','utf8'));
          if(x.candidates.length)x.candidates[0].rights_state='ALLOW';else x.rights_promoted=true;
          fs.writeFileSync('/tmp/bad-self-driving-common-crawl-rights.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/merge-asi-common-crawl-into-global-discovery-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/bad-self-driving-common-crawl-rights.json /tmp/bad-self-driving-common-crawl-merged.json; then exit 1; fi
      - name: MERGE — bind Common Crawl into self-driving canonical discovery batch
        run: |
          node scripts/kidults/source-intelligence/merge-asi-common-crawl-into-global-discovery-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-common-crawl-host-expansion-v1.json discovery-out/global-low-risk-discovery.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-canonical-merge-v1.mjs discovery-out/global-low-risk-discovery.json
          node scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs discovery-out/global-low-risk-discovery.json
      - name: MERGE — reject Common Crawl lane removal mutation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery.json','utf8'));
          x.lane_health=x.lane_health.filter(y=>y.lane_id!=='COMMON_CRAWL_URL_INDEX_HOST_EXPANSION');
          fs.writeFileSync('/tmp/bad-self-driving-common-crawl-lane.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-common-crawl-canonical-merge-v1.mjs /tmp/bad-self-driving-common-crawl-lane.json; then exit 1; fi
      - name: ACCUMULATE — merge rolling Global Any-Site source candidate pool
        run: node scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/previous-source-pool/asi-proactive-source-pool-v1.json /tmp/asi-proactive-source-pool-v1.json
      - name: VERIFY — candidate pool cannot self-promote rights
        run: node scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs /tmp/asi-proactive-source-pool-v1.json
      - name: VERIFY — Common Crawl candidates reached self-driving rolling pool
        run: node scripts/kidults/source-intelligence/validate-asi-common-crawl-self-driving-binding-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-proactive-source-pool-v1.json
      - name: RE-EVALUATE — emit closed-loop cycle summary
        shell: bash
        run: |
          node - <<'NODE' >/tmp/asi-self-driving-cycle-summary-v1.json
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/asi-autonomous-action-queue-v2.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/empirical-regional-baseline-with-data-usability-r1.json','utf8'));
          const m=JSON.parse(fs.readFileSync('/tmp/global-data-acquisition-master-matrix-feedback-v1.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/asi-proactive-source-pool-v1.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/asi-discovery-steering-plan-v1.json','utf8'));
          const d=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery.json','utf8'));
          const cc=d.lane_health.find(x=>x.lane_id==='COMMON_CRAWL_URL_INDEX_HOST_EXPANSION')||{};
