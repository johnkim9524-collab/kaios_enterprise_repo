name: KIDULTS ASI Self-Driving Control Loop v1
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'coordination/kidults/source-intelligence/asi-self-driving-control-loop-v1.json'
      - 'coordination/kidults/source-intelligence/asi-autonomous-safe-action-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-proactive-source-pool-accumulator-v1.json'
      - 'coordination/kidults/source-intelligence/global-data-acquisition-master-matrix-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-autonomous-action-queue-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-action-queue-v1.mjs'
      - 'scripts/kidults/source-intelligence/rotate-product-linked-discovery-queue-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/prepare-asi-previous-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/asi-product-linked-live-v2.mjs'
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-self-driving-control-loop-v1.json'
      - 'coordination/kidults/source-intelligence/asi-autonomous-safe-action-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-proactive-source-pool-accumulator-v1.json'
      - 'coordination/kidults/source-intelligence/global-data-acquisition-master-matrix-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-autonomous-action-queue-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-autonomous-action-queue-v1.mjs'
      - 'scripts/kidults/source-intelligence/rotate-product-linked-discovery-queue-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/prepare-asi-previous-source-pool-v1.mjs'
      - 'scripts/kidults/source-intelligence/asi-product-linked-live-v2.mjs'
      - '.github/workflows/kidults-asi-self-driving-control-loop-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: kidults-asi-self-driving-${{ github.ref }}
  cancel-in-progress: true
jobs:
  autonomous-shadow-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: OBSERVE — rebuild acquisition matrix
        run: node scripts/kidults/source-intelligence/build-global-data-acquisition-master-matrix-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json
      - name: VERIFY — validate acquisition matrix
        run: node scripts/kidults/source-intelligence/validate-global-data-acquisition-master-matrix-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json
      - name: DISCOVER — restore and validate prior pool plus immutable anchor foundation
        id: discovery-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input queue discovery-out /tmp/previous-source-pool
          PREV_ID=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="kidults-asi-proactive-source-pool-v1" and .expired==false and .workflow_run.head_branch=="main")][0].id // empty')
          if [ -n "$PREV_ID" ]; then
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREV_ID}/zip" > /tmp/previous-source-pool.zip
            unzip -q -o /tmp/previous-source-pool.zip -d /tmp/previous-source-pool
          fi
          PREP=$(node scripts/kidults/source-intelligence/prepare-asi-previous-source-pool-v1.mjs /tmp/previous-source-pool/asi-proactive-source-pool-v1.json)
          echo "$PREP"
          CYCLE_INDEX=$(printf '%s' "$PREP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).cycle_index)))")
          PREV_VALID=$(printf '%s' "$PREP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).previous_pool_valid)))")
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9286462549/zip" > /tmp/anchor-foundation.zip
          unzip -q -o /tmp/anchor-foundation.zip -d input
          echo "cycle_index=$CYCLE_INDEX" >> "$GITHUB_OUTPUT"
          echo "previous_pool_valid=$PREV_VALID" >> "$GITHUB_OUTPUT"
          echo "previous_artifact_id=${PREV_ID:-NONE}" >> "$GITHUB_OUTPUT"
      - name: DISCOVER — build and rotate 160-anchor queue
        run: |
          node scripts/kidults/source-intelligence/build-product-linked-targeted-asi-queue-v1.mjs input queue
          node scripts/kidults/source-intelligence/validate-product-linked-targeted-asi-queue-v1.mjs queue
          node scripts/kidults/source-intelligence/rotate-product-linked-discovery-queue-v1.mjs queue '${{ steps.discovery-state.outputs.cycle_index }}'
      - name: DISCOVER — bounded open-metadata source candidates
        run: node scripts/kidults/source-intelligence/asi-product-linked-live-v2.mjs queue discovery-out
      - name: VERIFY — bounded discovery semantics
        run: node scripts/kidults/source-intelligence/validate-asi-product-linked-live-v2.mjs discovery-out
      - name: ACCUMULATE — merge rolling source candidate pool
        run: node scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs discovery-out/bounded-live-discovery.json /tmp/previous-source-pool/asi-proactive-source-pool-v1.json /tmp/asi-proactive-source-pool-v1.json
      - name: VERIFY — candidate pool cannot self-promote rights
        run: node scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs /tmp/asi-proactive-source-pool-v1.json
      - name: PRIORITIZE/GATE — build autonomous action queue
        run: node scripts/kidults/source-intelligence/build-asi-autonomous-action-queue-v1.mjs /tmp/global-data-acquisition-master-matrix-v1.json /tmp/asi-autonomous-action-queue-v1.json
      - name: VERIFY — validate autonomous action queue
        run: node scripts/kidults/source-intelligence/validate-asi-autonomous-action-queue-v1.mjs /tmp/asi-autonomous-action-queue-v1.json
      - name: EXECUTE_SAFE — refresh rights-cleared MusicBrainz regional observation
        run: node scripts/kidults/source-intelligence/probe-musicbrainz-regional-catalog-observation-r1.mjs /tmp/musicbrainz-regional-catalog-observation-r1.json
      - name: EXECUTE_SAFE — rebuild fail-closed regional baseline
        run: node scripts/kidults/source-intelligence/build-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json /tmp/musicbrainz-regional-catalog-observation-r1.json
      - name: VERIFY — enforce regional no-overclaim boundary
        run: node scripts/kidults/source-intelligence/validate-empirical-regional-baseline-wave1-r1.mjs /tmp/empirical-regional-baseline-wave1-r1.json
      - name: RE-EVALUATE — emit cycle summary
        shell: bash
        run: |
          node - <<'NODE' >/tmp/asi-self-driving-cycle-summary-v1.json
          const fs=require('fs');const q=JSON.parse(fs.readFileSync('/tmp/asi-autonomous-action-queue-v1.json','utf8'));const b=JSON.parse(fs.readFileSync('/tmp/empirical-regional-baseline-wave1-r1.json','utf8'));const m=JSON.parse(fs.readFileSync('/tmp/global-data-acquisition-master-matrix-v1.json','utf8'));const p=JSON.parse(fs.readFileSync('/tmp/asi-proactive-source-pool-v1.json','utf8'));process.stdout.write(JSON.stringify({id:'kidults-asi-self-driving-cycle-summary-v1',status:'SHADOW_CYCLE_COMPLETE_WITH_PROACTIVE_SOURCE_POOL',matrix_rows:m.structural_counts.evidence_binding_rows,open_coverage_debt_rows:m.acquisition_state_summary.open_coverage_debt_rows,deduped_acquisition_demands:q.total_deduped_acquisition_demands,top_priority_actions:q.top_priority_count,demand_rights_review_packets:q.rights_review_queue.length,safe_execution_actions:q.safe_execution_actions.length,source_pool_cycle:p.cycle_count,source_pool_rotation_index:p.rotation_cycle_index,source_pool_candidates:p.candidate_count,new_source_candidates:p.new_candidate_count,reobserved_source_candidates:p.reobserved_candidate_count,candidate_rights_review_packets:p.rights_review_queue.length,covered_representative_products:p.covered_representative_products,regional_observations:b.coverage_debt_report?.region_bound_observation_count||0,verified_market_factors:b.coverage_debt_report?.factor_assertions_verified||0,next_blocker:b.coverage_debt_report?.blocker||'UNKNOWN',public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/asi-self-driving-cycle-summary-v1.json
      - name: Persist rolling proactive source pool
        uses: actions/upload-artifact@v4
        with:
          name: kidults-asi-proactive-source-pool-v1
          path: /tmp/asi-proactive-source-pool-v1.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload non-public SHADOW cycle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kidults-asi-self-driving-cycle-v1
          path: |
            /tmp/global-data-acquisition-master-matrix-v1.json
            /tmp/asi-autonomous-action-queue-v1.json
            /tmp/asi-proactive-source-pool-v1.json
            discovery-out/bounded-live-discovery.json
            /tmp/musicbrainz-regional-catalog-observation-r1.json
            /tmp/empirical-regional-baseline-wave1-r1.json
            /tmp/asi-self-driving-cycle-summary-v1.json
          retention-days: 14
          if-no-files-found: error
