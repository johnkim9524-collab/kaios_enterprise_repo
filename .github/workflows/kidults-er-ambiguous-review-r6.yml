name: KIDULTS ER Ambiguous Review R6

on:
  pull_request:
    paths:
      - 'scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-cross-market-alias-r5.mjs'
      - 'scripts/kidults/entity-resolution/extend-er-dataset-ambiguous-review-r6.mjs'
      - 'scripts/kidults/entity-resolution/freeze-er-blind-holdout-v1.mjs'
      - 'scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs'
      - 'coordination/kidults/entity-resolution/entity-resolution-benchmark-v2-contract.json'
      - 'coordination/kidults/entity-resolution/approved-bounded-poc-calibration-strata-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - '.github/workflows/kidults-entity-resolution-benchmark-v2-runner.yml'
      - '.github/workflows/kidults-er-real-dataset-r1.yml'
      - '.github/workflows/kidults-er-getty-transaction-r2.yml'
      - '.github/workflows/kidults-er-canonical-design-r3.yml'
      - '.github/workflows/kidults-er-real-holdout-r4.yml'
      - '.github/workflows/kidults-er-cross-market-alias-r5.yml'
      - '.github/workflows/kidults-er-ambiguous-review-r6.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: kidults-er-ambiguous-review-r6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-and-run-r6:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
      - name: Build R1-R3 live-source-derived constructed-control aggregate
        run: |
          node scripts/kidults/entity-resolution/assemble-real-world-er-dataset-r1.mjs /tmp/er-r1.json
          node scripts/kidults/entity-resolution/extend-er-dataset-getty-transaction-r2.mjs /tmp/er-r1.json /tmp/er-r2.json
          node scripts/kidults/entity-resolution/extend-er-dataset-wikidata-design-r3.mjs /tmp/er-r2.json /tmp/er-r3.json
      - name: Add R5 authoritative cross-market alias
        run: node scripts/kidults/entity-resolution/extend-er-dataset-cross-market-alias-r5.mjs /tmp/er-r3.json /tmp/er-r5.json
      - name: Add R6 genuine ambiguous-review pair
        run: node scripts/kidults/entity-resolution/extend-er-dataset-ambiguous-review-r6.mjs /tmp/er-r5.json /tmp/er-r6.json
      - name: Run canonical benchmark
        run: node scripts/kidults/entity-resolution/run-entity-resolution-benchmark-v2.mjs /tmp/er-r6.json /tmp/er-r6-results.json
      - name: Verify all case classes, all boundaries, ambiguity and scope gate
        run: |
          node - <<'NODE'
          const d=require('/tmp/er-r6.json'); const r=require('/tmp/er-r6-results.json');
          if(d.dataset_class!=='REAL_SOURCE_DERIVED_CONSTRUCTED_CONTROL'||d.constructed_control!==true||d.empirical_benchmark_eligible!==false||d.independent_label_review_complete!==false||d.label_adjudication_complete!==false||d.holdout_sealed_before_modeling!==false||d.production!=='HOLD') process.exit(1);
          if(d.cases.some(x=>x.blind_holdout===true)||r.blind_holdout_count!==0||r.blind_accuracy!==null) process.exit(1);
          const classes=new Set(d.cases.map(x=>x.case_class));
          for(const c of ['HARD_NEGATIVE','SAME_OBJECT_NORMALIZATION','SAME_DESIGN_DIFFERENT_OBJECT','CROSS_MARKET_ALIAS','TRANSACTION_TO_OBJECT_LINKAGE','AMBIGUOUS_REVIEW_REQUIRED']) if(!classes.has(c)) process.exit(1);
          const boundaries=new Set(d.cases.map(x=>x.identity_boundary));
          for(const b of ['SOURCE_RECORD','PHYSICAL_OBJECT','CANONICAL_DESIGN','MARKET_EVENT']) if(!boundaries.has(b)) process.exit(1);
          const ambiguous=d.cases.find(x=>x.case_class==='AMBIGUOUS_REVIEW_REQUIRED');
          if(!ambiguous||ambiguous.expected!=='REVIEW') process.exit(1);
          if(r.accuracy!==1||r.critical_false_auto_merge!==0||r.blind_critical_false_auto_merge!==0) process.exit(1);
          if(r.coverage.provenance_coverage!==1||r.coverage.rights_coverage!==1) process.exit(1);
          if(r.coverage.required_case_classes_complete!==true||r.coverage.required_identity_boundaries_complete!==true) process.exit(1);
          if(r.coverage.scope_stratification_complete!==false||r.promotion_gate.empirical_benchmark_gate_pass!==false||r.promotion_gate.promotion_eligible_before_track_b!==false||r.promotion_gate.production_promotion_authorized!==false) process.exit(1);
          console.log('R6 constructed-control mechanics cover all diagnostic classes/boundaries; blind, approved-PoC, empirical, and Production gates remain closed.');
          NODE
      - name: Upload R6 diagnostic artifacts
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-er-source-derived-constructed-control-r6
          path: |
            /tmp/er-r6.json
            /tmp/er-r6-results.json
          if-no-files-found: error
          retention-days: 30
