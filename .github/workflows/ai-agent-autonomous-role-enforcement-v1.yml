name: KIDULTS AI Agent Autonomous Role Enforcement V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/AI_AGENT_AUTONOMOUS_ROLE.md'
      - '.github/workflows/ai-agent-autonomous-role-enforcement-v1.yml'
      - 'coordination/kidults/governance/ai-agent-autonomous-role-contract-v1.json'
      - 'coordination/kidults/governance/ai-agent-bootstrap-remediation-sequence-v1.json'
      - 'scripts/governance/validate-ai-agent-autonomous-role-v1.mjs'
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-agent-autonomous-role-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-autonomous-role-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Validate Autonomous Role bootstrap contract
        run: node scripts/governance/validate-ai-agent-autonomous-role-v1.mjs

      - name: Verify strategic stewardship markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'INTELLIGENCE_HOLDINGS_GROUP_FUTURE_STRATEGY' coordination/kidults/governance/ai-agent-autonomous-role-contract-v1.json
          grep -Fq 'VERTICAL_BRAND_FUTURE_STRATEGY' coordination/kidults/governance/ai-agent-autonomous-role-contract-v1.json
          grep -Fq 'CURRENT_PLATFORM_IMPROVEMENT_PROPOSALS' coordination/kidults/governance/ai-agent-autonomous-role-contract-v1.json
          grep -Fq 'REPORT_ONLY_AFTER_VERIFIED_REMEDIATION' .github/AI_AGENT_AUTONOMOUS_ROLE.md
