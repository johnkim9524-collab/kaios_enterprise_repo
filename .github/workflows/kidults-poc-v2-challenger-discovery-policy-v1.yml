name: KIDULTS PoC v2 Challenger Discovery Policy v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/poc/poc-v2-challenger-discovery-policy-v1.json'
      - 'scripts/kidults/poc/validate-poc-v2-challenger-discovery-policy-v1.mjs'
      - '.github/workflows/kidults-poc-v2-challenger-discovery-policy-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/kidults/poc/validate-poc-v2-challenger-discovery-policy-v1.mjs
