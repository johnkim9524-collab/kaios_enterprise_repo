name: KIDULTS ASI Sourcing Direction v2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json'
      - 'coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-registry-v2.json'
      - 'coordination/kidults/kpmo/operating-principles-and-resilience-controls-v1.json'
      - 'docs/kidults/asi/asi-sourcing-direction-v2.md'
      - 'scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs'
      - 'scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs'
      - '.github/workflows/kidults-global-source-mesh-v1.yml'
      - '.github/workflows/kidults-asi-source-fabric-scale-pi1.yml'
      - '.github/workflows/kidults-asi-sourcing-direction-v2.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json'
      - 'coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-sourcing-direction-registry-v2.json'
      - 'coordination/kidults/kpmo/operating-principles-and-resilience-controls-v1.json'
      - 'docs/kidults/asi/asi-sourcing-direction-v2.md'
      - 'scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs'
      - 'scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs'
      - '.github/workflows/kidults-global-source-mesh-v1.yml'
      - '.github/workflows/kidults-asi-source-fabric-scale-pi1.yml'
      - '.github/workflows/kidults-asi-sourcing-direction-v2.yml'

permissions:
  contents: read

concurrency:
  group: kidults-asi-sourcing-direction-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-sourcing-direction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact source, syntax and JSON contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs
          node --check scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-sourcing-direction-registry-v2.json','utf8'))"
      - name: Validate four-direction sourcing authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs \
            | tee /tmp/asi-sourcing-direction-validation-v2.json
      - name: Reject sourcing direction reorder mutation
        shell: bash
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json /tmp/direction.json
          node - <<'NODE'
          const fs=require('fs');
          const p='coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.platform_constitution.ordered_principles=['GLOBAL','AUTONOMOUS','IRREPLACEABLE_VALUE','TRANSPARENT'];
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs; then
            echo 'Validator accepted reordered sourcing direction' >&2
            exit 1
          fi
          mv /tmp/direction.json coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json
      - name: Reject provider-list-as-strategy mutation
        shell: bash
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json /tmp/direction.json
          node - <<'NODE'
          const fs=require('fs');
          const p='coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.sourcing_target.provider_list_is_not_the_strategy=false;
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs; then
            echo 'Validator accepted provider-first sourcing' >&2
            exit 1
          fi
          mv /tmp/direction.json coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json
      - name: Reject unknown-rights collection mutation
        shell: bash
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json /tmp/direction.json
          node - <<'NODE'
          const fs=require('fs');
          const p='coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.rights_and_semantic_boundaries.unknown_rights_behavior='ALLOW_COLLECTION';
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs; then
            echo 'Validator accepted collection with unknown rights' >&2
            exit 1
          fi
          mv /tmp/direction.json coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json
      - name: Reject opaque source-selection receipt mutation
        shell: bash
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json /tmp/direction.json
          node - <<'NODE'
          const fs=require('fs');
          const p='coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.directional_pillars.TRANSPARENT.required_source_receipt_fields=
            x.directional_pillars.TRANSPARENT.required_source_receipt_fields.filter(v=>v!=='SELECTION_REASON');
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs; then
            echo 'Validator accepted opaque source selection' >&2
            exit 1
          fi
          mv /tmp/direction.json coordination/kidults/source-intelligence/asi-sourcing-direction-contract-v2.json
      - name: Revalidate pristine sourcing direction
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-sourcing-direction-v2.mjs \
            > /tmp/asi-sourcing-direction-final-validation-v2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-sourcing-direction-v2
          path: |
            /tmp/asi-sourcing-direction-validation-v2.json
            /tmp/asi-sourcing-direction-final-validation-v2.json
          retention-days: 90
          if-no-files-found: error
