name: KIDULTS Operational Registry Validate

on:
  pull_request:
    paths:
      - 'coordination/kidults/registry/**'
      - 'coordination/kidults/registry-engine/**'
      - 'coordination/kidults/bootstrap/**'
      - 'scripts/kidults/registry/**'
      - 'scripts/kidults/coordination/**'
      - '.github/workflows/kidults-operational-registry-validate.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/registry/**'
      - 'coordination/kidults/registry-engine/**'
      - 'coordination/kidults/bootstrap/**'
      - 'scripts/kidults/registry/**'
      - 'scripts/kidults/coordination/**'
      - '.github/workflows/kidults-operational-registry-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Validate shared coordination baseline
        run: node scripts/kidults/coordination/validate-coordination.mjs

      - name: Validate operational registry indexes and records
        run: node scripts/kidults/registry/validate-operational-registry.mjs
