name: KIDULTS Intelligence Runtime Contract v1

on:
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/runtime/**'
      - 'coordination/kidults/market/current-sold-value-chain-readiness-v1.json'
      - 'scripts/kidults/runtime/**'
      - 'scripts/kidults/source-intelligence/global-sold-source-registry-v1.mjs'
      - 'scripts/kidults/source-intelligence/source-intelligence-evidence-manifest-v1.mjs'
      - 'tests/kidults/source-intelligence/source-intelligence-writer-snapshot-v1.test.mjs'
      - 'coordination/kidults/source-intelligence/global-sold-source-registry*.json'
      - 'coordination/kidults/source-intelligence/source-intelligence-evidence-manifest-contract-v1.json'
      - 'scripts/kidults/market/current-sold-*.mjs'
      - 'tests/kidults/market/current-sold-*.mjs'
      - 'tests/kidults/runtime/**'
      - 'scripts/production/**'
      - 'contracts/certification/**'
      - 'coordination/kidults/source-intelligence/current-sold-sample-governance-v1.json'
      - '.github/workflows/kidults-kir-runtime-contract-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/runtime/**'
      - 'coordination/kidults/market/current-sold-value-chain-readiness-v1.json'
      - 'scripts/kidults/runtime/**'
      - 'scripts/kidults/source-intelligence/global-sold-source-registry-v1.mjs'
      - 'scripts/kidults/source-intelligence/source-intelligence-evidence-manifest-v1.mjs'
      - 'tests/kidults/source-intelligence/source-intelligence-writer-snapshot-v1.test.mjs'
      - 'coordination/kidults/source-intelligence/global-sold-source-registry*.json'
      - 'coordination/kidults/source-intelligence/source-intelligence-evidence-manifest-contract-v1.json'
      - 'scripts/kidults/market/current-sold-*.mjs'
      - 'tests/kidults/market/current-sold-*.mjs'
      - 'tests/kidults/runtime/**'
      - 'scripts/production/**'
      - 'contracts/certification/**'
      - 'coordination/kidults/source-intelligence/current-sold-sample-governance-v1.json'
      - '.github/workflows/kidults-kir-runtime-contract-v1.yml'

permissions:
  contents: read

concurrency:
  group: kidults-kir-runtime-contract-v1-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-kir-runtime-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KIR_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KIR_RECEIPT_PATH: /tmp/kidults-kir-runtime-terminal-receipt-v1.json
    steps:
      - name: Initialize fail-closed KIR terminal receipt
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          cat > /tmp/kidults-kir-runtime-terminal-receipt-v1.json <<EOF
          {
            "id":"kidults-kir-runtime-terminal-v1",
            "version":"1.0.0",
            "receipt_class":"WORKFLOW_FAIL_CLOSED_BOOTSTRAP",
            "state":"VERIFIED_FAIL",
            "overall_state":"RED",
            "repository":"${GITHUB_REPOSITORY}",
            "source_sha":"${EXPECTED_HEAD_SHA}",
            "run_id":"${GITHUB_RUN_ID}",
            "run_attempt":"${GITHUB_RUN_ATTEMPT}",
            "trigger_event":"${GITHUB_EVENT_NAME}",
            "failed_check_ids":["KIR_WORKFLOW_NOT_RECONCILED"],
            "first_failed_stage":"KIR_WORKFLOW_NOT_RECONCILED",
            "promotion_eligible":false,
            "runtime_activation_authorized":false,
            "empirical_authority":false,
            "database_authority":false,
            "provider_authority":false,
            "public_release":"HOLD",
            "production":"HOLD",
            "g5":"HOLD"
          }
          EOF
          cp /tmp/kidults-kir-runtime-terminal-receipt-v1.json /tmp/kidults-kir-runtime-evaluation-v1.json
          cp /tmp/kidults-kir-runtime-terminal-receipt-v1.json /tmp/kidults-kir-current-sold-control-receipt-v1.json
          cp /tmp/kidults-kir-runtime-terminal-receipt-v1.json /tmp/kidults-kir-ledger-control-receipt-v1.json
          cp /tmp/kidults-kir-runtime-terminal-receipt-v1.json /tmp/kidults-kir-readiness-control-receipt-v1.json

      - name: Checkout exact candidate head
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up pinned Node
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate KIR contract syntax, RACI structure and static truth
        id: validate_contract
        run: |
          set -euo pipefail
          node --check scripts/kidults/runtime/kir-runtime-kernel-v1.mjs
          node --check scripts/kidults/runtime/validate-kir-readiness-structure-v1.mjs
          node --check tests/kidults/runtime/kir-runtime-v1.test.mjs
          node --check tests/kidults/runtime/kir-integration-boundary-v1.test.mjs
          node --check scripts/kidults/runtime/kir-current-sold-control-bridge-v1.mjs
          node --check tests/kidults/runtime/kir-current-sold-control-fixtures-v1.mjs
          node --check tests/kidults/runtime/kir-current-sold-control-bridge-v1.test.mjs
          node --check scripts/kidults/market/current-sold-postgres-ledger-v1.mjs
          node --check tests/kidults/runtime/kir-memory-ledger-client-v1.mjs
          node --check tests/kidults/runtime/kir-ledger-control-probe-v1.mjs
          node --check tests/kidults/runtime/kir-ledger-control-v1.test.mjs
          node --check scripts/kidults/runtime/kir-readiness-evidence-intake-v1.mjs
          node --check tests/kidults/runtime/kir-readiness-control-probe-v1.mjs
          node scripts/kidults/runtime/validate-kir-readiness-structure-v1.mjs --self-test
          node scripts/kidults/runtime/validate-kir-readiness-structure-v1.mjs
          node scripts/kidults/runtime/kir-runtime-kernel-v1.mjs --validate

      - name: Run KIR negative regression suite
        id: regression
        run: |
          set -euo pipefail
          node --test tests/kidults/runtime/kir-runtime-v1.test.mjs tests/kidults/runtime/kir-integration-boundary-v1.test.mjs tests/kidults/runtime/kir-current-sold-control-bridge-v1.test.mjs tests/kidults/runtime/kir-ledger-control-v1.test.mjs tests/kidults/market/current-sold-postgres-ledger-v1.test.mjs tests/kidults/market/current-sold-postgres-ledger-atomic-recompute-v1.test.mjs tests/kidults/runtime/kir-readiness-evidence-intake-v1.test.mjs tests/kidults/source-intelligence/global-sold-source-registry-v1.test.mjs tests/kidults/source-intelligence/source-intelligence-evidence-manifest-v1.test.mjs tests/kidults/source-intelligence/source-intelligence-writer-snapshot-v1.test.mjs

      - name: Evaluate exact-head KIR runtime truth
        id: evaluate
        run: |
          set -euo pipefail
          node scripts/kidults/runtime/kir-runtime-kernel-v1.mjs --evaluate | tee /tmp/kidults-kir-runtime-evaluation-v1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const x=JSON.parse(fs.readFileSync(process.env.KIR_RECEIPT_PATH,'utf8'));
          assert.equal(x.state,'CONTROL_VALIDATED_EMPIRICAL_BLOCKED');
          assert.equal(x.source_sha,process.env.KIR_SOURCE_SHA);
          assert.equal(x.repository,process.env.GITHUB_REPOSITORY);
          assert.equal(x.run_id,Number(process.env.GITHUB_RUN_ID));
          assert.equal(x.run_attempt,Number(process.env.GITHUB_RUN_ATTEMPT));
          assert.equal(x.trigger_event,process.env.GITHUB_EVENT_NAME);
          assert.equal(x.receipt_scope,'KIR_CONTROL_CONTRACT_ONLY_NOT_PLATFORM_HEALTH');
          assert.equal(x.readiness_is_live_empirical_proof,false);
          for(const key of ['promotion_eligible','runtime_activation_authorized','empirical_authority','database_authority','provider_authority']) assert.equal(x[key],false);
          for(const key of ['public_release','production','g5']) assert.equal(x[key],'HOLD');
          assert.ok(Array.isArray(x.blockers)&&x.blockers.length>=5);
          NODE

      - name: Exercise real Current-SOLD atomic engine under synthetic KIR control boundary
        id: bridge
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { evaluateKirCurrentSoldControl } from './scripts/kidults/runtime/kir-current-sold-control-bridge-v1.mjs';
          import { canonicalJsonDigest } from './scripts/kidults/market/current-sold-batch-v1.mjs';
          import { controlFixture, rebindRegistry } from './tests/kidults/runtime/kir-current-sold-control-fixtures-v1.mjs';
          const identity = {repository:process.env.GITHUB_REPOSITORY,source_sha:process.env.KIR_SOURCE_SHA,run_id:Number(process.env.GITHUB_RUN_ID),run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),trigger_event:process.env.GITHUB_EVENT_NAME};
          const valid = evaluateKirCurrentSoldControl(controlFixture(identity));
          const mixed = controlFixture(identity,2);
          mixed.receiptRegistry.acquisitions.pop();
          const rejected = evaluateKirCurrentSoldControl(rebindRegistry(mixed));
          assert.equal(valid.state,'CONTROL_CHAIN_VALIDATED_EMPIRICAL_BLOCKED');
          assert.equal(valid.control_counts.admitted,1);
          assert.equal(valid.control_counts.evidence,1);
          assert.equal(rejected.state,'CONTROL_INPUT_REJECTED');
          assert.equal(rejected.engine_control_status,'PARTIAL_FAIL_CLOSED');
          assert.equal(rejected.control_counts.admitted,0);
          assert.equal(rejected.control_counts.evidence,0);
          const kir = JSON.parse(fs.readFileSync(process.env.KIR_RECEIPT_PATH,'utf8'));
          for (const result of [valid,rejected]) {
            assert.equal(result.kir_receipt_sha256,canonicalJsonDigest(kir));
            assert.equal(result.empirical_current_sold_delta,0);
            assert.equal(result.ledger_write_eligible,false);
            assert.equal(result.database_authority,false);
            assert.equal(result.promotion_eligible,false);
          }
          const packet = {
            id:'kidults-kir-current-sold-control-integration-v1',version:'1.0.0',
            state:'VERIFIED_PASS',scope:'SYNTHETIC_KIR_ATOMIC_EVIDENCE_INTEGRATION_ONLY',
            ...identity,case_count:2,cases:{valid,rejected},
            empirical_current_sold_delta:0,postgres_rows_written:0,
            provider_authority:false,database_authority:false,empirical_authority:false,
            runtime_activation_authorized:false,producer_health_authority:false,promotion_eligible:false,
            public_release:'HOLD',production:'HOLD',g5:'HOLD'
          };
          fs.writeFileSync('/tmp/kidults-kir-current-sold-control-receipt-v1.json',JSON.stringify(packet,null,2)+'\n');
          console.log(JSON.stringify(packet,null,2));
          NODE

      - name: Exercise real ledger writer with isolated synthetic SQL test transport
        id: ledger_bridge
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { runKirLedgerControlProbe } from './tests/kidults/runtime/kir-ledger-control-probe-v1.mjs';
          const identity = {repository:process.env.GITHUB_REPOSITORY,source_sha:process.env.KIR_SOURCE_SHA,run_id:Number(process.env.GITHUB_RUN_ID),run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),trigger_event:process.env.GITHUB_EVENT_NAME};
          const packet = await runKirLedgerControlProbe(identity);
          fs.writeFileSync('/tmp/kidults-kir-ledger-control-receipt-v1.json',JSON.stringify(packet,null,2)+'\n');
          console.log(JSON.stringify(packet,null,2));
          NODE

      - name: Exercise readiness composer and full member closure with synthetic controls
        id: readiness
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { runKirReadinessControlProbe } from './tests/kidults/runtime/kir-readiness-control-probe-v1.mjs';
          const identity={repository:process.env.GITHUB_REPOSITORY,source_sha:process.env.KIR_SOURCE_SHA,run_id:Number(process.env.GITHUB_RUN_ID),run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),trigger_event:process.env.GITHUB_EVENT_NAME};
          const packet=runKirReadinessControlProbe(identity);
          fs.writeFileSync('/tmp/kidults-kir-readiness-control-receipt-v1.json',JSON.stringify(packet,null,2)+'\n');
          console.log(JSON.stringify(packet));
          NODE

      - name: Reconcile exact-head KIR workflow terminal truth
        id: reconcile
        if: ${{ always() }}
        shell: bash
        env:
          INIT_OUTCOME: ${{ steps.initialize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          EXACT_HEAD_OUTCOME: ${{ steps.exact_head.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          VALIDATE_CONTRACT_OUTCOME: ${{ steps.validate_contract.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          LEDGER_OUTCOME: ${{ steps.ledger_bridge.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, hashlib, re
          from pathlib import Path
          receipt_path=Path('/tmp/kidults-kir-runtime-terminal-receipt-v1.json')
          evaluation_path=Path('/tmp/kidults-kir-runtime-evaluation-v1.json')
          bridge_path=Path('/tmp/kidults-kir-current-sold-control-receipt-v1.json')
          ledger_path=Path('/tmp/kidults-kir-ledger-control-receipt-v1.json')
          readiness_path=Path('/tmp/kidults-kir-readiness-control-receipt-v1.json')
          stages=[
            ('INITIALIZE',os.environ.get('INIT_OUTCOME','')),
            ('CHECKOUT',os.environ.get('CHECKOUT_OUTCOME','')),
            ('EXACT_HEAD',os.environ.get('EXACT_HEAD_OUTCOME','')),
            ('SETUP_NODE',os.environ.get('SETUP_NODE_OUTCOME','')),
            ('VALIDATE_CONTRACT',os.environ.get('VALIDATE_CONTRACT_OUTCOME','')),
            ('REGRESSION',os.environ.get('REGRESSION_OUTCOME','')),
            ('EVALUATE',os.environ.get('EVALUATE_OUTCOME','')),
            ('BRIDGE',os.environ.get('BRIDGE_OUTCOME','')),
            ('LEDGER',os.environ.get('LEDGER_OUTCOME','')),
            ('READINESS',os.environ.get('READINESS_OUTCOME','')),
          ]
          failed=[name for name,outcome in stages if outcome!='success']
          if not failed:
            try:
              data=json.loads(receipt_path.read_text())
              assert data['state']=='CONTROL_VALIDATED_EMPIRICAL_BLOCKED'
              assert data['source_sha']==os.environ['EXPECTED_HEAD_SHA']
              assert data['repository']==os.environ['GITHUB_REPOSITORY']
              assert data['run_id']==int(os.environ['GITHUB_RUN_ID'])
              assert data['run_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
              assert data['trigger_event']==os.environ['GITHUB_EVENT_NAME']
              assert data['receipt_scope']=='KIR_CONTROL_CONTRACT_ONLY_NOT_PLATFORM_HEALTH'
              assert data['readiness_is_live_empirical_proof'] is False
              for key in ('promotion_eligible','runtime_activation_authorized','empirical_authority','database_authority','provider_authority'):
                assert data[key] is False
              for key in ('public_release','production','g5'):
                assert data[key]=='HOLD'
              bridge_bytes=bridge_path.read_bytes()
              bridge=json.loads(bridge_bytes)
              assert bridge['id']=='kidults-kir-current-sold-control-integration-v1'
              assert bridge['state']=='VERIFIED_PASS' and bridge['case_count']==2
              assert set(bridge['cases'])=={'valid','rejected'}
              kir_digest='sha256:'+hashlib.sha256(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
              for item in (bridge,bridge['cases']['valid'],bridge['cases']['rejected']):
                for key in ('repository','source_sha','run_id','run_attempt','trigger_event'):
                  assert item[key]==data[key]
                assert item['scope']=='SYNTHETIC_KIR_ATOMIC_EVIDENCE_INTEGRATION_ONLY'
                assert item['empirical_current_sold_delta']==0 and item['postgres_rows_written']==0
                for key in ('provider_authority','database_authority','empirical_authority','runtime_activation_authorized','producer_health_authority','promotion_eligible'):
                  assert item[key] is False
                for key in ('public_release','production','g5'):
                  assert item[key]=='HOLD'
              for case in bridge['cases'].values():
                assert case['kir_receipt_sha256']==kir_digest
                for key in ('raw_rows_emitted','raw_evidence_emitted','bundle_emitted','ledger_write_eligible','track_b_started','projection_approved'):
                  assert case[key] is False
              assert bridge['cases']['valid']['state']=='CONTROL_CHAIN_VALIDATED_EMPIRICAL_BLOCKED'
              assert bridge['cases']['valid']['control_counts']['admitted']==1
              assert bridge['cases']['valid']['control_counts']['evidence']==1
              assert bridge['cases']['rejected']['state']=='CONTROL_INPUT_REJECTED'
              assert bridge['cases']['rejected']['engine_control_status']=='PARTIAL_FAIL_CLOSED'
              assert bridge['cases']['rejected']['control_counts']['admitted']==0
              assert bridge['cases']['rejected']['control_counts']['evidence']==0
              ledger_bytes=ledger_path.read_bytes()
              ledger=json.loads(ledger_bytes)
              expected_fields={'id','version','state','scope','database_transport','repository','source_sha','run_id','run_attempt','trigger_event','kir_receipt_sha256','simulated_batch_receipt_sha256','case_count','cases','empirical_current_sold_delta','postgres_rows_written','provider_authority','database_authority','empirical_authority','runtime_activation_authorized','producer_health_authority','promotion_eligible','raw_rows_emitted','raw_evidence_emitted','bundle_emitted','track_b_started','projection_approved','public_release','production','g5'}
              assert set(ledger)==expected_fields
              assert ledger['id']=='kidults-kir-ledger-control-integration-v1' and ledger['version']=='1.0.0'
              assert ledger['state']=='VERIFIED_PASS' and type(ledger['case_count']) is int and ledger['case_count']==5
              assert ledger['scope']=='SYNTHETIC_KIR_ATOMIC_EVIDENCE_LEDGER_CONTROL_ONLY'
              assert ledger['database_transport']=='IN_MEMORY_TEST_DOUBLE_NOT_POSTGRESQL'
              for key in ('repository','source_sha','run_id','run_attempt','trigger_event'):
                assert type(ledger[key]) is type(data[key]) and ledger[key]==data[key]
              assert ledger['kir_receipt_sha256']==kir_digest
              assert re.fullmatch(r'sha256:[0-9a-f]{64}',ledger['simulated_batch_receipt_sha256'])
              for key in ('empirical_current_sold_delta','postgres_rows_written'):
                assert type(ledger[key]) is int and ledger[key]==0
              for key in ('provider_authority','database_authority','empirical_authority','runtime_activation_authorized','producer_health_authority','promotion_eligible','raw_rows_emitted','raw_evidence_emitted','bundle_emitted','track_b_started','projection_approved'):
                assert ledger[key] is False
              for key in ('public_release','production','g5'):
                assert ledger[key]=='HOLD'
              expected_cases={
                'write_and_readback':{'simulated_events':5,'simulated_evidence':5,'simulated_receipts':1,'exact_lineage_verified':True},
                'replay':{'simulated_new_rows':0,'simulated_events_idempotent':5,'simulated_evidence_idempotent':5,'simulated_receipts_idempotent':1},
                'partial_batch':{'sql_calls':0,'admitted':0,'evidence':0},
                'evidence_failure':{'failure_at':'evidence-insert-v1','simulation_rollback_verified':True,'simulated_residual_rows':0},
                'receipt_failure':{'failure_at':'receipt-insert-v1','simulation_rollback_verified':True,'simulated_residual_rows':0}
              }
              assert json.dumps(ledger['cases'],sort_keys=True,separators=(',',':'))==json.dumps(expected_cases,sort_keys=True,separators=(',',':'))
              readiness_bytes=readiness_path.read_bytes()
              readiness=json.loads(readiness_bytes)
              assert set(readiness)=={'id','version','state','scope','repository','source_sha','run_id','run_attempt','trigger_event','kir_receipt_sha256','case_count','cases','input_class','natural_runs_observed','empirical_current_sold_delta','postgres_rows_written','staging_business_workload_verified','production_readiness_verified','provider_authority','database_authority','empirical_authority','runtime_activation_authorized','producer_health_authority','promotion_eligible','public_release','production','g5'}
              assert readiness['id']=='kidults-kir-readiness-control-integration-v1'
              assert readiness['version']=='1.0.0' and readiness['state']=='VERIFIED_PASS'
              assert readiness['scope']=='SYNTHETIC_KIR_READINESS_COMPOSER_AND_MEMBER_GATE_ONLY'
              assert readiness['input_class']=='SYNTHETIC_TEST_FIXTURE_NOT_LIVE_EVIDENCE'
              for key in ('repository','source_sha','run_id','run_attempt','trigger_event'):
                assert type(readiness[key]) is type(data[key]) and readiness[key]==data[key]
              assert readiness['kir_receipt_sha256']==kir_digest
              assert type(readiness['case_count']) is int and readiness['case_count']==2
              assert readiness['cases']=={'composer_to_member_gate':True,'missing_staging_member_rejected':True}
              assert all(v is True for v in readiness['cases'].values())
              for key in ('natural_runs_observed','empirical_current_sold_delta','postgres_rows_written'):
                assert type(readiness[key]) is int and readiness[key]==0
              for key in ('staging_business_workload_verified','production_readiness_verified','provider_authority','database_authority','empirical_authority','runtime_activation_authorized','producer_health_authority','promotion_eligible'):
                assert readiness[key] is False
              for key in ('public_release','production','g5'):
                assert readiness[key]=='HOLD'
              data['readiness_control_integration']={'state':'VERIFIED_PASS','scope':readiness['scope'],'case_count':2,'receipt_file_sha256':'sha256:'+hashlib.sha256(readiness_bytes).hexdigest(),'staging_business_workload_verified':False,'production_readiness_verified':False,'promotion_eligible':False}
              data['ledger_control_integration']={
                'state':'VERIFIED_PASS','scope':ledger['scope'],'case_count':5,
                'database_transport':ledger['database_transport'],
                'ledger_receipt_file_sha256':'sha256:'+hashlib.sha256(ledger_bytes).hexdigest(),
                'empirical_current_sold_delta':0,'postgres_rows_written':0,'database_authority':False,'promotion_eligible':False
              }
              data['current_sold_control_integration']={
                'state':'VERIFIED_PASS','scope':bridge['scope'],'case_count':2,
                'bridge_receipt_file_sha256':'sha256:'+hashlib.sha256(bridge_bytes).hexdigest(),
                'empirical_current_sold_delta':0,'database_authority':False,'promotion_eligible':False
              }
              receipt_path.write_text(json.dumps(data,indent=2)+'\n')
              evaluation_path.write_text(json.dumps(data,indent=2)+'\n')
            except (OSError,ValueError,KeyError,TypeError,AssertionError):
              failed=['KIR_SUCCESS_RECEIPT_INVALID']
          if failed:
            receipt={
              'id':'kidults-kir-runtime-terminal-v1','version':'1.0.0',
              'receipt_class':'WORKFLOW_FAIL_CLOSED_TERMINAL','state':'VERIFIED_FAIL','overall_state':'RED',
              'repository':os.environ['GITHUB_REPOSITORY'],'source_sha':os.environ['EXPECTED_HEAD_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'trigger_event':os.environ['GITHUB_EVENT_NAME'],'failed_check_ids':failed,
              'first_failed_stage':failed[0],'stage_outcomes':dict(stages),
              'promotion_eligible':False,'runtime_activation_authorized':False,
              'empirical_authority':False,'database_authority':False,'provider_authority':False,
              'public_release':'HOLD','production':'HOLD','g5':'HOLD'
            }
            receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
            evaluation_path.write_text(json.dumps(receipt,indent=2)+'\n')
            raise SystemExit(1)
          PY
          test -s /tmp/kidults-kir-runtime-terminal-receipt-v1.json
          test -s /tmp/kidults-kir-runtime-evaluation-v1.json

      - name: Upload exact-head KIR terminal packet
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-kir-runtime-contract-v1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/kidults-kir-runtime-terminal-receipt-v1.json
            /tmp/kidults-kir-runtime-evaluation-v1.json
            /tmp/kidults-kir-current-sold-control-receipt-v1.json
            /tmp/kidults-kir-ledger-control-receipt-v1.json
            /tmp/kidults-kir-readiness-control-receipt-v1.json
          retention-days: 90
          if-no-files-found: error
