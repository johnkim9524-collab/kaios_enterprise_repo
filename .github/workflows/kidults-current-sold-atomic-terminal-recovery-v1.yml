name: KIDULTS Current-SOLD Atomic Terminal Recovery V1
run-name: KIDULTS Current-SOLD terminal recovery / ${{ github.event_name }} / ${{ github.run_id }}

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kidults-current-sold-atomic-terminal-recovery-v1.yml'
      - '.github/workflows/kidults-atomic-governed-landing-v1.yml'
      - 'scripts/kidults/market/current-sold-atomic-terminal-recovery-v1.mjs'
      - 'scripts/kidults/kpmo/reconcile-atomic-landing-terminal-v1.mjs'
      - 'coordination/kidults/market/current-sold-atomic-terminal-recovery-33603816578-v1.json'
  workflow_dispatch:

concurrency:
  group: kidults-current-sold-atomic-terminal-recovery-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-bootstrap-contract:
    name: Validate premerge workflow to candidate terminal handoff compatibility
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Checkout exact protected-main base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Verify exact candidate and base SHAs
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C base rev-parse HEAD)" = "$EXPECTED_BASE_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false

      - name: Run terminal recovery and bootstrap mutation self-tests
        run: node candidate/scripts/kidults/market/current-sold-atomic-terminal-recovery-v1.mjs --self-test

      - name: Reject same-PR hard terminal handoff bootstrap
        run: |
          node candidate/scripts/kidults/market/current-sold-atomic-terminal-recovery-v1.mjs \
            --validate-contract \
            base/.github/workflows/kidults-atomic-governed-landing-v1.yml \
            candidate/.github/workflows/kidults-atomic-governed-landing-v1.yml \
            candidate/scripts/kidults/kpmo/reconcile-atomic-landing-terminal-v1.mjs

  recover-predecessor-terminal:
    name: Recover exact predecessor terminal proof without remerge
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout current protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify current protected-main execution
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          check-latest: false

      - name: Revalidate durable evidence and publish recovered terminal status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ATOMIC_TERMINAL_RECOVERY_RECEIPT_PATH: out/atomic-terminal-recovery/receipt.json
        run: >-
          node scripts/kidults/market/current-sold-atomic-terminal-recovery-v1.mjs
          --recover
          coordination/kidults/market/current-sold-atomic-terminal-recovery-33603816578-v1.json

      - name: Upload durable recovered terminal receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-atomic-terminal-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/atomic-terminal-recovery/receipt.json
          if-no-files-found: error
          retention-days: 90
