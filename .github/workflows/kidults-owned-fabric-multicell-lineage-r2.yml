name: KIDULTS Owned Fabric Multi-Cell Lineage R2

on:
  pull_request:
    paths:
      - 'scripts/kidults/architecture/build-owned-fabric-multicell-lineage-r2.mjs'
      - 'scripts/kidults/architecture/validate-owned-fabric-multicell-lineage-r2.mjs'
      - 'coordination/kidults/source-intelligence/rights-admitted-pilot-source-pool-r1.json'
      - 'coordination/kidults/source-intelligence/rights-admitted-transaction-source-pool-r1.json'
      - 'coordination/kidults/source-intelligence/collectaio-shadow-sold-admission-r1.json'
      - 'artifacts/agci-os/asi-shadow-operating-evidence-v1.json'
      - '.github/workflows/kidults-owned-fabric-multicell-lineage-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build three-cell bounded lineage R2
        run: node scripts/kidults/architecture/build-owned-fabric-multicell-lineage-r2.mjs /tmp/kidults-owned-fabric-multicell-lineage-r2.json
      - name: Validate dated-SOLD internal fail-closed truth
        run: node scripts/kidults/architecture/validate-owned-fabric-multicell-lineage-r2.mjs /tmp/kidults-owned-fabric-multicell-lineage-r2.json
