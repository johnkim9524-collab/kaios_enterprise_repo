name: KIDULTS AGCI-OS Candidate R2 Reference Observer HOLD

on:
  pull_request:
    branches: [main]
    paths:
      - "coordination/kidults/autonomous/source-discovery/contracts/met-costume-open-access-r1.json"
      - "scripts/kidults/autonomous/collect-met-open-access-sample.mjs"
      - "scripts/kidults/autonomous/validate-met-open-access-sample.mjs"
      - "scripts/kidults/engine-v2/observe-met-reference-discovery-r2.mjs"
      - "scripts/kidults/engine-v2/test-met-reference-discovery-r2.mjs"
      - ".github/workflows/kidults-autonomous-met-sample.yml"
      - ".github/workflows/kidults-agci-os-candidate-r2-preflight.yml"
  push:
    branches: [main]
    paths:
      - "coordination/kidults/autonomous/source-discovery/contracts/met-costume-open-access-r1.json"
      - "scripts/kidults/autonomous/collect-met-open-access-sample.mjs"
      - "scripts/kidults/autonomous/validate-met-open-access-sample.mjs"
      - "scripts/kidults/engine-v2/observe-met-reference-discovery-r2.mjs"
      - "scripts/kidults/engine-v2/test-met-reference-discovery-r2.mjs"
      - ".github/workflows/kidults-autonomous-met-sample.yml"
      - ".github/workflows/kidults-agci-os-candidate-r2-preflight.yml"

permissions:
  contents: read

concurrency:
  group: kidults-candidate-r2-reference-observer-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  observer-hold:
    name: Candidate R2 Reference Observer — HOLD / No Admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Prove fail-closed observer regressions offline
        run: |
          set -euo pipefail
          node --check scripts/kidults/engine-v2/observe-met-reference-discovery-r2.mjs
          node --check scripts/kidults/engine-v2/test-met-reference-discovery-r2.mjs
          node scripts/kidults/engine-v2/test-met-reference-discovery-r2.mjs
      - name: Record Candidate R2 HOLD without provider calls or committed shadows
        run: |
          node scripts/kidults/engine-v2/observe-met-reference-discovery-r2.mjs \
            --output artifacts/agci-os/candidate-r2-reference-observer-r1
      - name: Enforce no-admission receipt
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('artifacts/agci-os/candidate-r2-reference-observer-r1/candidate-r2-observer-receipt.json'));
          if (receipt.state !== 'HOLD_NO_GOVERNED_MET_RECEIPT' ||
              receipt.observer_provider_call_count !== 0 ||
              receipt.observer_credential_count !== 0 ||
              receipt.committed_met_shadow_input_count !== 0 ||
              receipt.committed_vam_shadow_input_count !== 0 ||
              receipt.vam_provider_call_count !== 0 ||
              receipt.current_sold_observation_count !== 0 ||
              receipt.canonical_candidate_state !== 'NONE' ||
              receipt.canonical_evidence_state !== 'NONE' ||
              receipt.track_b_state !== 'NOT_STARTED' ||
              receipt.approved_projection_state !== 'NONE' ||
              receipt.publication !== 'HOLD' || receipt.production !== 'HOLD' || receipt.g5 !== 'HOLD') {
            throw new Error('CANDIDATE_R2_OBSERVER_HOLD_BOUNDARY_FAILED');
          }
          NODE
      - name: Upload exactly one observer HOLD artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-candidate-r2-reference-observer-hold-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/agci-os/candidate-r2-reference-observer-r1
          if-no-files-found: error
          retention-days: 30
