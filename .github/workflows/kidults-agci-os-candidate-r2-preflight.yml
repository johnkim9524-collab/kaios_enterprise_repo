name: KIDULTS AGCI-OS Candidate R2 Rights HOLD

on:
  push:
    branches:
      - main
    paths:
      - "coordination/kidults/autonomous/source-discovery/contracts/vam-fashion-collections-r1.json"
      - "scripts/kidults/autonomous/collect-met-open-access-sample.mjs"
      - "scripts/kidults/autonomous/collect-vam-fashion-sample.mjs"
      - "scripts/kidults/autonomous/validate-vam-fashion-sample.mjs"
      - "scripts/kidults/engine-v2/validate-candidate-r2-live-public-metadata-pathway-v1.mjs"
      - "scripts/kidults/engine-v2/test-met-vam-candidate-r2-live-pathway-v1.mjs"
      - ".github/workflows/kidults-agci-os-candidate-r2-preflight.yml"
  schedule:
    - cron: "5 0 * * 3,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-candidate-r2-vam-hard-hold
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Syntax check
        run: |
          node --check scripts/kidults/autonomous/collect-met-open-access-sample.mjs
          node --check scripts/kidults/autonomous/collect-vam-fashion-sample.mjs
          node --check scripts/kidults/autonomous/validate-vam-fashion-sample.mjs
          node --check scripts/kidults/engine-v2/validate-candidate-r2-live-public-metadata-pathway-v1.mjs
          node --check scripts/kidults/engine-v2/test-met-vam-candidate-r2-live-pathway-v1.mjs

      - name: Run offline Met and V&A rights-lineage negative tests
        run: node scripts/kidults/engine-v2/test-met-vam-candidate-r2-live-pathway-v1.mjs

      - name: Enforce V&A external-verifier hard HOLD before provider call
        id: vam_rights
        shell: bash
        run: |
          set +e
          node scripts/kidults/autonomous/collect-vam-fashion-sample.mjs \
            --output artifacts/autonomous-source-samples/vam-fashion-collections-r1 \
            --query dress \
            --limit 12 \
            --minimum-records 8
          collector_status=$?
          set -e
          if [ -f artifacts/autonomous-source-samples/vam-fashion-collections-r1/run-manifest.json ]; then
            manifest_status="$(node -e "const r=require('./artifacts/autonomous-source-samples/vam-fashion-collections-r1/run-manifest.json');process.stdout.write(r.status)")"
          else
            manifest_status='NO_TERMINAL_ARTIFACT'
          fi
          echo "collector_status=$collector_status" >> "$GITHUB_OUTPUT"
          echo "manifest_status=$manifest_status" >> "$GITHUB_OUTPUT"
          node scripts/kidults/autonomous/validate-vam-fashion-sample.mjs \
            artifacts/autonomous-source-samples/vam-fashion-collections-r1

      - name: Record Candidate R2 governed V&A HOLD without additional provider calls
        if: always() && steps.vam_rights.outputs.manifest_status == 'HOLD_EXTERNAL_RIGHTS_VERIFIER_NOT_IMPLEMENTED' && steps.vam_rights.outputs.collector_status != '0'
        shell: bash
        env:
          VAM_COLLECTOR_STATUS: ${{ steps.vam_rights.outputs.collector_status }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/agci-os/candidate-r2-preflight-r1
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const manifestPath = './artifacts/autonomous-source-samples/vam-fashion-collections-r1/run-manifest.json';
          const manifestRaw = fs.readFileSync(manifestPath);
          const vam = JSON.parse(manifestRaw);
          if (vam.status !== 'HOLD_EXTERNAL_RIGHTS_VERIFIER_NOT_IMPLEMENTED' || vam.provider_call_count !== 0 || vam.requests_executed !== 0 || vam.license_provenance_created !== false) {
            throw new Error('VAM_HARD_HOLD_RECEIPT_INVALID');
          }
          if (vam.runtime_lineage?.git_sha !== process.env.GITHUB_SHA ||
              vam.runtime_lineage?.github_run_id !== Number(process.env.GITHUB_RUN_ID) ||
              vam.runtime_lineage?.github_run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) {
            throw new Error('VAM_HARD_HOLD_RUNTIME_LINEAGE_MISMATCH');
          }
          const receipt = {
            id: 'candidate-r2-live-public-metadata-pathway-rights-hold-v1',
            version: '1.0.0',
            status: vam.status,
            generated_at: vam.completed_at,
            source_id: vam.source_id,
            provider_call_count: vam.provider_call_count,
            rights_scope_gate: vam.rights_scope_gate,
            license_contract_sha256: vam.license_contract_sha256,
            source_run_manifest_sha256: `sha256:${crypto.createHash('sha256').update(manifestRaw).digest('hex')}`,
            runtime_lineage: vam.runtime_lineage,
            met_call_performed_by_this_workflow: false,
            remaining_provider_calls_performed: 0,
            candidate_r2_activation: 'NOT_ACTIVATED_IMMUTABLE_PAIR_REQUIRED',
            immutable_candidate_evidence_pair_created: false,
            track_b_submission_count: 0,
            track_b_assessment_count: 0,
            track_b_pass_count: 0,
            publication: 'HOLD',
            production: 'HOLD',
            g5: 'HOLD'
          };
          receipt.receipt_fingerprint = `sha256:${crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex')}`;
          fs.writeFileSync('artifacts/agci-os/candidate-r2-preflight-r1/candidate-r2-pathway-rights-hold.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload Candidate R2 preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-agci-os-candidate-r2-rights-hold
          path: |
            artifacts/agci-os/candidate-r2-preflight-r1
            artifacts/autonomous-source-samples/vam-fashion-collections-r1
          if-no-files-found: error
          retention-days: 28

      - name: Enforce governed V&A HOLD as workflow RED
        if: always() && steps.vam_rights.outputs.manifest_status == 'HOLD_EXTERNAL_RIGHTS_VERIFIER_NOT_IMPLEMENTED' && steps.vam_rights.outputs.collector_status != '0'
        shell: bash
        run: |
          echo "V&A terminal state ${VAM_MANIFEST_STATUS}: provider call count remains zero and Candidate R2 remains HOLD." >&2
          exit 1
        env:
          VAM_MANIFEST_STATUS: ${{ steps.vam_rights.outputs.manifest_status }}

      - name: Enforce non-governance V&A failure without false HOLD receipt
        if: always() && steps.vam_rights.outputs.collector_status != '' && steps.vam_rights.outputs.collector_status != '0' && steps.vam_rights.outputs.manifest_status != 'HOLD_EXTERNAL_RIGHTS_VERIFIER_NOT_IMPLEMENTED'
        shell: bash
        env:
          VAM_MANIFEST_STATUS: ${{ steps.vam_rights.outputs.manifest_status }}
          VAM_COLLECTOR_STATUS: ${{ steps.vam_rights.outputs.collector_status }}
        run: |
          echo "V&A source read failed closed: status=${VAM_MANIFEST_STATUS}, collector_exit=${VAM_COLLECTOR_STATUS}. No rights-HOLD receipt was manufactured." >&2
          exit 1
