name: KIDULTS Scope Self-Collected Live Baseline v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope-data/scope-poc-anchor-selection-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'scripts/kidults/scope/run-scope-self-collected-live-baseline-v1.1.mjs'
      - 'scripts/kidults/scope/validate-scope-self-collected-live-baseline-v1.mjs'
      - 'scripts/kidults/scope/compile-scope-self-collection-gap-queue-v1.mjs'
      - 'scripts/kidults/scope/validate-scope-self-collection-gap-queue-v1.mjs'
      - '.github/workflows/kidults-scope-self-collected-live-baseline-v1.yml'
  workflow_dispatch:
concurrency:
  group: kidults-scope-self-collected-live-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  live-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Run 32-scope / 64-product bounded-concurrency open-metadata baseline
        run: node scripts/kidults/scope/run-scope-self-collected-live-baseline-v1.1.mjs coordination/kidults/scope-data/scope-poc-anchor-selection-v1.json coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json scope-poc-live-out
      - name: Validate fail-closed baseline
        run: node scripts/kidults/scope/validate-scope-self-collected-live-baseline-v1.mjs scope-poc-live-out
      - name: Compile next self-collection gap queue
        run: node scripts/kidults/scope/compile-scope-self-collection-gap-queue-v1.mjs scope-poc-live-out coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json
      - name: Validate self-collection gap queue
        run: node scripts/kidults/scope/validate-scope-self-collection-gap-queue-v1.mjs scope-poc-live-out
      - name: Upload immutable PoC baseline artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-scope-self-collected-live-baseline-v1
          path: scope-poc-live-out/
          if-no-files-found: error
          retention-days: 90
