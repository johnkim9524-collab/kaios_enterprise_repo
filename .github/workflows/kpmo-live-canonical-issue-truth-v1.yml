name: KPMO Live Canonical Issue Truth V1

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/kpmo-live-canonical-issue-truth-v1.yml"
      - "scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs"
      - "coordination/kidults/**"
  push:
    branches: [ main ]
  issues:
    types: [edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: kpmo-live-canonical-issue-truth-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  canonical-issue-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate live canonical issue truth
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PROTECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CANONICAL_CORRECTION_PR_NUMBER: '1418'
          EXPECTED_CORRECTION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1418 && github.event.pull_request.head.sha || '' }}
          REQUIRE_LIVE_CORRECTION_HEAD_IN_ISSUES: ${{ github.event_name != 'pull_request' }}
        run: node scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs
