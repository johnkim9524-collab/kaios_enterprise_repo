name: KPMO Live Canonical Issue Truth V1

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/kpmo-live-canonical-issue-truth-v1.yml"
      - ".github/workflows/kpmo-canonical-issue-transition-guard-v1.yml"
      - "scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs"
      - "scripts/kidults/kpmo/validate-canonical-truth-receipt-bootstrap-v1.mjs"
      - "coordination/kidults/**"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

# Whole-board truth is authoritative and must not be cancelled by issue-edit fan-out.
# PR validation may observe a newer main than its event base; strict native ruleset
# freshness remains authoritative for merge eligibility while this validator checks
# monotonic canonical truth against the live observed main.
concurrency:
  group: kpmo-live-canonical-issue-truth-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  canonical-issue-truth:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize fail-closed canonical-truth receipt
        shell: bash
        env:
          RECEIPT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RECEIPT_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/canonical-truth-receipt-v1.json" <<EOF
          {
            "receipt_id": "kpmo-live-canonical-issue-truth-receipt-v1",
            "version": "1.0.0",
            "workflow_name": "KPMO Live Canonical Issue Truth V1",
            "workflow_path": ".github/workflows/kpmo-live-canonical-issue-truth-v1.yml",
            "repository": "$GITHUB_REPOSITORY",
            "run_id": $GITHUB_RUN_ID,
            "run_attempt": $GITHUB_RUN_ATTEMPT,
            "head_sha": "$RECEIPT_HEAD_SHA",
            "event": "$RECEIPT_EVENT",
            "validation_outcome": "not_run",
            "state": "VERIFIED_FAIL",
            "failure_class": "VALIDATION_NOT_COMPLETED",
            "promotion_eligible": false,
            "production": "HOLD",
            "public": "HOLD"
          }
          EOF

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate bootstrap receipt contract
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/validate-canonical-truth-receipt-bootstrap-v1.mjs --self-test
          node scripts/kidults/kpmo/validate-canonical-truth-receipt-bootstrap-v1.mjs
      - name: Validate live canonical issue truth
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PROTECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          ALLOW_MAIN_ADVANCE_DURING_PR_VALIDATION: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          CANONICAL_CORRECTION_PR_NUMBER: '1431'
          EXPECTED_CORRECTION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1431 && github.event.pull_request.head.sha || '' }}
          REQUIRE_LIVE_CORRECTION_HEAD_IN_ISSUES: 'false'
        run: node scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs

      - name: Emit exact canonical-truth receipt
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          RECEIPT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RECEIPT_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VALIDATION_OUTCOME:-}" ]; then
            test -s "$RUNNER_TEMP/canonical-truth-receipt-v1.json"
            exit 0
          fi
          if [[ ! "$VALIDATION_OUTCOME" =~ ^(success|failure|cancelled|skipped)$ ]]; then
            echo "::error::unsupported canonical validation outcome: $VALIDATION_OUTCOME"
            exit 65
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const outcome = process.env.VALIDATION_OUTCOME;
          const receipt = {
            receipt_id: 'kpmo-live-canonical-issue-truth-receipt-v1',
            version: '1.0.0',
            workflow_name: 'KPMO Live Canonical Issue Truth V1',
            workflow_path: '.github/workflows/kpmo-live-canonical-issue-truth-v1.yml',
            repository: process.env.GITHUB_REPOSITORY,
            run_id: Number(process.env.GITHUB_RUN_ID),
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            head_sha: process.env.RECEIPT_HEAD_SHA,
            event: process.env.RECEIPT_EVENT,
            validation_outcome: outcome,
            state: outcome === 'success' ? 'VERIFIED_PASS' : 'VERIFIED_FAIL',
            failure_class: outcome === 'success' ? null : 'CANONICAL_VALIDATION_NON_SUCCESS',
            promotion_eligible: false,
            production: 'HOLD',
            public: 'HOLD'
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/canonical-truth-receipt-v1.json`, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload exact canonical-truth receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kpmo-live-canonical-issue-truth-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-truth-receipt-v1.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
