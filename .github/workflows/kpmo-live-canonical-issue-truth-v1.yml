name: KPMO Live Canonical Issue Truth V1

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/kpmo-live-canonical-issue-truth-v1.yml"
      - "scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs"
      - "scripts/kidults/kpmo/validate-canonical-truth-assurance-watch-v1.mjs"
      - "scripts/kidults/kpmo/validate-canonical-issue-concurrency-by-issue-v1.mjs"
      - "coordination/kidults/**"
  push:
    branches: [ main ]
  issues:
    types: [edited, reopened, closed]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

# Same-issue edits may supersede an older run, but edits to different canonical
# issues must never cancel one another. PRs remain isolated by exact head SHA;
# push/manual executions remain isolated by exact run ID.
concurrency:
  group: kpmo-live-canonical-issue-truth-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.head.sha) || github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  canonical-issue-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate issue-scoped concurrency contract
        run: node scripts/kidults/kpmo/validate-canonical-issue-concurrency-by-issue-v1.mjs
      - name: Validate live canonical issue truth
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANONICAL_VALIDATION_EVENT: ${{ github.event_name }}
          EXPECTED_PROTECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CANONICAL_TRUTH_PHASE: ${{ github.event_name == 'push' && 'TRANSITION' || github.event_name == 'pull_request' && 'PREMERGE' || 'SYNCHRONIZED' }}
          CANONICAL_CORRECTION_PR_NUMBER: '1443'
          EXPECTED_CORRECTION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1443 && github.event.pull_request.head.sha || '' }}
          REQUIRE_LIVE_CORRECTION_HEAD_IN_ISSUES: ${{ github.event_name == 'issues' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs

      - name: Emit exact canonical-truth receipt
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          RECEIPT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RECEIPT_EVENT: ${{ github.event_name }}
          RECEIPT_PHASE: ${{ github.event_name == 'push' && 'TRANSITION' || github.event_name == 'pull_request' && 'PREMERGE' || 'SYNCHRONIZED' }}
          RECEIPT_BODY_MAIN_SHA: ${{ steps.validate.outputs.canonical_body_main_sha || 'UNAVAILABLE' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const outcome=process.env.VALIDATION_OUTCOME;
          if(!['success','failure','cancelled','skipped'].includes(outcome))process.exit(65);
          const receipt={receipt_id:'kpmo-live-canonical-issue-truth-receipt-v1',version:'1.2.0',workflow_name:'KPMO Live Canonical Issue Truth V1',workflow_path:'.github/workflows/kpmo-live-canonical-issue-truth-v1.yml',repository:process.env.GITHUB_REPOSITORY,run_id:Number(process.env.GITHUB_RUN_ID),run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),head_sha:process.env.RECEIPT_HEAD_SHA,event:process.env.RECEIPT_EVENT,truth_phase:process.env.RECEIPT_PHASE,canonical_body_main_sha:process.env.RECEIPT_BODY_MAIN_SHA,validation_outcome:outcome,state:outcome==='success'?'VERIFIED_PASS':'VERIFIED_FAIL',promotion_eligible:false,production:'HOLD',public:'HOLD',g5:'HOLD'};
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/canonical-truth-receipt-v1.json`,`${JSON.stringify(receipt,null,2)}\n`);
          NODE
      - name: Upload exact canonical-truth receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kpmo-live-canonical-issue-truth-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-truth-receipt-v1.json
          if-no-files-found: error
          retention-days: 30
