name: KIDULTS Self-Collected Open Channel Expansion Wave 2
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope-data/self-collected-open-channel-topology-v2.json'
      - 'scripts/kidults/scope/run-self-collected-open-channel-expansion-v2.mjs'
      - 'scripts/kidults/scope/validate-self-collected-open-channel-expansion-v2.mjs'
      - '.github/workflows/kidults-self-collected-open-channel-expansion-wave2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  open-channel-wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Execute requirement-driven V&A and AIC channels
        run: node scripts/kidults/scope/run-self-collected-open-channel-expansion-v2.mjs coordination/kidults/scope-data/scope-poc-anchor-selection-v1.json coordination/kidults/scope-data/self-collected-open-channel-topology-v2.json scope-open-wave2-out
      - name: Validate rights and traceability invariants
        run: node scripts/kidults/scope/validate-self-collected-open-channel-expansion-v2.mjs scope-open-wave2-out
      - name: Upload immutable Wave 2 artifact
        uses: actions/upload-artifact@v6
        with:
          name: kidults-self-collected-open-channel-expansion-wave2
          path: scope-open-wave2-out/
          if-no-files-found: error
          retention-days: 90
