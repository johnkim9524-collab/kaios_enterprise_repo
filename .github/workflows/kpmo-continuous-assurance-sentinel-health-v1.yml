name: KPMO Continuous Assurance Exact-SHA Producer Health Sentinel V1

on:
  repository_dispatch:
    types: [kidults.natural.clock.sentinel.v1]
  # Only the causal final producer edge starts an authoritative Sentinel run.
  # The resolver still reads the complete four-producer cohort; non-final
  # completions must not create skipped Sentinel runs that poison exact-window
  # selection for Assurance/Gate.
  workflow_run:
    workflows:
      - 'KIDULTS ASI Requirement-to-Adapter Coverage v1'
    branches: [main]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kpmo-continuous-assurance-sentinel-health-v1.yml'
      - 'scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs'
      - 'scripts/kidults/kpmo/wait-exact-sha-producer-cohort-v1.mjs'
      - 'scripts/kidults/kpmo/run-exact-sha-producer-auto-convergence-v1.mjs'
      - 'scripts/kidults/kpmo/validate-sentinel-producer-content-v1.mjs'
      - 'scripts/kidults/kpmo/read-sentinel-artifact-v1.py'
      - 'scripts/kidults/kpmo/material-defect-registry-v3.mjs'
      - 'scripts/kidults/kpmo/canonical-generation-v3-lib.mjs'
      - 'scripts/kidults/kpmo/validate-live-canonical-issue-truth-v1.mjs'
      - 'scripts/kidults/kpmo/run-live-canonical-truth-terminal-v1.mjs'
      - '.github/workflows/kpmo-live-canonical-issue-truth-v1.yml'
      - 'tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs'
      - 'tests/kidults/kpmo/sentinel-snapshot-retry-v1.test.mjs'
      - 'tests/kidults/kpmo/whole-platform-*.test.mjs'
      - 'scripts/kidults/kpmo/collect-whole-platform-operating-proof-v1.mjs'
      - 'scripts/kidults/kpmo/lib/whole-platform-runtime-evidence-v1.mjs'
      - 'coordination/kidults/kpmo/whole-platform-operating-proof-v1.json'
      - 'scripts/kidults/kpmo/validate-sentinel-trigger-v1.mjs'
      - 'scripts/kidults/source-intelligence/native-workflow-run-identity-v1.mjs'
      - 'tests/kidults/source-intelligence/semantic-chain-native-run-identity-v1.test.mjs'
      - 'tests/kidults/kpmo/sentinel-trigger-v1.test.mjs'
      - 'scripts/kidults/kpmo/validate-sentinel-observation-v1.mjs'
      - 'tests/kidults/kpmo/sentinel-observation-v1.test.mjs'
      - '.github/workflows/kidults-platform-continuous-assurance-v1.yml'
      - 'tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs'
      - 'tests/kidults/kpmo/exact-sha-producer-auto-convergence-v1.test.mjs'
      - 'tests/kidults/kpmo/post-landing-terminal-lifecycle-v1.test.mjs'
      - 'scripts/kidults/kpmo/validate-governed-readiness-consumption-v1.mjs'
      - 'tests/kidults/kpmo/governed-readiness-consumption-v1.test.mjs'
      - '.github/workflows/kidults-autonomous-dispatcher-v1.yml'
      - 'coordination/kidults/kpmo/post-landing-platform-runtime-terminal-lifecycle-v1.json'
      - 'tests/kidults/kpmo/postmerge-content-authority-boundary-v1.test.mjs'
      - 'coordination/kidults/kpmo/direct-owner-postmerge-push-suite-policy-v1.json'
      - 'scripts/kidults/kpmo/consume-direct-owner-postmerge-push-suite-v1.mjs'
      - 'coordination/kidults/source-intelligence/asi-requirement-adapter-coverage-contract-v1.json'
      - '.github/workflows/kidults-asi-requirement-adapter-coverage-v1.yml'
      - 'coordination/kidults/schemas/asi-autonomous-resolution-artifact-binding-v1.schema.json'
      - 'coordination/kidults/source-intelligence/asi-autonomous-resolution-layer-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p1-market-event-adapter-runtime-contract-v1.json'
      - 'coordination/kidults/source-intelligence/targeted-high-authority-source-expansion-v1.psv'
      - 'coordination/kidults/source-intelligence/scope-registry-v1-to-v2-crosswalk-v1.json'
      - 'coordination/kidults/source-intelligence/asi-bonhams-cars-results-adapter-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-bonhams-cars-results-adapter-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave2-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave2-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave3-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave3-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave4-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-source-adapter-wave4-registry-v1.json'
      - 'coordination/kidults/source-intelligence/top16-empirical-activation-preflight-v1.json'
      - 'scripts/kidults/source-intelligence/build-asi-requirement-adapter-coverage-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/authority-chain-trigger-compatibility-v1.mjs'
      - 'coordination/kidults/governance/authority-chain-trigger-compatibility-v1.json'
      - 'tests/kidults/source-intelligence/authority-chain-trigger-compatibility-v1.test.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-requirement-adapter-coverage-v1.mjs'
      - 'scripts/kidults/source-intelligence/lib/source-purpose-rights-gate-v1.mjs'
      - 'scripts/kidults/source-intelligence/resolve-asi-requirement-adapter-coverage-canonical-guard-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-requirement-adapter-coverage-semantic-input-v1.mjs'
      - 'package.json'
      - 'npm-shrinkwrap.json'
  workflow_dispatch:
    inputs:
      continuation_event_type:
        description: Exact registered continuation type; empty for manual recovery
        required: false
        type: string
      continuation_source:
        description: Exact continuation producer class
        required: false
        type: string
      continuation_slot:
        description: Exact continuation consumer slot
        required: false
        type: string
      exact_main_sha:
        description: Exact protected-main SHA
        required: false
        type: string
      upstream_run_id:
        description: Exact Coverage workflow run ID
        required: false
        type: string
      upstream_run_attempt:
        description: Exact Coverage workflow run attempt
        required: false
        type: string
      upstream_event:
        description: Registered Coverage producer event
        required: false
        type: string
      coverage_workflow_path:
        description: Exact Coverage workflow path
        required: false
        type: string
      generation_id:
        description: Exact deterministic Coverage generation identity
        required: false
        type: string
      continuation_artifact_id:
        description: Exact authenticated continuation artifact ID
        required: false
        type: string
      continuation_artifact_digest:
        description: Exact authenticated continuation artifact digest
        required: false
        type: string
      continuation_key:
        description: Exact single-use continuation key
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kpmo-continuous-assurance-sentinel-health-${{ github.event.workflow_run.head_sha || github.event.client_payload.exact_main_sha || inputs.exact_main_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact source and run sentinel negative regression suite
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs
          node --check scripts/kidults/kpmo/wait-exact-sha-producer-cohort-v1.mjs
          node scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs --self-test
          node --test tests/kidults/kpmo/sentinel-producer-content-v1.test.mjs tests/kidults/kpmo/sentinel-snapshot-retry-v1.test.mjs tests/kidults/kpmo/whole-platform-*.test.mjs tests/kidults/kpmo/exact-sha-producer-auto-convergence-v1.test.mjs tests/kidults/kpmo/post-landing-terminal-lifecycle-v1.test.mjs tests/kidults/kpmo/postmerge-content-authority-boundary-v1.test.mjs tests/kidults/kpmo/sentinel-generation-selection-v1.test.mjs tests/kidults/kpmo/sentinel-trigger-v1.test.mjs tests/kidults/kpmo/sentinel-observation-v1.test.mjs tests/kidults/kpmo/governed-readiness-consumption-v1.test.mjs tests/kidults/kpmo/wait-exact-sha-producer-cohort-v1.test.mjs tests/kidults/source-intelligence/authority-chain-trigger-compatibility-v1.test.mjs

  exact-main-health:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha != '') ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'repository_dispatch' && (github.event.client_payload.slot == 'SENTINEL' || github.event.action == 'kidults.assurance.continuation.v1'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Initialize durable non-authorizing sentinel failure receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY_BOOTSTRAP'
          import json, os
          from pathlib import Path
          receipt = {
            'receipt_id': 'kpmo-continuous-assurance-sentinel-health-v1',
            'version': '1.0.0', 'state': 'VERIFIED_FAIL',
            'failure_class': 'SENTINEL_NOT_RECONCILED',
            'repository': os.environ['GITHUB_REPOSITORY'],
            'source_sha': os.environ['GITHUB_SHA'],
            'observer_run_id': int(os.environ['GITHUB_RUN_ID']),
            'observer_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'coverage_scope': 'CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM',
            'semantic_content_verified': False, 'runtime_health_proven': False,
            'whole_platform_authority': False, 'promotion_eligible': False,
            'provider_authority': False, 'database_authority': False,
            'empirical_delta': 0, 'public': 'HOLD', 'production': 'HOLD', 'g5': 'HOLD'
          }
          destination = Path(os.environ['RUNNER_TEMP']) / 'kpmo-continuous-assurance-sentinel-health-v1.json'
          destination.write_text(json.dumps(receipt, indent=2) + '\n')
          PY_BOOTSTRAP
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.exact_main_sha || inputs.exact_main_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact Coverage chain continuation
        if: github.event_name == 'workflow_dispatch' && inputs.continuation_event_type == 'kidults.assurance.continuation.v1'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION_SOURCE: ${{ inputs.continuation_source }}
          CONTINUATION_SLOT: ${{ inputs.continuation_slot }}
          SOURCE_SHA: ${{ inputs.exact_main_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          UPSTREAM_ATTEMPT: ${{ inputs.upstream_run_attempt }}
          UPSTREAM_EVENT: ${{ inputs.upstream_event }}
          COVERAGE_WORKFLOW_PATH: ${{ inputs.coverage_workflow_path }}
          GENERATION_ID: ${{ inputs.generation_id }}
          ARTIFACT_ID: ${{ inputs.continuation_artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.continuation_artifact_digest }}
          CONTINUATION_KEY: ${{ inputs.continuation_key }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONTINUATION_SOURCE" = KIDULTS_COVERAGE_CHAIN_CONTINUATION
          test "$CONTINUATION_SLOT" = SENTINEL_CHAIN
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$COVERAGE_WORKFLOW_PATH" = .github/workflows/kidults-asi-requirement-adapter-coverage-v1.yml
          [[ "$GENERATION_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$UPSTREAM_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$UPSTREAM_EVENT" == workflow_run || "$UPSTREAM_EVENT" == workflow_dispatch ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CONTINUATION_KEY" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}" > /tmp/sentinel-chain-upstream-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" --arg event "$UPSTREAM_EVENT" \
            --arg path "$COVERAGE_WORKFLOW_PATH" \
            '.repository.full_name==$repo and .head_repository.full_name==$repo and .head_branch=="main" and .head_sha==$sha and .path==$path and .event==$event and .status=="completed" and .conclusion=="success" and (.run_attempt|tostring)==$attempt' \
            --arg attempt "$UPSTREAM_ATTEMPT" /tmp/sentinel-chain-upstream-run.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/artifacts?per_page=100" > /tmp/sentinel-chain-artifacts.json
          ARTIFACT_NAME="kidults-kir-coverage-assurance-dispatch-v1-${UPSTREAM_RUN_ID}-${UPSTREAM_ATTEMPT}"
          jq -e --arg name "$ARTIFACT_NAME" --argjson id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" --argjson run "$UPSTREAM_RUN_ID" --arg sha "$SOURCE_SHA" \
            '[.artifacts[] | select(.id==$id and .name==$name and .expired==false and .digest==$digest and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | length==1' /tmp/sentinel-chain-artifacts.json >/dev/null
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/sentinel-chain.zip
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
            --archive /tmp/sentinel-chain.zip --expected-digest "$ARTIFACT_DIGEST" \
            --receipt /tmp/sentinel-chain-archive-receipt.json \
            --max-compressed-bytes 1048576 --max-entries 2 --max-entry-uncompressed-bytes 1048576 \
            --max-total-uncompressed-bytes 1048576 --max-compression-ratio 100 \
            --required-basename kir-coverage-assurance-continuation-v1.json
          mkdir -p /tmp/sentinel-chain
          unzip -q /tmp/sentinel-chain.zip -d /tmp/sentinel-chain
          mapfile -d '' -t RECEIPTS < <(find /tmp/sentinel-chain -type f -name kir-coverage-assurance-continuation-v1.json -print0)
          test "${#RECEIPTS[@]}" -eq 1
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" --arg path "$COVERAGE_WORKFLOW_PATH" --arg generation "$GENERATION_ID" --argjson run "$UPSTREAM_RUN_ID" --argjson attempt "$UPSTREAM_ATTEMPT" --arg key "$CONTINUATION_KEY" \
            '.repository==$repo and .source_sha==$sha and .coverage_workflow_path==$path and .generation_id==$generation and .coverage_run_id==$run and .coverage_run_attempt==$attempt and .continuation_key==$key and .version=="1.3.0" and .state=="ISSUED_PENDING_ONE_TIME_CONSUMPTION" and .promotion_eligible==false and .public=="HOLD" and .production=="HOLD" and .g5=="HOLD"' \
            "${RECEIPTS[0]}" >/dev/null
          echo KPMO_CONTINUATION_CLASS=EXACT_COVERAGE_CHAIN >> "$GITHUB_ENV"
          echo "KPMO_CONTINUATION_UPSTREAM_RUN_ID=$UPSTREAM_RUN_ID" >> "$GITHUB_ENV"
          echo "KPMO_CONTINUATION_UPSTREAM_RUN_ATTEMPT=$UPSTREAM_ATTEMPT" >> "$GITHUB_ENV"
          echo "KPMO_CONTINUATION_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "KPMO_CONTINUATION_ARTIFACT_DIGEST=$ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "KPMO_CONTINUATION_KEY=$CONTINUATION_KEY" >> "$GITHUB_ENV"

      - name: Verify independent natural-clock receipt
        if: github.event_name == 'repository_dispatch' && github.event.action == 'kidults.natural.clock.sentinel.v1'
        env:
          GH_TOKEN: ${{ github.token }}
          KIDULTS_NATURAL_CLOCK_APP_LOGIN: kidults-autonomous-landing-staging[bot]
          KIDULTS_NATURAL_CLOCK_SLOT: SENTINEL
        run: |
          set -euo pipefail
          export KIDULTS_LIVE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          node scripts/kidults/kpmo/run-natural-clock-intake-v1.mjs
          test "$(git rev-parse HEAD)" = "$KIDULTS_LIVE_MAIN_SHA"
      - name: Preserve independent natural-clock receipt
        if: github.event_name == 'repository_dispatch' && github.event.action == 'kidults.natural.clock.sentinel.v1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-natural-clock-sentinel-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/kidults-natural-clock-receipt-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Wait for exact-SHA producer cohort before Sentinel resolution
        if: github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.continuation_event_type == 'kidults.assurance.continuation.v1')
        env:
          GH_TOKEN: ${{ github.token }}
          KPMO_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.client_payload.exact_main_sha || inputs.exact_main_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Compatibility markers keep the bounded 2100-second/spec-index contract visible to existing policy tests.
          # Contract markers: SECONDS + 2100; for (const spec of SPECS); SPECS, workflowRuns.
          # The implementation lives in the checked-in waiter (SPECS, workflowRuns).
          node scripts/kidults/kpmo/wait-exact-sha-producer-cohort-v1.mjs "$KPMO_SOURCE_SHA"
      - name: Resolve latest applicable exact-SHA producer health
        if: always()
        id: resolve
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/kidults/kpmo/resolve-continuous-assurance-sentinel-health-v1.mjs \
            --output "$RUNNER_TEMP/kpmo-continuous-assurance-sentinel-health-v1.json"
      - name: Upload exact-run sentinel health receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpmo-continuous-assurance-sentinel-health-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kpmo-continuous-assurance-sentinel-health-v1.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce fail-closed producer health after receipt retention
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/kpmo-continuous-assurance-sentinel-health-v1.json"
          jq -e '
            .receipt_id=="kpmo-continuous-assurance-sentinel-health-v1" and
            .coverage_scope=="CORE_FOUR_ONLY_NOT_WHOLE_PLATFORM" and
            .source_sha==env.GITHUB_SHA and
            .observer_run_id==(env.GITHUB_RUN_ID|tonumber) and
            .observer_run_attempt==(env.GITHUB_RUN_ATTEMPT|tonumber) and
            .semantic_content_verified==true and .runtime_health_proven==false and
            .whole_platform_authority==false and
            .promotion_eligible==false and
            .provider_authority==false and
            .database_authority==false and
            .public=="HOLD" and .production=="HOLD" and .g5=="HOLD" and
            .state=="VERIFIED_PASS" and
            (.producers|length)==4 and
            ([.producers[].state]|all(.=="VERIFIED_PASS")) and
            ([.producers[].artifact_content_validated]|all(.==true))
          ' "$RUNNER_TEMP/kpmo-continuous-assurance-sentinel-health-v1.json" >/dev/null
