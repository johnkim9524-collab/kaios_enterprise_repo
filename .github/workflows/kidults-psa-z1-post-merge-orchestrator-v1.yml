name: KIDULTS PSA Z1 Post-Merge Orchestrator V1

on:
  pull_request:
    paths:
      - '.github/workflows/kidults-psa-z1-post-merge-orchestrator-v1.yml'
      - '.github/workflows/kidults-psa-z1-private-runtime-v1.yml'
      - '.github/workflows/kidults-psa-live-execution-control-v1.yml'
      - 'scripts/kidults/provider/run-psa-z1-private-runtime-v1.mjs'
      - 'scripts/kidults/provider/validate-psa-live-execution-control-v1.mjs'
      - 'coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json'
      - 'coordination/kidults/provider/psa-live-execution-raci-v1.json'
      - 'coordination/kidults/provider/provider-live-execution-raci-v1.json'
      - 'coordination/kidults/provider/psa-activation-state-receipt-v1.json'
      - 'coordination/kidults/provider/psa-provider-operation-authorization-boundary-v1.json'
      - 'coordination/kidults/provider/psa-z1-followup-trigger-remediation-v1.json'
  workflow_run:
    workflows: ["KIDULTS Atomic Governed Landing V1"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kidults-psa-z1-post-merge-control-main
  cancel-in-progress: false

jobs:
  contract-proof:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'KIDULTS Atomic Governed Landing V1' &&
       (github.event.workflow_run.event == 'workflow_dispatch' ||
        github.event.workflow_run.event == 'issue_comment') &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate code-landing and provider-activation separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/provider/run-psa-z1-private-runtime-v1.mjs
          node --check scripts/kidults/provider/validate-psa-live-execution-control-v1.mjs
          node scripts/kidults/provider/validate-psa-live-execution-control-v1.mjs
          node scripts/kidults/kpmo/inventory-secret-bearing-workflow-dispatch-v1.mjs --enforce-registry

  post-landing-control-receipt:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'KIDULTS Atomic Governed Landing V1' &&
      (github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'issue_comment') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    needs: contract-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve exact atomic landing and record provider activation hold
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_WORKFLOW_NAME" = 'KIDULTS Atomic Governed Landing V1'
          case "$SOURCE_WORKFLOW_EVENT" in
            workflow_dispatch|issue_comment) ;;
            *) echo "FAIL: unsupported source event" >&2; exit 1 ;;
          esac
          test "$SOURCE_WORKFLOW_CONCLUSION" = 'success'
          test "$SOURCE_HEAD_BRANCH" = 'main'
          [[ "$SOURCE_WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          LIVE_MAIN_JSON="$(
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/main"
          )"
          LIVE_MAIN_SHA="$(jq -r '.sha // empty' <<<"$LIVE_MAIN_JSON")"
          [[ "$LIVE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

          PARENT_COUNT="$(jq '.parents | length' <<<"$LIVE_MAIN_JSON")"
          test "$PARENT_COUNT" -eq 2
          FIRST_PARENT_SHA="$(jq -r '.parents[0].sha // empty' <<<"$LIVE_MAIN_JSON")"
          LANDED_HEAD_SHA="$(jq -r '.parents[1].sha // empty' <<<"$LIVE_MAIN_JSON")"
          [[ "$FIRST_PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LANDED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$FIRST_PARENT_SHA" = "$SOURCE_HEAD_SHA"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${LIVE_MAIN_SHA}/pulls" \
            > /tmp/psa-z1-associated-prs.json
          jq --arg merge "$LIVE_MAIN_SHA" --arg landed "$LANDED_HEAD_SHA" '
            [.[] |
              select(.merged_at != null) |
              select(.merge_commit_sha == $merge) |
              select(.head.sha == $landed) |
              select(.base.ref == "main")]
          ' /tmp/psa-z1-associated-prs.json > /tmp/psa-z1-landing-pr.json
          test "$(jq 'length' /tmp/psa-z1-landing-pr.json)" -eq 1

          LANDING_PR_NUMBER="$(jq -r '.[0].number' /tmp/psa-z1-landing-pr.json)"
          LANDING_CHANGED_FILE_COUNT="$(jq -r '.[0].changed_files' /tmp/psa-z1-landing-pr.json)"
          [[ "$LANDING_PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$LANDING_CHANGED_FILE_COUNT" =~ ^[0-9]+$ ]]
          test "$LANDING_CHANGED_FILE_COUNT" -gt 0
          test "$LANDING_CHANGED_FILE_COUNT" -le 100

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/pulls/${LANDING_PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > /tmp/psa-z1-landing-files.txt
          test -s /tmp/psa-z1-landing-files.txt
          test "$(wc -l < /tmp/psa-z1-landing-files.txt | tr -d ' ')" -eq "$LANDING_CHANGED_FILE_COUNT"

          PSA_RELEVANT='false'
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/kidults-psa-z1-post-merge-orchestrator-v1.yml|\
              .github/workflows/kidults-psa-z1-private-runtime-v1.yml|\
              .github/workflows/kidults-psa-live-execution-control-v1.yml|\
              scripts/kidults/provider/run-psa-z1-private-runtime-v1.mjs|\
              scripts/kidults/provider/validate-psa-live-execution-control-v1.mjs|\
              coordination/kidults/kpmo/secret-bearing-workflow-dispatch-registry-v1.json|\
              coordination/kidults/provider/psa-live-execution-raci-v1.json|\
              coordination/kidults/provider/provider-live-execution-raci-v1.json|\
              coordination/kidults/provider/psa-activation-state-receipt-v1.json|\
              coordination/kidults/provider/psa-provider-operation-authorization-boundary-v1.json|\
              coordination/kidults/provider/psa-z1-followup-trigger-remediation-v1.json|\
              coordination/kidults/provider/psa-120-field-map-v1.json|\
              coordination/kidults/provider/psa-cert-verification-connection-policy-v1.json|\
              services/kidults-control-plane/src/psa-private-evaluation.mjs|\
              services/kidults-control-plane/src/psa-private-evaluation-store.mjs)
                PSA_RELEVANT='true'
                break
                ;;
            esac
          done < /tmp/psa-z1-landing-files.txt

          if [ "$PSA_RELEVANT" = 'true' ]; then
            RECEIPT_STATE='CODE_LANDED_PROVIDER_ACTIVATION_HELD'
            NEXT_GATE='INDEPENDENT_PROVIDER_OPERATION_AUTHORIZATION_REQUIRED'
          else
            RECEIPT_STATE='SKIPPED_NOT_PSA_RELEVANT'
            NEXT_GATE='NONE'
          fi

          jq -n \
            --arg state "$RECEIPT_STATE" \
            --arg sha "$LIVE_MAIN_SHA" \
            --arg landed "$LANDED_HEAD_SHA" \
            --arg source_run "$SOURCE_WORKFLOW_RUN_ID" \
            --arg source_event "$SOURCE_WORKFLOW_EVENT" \
            --arg pr "$LANDING_PR_NUMBER" \
            --arg next_gate "$NEXT_GATE" \
            '{
              receipt_id: "KIDULTS_PSA_Z1_POST_MERGE_CONTROL_RECEIPT_V2",
              state: $state,
              exact_main_sha: $sha,
              landed_head_sha: $landed,
              source_atomic_landing_run_id: $source_run,
              source_atomic_landing_event: $source_event,
              landing_pull_request: $pr,
              provider_dispatch_performed: false,
              provider_calls: 0,
              provider_secret_resolution_authorized: false,
              provider_secret_resolved: false,
              independent_provider_operation_authorization_consumed: false,
              acquisition_120_increment: 0,
              product_pipeline_admission_increment: 0,
              next_gate: $next_gate,
              production: "HOLD",
              public: "HOLD",
              g5: "EXPLICIT_APPROVAL_REQUIRED"
            }' > /tmp/psa-z1-post-merge-control-receipt.json

          jq -e '
            (.provider_dispatch_performed == false) and
            (.provider_calls == 0) and
            (.provider_secret_resolution_authorized == false) and
            (.provider_secret_resolved == false) and
            (.independent_provider_operation_authorization_consumed == false) and
            (.acquisition_120_increment == 0) and
            (.product_pipeline_admission_increment == 0)
          ' /tmp/psa-z1-post-merge-control-receipt.json >/dev/null

      - name: Upload sanitized post-merge control receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-psa-z1-post-merge-control-receipt
          path: /tmp/psa-z1-post-merge-control-receipt.json
          if-no-files-found: error
          retention-days: 30
