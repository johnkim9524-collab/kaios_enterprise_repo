name: KIDULTS Market Activity Feasibility Contract v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope/market-activity-feasibility-contract-v1.json'
      - 'scripts/kidults/scope/validate-market-activity-feasibility-contract-v1.mjs'
      - '.github/workflows/kidults-market-activity-feasibility-contract-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/kidults/scope/validate-market-activity-feasibility-contract-v1.mjs
