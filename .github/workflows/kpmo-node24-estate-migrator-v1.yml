name: KPMO Node24 Estate Migrator V1

on:
  push:
    branches:
      - kpmo/actions-node24-estate-933
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-node24-estate:
    if: github.event_name == 'push' || github.head_ref == 'kpmo/actions-node24-estate-933'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: kpmo/actions-node24-estate-933
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Migrate all workflow action runtimes
        run: node scripts/kidults/kpmo/github-actions-node24-estate-v1.mjs --migrate
      - name: Verify zero deprecated runtime pins
        run: node scripts/kidults/kpmo/github-actions-node24-estate-v1.mjs --check
      - name: Commit migration if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration diff remains.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: migrate GitHub Actions estate to Node 24-safe majors'
          git push origin HEAD:kpmo/actions-node24-estate-933
