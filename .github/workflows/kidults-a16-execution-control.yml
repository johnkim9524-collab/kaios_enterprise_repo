name: KIDULTS A16 Execution Control Certification

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-a16-execution-control.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install
      - run: npm run a16:certify
      - name: Upload A16 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kidults-a16-execution-control-evidence
          path: services/kidults-autonomous-intelligence/reports/execution-control/*.json
          if-no-files-found: warn
