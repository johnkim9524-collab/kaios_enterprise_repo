name: KIDULTS AI Agent Report-After-Remediation Enforcement V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.github/AI_AGENT_OPERATING_RULES.md'
      - '.github/copilot-instructions.md'
      - 'coordination/kidults/governance/ai-agent-bootstrap-remediation-sequence-v1.json'
      - 'coordination/kidults/governance/ai-agent-report-after-remediation-gate-v1.json'
      - 'coordination/kidults/registry/ai-agent-governance-registry-v1.json'
      - 'scripts/governance/validate-ai-agent-report-after-remediation-v1.mjs'
      - '.github/workflows/ai-agent-report-after-remediation-enforcement-v1.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.github/AI_AGENT_OPERATING_RULES.md'
      - '.github/copilot-instructions.md'
      - 'coordination/kidults/governance/ai-agent-bootstrap-remediation-sequence-v1.json'
      - 'coordination/kidults/governance/ai-agent-report-after-remediation-gate-v1.json'
      - 'coordination/kidults/registry/ai-agent-governance-registry-v1.json'
      - 'scripts/governance/validate-ai-agent-report-after-remediation-v1.mjs'
      - '.github/workflows/ai-agent-report-after-remediation-enforcement-v1.yml'

permissions:
  contents: read

concurrency:
  group: kidults-ai-report-after-remediation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  enforce-report-after-remediation:
    name: Validate Report-After-Remediation Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Enforce report-after-remediation contract and adversarial negatives
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/governance/validate-ai-agent-report-after-remediation-v1.mjs
          node scripts/governance/validate-ai-agent-report-after-remediation-v1.mjs | tee /tmp/report-after-remediation-validation-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-agent-report-after-remediation-validation-v1
          path: /tmp/report-after-remediation-validation-v1.json
          retention-days: 90
          if-no-files-found: error
