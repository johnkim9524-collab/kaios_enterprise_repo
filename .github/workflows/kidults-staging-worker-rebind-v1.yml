name: KIDULTS STAGING Worker Rebind v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-staging-worker-rebind-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-worker-rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_STAGING_REBIND_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PRECHECK — isolated staging boundary
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='services/kidults-autonomous-intelligence/wrangler.jsonc';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const q=(x.queues?.producers||[]).map(v=>v.queue);
          if(x.vars?.KIDULTS_ENV!=='staging'||x.vars?.ASI_MESH_MODE!=='SHADOW'||x.vars?.ASI_PUBLICATION_ENABLED!=='false') throw new Error('STAGING_BOUNDARY');
          if(q.length!==26||new Set(q).size!==26||q.some(v=>!v.startsWith('kidults-asi-shadow-'))) throw new Error('QUEUE_BOUNDARY');
          const d=x.d1_databases?.find(v=>v.binding==='DB'); if(!d) throw new Error('DB_BINDING_MISSING');
          d.database_name='kidults-intelligence-db-staging'; d.database_id='9bc6a406-6fca-4959-be7f-dd7f715b092c';
          x.name='kidults-autonomous-intelligence-staging'; x.workers_dev=false; delete x.routes; delete x.route; delete x.triggers;
          x.vars={...(x.vars||{}),KIDULTS_ENV:'staging',ASI_MESH_MODE:'SHADOW',ASI_PUBLICATION_ENABLED:'false'};
          fs.writeFileSync('services/kidults-autonomous-intelligence/wrangler.staging-rebind.generated.json',JSON.stringify(x,null,2));
          fs.writeFileSync('/tmp/rebind-boundary.json',JSON.stringify({worker:x.name,staging_d1:d.database_id,queues:q.length,workers_dev:false,routes:0,cron:0,publication:false,production:'HOLD'},null,2));
          NODE

      - name: Install and static validation
        working-directory: services/kidults-autonomous-intelligence
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npx wrangler deploy --config wrangler.staging-rebind.generated.json --dry-run --outdir /tmp/kidults-staging-rebind-dry-run

      - name: VERIFY — staging D1 and 26 queues with read-only token
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 info kidults-intelligence-db-staging --json > /tmp/staging-d1-info.json
          npx wrangler queues list > /tmp/queues.txt
          node - <<'NODE'
          const fs=require('fs'); const cfg=require('./wrangler.staging-rebind.generated.json'); const d=fs.readFileSync('/tmp/staging-d1-info.json','utf8');
          if(!d.includes('9bc6a406-6fca-4959-be7f-dd7f715b092c')||d.includes('d6d65f81-f91d-428b-bf43-8a025aaa47bd')) throw new Error('D1_BOUNDARY');
          const txt=fs.readFileSync('/tmp/queues.txt','utf8'); const expected=(cfg.queues?.producers||[]).map(x=>x.queue); const missing=expected.filter(q=>!txt.includes(q)); if(missing.length) throw new Error(`QUEUE_MISSING_${missing.length}`);
          NODE

      - name: GATE — require temporary Worker rebind token
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_STAGING_REBIND_TOKEN:-}"
          echo "::add-mask::$CLOUDFLARE_STAGING_REBIND_TOKEN"

      - name: SNAPSHOT — verify known functional rollback version remains available
        working-directory: services/kidults-autonomous-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
        run: |
          set -euo pipefail
          ROLLBACK_VERSION_ID='51aaf1e6-1b91-41ae-b8b2-c482a91d9d8a'
          npx wrangler versions view "$ROLLBACK_VERSION_ID" --name kidults-autonomous-intelligence-staging --json > /tmp/rollback-view.json
          grep -Fq "$ROLLBACK_VERSION_ID" /tmp/rollback-view.json
          printf 'ROLLBACK_VERSION_ID=%s\n' "$ROLLBACK_VERSION_ID" > /tmp/rollback.env

      - name: UPLOAD — exact staging D1-bound candidate
        working-directory: services/kidults-autonomous-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-rebind-upload.ndjson
        run: |
          set -euo pipefail
          rm -f /tmp/wrangler-rebind-upload.ndjson
          npx wrangler versions upload --config wrangler.staging-rebind.generated.json --tag staging-d1-isolated-r2 --message 'KPMO corrected isolated STAGING D1 rebind; no route; no cron'
          node - <<'NODE' > /tmp/candidate.env
          const fs=require('fs'); const rows=fs.readFileSync('/tmp/wrangler-rebind-upload.ndjson','utf8').trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          const x=[...rows].reverse().find(r=>r.type==='version-upload'&&r.version_id); if(!x) throw new Error('NO_EXACT_VERSION_UPLOAD_RECEIPT');
          console.log(`CANDIDATE_VERSION_ID=${x.version_id}`);
          NODE
          source /tmp/candidate.env
          npx wrangler versions view "$CANDIDATE_VERSION_ID" --name kidults-autonomous-intelligence-staging --json > /tmp/candidate-view.json
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('/tmp/candidate-view.json','utf8');
          if(!s.includes('9bc6a406-6fca-4959-be7f-dd7f715b092c')&&!s.includes('kidults-intelligence-db-staging')) throw new Error('REMOTE_CANDIDATE_STAGING_D1_NOT_VISIBLE');
          if(s.includes('d6d65f81-f91d-428b-bf43-8a025aaa47bd')) throw new Error('REMOTE_CANDIDATE_PRODUCTION_D1_LEAK');
          const expected=['kidults-asi-shadow-discovery-common-crawl-wdc','kidults-asi-shadow-source-pool-evolution','kidults-asi-shadow-dead-letter']; for(const q of expected) if(!s.includes(q)) throw new Error(`REMOTE_QUEUE_BINDING_NOT_VISIBLE:${q}`);
          NODE

      - name: DEPLOY — corrected candidate at 100 percent
        working-directory: services/kidults-autonomous-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
        run: |
          set -euo pipefail
          source /tmp/rollback.env; source /tmp/candidate.env
          test "$ROLLBACK_VERSION_ID" != "$CANDIDATE_VERSION_ID"
          npx wrangler versions deploy "$CANDIDATE_VERSION_ID@100%" --name kidults-autonomous-intelligence-staging --message 'KPMO corrected STAGING D1 isolated rebind' -y
          printf '{"worker":"kidults-autonomous-intelligence-staging","rollback_version_id":"%s","candidate_version_id":"%s","staging_d1_id":"9bc6a406-6fca-4959-be7f-dd7f715b092c","production_d1_id":"d6d65f81-f91d-428b-bf43-8a025aaa47bd","queues":26,"workers_dev":false,"routes":0,"cron":0,"publication":false,"production":"HOLD"}\n' "$ROLLBACK_VERSION_ID" "$CANDIDATE_VERSION_ID" > /tmp/rebind-receipt.json

      - name: POSTCHECK — remote current deployment and exact bindings
        working-directory: services/kidults-autonomous-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_REBIND_TOKEN }}
        run: |
          set -euo pipefail
          source /tmp/candidate.env; source /tmp/rollback.env
          npx wrangler deployments list --name kidults-autonomous-intelligence-staging --json > /tmp/deployments-after.json
          grep -Fq "$CANDIDATE_VERSION_ID" /tmp/deployments-after.json
          npx wrangler versions view "$CANDIDATE_VERSION_ID" --name kidults-autonomous-intelligence-staging --json > /tmp/candidate-view-after.json
          npx wrangler versions view "$ROLLBACK_VERSION_ID" --name kidults-autonomous-intelligence-staging --json > /tmp/rollback-view-after.json
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('/tmp/candidate-view-after.json','utf8');
          if(!s.includes('9bc6a406-6fca-4959-be7f-dd7f715b092c')&&!s.includes('kidults-intelligence-db-staging')) throw new Error('POSTCHECK_REMOTE_STAGING_D1');
          if(s.includes('d6d65f81-f91d-428b-bf43-8a025aaa47bd')) throw new Error('POSTCHECK_PRODUCTION_D1_LEAK');
          console.log(JSON.stringify({status:'STAGING_WORKER_REBOUND_TO_ISOLATED_D1_CORRECTED',production:'HOLD'}));
          NODE

      - name: Upload STAGING Worker rebind receipt
        uses: actions/upload-artifact@v4
        with:
          name: kidults-staging-worker-rebind-v1-corrected
          path: |
            /tmp/rebind-boundary.json
            /tmp/staging-d1-info.json
            /tmp/rollback-view.json
            /tmp/candidate-view.json
            /tmp/rebind-receipt.json
            /tmp/deployments-after.json
            /tmp/candidate-view-after.json
            /tmp/rollback-view-after.json
          retention-days: 30
          if-no-files-found: error
