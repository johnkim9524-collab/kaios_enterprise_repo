name: KIDULTS Scope Depth Dynamic Vertical v1
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope/scope-depth-dynamic-vertical-contract-v1.json'
      - 'docs/kidults/scope-depth-and-dynamic-vertical-design-v1.md'
      - 'scripts/kidults/scope/validate-scope-depth-dynamic-vertical-v1.mjs'
      - '.github/workflows/kidults-scope-depth-dynamic-vertical-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Scope depth and Dynamic Vertical governance
        run: node scripts/kidults/scope/validate-scope-depth-dynamic-vertical-v1.mjs
