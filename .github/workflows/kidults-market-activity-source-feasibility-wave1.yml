name: KIDULTS Market Activity Source Feasibility Wave1
on:
  pull_request:
    paths:
      - 'coordination/kidults/scope/market-activity-source-feasibility-wave1.json'
      - 'scripts/kidults/scope/validate-market-activity-source-feasibility-wave1.mjs'
      - '.github/workflows/kidults-market-activity-source-feasibility-wave1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Validate market activity source feasibility
        run: node scripts/kidults/scope/validate-market-activity-source-feasibility-wave1.mjs
