name: KIDULTS Autonomous Internal Landing V1
run-name: "Autonomous internal landing ${{ github.event.action }}"

on:
  repository_dispatch:
    types:
      - kidults.track.authorization.v1
      - kidults.kpmo.authorization.v1
      - kidults.independent.verification.v1

concurrency:
  group: kidults-autonomous-internal-landing-main
  cancel-in-progress: false

permissions: {}

jobs:
  validate-delegated-event:
    name: Validate delegated authority and reserve landing
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: KIDULTS-AUTONOMOUS-STAGING
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout protected main policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Verify autonomous policy implementation
        run: node scripts/kidults/kpmo/validate-autonomous-internal-landing-v1.mjs

      - name: Deny unconfigured autonomous authority
        env:
          AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_LANDING_ROLE_ARN }}
          LEDGER_TABLE: ${{ vars.KIDULTS_AUTONOMOUS_LANDING_LEDGER_TABLE }}
          WRITER_FUNCTION: ${{ vars.KIDULTS_AUTONOMOUS_LANDING_LEDGER_WRITER_FUNCTION }}
          ACTOR_REGISTRY: ${{ vars.KIDULTS_AUTONOMOUS_ACTOR_REGISTRY_JSON }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          test -n "$LEDGER_TABLE"
          test -n "$WRITER_FUNCTION"
          test -n "$ACTOR_REGISTRY"
          test "$AWS_ROLE_ARN" != "UNCONFIGURED"
          test "$WRITER_FUNCTION" != "UNCONFIGURED"

      - name: Acquire short-lived AWS credentials through GitHub OIDC
        env:
          AWS_ROLE_ARN: ${{ vars.KIDULTS_AUTONOMOUS_LANDING_ROLE_ARN }}
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(jq -r '.value' <<<"$OIDC_JSON")
          test -n "$OIDC_TOKEN"
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "$AWS_ROLE_ARN" \
            --role-session-name "kidults-autonomous-${GITHUB_RUN_ID}" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 900 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$CREDS"
          test -n "$AWS_ACCESS_KEY_ID"
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
            echo "AWS_REGION=ap-northeast-2"
          } >> "$GITHUB_ENV"

      - name: Preserve owner-reserved HOLD boundary
        run: |
          set -euo pipefail
          test "${{ vars.KIDULTS_PRODUCTION_STATE || 'HOLD' }}" = HOLD
          test "${{ vars.KIDULTS_PUBLIC_STATE || 'HOLD' }}" = HOLD
          test "${{ vars.KIDULTS_G5_STATE || 'HOLD' }}" = HOLD

      - name: Consume delegated quorum and land exact internal change
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KIDULTS_AUTONOMOUS_LANDING_LEDGER_TABLE: ${{ vars.KIDULTS_AUTONOMOUS_LANDING_LEDGER_TABLE }}
          KIDULTS_AUTONOMOUS_LANDING_LEDGER_WRITER_FUNCTION: ${{ vars.KIDULTS_AUTONOMOUS_LANDING_LEDGER_WRITER_FUNCTION }}
          KIDULTS_AUTONOMOUS_ACTOR_REGISTRY_JSON: ${{ vars.KIDULTS_AUTONOMOUS_ACTOR_REGISTRY_JSON }}
          AUTONOMOUS_LANDING_RECEIPT_PATH: out/autonomous-internal-landing-v1/receipt.json
        run: node scripts/kidults/kpmo/run-autonomous-internal-landing-v1.mjs

      - name: Upload activation receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kidults-autonomous-internal-landing-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/autonomous-internal-landing-v1/receipt.json
          if-no-files-found: error
          retention-days: 90

  owner-reserved-boundary:
    name: Production Public G5 remain Owner HOLD
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Assert non-promotion boundary
        run: |
          set -euo pipefail
          echo 'AUTONOMOUS_INTERNAL_ONLY=true'
          echo 'PRODUCTION=HOLD'
          echo 'PUBLIC=HOLD'
          echo 'G5=HOLD'
