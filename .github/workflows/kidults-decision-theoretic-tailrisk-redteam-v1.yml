name: KIDULTS Decision Theoretic Tail-Risk Red-Team V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/decision-theoretic-tailrisk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-decision-theoretic-tailrisk-controls-v1.mjs'
      - '.github/workflows/kidults-decision-theoretic-tailrisk-redteam-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/kpmo/decision-theoretic-tailrisk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-decision-theoretic-tailrisk-controls-v1.mjs'
      - '.github/workflows/kidults-decision-theoretic-tailrisk-redteam-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate decision-theoretic utility and tail-risk controls
        run: node scripts/kidults/kpmo/validate-decision-theoretic-tailrisk-controls-v1.mjs
