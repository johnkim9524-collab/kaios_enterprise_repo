name: KIDULTS Integration Source Snapshot v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kidults-integration-source-snapshot-v1.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Export tracked Git objects only, never runner configuration or credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = johnkim9524-collab/kaios_enterprise_repo
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=256 origin "$EXPECTED_SHA" "$EXPECTED_BASE_SHA"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_SHA" || {
            echo "::error::KIR_INTEGRATION_HEAD_NOT_DESCENDANT_OF_CURRENT_BASE"
            exit 1
          }
          export SOURCE_PACKET="$RUNNER_TEMP/kir-source-snapshot"
          mkdir -m 700 "$SOURCE_PACKET"
          for entry in "kir:$EXPECTED_SHA" 'landing:3d7ed543487c8adc2ab75fe607dc030b71ef3675' 'cloudflare:439d44a0c1a4e703f7d239285f6683dc79c4c2b4' "main:$EXPECTED_BASE_SHA"; do
            label="${entry%%:*}"
            sha="${entry#*:}"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$sha"
            test "$(git rev-parse FETCH_HEAD)" = "$sha"
            mkdir -m 700 "$SOURCE_PACKET/$label"
            git rev-list --objects --no-object-names "$sha" | git pack-objects --stdout > "$SOURCE_PACKET/$label/source.pack"
            git cat-file commit "$sha" > "$SOURCE_PACKET/$label/commit.raw"
            printf '%s\n' "$sha" > "$SOURCE_PACKET/$label/source-sha.txt"
          done
          python3 -I - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['SOURCE_PACKET'])
          value={'id':'kidults-integration-source-snapshot-v1','source_sha':os.environ['EXPECTED_SHA'],'repository':os.environ['GITHUB_REPOSITORY'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'scope':'TRACKED_SOURCE_REPRODUCIBILITY_ONLY_NOT_RUNTIME_EVIDENCE','git_config_exported':False,'credentials_exported':False,'promotion_eligible':False,'production':'HOLD','public':'HOLD','g5':'HOLD','files':{p.relative_to(root).as_posix():'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}}
          (root/'manifest.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kir-source-snapshot-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kir-source-snapshot
          if-no-files-found: error
          retention-days: 7
