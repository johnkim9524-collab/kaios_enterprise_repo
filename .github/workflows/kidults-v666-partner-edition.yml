name: KIDULTS V666 Partner Edition
on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/public/partner-v666/**'
      - 'scripts/kidults/portal/validate-v666-partner-edition.mjs'
      - '.github/workflows/kidults-v666-partner-edition.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - run: node scripts/kidults/portal/validate-v666-partner-edition.mjs
