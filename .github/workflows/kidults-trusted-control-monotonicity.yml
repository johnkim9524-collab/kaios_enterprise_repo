name: KIDULTS Trusted Merge Control Monotonicity

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - ".github/workflows/kidults-trusted-control-monotonicity.yml"
      - ".github/workflows/kidults-full-value-chain-redteam-orchestrator-v1.yml"
      - "scripts/kidults/kpmo/run-full-value-chain-redteam-suite-v1.mjs"
      - "scripts/kidults/portal/**"
      - "apps/kidults-enterprise-staging/public/portal-r001/projection-store.js"
      - "apps/kidults-enterprise-staging/public/portal-r001/proof-product-admission.js"
      - "apps/kidults-enterprise-staging/public/portal-r001/proof-product-schema-validator.js"
      - "coordination/kidults/kpmo/full-value-chain-redteam-orchestrator-v1.json"
      - "coordination/kidults/kpmo/epistemic-causal-integrity-controls-v1.json"
      - "coordination/kidults/audit/pre-partner-adversarial-fixtures-v2.json"

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-control-monotonicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify current merge result preserves mandatory control plane v2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import path from 'node:path';

          const VERSION='2.0.0';
          const token=process.env.GH_TOKEN;
          const repo=process.env.GH_REPOSITORY;
          const prNumber=process.env.PR_NUMBER;
          const api='https://api.github.com';
          const headers={Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'kidults-trusted-control-monotonicity-v2'};
          const fail=message=>{console.error(`FAIL trusted merge control monotonicity v2: ${message}`);process.exit(1)};

          const APPROVED_EXTERNAL_EXECUTABLES=new Set([
            'apps/kidults-enterprise-staging/public/portal-r001/projection-store.js',
            'apps/kidults-enterprise-staging/public/portal-r001/proof-product-admission.js',
            'apps/kidults-enterprise-staging/public/portal-r001/proof-product-schema-validator.js'
          ]);
          const isApprovedExecutable=ref=>ref.startsWith('scripts/')||APPROVED_EXTERNAL_EXECUTABLES.has(ref);

          async function raw(ref,filePath){
            const encoded=filePath.split('/').map(encodeURIComponent).join('/');
            return fetch(`${api}/repos/${repo}/contents/${encoded}?ref=${encodeURIComponent(ref)}`,{headers,redirect:'error'});
          }
          async function getFile(ref,filePath){
            const response=await raw(ref,filePath);
            if(!response.ok)fail(`${response.status} ${filePath}@${ref}`);
            const data=await response.json();
            if(data.type!=='file'||typeof data.content!=='string')fail(`missing or non-file ${filePath}@${ref}`);
            return Buffer.from(data.content.replace(/\n/g,''),'base64').toString('utf8');
          }
          async function tryFile(ref,filePath){
            const response=await raw(ref,filePath);
            if(response.status===404)return null;
            if(!response.ok)fail(`${response.status} ${filePath}@${ref}`);
            const data=await response.json();
            if(data.type!=='file'||typeof data.content!=='string')return null;
            return Buffer.from(data.content.replace(/\n/g,''),'base64').toString('utf8');
          }

          const executableRefsFromJson=(text,label)=>{
            let parsed;try{parsed=JSON.parse(text)}catch(error){fail(`${label} invalid JSON: ${error.message}`)}
            const refs=new Set();
            const walk=value=>{
              if(typeof value==='string'){if(/^scripts\/[A-Za-z0-9_./-]+\.(?:mjs|js|cjs|py|sh)$/.test(value))refs.add(value);return}
              if(Array.isArray(value)){for(const item of value)walk(item);return}
              if(value&&typeof value==='object')for(const item of Object.values(value))walk(item);
            };
            walk(parsed);return refs;
          };
          const topLevelScriptRefs=text=>new Set([...text.matchAll(/['"](scripts\/[A-Za-z0-9_./-]+\.(?:mjs|js|cjs|py|sh))['"]/g)].map(m=>m[1]));
          const dependencyRefs=(text,currentPath)=>{
            const executable=new Set();const semantic=new Set();
            for(const match of text.matchAll(/['"](scripts\/[A-Za-z0-9_./-]+\.(?:mjs|js|cjs|py|sh))['"]/g))executable.add(match[1]);
            const patterns=[/\bfrom\s+['"](\.{1,2}\/[^'"]+\.(?:mjs|js|cjs))['"]/g,/\bimport\s+['"](\.{1,2}\/[^'"]+\.(?:mjs|js|cjs))['"]/g,/\bimport\s*\(\s*['"](\.{1,2}\/[^'"]+\.(?:mjs|js|cjs))['"]\s*\)/g,/\brequire\s*\(\s*['"](\.{1,2}\/[^'"]+\.(?:mjs|js|cjs))['"]\s*\)/g];
            for(const pattern of patterns)for(const match of text.matchAll(pattern)){
              const resolved=path.posix.normalize(path.posix.join(path.posix.dirname(currentPath),match[1]));
              if(!isApprovedExecutable(resolved))fail(`unapproved repository executable dependency: ${currentPath} -> ${resolved}`);
              executable.add(resolved);
            }
            for(const match of text.matchAll(/['"]((?:coordination|apps|services)\/[A-Za-z0-9_./-]+\.(?:json|ya?ml))['"]/g))semantic.add(match[1]);
            return {executable,semantic};
          };

          // Non-downgrading self tests: exact approved Portal files are accepted; siblings/parents are rejected.
          for(const ref of APPROVED_EXTERNAL_EXECUTABLES)if(!isApprovedExecutable(ref))fail(`self-test rejected approved executable ${ref}`);
          for(const ref of ['apps/kidults-enterprise-staging/public/portal-r001/evil.js','apps/kidults-enterprise-staging/public/portal-r001/sub/evil.js','apps/kidults-enterprise-staging/public/other.js'])if(isApprovedExecutable(ref))fail(`self-test accepted unapproved executable ${ref}`);
          const self=dependencyRefs("import x from '../../../apps/kidults-enterprise-staging/public/portal-r001/projection-store.js';",'scripts/kidults/portal/example.mjs');
          if(!self.executable.has('apps/kidults-enterprise-staging/public/portal-r001/projection-store.js'))fail('self-test missed exact approved dependency');

          async function closure(seedRefs,sha){
            const all=new Set(seedRefs),queue=[...seedRefs].sort(),contents=new Map();
            while(queue.length){
              const ref=queue.shift();
              const text=contents.get(ref)??await getFile(sha,ref);contents.set(ref,text);
              const deps=dependencyRefs(text,ref);
              for(const child of [...deps.executable].sort())if(!all.has(child)){all.add(child);contents.set(child,await getFile(sha,child));queue.push(child)}
              for(const child of [...deps.semantic].sort())if(!all.has(child)){const text=await tryFile(sha,child);if(text!==null){all.add(child);contents.set(child,text);queue.push(child)}}
            }
            return {all,contents};
          }

          const prResponse=await fetch(`${api}/repos/${repo}/pulls/${prNumber}`,{headers,redirect:'error'});
          if(!prResponse.ok)fail(`${prResponse.status} PR ${prNumber}`);
          const pr=await prResponse.json();
          const baseSha=pr.base?.sha,mergeSha=pr.merge_commit_sha;
          if(!baseSha||!mergeSha)fail('base or synthetic merge SHA unavailable');

          const aggregate='scripts/kidults/kpmo/run-full-value-chain-redteam-suite-v1.mjs';
          const orchestrator='coordination/kidults/kpmo/full-value-chain-redteam-orchestrator-v1.json';
          const criticalWorkflow='.github/workflows/kidults-full-value-chain-redteam-orchestrator-v1.yml';
          const trustedWorkflow='.github/workflows/kidults-trusted-control-monotonicity.yml';
          const [baseAggregate,mergeAggregate,baseOrchestrator,mergeOrchestrator,baseCritical,mergeCritical,baseTrusted,mergeTrusted]=await Promise.all([
            getFile(baseSha,aggregate),getFile(mergeSha,aggregate),getFile(baseSha,orchestrator),getFile(mergeSha,orchestrator),getFile(baseSha,criticalWorkflow),getFile(mergeSha,criticalWorkflow),getFile(baseSha,trustedWorkflow),getFile(mergeSha,trustedWorkflow)
          ]);
          if(baseAggregate!==mergeAggregate)fail(`aggregate trust root modified: ${aggregate}; explicit trust-root migration required`);
          if(baseOrchestrator!==mergeOrchestrator)fail(`orchestrator trust root modified: ${orchestrator}; explicit trust-root migration required`);
          if(baseCritical!==mergeCritical)fail(`critical workflow modified: ${criticalWorkflow}; explicit trust-root migration required`);
          if(baseTrusted!==mergeTrusted)fail(`trusted workflow modified: ${trustedWorkflow}; explicit trust-root migration required`);

          const baseSeeds=new Set([...topLevelScriptRefs(baseAggregate),...executableRefsFromJson(baseOrchestrator,'base orchestrator')]);
          const mergeSeeds=new Set([...topLevelScriptRefs(mergeAggregate),...executableRefsFromJson(mergeOrchestrator,'merge orchestrator')]);
          const removed=[...baseSeeds].filter(ref=>!mergeSeeds.has(ref));if(removed.length)fail(`mandatory validator refs removed: ${removed.join(', ')}`);
          const baseline=await closure(baseSeeds,baseSha);
          for(const ref of [...baseline.all].sort()){
            const before=baseline.contents.get(ref)??await getFile(baseSha,ref);
            const after=await getFile(mergeSha,ref);
            if(before!==after)fail(`baseline mandatory trust dependency modified: ${ref}; explicit trust-root migration required`);
          }
          console.log(JSON.stringify({state:'VERIFIED_PASS',version:VERSION,base_sha:baseSha,merge_sha:mergeSha,baseline_dependency_count:baseline.all.size,approved_external_executable_count:APPROVED_EXTERNAL_EXECUTABLES.size,production:'HOLD',public:'HOLD',g5:'HOLD'},null,2));
          NODE
