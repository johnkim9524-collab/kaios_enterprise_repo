name: KIDULTS Institutional Continuity Sovereignty V1

on:
  pull_request:
    paths:
      - 'coordination/kidults/kpmo/institutional-continuity-sovereignty-controls-v1.json'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-institutional-continuity-sovereignty-v1.mjs'
      - '.github/workflows/kidults-institutional-continuity-sovereignty-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/kpmo/institutional-continuity-sovereignty-controls-v1.json'
      - 'coordination/kidults/kpmo/global-leadership-risk-controls-v1.json'
      - 'scripts/kidults/kpmo/validate-institutional-continuity-sovereignty-v1.mjs'
      - '.github/workflows/kidults-institutional-continuity-sovereignty-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate institutional continuity and sovereignty controls
        run: node scripts/kidults/kpmo/validate-institutional-continuity-sovereignty-v1.mjs
