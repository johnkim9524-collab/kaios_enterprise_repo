name: KIDULTS Cloudflare Pages Emergency Control v1

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Requested Cloudflare STAGING emergency operation (execution disabled pending #1576)
        required: true
        default: contain_auto_deployments
        type: choice
        options:
          - contain_auto_deployments
          - delete_preview_deployments
      external_authorization_issue:
        description: Reserved external authorization issue number; not executable until #1576 closes
        required: true
        type: string
      reason:
        description: Auditable request reason; this input is not authorization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kidults-cloudflare-pages-emergency-control-v1
  cancel-in-progress: false

jobs:
  control:
    # P0 fail-closed containment for #1576. A typed phrase, workflow input,
    # repository JSON, commit message, or actor identity cannot authorize a
    # provider mutation. This lane remains registered only until the external
    # source-bound, atomically consumed authorization gate is implemented.
    if: ${{ false }}
    environment: kidults-cloudflare-staging-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live main before provider credential resolution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" |
              python3 -c 'import json,re,sys; sha=str(json.load(sys.stdin).get("commit",{}).get("sha","")); print(sha) if re.fullmatch(r"[0-9a-f]{40}",sha) else sys.exit(65)'
          )"
          test "$LIVE_MAIN_SHA" = "$GITHUB_SHA"

      - name: Execute approved Cloudflare Pages emergency control
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          EXTERNAL_AUTHORIZATION_ISSUE: ${{ inputs.external_authorization_issue }}
          CONTROL_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare Emergency Control is fail-closed under issue #1576."
          echo "Request inputs are audit metadata only and cannot authorize mutation."
          exit 78
