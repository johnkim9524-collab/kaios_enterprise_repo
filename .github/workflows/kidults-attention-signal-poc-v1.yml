name: KIDULTS Attention Signal PoC v1
on:
  pull_request:
    paths:
      - 'scripts/kidults/poc/run-attention-signal-poc-v1.mjs'
      - '.github/workflows/kidults-attention-signal-poc-v1.yml'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/kidults/poc/run-attention-signal-poc-v1.mjs coordination/kidults/scope-data/scope-poc-anchor-selection-v1.json tmp/attention-signal-poc-v1
      - run: |
          node -e "const x=require('./tmp/attention-signal-poc-v1/attention-signal-poc-v1.json'); if(x.products!==64) throw Error('expected 64'); if(!x.defects.some(d=>d.id==='ATTN-SEMANTICS')) throw Error('truth guard'); if(x.provider_contact!=='HOLD'||x.production!=='HOLD') throw Error('gate'); console.log(JSON.stringify({status:'PASS',mapped:x.mapped_products,history:x.products_with_300d_history,errors:x.request_errors},null,2));"
      - uses: actions/upload-artifact@v6
        with:
          name: kidults-attention-signal-poc-v1
          path: tmp/attention-signal-poc-v1/
