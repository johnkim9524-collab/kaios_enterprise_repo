name: KIDULTS DigitalOcean STAGING Portal Receipt Contract

on:
  pull_request:
    paths:
      - '.github/workflows/digitalocean-staging-portal-deploy.yml'
      - '.github/workflows/digitalocean-staging-portal-receipt-contract.yml'
      - 'coordination/kidults/runtime/digitalocean-staging-portal-deploy-contract-v1.json'
      - 'coordination/kidults/runtime/digitalocean-staging-portal-receipt-contract-v1.json'
      - 'scripts/operations/digitalocean_staging_portal_deploy_v1.sh'
      - 'scripts/operations/validate_digitalocean_staging_portal_deploy_v1.py'
      - 'scripts/operations/validate_digitalocean_staging_portal_receipts_v1.py'
      - 'scripts/operations/test_digitalocean_staging_portal_receipts_v1.sh'
      - 'scripts/kidults/kpmo/validate-staging-portal-workflow-provenance-v1.mjs'
      - 'apps/kidults-enterprise-staging/public/portal-r001/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/digitalocean-staging-portal-deploy.yml'
      - '.github/workflows/digitalocean-staging-portal-receipt-contract.yml'
      - 'coordination/kidults/runtime/digitalocean-staging-portal-deploy-contract-v1.json'
      - 'coordination/kidults/runtime/digitalocean-staging-portal-receipt-contract-v1.json'
      - 'scripts/operations/digitalocean_staging_portal_deploy_v1.sh'
      - 'scripts/operations/validate_digitalocean_staging_portal_deploy_v1.py'
      - 'scripts/operations/validate_digitalocean_staging_portal_receipts_v1.py'
      - 'scripts/operations/test_digitalocean_staging_portal_receipts_v1.sh'
      - 'scripts/kidults/kpmo/validate-staging-portal-workflow-provenance-v1.mjs'
      - 'apps/kidults-enterprise-staging/public/portal-r001/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-localhost-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record non-privileged proof runner identity
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS:-UNKNOWN}"
          echo "runner_arch=${RUNNER_ARCH:-UNKNOWN}"
          echo "image_os=${ImageOS:-UNKNOWN}"
          echo "image_version=${ImageVersion:-UNKNOWN}"
          cat /etc/os-release
      - name: Validate receipt and deploy contracts
        run: |
          set -euo pipefail
          python scripts/operations/validate_digitalocean_staging_portal_deploy_v1.py
          node scripts/kidults/kpmo/validate-staging-portal-workflow-provenance-v1.mjs
      - name: Validate Portal Release-001 NO_PROJECTION source
        run: node scripts/kidults/portal/validate-portal-release-001.mjs
      - name: Prove deployment, health receipts, and rollback on localhost
        run: |
          set -euo pipefail
          mkdir -p artifacts/digitalocean-staging-portal-localhost-proof
          bash scripts/operations/test_digitalocean_staging_portal_receipts_v1.sh \
            | tee artifacts/digitalocean-staging-portal-localhost-proof/proof.json
          python -m json.tool artifacts/digitalocean-staging-portal-localhost-proof/proof.json >/dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kidults-digitalocean-staging-portal-localhost-receipt-proof
          path: artifacts/digitalocean-staging-portal-localhost-proof
          retention-days: 30
