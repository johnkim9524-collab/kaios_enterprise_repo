name: Kidults P0 Speed x Quality Hardening

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - 'apps/kidults-enterprise-staging/public/future.html'
      - 'docs/methodology/KIDULT100_POC_OPERATING_SPEC.md'
      - 'docs/product/KIDULTS_FUTURE_PORTAL_BLUEPRINT.md'
      - '.github/workflows/kidults-p0-speed-quality.yml'
      - '.github/workflows/kidults-live-open-data-operation.yml'
  workflow_dispatch:

concurrency:
  group: kidults-p0-speed-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json
      - name: Critical CI determinism audit
        run: node scripts/p0-critical-ci-audit.mjs
      - name: Repository quality audit before dependency install
        run: npm run quality:audit
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime smoke
        run: npm run runtime:smoke
      - name: Unit tests
        run: npm test
      - name: Coverage threshold gate
        run: node scripts/p0-coverage-gate.mjs
      - name: Truth-layer synthetic acceptance gate
        run: npm run truth:gate
      - name: Wave1 real external source discovery evaluation
        continue-on-error: true
        run: node scripts/kidult100-wave1-live.mjs
      - name: Stage 2 normalized candidate universe build
        run: node scripts/kidult100-poc-live.mjs
      - name: Stage 2 institutional archive product-object precision hardening
        run: node scripts/kidult100-stage2-archive-precision-harden.mjs
      - name: Stage 2 reference-public product-object precision hardening
        run: node scripts/kidult100-stage2-reference-precision-harden.mjs
      - name: Open CC0 Scarcity + Demand evidence collection
        run: node scripts/kidult100-open-right-data-evidence.mjs
      - name: Wikimedia Analytics CC0 demand-attention supplement
        run: node scripts/kidult100-wikimedia-demand-evidence.mjs
      - name: Canon evidence recordization from existing rights-classified metadata
        run: node scripts/kidult100-canon-evidence-recordize.mjs
      - name: Market provider onboarding preflight
        run: node scripts/kidult100-market-provider-onboarding-preflight.mjs
      - name: Market source qualification audit
        run: node scripts/kidult100-market-source-qualification-audit.mjs
      - name: Rights-first market provider adapter normalization
        run: node scripts/kidult100-market-adapter-normalize.mjs
      - name: Provider evidence contract validation
        env:
          KIDULTS_RIGHT_DATA_EVIDENCE_JSON: reports/kidult100-right-data/normalized-market-provider-evidence-latest.json
        run: node scripts/kidult100-provider-evidence-validate.mjs
      - name: Market evidence acquisition plan
        run: node scripts/kidult100-market-evidence-acquisition-plan.mjs
      - name: Stage 2 Right Data enrichment
        run: node scripts/kidult100-right-data-enrich.mjs
      - name: Snapshot Right Data before verified scarcity materialization
        run: cp reports/kidult100-right-data/right-data-latest.json reports/kidult100-right-data/right-data-pre-scarcity-materialization.json
      - name: Non-market scoring evidence + normalization preflight
        run: node scripts/kidult100-non-market-scoring-preflight.mjs
      - name: Calibration evidence shape plan
        run: node scripts/kidult100-calibration-evidence-shape-plan.mjs
      - name: Non-market evidence acquisition priority plan
        run: node scripts/kidult100-non-market-evidence-acquisition-priority.mjs
      - name: Scarcity explicit-quantity acquisition target queue
        run: node scripts/kidult100-scarcity-evidence-target-queue.mjs
      - name: Scarcity target queue scope hardening
        run: node scripts/kidult100-scarcity-target-queue-harden.mjs
      - name: Scarcity rights-first source qualification matrix
        env:
          KIDULTS_SCARCITY_TARGET_QUEUE_JSON: reports/kidult100-ranking/kidult100-scarcity-evidence-target-queue-hardened-latest.json
        run: node scripts/kidult100-scarcity-source-qualification.mjs
      - name: Scarcity entity-specific source discovery work packets
        run: node scripts/kidult100-scarcity-source-discovery-plan.mjs
      - name: Scarcity deterministic discovery triage
        run: node scripts/kidult100-scarcity-discovery-triage.mjs
      - name: Scarcity source attestation intake
        run: node scripts/kidult100-scarcity-source-attestation-intake.mjs
      - name: Scarcity independent verification gate
        run: node scripts/kidult100-scarcity-independent-verification.mjs
      - name: Scarcity explicit evidence promotion envelope gate
        run: node scripts/kidult100-scarcity-evidence-promotion.mjs
      - name: Scarcity verified raw Right Data materialization gate
        run: node scripts/kidult100-scarcity-right-data-materialize.mjs
      - name: Stage 2 Right Data refresh after verified scarcity materialization
        run: node scripts/kidult100-right-data-enrich.mjs
      - name: Scarcity materialization delta invariant gate
        run: node scripts/kidult100-scarcity-materialization-delta-invariant.mjs
      - name: Non-market scoring preflight refresh after verified scarcity materialization
        run: node scripts/kidult100-non-market-scoring-preflight.mjs
      - name: Calibration evidence shape refresh after verified scarcity materialization
        run: node scripts/kidult100-calibration-evidence-shape-plan.mjs
      - name: Non-market evidence priority refresh after verified scarcity materialization
        run: node scripts/kidult100-non-market-evidence-acquisition-priority.mjs
      - name: Rankability gap plan
        run: node scripts/kidult100-rankability-gap-plan.mjs
      - name: Experimental live Kidult100 POC ranking evaluation
        continue-on-error: true
        run: node scripts/kidult100-experimental-ranking.mjs
      - name: Production 300+ decision-grade Right Data certification gate
        run: node scripts/kidult100-stage2-right-data-gate.mjs
      - name: Real external open-data operational run + unified preflight
        run: node scripts/live-open-data-operation.mjs
      - name: A25-A40 simulation regression
        env:
          A25_MODE: SIMULATION
          A26_MODE: SIMULATION
          A27_MODE: SIMULATION
          A28_MODE: SIMULATION
          A29_MODE: SIMULATION
          A30_MODE: SIMULATION
          A31_MODE: SIMULATION
          A32_MODE: SIMULATION
          A33_MODE: SIMULATION
          A34_MODE: SIMULATION
          A35_MODE: SIMULATION
          A36_MODE: SIMULATION
          A37_MODE: SIMULATION
          A38_MODE: SIMULATION
          A39_MODE: SIMULATION
          A40_MODE: SIMULATION
        run: |
          npm run a25:certify
          npm run a26:certify
          npm run a27:certify
          npm run a28:certify
          npm run a29:certify
          npm run a30:certify
          npm run a31:certify
          npm run a32:certify
          npm run a33:certify
          npm run a34:certify
          npm run a35:certify
          npm run a36:certify
          npm run a37:certify
          npm run a38:certify
          npm run a39:certify
          npm run a40:certify
      - name: SRE and reliability baseline audit
        run: node scripts/p0-sre-readiness-audit.mjs
      - name: 120 governance baseline audit
        run: node scripts/p0-120-governance-baseline-audit.mjs
      - name: Engineering quality audit after validation
        if: always()
        run: npm run quality:audit
      - name: Upload engineering audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-p0-engineering-quality-audit
          path: |
            services/kidults-autonomous-intelligence/reports/engineering-hardening/quality-audit-latest.json
            services/kidults-autonomous-intelligence/reports/engineering-hardening/critical-ci-audit-latest.json
            services/kidults-autonomous-intelligence/reports/engineering-hardening/sre-readiness-latest.json
            services/kidults-autonomous-intelligence/reports/engineering-hardening/governance-baseline-latest.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload truth and live POC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-p0-truth-preflight-evidence
          path: |
            services/kidults-autonomous-intelligence/reports/truth-layer/truth-gate-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-wave1/wave1-live-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-poc/kidult100-poc-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-poc/kidult100-poc-precision-hardening-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-poc/kidult100-reference-precision-hardening-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/open-evidence-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/wikimedia-demand-evidence-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/canon-evidence-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/market-provider-onboarding-preflight-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/market-source-qualification-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/normalized-market-provider-evidence-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/validated-provider-evidence-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/market-evidence-acquisition-plan-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/scarcity-materialized-evidence-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/right-data-pre-scarcity-materialization.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/scarcity-materialization-delta-invariant-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/right-data-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/right-data-gap-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-right-data/stage2-certification-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-non-market-scoring-preflight-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-calibration-evidence-shape-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-non-market-evidence-acquisition-priority-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-evidence-target-queue-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-evidence-target-queue-hardened-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-source-qualification-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-source-discovery-plan-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-discovery-triage-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-source-attestation-intake-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-independent-verification-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-scarcity-evidence-promotion-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-rankability-gap-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-experimental-latest.json
            services/kidults-autonomous-intelligence/reports/kidult100-ranking/kidult100-experimental-gap-latest.json
            services/kidults-autonomous-intelligence/reports/live-open-data/live-open-data-latest.json
          retention-days: 30
          if-no-files-found: error
