name: Kidults P0 Speed x Quality Hardening

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-p0-speed-quality.yml'
  workflow_dispatch:

concurrency:
  group: kidults-p0-speed-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json

      - name: Apply idempotent A40 structural refactor
        run: node scripts/p0-a40-structure-refactor.mjs

      - name: Commit A40 structural refactor when generated
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/kidults-autonomous-intelligence/scripts/a40-ga-certification.mjs services/kidults-autonomous-intelligence/scripts/lib/a40-ga-static-config.mjs
          if git diff --cached --quiet; then
            echo "A40 structural refactor already committed."
            exit 0
          fi
          git commit -m "refactor(kidults): split A40 static certification config"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Repository quality audit before dependency install
        run: node scripts/p0-engineering-quality-audit.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime smoke
        run: npm run runtime:smoke

      - name: Truth-layer unit tests
        run: npm test

      - name: Truth-layer coverage
        run: npm run coverage

      - name: Truth-layer acceptance gate
        run: npm run truth:gate

      - name: Engineering quality audit after validation
        if: always()
        run: npm run quality:audit

      - name: Upload engineering audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-p0-engineering-quality-audit
          path: services/kidults-autonomous-intelligence/reports/engineering-hardening/quality-audit-latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload truth-layer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-p0-truth-layer-evidence
          path: services/kidults-autonomous-intelligence/reports/truth-layer/truth-gate-latest.json
          retention-days: 30
          if-no-files-found: error
