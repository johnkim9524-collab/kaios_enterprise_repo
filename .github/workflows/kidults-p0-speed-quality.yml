name: Kidults P0 Speed x Quality Hardening

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-p0-speed-quality.yml'
  workflow_dispatch:

concurrency:
  group: kidults-p0-speed-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json

      - name: Repository quality audit before dependency install
        run: npm run quality:audit

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime smoke
        run: npm run runtime:smoke

      - name: Truth-layer unit tests
        run: npm test

      - name: Truth-layer coverage
        run: npm run coverage

      - name: Truth-layer acceptance gate
        run: npm run truth:gate

      - name: A25-A40 simulation regression
        env:
          A25_MODE: SIMULATION
          A26_MODE: SIMULATION
          A27_MODE: SIMULATION
          A28_MODE: SIMULATION
          A29_MODE: SIMULATION
          A30_MODE: SIMULATION
          A31_MODE: SIMULATION
          A32_MODE: SIMULATION
          A33_MODE: SIMULATION
          A34_MODE: SIMULATION
          A35_MODE: SIMULATION
          A36_MODE: SIMULATION
          A37_MODE: SIMULATION
          A38_MODE: SIMULATION
          A39_MODE: SIMULATION
          A40_MODE: SIMULATION
        run: |
          npm run a25:certify
          npm run a26:certify
          npm run a27:certify
          npm run a28:certify
          npm run a29:certify
          npm run a30:certify
          npm run a31:certify
          npm run a32:certify
          npm run a33:certify
          npm run a34:certify
          npm run a35:certify
          npm run a36:certify
          npm run a37:certify
          npm run a38:certify
          npm run a39:certify
          npm run a40:certify

      - name: Engineering quality audit after validation
        if: always()
        run: npm run quality:audit

      - name: Upload engineering audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-p0-engineering-quality-audit
          path: services/kidults-autonomous-intelligence/reports/engineering-hardening/quality-audit-latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload truth-layer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-p0-truth-layer-evidence
          path: services/kidults-autonomous-intelligence/reports/truth-layer/truth-gate-latest.json
          retention-days: 30
          if-no-files-found: error
