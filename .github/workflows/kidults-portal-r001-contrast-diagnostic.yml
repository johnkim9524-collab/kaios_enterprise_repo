name: KIDULTS Portal R001 Contrast Diagnostic
on:
  pull_request:
    paths:
      - 'apps/kidults-enterprise-staging/public/portal-r001/**'
      - '.github/workflows/kidults-portal-r001-contrast-diagnostic.yml'
  workflow_dispatch:

jobs:
  contrast-diagnostic:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install browser diagnostic deps
        run: |
          mkdir -p /tmp/kidults-r001-diag
          cp tooling/kidults-portal-r001-browser-qa/package.json /tmp/kidults-r001-diag/package.json
          cp tooling/kidults-portal-r001-browser-qa/package-lock.json /tmp/kidults-r001-diag/package-lock.json
          npm ci --prefix /tmp/kidults-r001-diag --ignore-scripts --no-audit --no-fund
          node /tmp/kidults-r001-diag/node_modules/playwright/cli.js install --with-deps chromium
      - name: Start staging portal
        shell: bash
        run: |
          mkdir -p /tmp/kidults-conversion-data
          printf 'portal-r001-diag-nonproduction-secret' > /tmp/kidults-conversion-secret
          KAIOS_ENVIRONMENT=staging \
          KAIOS_PRODUCTION_PROMOTION_AUTHORIZED=false \
          KIDULTS_CONVERSION_DATA_DIR=/tmp/kidults-conversion-data \
          KIDULTS_CONVERSION_HASH_SECRET_FILE=/tmp/kidults-conversion-secret \
          HOST=127.0.0.1 PORT=4173 \
          node apps/kidults-enterprise-staging/server.mjs >/tmp/kidults-r001-diag-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/kidults-r001-diag-server.log
          exit 1
      - name: Print exact color contrast nodes
        shell: bash
        run: |
          cat > /tmp/kidults-r001-diag/run.mjs <<'NODE'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await context.newPage();
          await page.goto('http://127.0.0.1:4173/portal-r001/index.html',{waitUntil:'networkidle'});
          const axe=await new AxeBuilder({page}).withRules(['color-contrast']).analyze();
          const out=axe.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,html:n.html,failureSummary:n.failureSummary}))}));
          console.log(JSON.stringify(out,null,2));
          await context.close();
          await browser.close();
          if(out.length) process.exit(1);
          NODE
          cd /tmp/kidults-r001-diag
          node run.mjs
