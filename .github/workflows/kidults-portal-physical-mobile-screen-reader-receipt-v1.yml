name: KIDULTS Physical Mobile and Screen Reader Receipt Contract V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/governance/portal-physical-mobile-screen-reader-acceptance-contract-v1.json'
      - 'coordination/kidults/portal/portal-physical-mobile-screen-reader-acceptance-receipt-v1.json'
      - 'scripts/kidults/portal/validate-physical-mobile-screen-reader-acceptance-v1.mjs'
      - 'tests/kidults/kpmo/portal-physical-mobile-screen-reader-acceptance-v1.test.mjs'
      - '.github/workflows/kidults-portal-physical-mobile-screen-reader-receipt-v1.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/governance/portal-physical-mobile-screen-reader-acceptance-contract-v1.json'
      - 'coordination/kidults/portal/portal-physical-mobile-screen-reader-acceptance-receipt-v1.json'
      - 'scripts/kidults/portal/validate-physical-mobile-screen-reader-acceptance-v1.mjs'
      - 'tests/kidults/kpmo/portal-physical-mobile-screen-reader-acceptance-v1.test.mjs'
      - '.github/workflows/kidults-portal-physical-mobile-screen-reader-receipt-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-contract:
    name: Receipt Contract Valid / Human Acceptance May Remain HOLD
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate separate physical-mobile and VoiceOver contracts
        run: |
          node --check scripts/kidults/portal/validate-physical-mobile-screen-reader-acceptance-v1.mjs
          node tests/kidults/kpmo/portal-physical-mobile-screen-reader-acceptance-v1.test.mjs
          node scripts/kidults/portal/validate-physical-mobile-screen-reader-acceptance-v1.mjs > /tmp/kidults-portal-physical-mobile-screen-reader-assessment-v1.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: kidults-portal-physical-mobile-screen-reader-assessment-v1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/kidults-portal-physical-mobile-screen-reader-assessment-v1.json
          if-no-files-found: warn
          retention-days: 30
