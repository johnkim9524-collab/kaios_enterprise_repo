name: KIDULTS ASI Common Crawl Host Expansion v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-provenance-v1.mjs'
      - 'scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs'
      - 'tests/kidults/source-intelligence/asi-exact-generation-orchestration-v1.test.mjs'
      - 'tests/kidults/source-intelligence/asi-common-crawl-seed-frontier-rebase-v1.test.mjs'
      - '.github/workflows/kidults-asi-common-crawl-host-expansion-v1.yml'
  workflow_run:
    workflows: ['KIDULTS ASI Global Any-Site Discovery v2']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  common-crawl-host-expansion:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source and syntax
        env:
          EXPECTED_EXECUTION_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EXECUTION_SHA"
          node --check scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-provenance-v1.mjs
          node --check scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-exact-generation-orchestration-integration-v1.mjs --self-test
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-provenance-v1.mjs
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-provenance-v1.mjs --self-test
          node --test tests/kidults/source-intelligence/asi-exact-generation-orchestration-v1.test.mjs
          node --test tests/kidults/source-intelligence/asi-common-crawl-seed-frontier-rebase-v1.test.mjs
      - name: Validate PR fixture orchestration without provider requests
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_GENERATION_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs \
            --mode pr-fixture \
            --receipt /tmp/asi-common-crawl-host-expansion-orchestration-v1.json \
            --consumer-id common-crawl-host-expansion \
            --workflow-path .github/workflows/kidults-asi-global-open-market-discovery-v1.yml \
            --workflow-name 'KIDULTS ASI Global Any-Site Discovery v2' \
            --artifact-name kidults-asi-global-any-site-discovery-v2 \
            --branch "$EXPECTED_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-generation-sha "$EXPECTED_GENERATION_SHA" \
            --trigger-expected false \
            --fixture tests/kidults/source-intelligence/asi-common-crawl-seed-frontier-rebase-v1.test.mjs
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/asi-common-crawl-host-expansion-orchestration-v1.json"));if(r.state!=="VERIFIED_PASS_LOCAL_FIXTURE"||r.external_provider_requests!==0||r.writes!==0)throw new Error("PR_FIXTURE_RECEIPT_INVALID")'
      - name: Restore exact-generation Global Any-Site discovery artifact
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_GENERATION_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TARGET_BRANCH: main
          TRIGGER_EXPECTED: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name || '' }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            test "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY"
            test -n "$UPSTREAM_RUN_ID"
            MAIN_SHA="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
            test "$MAIN_SHA" = "$EXPECTED_SHA"
          fi
          node scripts/kidults/source-intelligence/resolve-asi-exact-generation-orchestration-v1.mjs \
            --mode live \
            --receipt /tmp/asi-common-crawl-host-expansion-orchestration-v1.json \
            --consumer-id common-crawl-host-expansion \
            --workflow-path .github/workflows/kidults-asi-global-open-market-discovery-v1.yml \
            --workflow-name 'KIDULTS ASI Global Any-Site Discovery v2' \
            --artifact-name kidults-asi-global-any-site-discovery-v2 \
            --branch "$TARGET_BRANCH" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-generation-sha "$EXPECTED_GENERATION_SHA" \
            --expected-run-id "$UPSTREAM_RUN_ID" \
            --trigger-expected "$TRIGGER_EXPECTED" \
            --max-attempts 24 \
            --poll-milliseconds 10000
          mkdir -p discovery-out /tmp/cc-input
          PRODUCER_RUN_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/asi-common-crawl-host-expansion-orchestration-v1.json")).selected_run_id')
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            test "$PRODUCER_RUN_ID" = "$UPSTREAM_RUN_ID"
          fi
          ART_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/asi-common-crawl-host-expansion-orchestration-v1.json")).selected_artifact_id')
          ART_DIGEST=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/asi-common-crawl-host-expansion-orchestration-v1.json")).selected_artifact_digest')
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/cc-input.zip
          unzip -q -o /tmp/cc-input.zip -d /tmp/cc-input
          mapfile -t SOURCES < <(find /tmp/cc-input -type f -name global-low-risk-discovery.json -print)
          test "${#SOURCES[@]}" -eq 1
          cp "${SOURCES[0]}" discovery-out/global-low-risk-discovery.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/asi-common-crawl-host-expansion-orchestration-v1.json"));fs.writeFileSync("/tmp/asi-common-crawl-host-expansion-provenance-v1.json",JSON.stringify({schema_version:"1.0.0",binding_mode:"EXACT_EXECUTION_SHA",repository:r.repository,producer_workflow_path:r.producer_workflow_path,producer_workflow_name:r.producer_workflow_name,producer_run_id:r.selected_run_id,producer_sha:r.expected_producer_sha,artifact_name:r.artifact_name,artifact_id:r.selected_artifact_id,artifact_digest:r.selected_artifact_digest,artifact_cardinality:1,exact_generation:true,rights_promoted:false,empirical_promotion:false,public:"HOLD",production:"HOLD",g5:"HOLD"},null,2)+"\n")'
      - name: Execute Common Crawl public-index host expansion
        if: github.event_name != 'pull_request'
        run: |
          node scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-common-crawl-host-expansion-v1.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs /tmp/asi-common-crawl-host-expansion-v1.json
      - name: Reject rights promotion mutation
        if: github.event_name != 'pull_request'
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/asi-common-crawl-host-expansion-v1.json';const x=JSON.parse(fs.readFileSync(p));if(x.candidates.length){x.candidates[0].rights_state='ALLOW';}else{x.rights_promoted=true;}fs.writeFileSync('/tmp/bad-cc-rights.json',JSON.stringify(x));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs /tmp/bad-cc-rights.json; then exit 1; fi
      - name: Reject host escape mutation
        if: github.event_name != 'pull_request'
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/asi-common-crawl-host-expansion-v1.json';const x=JSON.parse(fs.readFileSync(p));if(!x.candidates.length)process.exit(0);x.candidates[0].endpoint_url='https://example.org';fs.writeFileSync('/tmp/bad-cc-host.json',JSON.stringify(x));
          NODE
          if [ -f /tmp/bad-cc-host.json ] && node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs /tmp/bad-cc-host.json; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: kidults-asi-common-crawl-host-expansion-v1
          path: |
            /tmp/asi-common-crawl-host-expansion-v1.json
            /tmp/asi-common-crawl-host-expansion-provenance-v1.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload bounded PR orchestration receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-common-crawl-host-expansion-pr-orchestration-v1
          path: /tmp/asi-common-crawl-host-expansion-orchestration-v1.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload bounded live orchestration receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-common-crawl-host-expansion-live-orchestration-v1
          path: /tmp/asi-common-crawl-host-expansion-orchestration-v1.json
          retention-days: 30
          if-no-files-found: error
