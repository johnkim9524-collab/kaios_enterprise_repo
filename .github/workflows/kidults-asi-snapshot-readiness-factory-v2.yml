name: KIDULTS ASI Snapshot Readiness Factory v2

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'KIDULTS ASI Owned Source Intelligence Graph v2'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-snapshot-readiness-factory-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess-current-snapshot-readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact source and current P3 contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v2.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs
          node scripts/kidults/redteam/validate-artifact-consumer-orchestration-v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v2.json','utf8'))"
      - name: Validate registered current-chain P3 assets and activation
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs \
            | tee /tmp/kidults-asi-snapshot-readiness-factory-registry-validation-v2.json
      - name: Restore latest current P0B P1 and P2 v2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          P2_EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          P2_EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0b-expanded /tmp/p1-expanded /tmp/p2-expanded /tmp/p0b /tmp/p1 /tmp/p2
          CURRENT_SHA=$(git rev-parse HEAD)

          resolve_latest_ancestor_artifact() {
            local workflow_file="$1" workflow_name="$2" artifact_name="$3" prefix="$4"
            local runs_file="/tmp/${prefix,,}-runs.json" artifacts_file="/tmp/${prefix,,}-artifacts.json"
            local run_id="" source_sha="" artifact_id=""
            gh api --method GET -H 'Accept: application/vnd.github+json' \
              -f branch=main -f status=success -f per_page=100 \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
              > "$runs_file"
            mapfile -t candidates < <(jq -r --arg name "$workflow_name" --arg path ".github/workflows/${workflow_file}" '.workflow_runs[] | select(.name==$name and .path==$path and .head_branch=="main" and .status=="completed" and .conclusion=="success") | [.id,.head_sha] | @tsv' "$runs_file")
            for candidate in "${candidates[@]}"; do
              IFS=$'\t' read -r candidate_run candidate_sha <<<"$candidate"
              if git merge-base --is-ancestor "$candidate_sha" "$CURRENT_SHA"; then
                run_id="$candidate_run"
                source_sha="$candidate_sha"
                break
              fi
            done
            test -n "$run_id" && test -n "$source_sha"
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              > "$artifacts_file"
            artifact_id=$(jq -r --arg name "$artifact_name" --argjson run "$run_id" --arg sha "$source_sha" \
              '[.artifacts[] | select(.name==$name and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | if length==1 then .[0].id else empty end' \
              "$artifacts_file")
            test -n "$artifact_id"
            printf -v "${prefix}_RUN_ID" '%s' "$run_id"
            printf -v "${prefix}_SOURCE_SHA" '%s' "$source_sha"
            printf -v "${prefix}_ID" '%s' "$artifact_id"
          }

          resolve_latest_ancestor_artifact \
            kidults-asi-p0b-bounded-discovery-candidates-v1.yml \
            'KIDULTS ASI P0B Bounded Discovery Candidates v1' \
            kidults-asi-p0b-bounded-discovery-candidates-v1 P0B
          resolve_latest_ancestor_artifact \
            kidults-asi-p1-source-preflight-v1.yml \
            'KIDULTS ASI P1 Source Preflight v1' \
            kidults-asi-p1-source-preflight-v1 P1

          if [ -n "$P2_EVENT_RUN_ID" ]; then
            P2_RUN_ID="$P2_EVENT_RUN_ID"
            P2_SOURCE_SHA="$P2_EVENT_SOURCE_SHA"
            test -n "$P2_SOURCE_SHA"
            git merge-base --is-ancestor "$P2_SOURCE_SHA" "$CURRENT_SHA"
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${P2_RUN_ID}/artifacts?per_page=100" \
              > /tmp/p2-artifacts.json
            P2_ID=$(jq -r --argjson run "$P2_RUN_ID" --arg sha "$P2_SOURCE_SHA" \
              '[.artifacts[] | select(.name=="kidults-asi-owned-source-intelligence-graph-v2" and .expired==false and .workflow_run.id==$run and .workflow_run.head_sha==$sha)] | if length==1 then .[0].id else empty end' \
              /tmp/p2-artifacts.json)
            test -n "$P2_ID"
          else
            resolve_latest_ancestor_artifact \
              kidults-asi-owned-source-intelligence-graph-v2.yml \
              'KIDULTS ASI Owned Source Intelligence Graph v2' \
              kidults-asi-owned-source-intelligence-graph-v2 P2
          fi
          test -n "$P0B_ID" && test -n "$P1_ID" && test -n "$P2_ID"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0B_ID}/zip" > /tmp/p0b.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P1_ID}/zip" > /tmp/p1.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P2_ID}/zip" > /tmp/p2.zip
          unzip -q -o /tmp/p0b.zip -d /tmp/p0b-expanded
          unzip -q -o /tmp/p1.zip -d /tmp/p1-expanded
          unzip -q -o /tmp/p2.zip -d /tmp/p2-expanded
          for NAME in p0b-source-candidate-registry-v1.json p0b-mission-candidate-binding-ledger-v1.json p0b-bounded-discovery-manifest-v1.json; do
            FILE=$(find /tmp/p0b-expanded -type f -name "$NAME" -print -quit); test -n "$FILE"; cp "$FILE" "/tmp/p0b/$NAME"
          done
          for NAME in p1-gate1-source-safety-decisions-v1.json p1-evidence-admission-candidate-register-v1.json p1-preflight-action-queue-v1.json p1-source-preflight-manifest-v1.json; do
            FILE=$(find /tmp/p1-expanded -type f -name "$NAME" -print -quit); test -n "$FILE"; cp "$FILE" "/tmp/p1/$NAME"
          done
          for NAME in owned-source-intelligence-graph-v2.json owned-source-intelligence-lineage-v2.json owned-source-intelligence-quality-v2.json owned-source-intelligence-value-receipt-v2.json owned-source-intelligence-manifest-v2.json; do
            FILE=$(find /tmp/p2-expanded -type f -name "$NAME" -print -quit); test -n "$FILE"; cp "$FILE" "/tmp/p2/$NAME"
          done
          echo "P0B_ARTIFACT_ID=$P0B_ID" >> "$GITHUB_ENV"
          echo "P1_ARTIFACT_ID=$P1_ID" >> "$GITHUB_ENV"
          echo "P2_ARTIFACT_ID=$P2_ID" >> "$GITHUB_ENV"
          echo "p0b_artifact_id=$P0B_ID"
          echo "p1_artifact_id=$P1_ID"
          echo "p2_artifact_id=$P2_ID"
      - name: Build current P3 readiness twice
        run: |
          set -euo pipefail
          for RUN in 1 2; do
            node scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v2.mjs \
              /tmp/p0b/p0b-source-candidate-registry-v1.json \
              /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json \
              /tmp/p0b/p0b-bounded-discovery-manifest-v1.json \
              /tmp/p1/p1-gate1-source-safety-decisions-v1.json \
              /tmp/p1/p1-evidence-admission-candidate-register-v1.json \
              /tmp/p1/p1-preflight-action-queue-v1.json \
              /tmp/p1/p1-source-preflight-manifest-v1.json \
              /tmp/p2/owned-source-intelligence-graph-v2.json \
              /tmp/p2/owned-source-intelligence-lineage-v2.json \
              /tmp/p2/owned-source-intelligence-quality-v2.json \
              /tmp/p2/owned-source-intelligence-value-receipt-v2.json \
              /tmp/p2/owned-source-intelligence-manifest-v2.json \
              coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json \
              "/tmp/kidults-asi-snapshot-readiness-factory-run-${RUN}"
          done
          diff -qr /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/kidults-asi-snapshot-readiness-factory-run-2
      - name: Validate current P3 readiness and forbidden-file absence
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs \
            /tmp/kidults-asi-snapshot-readiness-factory-run-1 \
            /tmp/p0b/p0b-source-candidate-registry-v1.json \
            /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json \
            /tmp/p0b/p0b-bounded-discovery-manifest-v1.json \
            /tmp/p1/p1-gate1-source-safety-decisions-v1.json \
            /tmp/p1/p1-evidence-admission-candidate-register-v1.json \
            /tmp/p1/p1-preflight-action-queue-v1.json \
            /tmp/p1/p1-source-preflight-manifest-v1.json \
            /tmp/p2/owned-source-intelligence-graph-v2.json \
            /tmp/p2/owned-source-intelligence-lineage-v2.json \
            /tmp/p2/owned-source-intelligence-quality-v2.json \
            /tmp/p2/owned-source-intelligence-value-receipt-v2.json \
            /tmp/p2/owned-source-intelligence-manifest-v2.json \
            coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json \
            | tee /tmp/kidults-asi-snapshot-readiness-factory-validation-v2.json
      - name: Reject false snapshot candidate mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-false-snapshot
          printf '%s\n' '{"id":"fabricated"}' > /tmp/bad-false-snapshot/snapshot-candidate.json
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-false-snapshot /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject false evidence admission mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-false-admission
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-false-admission/snapshot-readiness-ledger-v2.json';const x=JSON.parse(fs.readFileSync(p));x.counts.evidence_admitted=1;x.snapshot_creation_gate_pass=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-false-admission /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject Track B start mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-track-b
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-track-b/track-b-handoff-readiness-v2.json';const x=JSON.parse(fs.readFileSync(p));x.state='READY_FOR_INDEPENDENT_ASSESSMENT';x.independent_assessment_started=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-track-b /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject missing blocker mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-missing-blocker
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-missing-blocker/immutable-blocker-package-v2.json';const x=JSON.parse(fs.readFileSync(p));x.blockers=x.blockers.filter(v=>v.blocker_class!=='EVIDENCE_ADMISSION_ZERO');x.blocker_count=x.blockers.length;x.p0_blocker_count=x.blockers.filter(v=>v.severity==='P0').length;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-missing-blocker /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject blocker package as Evidence Package mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-blocker-package
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-blocker-package/immutable-blocker-package-v2.json';const x=JSON.parse(fs.readFileSync(p));x.package_is_evidence_package=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-blocker-package /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject manual-only activation mutation
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v2.json /tmp/p3-registry.json
          node - <<'NODE'
          const fs=require('fs');const p='coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v2.json';const x=JSON.parse(fs.readFileSync(p));x.automatic_activation.main_push=false;x.automatic_activation.upstream_workflow='NONE';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs; then exit 1; fi
          mv /tmp/p3-registry.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v2.json
      - name: Revalidate pristine P3 outputs and registry
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs > /tmp/kidults-asi-snapshot-readiness-factory-registry-final-validation-v2.json
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs \
            /tmp/kidults-asi-snapshot-readiness-factory-run-1 \
            /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json \
            /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json \
            /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json \
            coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json \
            > /tmp/kidults-asi-snapshot-readiness-factory-final-validation-v2.json
      - name: Emit KPMO P3 receipt
        run: |
          node - <<'NODE' >/tmp/kidults-asi-snapshot-readiness-factory-kpmo-receipt-v2.json
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/kidults-asi-snapshot-readiness-factory-run-1/snapshot-readiness-manifest-v2.json'));process.stdout.write(JSON.stringify({id:'kidults-asi-snapshot-readiness-factory-kpmo-receipt-v2',state:'VERIFIED_PASS',source_sha:process.env.GITHUB_SHA,trigger_event:process.env.GITHUB_EVENT_NAME,p0b_artifact_id:process.env.P0B_ARTIFACT_ID,p1_artifact_id:process.env.P1_ARTIFACT_ID,p2_artifact_id:process.env.P2_ARTIFACT_ID,graph_digest:m.input_bindings.p2.graph_digest,results:m.results,autonomous_effect:m.autonomous_effect,global_effect:m.global_effect,irreplaceable_value_effect:m.irreplaceable_value_effect,transparency_effect:m.transparency_effect,snapshot_candidate_generated:false,evidence_package_generated:false,track_b_assessment_started:false,public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/kidults-asi-snapshot-readiness-factory-kpmo-receipt-v2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-snapshot-readiness-factory-v2
          path: |
            /tmp/kidults-asi-snapshot-readiness-factory-run-1
            /tmp/kidults-asi-snapshot-readiness-factory-registry-validation-v2.json
            /tmp/kidults-asi-snapshot-readiness-factory-validation-v2.json
            /tmp/kidults-asi-snapshot-readiness-factory-registry-final-validation-v2.json
            /tmp/kidults-asi-snapshot-readiness-factory-final-validation-v2.json
            /tmp/kidults-asi-snapshot-readiness-factory-kpmo-receipt-v2.json
          retention-days: 90
          if-no-files-found: error
