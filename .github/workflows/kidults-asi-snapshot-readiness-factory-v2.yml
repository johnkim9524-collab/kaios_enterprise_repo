name: KIDULTS ASI Snapshot Readiness Factory v2

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json'
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v2.json'
      - 'scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/source-intelligence/test-asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-upstream-binding-v2.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/poc/validate-candidate-evidence-handoff-r2.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs'
      - 'docs/kidults/asi/asi-snapshot-readiness-factory-v2.md'
      - '.github/workflows/kidults-asi-snapshot-readiness-factory-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json'
      - 'coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v2.json'
      - 'scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/source-intelligence/test-asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-upstream-binding-v2.mjs'
      - 'scripts/kidults/source-intelligence/lib/asi-snapshot-readiness-factory-v2.mjs'
      - 'scripts/kidults/poc/validate-candidate-evidence-handoff-r2.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs'
      - 'docs/kidults/asi/asi-snapshot-readiness-factory-v2.md'
      - '.github/workflows/kidults-asi-snapshot-readiness-factory-v2.yml'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Owned Source Intelligence Graph v2'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-snapshot-readiness-factory-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess-current-snapshot-readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify exact source and current P3 contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v2.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs
          node --check scripts/kidults/source-intelligence/test-asi-snapshot-readiness-factory-v2.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-upstream-binding-v2.mjs
          node --check scripts/kidults/source-intelligence/lib/asi-snapshot-readiness-factory-v2.mjs
          node --check scripts/kidults/poc/validate-candidate-evidence-handoff-r2.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-registry-v2.json','utf8'))"
      - name: Validate registered current-chain P3 assets and activation
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-registry-v2.mjs \
            | tee /tmp/kidults-asi-snapshot-readiness-factory-registry-validation-v2.json
      - name: Prove P3 liveness and upstream-binding mutation resistance
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-upstream-binding-v2.mjs --self-test
          node scripts/kidults/source-intelligence/test-asi-snapshot-readiness-factory-v2.mjs
      - name: Restore exact P2 run and its receipt-bound P0B and P1 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_P2_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_P2_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0b-expanded /tmp/p1-expanded /tmp/p2-expanded /tmp/p0b /tmp/p1 /tmp/p2
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            test -n "$EVENT_P2_RUN_ID" && test -n "$EVENT_P2_HEAD_SHA"
            P2_RUN_ID="$EVENT_P2_RUN_ID"
          else
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/kidults-asi-owned-source-intelligence-graph-v2.yml/runs?branch=main&status=success&per_page=1" \
              > /tmp/p2-runs.json
            P2_RUN_ID="$(node -e "const x=require('/tmp/p2-runs.json');if(x.workflow_runs?.length!==1)process.exit(2);process.stdout.write(String(x.workflow_runs[0].id))")"
          fi
          [[ "$P2_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${P2_RUN_ID}" > /tmp/p2-run.json
          P2_RUN_ID="$P2_RUN_ID" node - <<'NODE'
          const fs=require('fs');const run=JSON.parse(fs.readFileSync('/tmp/p2-run.json'));
          if(String(run.id)!==String(process.env.P2_RUN_ID)||run.path!=='.github/workflows/kidults-asi-owned-source-intelligence-graph-v2.yml'||run.head_branch!=='main'||run.conclusion!=='success'||!(/^[0-9a-f]{40}$/.test(run.head_sha))||run.repository?.full_name!==process.env.GITHUB_REPOSITORY)process.exit(2);
          if(process.env.GITHUB_EVENT_NAME==='workflow_run'&&(String(run.id)!==String(process.env.EVENT_P2_RUN_ID)||run.head_sha!==process.env.EVENT_P2_HEAD_SHA))process.exit(3);
          NODE
          P2_HEAD_SHA="$(node -p "require('/tmp/p2-run.json').head_sha")"
          gh api -H 'Accept: application/vnd.github+json' --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${P2_RUN_ID}/artifacts?per_page=100" > /tmp/p2-artifact-pages.json
          node - <<'NODE'
          const fs=require('fs');const pages=JSON.parse(fs.readFileSync('/tmp/p2-artifact-pages.json'));const run=JSON.parse(fs.readFileSync('/tmp/p2-run.json'));
          const matches=pages.flatMap(x=>x.artifacts||[]).filter(x=>x.name==='kidults-asi-owned-source-intelligence-graph-v2'&&x.expired===false);
          if(matches.length!==1)process.exit(2);const a=matches[0];
          if(String(a.workflow_run?.id)!==String(run.id)||a.workflow_run?.head_branch!=='main'||a.workflow_run?.head_sha!==run.head_sha||!(/^sha256:[0-9a-f]{64}$/.test(a.digest||'')))process.exit(3);
          fs.writeFileSync('/tmp/p2-artifact.json',JSON.stringify(a,null,2)+'\n');
          NODE
          P2_ID="$(node -p "require('/tmp/p2-artifact.json').id")"
          [[ "$P2_ID" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P2_ID}/zip" > /tmp/p2.zip
          P2_ARCHIVE_SHA256="sha256:$(sha256sum /tmp/p2.zip | awk '{print $1}')"
          P2_ARCHIVE_SHA256="$P2_ARCHIVE_SHA256" node - <<'NODE'
          const fs=require('fs');const p='/tmp/p2-artifact.json';const a=JSON.parse(fs.readFileSync(p));if(a.digest!==process.env.P2_ARCHIVE_SHA256)process.exit(2);a.downloaded_archive_sha256=process.env.P2_ARCHIVE_SHA256;fs.writeFileSync(p,JSON.stringify(a,null,2)+'\n');
          NODE
          unzip -q -o /tmp/p2.zip -d /tmp/p2-expanded
          copy_unique() { mapfile -t FILES < <(find "$1" -type f -name "$2" -print); test "${#FILES[@]}" -eq 1; cp -- "${FILES[0]}" "$3/$2"; }
          for NAME in owned-source-intelligence-graph-v2.json owned-source-intelligence-lineage-v2.json owned-source-intelligence-quality-v2.json owned-source-intelligence-value-receipt-v2.json owned-source-intelligence-manifest-v2.json kidults-asi-owned-source-intelligence-graph-kpmo-receipt-v2.json; do copy_unique /tmp/p2-expanded "$NAME" /tmp/p2; done
          P0B_ID="$(node -p "require('/tmp/p2/kidults-asi-owned-source-intelligence-graph-kpmo-receipt-v2.json').p0b_artifact_id")"
          P1_ID="$(node -p "require('/tmp/p2/kidults-asi-owned-source-intelligence-graph-kpmo-receipt-v2.json').p1_artifact_id")"
          [[ "$P0B_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$P1_ID" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0B_ID}" > /tmp/p0b-artifact.json
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P1_ID}" > /tmp/p1-artifact.json
          node - <<'NODE'
          const fs=require('fs');for(const [file,name] of [['/tmp/p0b-artifact.json','kidults-asi-p0b-bounded-discovery-candidates-v1'],['/tmp/p1-artifact.json','kidults-asi-p1-source-preflight-v1']]){const a=JSON.parse(fs.readFileSync(file));if(a.name!==name||a.expired!==false||a.workflow_run?.head_branch!=='main'||!(/^[0-9a-f]{40}$/.test(a.workflow_run?.head_sha||''))||!(/^sha256:[0-9a-f]{64}$/.test(a.digest||'')))process.exit(2);}
          NODE
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0B_ID}/zip" > /tmp/p0b.zip
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${P1_ID}/zip" > /tmp/p1.zip
          P0B_ARCHIVE_SHA256="sha256:$(sha256sum /tmp/p0b.zip | awk '{print $1}')"
          P1_ARCHIVE_SHA256="sha256:$(sha256sum /tmp/p1.zip | awk '{print $1}')"
          P0B_ARCHIVE_SHA256="$P0B_ARCHIVE_SHA256" P1_ARCHIVE_SHA256="$P1_ARCHIVE_SHA256" node - <<'NODE'
          const fs=require('fs');for(const [file,digest] of [['/tmp/p0b-artifact.json',process.env.P0B_ARCHIVE_SHA256],['/tmp/p1-artifact.json',process.env.P1_ARCHIVE_SHA256]]){const a=JSON.parse(fs.readFileSync(file));if(a.digest!==digest)process.exit(2);a.downloaded_archive_sha256=digest;fs.writeFileSync(file,JSON.stringify(a,null,2)+'\n');}
          NODE
          unzip -q -o /tmp/p0b.zip -d /tmp/p0b-expanded
          unzip -q -o /tmp/p1.zip -d /tmp/p1-expanded
          for NAME in p0b-source-candidate-registry-v1.json p0b-mission-candidate-binding-ledger-v1.json p0b-bounded-discovery-manifest-v1.json; do copy_unique /tmp/p0b-expanded "$NAME" /tmp/p0b; done
          for NAME in p1-gate1-source-safety-decisions-v1.json p1-evidence-admission-candidate-register-v1.json p1-preflight-action-queue-v1.json p1-source-preflight-manifest-v1.json; do copy_unique /tmp/p1-expanded "$NAME" /tmp/p1; done
          P2_RUN_ID="$P2_RUN_ID" P2_HEAD_SHA="$P2_HEAD_SHA" node - <<'NODE'
          const fs=require('fs');const workflowRun=process.env.GITHUB_EVENT_NAME==='workflow_run';const value={repository:process.env.GITHUB_REPOSITORY,trigger_event:process.env.GITHUB_EVENT_NAME,event_upstream_run_id:workflowRun?process.env.EVENT_P2_RUN_ID:null,event_upstream_head_sha:workflowRun?process.env.EVENT_P2_HEAD_SHA:null,p2_run:JSON.parse(fs.readFileSync('/tmp/p2-run.json')),artifacts:{p0b:JSON.parse(fs.readFileSync('/tmp/p0b-artifact.json')),p1:JSON.parse(fs.readFileSync('/tmp/p1-artifact.json')),p2:JSON.parse(fs.readFileSync('/tmp/p2-artifact.json'))}};fs.writeFileSync('/tmp/p3-upstream-binding.json',JSON.stringify(value,null,2)+'\n');
          NODE
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-upstream-binding-v2.mjs \
            /tmp/p3-upstream-binding.json /tmp/p0b /tmp/p1 /tmp/p2 \
            /tmp/kidults-asi-snapshot-readiness-upstream-binding-v2.json
          echo "P0B_ARTIFACT_ID=$P0B_ID" >> "$GITHUB_ENV"
          echo "P1_ARTIFACT_ID=$P1_ID" >> "$GITHUB_ENV"
          echo "P2_ARTIFACT_ID=$P2_ID" >> "$GITHUB_ENV"
          echo "P2_WORKFLOW_RUN_ID=$P2_RUN_ID" >> "$GITHUB_ENV"
          echo "P2_HEAD_SHA=$P2_HEAD_SHA" >> "$GITHUB_ENV"
          echo "p0b_artifact_id=$P0B_ID"
          echo "p1_artifact_id=$P1_ID"
          echo "p2_artifact_id=$P2_ID"
          echo "p2_workflow_run_id=$P2_RUN_ID"
          echo "p2_head_sha=$P2_HEAD_SHA"
      - name: Build current P3 readiness twice
        run: |
          set -euo pipefail
          for RUN in 1 2; do
            node scripts/kidults/source-intelligence/build-asi-snapshot-readiness-factory-v2.mjs \
              /tmp/p0b/p0b-source-candidate-registry-v1.json \
              /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json \
              /tmp/p0b/p0b-bounded-discovery-manifest-v1.json \
              /tmp/p1/p1-gate1-source-safety-decisions-v1.json \
              /tmp/p1/p1-evidence-admission-candidate-register-v1.json \
              /tmp/p1/p1-preflight-action-queue-v1.json \
              /tmp/p1/p1-source-preflight-manifest-v1.json \
              /tmp/p2/owned-source-intelligence-graph-v2.json \
              /tmp/p2/owned-source-intelligence-lineage-v2.json \
              /tmp/p2/owned-source-intelligence-quality-v2.json \
              /tmp/p2/owned-source-intelligence-value-receipt-v2.json \
              /tmp/p2/owned-source-intelligence-manifest-v2.json \
              coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json \
              "/tmp/kidults-asi-snapshot-readiness-factory-run-${RUN}"
          done
          diff -qr /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/kidults-asi-snapshot-readiness-factory-run-2
      - name: Validate current P3 readiness and forbidden-file absence
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs \
            /tmp/kidults-asi-snapshot-readiness-factory-run-1 \
            /tmp/p0b/p0b-source-candidate-registry-v1.json \
            /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json \
            /tmp/p0b/p0b-bounded-discovery-manifest-v1.json \
            /tmp/p1/p1-gate1-source-safety-decisions-v1.json \
            /tmp/p1/p1-evidence-admission-candidate-register-v1.json \
            /tmp/p1/p1-preflight-action-queue-v1.json \
            /tmp/p1/p1-source-preflight-manifest-v1.json \
            /tmp/p2/owned-source-intelligence-graph-v2.json \
            /tmp/p2/owned-source-intelligence-lineage-v2.json \
            /tmp/p2/owned-source-intelligence-quality-v2.json \
            /tmp/p2/owned-source-intelligence-value-receipt-v2.json \
            /tmp/p2/owned-source-intelligence-manifest-v2.json \
            coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json \
            | tee /tmp/kidults-asi-snapshot-readiness-factory-validation-v2.json
      - name: Reject false snapshot candidate mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-false-snapshot
          printf '%s\n' '{"id":"fabricated"}' > /tmp/bad-false-snapshot/snapshot-candidate.json
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-false-snapshot /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject false evidence admission mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-false-admission
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-false-admission/snapshot-readiness-ledger-v2.json';const x=JSON.parse(fs.readFileSync(p));x.counts.evidence_admitted=1;x.snapshot_creation_gate_pass=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-false-admission /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject Track B start mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-track-b
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-track-b/track-b-handoff-readiness-v2.json';const x=JSON.parse(fs.readFileSync(p));x.state='READY_FOR_INDEPENDENT_ASSESSMENT';x.independent_assessment_started=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-track-b /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject missing blocker mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-missing-blocker
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-missing-blocker/immutable-blocker-package-v2.json';const x=JSON.parse(fs.readFileSync(p));x.blockers=x.blockers.length?x.blockers.slice(1):[{blocker_class:'FABRICATED',severity:'P0'}];x.blocker_count=x.blockers.length;x.p0_blocker_count=x.blockers.filter(v=>v.severity==='P0').length;x.p1_blocker_count=x.blockers.filter(v=>v.severity==='P1').length;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-snapshot-readiness-factory-v2.mjs /tmp/bad-missing-blocker /tmp/p0b/p0b-source-candidate-registry-v1.json /tmp/p0b/p0b-mission-candidate-binding-ledger-v1.json /tmp/p0b/p0b-bounded-discovery-manifest-v1.json /tmp/p1/p1-gate1-source-safety-decisions-v1.json /tmp/p1/p1-evidence-admission-candidate-register-v1.json /tmp/p1/p1-preflight-action-queue-v1.json /tmp/p1/p1-source-preflight-manifest-v1.json /tmp/p2/owned-source-intelligence-graph-v2.json /tmp/p2/owned-source-intelligence-lineage-v2.json /tmp/p2/owned-source-intelligence-quality-v2.json /tmp/p2/owned-source-intelligence-value-receipt-v2.json /tmp/p2/owned-source-intelligence-manifest-v2.json coordination/kidults/source-intelligence/asi-snapshot-readiness-factory-contract-v2.json; then exit 1; fi
      - name: Reject blocker package as Evidence Package mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-snapshot-readiness-factory-run-1 /tmp/bad-blocker-package
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-blocker-package/immutable-blocker-package-v2.json';const x=JSON.parse(fs.readFileSync(p));x.package_is_evidence_package=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
