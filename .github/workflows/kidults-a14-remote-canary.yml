name: Kidults A14 Remote Canary Validation

on:
  pull_request:
    paths:
      - 'services/kidults-autonomous-intelligence/**'
      - '.github/workflows/kidults-a14-remote-canary.yml'

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/kidults-autonomous-intelligence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Verify A14 command wiring
        run: |
          node -e "const p=require('./package.json'); for (const k of ['a14:canary','a14:certify','a14:finalize']) if(!p.scripts[k]) process.exit(1)"
      - name: Verify production guard, cleanup and exact certification identity fence exist
        run: |
          grep -q "A14 remote canary is blocked in production" scripts/a14-remote-capacity-canary.mjs
          grep -q "DROP TABLE IF EXISTS" scripts/a14-remote-capacity-canary.mjs
          grep -q '\$certifiedHead = (git rev-parse HEAD).Trim()' scripts/stage-finalize.ps1
          grep -q '\$targetMain = (git rev-parse origin/main).Trim()' scripts/stage-finalize.ps1
          grep -q 'if (\$certifiedHead -ne \$targetMain)' scripts/stage-finalize.ps1
          grep -q 'rerun the stage certification on the current origin/main before finalizing' scripts/stage-finalize.ps1
          grep -q "git pull --ff-only origin main" scripts/stage-finalize.ps1
          grep -q 'if (\$finalHead -ne \$certifiedHead)' scripts/stage-finalize.ps1
          grep -q 'Final SHA:' scripts/stage-finalize.ps1

  remote-canary-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED_SHA"
          echo "actual=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Assert remote canary is explicit/manual-runtime only
        run: |
          SCRIPT='services/kidults-autonomous-intelligence/scripts/a14-remote-capacity-canary.mjs'
          grep -q "'wrangler'" "$SCRIPT"
          grep -q "'d1'" "$SCRIPT"
          grep -q "'execute'" "$SCRIPT"
          grep -q "'DB'" "$SCRIPT"
          grep -q "'--remote'" "$SCRIPT"
          echo 'Remote D1 execution requires authenticated operator environment; PR CI does not mutate remote D1.'
