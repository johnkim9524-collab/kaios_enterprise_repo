name: KIDULTS ASI P0 Mission Consumption v1

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0-mission-consumption-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json'
      - 'coordination/kidults/source-intelligence/asi-intelligence-preparation-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-engine-principle-alignment-registry-v2.json'
      - 'coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json'
      - 'coordination/kidults/kpmo/verified-intelligence-surface-baseline-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-intelligence-preparation-wave-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-intelligence-preparation-wave-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-p0-mission-consumption-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-registry-v1.mjs'
      - 'services/kidults-autonomous-intelligence/src/asi/event.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/registry.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/alignment.ts'
      - 'services/kidults-autonomous-intelligence/scripts/asi-p0-mission-consumption-runtime-test.mjs'
      - 'docs/kidults/asi/asi-p0-mission-consumption-v1.md'
      - '.github/workflows/kidults-asi-p0-mission-consumption-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json'
      - 'coordination/kidults/source-intelligence/asi-p0-mission-consumption-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json'
      - 'coordination/kidults/source-intelligence/asi-intelligence-preparation-registry-v1.json'
      - 'coordination/kidults/source-intelligence/asi-engine-principle-alignment-registry-v2.json'
      - 'coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json'
      - 'coordination/kidults/kpmo/verified-intelligence-surface-baseline-v1.json'
      - 'coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json'
      - 'scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-intelligence-preparation-wave-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-intelligence-preparation-wave-v1.mjs'
      - 'scripts/kidults/source-intelligence/build-asi-p0-mission-consumption-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs'
      - 'scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-registry-v1.mjs'
      - 'services/kidults-autonomous-intelligence/src/asi/event.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/registry.ts'
      - 'services/kidults-autonomous-intelligence/src/asi/alignment.ts'
      - 'services/kidults-autonomous-intelligence/scripts/asi-p0-mission-consumption-runtime-test.mjs'
      - 'docs/kidults/asi/asi-p0-mission-consumption-v1.md'
      - '.github/workflows/kidults-asi-p0-mission-consumption-v1.yml'
  workflow_run:
    workflows:
      - 'KIDULTS ASI Intelligence Preparation Wave v1'
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-p0-mission-consumption-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consume-missions:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: services/kidults-autonomous-intelligence/package-lock.json
      - name: Verify exact source, syntax and contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs
          node --check scripts/kidults/source-intelligence/build-asi-intelligence-preparation-wave-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-intelligence-preparation-wave-v1.mjs
          node --check scripts/kidults/source-intelligence/build-asi-p0-mission-consumption-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs
          node --check scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-registry-v1.mjs
          node --check services/kidults-autonomous-intelligence/scripts/asi-p0-mission-consumption-runtime-test.mjs
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('coordination/kidults/source-intelligence/asi-p0-mission-consumption-registry-v1.json','utf8'))"
      - name: Validate P0 registered assets and automatic activation
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-registry-v1.mjs \
            | tee /tmp/kidults-asi-p0-mission-consumption-registry-validation-v1.json
      - name: Build current Intelligence Preparation Wave
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-global-source-mesh-v1.mjs \
            coordination/kidults/scope-data/collection-scope-data-requirement-matrix-v1.1.json \
            coordination/kidults/source-intelligence/global-source-mesh-contract-v1.json \
            /tmp/kidults-global-source-mesh-v1.json
          node scripts/kidults/source-intelligence/build-asi-intelligence-preparation-wave-v1.mjs \
            /tmp/kidults-global-source-mesh-v1.json \
            coordination/kidults/kpmo/verified-intelligence-surface-baseline-v1.json \
            coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json \
            /tmp/kidults-asi-intelligence-preparation-wave-v1
          node scripts/kidults/source-intelligence/validate-asi-intelligence-preparation-wave-v1.mjs \
            /tmp/kidults-asi-intelligence-preparation-wave-v1 \
            coordination/kidults/source-intelligence/asi-intelligence-preparation-wave-v1.json \
            > /tmp/kidults-asi-intelligence-preparation-wave-validation-v1.json
      - name: Consume all missions into discovery tasks
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/build-asi-p0-mission-consumption-v1.mjs \
            /tmp/kidults-asi-intelligence-preparation-wave-v1/autonomous-mission-queue-v1.json \
            coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json \
            services/kidults-autonomous-intelligence/src/asi/registry.ts \
            /tmp/kidults-asi-p0-mission-consumption-v1
          node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs \
            /tmp/kidults-asi-p0-mission-consumption-v1 \
            coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json \
            | tee /tmp/kidults-asi-p0-mission-consumption-validation-v1.json
      - name: Install bounded runtime dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all discovery tasks through ASI runtime alignment preflight
        working-directory: services/kidults-autonomous-intelligence
        run: |
          set -euo pipefail
          node scripts/asi-p0-mission-consumption-runtime-test.mjs \
            /tmp/kidults-asi-p0-mission-consumption-v1/p0-source-discovery-task-queue-v1.json \
            /tmp/kidults-asi-p0-mission-runtime-receipts-v1.json \
            | tee /tmp/kidults-asi-p0-mission-runtime-validation-v1.json
      - name: Reject mission-not-consumed mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0-mission-consumption-v1 /tmp/bad-mission-consumption
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-mission-consumption/p0-mission-consumption-ledger-v1.json';const x=JSON.parse(fs.readFileSync(p));x.receipts[0].state='QUEUED_NOT_CONSUMED';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs /tmp/bad-mission-consumption; then
            echo 'Validator accepted unconsumed mission' >&2
            exit 1
          fi
      - name: Reject optional licensed-fleet assignment mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0-mission-consumption-v1 /tmp/bad-licensed-assignment
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-licensed-assignment/p0-source-discovery-task-queue-v1.json';const x=JSON.parse(fs.readFileSync(p));x.tasks[0].target_fleet='DISCOVERY_OPTIONAL_LICENSED_GAP_FILL';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs /tmp/bad-licensed-assignment; then
            echo 'Validator accepted unauthorized licensed fleet assignment' >&2
            exit 1
          fi
      - name: Reject payload routing bypass mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0-mission-consumption-v1 /tmp/bad-routing-bypass
          node - <<'NODE'
          const fs=require('fs');const crypto=require('crypto');const p='/tmp/bad-routing-bypass/p0-source-discovery-task-queue-v1.json';const x=JSON.parse(fs.readFileSync(p));const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;x.tasks[0].event.payload.target_fleet='DISCOVERY_OPTIONAL_LICENSED_GAP_FILL';x.tasks[0].event.payload_hash='sha256:'+crypto.createHash('sha256').update(JSON.stringify(stable(x.tasks[0].event.payload))).digest('hex');fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs /tmp/bad-routing-bypass; then
            echo 'Validator accepted payload-level routing bypass' >&2
            exit 1
          fi
      - name: Reject source-candidate overclaim mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0-mission-consumption-v1 /tmp/bad-candidate-overclaim
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-candidate-overclaim/p0-mission-consumption-manifest-v1.json';const x=JSON.parse(fs.readFileSync(p));x.results.source_candidates_created=1;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs /tmp/bad-candidate-overclaim; then
            echo 'Validator accepted unsupported source-candidate claim' >&2
            exit 1
          fi
      - name: Reject permission promotion mutation
        run: |
          set -euo pipefail
          cp -a /tmp/kidults-asi-p0-mission-consumption-v1 /tmp/bad-permission-promotion
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/bad-permission-promotion/p0-source-discovery-task-queue-v1.json';const x=JSON.parse(fs.readFileSync(p));x.tasks[0].collection_authorized=true;fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs /tmp/bad-permission-promotion; then
            echo 'Validator accepted collection permission promotion' >&2
            exit 1
          fi
      - name: Reject manual-only activation mutation
        run: |
          set -euo pipefail
          cp coordination/kidults/source-intelligence/asi-p0-mission-consumption-registry-v1.json /tmp/p0-registry.json
          node - <<'NODE'
          const fs=require('fs');const p='coordination/kidults/source-intelligence/asi-p0-mission-consumption-registry-v1.json';const x=JSON.parse(fs.readFileSync(p));x.automatic_activation.main_push=false;x.automatic_activation.upstream_workflow='NONE';fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
          if node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-registry-v1.mjs; then
            echo 'Validator accepted manual-only P0 activation' >&2
            exit 1
          fi
          mv /tmp/p0-registry.json coordination/kidults/source-intelligence/asi-p0-mission-consumption-registry-v1.json
      - name: Revalidate pristine P0 execution
        run: |
          set -euo pipefail
          node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-registry-v1.mjs \
            > /tmp/kidults-asi-p0-mission-consumption-registry-final-validation-v1.json
          node scripts/kidults/source-intelligence/validate-asi-p0-mission-consumption-v1.mjs \
            /tmp/kidults-asi-p0-mission-consumption-v1 \
            coordination/kidults/source-intelligence/asi-p0-mission-consumption-contract-v1.json \
            > /tmp/kidults-asi-p0-mission-consumption-final-validation-v1.json
      - name: Emit KPMO P0 mission-consumption receipt
        run: |
          node - <<'NODE' >/tmp/kidults-asi-p0-mission-consumption-receipt-v1.json
          const fs=require('fs');const crypto=require('crypto');const p='/tmp/kidults-asi-p0-mission-consumption-v1/p0-mission-consumption-manifest-v1.json';const m=JSON.parse(fs.readFileSync(p));const runtime=JSON.parse(fs.readFileSync('/tmp/kidults-asi-p0-mission-runtime-receipts-v1.json'));const digest='sha256:'+crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');process.stdout.write(JSON.stringify({id:'kidults-asi-p0-mission-consumption-receipt-v1',state:'VERIFIED_PASS',source_sha:process.env.GITHUB_SHA,trigger_event:process.env.GITHUB_EVENT_NAME,manifest_digest:digest,results:m.results,runtime_preflight:{missions:runtime.missions_runtime_preflighted,tasks:runtime.discovery_tasks_runtime_preflighted,fleets:runtime.runtime_registered_discovery_fleets_exercised,receipts:runtime.alignment_receipts},autonomous_effect:m.autonomous_effect,global_effect:m.global_effect,irreplaceable_value_effect:m.irreplaceable_value_effect,transparency_effect:m.transparency_effect,external_network_calls_executed:0,source_candidates_created:0,evidence_admitted:0,market_claims_created:0,public_release:'HOLD',production:'HOLD'},null,2));
          NODE
          cat /tmp/kidults-asi-p0-mission-consumption-receipt-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-p0-mission-consumption-v1
          path: |
            /tmp/kidults-global-source-mesh-v1.json
            /tmp/kidults-asi-intelligence-preparation-wave-v1
            /tmp/kidults-asi-p0-mission-consumption-v1
            /tmp/kidults-asi-p0-mission-runtime-receipts-v1.json
            /tmp/kidults-asi-p0-mission-runtime-validation-v1.json
            /tmp/kidults-asi-p0-mission-consumption-registry-validation-v1.json
            /tmp/kidults-asi-p0-mission-consumption-registry-final-validation-v1.json
            /tmp/kidults-asi-p0-mission-consumption-validation-v1.json
            /tmp/kidults-asi-p0-mission-consumption-final-validation-v1.json
            /tmp/kidults-asi-p0-mission-consumption-receipt-v1.json
          retention-days: 90
          if-no-files-found: error
