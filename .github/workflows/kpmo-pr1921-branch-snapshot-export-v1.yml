name: KPMO PR1921 Branch Snapshot Export V1
run-name: KPMO PR1921 exact source snapshot / ${{ github.sha }}

on:
  push:
    branches:
      - 'kpmo/p0-track-a-current-sold-jd-holistic-v1'

permissions:
  contents: read

concurrency:
  group: kpmo-pr1921-source-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export-exact-source:
    if: github.repository == 'johnkim9524-collab/kaios_enterprise_repo' && github.actor == 'johnkim9524-collab'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Package exact branch source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          paths=(
            .github/workflows
            scripts/kidults
            tests/kidults
            coordination/kidults
            docs/kidults
            infrastructure/postgres
            package.json
            npm-shrinkwrap.json
          )
          for path in "${paths[@]}"; do test -e "$path"; done
          tar -czf /tmp/kpmo-pr1921-source-snapshot.tgz "${paths[@]}"
          sha256sum /tmp/kpmo-pr1921-source-snapshot.tgz > /tmp/kpmo-pr1921-source-snapshot.sha256

      - name: Retain exact source snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kpmo-pr1921-source-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/kpmo-pr1921-source-snapshot.tgz
            /tmp/kpmo-pr1921-source-snapshot.sha256
          retention-days: 1
          if-no-files-found: error
          overwrite: false
