name: KIDULTS Autonomous Art Institute Design Sample

on:
  push:
    branches:
      - "feat/kidults-phase2-content-data-provider-foundation"
    paths:
      - "coordination/kidults/autonomous/source-discovery/contracts/artic-design-open-access-r1.json"
      - "scripts/kidults/autonomous/collect-artic-design-sample.mjs"
      - "scripts/kidults/autonomous/validate-artic-design-sample.mjs"
      - ".github/workflows/kidults-autonomous-artic-sample.yml"
  schedule:
    - cron: "25 23 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidults-autonomous-artic-sample
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check scripts/kidults/autonomous/collect-artic-design-sample.mjs
          node --check scripts/kidults/autonomous/validate-artic-design-sample.mjs

      - name: Collect bounded live metadata sample
        run: |
          node scripts/kidults/autonomous/collect-artic-design-sample.mjs \
            --output artifacts/autonomous-source-samples/artic-design-open-access-r1 \
            --query design \
            --search-limit 50 \
            --limit 12 \
            --minimum-records 8

      - name: Validate evidence and safety gates
        run: |
          node scripts/kidults/autonomous/validate-artic-design-sample.mjs \
            artifacts/autonomous-source-samples/artic-design-open-access-r1

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kidults-artic-design-bounded-sample
          path: artifacts/autonomous-source-samples/artic-design-open-access-r1
          if-no-files-found: error
          retention-days: 30
