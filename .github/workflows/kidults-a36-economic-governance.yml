name: Kidults A36 Autonomous Cost, Budget & Economic Governance

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/kidults-autonomous-intelligence/scripts/a36-economic-governance.mjs'
      - 'services/kidults-autonomous-intelligence/fixtures/a36/**'
      - 'services/kidults-autonomous-intelligence/package.json'
      - '.github/workflows/kidults-a36-economic-governance.yml'

concurrency:
  group: kidults-a36-economic-governance
  cancel-in-progress: false

jobs:
  a36-economic-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: services/kidults-autonomous-intelligence
        run: npm install

      - name: Verify A36 package scripts exist
        working-directory: services/kidults-autonomous-intelligence
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf-8'));
            const required = ['a36:gate', 'a36:certify', 'a36:finalize'];
            const missing = required.filter(s => !pkg.scripts[s]);
            if (missing.length) { console.error('MISSING SCRIPTS:', missing.join(', ')); process.exit(1); }
            console.log('A36 scripts present:', required.join(', '));
          "

      - name: Typecheck
        working-directory: services/kidults-autonomous-intelligence
        run: npm run typecheck

      - name: Run A36 economic governance gate
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a36:gate
        env:
          A36_MODE: SIMULATION

      - name: Run A36 certify
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a36:certify
        env:
          A36_MODE: SIMULATION

      - name: Run upstream A35 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a35:certify
        env:
          A35_MODE: SIMULATION

      - name: Run upstream A34 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a34:certify
        env:
          A34_MODE: SIMULATION

      - name: Run upstream A33 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a33:certify
        env:
          A33_MODE: SIMULATION

      - name: Run upstream A32 certification
        working-directory: services/kidults-autonomous-intelligence
        run: npm run a32:certify
        env:
          A32_MODE: SIMULATION

      - name: List package scripts
        working-directory: services/kidults-autonomous-intelligence
        run: npm run

      - name: Upload A36 evidence
        uses: actions/upload-artifact@v6
        with:
          name: a36-economic-governance-evidence
          path: services/kidults-autonomous-intelligence/reports/economic-governance/
          retention-days: 90
          if-no-files-found: error
