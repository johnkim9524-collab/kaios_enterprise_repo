name: KIDULTS ASI Global Any-Site Hourly Pooling v1

on:
  # Legacy recovery only. v2 is the sole scheduled canonical hourly producer.
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kidults/source-intelligence/**'
      - 'scripts/kidults/supply-chain/**'
      - 'scripts/kidults/kpmo/validate-safe-zip-archive-v1.py'
      - 'coordination/kidults/source-intelligence/asi-admitted-metadata-revocation-registry-v1.json'
      - '.github/workflows/kidults-asi-global-any-site-hourly-pooling-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kidults-asi-global-any-site-hourly-v1-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate-legacy-recovery-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact PR source and deterministic gate regression suite
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          for file in \
            scripts/kidults/source-intelligence/validate-asi-gate1-safe-candidate-pool-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-gate2-independent-reverification-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-gate3-admission-runtime-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-admitted-metadata-pool-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-common-crawl-any-site-gate-binding-v1.mjs \
            scripts/kidults/source-intelligence/prepare-asi-gate-negative-mutation-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-gate-negative-mutation-harness-v1.mjs; do
            node --check "$file"
          done
          node scripts/kidults/source-intelligence/prepare-asi-gate-negative-mutation-v1.mjs --self-test
          node scripts/kidults/source-intelligence/validate-asi-gate-negative-mutation-harness-v1.mjs --self-test
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py

  legacy-recovery-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify exact protected-main recovery source and runtime syntax
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          LIVE_MAIN_SHA=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          test "$GITHUB_SHA" = "$LIVE_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$LIVE_MAIN_SHA"
          for file in \
            scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs \
            scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs \
            scripts/kidults/source-intelligence/merge-asi-common-crawl-into-global-discovery-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-common-crawl-canonical-merge-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-common-crawl-downstream-binding-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-gate1-safe-candidate-pool-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-gate1-safe-candidate-pool-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-gate2-independent-reverification-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-gate2-independent-reverification-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-gate3-admission-runtime-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-gate3-admission-runtime-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-admitted-metadata-pool-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-admitted-metadata-pool-v1.mjs \
            scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs \
            scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs \
            scripts/kidults/source-intelligence/prepare-asi-gate-negative-mutation-v1.mjs \
            scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs; do
            node --check "$file"
          done
          node scripts/kidults/source-intelligence/prepare-asi-gate-negative-mutation-v1.mjs --self-test
          python3 -m py_compile scripts/kidults/kpmo/validate-safe-zip-archive-v1.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore immutable anchor foundation and previous Any-Site pool
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input queue discovery-out /tmp/previous-any-site-pool
          node scripts/kidults/supply-chain/restore-canonical-anchor-artifact-v1.mjs \
            /tmp/anchor-foundation.zip /tmp/kidults-canonical-anchor-restore-receipt-v1.json
          ANCHOR_DIGEST=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/kidults-canonical-anchor-restore-receipt-v1.json")).artifact_digest')
          python3 scripts/kidults/kpmo/validate-safe-zip-archive-v1.py \
            --archive /tmp/anchor-foundation.zip \
            --expected-digest "$ANCHOR_DIGEST" \
            --receipt /tmp/anchor-foundation-safe-zip-receipt-v1.json \
            --max-compressed-bytes 67108864 \
            --max-entries 2048 \
            --max-entry-uncompressed-bytes 67108864 \
            --max-total-uncompressed-bytes 268435456 \
            --max-compression-ratio 100 \
            --required-basename category-representative-product-registry-v1.json \
            --required-basename representative-product-evidence-plan-v1.json \
            --required-basename representative-product-gap-matrix-v1.json \
            --required-basename representative-product-engine-alignment-v1.json \
            --required-basename representative-product-source-sufficiency-driver-v1.json \
            --required-basename run-manifest.json
          unzip -q -o /tmp/anchor-foundation.zip -d input
          node scripts/kidults/supply-chain/validate-canonical-anchor-extracted-v1.mjs input
          node scripts/kidults/supply-chain/restore-exact-github-artifact-v1.mjs \
            --workflow-path .github/workflows/kidults-asi-global-any-site-hourly-pooling-v1.yml \
            --workflow-name 'KIDULTS ASI Global Any-Site Hourly Pooling v1' \
            --artifact-name kidults-asi-global-any-site-source-pool-v1 \
            --branch main \
            --archive /tmp/previous-any-site-pool.zip \
            --extract-dir /tmp/previous-any-site-pool \
            --receipt /tmp/previous-any-site-pool-exact-restore-receipt-v1.json \
            --required-basename asi-admitted-metadata-pool-v1.json \
            --required-basename asi-proactive-source-pool-v1.json \
            --allowed-event workflow_dispatch \
            --max-pages 40 \
            --lookback-days 95 \
            --max-compressed-bytes 67108864 \
            --allow-no-producer-history

      - name: Build governed 160-anchor and 32-scope demand queue
        run: |
          node scripts/kidults/source-intelligence/build-product-linked-targeted-asi-queue-v1.mjs input queue
          node scripts/kidults/source-intelligence/validate-product-linked-targeted-asi-queue-v1.mjs queue
      - name: Discover GLOBAL ANY-SITE recovery candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/kidults/source-intelligence/asi-global-low-risk-discovery-v1.mjs queue discovery-out
      - name: Validate recovery discovery boundary
        run: node scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs discovery-out/global-low-risk-discovery.json
      - name: Expand and merge Common Crawl recovery metadata
        run: |
          node scripts/kidults/source-intelligence/asi-common-crawl-host-expansion-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-common-crawl-host-expansion-v1.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-host-expansion-v1.mjs /tmp/asi-common-crawl-host-expansion-v1.json
          node scripts/kidults/source-intelligence/merge-asi-common-crawl-into-global-discovery-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-common-crawl-host-expansion-v1.json discovery-out/global-low-risk-discovery.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-canonical-merge-v1.mjs discovery-out/global-low-risk-discovery.json
          node scripts/kidults/source-intelligence/validate-asi-global-low-risk-discovery-v1.mjs discovery-out/global-low-risk-discovery.json
      - name: Execute bounded Gate1 Gate2 Gate3 recovery chain
        run: |
          node scripts/kidults/source-intelligence/build-asi-gate1-safe-candidate-pool-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-gate1-safe-candidate-pool-v1.json
          node scripts/kidults/source-intelligence/validate-asi-gate1-safe-candidate-pool-v1.mjs /tmp/asi-gate1-safe-candidate-pool-v1.json
          node scripts/kidults/source-intelligence/build-asi-gate2-independent-reverification-v1.mjs /tmp/asi-gate1-safe-candidate-pool-v1.json /tmp/asi-gate2-independent-reverification-v1.json
          node scripts/kidults/source-intelligence/validate-asi-gate2-independent-reverification-v1.mjs /tmp/asi-gate2-independent-reverification-v1.json
          node scripts/kidults/source-intelligence/build-asi-gate3-admission-runtime-v1.mjs /tmp/asi-gate2-independent-reverification-v1.json /tmp/asi-gate3-admission-runtime-v1.json
          node scripts/kidults/source-intelligence/validate-asi-gate3-admission-runtime-v1.mjs /tmp/asi-gate3-admission-runtime-v1.json
      - name: Revalidate admitted metadata and rolling candidate pool
        run: |
          node scripts/kidults/source-intelligence/build-asi-admitted-metadata-pool-v1.mjs /tmp/asi-gate3-admission-runtime-v1.json /tmp/previous-any-site-pool/asi-admitted-metadata-pool-v1.json coordination/kidults/source-intelligence/asi-admitted-metadata-revocation-registry-v1.json /tmp/asi-admitted-metadata-pool-v1.json
          node scripts/kidults/source-intelligence/validate-asi-admitted-metadata-pool-v1.mjs /tmp/asi-admitted-metadata-pool-v1.json
          node scripts/kidults/source-intelligence/build-asi-proactive-source-pool-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/previous-any-site-pool/asi-proactive-source-pool-v1.json /tmp/asi-proactive-source-pool-v1.json
          node scripts/kidults/source-intelligence/validate-asi-proactive-source-pool-v1.mjs /tmp/asi-proactive-source-pool-v1.json
          node scripts/kidults/source-intelligence/validate-asi-common-crawl-downstream-binding-v1.mjs discovery-out/global-low-risk-discovery.json /tmp/asi-gate1-safe-candidate-pool-v1.json /tmp/asi-proactive-source-pool-v1.json
      - name: Emit non-promoting legacy recovery receipt
        run: |
          node - <<'NODE' >/tmp/asi-global-any-site-hourly-cycle-receipt-v1.json
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('discovery-out/global-low-risk-discovery.json'));const g1=JSON.parse(fs.readFileSync('/tmp/asi-gate1-safe-candidate-pool-v1.json'));const g2=JSON.parse(fs.readFileSync('/tmp/asi-gate2-independent-reverification-v1.json'));const g3=JSON.parse(fs.readFileSync('/tmp/asi-gate3-admission-runtime-v1.json'));const a=JSON.parse(fs.readFileSync('/tmp/asi-admitted-metadata-pool-v1.json'));const p=JSON.parse(fs.readFileSync('/tmp/asi-proactive-source-pool-v1.json'));
          process.stdout.write(JSON.stringify({id:'kidults-asi-global-any-site-hourly-cycle-receipt-v1',version:'1.1.0',status:'LEGACY_RECOVERY_CONTROL_COMPLETE',trigger_event:process.env.GITHUB_EVENT_NAME,source_sha:process.env.GITHUB_SHA,discovered_candidates:d.candidate_count,gate1_safe_candidates:g1.safe_candidate_count,gate1_review_required:g1.review_required_count,gate1_hard_blocked:g1.hard_block_count,gate2_verified_for_gate3:g2.verified_for_gate3_count,gate3_bounded_metadata_admitted:g3.admitted_count,active_admitted_metadata:a.active_count,rolling_discovery_pool_candidates:p.candidate_count,content_acquisition_authorized:false,collection_right_created:false,promotion_eligible:false,public_release:'HOLD',production:'HOLD',g5:'HOLD'},null,2));
          NODE
          cat /tmp/asi-global-any-site-hourly-cycle-receipt-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-global-any-site-source-pool-v1
          path: |
            /tmp/asi-proactive-source-pool-v1.json
            /tmp/asi-gate1-safe-candidate-pool-v1.json
            /tmp/asi-gate2-independent-reverification-v1.json
            /tmp/asi-gate3-admission-runtime-v1.json
            /tmp/asi-admitted-metadata-pool-v1.json
            /tmp/asi-common-crawl-host-expansion-v1.json
            /tmp/asi-global-any-site-hourly-cycle-receipt-v1.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kidults-asi-global-any-site-hourly-cycle-v1
          path: |
            discovery-out/global-low-risk-discovery.json
            /tmp/asi-common-crawl-host-expansion-v1.json
          retention-days: 14
          if-no-files-found: error