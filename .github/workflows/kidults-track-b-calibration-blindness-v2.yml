name: KIDULTS Track B Calibration Blindness v2.2

on:
  pull_request:
    paths:
      - "scripts/kidults/source-intelligence/build-track-b-calibration-readiness-v2.mjs"
      - "scripts/kidults/source-intelligence/build-track-b-calibration-readiness-v2-blind.mjs"
      - "scripts/kidults/source-intelligence/validate-track-b-calibration-readiness-v2.mjs"
      - "scripts/kidults/source-intelligence/validate-track-b-calibration-readiness-v2-blind.mjs"
      - ".github/workflows/kidults-track-b-calibration-blindness-v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kidults-track-b-calibration-blindness-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blindness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          node --check scripts/kidults/source-intelligence/build-track-b-calibration-readiness-v2.mjs
          node --check scripts/kidults/source-intelligence/build-track-b-calibration-readiness-v2-blind.mjs
          node --check scripts/kidults/source-intelligence/validate-track-b-calibration-readiness-v2.mjs
          node --check scripts/kidults/source-intelligence/validate-track-b-calibration-readiness-v2-blind.mjs

      - name: Download immutable calibration inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/input/source-relevance-precision-v1
          mkdir -p artifacts/input/source-precision-ranking-v2-final
          mkdir -p artifacts/input/targeted-high-authority-source-expansion-v1-fixed

          gh run download 31983701963 --repo "johnkim9524-collab/kaios_enterprise_repo" --name kidults-source-relevance-precision-v1 --dir artifacts/input/source-relevance-precision-v1
          gh run download 31986434921 --repo "johnkim9524-collab/kaios_enterprise_repo" --name kidults-source-precision-ranking-v2-final --dir artifacts/input/source-precision-ranking-v2-final
          gh run download 31990288099 --repo "johnkim9524-collab/kaios_enterprise_repo" --name kidults-targeted-high-authority-source-expansion-v1-fixed --dir artifacts/input/targeted-high-authority-source-expansion-v1-fixed

      - name: Build evidence-only blindness-hardened calibration package
        run: |
          node scripts/kidults/source-intelligence/build-track-b-calibration-readiness-v2-blind.mjs \
            --precision-input artifacts/input/source-relevance-precision-v1 \
            --v2-input artifacts/input/source-precision-ranking-v2-final \
            --targeted-input artifacts/input/targeted-high-authority-source-expansion-v1-fixed \
            --output artifacts/agci-os/track-b-calibration-readiness-v2-blind \
            --write

      - name: Prove deterministic blind rerun
        run: |
          for attempt in 1 2; do
            node scripts/kidults/source-intelligence/build-track-b-calibration-readiness-v2-blind.mjs \
              --precision-input artifacts/input/source-relevance-precision-v1 \
              --v2-input artifacts/input/source-precision-ranking-v2-final \
              --targeted-input artifacts/input/targeted-high-authority-source-expansion-v1-fixed \
              --output "/tmp/track-b-calibration-blind-$attempt" \
              --write
          done
          for file in \
            track-b-calibration-review-package-v2.json \
            track-b-calibration-batches-v2.json \
            track-b-label-assessment-template-v2.json \
            high-authority-source-depth-ledger-v2.json \
            scope-source-expansion-work-queue-v2.json \
            source-role-depth-gap-matrix-v2.json \
            top200-readiness-gate-v2.json \
            run-manifest.json; do
            cmp "/tmp/track-b-calibration-blind-1/$file" "/tmp/track-b-calibration-blind-2/$file"
            cmp "artifacts/agci-os/track-b-calibration-readiness-v2-blind/$file" "/tmp/track-b-calibration-blind-1/$file"
          done

      - name: Validate evidence-only blind boundary and fail-closed invariants
        run: |
          node scripts/kidults/source-intelligence/validate-track-b-calibration-readiness-v2-blind.mjs artifacts/agci-os/track-b-calibration-readiness-v2-blind

      - name: Revalidate canonical governance
        run: |
          node scripts/kidults/architecture/validate-agci-os-registry-v2.mjs
          node scripts/kidults/registry/validate-operational-registry.mjs
          node scripts/kidults/mission-control/validate-mission-control.mjs

      - name: Upload blindness-hardened review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidults-track-b-calibration-readiness-v2-blind
          path: artifacts/agci-os/track-b-calibration-readiness-v2-blind
          if-no-files-found: error
          retention-days: 30
