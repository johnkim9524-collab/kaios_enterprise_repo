name: KIDULTS Exact Pair Arrival Orchestrator

on:
  pull_request:
    paths:
      - 'coordination/kidults/integration/exact-pair-arrival-orchestrator-v1.json'
      - 'coordination/kidults/schemas/live-rankability-assessment-envelope-v1.schema.json'
      - 'scripts/kidults/integration/evaluate-exact-pair-arrival-v1.py'
      - 'scripts/kidults/integration/build-live-chain-audit-v1.py'
      - 'scripts/kidults/integration/validate-live-assessment-audit-hardening-v1.py'
      - '.github/workflows/kidults-exact-pair-arrival-orchestrator.yml'
      - '**/snapshot-candidate.json'
      - '**/evidence-package.json'
      - '**/rankability-assessment.json'
      - '**/live-rankability-assessment-envelope.json'
      - '**/staging-replay-receipt.json'
      - '**/projection-admission-receipt.json'
      - 'coordination/kidults/integration/live-arrival/live-admission-manifest.json'
  push:
    branches: [main]
    paths:
      - '**/snapshot-candidate.json'
      - '**/evidence-package.json'
      - '**/rankability-assessment.json'
      - '**/live-rankability-assessment-envelope.json'
      - '**/staging-replay-receipt.json'
      - '**/projection-admission-receipt.json'
      - 'coordination/kidults/integration/live-arrival/live-admission-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate live Track B envelope and audit hardening
        run: python scripts/kidults/integration/validate-live-assessment-audit-hardening-v1.py
      - name: Evaluate exact live chain
        run: python scripts/kidults/integration/evaluate-exact-pair-arrival-v1.py artifacts/exact-pair-arrival/arrival-state.json
      - name: Build deterministic Unified Audit chain receipt
        run: python scripts/kidults/integration/build-live-chain-audit-v1.py artifacts/exact-pair-arrival/arrival-state.json artifacts/exact-pair-arrival/audit-chain.json
      - name: Assert current truth and release boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('artifacts/exact-pair-arrival/arrival-state.json'))
          a=json.load(open('artifacts/exact-pair-arrival/audit-chain.json'))
          assert p['result']=='PASS'
          if not Path('coordination/kidults/integration/live-arrival/live-admission-manifest.json').exists():
              assert p['state']=='WAITING_PAIR'
              assert p['track_b']=='NOT_STARTED'
              assert p['final_business_workload']=='NOT_RUN'
              assert p['live_projection']=='NONE'
          assert p['production']=='HOLD'
          assert p['public_intelligence']=='HOLD'
          assert a['production']=='HOLD'
          assert a['public_intelligence']=='HOLD'
          assert a['raw_provider_payloads'] is False
          assert a['credentials'] is False
          assert a['secrets'] is False
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: kidults-exact-pair-arrival-state
          path: artifacts/exact-pair-arrival
          retention-days: 30
