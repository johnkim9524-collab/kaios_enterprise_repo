services:
  kaios:
    build:
      context: .
      dockerfile: Dockerfile
    image: kaios-enterprise:local
    container_name: kaios-enterprise
    restart: unless-stopped
    init: true
    environment:
      KAIOS_GATEWAY_HOST: ${KAIOS_GATEWAY_HOST:-0.0.0.0}
      KAIOS_GATEWAY_PORT: ${KAIOS_GATEWAY_PORT:-8787}
      KAIOS_RUNTIME_MODE: ${KAIOS_RUNTIME_MODE:-fixture}
      KAIOS_ENVIRONMENT: ${KAIOS_ENVIRONMENT:-production}
      KAIOS_LOG_LEVEL: ${KAIOS_LOG_LEVEL:-INFO}
      KAIOS_SHUTDOWN_TIMEOUT_SECONDS: ${KAIOS_SHUTDOWN_TIMEOUT_SECONDS:-10}
    ports:
      - "${KAIOS_GATEWAY_PORT:-8787}:8787"
    healthcheck:
      test:
        - CMD
        - python
        - deploy/healthcheck.py
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - kaios-runtime-data:/app/data
      - kaios-public-data:/app/public/api
    stop_grace_period: 15s

volumes:
  kaios-runtime-data:
  kaios-public-data: