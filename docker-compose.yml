services:
  kaios:
    build:
      context: .
      dockerfile: Dockerfile

    image: kaios-enterprise:local
    container_name: kaios-enterprise

    restart: unless-stopped
    init: true

    environment:
      KAIOS_GATEWAY_HOST: ${KAIOS_GATEWAY_HOST:-0.0.0.0}
      KAIOS_GATEWAY_PORT: ${KAIOS_GATEWAY_PORT:-8787}
      KAIOS_RUNTIME_MODE: ${KAIOS_RUNTIME_MODE:-fixture}
      KAIOS_TRIGGER_TYPE: ${KAIOS_TRIGGER_TYPE:-manual}
      KAIOS_ENVIRONMENT: ${KAIOS_ENVIRONMENT:-production}
      KAIOS_LOG_LEVEL: ${KAIOS_LOG_LEVEL:-INFO}
      KAIOS_SHUTDOWN_TIMEOUT_SECONDS: ${KAIOS_SHUTDOWN_TIMEOUT_SECONDS:-10}
      KAIOS_DATABASE_PATH: ${KAIOS_DATABASE_PATH:-/app/data/kaios.db}
      KAIOS_API_SECRET_FILE: ${KAIOS_API_SECRET_FILE:-/run/secrets/kaios_api_secret}

      KAIOS_AUTH_ENABLED: ${KAIOS_AUTH_ENABLED:-true}
      KAIOS_VIEWER_TOKEN_FILE: ${KAIOS_VIEWER_TOKEN_FILE:-/run/secrets/kaios_viewer_token}
      KAIOS_OPERATOR_TOKEN_FILE: ${KAIOS_OPERATOR_TOKEN_FILE:-/run/secrets/kaios_operator_token}
      KAIOS_ADMIN_TOKEN_FILE: ${KAIOS_ADMIN_TOKEN_FILE:-/run/secrets/kaios_admin_token}
      KAIOS_RATE_LIMIT_REQUESTS: ${KAIOS_RATE_LIMIT_REQUESTS:-120}
      KAIOS_RATE_LIMIT_WINDOW_SECONDS: ${KAIOS_RATE_LIMIT_WINDOW_SECONDS:-60}
      KAIOS_SECURITY_AUDIT_PATH: ${KAIOS_SECURITY_AUDIT_PATH:-/app/data/security-audit.jsonl}

      KAIOS_LIVE_RSS_URL: ${KAIOS_LIVE_RSS_URL:-}
      KAIOS_LIVE_HTTP_TIMEOUT_SECONDS: ${KAIOS_LIVE_HTTP_TIMEOUT_SECONDS:-10}
      KAIOS_LIVE_RETRY_DELAY_SECONDS: ${KAIOS_LIVE_RETRY_DELAY_SECONDS:-0}

      KAIOS_SCHEDULER_ENABLED: ${KAIOS_SCHEDULER_ENABLED:-false}
      KAIOS_SCHEDULER_INTERVAL_SECONDS: ${KAIOS_SCHEDULER_INTERVAL_SECONDS:-3600}
      KAIOS_SCHEDULER_LOCK_TTL_SECONDS: ${KAIOS_SCHEDULER_LOCK_TTL_SECONDS:-3600}
      KAIOS_SCHEDULER_HEARTBEAT_SECONDS: ${KAIOS_SCHEDULER_HEARTBEAT_SECONDS:-30}
      KAIOS_SCHEDULER_RUNTIME_MODE: ${KAIOS_SCHEDULER_RUNTIME_MODE:-fixture}
      KAIOS_SCHEDULER_ID: ${KAIOS_SCHEDULER_ID:-kaios-primary}

    secrets:
      - source: kaios_api_secret
        target: kaios_api_secret
      - source: kaios_viewer_token
        target: kaios_viewer_token
      - source: kaios_operator_token
        target: kaios_operator_token
      - source: kaios_admin_token
        target: kaios_admin_token

    ports:
      - "${KAIOS_GATEWAY_PORT:-8787}:8787"

    healthcheck:
      test:
        - CMD
        - python
        - deploy/healthcheck.py
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true

    read_only: false

    tmpfs:
      - /tmp:size=64m,mode=1777

    volumes:
      - kaios-runtime-data:/app/data

    stop_grace_period: 15s

  kaios-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    image: kaios-enterprise:local
    container_name: kaios-scheduler

    command:
      - python
      - -m
      - scripts.run_scheduler

    profiles:
      - scheduler

    restart: unless-stopped
    init: true

    depends_on:
      kaios:
        condition: service_healthy

    environment:
      KAIOS_ENVIRONMENT: ${KAIOS_ENVIRONMENT:-production}
      KAIOS_LOG_LEVEL: ${KAIOS_LOG_LEVEL:-INFO}
      KAIOS_DATABASE_PATH: ${KAIOS_DATABASE_PATH:-/app/data/kaios.db}
      KAIOS_API_SECRET_FILE: ${KAIOS_API_SECRET_FILE:-/run/secrets/kaios_api_secret}

      KAIOS_RUNTIME_MODE: ${KAIOS_RUNTIME_MODE:-fixture}
      KAIOS_LIVE_RSS_URL: ${KAIOS_LIVE_RSS_URL:-}
      KAIOS_LIVE_HTTP_TIMEOUT_SECONDS: ${KAIOS_LIVE_HTTP_TIMEOUT_SECONDS:-10}
      KAIOS_LIVE_RETRY_DELAY_SECONDS: ${KAIOS_LIVE_RETRY_DELAY_SECONDS:-0}

      KAIOS_SCHEDULER_ENABLED: ${KAIOS_SCHEDULER_ENABLED:-true}
      KAIOS_SCHEDULER_INTERVAL_SECONDS: ${KAIOS_SCHEDULER_INTERVAL_SECONDS:-3600}
      KAIOS_SCHEDULER_LOCK_TTL_SECONDS: ${KAIOS_SCHEDULER_LOCK_TTL_SECONDS:-3600}
      KAIOS_SCHEDULER_HEARTBEAT_SECONDS: ${KAIOS_SCHEDULER_HEARTBEAT_SECONDS:-30}
      KAIOS_SCHEDULER_RUNTIME_MODE: ${KAIOS_SCHEDULER_RUNTIME_MODE:-fixture}
      KAIOS_SCHEDULER_ID: ${KAIOS_SCHEDULER_ID:-kaios-primary}

    secrets:
      - source: kaios_api_secret
        target: kaios_api_secret

    security_opt:
      - no-new-privileges:true

    read_only: false

    tmpfs:
      - /tmp:size=64m,mode=1777

    volumes:
      - kaios-runtime-data:/app/data

    stop_grace_period: 15s

secrets:
  kaios_api_secret:
    file: ./secrets/kaios_api_secret
  kaios_viewer_token:
    file: ./secrets/kaios_viewer_token
  kaios_operator_token:
    file: ./secrets/kaios_operator_token
  kaios_admin_token:
    file: ./secrets/kaios_admin_token

volumes:
  kaios-runtime-data: