<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">KIDULTS original deep green racing roadster</title>
  <desc id="desc">A deep green racing roadster on one neutral warm limestone surface.</desc>
  <defs>
    <filter id="limestoneBlend" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#f4f2ee" result="limestone"/>
      <feBlend in="SourceGraphic" in2="limestone" mode="multiply"/>
    </filter>
    <linearGradient id="rightFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f2ee" stop-opacity="0"/>
      <stop offset=".64" stop-color="#f4f2ee" stop-opacity=".4"/>
      <stop offset="1" stop-color="#f4f2ee" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4f2ee" stop-opacity=".88"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#f4f2ee"/>
  <image href="racing-roadster-v662.webp?v=662-visual95-final" width="1600" height="900" preserveAspectRatio="xMidYMid meet" filter="url(#limestoneBlend)"/>
  <rect x="1460" width="140" height="900" fill="url(#rightFade)"/>
  <rect y="810" width="1600" height="90" fill="url(#bottomFade)"/>
</svg>
