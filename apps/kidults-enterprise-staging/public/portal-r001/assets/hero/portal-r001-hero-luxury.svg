<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Curated luxury collectibles gallery</title>
<desc id="desc">An editorial still life suggesting a racing roadster, watch, handbag, camera and collectible memorabilia in a warm stone gallery.</desc>
<defs>
